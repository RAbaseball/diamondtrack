// Auto-refresh fetch - retries once if JWT expired
const fetchWithRefresh=async(url,opts={})=>{
  let r=await fetch(url,opts);
  if(r.status===401){
    const refreshed=await sb.auth.refreshToken();
    if(refreshed){
      // Update auth header with new token
      const newOpts={...opts,headers:{...opts.headers,"Authorization":`Bearer ${_tok}`}};
      r=await fetch(url,newOpts);
    } else {
      // Can't refresh - clear session and reload page
      try{localStorage.removeItem("dt");}catch(e){}
      alert("Your session expired. Please sign in again.");
      window.location.reload();
      return r;
    }
  }
  return r;
};

function ResetPasswordScreen({onDone}){
  const[pass,setPass]=useState("");
  const[pass2,setPass2]=useState("");
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");
  const[done,setDone]=useState(false);

  const submit=async()=>{
    if(!pass||pass.length<6){setErr("Password must be at least 6 characters.");return;}
    if(pass!==pass2){setErr("Passwords do not match.");return;}
    setLoading(true);setErr("");
    const r=await fetch(`${SURL}/auth/v1/user`,{
      method:"PUT",
      headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`},
      body:JSON.stringify({password:pass})
    });
    const d=await r.json();
    setLoading(false);
    if(!r.ok){setErr("Error: "+(d.message||JSON.stringify(d)));return;}
    setDone(true);
    setTimeout(()=>onDone(),2500);
  };

  if(done)return(
    <div className="auth-wrap"><div className="auth-card" style={{textAlign:"center"}}>
      <div style={{fontSize:44,marginBottom:10}}>✅</div>
      <div style={{fontSize:18,fontWeight:800,marginBottom:8,color:"#27c97a"}}>Password Updated!</div>
      <div style={{fontSize:12,color:"#6b82a0"}}>Taking you to sign in...</div>
    </div></div>
  );

  return(
    <div className="auth-wrap"><div className="auth-card">
      <div className="alogo">
        <div style={{fontSize:34,marginBottom:5}}>🔑</div>
        <div className="at">New <em>Password</em></div>
        <div className="asub">Choose a new password for your account</div>
      </div>
      {err&&<div className="err2">{err}</div>}
      <div className="fg"><label>New Password</label><input className="inp" type="password" placeholder="At least 6 characters" value={pass} onChange={e=>setPass(e.target.value)}/></div>
      <div className="fg"><label>Confirm Password</label><input className="inp" type="password" placeholder="Same password again" value={pass2} onChange={e=>setPass2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
      <button className="bmain" onClick={submit} disabled={loading||!pass||!pass2}>{loading?"Saving...":"Set New Password"}</button>
    </div></div>
  );
}

function AuthScreen({onAuth}){
  const[isUp,setIsUp]=useState(false);
  const[forgotPw,setForgotPw]=useState(false);
  const[resetSent,setResetSent]=useState(false);
  const[role,setRole]=useState("coach");
  const[name,setName]=useState("");
  const[email,setEmail]=useState("");
  const[pass,setPass]=useState("");
  const[pos,setPos]=useState("Pitcher");
  const[grad,setGrad]=useState(2027);
  const[ageGroup,setAgeGroup]=useState("");
  const[useAgeGroup,setUseAgeGroup]=useState(false);
  const[otherPos,setOtherPos]=useState("");
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");
  const[logs,setLogs]=useState([]);
  const[checkEmail,setCheckEmail]=useState(false);
  const log=(m)=>setLogs(p=>[...p,m]);

  const sendReset=async()=>{
    if(!email){setErr("Enter your email first.");return;}
    setLoading(true);setErr("");
    const r=await fetch(`${SURL}/auth/v1/recover`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY},body:JSON.stringify({email})});
    setLoading(false);
    if(r.ok){setResetSent(true);}
    else{const d=await r.json().catch(()=>({}));setErr("Error: "+(d.message||JSON.stringify(d)));}
  };

  const submit=async()=>{
    setErr("");setLoading(true);setLogs([]);
    try{
      if(isUp){
        const nameParts=(name||"").trim().split(" ").filter(Boolean);
        if(role!=="coach"&&nameParts.length<2){setErr("Please enter your first and last name.");setLoading(false);return;}
        if(!email||!pass){setErr("Email and password are required.");setLoading(false);return;}
        log("Creating account...");
        const{data,error:e}=await sb.auth.signUp(email,pass);
        log("Auth: "+JSON.stringify({id:data?.user?.id,sess:!!data?.session,err:e?.message}));
        if(e)throw new Error("Signup failed: "+(e.message||e.error_description||JSON.stringify(e)));
        if(!data?.user)throw new Error("No user returned — check URL/key");
        log("Saving profile...");
        const pd={id:data.user.id,email,name:(name||email.split("@")[0]).trim(),role,position:role==="athlete"?pos:null,other_positions:role==="athlete"&&otherPos?otherPos:null,grad:role==="athlete"&&!useAgeGroup?parseInt(grad):null,age_group:role==="athlete"&&useAgeGroup?ageGroup:null,avatar:ini((name||email).trim()),measurables:{}};
        const{error:pe}=await sb.from("profiles").insert(pd);
        log("Profile: "+(pe?JSON.stringify(pe):"ok"));
        if(pe){
          const msg=pe.message||pe.hint||pe.code||JSON.stringify(pe);
          if(msg.includes("relation")||msg.includes("does not exist")||pe.code==="42P01")throw new Error("❌ Run diamondtrack_schema.sql in Supabase SQL Editor first");
          if(pe.code==="23505")throw new Error("Email already registered — try Sign In");
          throw new Error("Profile error: "+msg);
        }
        if(!data.session)setCheckEmail(true);
        else onAuth(pd);
      }else{
        log("Signing in...");
        const{data,error:e}=await sb.auth.signIn(email,pass);
        log("Auth: "+JSON.stringify({id:data?.user?.id,err:e?.message}));
        if(e)throw new Error("Sign in failed: "+(e.message||e.error_description||JSON.stringify(e)));
        log("Loading profile...");
        const{data:prof,error:pe}=await sb.from("profiles").select("*").eq("id",data.user.id).maybeSingle();
        log("Profile: "+(prof?"found":"not found — "+JSON.stringify(pe)));
        if(!prof)throw new Error("Profile not found — run SQL schema in Supabase first");
        onAuth(prof);
      }
    }catch(e){setErr(e.message);}
    setLoading(false);
  };

  if(resetSent)return(
    <div className="auth-wrap"><div className="auth-card" style={{textAlign:"center"}}>
      <div style={{fontSize:44,marginBottom:10}}>📧</div>
      <div style={{fontSize:18,fontWeight:800,marginBottom:8}}>Check your email</div>
      <div style={{fontSize:12,color:"#6b82a0",lineHeight:1.7}}>We sent a password reset link to<br/><strong style={{color:"#eef2f8"}}>{email}</strong><br/>Click it to set a new password.</div>
      <button className="bmain" style={{marginTop:14}} onClick={()=>{setResetSent(false);setForgotPw(false);}}>Back to Sign In</button>
    </div></div>
  );

  if(forgotPw)return(
    <div className="auth-wrap"><div className="auth-card">
      <div className="alogo">
        <div style={{fontSize:34,marginBottom:5}}>🔑</div>
        <div className="at">Reset <em>Password</em></div>
        <div className="asub">Enter your email and we will send a reset link</div>
      </div>
      {err&&<div className="err2">{err}</div>}
      <div className="fg"><label>Email</label><input className="inp" type="email" placeholder="you@email.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendReset()}/></div>
      <button className="bmain" onClick={sendReset} disabled={loading||!email}>{loading?"Sending...":"Send Reset Link"}</button>
      <div className="tl" style={{marginTop:12}}><button onClick={()=>{setForgotPw(false);setErr("");}}>← Back to Sign In</button></div>
    </div></div>
  );

  if(checkEmail)return(
    <div className="auth-wrap"><div className="auth-card" style={{textAlign:"center"}}>
      <div style={{fontSize:44,marginBottom:10}}>📧</div>
      <div style={{fontSize:18,fontWeight:800,marginBottom:8}}>Check your email</div>
      <div style={{fontSize:12,color:"#6b82a0",lineHeight:1.6}}>Confirmation sent to <strong style={{color:"#eef2f8"}}>{email}</strong>.<br/>Click it then come back to Sign In.</div>
      <button className="bmain" style={{marginTop:14}} onClick={()=>{setCheckEmail(false);setIsUp(false);}}>Back to Sign In</button>
    </div></div>
  );

  return(
    <div className="auth-wrap"><div className="auth-card">
      <div className="alogo">
        <div style={{fontSize:34,marginBottom:5}}>⚾</div>
        <div className="at">Diamond<em>Track</em></div>
        <div className="asub">{isUp?"Create account":"Sign in"}</div>
      </div>
      {isUp&&<>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:".4px",color:"#6b82a0",marginBottom:6}}>I am a...</div>
          <div className="rp">
            {[["coach","🎓","Coach"],["athlete","⚾","Athlete"],["admin","🛡️","Admin"]].map(([r,ic,lb])=>(
              <div key={r} className={`rb ${role===r?"on":""}`} onClick={()=>setRole(r)}>
                <div className="ri2">{ic}</div><div className="rl">{lb}</div>
              </div>
            ))}
          </div>
        </div>
        <div className="fg2">
          <div className="fg"><label>First Name *</label><input className="inp" placeholder="First" value={name.split(" ")[0]||""} onChange={e=>setName(e.target.value.trim()+" "+(name.split(" ").slice(1).join(" ")))}/></div>
          <div className="fg"><label>Last Name *</label><input className="inp" placeholder="Last" value={name.split(" ").slice(1).join(" ")} onChange={e=>setName((name.split(" ")[0]||"")+" "+e.target.value)}/></div>
        </div>
        {role==="athlete"&&<>
          <div className="fg2">
            <div className="fg"><label>Primary Position</label><select className="inp" value={pos} onChange={e=>setPos(e.target.value)}>{ALL_POS.map(p=><option key={p}>{p}</option>)}</select></div>
            <div className="fg"><label>Other Positions</label><input className="inp" placeholder="e.g. 1B, OF" value={otherPos} onChange={e=>setOtherPos(e.target.value)}/></div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
            <button onClick={()=>setUseAgeGroup(false)} style={{flex:1,padding:"7px",borderRadius:7,border:`1px solid ${!useAgeGroup?"#e8a020":"rgba(255,255,255,.12)"}`,background:!useAgeGroup?"rgba(232,160,32,.08)":"transparent",color:!useAgeGroup?"#e8a020":"#8fa3be",fontSize:11,fontWeight:700,cursor:"pointer"}}>Grad Year</button>
            <button onClick={()=>setUseAgeGroup(true)} style={{flex:1,padding:"7px",borderRadius:7,border:`1px solid ${useAgeGroup?"#e8a020":"rgba(255,255,255,.12)"}`,background:useAgeGroup?"rgba(232,160,32,.08)":"transparent",color:useAgeGroup?"#e8a020":"#8fa3be",fontSize:11,fontWeight:700,cursor:"pointer"}}>Age Group</button>
          </div>
          {!useAgeGroup?<div className="fg"><label>Grad Year</label><select className="inp" value={grad} onChange={e=>setGrad(e.target.value)}>{GRAD_YEARS.map(y=><option key={y}>{y}</option>)}</select></div>:<div className="fg"><label>Age Group</label><select className="inp" value={ageGroup} onChange={e=>setAgeGroup(e.target.value)}><option value="">Select...</option>{AGE_GROUPS.map(g=><option key={g}>{g}</option>)}</select></div>}
        </>}
      </>}
      {err&&<div className="err2">{err}</div>}
      {logs.length>0&&<div className="dbgp">{logs.map((l,i)=><div key={i}>{l}</div>)}</div>}
      <div className="fg"><label>Email</label><input className="inp" type="email" placeholder="you@email.com" value={email} onChange={e=>setEmail(e.target.value)}/></div>
      <div className="fg"><label>Password</label><input className="inp" type="password" placeholder="••••••••" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
      <button className="bmain" onClick={submit} disabled={loading}>{loading?"Loading...":isUp?"Create Account":"Sign In"}</button>
      <div className="tl">{isUp?"Already have an account?":"Need an account?"} <button onClick={()=>{setIsUp(!isUp);setErr("");setLogs([]);}}>{isUp?"Sign In":"Sign Up"}</button></div>
      {!isUp&&<div className="tl" style={{marginTop:6}}><button onClick={()=>{setForgotPw(true);setErr("");setLogs([]);}}>Forgot password?</button></div>}
    </div></div>
  );
}

  const loadAll=async()=>{

    const fetchJSON=fetchData;

      ?`profiles?role=eq.athlete&coach_id=eq.${profile.id}&select=*&limit=5000`

    // Coaches only see programs they created; admin sees all

    if(Array.isArray(notifData))setNotifs(notifData);
    if(Array.isArray(coachData))setCoaches(coachData);
    // Load self_logs for all athletes (coach view)
    if(profile.role==="coach"||profile.role==="admin"){
      const slAll=await fetchData("self_logs?order=created_at.desc&limit=10000");
      if(Array.isArray(slAll))setSelfLogs(slAll);
    }
    if(profile.role==="athlete"){
      const[logData,sessData,slData,mhData,athProgData]=await Promise.all([
        fetchData(`workout_logs?athlete_id=eq.${profile.id}&select=*&limit=5000`),
        fetchData(`workout_sessions?athlete_id=eq.${profile.id}&select=*&limit=5000`),
        fetchData(`self_logs?athlete_id=eq.${profile.id}&order=created_at.desc&limit=5000`),
        fetchData(`measurable_history?athlete_id=eq.${profile.id}&order=recorded_at.asc&limit=5000`),
        fetchData(`programs?select=*&limit=1000`),
      ]);
      // Load programs for athlete too
      if(Array.isArray(athProgData))setPrograms(athProgData.map(p=>({...p,days:p.days||[],targetGrads:p.target_grads||[],targetGroups:p.target_groups||[],targetAgeGroups:p.target_age_groups||[],athleteId:p.athlete_id,isGroup:p.is_group_program})));
      const lm={};if(Array.isArray(logData))logData.forEach(l=>{lm[`${l.program_id}-${l.athlete_id}-${l.exercise_id}`]=l;});setLogs(lm);
      const sm={};if(Array.isArray(sessData))sessData.forEach(s=>{sm[`${s.program_id}-${s.athlete_id}`]=s;});setSessions(sm);
      if(Array.isArray(slData))setSelfLogs(slData.map(l=>({...l,metrics:l.metrics||{},exercises:l.exercises||[]})));
      if(Array.isArray(mhData))setMeasHist({[profile.id]:mhData});
    }else{
      const[logAll,sessAll,mhAll]=await Promise.all([
        fetchJSON("workout_logs?select=*&limit=10000"),
        fetchJSON("workout_sessions?select=*&limit=10000"),
        fetchJSON("measurable_history?order=recorded_at.asc&limit=10000"),

      const lm={};if(Array.isArray(logAll))logAll.forEach(l=>{lm[`${l.program_id}-${l.athlete_id}-${l.exercise_id}`]=l;});setLogs(lm);
      const sm={};if(Array.isArray(sessAll))sessAll.forEach(s=>{sm[`${s.program_id}-${s.athlete_id}`]=s;});setSessions(sm);
      const mm={};if(Array.isArray(mhAll))mhAll.forEach(m=>{if(!mm[m.athlete_id])mm[m.athlete_id]=[];mm[m.athlete_id].push(m);});setMeasHist(mm);

  const getLog=(pId,exId)=>logs[`${pId}-${profile?.id}-${exId}`]||{};
  const isSaved=(pId,exId,aid)=>!!(logs[`${pId}-${aid||profile?.id}-${exId}`]?.saved);
  const calcPct=(prog,aid)=>{if(!prog)return 0;const all=(prog.days||[]).flatMap(d=>d.exercises||[]);if(!all.length)return 0;return Math.round(all.filter(ex=>isSaved(prog.id,ex.id,aid||profile?.id)).length/all.length*100);};
  const getSess=(pId,aid)=>sessions[`${pId}-${aid||profile?.id}`]||{};

  const saveEx=async(pId,exId,field,val,markSaved=false)=>{
    // Don't re-save if already saved
    if(markSaved&&logs[`${pId}-${profile.id}-${exId}`]?.saved)return;
    const now=new Date().toISOString();
    const data={program_id:pId,athlete_id:profile.id,exercise_id:exId,[field]:val};
    if(markSaved){data.saved=true;data.saved_at=now;}
    const sk=`${pId}-${profile.id}`;
    // Start session if not started
    if(!sessions[sk]?.started_at){
      await fetchWithRefresh(`${SURL}/rest/v1/workout_sessions`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({program_id:pId,athlete_id:profile.id,started_at:now})});
      setSessions(p=>({...p,[sk]:{...p[sk],started_at:now,program_id:pId,athlete_id:profile.id}}));
    }
    // Save exercise log
    await fetchWithRefresh(`${SURL}/rest/v1/workout_logs`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"resolution=merge-duplicates"},body:JSON.stringify(data)});
    setLogs(p=>({...p,[`${pId}-${profile.id}-${exId}`]:{...(p[`${pId}-${profile.id}-${exId}`]||{}),...data}}));
  };

  const markComplete=async(pId)=>{
    const sk=`${pId}-${profile.id}`;const sess=sessions[sk]||{};
    if(sess.completed_at)return;
    const now=new Date().toISOString();
    const dur=sess.started_at?Math.round((Date.now()-new Date(sess.started_at))/60000):null;
    // Save session completion using raw fetch for reliability
    const scr=await fetchWithRefresh(`${SURL}/rest/v1/workout_sessions`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"resolution=merge-duplicates"},body:JSON.stringify({program_id:pId,athlete_id:profile.id,completed_at:now,duration_minutes:dur})});
    if(!scr.ok){const t=await scr.text();console.error("Session complete error:",t);}
    setSessions(p=>({...p,[sk]:{...p[sk],completed_at:now,duration_minutes:dur}}));
    // Reload sessions from DB to confirm persisted
    const sr=await fetch(`${SURL}/rest/v1/workout_sessions?athlete_id=eq.${profile.id}&select=*`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    if(sr.ok){const sdata=await sr.json().catch(()=>[]);if(Array.isArray(sdata)){const sm={};sdata.forEach(s=>{sm[`${s.program_id}-${s.athlete_id}`]=s;});setSessions(sm);}}
    // Log to journal
    const prog=programs.find(p=>p.id===pId);
    const allEx=(prog?.days||[]).flatMap(d=>d.exercises||[]);
    const doneEx=allEx.filter(ex=>isSaved(pId,ex.id));
    const journalEntry={
      type:"Workout",
      metrics:{
        program:prog?.name||"",
        exercises:String(doneEx.length),
        duration:dur?String(dur):"",
        week:prog?.week||""
      },
      notes:`Completed: ${prog?.name||"workout"}${dur?" in "+Math.floor(dur/60)+"h "+dur%60+"m":""}.
${doneEx.map(e=>e.name).join(", ")}`,
      date_label:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})
    };
    const jr=await fetch(`${SURL}/rest/v1/self_logs`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify([{athlete_id:profile.id,...journalEntry}])});
    if(jr.ok){
      const newEntry=await jr.json().catch(()=>null);
      if(newEntry&&newEntry[0]){
        setSelfLogs(p=>[{...newEntry[0],metrics:newEntry[0].metrics||{},exercises:[]}, ...p]);
      }
    }
    // Notify all coaches
    const{data:coaches}=await sb.from("profiles").select("id").eq("role","coach");
    if(coaches?.length){
      const notifRows=coaches.map(co=>({
        recipient_id:co.id,
        type:"completed",
        athlete_id:profile.id,
        athlete_name:profile.name||profile.email,
        program_name:prog?.name||"",
        duration_minutes:dur,
        read:false
      }));
      const{error:ne}=await sb.from("notifications").insert(notifRows);
      if(ne)console.error("Notification error:",ne);
    }
  };

  const saveAthlete=async(ath)=>{
    const row={email:ath.email||`athlete_${Date.now()}@diamondtrack.local`,name:ath.name,role:"athlete",position:ath.position,other_positions:ath.other_positions||null,grad:ath.grad||null,age_group:ath.age_group||null,gpa:ath.gpa||null,high_school:ath.high_school||null,dream_school:ath.dreamSchool||ath.dream_school||null,height:ath.height||null,weight:ath.weight||null,bats:ath.bats||null,throws:ath.throws||null,committed:ath.committed||false,avatar:ini(ath.name),measurables:ath.measurables||{},coach_id:ath.coach_id||profile.id};
    if(ath.id){
      console.log("Saving athlete profile:",ath.id,JSON.stringify(row));
      const r=await fetchWithRefresh(`${SURL}/rest/v1/profiles?id=eq.${ath.id}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify(row)});
      const rtext=await r.text();
      console.log("profile update response:",r.status,rtext);
      if(!r.ok){alert("Profile save failed ("+r.status+"):\n"+rtext);return null;}
      const r2=await fetch(`${SURL}/rest/v1/profiles?id=eq.${ath.id}&select=*`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Accept":"application/vnd.pgrst.object+json"}});
      const fresh=await r2.json().catch(()=>null);
      if(fresh&&fresh.id){setAthletes(p=>p.map(a=>a.id===fresh.id?fresh:a));}
      return fresh||{...ath,...row};
    }else{
      // Sign up athlete with a temporary password so they exist in auth.users
      const tempPw="DiamondTrack_"+Math.random().toString(36).slice(2,10)+"!";
      const email=ath.email||`athlete_${Date.now()}@diamondtrack.local`;
      const r=await fetch(`${SURL}/auth/v1/signup`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY},body:JSON.stringify({email,password:tempPw})});
      const authData=await r.json();
      if(!r.ok){
        // If already exists, try to find their profile
        const{data:existing}=await sb.from("profiles").select("*").eq("email",email).maybeSingle();
        if(existing){setAthletes(p=>[...p,existing]);return;}
        alert("Could not create athlete account: "+(authData.message||authData.msg||JSON.stringify(authData)));
        return;
      }
      const uid=authData.user?.id||authData.id;
      if(!uid){alert("No user ID returned from Supabase");return;}
      const{data,error:pe}=await sb.from("profiles").insert({...row,email,id:uid}).select().single();
      if(pe){const msg=pe.message||pe.hint||pe.code||JSON.stringify(pe);if(msg.includes("age_group")||msg.includes("column")){alert("Missing DB column - run in Supabase SQL Editor: ALTER TABLE profiles ADD COLUMN IF NOT EXISTS age_group text;");}else{alert("Save error: "+msg);}return;}
      if(data)setAthletes(p=>[...p,data]);
      // Also reload full list from server to catch any RLS-filtered results
      sb.from("profiles").select("*").eq("role","athlete").then(({data:all})=>{if(all&&all.length>0)setAthletes(all);});
      alert("\u2705 "+ath.name+" added!\n\nLogin: https://rabaseball.github.io/diamondtrack\nEmail: "+email+"\nTemp password: "+tempPw+"\n\nShare these credentials with the athlete.");
    }
  };

  const saveMeas=async(athId,entry)=>{
    const filtered=Object.fromEntries(Object.entries(entry).filter(([k,v])=>v!==null&&v!==""));
    if(!Object.keys(filtered).length){alert("Enter at least one value first.");return false;}
    const now=new Date().toISOString();
    const payload={athlete_id:athId,...filtered,recorded_by:profile.id,recorded_at:now,date_label:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})};
    console.log("saveMeas payload:",JSON.stringify(payload));

    const rtext=await r.text();
    console.log("saveMeas response:",r.status,rtext);
    if(!r.ok){alert("Measurable save failed ("+r.status+"):\n"+rtext);return false;}
    const merged={...(athletes.find(a=>a.id===athId)?.measurables||{}),...filtered};

    if(!r2.ok){alert("Profile measurables update failed ("+r2.status+"):\n"+r2text);return false;}
    setAthletes(p=>p.map(a=>a.id===athId?{...a,measurables:merged}:a));
    const r3=await fetch(`${SURL}/rest/v1/measurable_history?athlete_id=eq.${athId}&order=recorded_at.asc`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    const hist=await r3.json().catch(()=>[]);

  const logout=async()=>{await sb.auth.signOut();setProfile(null);};
  const unreadN=notifs.filter(n=>!n.read).length;

  const athProgs=useMemo(()=>{
    if(!isAthlete||!profile)return[];
    return programs.filter(p=>{
      if(p.athleteId===profile.id)return true;
      if(!p.isGroup)return false;
      const g=getPG(profile.position);
      const athleteGrad=parseInt(profile.grad);
      // targetGrads could be null, empty array, or array of numbers/strings
      const tg=p.targetGrads||p.target_grads||[];
      const tt=p.targetGroups||p.target_groups||[];
      const ta=p.targetAgeGroups||p.target_age_groups||[];
      const gradStr=String(profile.grad);
      const gradMatch=!tg.length||tg.some(yr=>String(yr)===gradStr);
      const ageMatch=!ta.length||ta.includes(profile.age_group);
      const groupMatch=!tt.length||tt.includes(g);
      console.log("Program match:",p.name,"tg:",JSON.stringify(tg),"grad:",gradStr,"gm:",gradMatch,"g:",g,"gpm:",groupMatch);
      return((tg.length||ta.length)?(gradMatch||ageMatch):true)&&groupMatch;
    });

  const filtAthletes=useMemo(()=>{
    let l=athletes;
    if(gradF){
      // gradF could be a number (grad year) or string (age group like "10U")
      const isNum=typeof gradF==="number"||!isNaN(Number(gradF));
      if(isNum)l=l.filter(a=>a.grad===Number(gradF));
      else l=l.filter(a=>a.age_group===gradF);
    }
    if(groupF)l=l.filter(a=>getPG(a.position)===groupF);
    return l;
  },[athletes,gradF,groupF]);

    if(viewProg&&coachPage==="programs")return<ProgDetail prog={viewProg} athletes={athletes} logs={logs} sessions={sessions} calcPct={calcPct} isSaved={isSaved} getSess={getSess} onBack={()=>setViewProg(null)} onClickAth={a=>{setViewAth(a);setCoachPage("athletes");}} onUpdate={updateProgram} onCopy={copyProgram} onDelete={deleteProgram}/>;
    switch(coachPage){
      case"dashboard":return<Dashboard athletes={athletes} programs={programs} calcPct={calcPct} setCoachPage={setCoachPage} setViewAth={setViewAth} isAdmin={isAdmin}/>;
      case"athletes":return<AthRoster athletes={filtAthletes} allAthletes={athletes} programs={programs} calcPct={calcPct} gradF={gradF} setGradF={setGradF} groupF={groupF} setGroupF={setGroupF} onView={a=>setViewAth(a)} onAdd={()=>setModal("addAth")}/>;
      case"programs":return<ProgsPage athletes={athletes} programs={programs} calcPct={calcPct} onView={setViewProg} onAdd={()=>setModal("addProg")} onAddGroup={()=>setModal("addGroup")}/>;
      case"groups":return<GroupsPage athletes={athletes} onClickAth={a=>{setViewAth(a);setCoachPage("athletes");}}/>;      
      case"coaches":return<CoachesPage coaches={coaches} programs={programs} athletes={athletes} allAthletes={athletes} calcPct={calcPct} onViewAth={a=>{setViewAth(a);setCoachPage("athletes");}} onReassign={reassignAthlete}/>;

      case"notifications":return<NotifPage notifs={notifs} setNotifs={setNotifs} profile={profile}/>;
      default:return null;
    }
  };

  return(
    <><style>{CSS}</style>
    <div className="app">
      <header className="hdr">
        {isCoach&&(viewAth||viewProg)&&<button onClick={()=>{setViewAth(null);setViewProg(null);}} style={{background:"rgba(232,160,32,.15)",border:"1px solid rgba(232,160,32,.3)",borderRadius:7,color:"#e8a020",padding:"5px 12px",cursor:"pointer",fontSize:13,fontWeight:700,marginRight:8}}>← Back</button>}
        <div className="hdr-brand" style={{cursor:"pointer"}} onClick={()=>{setViewAth(null);setViewProg(null);setCoachPage("dashboard");}}>Diamond<em>Track</em></div>
        <div className="hdr-right">
          {isCoach&&<>
            <div style={{position:"relative"}}>
              <button className="btn bgh bsm" style={{padding:"6px 9px",position:"relative"}} onClick={()=>setShowNotif(p=>!p)}>
                🔔{unreadN>0&&<span style={{position:"absolute",top:1,right:1,width:14,height:14,borderRadius:"50%",background:"#e84040",color:"#fff",fontSize:8,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{unreadN>9?"9+":unreadN}</span>}
              </button>
              {showNotif&&<NotifPanel notifs={notifs} setNotifs={setNotifs} onClose={()=>setShowNotif(false)} profile={profile}/>}
            </div>

          </>}
          <div className="ubadge">
            <div className="uav">{profile.avatar||ini(profile.name)}</div>
            <div style={{fontSize:12,fontWeight:600}}>{profile.name?.split(" ")[0]}</div>
            <button className="btn bgh bsm" style={{marginLeft:2}} onClick={logout}>↩</button>
          </div>
        </div>
      </header>
      <div className="layout">
        {isCoach&&<aside className="sb">
          {[["dashboard","🏠","Dashboard"],["athletes","👤","Athletes"],["programs","🏋️","Workouts"],["groups","🏷️","Groups"],["notifications","🔔","Notifications"],...(isAdmin?[["coaches","🛡️","Coaches"]]:[])]  .map(([id,ic,lb])=>(
            <button key={id} className={`sbn ${coachPage===id&&!viewAth&&!viewProg?"on":""}`} onClick={()=>{setCoachPage(id);setViewAth(null);setViewProg(null);}}>
              <span>{ic}</span><span>{lb}</span>
            </button>
          ))}
        </aside>}
        <main className="body">
          {isCoach&&coachBody()}
          {isAthlete&&(workoutView
            ?<WorkoutLogger prog={workoutView} athlete={profile} getLog={getLog} updateLog={(p,e,f,v)=>saveEx(p,e,f,v)} saveEx={(p,e)=>saveEx(p,e,"saved",true,true)} markComplete={markComplete} calcPct={calcPct} onBack={()=>setWorkoutView(null)} getSess={getSess} reloadLogs={async(pId)=>{
    const r=await fetch(`${SURL}/rest/v1/workout_logs?athlete_id=eq.${profile.id}&program_id=eq.${pId}&select=*`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    if(r.ok){const data=await r.json().catch(()=>[]);if(Array.isArray(data)){const lm={...logs};data.forEach(l=>{lm[`${l.program_id}-${l.athlete_id}-${l.exercise_id}`]=l;});setLogs(lm);}}
    const sr=await fetch(`${SURL}/rest/v1/workout_sessions?athlete_id=eq.${profile.id}&program_id=eq.${pId}&select=*`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    if(sr.ok){const sdata=await sr.json().catch(()=>[]);if(Array.isArray(sdata)){const sm={...sessions};sdata.forEach(s=>{sm[`${s.program_id}-${s.athlete_id}`]=s;});setSessions(sm);}}
  }}/>
            :<AthPortal athlete={profile} programs={athProgs} isSaved={isSaved} calcPct={calcPct} setWorkoutView={setWorkoutView} measHist={measHist[profile.id]||[]} selfLogs={selfLogs} onSaveSelfLog={saveSelfLog} profile={profile}/>
          )}
        </main>
      </div>
      {modal==="addAth"&&<AddAthModal onClose={()=>setModal(null)} onSave={a=>{saveAthlete(a);setModal(null);}}/>}
      {modal==="addProg"&&<AddProgModal athletes={athletes} onClose={()=>setModal(null)} onSave={p=>{saveProgram(p);setModal(null);}}/>}
      {modal==="addGroup"&&<AddGroupModal athletes={athletes} onClose={()=>setModal(null)} onSave={p=>{saveProgram(p);setModal(null);}}/>}
      {isCoach&&<nav className="bnav">
        {[["dashboard","🏠","Home"],["athletes","👤","Roster"],["programs","🏋️","Workouts"],["groups","🏷️","Groups"],["notifications","🔔","Alerts"],...(isAdmin?[["coaches","🛡️","Coaches"]]:[])]  .map(([id,ic,lb])=>(
          <button key={id} className={`bnavb ${coachPage===id&&!viewAth&&!viewProg?"on":""}`} onClick={()=>{setCoachPage(id);setViewAth(null);setViewProg(null);}}>
            <span className="bnavbi">{ic}</span><span>{lb}</span>
          </button>
        ))}
      </nav>}
    </div></>
  );
}
function Dashboard({athletes,programs,calcPct,setCoachPage,setViewAth}){
  const avgPct=programs.length?Math.round(programs.reduce((s,p)=>s+calcPct(p),0)/programs.length):0;
  const[expandedGroup,setExpandedGroup]=useState(null);
  const[expandedGrad,setExpandedGrad]=useState(null);
  const[expandedAge,setExpandedAge]=useState(null);
  const activeAgeGroups=AGE_GROUPS.filter(g=>athletes.some(a=>a.age_group===g));

  const goAth=(a)=>{setCoachPage("athletes");setViewAth(a);};

  const AthRow=({a})=>{
    const prog=programs.find(p=>p.athleteId===a.id);const pct=prog?calcPct(prog):0;
    return(
      <div className="ri" style={{cursor:"pointer",paddingLeft:12}} onClick={()=>goAth(a)}>
        <div className="riv" style={{width:28,height:28,fontSize:10}}>{a.avatar||ini(a.name)}</div>
        <div style={{flex:1}}><div style={{fontSize:12,fontWeight:600}}>{a.name}</div><div style={{fontSize:10,color:"#6b82a0"}}>{a.position}{a.grad?` · ${a.grad}`:a.age_group?` · ${a.age_group}`:""}</div></div>
        <div style={{fontSize:12,fontWeight:700,color:"#e8a020"}}>{pct}%</div>
        <span style={{fontSize:10,color:"#6b82a0",marginLeft:4}}>→</span>
      </div>
    );
  };

  return(<>
    <div className="pt">Coach <em>Dashboard</em></div>
    <div className="sr">
      <div className="sb2" style={{cursor:"pointer"}} onClick={()=>setCoachPage("athletes")}><div className="sv">{athletes.length}</div><div className="sl">Athletes</div></div>
      <div className="sb2"><div className="sv">{programs.length}</div><div className="sl">Programs</div></div>
      <div className="sb2"><div className="sv">{avgPct}%</div><div className="sl">Avg Complete</div></div>
      <div className="sb2"><div className="sv">{athletes.filter(a=>a.committed).length}</div><div className="sl">Committed</div></div>
    </div>
    <div className="dg">
      <div className="card">
        <div className="ds">Recent Athletes</div>
        {athletes.length===0&&<div className="empty"><div className="ei">👤</div><div className="et">No athletes yet</div></div>}
        {athletes.slice(0,6).map(a=>{const prog=programs.find(p=>p.athleteId===a.id);const pct=prog?calcPct(prog):0;return(
          <div key={a.id} className="ri" style={{cursor:"pointer"}} onClick={()=>goAth(a)}>
            <div className="riv">{a.avatar||ini(a.name)}</div>
            <div><div style={{fontSize:12,fontWeight:600}}>{a.name}</div><div style={{fontSize:10,color:"#6b82a0"}}>{a.position}{a.grad?` · ${a.grad}`:a.age_group?` · ${a.age_group}`:""}</div></div>
            <div style={{marginLeft:"auto",fontSize:14,fontWeight:700,color:"#e8a020"}}>{pct}%</div>
          </div>
        );})}
        {athletes.length>6&&<div style={{textAlign:"center",marginTop:8}}><button className="btn bgh bsm" onClick={()=>setCoachPage("athletes")}>View All {athletes.length} →</button></div>}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <div className="card">
          <div className="ds">By Position Group</div>
          {Object.keys(POSITION_GROUPS).map(g=>{
            const grpAthletes=athletes.filter(a=>getPG(a.position)===g);
            if(!grpAthletes.length)return null;
            const open=expandedGroup===g;
            return(<div key={g} style={{marginBottom:4}}>
              <div onClick={()=>setExpandedGroup(open?null:g)} style={{display:"flex",alignItems:"center",gap:7,padding:"6px 8px",borderRadius:7,cursor:"pointer",background:open?`${gColor[g]}15`:"transparent",border:`1px solid ${open?gColor[g]:"transparent"}`}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:gColor[g],flexShrink:0}}/>
                <div style={{flex:1,fontSize:12,fontWeight:open?700:400,color:open?gColor[g]:"#eef2f8"}}>{g}</div>
                <span className="bdg bg3">{grpAthletes.length}</span>
                <span style={{fontSize:10,color:"#6b82a0",marginLeft:2}}>{open?"▲":"▼"}</span>
              </div>
              {open&&<div style={{borderLeft:`2px solid ${gColor[g]}40`,marginLeft:11,paddingLeft:4,marginTop:2}}>
                {grpAthletes.map(a=><AthRow key={a.id} a={a}/>)}
              </div>}
            </div>);
          })}
        </div>
        <div className="card">
          <div className="ds">By Grad Year</div>
          {GRAD_YEARS.map(yr=>{
            const yrAthletes=athletes.filter(a=>a.grad===yr);
            if(!yrAthletes.length)return null;
            const open=expandedGrad===yr;
            return(<div key={yr} style={{marginBottom:4}}>
              <div onClick={()=>setExpandedGrad(open?null:yr)} style={{display:"flex",alignItems:"center",gap:7,padding:"6px 8px",borderRadius:7,cursor:"pointer",background:open?`${grColor[yr]}15`:"transparent",border:`1px solid ${open?grColor[yr]:"transparent"}`}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:grColor[yr]||"#888",flexShrink:0}}/>
                <div style={{flex:1,fontSize:12,fontWeight:open?700:400,color:open?grColor[yr]:"#eef2f8"}}>Class of {yr}</div>
                <span className="bdg bg3">{yrAthletes.length}</span>
                <span style={{fontSize:10,color:"#6b82a0",marginLeft:2}}>{open?"▲":"▼"}</span>
              </div>
              {open&&<div style={{borderLeft:`2px solid ${grColor[yr]||"#888"}40`,marginLeft:11,paddingLeft:4,marginTop:2}}>
                {yrAthletes.map(a=><AthRow key={a.id} a={a}/>)}
              </div>}
            </div>);
          })}
          {activeAgeGroups.map(ag=>{
            const agAthletes=athletes.filter(a=>a.age_group===ag);
            if(!agAthletes.length)return null;
            const open=expandedAge===ag;
            return(<div key={ag} style={{marginBottom:4}}>
              <div onClick={()=>setExpandedAge(open?null:ag)} style={{display:"flex",alignItems:"center",gap:7,padding:"6px 8px",borderRadius:7,cursor:"pointer",background:open?"rgba(58,155,232,.1)":"transparent",border:`1px solid ${open?"#3a9be8":"transparent"}`}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:"#3a9be8",flexShrink:0}}/>
                <div style={{flex:1,fontSize:12,fontWeight:open?700:400,color:open?"#3a9be8":"#eef2f8"}}>{ag}</div>
                <span className="bdg bg4">{agAthletes.length}</span>
                <span style={{fontSize:10,color:"#6b82a0",marginLeft:2}}>{open?"▲":"▼"}</span>
              </div>
              {open&&<div style={{borderLeft:"2px solid rgba(58,155,232,.4)",marginLeft:11,paddingLeft:4,marginTop:2}}>
                {agAthletes.map(a=><AthRow key={a.id} a={a}/>)}
              </div>}
            </div>);
          })}
        </div>
      </div>
    </div>
  </>);
}

function AthRoster({athletes,allAthletes,programs,calcPct,gradF,setGradF,groupF,setGroupF,onView,onAdd}){
  const[search,setSearch]=useState("");
  const gyrs=[...new Set((allAthletes||athletes).map(a=>a.grad))].filter(Boolean).sort();
  const pgs=[...new Set((allAthletes||athletes).map(a=>getPG(a.position)))];
  const displayed=search?athletes.filter(a=>
    (a.name||"").toLowerCase().includes(search.toLowerCase())||
    (a.position||"").toLowerCase().includes(search.toLowerCase())||
    (a.high_school||"").toLowerCase().includes(search.toLowerCase())||
    (a.email||"").toLowerCase().includes(search.toLowerCase())
  ):athletes;
  return(<>
    <div className="ph"><div className="pt">Athlete <em>Roster</em></div><button className="btn bg" onClick={onAdd}>+ Add Athlete</button></div>
    <div style={{marginBottom:12}}><input className="inp" placeholder="🔍 Search by name, position, school..." value={search} onChange={e=>setSearch(e.target.value)} style={{maxWidth:400}}/></div>
    <div className="fb">
      <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginRight:3}}>Class/Age:</span>
      <button className={`fc ${!gradF?"on":""}`} onClick={()=>setGradF(null)}>All</button>
      {gyrs.map(yr=><button key={yr} className={`fc ${gradF===yr?"on":""}`} onClick={()=>setGradF(yr)}><span className="dot" style={{background:grColor[yr]||"#888"}}/>{yr}</button>)}
      {AGE_GROUPS.filter(g=>(allAthletes||athletes).some(a=>a.age_group===g)).map(g=><button key={g} className={`fc ${gradF===g?"on":""}`} onClick={()=>setGradF(g)}><span className="dot" style={{background:"#3a9be8"}}/>{g}</button>)}
      <div style={{width:1,height:16,background:"rgba(255,255,255,.1)",margin:"0 4px"}}/>
      <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginRight:3}}>Group:</span>
      <button className={`fc ${!groupF?"on":""}`} onClick={()=>setGroupF(null)}>All</button>
      {pgs.map(g=><button key={g} className={`fc ${groupF===g?"on":""}`} onClick={()=>setGroupF(g)}><span className="dot" style={{background:gColor[g]}}/>{g}</button>)}
    </div>
    {displayed.length===0&&<div className="empty"><div className="ei">👤</div><div className="et">No athletes match</div></div>}
    <div className="ag">
      {displayed.map(a=>{
        const prog=programs.find(p=>p.athleteId===a.id);const pct=prog?calcPct(prog):0;const g=getPG(a.position);
        return(<div key={a.id} className="card cc" onClick={()=>onView(a)} style={{display:"flex",flexDirection:"column",gap:10}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div className="av">{a.avatar||ini(a.name)}</div>
            <div><div style={{fontWeight:700,fontSize:15}}>{a.name}</div><div style={{fontSize:11,color:"#8fa3be"}}>{a.position}</div></div>
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
            <span className="tag" style={{background:`${gColor[g]}20`,color:gColor[g],border:`1px solid ${gColor[g]}40`}}>{g}</span>
            {a.grad&&<span className="tag" style={{background:`${grColor[a.grad]||"#555"}20`,color:grColor[a.grad]||"#aaa",border:`1px solid ${grColor[a.grad]||"#555"}40`}}>'{String(a.grad).slice(2)}</span>}
            {!a.grad&&a.age_group&&<span className="tag" style={{background:"rgba(58,155,232,.15)",color:"#3a9be8",border:"1px solid rgba(58,155,232,.3)"}}>{a.age_group}</span>}
            {a.committed&&<span className="bdg bg2">✓ Committed</span>}
          </div>
          <div style={{fontSize:11,color:"#6b82a0"}}>🏆 {a.dream_school||"Dream school TBD"}</div>
          <div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#6b82a0",marginBottom:3}}><span>{prog?prog.name:"No program"}</span><span>{pct}%</span></div>
            <div className="pb"><div className="pf" style={{width:`${pct}%`}}/></div>
          </div>
        </div>);
      })}
    </div>
  </>);
}


function AthDetail({athlete:athleteProp,programs,logs,sessions,calcPct,getSess,isSaved,onBack,measHist,selfLogs=[],onSaveMeas,onSaveAth}){
  const[athlete,setAthlete]=useState(athleteProp);
  useEffect(()=>setAthlete(athleteProp),[athleteProp?.id]);
  const[tab,setTab]=useState("profile");
  const[editing,setEditing]=useState(false);
  const[form,setForm]=useState({...athleteProp,dreamSchool:athleteProp.dream_school||"",gpa:athleteProp.gpa||"",height:athleteProp.height||"",weight:athleteProp.weight||"",useAge:!!(athleteProp.age_group&&!athleteProp.grad)});
  const[addMeas,setAddMeas]=useState(false);
  const[newMeas,setNewMeas]=useState({});
  const athProgs=programs.filter(p=>{
    if(p.athleteId===athlete.id)return true;
    if(!p.isGroup&&!p.is_group_program)return false;
    const g=getPG(athlete.position);
    const tg=p.targetGrads||p.target_grads||[];
    const tt=p.targetGroups||p.target_groups||[];
    const gradMatch=!tg.length||tg.some(yr=>String(yr)===String(athlete.grad));
    const groupMatch=!tt.length||tt.includes(g);
    return gradMatch&&groupMatch;
  });
  return(<>
    <button className="bb" onClick={onBack}>← Roster</button>
    <div className="ph">
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div className="av" style={{width:50,height:50,fontSize:16}}>{athlete.avatar||ini(athlete.name)}</div>
        <div><div style={{fontSize:20,fontWeight:800}}>{athlete.name}</div><div style={{fontSize:11,color:"#6b82a0"}}>{athlete.position}{athlete.grad?`·Class of ${athlete.grad}`:athlete.age_group?`·${athlete.age_group}`:""}{athlete.email?`·${athlete.email}`:""}</div></div>
      </div>
      <div style={{display:"flex",gap:7}}>
        <button className="btn bgh bsm" onClick={()=>setEditing(!editing)}>✏️ Edit</button>
      </div>
    </div>
    <div style={{display:"flex",gap:2,borderBottom:"1px solid rgba(255,255,255,.07)",marginBottom:14}}>
      {["profile","recruiting","workouts","history","journal","activity","badges"].map(t=>(
        <button key={t} onClick={()=>setTab(t)} style={{padding:"7px 13px",border:"none",background:"transparent",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:".4px",color:tab===t?"#e8a020":"#6b82a0",borderBottom:tab===t?"2px solid #e8a020":"2px solid transparent",cursor:"pointer"}}>{t}</button>
      ))}
    </div>
    {tab==="profile"&&(editing?(
      <div className="card" style={{marginBottom:14}}>
        <div className="fg2"><div className="fg"><label>Name</label><input className="inp" value={form.name||""} onChange={e=>setForm(p=>({...p,name:e.target.value}))}/></div><div className="fg"><label>Position</label><select className="inp" value={form.position||""} onChange={e=>setForm(p=>({...p,position:e.target.value}))}>{ALL_POS.map(p=><option key={p}>{p}</option>)}</select></div></div>
        <div className="fg">
          <label>Class / Age Group</label>
          <div style={{display:"flex",gap:6,marginBottom:6}}>
            <button onClick={()=>setForm(p=>({...p,useAge:false,age_group:null}))} style={{flex:1,padding:"6px",borderRadius:7,border:`1px solid ${!form.useAge?"#e8a020":"rgba(255,255,255,.12)"}`,background:!form.useAge?"rgba(232,160,32,.08)":"transparent",color:!form.useAge?"#e8a020":"#8fa3be",fontSize:10,fontWeight:700,cursor:"pointer"}}>Grad Year</button>
            <button onClick={()=>setForm(p=>({...p,useAge:true,grad:null}))} style={{flex:1,padding:"6px",borderRadius:7,border:`1px solid ${form.useAge?"#e8a020":"rgba(255,255,255,.12)"}`,background:form.useAge?"rgba(232,160,32,.08)":"transparent",color:form.useAge?"#e8a020":"#8fa3be",fontSize:10,fontWeight:700,cursor:"pointer"}}>Age Group</button>
          </div>
          {!form.useAge
            ?<select className="inp" value={form.grad||2027} onChange={e=>setForm(p=>({...p,grad:parseInt(e.target.value),age_group:null}))}>{GRAD_YEARS.map(y=><option key={y}>{y}</option>)}</select>
            :<select className="inp" value={form.age_group||""} onChange={e=>setForm(p=>({...p,age_group:e.target.value,grad:null}))}><option value="">Select age group...</option>{AGE_GROUPS.map(g=><option key={g}>{g}</option>)}</select>
          }
        </div>
        <div className="fg2">
          <div className="fg"><label>GPA</label><input className="inp" value={form.gpa||""} onChange={e=>setForm(p=>({...p,gpa:e.target.value}))}/></div>
          <div className="fg"><label>Height</label><input className="inp" value={form.height||""} onChange={e=>setForm(p=>({...p,height:e.target.value}))}/></div>
        </div>
        <div className="fg3"><div className="fg"><label>Weight</label><input className="inp" value={form.weight||""} onChange={e=>setForm(p=>({...p,weight:e.target.value}))}/></div><div className="fg"><label>Bats</label><select className="inp" value={form.bats||"R"} onChange={e=>setForm(p=>({...p,bats:e.target.value}))}><option>R</option><option>L</option><option>S</option></select></div><div className="fg"><label>Throws</label><select className="inp" value={form.throws||"R"} onChange={e=>setForm(p=>({...p,throws:e.target.value}))}><option>R</option><option>L</option></select></div></div>
        <div className="fg3"><div className="fg"><label>High School</label><input className="inp" placeholder="School name" value={form.high_school||""} onChange={e=>setForm(p=>({...p,high_school:e.target.value}))}/></div><div className="fg"><label>Dream School</label><input className="inp" value={form.dreamSchool||""} onChange={e=>setForm(p=>({...p,dreamSchool:e.target.value}))}/></div><div className="fg"><label>Committed</label><select className="inp" value={form.committed?"yes":"no"} onChange={e=>setForm(p=>({...p,committed:e.target.value==="yes"}))}><option value="no">No</option><option value="yes">Yes</option></select></div></div>
        <div style={{display:"flex",gap:7,justifyContent:"flex-end"}}><button className="btn bgh bsm" onClick={()=>setEditing(false)}>Cancel</button><button className="btn bg bsm" onClick={async()=>{const saveData={...form,id:athlete.id,dreamSchool:form.dreamSchool||form.dream_school,grad:form.useAge?null:form.grad,age_group:form.useAge?form.age_group:null};const fresh=await onSaveAth(saveData);if(fresh){setAthlete(fresh);setForm({...fresh,dreamSchool:fresh.dream_school||"",gpa:fresh.gpa||"",height:fresh.height||"",weight:fresh.weight||"",useAge:!!(fresh.age_group&&!fresh.grad)});}setEditing(false);}}>Save</button></div>
      </div>
    ):(
      <div className="sr">
        {[{l:"Position",v:athlete.position||"—"},{l:"Height",v:athlete.height||"—"},{l:"Weight",v:athlete.weight?`${athlete.weight} lbs`:"—"},{l:"Bats/Throws",v:(athlete.bats&&athlete.throws)?`${athlete.bats}/${athlete.throws}`:"—"},{l:"GPA",v:athlete.gpa||"—"},{l:"High School",v:athlete.high_school||"—"},{l:"Grad",v:athlete.grad||athlete.age_group||"—"},{l:"Dream School",v:athlete.dream_school||form.dreamSchool||"—"},{l:"Committed",v:athlete.committed?"✅ Yes":"No"}].map(i=>(
          <div key={i.l} className="sb2"><div className="sv" style={{fontSize:14,wordBreak:"break-word"}}>{i.v}</div><div className="sl">{i.l}</div></div>
        ))}
      </div>
    ))}
    {tab==="recruiting"&&<div>
      <div style={{marginBottom:14}}>
        <div className="ds">Current Measurables</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:8}}>
          {MEASURABLES.map(m=>{const val=athlete.measurables?.[m.key];return(<div key={m.key} className="mc"><div style={{fontSize:18,marginBottom:5}}>{m.icon}</div>{val?<><div className="mv">{val}</div><div style={{fontSize:10,color:"#6b82a0"}}>{m.unit}</div></>:<div style={{color:"#6b82a0",fontSize:16}}>—</div>}<div style={{fontSize:10,color:"#8fa3be",marginTop:2}}>{m.label}</div></div>);})}
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <div className="ds" style={{marginBottom:0}}>History</div>
        <button className="btn bg bsm" onClick={()=>setAddMeas(!addMeas)}>+ Entry</button>
      </div>
      {addMeas&&<div className="card" style={{marginBottom:12}}>
        <div className="fg3">{MEASURABLES.map(m=><div key={m.key} className="fg"><label>{m.icon} {m.label}</label><input className="inp" placeholder="—" value={newMeas[m.key]||""} onChange={e=>setNewMeas(p=>({...p,[m.key]:e.target.value}))}/></div>)}</div>
        <div style={{display:"flex",gap:7,justifyContent:"flex-end"}}><button className="btn bgh bsm" onClick={()=>setAddMeas(false)}>Cancel</button><button className="btn bg bsm" onClick={async()=>{const ok=await onSaveMeas(newMeas);if(ok){const merged={...(athlete.measurables||{}),...Object.fromEntries(Object.entries(newMeas).filter(([k,v])=>v))};setAthlete(p=>({...p,measurables:merged}));setNewMeas({});setAddMeas(false);}}}>Save Entry</button></div>
      </div>}
    </div>}
    {tab==="workouts"&&<AthDetailWorkouts athProgs={athProgs} athlete={athlete} logs={logs} sessions={sessions} calcPct={calcPct} isSaved={isSaved} getSess={getSess}/>}
    {tab==="journal"&&<SessionJournal logs={selfLogs.map(l=>({...l,metrics:typeof l.metrics==="string"?JSON.parse(l.metrics||"{}"):l.metrics||{},notes:l.notes||""}))} isCoach={true}/>}
    {tab==="activity"&&<ActivityFeed athlete={athlete} programs={programs} selfLogs={selfLogs} sessions={sessions} logs={logs}/>}
    {tab==="badges"&&<><div style={{marginBottom:12}}><BadgeShelf logs={selfLogs} compact={false}/></div></>}
    {tab==="history"&&<div>
      {athProgs.map(prog=>(
        <div key={prog.id} style={{marginBottom:18}}>
          <div style={{fontSize:14,fontWeight:700,color:"#e8a020",marginBottom:8}}>{prog.name} — {prog.week}</div>
          {(prog.days||[]).map(day=>(
            <div key={day.day} style={{marginBottom:10}}>
              <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#8fa3be",marginBottom:5}}>{day.day}</div>
              <div className="card" style={{padding:0,overflow:"hidden"}}>
                <table className="tbl"><thead><tr><th>Exercise</th><th>Prescribed</th><th>Reps</th><th>Weight</th><th>Status</th></tr></thead>
                <tbody>{(day.exercises||[]).map(ex=>{const log=logs[`${prog.id}-${athlete.id}-${ex.id}`]||{};return(<tr key={ex.id}><td style={{fontWeight:600}}>{ex.name}</td><td style={{color:"#6b82a0"}}>{ex.sets}×{ex.reps}</td><td>{log.reps||"—"}</td><td>{log.weight||"—"}</td><td>{log.saved?<span className="bdg bg2">✓</span>:<span className="bdg" style={{background:"rgba(255,255,255,.05)",color:"#6b82a0"}}>—</span>}</td></tr>);})}</tbody>
                </table>
              </div>
            </div>
          ))}
        </div>
      ))}
    </div>}
  </>);
}

function ProgsPage({athletes,programs,calcPct,onView,onAdd,onAddGroup}){
  const gProgs=programs.filter(p=>p.isGroup||p.is_group_program);
  const iProgs=programs.filter(p=>!p.isGroup&&!p.is_group_program);
  const gc=(p)=>athletes.filter(a=>{const g=getPG(a.position);return(!p.targetGrads?.length||p.targetGrads.some(yr=>parseInt(yr)===parseInt(a.grad)))&&(!p.targetGroups?.length||p.targetGroups.includes(g));}).length;
  return(<>
    <div className="ph">
      <div className="pt">Workout <em>Programs</em></div>
      <div style={{display:"flex",gap:7}}>
        <button className="btn bbl" onClick={onAddGroup}>👥 Group Workout</button>
        <button className="btn bg" onClick={onAdd}>+ Individual Workout</button>
      </div>
    </div>
    {gProgs.length>0&&<div style={{marginBottom:18}}>
      <div className="ds" style={{display:"flex",alignItems:"center",gap:6}}><span style={{color:"#3a9be8"}}>●</span> Group Programs</div>
      <div className="pl">{gProgs.map(p=>{const cnt=gc(p);const tags=[...(p.targetGrads?.map(y=>`Class of ${y}`)||[]),...(p.targetGroups||[])];return(<div key={p.id} className="card pc cc" onClick={()=>onView(p)} style={{borderColor:"rgba(58,155,232,.2)"}}><div className="pi" style={{background:"rgba(58,155,232,.1)",color:"#3a9be8"}}>👥</div><div style={{flex:1}}><div className="pn">{p.name}</div><div className="ps">{p.week}·{cnt} athletes</div><div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:4}}>{tags.map(t=><span key={t} style={{padding:"1px 6px",borderRadius:8,fontSize:9,fontWeight:700,textTransform:"uppercase",background:"rgba(58,155,232,.1)",color:"#3a9be8"}}>{t}</span>)}</div></div><span className="bdg bg4">{cnt}</span></div>);})}</div>
    </div>}
    <div>
      {gProgs.length>0&&iProgs.length>0&&<div className="ds" style={{display:"flex",alignItems:"center",gap:6}}><span style={{color:"#e8a020"}}>●</span> Individual Programs</div>}
      <div className="pl">
        {iProgs.length===0&&<div className="empty"><div className="ei">🏋️</div><div className="et">No programs yet</div></div>}
        {iProgs.map(p=>{const ath=athletes.find(a=>a.id===p.athleteId);const pct=calcPct(p);return(<div key={p.id} className="card pc cc" onClick={()=>onView(p)}><div className="pi">🏋️</div><div style={{flex:1}}><div className="pn">{p.name}</div><div className="ps">{ath?.name}·{p.week}</div><div className="pb" style={{marginTop:4}}><div className="pf" style={{width:`${pct}%`}}/></div></div><span className="bdg bg3">{pct}%</span></div>);})}
      </div>
    </div>
  </>);
}

function ProgDetail({prog,athletes,logs,sessions,calcPct,isSaved,getSess,onBack,onClickAth,onUpdate,onCopy,onDelete}){
  const[viewAth,setViewAth]=useState(null);
  const[editing,setEditing]=useState(false);
  const[editName,setEditName]=useState(prog.name);
  const[editWeek,setEditWeek]=useState(prog.week||"");
  const[editDays,setEditDays]=useState(prog.days||[]);
  const[activeDay,setActiveDay]=useState(0);
  const[showPicker,setShowPicker]=useState(false);
  const[saving,setSaving]=useState(false);
  const ath=athletes.find(a=>a.id===prog.athleteId);

  const updEx=(di,ei,k,v)=>{const u=[...editDays];u[di].exercises[ei][k]=v;setEditDays(u);};
  const remEx=(di,ei)=>{const u=[...editDays];u[di].exercises.splice(ei,1);setEditDays(u);};
  const addBlank=()=>{const u=[...editDays];u[activeDay].exercises.push({id:`e${Date.now()}`,name:"",sets:3,reps:10,weight:"",notes:""});setEditDays(u);};
  const addDay=()=>{const used=editDays.map(d=>d.day);const next=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].find(d=>!used.includes(d));if(next)setEditDays([...editDays,{day:next,exercises:[]}]);};
  const remDay=(i)=>{const u=[...editDays];u.splice(i,1);setEditDays(u);if(activeDay>=u.length)setActiveDay(Math.max(0,u.length-1));};
  const addEx=(ex)=>{const u=[...editDays];if(!u[activeDay])return;u[activeDay].exercises.push({id:`e${Date.now()}`,name:ex.name,sets:ex.sets,reps:ex.reps,weight:ex.wt||"",notes:""});setEditDays(u);setShowPicker(false);};
  const saveEdits=async()=>{setSaving(true);await onUpdate({...prog,name:editName,week:editWeek,days:editDays.filter(d=>d.exercises.length>0)});setSaving(false);setEditing(false);};
  const assigned=prog.isGroup?athletes.filter(a=>{const g=getPG(a.position);return(!prog.targetGrads?.length||prog.targetGrads.some(yr=>parseInt(yr)===parseInt(a.grad)))&&(!prog.targetGroups?.length||prog.targetGroups.includes(g));}):ath?[ath]:[];
  const tags=prog.isGroup?[...(prog.targetGrads?.map(y=>`Class of ${y}`)||[]),...(prog.targetGroups||[])]:[];
  const athPct=(aid)=>{const all=(prog.days||[]).flatMap(d=>d.exercises||[]);if(!all.length)return 0;return Math.round(all.filter(ex=>isSaved(prog.id,ex.id,aid)).length/all.length*100);};

  if(editing) return(<>
    <button className="bb" onClick={()=>setEditing(false)}>← Cancel Edit</button>
    <div className="ph">
      <div style={{flex:1}}>
        <div className="fg"><label>Program Name</label><input className="inp" value={editName} onChange={e=>setEditName(e.target.value)}/></div>
        <div className="fg"><label>Week / Label</label><input className="inp" value={editWeek} onChange={e=>setEditWeek(e.target.value)}/></div>
      </div>
    </div>
    <div className="fb" style={{marginBottom:10,flexWrap:"wrap"}}>
      {editDays.map((d,i)=><button key={i} className={`fc ${activeDay===i?"on":""}`} onClick={()=>setActiveDay(i)} style={{display:"flex",alignItems:"center",gap:4}}>{d.day} <span style={{fontSize:9}}>({d.exercises.length})</span> <span onClick={e=>{e.stopPropagation();remDay(i);}} style={{marginLeft:2,color:"#e84040",fontWeight:700,fontSize:11}}>✕</span></button>)}
      <button className="fc" onClick={addDay}>+ Day</button>
    </div>
    <div style={{display:"flex",gap:7,marginBottom:10}}>
      <button className="btn bg bsm" onClick={()=>setShowPicker(true)}>⚾ Library</button>
      <button className="btn bgh bsm" onClick={addBlank}>+ Blank</button>
    </div>
    {editDays[activeDay]&&<div style={{maxHeight:380,overflowY:"auto"}}>
      {editDays[activeDay].exercises.length===0&&<div className="empty" style={{padding:"16px 0"}}><div className="ei">⚾</div><div className="et" style={{fontSize:12}}>No exercises — add from library</div></div>}
      {editDays[activeDay].exercises.map((ex,ei)=>(
        <div key={ex.id||ei} style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.07)",borderRadius:7,padding:10,marginBottom:8}}>
          <div style={{display:"flex",gap:7,marginBottom:7,alignItems:"center"}}>
            <input className="inp" placeholder="Exercise name" value={ex.name} onChange={e=>updEx(activeDay,ei,"name",e.target.value)} style={{flex:1}}/>
            <button className="btn bgr bsm" onClick={()=>remEx(activeDay,ei)}>✕</button>
          </div>
          <div className="fg3" style={{marginBottom:6}}>
            <div className="fg"><label>Sets</label><input className="inp" type="number" value={ex.sets} onChange={e=>updEx(activeDay,ei,"sets",e.target.value)}/></div>
            <div className="fg"><label>Reps</label><input className="inp" type="number" value={ex.reps} onChange={e=>updEx(activeDay,ei,"reps",e.target.value)}/></div>
            <div className="fg"><label>Load</label><input className="inp" placeholder="45 lbs" value={ex.weight||""} onChange={e=>updEx(activeDay,ei,"weight",e.target.value)}/></div>
          </div>
          <div className="fg" style={{marginBottom:0}}><label>Coach Notes</label><input className="inp" placeholder="Cues, focus..." value={ex.notes||""} onChange={e=>updEx(activeDay,ei,"notes",e.target.value)}/></div>
        </div>
      ))}
    </div>}
    <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:14,paddingTop:12,borderTop:"1px solid rgba(255,255,255,.07)"}}>
      <button className="btn bgh" onClick={()=>setEditing(false)}>Cancel</button>
      <button className="btn bg" onClick={saveEdits} disabled={saving||!editName.trim()}>{saving?"Saving...":"Save Changes"}</button>
    </div>
    {showPicker&&<ExPicker onSelect={addEx} onClose={()=>setShowPicker(false)}/>}
  </>);

  if(viewAth){
    const sess=getSess(prog.id,viewAth.id);
    return(<>
      <button className="bb" onClick={()=>setViewAth(null)}>← Back to Program</button>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        <div className="av" style={{width:38,height:38,fontSize:13}}>{viewAth.avatar||ini(viewAth.name)}</div>
        <div><div style={{fontWeight:700,fontSize:16}}>{viewAth.name}</div><div style={{fontSize:10,color:"#6b82a0"}}>{prog.name}·{athPct(viewAth.id)}% complete</div></div>
      </div>
      {(prog.days||[]).map((day,di)=>(
        <div key={di} style={{marginBottom:16}}>
          <div style={{fontSize:12,fontWeight:700,textTransform:"uppercase",color:"#e8a020",marginBottom:8}}>{day.day}</div>
          {(day.exercises||[]).map(ex=>{
            const log=logs[`${prog.id}-${viewAth.id}-${ex.id}`]||{};
            return(<div key={ex.id} className={`le ${log.saved?"done":""}`}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}><div className="lex">{ex.name}</div>{log.saved?<span className="bdg bg2">✓ Logged</span>:<span className="bdg" style={{background:"rgba(255,255,255,.05)",color:"#6b82a0"}}>Pending</span>}</div>
              <div className="lep">Prescribed: {ex.sets}×{ex.reps} @ {ex.weight}</div>
              {log.saved&&<div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginTop:8}}>{[["Reps",log.reps],["Weight",log.weight],["Sets",log.sets]].map(([l,v])=><div key={l} style={{background:"rgba(255,255,255,.04)",borderRadius:6,padding:"6px 8px"}}><div style={{fontSize:9,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:2}}>{l}</div><div style={{fontSize:14,fontWeight:700}}>{v||"—"}</div></div>)}</div>}
              {log.notes&&<div style={{marginTop:6,padding:"6px 8px",background:"rgba(232,160,32,.05)",border:"1px solid rgba(232,160,32,.12)",borderRadius:6,fontSize:11,color:"#8fa3be"}}><span style={{color:"#e8a020",fontWeight:700}}>Note: </span>{log.notes}</div>}
            </div>);
          })}
        </div>
      ))}
    </>);
  }

  return(<>
    <button className="bb" onClick={onBack}>← Back</button>
    <div className="ph">
      <div>
        <div className="pt">{prog.name}</div>
        {prog.isGroup?<div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:4}}><span className="bdg bg4">👥 Group</span>{tags.map(t=><span key={t} style={{padding:"1px 6px",borderRadius:8,fontSize:9,fontWeight:700,textTransform:"uppercase",background:"rgba(58,155,232,.1)",color:"#3a9be8"}}>{t}</span>)}</div>:<div style={{fontSize:11,color:"#6b82a0"}}>{ath?.name}·{prog.week}</div>}
      </div>
      <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
        <button className="btn bgh bsm" onClick={()=>onCopy(prog,prog.athleteId)}>📋 Copy</button>
        <button className="btn bg bsm" onClick={()=>{setEditName(prog.name);setEditWeek(prog.week||"");setEditDays(JSON.parse(JSON.stringify(prog.days||[])));setActiveDay(0);setEditing(true);}}>✏️ Edit</button>
        <button className="btn bgr bsm" onClick={()=>onDelete(prog.id)}>🗑 Delete</button>
      </div>
    </div>
    {assigned.length>0&&<div className="card" style={{marginBottom:16,padding:0,overflow:"hidden"}}>
      <div style={{padding:"10px 14px",borderBottom:"1px solid rgba(255,255,255,.07)",fontSize:11,fontWeight:700,textTransform:"uppercase",color:"#8fa3be"}}>Athlete Completion</div>
      <table className="tbl"><thead><tr><th>Athlete</th><th>Progress</th><th>Started</th><th>Duration</th><th></th></tr></thead>
      <tbody>{assigned.map(a=>{
        const pct=athPct(a.id);const sess=getSess(prog.id,a.id);
        const dur=sess.started_at&&sess.completed_at?Math.round((new Date(sess.completed_at)-new Date(sess.started_at))/60000):null;
        return(<tr key={a.id}><td><span style={{fontWeight:600,cursor:"pointer",color:"#e8a020",textDecoration:"underline"}} onClick={()=>onClickAth&&onClickAth(a)}>{a.name}</span></td>
          <td><div style={{display:"flex",alignItems:"center",gap:6,minWidth:90}}><div style={{flex:1,height:5,background:"rgba(255,255,255,.06)",borderRadius:3,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:pct===100?"#27c97a":"linear-gradient(90deg,#e8a020,#f5c060)",borderRadius:3}}/></div><span style={{fontSize:11,fontWeight:700,color:pct===100?"#27c97a":"#e8a020"}}>{pct}%</span></div></td>
          <td style={{fontSize:10,color:"#6b82a0"}}>{sess.started_at?fmtT(sess.started_at):"—"}</td>
          <td style={{fontSize:11,color:"#e8a020",fontWeight:600}}>{dur?fmtD(dur):"—"}</td>
          <td><button className="btn bgh bsm" onClick={()=>setViewAth(a)}>View Log</button></td>
        </tr>);
      })}</tbody></table>
    </div>}
    {(prog.days||[]).map((day,di)=>(
      <div key={di} className="db">
        <div className="dh"><div className="dl">{day.day}</div><span className="bdg bg4">{(day.exercises||[]).length} exercises</span></div>
        <table className="tbl"><thead><tr><th>Exercise</th><th>Sets</th><th>Reps</th><th>Load</th></tr></thead>
        <tbody>{(day.exercises||[]).map(ex=><tr key={ex.id}><td style={{fontWeight:600}}>{ex.name}</td><td>{ex.sets}</td><td>{ex.reps}</td><td>{ex.weight||"—"}</td></tr>)}</tbody></table>
      </div>
    ))}
  </>);
}

  return(<>
    <div className="pt">Athlete <em>Groups</em></div>
    <div style={{marginBottom:22}}>
      <div className="ds">By Graduation Year</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:10}}>
        {GRAD_YEARS.map(yr=>{const g=athletes.filter(a=>a.grad===yr);if(!g.length)return null;return(<div key={yr} className="card"><div style={{display:"flex",alignItems:"center",gap:7,marginBottom:10}}><div style={{width:10,height:10,borderRadius:"50%",background:grColor[yr]}}/><div style={{fontWeight:700,fontSize:14}}>Class of {yr}</div><span className="bdg bg3" style={{marginLeft:"auto"}}>{g.length}</span></div>{g.map(a=><div key={a.id} className="ri" style={{cursor:"pointer"}} onClick={()=>onClickAth&&onClickAth(a)}><div className="riv">{a.avatar||ini(a.name)}</div><div style={{fontSize:12,fontWeight:600}}>{a.name}</div><span style={{marginLeft:"auto",fontSize:10,color:"#6b82a0"}}>View →</span></div>)}</div>);})}
      </div>
    </div>
    <div>
      <div className="ds">By Position Group</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:10}}>
        {Object.keys(POSITION_GROUPS).map(grp=>{const g=athletes.filter(a=>getPG(a.position)===grp);if(!g.length)return null;return(<div key={grp} className="card"><div style={{display:"flex",alignItems:"center",gap:7,marginBottom:10}}><div style={{width:10,height:10,borderRadius:"50%",background:gColor[grp]}}/><div style={{fontWeight:700,fontSize:14}}>{grp}</div><span className="bdg bg3" style={{marginLeft:"auto"}}>{g.length}</span></div>{g.map(a=><div key={a.id} className="ri" style={{cursor:"pointer"}} onClick={()=>onClickAth&&onClickAth(a)}><div className="riv">{a.avatar||ini(a.name)}</div><div><div style={{fontSize:12,fontWeight:600}}>{a.name}</div><div style={{fontSize:10,color:"#6b82a0"}}>{a.position}</div></div><span style={{marginLeft:"auto",fontSize:10,color:"#6b82a0"}}>View →</span></div>)}</div>);})}
      </div>

function MsgsPage({profile,athletes,messages,sendMsg,chatPartner,setChatPartner}){

function SessionJournal({logs,isCoach=false}){
  const[selected,setSelected]=useState(null);
  const[filterType,setFilterType]=useState("All");
  const STYPES_DEF={
    "Weight Training":{icon:"🏋️",color:"#e8a020"},
    "Hitting":{icon:"⚾",color:"#e84040"},
    "Throwing":{icon:"🎯",color:"#3a9be8"},
    "Fielding":{icon:"🥎",color:"#27c97a"},
    "Workout":{icon:"✅",color:"#9b59b6"},
    "Game":{icon:"🏟️",color:"#e67e22"},
    "Practice":{icon:"📋",color:"#8e44ad"},
    "Showcase":{icon:"⭐",color:"#f1c40f"},
  };
  const types=["All",...Object.keys(STYPES_DEF)];
  const filtered=filterType==="All"?logs:logs.filter(l=>l.type===filterType);

  const MetricRow=({label,value})=>value?(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid rgba(255,255,255,.05)"}}>
      <div style={{fontSize:12,color:"#8fa3be"}}>{label}</div>
      <div style={{fontSize:13,fontWeight:700,color:"#eef2f8"}}>{value}</div>
    </div>
  ):null;

  const METRIC_LABELS={
    // Weight Training
    exercises:"Exercises",sets:"Total Sets",topWeight:"Top Weight (lbs)",duration:"Duration (min)",
    // Hitting
    swings:"Total Swings",teeSwings:"Tee Swings",bpSwings:"BP Swings",exitVelo:"Best Exit Velo (mph)",
    // Throwing
    pitches:"Total Throws",bullpenPitches:"Bullpen Pitches",topVelo:"Top Velo (mph)",longTossMax:"Long Toss Max (ft)",
    // Fielding
    groundBalls:"Ground Balls",flyBalls:"Fly Balls",blocking:"Blocking Reps",throws:"Fielding Throws",
    // Workout (program completion)
    program:"Program",week:"Week",
    // Game
    opponent:"Opponent",result:"Result",atBats:"At Bats",hits:"Hits",rbi:"RBI",runs:"Runs Scored",stolenBases:"Stolen Bases",pitchingIP:"Innings Pitched",pitchingK:"Strikeouts",pitchingER:"Earned Runs",
    // Throwing / spin rates
    spinFB:"FB Spin Rate (rpm)",spinCB:"CB Spin Rate (rpm)",spinCH:"CH Spin Rate (rpm)",spinOther:"Other Spin Rate (rpm)",
    // Practice
    focus:"Focus Area",notes_highlights:"Highlights",
    // Showcase
    eventName:"Event Name",location:"Location",sixty:"60-Yard Dash",popTime:"Pop Time",offersReceived:"Offers Received",schoolsPresent:"Schools Present",
  };

  if(selected){
    const def=STYPES_DEF[selected.type]||{icon:"📋",color:"#e8a020"};
    const metrics=selected.metrics||{};
    return(
      <div>
        <button className="bb" onClick={()=>setSelected(null)}>← Journal</button>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
          <div style={{width:44,height:44,borderRadius:10,background:`${def.color}20`,border:`1px solid ${def.color}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{def.icon}</div>
          <div>
            <div style={{fontSize:18,fontWeight:800,color:def.color}}>{selected.type}</div>
            <div style={{fontSize:11,color:"#6b82a0"}}>{selected.date_label||new Date(selected.created_at).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</div>
          </div>
        </div>
        {Object.keys(metrics).length>0&&<div className="card" style={{marginBottom:12}}>
          <div className="ds">Session Numbers</div>
          {Object.entries(metrics).map(([k,v])=>v?<MetricRow key={k} label={METRIC_LABELS[k]||k} value={v}/>:null)}
        </div>}
        {selected.notes&&<div className="card" style={{borderColor:`${def.color}30`}}>
          <div className="ds">Notes</div>
          <div style={{fontSize:14,lineHeight:1.7,color:"#eef2f8",whiteSpace:"pre-wrap"}}>{selected.notes}</div>
        </div>}
        {!selected.notes&&!Object.values(metrics).some(Boolean)&&<div className="empty"><div className="ei">{def.icon}</div><div className="et">No details recorded</div></div>}
      </div>
    );
  }

  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <div style={{fontSize:14,fontWeight:700}}>{isCoach?"Athlete Session Journal":"My Session Journal"}</div>
        <div style={{fontSize:11,color:"#6b82a0"}}>{filtered.length} session{filtered.length!==1?"s":""}</div>
      </div>
      <div className="fb" style={{marginBottom:14}}>
        {types.map(t=>{
          const def=STYPES_DEF[t];
          return(<button key={t} className={`fc ${filterType===t?"on":""}`} onClick={()=>setFilterType(t)} style={filterType===t&&def?{borderColor:def.color,color:def.color,background:`${def.color}15`}:{}}>{def?def.icon+" ":""}{t}</button>);
        })}
      </div>
      {filtered.length===0&&<div className="empty"><div className="ei">📓</div><div className="et">No sessions yet</div><div className="es">{isCoach?"Athlete hasn't logged any sessions.":"Log a session to start your journal."}</div></div>}
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {filtered.map(log=>{
          const def=STYPES_DEF[log.type]||{icon:"📋",color:"#e8a020"};
          const metrics=log.metrics||{};
          const highlights=Object.entries(metrics).filter(([k,v])=>v).slice(0,3);
          return(
            <div key={log.id} className="card cc" onClick={()=>setSelected(log)} style={{borderLeft:`3px solid ${def.color}`,cursor:"pointer"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:highlights.length||log.notes?8:0}}>
                <div style={{fontSize:22}}>{def.icon}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:14,color:def.color}}>{log.type}</div>
                  <div style={{fontSize:11,color:"#6b82a0"}}>{log.date_label||new Date(log.created_at).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</div>
                </div>
                <span style={{fontSize:11,color:"#6b82a0"}}>View →</span>
              </div>
              {highlights.length>0&&<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {highlights.map(([k,v])=>(
                  <div key={k} style={{background:"rgba(255,255,255,.04)",borderRadius:6,padding:"4px 9px"}}>
                    <div style={{fontSize:9,color:"#6b82a0",textTransform:"uppercase",letterSpacing:".3px"}}>{METRIC_LABELS[k]||k}</div>
                    <div style={{fontSize:13,fontWeight:700}}>{v}</div>
                  </div>
                ))}
              </div>}
              {log.notes&&<div style={{marginTop:8,fontSize:12,color:"#8fa3be",fontStyle:"italic",lineHeight:1.5,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>"{log.notes}"</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}


// ── BADGE DEFINITIONS ──────────────────────────────────────────
const BADGE_DEFS=[
  {id:"bat_bar",icon:"🪄",name:"Bat Bar",desc:"500+ swings in a week",color:"#e84040",check:(logs)=>{
    const week=new Date();week.setDate(week.getDate()-7);
    const swings=logs.filter(l=>l.type==="Hitting"&&new Date(l.created_at)>week).reduce((s,l)=>s+(parseInt(l.metrics?.swings||0)+parseInt(l.metrics?.teeSwings||0)+parseInt(l.metrics?.bpSwings||0)),0);
    return swings>=500;
  }},
  {id:"strong_arm",icon:"💪",name:"Strong Arm",desc:"4 workouts in a week",color:"#e8a020",check:(logs)=>{
    const week=new Date();week.setDate(week.getDate()-7);
    const wkts=logs.filter(l=>["Weight Training","Workout"].includes(l.type)&&new Date(l.created_at)>week).length;
    return wkts>=4;
  }},
  {id:"iron_man",icon:"🏋️",name:"Iron Man",desc:"10 workouts in a month",color:"#3a9be8",check:(logs)=>{
    const month=new Date();month.setDate(month.getDate()-30);
    return logs.filter(l=>["Weight Training","Workout"].includes(l.type)&&new Date(l.created_at)>month).length>=10;
  }},
  {id:"game_ready",icon:"🏟️",name:"Game Ready",desc:"Logged a game",color:"#e67e22",check:(logs)=>logs.some(l=>l.type==="Game")},
  {id:"showcase_star",icon:"⭐",name:"Showcase Star",desc:"Logged a showcase",color:"#f1c40f",check:(logs)=>logs.some(l=>l.type==="Showcase")},
  {id:"journal_king",icon:"📓",name:"Journal King",desc:"10+ journal entries",color:"#9b59b6",check:(logs)=>logs.length>=10},
  {id:"arm_care",icon:"🎯",name:"Arm Day",desc:"5 throwing sessions",color:"#27c97a",check:(logs)=>logs.filter(l=>l.type==="Throwing").length>=5},
  {id:"field_general",icon:"🥎",name:"Field General",desc:"5 fielding sessions",color:"#2ecc71",check:(logs)=>logs.filter(l=>l.type==="Fielding").length>=5},
  {id:"grinder",icon:"🔥",name:"Grinder",desc:"30+ total sessions",color:"#e74c3c",check:(logs)=>logs.length>=30},
];

function BadgeShelf({logs,compact=false}){
  const safeLogs=Array.isArray(logs)?logs:[];
  const earned=BADGE_DEFS.filter(b=>{try{return b.check(safeLogs);}catch(e){return false;}});
  const unearned=BADGE_DEFS.filter(b=>!earned.includes(b));
  if(compact)return(
    <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
      {earned.map(b=><div key={b.id} title={b.name+": "+b.desc} style={{width:32,height:32,borderRadius:"50%",background:`${b.color}25`,border:`2px solid ${b.color}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,cursor:"default"}}>{b.icon}</div>)}
      {earned.length===0&&<div style={{fontSize:11,color:"#6b82a0"}}>No badges yet</div>}
    </div>
  );
  return(
    <div>
      {earned.length>0&&<><div className="ds">Earned ({earned.length})</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(130px,1fr))",gap:8,marginBottom:16}}>
        {earned.map(b=><div key={b.id} style={{background:`${b.color}12`,border:`1px solid ${b.color}40`,borderRadius:10,padding:"12px 10px",textAlign:"center"}}>

function ActivityFeed({athlete,programs,selfLogs,sessions,logs}){

  Object.values(sessions||{}).forEach(s=>{if(s.completed_at&&s.athlete_id===athlete?.id){const prog=(programs||[]).find(p=>p.id===s.program_id);events.push({ts:s.completed_at,kind:"complete",icon:"✅",color:"#9b59b6",title:"Completed: "+(prog?.name||"Workout"),sub:s.duration_minutes?"⏱ "+Math.floor(s.duration_minutes/60)+"h "+s.duration_minutes%60+"m":"",type:"Workout"});}});
  events.sort((a,b)=>new Date(b.ts)-new Date(a.ts));
