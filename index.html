      <div className="sb2" style={{cursor:"pointer"}} onClick={()=>setCoachPage("athletes")}><div className="sv">{athletes.length}</div><div className="sl">Athletes</div></div>
      <div className="sb2"><div className="sv">{programs.length}</div><div className="sl">Programs</div></div>
      <div className="sb2"><div className="sv">{avgPct}%</div><div className="sl">Avg Complete</div></div>
      <div className="sb2"><div className="sv">{athletes.filter(a=>a.committed).length}</div><div className="sl">Committed</div></div>
    </div>
    <div className="dg">
      <div className="card">
        <div className="ds">Go To</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8}}>
          {[["checkin","✅","Check-In"],["athletes","👤","Athletes"],["games","⚾","Games"],["programs","🏋️","Workouts"],["groups","🏷️","Groups"],["notifications","🔔","Notifications"],...(isAdmin?[["coaches","🛡️","Coaches"]]:[])].map(([id,ic,lb])=>(
            <button key={id} onClick={()=>setCoachPage(id)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6,padding:"18px 8px",borderRadius:10,border:"1px solid rgba(255,255,255,.08)",background:"rgba(255,255,255,.03)",cursor:"pointer",color:"#eef2f8",transition:"all .15s"}}>
              <span style={{fontSize:24}}>{ic}</span>
              <span style={{fontSize:12,fontWeight:700}}>{lb}</span>
            </button>
          ))}
        </div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <div className="card">
          <div className="ds">By Position Group</div>
          {Object.keys(POSITION_GROUPS).map(g=>{
            const grpAthletes=athletes.filter(a=>getPG(a.position)===g);
            if(!grpAthletes.length)return null;
            const open=expandedGroup===g;
            return(<div key={g} style={{marginBottom:4}}>
              <div onClick={()=>setExpandedGroup(open?null:g)} style={{display:"flex",alignItems:"center",gap:7,padding:"6px 8px",borderRadius:7,cursor:"pointer",background:open?`${gColor[g]}15`:"transparent",border:`1px solid ${open?gColor[g]:"transparent"}`}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:gColor[g],flexShrink:0}}/>
                <div style={{flex:1,fontSize:12,fontWeight:open?700:400,color:open?gColor[g]:"#eef2f8"}}>{g}</div>
                <span className="bdg bg3">{grpAthletes.length}</span>
                <span style={{fontSize:10,color:"#6b82a0",marginLeft:2}}>{open?"▲":"▼"}</span>
              </div>
              {open&&<div style={{borderLeft:`2px solid ${gColor[g]}40`,marginLeft:11,paddingLeft:4,marginTop:2}}>
                {grpAthletes.map(a=><AthRow key={a.id} a={a}/>)}
              </div>}
            </div>);
          })}
        </div>
        <div className="card">
          <div className="ds">By Grad Year</div>
          {GRAD_YEARS.map(yr=>{
            const yrAthletes=athletes.filter(a=>a.grad===yr);
            if(!yrAthletes.length)return null;
            const open=expandedGrad===yr;
            return(<div key={yr} style={{marginBottom:4}}>
              <div onClick={()=>setExpandedGrad(open?null:yr)} style={{display:"flex",alignItems:"center",gap:7,padding:"6px 8px",borderRadius:7,cursor:"pointer",background:open?`${grColor[yr]}15`:"transparent",border:`1px solid ${open?grColor[yr]:"transparent"}`}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:grColor[yr]||"#888",flexShrink:0}}/>
                <div style={{flex:1,fontSize:12,fontWeight:open?700:400,color:open?grColor[yr]:"#eef2f8"}}>Class of {yr}</div>
                <span className="bdg bg3">{yrAthletes.length}</span>
                <span style={{fontSize:10,color:"#6b82a0",marginLeft:2}}>{open?"▲":"▼"}</span>
              </div>
              {open&&<div style={{borderLeft:`2px solid ${grColor[yr]||"#888"}40`,marginLeft:11,paddingLeft:4,marginTop:2}}>
                {yrAthletes.map(a=><AthRow key={a.id} a={a}/>)}
              </div>}
            </div>);
          })}
          {activeAgeGroups.map(ag=>{
            const agAthletes=athletes.filter(a=>a.age_group===ag);
            if(!agAthletes.length)return null;
            const open=expandedAge===ag;
            return(<div key={ag} style={{marginBottom:4}}>
              <div onClick={()=>setExpandedAge(open?null:ag)} style={{display:"flex",alignItems:"center",gap:7,padding:"6px 8px",borderRadius:7,cursor:"pointer",background:open?"rgba(58,155,232,.1)":"transparent",border:`1px solid ${open?"#3a9be8":"transparent"}`}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:"#3a9be8",flexShrink:0}}/>
                <div style={{flex:1,fontSize:12,fontWeight:open?700:400,color:open?"#3a9be8":"#eef2f8"}}>{ag}</div>
                <span className="bdg bg4">{agAthletes.length}</span>
                <span style={{fontSize:10,color:"#6b82a0",marginLeft:2}}>{open?"▲":"▼"}</span>
              </div>
              {open&&<div style={{borderLeft:"2px solid rgba(58,155,232,.4)",marginLeft:11,paddingLeft:4,marginTop:2}}>
                {agAthletes.map(a=><AthRow key={a.id} a={a}/>)}
              </div>}
            </div>);
          })}
        </div>
      </div>
    </div>
  </>);
}

function AthRoster({athletes,allAthletes,programs,calcPct,gradF,setGradF,groupF,setGroupF,onView,onAdd}){
  const[search,setSearch]=useState("");
  const gyrs=[...new Set((allAthletes||athletes).map(a=>a.grad))].filter(Boolean).sort();
  const pgs=[...new Set((allAthletes||athletes).map(a=>getPG(a.position)))];
  const displayed=search?athletes.filter(a=>
    (a.name||"").toLowerCase().includes(search.toLowerCase())||
    (a.position||"").toLowerCase().includes(search.toLowerCase())||
    (a.high_school||"").toLowerCase().includes(search.toLowerCase())||
    (a.email||"").toLowerCase().includes(search.toLowerCase())
  ):athletes;
  return(<>
    <div className="ph"><div className="pt">Athlete <em>Roster</em></div><button className="btn bg" onClick={onAdd}>+ Add Athlete</button></div>
    <div style={{marginBottom:12}}><input className="inp" placeholder="🔍 Search by name, position, school..." value={search} onChange={e=>setSearch(e.target.value)} style={{maxWidth:400}}/></div>
    <div className="fb">
      <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginRight:3}}>Class/Age:</span>
      <button className={`fc ${!gradF?"on":""}`} onClick={()=>setGradF(null)}>All</button>
      {gyrs.map(yr=><button key={yr} className={`fc ${gradF===yr?"on":""}`} onClick={()=>setGradF(yr)}><span className="dot" style={{background:grColor[yr]||"#888"}}/>{yr}</button>)}
      {AGE_GROUPS.filter(g=>(allAthletes||athletes).some(a=>a.age_group===g)).map(g=><button key={g} className={`fc ${gradF===g?"on":""}`} onClick={()=>setGradF(g)}><span className="dot" style={{background:"#3a9be8"}}/>{g}</button>)}
      <div style={{width:1,height:16,background:"rgba(255,255,255,.1)",margin:"0 4px"}}/>
      <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginRight:3}}>Group:</span>
      <button className={`fc ${!groupF?"on":""}`} onClick={()=>setGroupF(null)}>All</button>
      {pgs.map(g=><button key={g} className={`fc ${groupF===g?"on":""}`} onClick={()=>setGroupF(g)}><span className="dot" style={{background:gColor[g]}}/>{g}</button>)}
    </div>
    {displayed.length===0&&<div className="empty"><div className="ei">👤</div><div className="et">No athletes match</div></div>}
    <div className="ag">
      {displayed.map(a=>{
        const prog=programs.find(p=>p.athleteId===a.id);const pct=prog?calcPct(prog):0;const g=getPG(a.position);
        return(<div key={a.id} className="card cc" onClick={()=>onView(a)} style={{display:"flex",flexDirection:"column",gap:10}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div className="av">{a.avatar||ini(a.name)}</div>
            <div><div style={{fontWeight:700,fontSize:15}}>{a.name}</div><div style={{fontSize:11,color:"#8fa3be"}}>{a.position}</div></div>
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
            <span className="tag" style={{background:`${gColor[g]}20`,color:gColor[g],border:`1px solid ${gColor[g]}40`}}>{g}</span>
            {a.grad&&<span className="tag" style={{background:`${grColor[a.grad]||"#555"}20`,color:grColor[a.grad]||"#aaa",border:`1px solid ${grColor[a.grad]||"#555"}40`}}>'{String(a.grad).slice(2)}</span>}
            {!a.grad&&a.age_group&&<span className="tag" style={{background:"rgba(58,155,232,.15)",color:"#3a9be8",border:"1px solid rgba(58,155,232,.3)"}}>{a.age_group}</span>}
            {a.committed&&<span className="bdg bg2">✓ Committed</span>}
          </div>
          <div style={{fontSize:11,color:"#6b82a0"}}>🏆 {a.dream_school||"Dream school TBD"}</div>
          <div>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#6b82a0",marginBottom:3}}><span>{prog?prog.name:"No program"}</span><span>{pct}%</span></div>
            <div className="pb"><div className="pf" style={{width:`${pct}%`}}/></div>
          </div>
        </div>);
      })}
    </div>
  </>);
}


function AthDetail({athlete:athleteProp,programs,logs,sessions,calcPct,getSess,isSaved,onBack,measHist,selfLogs=[],onSaveMeas,onSaveAth,games=[]}){
  const[athlete,setAthlete]=useState(athleteProp);
  useEffect(()=>setAthlete(athleteProp),[athleteProp?.id]);
  const[tab,setTab]=useState("profile");
  const[editing,setEditing]=useState(false);
  const[form,setForm]=useState({...athleteProp,dreamSchool:athleteProp.dream_school||"",gpa:athleteProp.gpa||"",height:athleteProp.height||"",weight:athleteProp.weight||"",useAge:!!(athleteProp.age_group&&!athleteProp.grad)});
  const[addMeas,setAddMeas]=useState(false);
  const[newMeas,setNewMeas]=useState({});
  const athProgs=programs.filter(p=>{
    if(p.athleteId===athlete.id)return true;
    if(!p.isGroup&&!p.is_group_program)return false;
    const g=getPG(athlete.position);
    const tg=p.targetGrads||p.target_grads||[];
    const tt=p.targetGroups||p.target_groups||[];
    const gradMatch=!tg.length||tg.some(yr=>String(yr)===String(athlete.grad));
    const groupMatch=!tt.length||tt.includes(g);
    return gradMatch&&groupMatch;
  }).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  return(<>
    <button className="bb" onClick={onBack}>← Roster</button>
    <div className="ph">
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div className="av" style={{width:50,height:50,fontSize:16}}>{athlete.avatar||ini(athlete.name)}</div>
        <div><div style={{fontSize:20,fontWeight:800}}>{athlete.name}</div><div style={{fontSize:11,color:"#6b82a0"}}>{athlete.position}{athlete.grad?`·Class of ${athlete.grad}`:athlete.age_group?`·${athlete.age_group}`:""}{athlete.email?`·${athlete.email}`:""}</div></div>
      </div>
      <div style={{display:"flex",gap:7}}>
        <button className="btn bgh bsm" onClick={()=>setEditing(!editing)}>✏️ Edit</button>
      </div>
    </div>
    <div style={{display:"flex",gap:2,borderBottom:"1px solid rgba(255,255,255,.07)",marginBottom:14}}>
      {["profile","gameday","recruiting","workouts","history","journal","activity","badges"].map(t=>(
        <button key={t} onClick={()=>setTab(t)} style={{padding:"7px 13px",border:"none",background:"transparent",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:".4px",color:tab===t?"#e8a020":"#6b82a0",borderBottom:tab===t?"2px solid #e8a020":"2px solid transparent",cursor:"pointer"}}>{t==="gameday"?"Game Day":t}</button>
      ))}
    </div>
    {tab==="profile"&&(editing?(
      <div className="card" style={{marginBottom:14}}>
        <div className="fg2"><div className="fg"><label>Name</label><input className="inp" value={form.name||""} onChange={e=>setForm(p=>({...p,name:e.target.value}))}/></div><div className="fg"><label>Position</label><select className="inp" value={form.position||""} onChange={e=>setForm(p=>({...p,position:e.target.value}))}>{ALL_POS.map(p=><option key={p}>{p}</option>)}</select></div></div>
        <div className="fg">
          <label>Class / Age Group</label>
          <div style={{display:"flex",gap:6,marginBottom:6}}>
            <button onClick={()=>setForm(p=>({...p,useAge:false,age_group:null}))} style={{flex:1,padding:"6px",borderRadius:7,border:`1px solid ${!form.useAge?"#e8a020":"rgba(255,255,255,.12)"}`,background:!form.useAge?"rgba(232,160,32,.08)":"transparent",color:!form.useAge?"#e8a020":"#8fa3be",fontSize:10,fontWeight:700,cursor:"pointer"}}>Grad Year</button>
            <button onClick={()=>setForm(p=>({...p,useAge:true,grad:null}))} style={{flex:1,padding:"6px",borderRadius:7,border:`1px solid ${form.useAge?"#e8a020":"rgba(255,255,255,.12)"}`,background:form.useAge?"rgba(232,160,32,.08)":"transparent",color:form.useAge?"#e8a020":"#8fa3be",fontSize:10,fontWeight:700,cursor:"pointer"}}>Age Group</button>
          </div>
          {!form.useAge
            ?<select className="inp" value={form.grad||2027} onChange={e=>setForm(p=>({...p,grad:parseInt(e.target.value),age_group:null}))}>{GRAD_YEARS.map(y=><option key={y}>{y}</option>)}</select>
            :<select className="inp" value={form.age_group||""} onChange={e=>setForm(p=>({...p,age_group:e.target.value,grad:null}))}><option value="">Select age group...</option>{AGE_GROUPS.map(g=><option key={g}>{g}</option>)}</select>
          }
        </div>
        <div className="fg2">
          <div className="fg"><label>GPA</label><input className="inp" value={form.gpa||""} onChange={e=>setForm(p=>({...p,gpa:e.target.value}))}/></div>
          <div className="fg"><label>Height</label><input className="inp" value={form.height||""} onChange={e=>setForm(p=>({...p,height:e.target.value}))}/></div>
        </div>
        <div className="fg3"><div className="fg"><label>Weight</label><input className="inp" value={form.weight||""} onChange={e=>setForm(p=>({...p,weight:e.target.value}))}/></div><div className="fg"><label>Bats</label><select className="inp" value={form.bats||"R"} onChange={e=>setForm(p=>({...p,bats:e.target.value}))}><option>R</option><option>L</option><option>S</option></select></div><div className="fg"><label>Throws</label><select className="inp" value={form.throws||"R"} onChange={e=>setForm(p=>({...p,throws:e.target.value}))}><option>R</option><option>L</option></select></div></div>
        <div className="fg3"><div className="fg"><label>High School</label><input className="inp" placeholder="School name" value={form.high_school||""} onChange={e=>setForm(p=>({...p,high_school:e.target.value}))}/></div><div className="fg"><label>Dream School</label><input className="inp" value={form.dreamSchool||""} onChange={e=>setForm(p=>({...p,dreamSchool:e.target.value}))}/></div><div className="fg"><label>Committed</label><select className="inp" value={form.committed?"yes":"no"} onChange={e=>setForm(p=>({...p,committed:e.target.value==="yes"}))}><option value="no">No</option><option value="yes">Yes</option></select></div></div>
        <div style={{display:"flex",gap:7,justifyContent:"flex-end"}}><button className="btn bgh bsm" onClick={()=>setEditing(false)}>Cancel</button><button className="btn bg bsm" onClick={async()=>{const saveData={...form,id:athlete.id,dreamSchool:form.dreamSchool||form.dream_school,grad:form.useAge?null:form.grad,age_group:form.useAge?form.age_group:null};const fresh=await onSaveAth(saveData);if(fresh){setAthlete(fresh);setForm({...fresh,dreamSchool:fresh.dream_school||"",gpa:fresh.gpa||"",height:fresh.height||"",weight:fresh.weight||"",useAge:!!(fresh.age_group&&!fresh.grad)});}setEditing(false);}}>Save</button></div>
      </div>
    ):(
      <div className="sr">
        {[{l:"Position",v:athlete.position||"—"},{l:"Height",v:athlete.height||"—"},{l:"Weight",v:athlete.weight?`${athlete.weight} lbs`:"—"},{l:"Bats/Throws",v:(athlete.bats&&athlete.throws)?`${athlete.bats}/${athlete.throws}`:"—"},{l:"GPA",v:athlete.gpa||"—"},{l:"High School",v:athlete.high_school||"—"},{l:"Grad",v:athlete.grad||athlete.age_group||"—"},{l:"Dream School",v:athlete.dream_school||form.dreamSchool||"—"},{l:"Committed",v:athlete.committed?"✅ Yes":"No"}].map(i=>(
          <div key={i.l} className="sb2"><div className="sv" style={{fontSize:14,wordBreak:"break-word"}}>{i.v}</div><div className="sl">{i.l}</div></div>
        ))}
      </div>
    ))}
    {tab==="recruiting"&&<div>
      <div style={{marginBottom:14}}>
        <div className="ds">Current Measurables</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:8}}>
          {MEASURABLES.map(m=>{const val=athlete.measurables?.[m.key];return(<div key={m.key} className="mc"><div style={{fontSize:18,marginBottom:5}}>{m.icon}</div>{val?<><div className="mv">{val}</div><div style={{fontSize:10,color:"#6b82a0"}}>{m.unit}</div></>:<div style={{color:"#6b82a0",fontSize:16}}>—</div>}<div style={{fontSize:10,color:"#8fa3be",marginTop:2}}>{m.label}</div></div>);})}
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <div className="ds" style={{marginBottom:0}}>History</div>
        <button className="btn bg bsm" onClick={()=>setAddMeas(!addMeas)}>+ Entry</button>
      </div>
      {addMeas&&<div className="card" style={{marginBottom:12}}>
        <div className="fg3">{MEASURABLES.map(m=><div key={m.key} className="fg"><label>{m.icon} {m.label}</label><input className="inp" placeholder="—" value={newMeas[m.key]||""} onChange={e=>setNewMeas(p=>({...p,[m.key]:e.target.value}))}/></div>)}</div>
        <div style={{display:"flex",gap:7,justifyContent:"flex-end"}}><button className="btn bgh bsm" onClick={()=>setAddMeas(false)}>Cancel</button><button className="btn bg bsm" onClick={async()=>{const ok=await onSaveMeas(newMeas);if(ok){const merged={...(athlete.measurables||{}),...Object.fromEntries(Object.entries(newMeas).filter(([k,v])=>v))};setAthlete(p=>({...p,measurables:merged}));setNewMeas({});setAddMeas(false);}}}>Save Entry</button></div>
      </div>}
    </div>}
    {tab==="gameday"&&<AthDetailGameDay athlete={athlete} games={games}/>}
    {tab==="workouts"&&<AthDetailWorkouts athProgs={athProgs} athlete={athlete} logs={logs} sessions={sessions} calcPct={calcPct} isSaved={isSaved} getSess={getSess}/>}
    {tab==="journal"&&<SessionJournal logs={selfLogs.map(l=>({...l,metrics:typeof l.metrics==="string"?JSON.parse(l.metrics||"{}"):l.metrics||{},notes:l.notes||""}))} isCoach={true}/>}
    {tab==="activity"&&<ActivityFeed athlete={athlete} programs={programs} selfLogs={selfLogs} sessions={sessions} logs={logs}/>}
    {tab==="badges"&&<><div style={{marginBottom:12}}><BadgeShelf logs={selfLogs} compact={false}/></div></>}
    {tab==="history"&&<div>
      {athProgs.map(prog=>(
        <div key={prog.id} style={{marginBottom:18}}>
          <div style={{fontSize:14,fontWeight:700,color:"#e8a020",marginBottom:8}}>{prog.name} — {prog.week}</div>
          {(prog.days||[]).map(day=>(
            <div key={day.day} style={{marginBottom:10}}>
              <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#8fa3be",marginBottom:5}}>{day.day}</div>
              <div className="card" style={{padding:0,overflow:"hidden"}}>
                <table className="tbl"><thead><tr><th>Exercise</th><th>Prescribed</th><th>Reps</th><th>Weight</th><th>Status</th></tr></thead>
                <tbody>{(day.exercises||[]).map(ex=>{const log=logs[`${prog.id}-${athlete.id}-${ex.id}`]||{};return(<tr key={ex.id}><td style={{fontWeight:600}}>{ex.name}</td><td style={{color:"#6b82a0"}}>{ex.sets}×{ex.reps}</td><td>{log.reps||"—"}</td><td>{log.weight||"—"}</td><td>{log.saved?<span className="bdg bg2">✓</span>:<span className="bdg" style={{background:"rgba(255,255,255,.05)",color:"#6b82a0"}}>—</span>}</td></tr>);})}</tbody>
                </table>
              </div>
            </div>
          ))}
        </div>
      ))}
    </div>}
  </>);
}

function ActivityFeed({athlete,programs,selfLogs=[],sessions={},logs={}}){
  const sessEvents=Object.values(sessions||{}).filter(s=>s.athlete_id===athlete.id&&s.completed_at).map(s=>{
    const prog=programs.find(p=>p.id===s.program_id);
    return{date:s.completed_at,icon:"✅",title:`Completed: ${prog?.name||"Workout"}`,sub:s.duration_minutes?`${s.duration_minutes} min`:""};
  });
  const logEvents=(selfLogs||[]).map(l=>({date:l.created_at,icon:"📝",title:`Logged: ${l.type||"Session"}`,sub:l.notes||""}));
  const all=[...sessEvents,...logEvents].filter(e=>e.date).sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(all.length===0)return<div className="empty"><div className="ei">📭</div><div className="et">No activity yet</div><div className="es">Completed workouts and logged sessions will show up here.</div></div>;
  return(
    <div>
      {all.map((e,i)=>(
        <div key={i} style={{display:"flex",gap:10,padding:"9px 0",borderBottom:"1px solid rgba(255,255,255,.06)"}}>
          <div style={{fontSize:16,flexShrink:0}}>{e.icon}</div>
          <div style={{flex:1,minWidth:0}}>

function computeBadges(logs){
  const badges=[];
  const count=logs.length;
  [[1,"🌱","First Log"],[10,"🔥","10 Logged"],[25,"💪","25 Logged"],[50,"🏆","50 Logged"],[100,"👑","Century Club"]].forEach(([n,icon,label])=>{
    if(count>=n)badges.push({icon,label});
  });
  const types=new Set(logs.map(l=>l.type));
  if(types.size>=4)badges.push({icon:"🌟",label:"Well-Rounded"});
  if(types.has("Game"))badges.push({icon:"🏟️",label:"Gamer"});
  if(types.has("Showcase"))badges.push({icon:"⭐",label:"Showcase Ready"});
  const days=[...new Set(logs.map(l=>(l.created_at||"").slice(0,10)).filter(Boolean))].sort().reverse();
  let streak=days.length?1:0;
  for(let i=1;i<days.length;i++){
    const diff=Math.round((new Date(days[i-1])-new Date(days[i]))/86400000);
    if(diff===1)streak++;else break;
  }
  if(streak>=3)badges.push({icon:"⚡",label:`${streak}-Day Streak`});
  if(streak>=7)badges.push({icon:"🔥",label:"Iron Will"});
  return badges;
}

function BadgeShelf({logs=[],compact=false}){
  const badges=computeBadges(logs||[]);
  if(badges.length===0){
    if(compact)return null;
    return<div className="empty"><div className="ei">🏅</div><div className="et">No badges yet</div><div className="es">Log a session to start earning them.</div></div>;
  }
  if(compact){
    return(
      <div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:4}}>
        {badges.slice(0,4).map(b=>(<span key={b.label} title={b.label} style={{fontSize:14,background:"rgba(232,160,32,.12)",borderRadius:6,padding:"2px 6px"}}>{b.icon}</span>))}
        {badges.length>4&&<span style={{fontSize:10,color:"#6b82a0",alignSelf:"center"}}>+{badges.length-4}</span>}
      </div>
    );
  }
  return(
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(110px,1fr))",gap:10}}>
      {badges.map(b=>(
        <div key={b.label} className="card" style={{textAlign:"center",padding:"14px 8px"}}>
          <div style={{fontSize:28,marginBottom:4}}>{b.icon}</div>
          <div style={{fontSize:11,fontWeight:700}}>{b.label}</div>
        </div>
      ))}
    </div>
  );
}

function inGameRange(dateStr,range){
  if(range==="all")return true;
  if(!dateStr)return false;
  const d=new Date(dateStr+"T00:00:00");
  const now=new Date();
  if(range==="week"){const cutoff=new Date(now);cutoff.setDate(now.getDate()-7);return d>=cutoff&&d<=now;}
  if(range==="month"){const cutoff=new Date(now);cutoff.setDate(now.getDate()-30);return d>=cutoff&&d<=now;}
  return true;
}

          <td><div style={{display:"flex",alignItems:"center",gap:6,minWidth:90}}><div style={{flex:1,height:5,background:"rgba(255,255,255,.06)",borderRadius:3,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:pct===100?"#27c97a":"linear-gradient(90deg,#e8a020,#f5c060)",borderRadius:3}}/></div><span style={{fontSize:11,fontWeight:700,color:pct===100?"#27c97a":"#e8a020"}}>{pct}%</span></div></td>
          <td style={{fontSize:10,color:"#6b82a0"}}>{sess.started_at?fmtT(sess.started_at):"—"}</td>
          <td style={{fontSize:11,color:"#e8a020",fontWeight:600}}>{dur?fmtD(dur):"—"}</td>
          <td><button className="btn bgh bsm" onClick={()=>setViewAth(a)}>View Log</button></td>
        </tr>);
      })}</tbody></table>
    </div>}
    {(prog.days||[]).map((day,di)=>(
      <div key={di} className="db">
        <div className="dh"><div className="dl">{day.day}</div><span className="bdg bg4">{(day.exercises||[]).length} exercises</span></div>
        <table className="tbl"><thead><tr><th>Exercise</th><th>Sets</th><th>Reps</th><th>Load</th></tr></thead>
        <tbody>{(day.exercises||[]).map(ex=><tr key={ex.id}><td style={{fontWeight:600}}>{ex.name}</td><td>{ex.sets}</td><td>{ex.reps}</td><td>{ex.weight||"—"}</td></tr>)}</tbody></table>
      </div>
    ))}
  </>);
}

function MsgsPage({profile,athletes,messages,sendMsg,chatPartner,setChatPartner}){
  const[showBC,setShowBC]=useState(false);
  const[bcTxt,setBcTxt]=useState("");
  const[bcGrads,setBcGrads]=useState([]);
  const[bcGroups,setBcGroups]=useState([]);
  const[chatTxt,setChatTxt]=useState("");
  const bottomRef=useRef(null);
  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});},[messages.length,chatPartner]);
  const convo=chatPartner?messages.filter(m=>(m.sender_id===profile.id&&m.recipient_id===chatPartner.id)||(m.sender_id===chatPartner.id&&m.recipient_id===profile.id)):[];
  const tc=athletes.filter(a=>{const g=getPG(a.position);return(!bcGrads.length||bcGrads.includes(a.grad))&&(!bcGroups.length||bcGroups.includes(g));}).length;
  const sendDirect=async()=>{if(!chatTxt.trim()||!chatPartner)return;await sendMsg(chatTxt.trim(),chatPartner.id);setChatTxt("");};
  const sendBC=async()=>{if(!bcTxt.trim())return;await sendMsg(bcTxt.trim(),null,true,bcGrads,bcGroups);setBcTxt("");setShowBC(false);};

  if(chatPartner)return(<>
    <button className="bb" onClick={()=>setChatPartner(null)}>← Messages</button>
    <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:14}}>
      <div className="av" style={{width:34,height:34,fontSize:12}}>{chatPartner.avatar||ini(chatPartner.name)}</div>
      <div><div style={{fontWeight:700}}>{chatPartner.name}</div><div style={{fontSize:10,color:"#6b82a0"}}>{chatPartner.position}·{chatPartner.grad}</div></div>
    </div>
    <div className="card" style={{padding:0,overflow:"hidden",display:"flex",flexDirection:"column",height:"calc(100vh - 280px)"}}>
      <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",gap:8,padding:14}}>
        {convo.length===0&&<div className="empty" style={{padding:"16px 0"}}><div className="ei">💬</div><div className="et" style={{fontSize:13}}>No messages yet</div></div>}
        {convo.map(m=>{const mine=m.sender_id===profile.id;return(<div key={m.id} className={`msgrow ${mine?"me":"them"}`}><div className={`msgbub ${mine?"me":"them"}`}>{m.content}</div><div className="msgt">{fmtT(m.created_at)}</div></div>);})}
        <div ref={bottomRef}/>
      </div>
      <div className="hc">
        <input className="inp" style={{flex:1}} placeholder={`Message ${chatPartner.name.split(" ")[0]}...`} value={chatTxt} onChange={e=>setChatTxt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendDirect()}/>
        <button className="btn bg bsm" onClick={sendDirect}>Send</button>
      </div>
    </div>
  </>);

  return(<>
    <div className="ph"><div className="pt">Messages <em>&amp; Broadcasts</em></div><button className="btn bg" onClick={()=>setShowBC(!showBC)}>📢 Broadcast</button></div>
    {showBC&&<div className="card" style={{marginBottom:16,borderColor:"rgba(232,160,32,.25)"}}>
      <div style={{fontWeight:700,fontSize:13,textTransform:"uppercase",color:"#e8a020",marginBottom:12}}>📢 Broadcast Message</div>
      <div style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.07)",borderRadius:8,padding:12,marginBottom:12}}>
        <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:7}}>Target Grad Years (empty = all)</div>
        <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:10}}>{GRAD_YEARS.map(yr=>{const on=bcGrads.includes(yr);return(<button key={yr} onClick={()=>setBcGrads(p=>on?p.filter(y=>y!==yr):[...p,yr])} style={{padding:"4px 10px",borderRadius:12,border:`1px solid ${on?grColor[yr]:"rgba(255,255,255,.12)"}`,background:on?`${grColor[yr]}20`:"transparent",color:on?grColor[yr]:"#8fa3be",fontSize:11,fontWeight:700,cursor:"pointer"}}>{on&&"✓ "}Class of {yr}</button>);})}</div>
        <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:7}}>Target Position Groups</div>
        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{Object.keys(POSITION_GROUPS).map(g=>{const on=bcGroups.includes(g);return(<button key={g} onClick={()=>setBcGroups(p=>on?p.filter(x=>x!==g):[...p,g])} style={{padding:"4px 10px",borderRadius:12,border:`1px solid ${on?gColor[g]:"rgba(255,255,255,.12)"}`,background:on?`${gColor[g]}20`:"transparent",color:on?gColor[g]:"#8fa3be",fontSize:11,fontWeight:700,cursor:"pointer"}}>{on&&"✓ "}{g}</button>);})}</div>
      </div>
      <div style={{background:"rgba(58,155,232,.06)",border:"1px solid rgba(58,155,232,.2)",borderRadius:7,padding:"7px 10px",marginBottom:10,fontSize:11,color:"#3a9be8"}}>📬 Sending to <strong>{tc} athlete{tc!==1?"s":""}</strong>{!bcGrads.length&&!bcGroups.length?" (entire roster)":""}</div>
      <textarea className="inp" placeholder="Message to athletes..." value={bcTxt} onChange={e=>setBcTxt(e.target.value)} style={{marginBottom:8}}/>
      <div style={{display:"flex",gap:7,justifyContent:"flex-end"}}><button className="btn bgh bsm" onClick={()=>setShowBC(false)}>Cancel</button><button className="btn bg bsm" onClick={sendBC} disabled={!bcTxt.trim()}>Send</button></div>
    </div>}
    <div className="ds">Direct Messages</div>
    <div style={{display:"flex",flexDirection:"column",gap:5}}>
      {athletes.length===0&&<div className="empty"><div className="ei">💬</div><div className="et">No athletes yet</div></div>}
      {athletes.map(a=>{
        const last=messages.filter(m=>(m.sender_id===profile.id&&m.recipient_id===a.id)||(m.sender_id===a.id&&m.recipient_id===profile.id)).slice(-1)[0];
        const unread=messages.filter(m=>m.sender_id===a.id&&m.recipient_id===profile.id&&!(m.read_by||[]).includes(profile.id)).length;
        return(<div key={a.id} className="card cc" style={{padding:"12px 14px",display:"flex",alignItems:"center",gap:10}} onClick={()=>setChatPartner(a)}>
          <div className="av" style={{width:34,height:34,fontSize:12}}>{a.avatar||ini(a.name)}</div>
          <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,fontSize:13}}>{a.name}</div><div style={{fontSize:10,color:"#6b82a0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{last?last.content:"No messages yet"}</div></div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
            {last&&<div style={{fontSize:9,color:"#6b82a0"}}>{fmtT(last.created_at)}</div>}
            {unread>0&&<span style={{background:"#3a9be8",color:"#fff",borderRadius:"50%",width:16,height:16,fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{unread}</span>}
          </div>
        </div>);
      })}
    </div>
  </>);
}

function NotifPanel({notifs,setNotifs,onClose,profile}){
  const markAll=async()=>{
    const r=await fetchWithRefresh(`${SURL}/rest/v1/notifications?recipient_id=eq.${profile.id}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=minimal"},body:JSON.stringify({read:true})});
    if(r.ok)setNotifs(p=>p.map(n=>({...n,read:true})));
    else{const t=await r.text();alert("Error: "+t);}
  };
  const clearAll=async()=>{
    if(!window.confirm("Clear all notifications?"))return;
    const r=await fetchWithRefresh(`${SURL}/rest/v1/notifications?recipient_id=eq.${profile.id}`,{method:"DELETE",headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    if(r.ok)setNotifs([]);
    else{const t=await r.text();alert("Error: "+t);}
  };
  return(
    <div className="notifp" onClick={e=>e.stopPropagation()}>
      <div style={{padding:"12px 14px",borderBottom:"1px solid rgba(255,255,255,.07)",display:"flex",alignItems:"center",gap:7}}>
        <div style={{fontWeight:700,fontSize:13,textTransform:"uppercase"}}>Notifications</div>
        <div style={{marginLeft:"auto",display:"flex",gap:5}}>
          <button className="btn bgh bsm" onClick={markAll}>Mark read</button>
          <button className="btn bgr bsm" onClick={clearAll}>Clear all</button>
          <button className="btn bgh bsm" onClick={onClose}>✕</button>
        </div>
      </div>
      <div style={{flex:1,overflowY:"auto",maxHeight:380}}>
        {notifs.length===0&&<div className="empty" style={{padding:"24px 14px"}}><div className="ei">🔔</div><div className="et" style={{fontSize:12}}>No notifications yet</div></div>}
        {notifs.map(n=>(
          <div key={n.id} onClick={async()=>{await fetchWithRefresh(`${SURL}/rest/v1/notifications?id=eq.${n.id}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=minimal"},body:JSON.stringify({read:true})});setNotifs(p=>p.map(x=>x.id===n.id?{...x,read:true}:x));}} style={{padding:"10px 14px",borderBottom:"1px solid rgba(255,255,255,.05)",cursor:"pointer",background:n.read?"transparent":"rgba(232,160,32,.03)"}}>
            <div style={{display:"flex",alignItems:"flex-start",gap:9}}>
              <div style={{width:26,height:26,borderRadius:"50%",background:n.type==="completed"?"rgba(39,201,122,.15)":"rgba(58,155,232,.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,flexShrink:0}}>{n.type==="completed"?"🏆":"▶"}</div>
              <div style={{flex:1}}>
                <div style={{fontSize:12,fontWeight:600}}><span style={{color:"#e8a020"}}>{n.athlete_name}</span> {n.type==="completed"?"completed":"started"} <span style={{color:"#eef2f8"}}>{n.program_name}</span></div>
                {n.duration_minutes&&<div style={{fontSize:10,color:"#27c97a",marginTop:1}}>⏱ {fmtD(n.duration_minutes)}</div>}
                <div style={{fontSize:9,color:"#6b82a0",marginTop:1}}>{fmtT(n.created_at)}</div>
              </div>
              {!n.read&&<div style={{width:6,height:6,borderRadius:"50%",background:"#e8a020",flexShrink:0,marginTop:3}}/>}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function SessionJournal({logs,isCoach=false}){
  const[selected,setSelected]=useState(null);
  const[filterType,setFilterType]=useState("All");
  const STYPES_DEF={
    "Weight Training":{icon:"🏋️",color:"#e8a020"},
    "Hitting":{icon:"⚾",color:"#e84040"},
    "Throwing":{icon:"🎯",color:"#3a9be8"},
    "Fielding":{icon:"🥎",color:"#27c97a"},
    "Workout":{icon:"✅",color:"#9b59b6"},
    "Game":{icon:"🏟️",color:"#e67e22"},
    "Practice":{icon:"📋",color:"#8e44ad"},
    "Showcase":{icon:"⭐",color:"#f1c40f"},
  };
  const types=["All",...Object.keys(STYPES_DEF)];
  const filtered=filterType==="All"?logs:logs.filter(l=>l.type===filterType);

  const MetricRow=({label,value})=>value?(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid rgba(255,255,255,.05)"}}>
      <div style={{fontSize:12,color:"#8fa3be"}}>{label}</div>
      <div style={{fontSize:13,fontWeight:700,color:"#eef2f8"}}>{value}</div>
    </div>
  ):null;

  const METRIC_LABELS={
    // Weight Training
    exercises:"Exercises",sets:"Total Sets",topWeight:"Top Weight (lbs)",duration:"Duration (min)",
    // Hitting
    swings:"Total Swings",teeSwings:"Tee Swings",bpSwings:"BP Swings",exitVelo:"Best Exit Velo (mph)",
    // Throwing
    pitches:"Total Throws",bullpenPitches:"Bullpen Pitches",topVelo:"Top Velo (mph)",longTossMax:"Long Toss Max (ft)",
    // Fielding
    groundBalls:"Ground Balls",flyBalls:"Fly Balls",blocking:"Blocking Reps",throws:"Fielding Throws",
    // Workout (program completion)
    program:"Program",week:"Week",
    // Game
    opponent:"Opponent",result:"Result",atBats:"At Bats",hits:"Hits",rbi:"RBI",runs:"Runs Scored",stolenBases:"Stolen Bases",pitchingIP:"Innings Pitched",pitchingK:"Strikeouts",pitchingER:"Earned Runs",
    // Throwing / spin rates
    spinFB:"FB Spin Rate (rpm)",spinCB:"CB Spin Rate (rpm)",spinCH:"CH Spin Rate (rpm)",spinOther:"Other Spin Rate (rpm)",
    // Practice
    focus:"Focus Area",notes_highlights:"Highlights",
    // Showcase
    eventName:"Event Name",location:"Location",sixty:"60-Yard Dash",popTime:"Pop Time",offersReceived:"Offers Received",schoolsPresent:"Schools Present",
  };

  if(selected){
    const def=STYPES_DEF[selected.type]||{icon:"📋",color:"#e8a020"};
    const metrics=selected.metrics||{};
    return(
      <div>
        <button className="bb" onClick={()=>setSelected(null)}>← Journal</button>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
          <div style={{width:44,height:44,borderRadius:10,background:`${def.color}20`,border:`1px solid ${def.color}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{def.icon}</div>
          <div>
            <div style={{fontSize:18,fontWeight:800,color:def.color}}>{selected.type}</div>
            <div style={{fontSize:11,color:"#6b82a0"}}>{selected.date_label||new Date(selected.created_at).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</div>
          </div>
        </div>
        {Object.keys(metrics).length>0&&<div className="card" style={{marginBottom:12}}>
          <div className="ds">Session Numbers</div>
          {Object.entries(metrics).map(([k,v])=>v?<MetricRow key={k} label={METRIC_LABELS[k]||k} value={v}/>:null)}
        </div>}
        {selected.notes&&<div className="card" style={{borderColor:`${def.color}30`}}>
          <div className="ds">Notes</div>
          <div style={{fontSize:14,lineHeight:1.7,color:"#eef2f8",whiteSpace:"pre-wrap"}}>{selected.notes}</div>
        </div>}
        {!selected.notes&&!Object.values(metrics).some(Boolean)&&<div className="empty"><div className="ei">{def.icon}</div><div className="et">No details recorded</div></div>}
      </div>
    );
  }

  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <div style={{fontSize:14,fontWeight:700}}>{isCoach?"Athlete Session Journal":"My Session Journal"}</div>
        <div style={{fontSize:11,color:"#6b82a0"}}>{filtered.length} session{filtered.length!==1?"s":""}</div>
      </div>
      <div className="fb" style={{marginBottom:14}}>
        {types.map(t=>{
          const def=STYPES_DEF[t];
          return(<button key={t} className={`fc ${filterType===t?"on":""}`} onClick={()=>setFilterType(t)} style={filterType===t&&def?{borderColor:def.color,color:def.color,background:`${def.color}15`}:{}}>{def?def.icon+" ":""}{t}</button>);
        })}
      </div>
      {filtered.length===0&&<div className="empty"><div className="ei">📓</div><div className="et">No sessions yet</div><div className="es">{isCoach?"Athlete hasn't logged any sessions.":"Log a session to start your journal."}</div></div>}
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {filtered.map(log=>{
          const def=STYPES_DEF[log.type]||{icon:"📋",color:"#e8a020"};
          const metrics=log.metrics||{};
          const highlights=Object.entries(metrics).filter(([k,v])=>v).slice(0,3);
          return(
            <div key={log.id} className="card cc" onClick={()=>setSelected(log)} style={{borderLeft:`3px solid ${def.color}`,cursor:"pointer"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:highlights.length||log.notes?8:0}}>
                <div style={{fontSize:22}}>{def.icon}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:14,color:def.color}}>{log.type}</div>
                  <div style={{fontSize:11,color:"#6b82a0"}}>{log.date_label||new Date(log.created_at).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</div>
                </div>
                <span style={{fontSize:11,color:"#6b82a0"}}>View →</span>
              </div>
              {highlights.length>0&&<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {highlights.map(([k,v])=>(
                  <div key={k} style={{background:"rgba(255,255,255,.04)",borderRadius:6,padding:"4px 9px"}}>
                    <div style={{fontSize:9,color:"#6b82a0",textTransform:"uppercase",letterSpacing:".3px"}}>{METRIC_LABELS[k]||k}</div>

}

function WorkoutLogger({prog,athlete,getLog,updateLog,saveEx,markComplete,calcPct,onBack,getSess,reloadLogs}){
  const[fields,setFields]=useState({});
  const completing=useRef(false);
  // Reload logs from DB on mount to ensure fresh completion state
  useEffect(()=>{
    if(!reloadLogs)return;
    reloadLogs(prog.id);
  },[prog.id]);
  const pct=calcPct(prog);
  const sess=getSess?getSess(prog.id):{};
  const dur=sess.started_at&&sess.completed_at?Math.round((new Date(sess.completed_at)-new Date(sess.started_at))/60000):sess.started_at?Math.round((Date.now()-new Date(sess.started_at))/60000):null;
  useEffect(()=>{if(pct===100&&!sess.completed_at&&!completing.current){completing.current=true;markComplete(prog.id);}},[pct,sess.completed_at]);
  const handleSave=async(pId,exId)=>{
    const f=fields[exId]||{};
    if(f.reps)await updateLog(pId,exId,"reps",f.reps);
    if(f.weight)await updateLog(pId,exId,"weight",f.weight);
    if(f.sets)await updateLog(pId,exId,"sets",f.sets);
    if(f.notes)await updateLog(pId,exId,"notes",f.notes);
    await saveEx(pId,exId);
  };
  return(<>
    <button className="bb" onClick={onBack}>← My Workouts</button>
    <div className="ph">
      <div><div style={{fontSize:18,fontWeight:800}}>{prog.name}</div><div style={{fontSize:11,color:"#6b82a0"}}>{prog.week}</div></div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
        <span className="bdg bg3">{pct}% Done</span>
        {sess.started_at&&<span style={{fontSize:9,color:"#6b82a0"}}>Started {fmtT(sess.started_at)}{dur!==null?` · ${fmtD(dur)}`:""}</span>}
      </div>
    </div>
    {(prog.days||[]).map((day,di)=>(
      <div key={di} style={{marginBottom:18}}>
        <div style={{fontSize:14,fontWeight:800,textTransform:"uppercase",color:"#e8a020",letterSpacing:".8px",marginBottom:8,paddingBottom:6,borderBottom:"1px solid rgba(255,255,255,.07)"}}>{day.day}</div>
        {(day.exercises||[]).map(ex=>{
          const log=getLog(prog.id,ex.id);const saved=log.saved;
          const f=fields[ex.id]||{};
          const upd=(k,v)=>setFields(p=>({...p,[ex.id]:{...(p[ex.id]||{}),[k]:v}}));
          return(<div key={ex.id} className={`le ${saved?"done":""}`}>
            <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}>
              <div className="lex">{ex.name}</div>
              {saved&&<span className="bdg bg2" style={{marginLeft:"auto"}}>✓ Logged</span>}
            </div>
            <div className="lep">Prescribed: {ex.sets} sets × {ex.reps} reps @ {ex.weight}</div>
            {ex.notes&&<div style={{fontSize:10,color:"#e8a020",marginTop:1}}>Coach: {ex.notes}</div>}
            <div className="lg">
              <div className="lf"><label>Reps Done</label><input className="inp" type="number" placeholder={ex.reps} value={f.reps||log.reps||""} onChange={e=>upd("reps",e.target.value)}/></div>
              <div className="lf"><label>Weight/Load</label><input className="inp" placeholder={ex.weight} value={f.weight||log.weight||""} onChange={e=>upd("weight",e.target.value)}/></div>
              <div className="lf"><label>Sets Done</label><input className="inp" type="number" placeholder={ex.sets} value={f.sets||log.sets||""} onChange={e=>upd("sets",e.target.value)}/></div>
              <div className="lf lfw"><label>Notes</label><input className="inp" placeholder="How did it feel?" value={f.notes||log.notes||""} onChange={e=>upd("notes",e.target.value)}/></div>
            </div>
            <div style={{display:"flex",justifyContent:"flex-end",marginTop:8}}>
              <button className={`btn bsm ${saved?"bgh":"bgn"}`} onClick={()=>handleSave(prog.id,ex.id)}>{saved?"✓ Saved":"Save Exercise"}</button>
            </div>
          </div>);
        })}
      </div>
    ))}
    {pct===100&&<div className="cel"><div style={{fontSize:32}}>🏆</div><div style={{fontSize:20,fontWeight:800,marginTop:8}}>Workout Complete!</div>{dur&&<div style={{color:"#e8a020",fontWeight:700,marginTop:4}}>⏱ {fmtD(dur)}</div>}<div style={{fontSize:12,color:"#8fa3be",marginTop:5}}>Great work, {athlete.name?.split(" ")[0]}. Keep grinding.</div></div>}
  </>);
}

function GamesPage({athletes,weekends,teams,games,coaches,profile,onSaveWeekend,onDeleteWeekend,onSaveTeam,onDeleteTeam,onRenameTeam,onUpdateRoster,onSaveGame,onDeleteGame,onPatchGame,onImportTeamStats,onClearTeamStats}){
  const[importGameId,setImportGameId]=useState(null);
  const handleGameImport=(gameId,matchedRows)=>{
    const game=games.find(g=>g.id===gameId);
    if(!game)return;
    const newBatting={...(game.batting_stats||{})};
    const newFielding={...(game.imported_fielding||{})};
    let newLineup=[...(game.lineup||[])];
    let changedCount=0,addedCount=0;
    matchedRows.forEach(r=>{
      newBatting[r.athleteId]=r.batting;
      newFielding[r.athleteId]=r.fielding;
      const gcPos=primaryPosFromFielding(r.fielding);
      const idx=newLineup.findIndex(l=>l.athleteId===r.athleteId);
      if(idx!==-1){
        if(gcPos&&newLineup[idx].position!==gcPos){newLineup[idx]={...newLineup[idx],position:gcPos};changedCount++;}
      }else if(gcPos||r.batting.ab>0){
        newLineup.push({athleteId:r.athleteId,position:gcPos||""});
        addedCount++;
      }
    });
    if((changedCount||addedCount)&&!window.confirm(`GameChanger's data will update ${changedCount} player position${changedCount===1?"":"s"} and add ${addedCount} player${addedCount===1?"":"s"} to match what actually happened. Continue?`)){
      return;
    }
    onPatchGame(gameId,{lineup:newLineup,batting_stats:newBatting,imported_fielding:newFielding,tracking_complete:true});
    setImportGameId(null);
  };
  const[section,setSection]=useState("schedule");
  const[activeTeamId,setActiveTeamId]=useState(null);
  const[activeGameId,setActiveGameId]=useState(null);
  const[modal,setModal]=useState(null);

  const[teamWk,setTeamWk]=useState("");const[teamName,setTeamName]=useState("");
  const[rosterSearch,setRosterSearch]=useState("");
  const[showNewGame,setShowNewGame]=useState(false);
  const[gOpp,setGOpp]=useState("");const[gDate,setGDate]=useState("");const[gTime,setGTime]=useState("");const[gLoc,setGLoc]=useState("");
  const[editingTeamId,setEditingTeamId]=useState(null);
  const[editTeamName,setEditTeamName]=useState("");
  const[importTeamId,setImportTeamId]=useState(null);
  const[seasonStatsTeamId,setSeasonStatsTeamId]=useState(null);
