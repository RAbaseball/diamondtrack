function WeekendReport({weekend,teams,games,athletes}){
  const[selectedPlayerId,setSelectedPlayerId]=useState(null);
  const[showGroupReport,setShowGroupReport]=useState(false);
  const[chartTab,setChartTab]=useState("batting"); // batting | positions | bench
  const[chartScope,setChartScope]=useState("weekend"); // weekend | 30days | summer
  const[teamFilter,setTeamFilter]=useState("all");

  const weekendTeamIds=teams.filter(t=>t.weekend_id===weekend.id).map(t=>t.id);
  const allWeekendGames=games.filter(g=>weekendTeamIds.includes(g.team_id));
  const weekendTeams=teams.filter(t=>weekendTeamIds.includes(t.id));
  const weekendGames=teamFilter==="all"?allWeekendGames:allWeekendGames.filter(g=>g.team_id===teamFilter);

  // Scope filtering
  const now=new Date();
  const scopedGames=chartScope==="weekend"?weekendGames:games.filter(function(g){
    const gd=g.game_date?new Date(g.game_date+"T00:00:00"):null;
    if(!gd)return false;
    if(chartScope==="30days")return(now-gd)<30*24*60*60*1000;
    return(now-gd)<180*24*60*60*1000; // summer ~6 months
  });

  const scopeLabel=chartScope==="weekend"?"This Weekend":chartScope==="30days"?"Last 30 Days":"Full Summer";

  // Get all players from weekend games
  const playerIds=[...new Set(weekendGames.flatMap(g=>(g.lineup||[]).map(l=>l.athleteId)).filter(Boolean))];
  const weekendPlayers=athletes.filter(a=>playerIds.includes(a.id)).sort((a,b)=>a.name.localeCompare(b.name));

  // Compute stats for each player in scoped games
  const playerStats=weekendPlayers.map(function(p){
    const pGames=scopedGames.filter(g=>(g.batting_stats||{})[p.id]||(g.lineup||[]).some(l=>l.athleteId===p.id));
    const batting=computeBattingBySlot(p.id,scopedGames);
    const totalAb=batting.overall.ab||0;
    const totalH=batting.overall.h||0;
    const bb=batting.overall.bb||0;
    const hbp=batting.overall.hbp||0;
    const sf=batting.overall.sf||0;
    const avg=totalAb>0?totalH/totalAb:0;
    const obp=(totalAb+bb+hbp+sf)>0?(totalH+bb+hbp)/(totalAb+bb+hbp+sf):0;
    const slg=totalAb>0?((batting.overall.b1||0)+2*(batting.overall.b2||0)+3*(batting.overall.b3||0)+4*(batting.overall.hr||0))/totalAb:0;
    // Fielding
    let totalInn=0,benchInn=0;
    const posBreak={};
    scopedGames.forEach(function(g){
      const inn=g.innings||6;
      const imp=g.imported_fielding?.[p.id];
      if(imp&&imp.Total>0){
        FIELD_POS.forEach(function(pos){if(imp[pos]>0){posBreak[pos]=(posBreak[pos]||0)+imp[pos];totalInn+=imp[pos];}});
        benchInn+=Math.max(0,inn-imp.Total);
      } else {
        const inLineup=(g.lineup||[]).some(l=>l.athleteId===p.id);
        if(inLineup)totalInn+=inn; else benchInn+=inn;
      }
    });
    const availInn=totalInn+benchInn;
    const benchPct=availInn>0?Math.round(benchInn/availInn*100):0;
    return{player:p,batting:{avg,obp,slg,totalAb,totalH,pa:batting.overall.pa||0},fielding:{totalInn,benchInn,availInn,benchPct,posBreak}};
  }).filter(function(d){return d.batting.totalAb>0||d.fielding.availInn>0;});

  const fmtAvg=(n)=>n!=null?"."+String(Math.round(n*1000)).padStart(3,"0"):".---";

  // SVG bar chart helpers
  const BAR_H=18,BAR_GAP=6,LABEL_W=110,STAT_W=42,CHART_W=220;
  const chartH=(n)=>n*(BAR_H+BAR_GAP)+20;

  function BarChart({data,maxVal,color,fmt}){
    return(
      <svg width={LABEL_W+CHART_W+STAT_W+8} height={chartH(data.length)} style={{display:"block",overflow:"visible"}}>
        {data.map(function(d,i){
          const y=i*(BAR_H+BAR_GAP)+10;
          const barW=maxVal>0?Math.round((d.val/maxVal)*CHART_W):0;
          return(
            <g key={d.name}>
              <text x={LABEL_W-4} y={y+BAR_H/2+4} textAnchor="end" fontSize={10} fill="#8fa3be">{d.name.split(" ")[0]}</text>
              <rect x={LABEL_W} y={y} width={Math.max(barW,2)} height={BAR_H} fill={color} rx={3} opacity={0.85}/>
              <text x={LABEL_W+barW+5} y={y+BAR_H/2+4} fontSize={10} fill="#eef2f8" fontWeight="700">{fmt(d.val)}</text>
            </g>
          );
        })}
      </svg>
    );
  }

  if(showGroupReport){
    const rows=playerStats.map(function(d){
      const posEntries=Object.entries(d.fielding.posBreak).sort((a,b)=>b[1]-a[1]);
      return{player:d.player,stats:{total:scopedGames.filter(g=>(g.lineup||[]).some(l=>l.athleteId===d.player.id)).length,totalInnings:d.fielding.totalInn,availableInnings:d.fielding.availInn},batting:{avg:d.batting.avg,totalH:d.batting.totalH,totalAb:d.batting.totalAb,bySlot:{}},posBreakdown:Object.fromEntries(posEntries)};
    });
    const teamLabel=teamFilter==="all"?"All Teams":(weekendTeams.find(t=>t.id===teamFilter)?.name||"");
    return(
      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>
          <button className="bb" onClick={()=>setShowGroupReport(false)} style={{margin:0}}>← Back</button>
          <button className="btn bg bsm" onClick={()=>window.print()}>🖨️ Print</button>
        </div>
        <WeekendGroupReport weekend={weekend} rows={rows.filter(r=>!r.player.isGuest)} teamLabel={teamLabel}/>
      </div>
    );
  }

  if(selectedPlayerId){
    const d=playerStats.find(x=>x.player.id===selectedPlayerId);
    if(d)return(<WeekendPlayerDetail player={d.player} games={weekendGames} allGames={games} teams={teams} weekend={weekend} onBack={()=>setSelectedPlayerId(null)}/>);
  }

  const tabStyle=(t)=>({padding:"7px 14px",border:"none",background:"transparent",fontSize:11,fontWeight:700,textTransform:"uppercase",color:chartTab===t?"#e8a020":"#6b82a0",borderBottom:chartTab===t?"2px solid #e8a020":"2px solid transparent",cursor:"pointer",whiteSpace:"nowrap"});
  const scopeBtn=(s,lbl)=>(<button key={s} onClick={()=>setChartScope(s)} style={{padding:"4px 10px",borderRadius:6,border:"1px solid "+(chartScope===s?"#e8a020":"rgba(255,255,255,.12)"),background:chartScope===s?"rgba(232,160,32,.12)":"transparent",color:chartScope===s?"#e8a020":"#6b82a0",fontSize:11,fontWeight:700,cursor:"pointer"}}>{lbl}</button>);

  return(
    <div>
      {weekendTeams.length>1&&(
        <div className="fb" style={{marginBottom:12,flexWrap:"wrap"}}>
          <button className={`fc ${teamFilter==="all"?"on":""}`} onClick={()=>setTeamFilter("all")}>All Teams</button>
          {weekendTeams.map(t=><button key={t.id} className={`fc ${teamFilter===t.id?"on":""}`} onClick={()=>setTeamFilter(t.id)}>{t.name}</button>)}
        </div>
      )}

      {/* Chart controls */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:4}}>
        <div style={{display:"flex",borderBottom:"1px solid rgba(255,255,255,.07)"}}>
          <button style={tabStyle("batting")} onClick={()=>setChartTab("batting")}>📊 Batting</button>
          <button style={tabStyle("positions")} onClick={()=>setChartTab("positions")}>🛡️ Positions</button>
          <button style={tabStyle("bench")} onClick={()=>setChartTab("bench")}>⏱ Bench</button>
          <button style={tabStyle("players")} onClick={()=>setChartTab("players")}>👤 Players</button>
        </div>
        <div style={{display:"flex",gap:5}}>
          {[["weekend","Weekend"],["30days","30 Days"],["summer","Summer"]].map(([s,l])=>scopeBtn(s,l))}
        </div>
      </div>
      <div style={{fontSize:10,color:"#6b82a0",marginBottom:14}}>{scopeLabel} · {playerStats.length} players with data</div>

      {/* Batting chart */}
      {chartTab==="batting"&&<div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:12,marginBottom:16}}>
          {[["AVG","#e8a020",d=>d.batting.avg,fmtAvg],["OBP","#27c97a",d=>d.batting.obp,fmtAvg],["SLG","#3a9be8",d=>d.batting.slg,fmtAvg]].map(([label,color,getter,fmt])=>{
            const sorted=[...playerStats].filter(d=>getter(d)>0).sort((a,b)=>getter(b)-getter(a));
            const maxVal=sorted.length?getter(sorted[0]):1;
            return(
              <div key={label} style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.08)",borderRadius:9,padding:"12px 14px",overflowX:"auto"}}>
                <div style={{fontWeight:700,fontSize:12,color,marginBottom:10}}>{label}</div>
                {sorted.length===0?<div style={{fontSize:11,color:"#6b82a0"}}>No data</div>:(
                  <BarChart data={sorted.map(d=>({name:d.player.name,val:getter(d)}))} maxVal={maxVal} color={color} fmt={fmt}/>
                )}
              </div>
            );
          })}
        </div>
        {/* AB and hits table */}
        <div style={{background:"rgba(255,255,255,.02)",border:"1px solid rgba(255,255,255,.07)",borderRadius:9,overflow:"hidden"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead><tr style={{background:"rgba(255,255,255,.05)"}}>
              <th style={{padding:"8px 12px",textAlign:"left",color:"#6b82a0",fontSize:10,fontWeight:700}}>PLAYER</th>
              <th style={{padding:"8px 8px",textAlign:"center",color:"#6b82a0",fontSize:10,fontWeight:700}}>PA</th>
              <th style={{padding:"8px 8px",textAlign:"center",color:"#6b82a0",fontSize:10,fontWeight:700}}>AB</th>
              <th style={{padding:"8px 8px",textAlign:"center",color:"#6b82a0",fontSize:10,fontWeight:700}}>H</th>
              <th style={{padding:"8px 8px",textAlign:"center",color:"#e8a020",fontSize:10,fontWeight:700}}>AVG</th>
              <th style={{padding:"8px 8px",textAlign:"center",color:"#27c97a",fontSize:10,fontWeight:700}}>OBP</th>
              <th style={{padding:"8px 8px",textAlign:"center",color:"#3a9be8",fontSize:10,fontWeight:700}}>SLG</th>
            </tr></thead>
            <tbody>
              {[...playerStats].filter(d=>d.batting.totalAb>0).sort((a,b)=>b.batting.avg-a.batting.avg).map(function(d,i){
                return(<tr key={d.player.id} style={{borderTop:"1px solid rgba(255,255,255,.05)",background:i%2===0?"transparent":"rgba(255,255,255,.02)"}}>
                  <td style={{padding:"7px 12px",fontWeight:600,cursor:"pointer",color:"#3a9be8"}} onClick={()=>setSelectedPlayerId(d.player.id)}>{d.player.name}</td>
                  <td style={{padding:"7px 8px",textAlign:"center"}}>{d.batting.pa}</td>
                  <td style={{padding:"7px 8px",textAlign:"center"}}>{d.batting.totalAb}</td>
                  <td style={{padding:"7px 8px",textAlign:"center"}}>{d.batting.totalH}</td>
                  <td style={{padding:"7px 8px",textAlign:"center",fontWeight:700,color:"#e8a020"}}>{fmtAvg(d.batting.avg)}</td>
                  <td style={{padding:"7px 8px",textAlign:"center",fontWeight:700,color:"#27c97a"}}>{fmtAvg(d.batting.obp)}</td>
                  <td style={{padding:"7px 8px",textAlign:"center",fontWeight:700,color:"#3a9be8"}}>{fmtAvg(d.batting.slg)}</td>
                </tr>);
              })}
            </tbody>
          </table>
        </div>
      </div>}

      {/* Position breakdown */}
      {chartTab==="positions"&&<div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {playerStats.filter(d=>d.fielding.totalInn>0).sort((a,b)=>b.fielding.totalInn-a.fielding.totalInn).map(function(d){
            const posEntries=Object.entries(d.fielding.posBreak).sort((a,b)=>b[1]-a[1]);
            const avail=d.fielding.availInn||1;
            const colors={"P":"#e84040","C":"#e8a020","1B":"#27c97a","2B":"#3a9be8","3B":"#9b59b6","SS":"#f39c12","LF":"#1abc9c","CF":"#3498db","RF":"#e67e22"};
            return(
              <div key={d.player.id} style={{padding:"10px 14px",background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.07)",borderRadius:9}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
                  <div className="riv" style={{width:24,height:24,fontSize:9,flexShrink:0}}>{d.player.avatar||ini(d.player.name)}</div>
                  <div style={{flex:1,fontWeight:700,fontSize:13}}>{d.player.name}</div>
                  <div style={{fontSize:11,color:"#6b82a0"}}>{fmtInnings(d.fielding.totalInn)} inn played</div>
                </div>
                {/* Position bar */}
                <div style={{height:12,borderRadius:6,overflow:"hidden",display:"flex",marginBottom:6}}>
                  {posEntries.map(([pos,inn])=>(
                    <div key={pos} style={{flex:inn/avail,background:colors[pos]||"#6b82a0",minWidth:2}} title={pos+": "+fmtInnings(inn)}/>
                  ))}
                  {d.fielding.benchInn>0&&<div style={{flex:d.fielding.benchInn/avail,background:"rgba(255,255,255,.1)",minWidth:2}} title={"Bench: "+fmtInnings(d.fielding.benchInn)}/>}
                </div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {posEntries.map(([pos,inn])=>(
                    <span key={pos} style={{fontSize:10,color:colors[pos]||"#8fa3be",fontWeight:700}}>{pos} {Math.round(inn/avail*100)}%</span>
                  ))}
                  {d.fielding.benchInn>0&&<span style={{fontSize:10,color:"#6b82a0"}}>Bench {d.fielding.benchPct}%</span>}
                </div>
              </div>
            );
          })}
        </div>
      </div>}

      {/* Bench time chart */}
      {chartTab==="bench"&&<div>
        <div style={{fontSize:12,color:"#6b82a0",marginBottom:12}}>Sorted by most bench time. Fair share = {Math.round((Math.max(weekendPlayers.length-9,0)/Math.max(weekendPlayers.length,1))*100)}% for {weekendPlayers.length} players.</div>
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {[...playerStats].filter(d=>d.fielding.availInn>0).sort((a,b)=>b.fielding.benchPct-a.fielding.benchPct).map(function(d,i){
            const pct=d.fielding.benchPct;
            const fairShare=Math.round((Math.max(weekendPlayers.length-9,0)/Math.max(weekendPlayers.length,1))*100);
            const over=pct>fairShare+10;
            const under=pct<fairShare-10&&weekendPlayers.length>9;
            return(
              <div key={d.player.id} style={{padding:"9px 14px",background:"rgba(255,255,255,.03)",border:"1px solid "+(over?"rgba(232,60,60,.2)":under?"rgba(39,201,122,.15)":"rgba(255,255,255,.07)"),borderRadius:9}}>

function GameSummary({game,athletes}){
  const innCount=game.innings||6;
  const ids=new Set((game.lineup||[]).map(l=>l.athleteId));
  for(let i=1;i<=innCount;i++){Object.values(getChartForInning(game,i)).forEach(id=>{if(id)ids.add(id);});}
  const rows=[...ids].map(id=>({player:gamePlayers(game,athletes).find(p=>p.id===id),stats:computeAthleteGameStats(id,[game])})).filter(r=>r.player).sort((a,b)=>a.player.name.localeCompare(b.player.name));
  if(rows.length===0)return<div style={{fontSize:12,color:"#6b82a0"}}>No lineup or positions logged for this game.</div>;
  return(
    <div>
      {rows.map(r=>{
        const posEntries=Object.entries(r.stats.posCounts).sort((a,b)=>b[1]-a[1]);
        const benchInn=Math.max(0,innCount-r.stats.totalInnings);
        const benchPct=Math.round(benchInn/Math.max(innCount,1)*100);
        return(
          <div key={r.player.id} style={{marginBottom:8,paddingBottom:8,borderBottom:"1px solid rgba(255,255,255,.06)"}}>
            <div style={{fontWeight:700,fontSize:13,marginBottom:2}}>{r.player.name}{r.player.isGuest&&<span style={{color:"#e8a020",fontWeight:600,fontSize:10}}> (Guest)</span>} <span style={{color:"#6b82a0",fontWeight:400,fontSize:11}}>· {fmtInnings(r.stats.totalInnings)}/{innCount} innings</span></div>
            <div style={{fontSize:11,color:"#8fa3be"}}>
              {posEntries.length>0?posEntries.map(([pos,n])=>`${pos} ${Math.round(n/innCount*100)}%`).join("   ·   "):"No defensive innings"}
              {benchPct>0&&<span>{posEntries.length>0?"   ·   ":""}<span style={{color:"#6b82a0"}}>Bench {benchPct}%</span></span>}
            </div>
          </div>
        );
      })}
    </div>
  );
}


function computeWeekendPAs(players,games,weekend,teams){
  // Games link to weekends via team_id -> teams -> weekend_id
  const weekendTeamIds=new Set((teams||[]).filter(t=>t.weekend_id===weekend?.id).map(t=>t.id));
  const weekendGameIds=new Set(games.filter(g=>weekendTeamIds.has(g.team_id)).map(g=>g.id));
  const pas={};
  players.forEach(p=>{pas[p.id]=0;});
  games.forEach(g=>{
    if(!weekendGameIds.has(g.id))return;
    const bs=g.batting_stats||{};
    Object.entries(bs).forEach(([id,line])=>{
      if(pas[id]!==undefined)pas[id]+=(line.pa||line.ab||0);
    });
  });
  return pas;
}

function classifyHitter(p){
  // Determine a player's batting profile from season stats + measurables
  // Returns: "leadoff" | "two_hole" | "middle" | "five_hole" | "bottom"
  const m=p.measurables||{};
  const speed=parseFloat(m.sixty||99);
  const exitVelo=parseFloat(m.exit_velo||m.exitVelo||0);
  const obp=p.obp||0.320;
  const slg=p.slg||0.380;
  const avg=p.avg||0.250;

  // Leadoff: high OBP (>.380), fast (60 under 7.5), makes contact
  if(obp>=0.380&&speed<7.5&&avg>=0.280) return "leadoff";
  // Two hole: high OBP or good avg, handles bat well, can move runners
  if(obp>=0.340&&avg>=0.270) return "two_hole";
  // Middle (3-4): power + high OPS
  if((p.ops||0)>=0.850||exitVelo>=88) return "middle";
  // Five hole: slower/bigger kid, still drives in runs, good spot for extra PA
  if(speed>=8.0||exitVelo>=82) return "five_hole";
  // Bottom of order otherwise
  return "bottom";
}

function optimizeLineup(players,games,mode,priorityIds,seasonStats,lineupSize=9){
  const stats=players.map(p=>{
    const bs=computeBattingBySlot(p.id,games);
    const m=p.measurables||{};
    const ss=seasonStats?.[p.id];
    const raw=ss&&ss.ab>0?ss:bs.overall;
    const obp=raw.ab>0?((raw.h+(raw.bb||0)+(raw.hbp||0))/Math.max(raw.ab+(raw.bb||0)+(raw.hbp||0)+(raw.sf||0),1)):p._seasonObp||0.320;
    const slg=calcSLG(raw)||p._seasonSlg||0.380;
    const avg=raw.ab>0?raw.h/raw.ab:p._seasonAvg||bs.avg||0.250;
    const ops=obp+slg;
    const speed=parseFloat(m.sixty||99);
    const exitVelo=parseFloat(m.exit_velo||m.exitVelo||0);
    const priority=priorityIds?.includes(p.id)||false;
    const ps={...p,avg,obp,slg,ops,speed,exitVelo,priority,slotAvgs:bs.bySlot,hasStats:raw.ab>0};
    return{...ps,profile:classifyHitter(ps)};
  });

  // Separate urgent (priority) players from the rest
  const urgentPlayers=stats.filter(s=>s.priority);
  const normalPlayers=stats.filter(s=>!s.priority);

  // Sort normal players by mode
  let normalSorted=[];
  if(mode==="best") normalSorted=[...normalPlayers].sort((a,b)=>(b.obp*0.6+b.avg*0.4)-(a.obp*0.6+a.avg*0.4));
  else if(mode==="speed") normalSorted=[...normalPlayers].sort((a,b)=>a.speed-b.speed);
  else if(mode==="power") normalSorted=[...normalPlayers].sort((a,b)=>(b.ops*0.6+b.slg*0.4)-(a.ops*0.6+a.slg*0.4));
  else if(mode==="unique"){
    const rem=[...normalPlayers];const assigned=[];
    for(let slot=1;slot<=lineupSize;slot++){
      if(!rem.length)break;
      let best=null;let bestScore=-1;
      for(const p of rem){const sd=p.slotAvgs[slot];const score=sd&&sd.ab>0?sd.h/sd.ab:p.avg;if(score>bestScore){bestScore=score;best=p;}}
      if(best){assigned.push(best);rem.splice(rem.indexOf(best),1);}
    }
    normalSorted=[...assigned,...rem];
  } else normalSorted=normalPlayers;

  // Build a 9-12 slot array
  const lineup=new Array(lineupSize).fill(null);

  // Place urgent players intelligently based on their profile
  // Priority slots that get the most PAs in a game: 1,2,3,4,5 (top of order bats most)
  // Map profiles to ideal target slots
  const urgentByProfile={leadoff:[],two_hole:[],middle:[],five_hole:[],bottom:[]};
  urgentPlayers.forEach(p=>urgentByProfile[p.profile].push(p));

  // Assign urgent players to their best slots
  // Leadoff candidates -> slot 1 or 2
  // Two hole -> slot 2 or 1
  // Middle power -> slot 3 or 4
  // Five hole -> slot 5
  // Bottom -> slot 5 or 6
  const urgentSlotMap=[
    {profiles:["leadoff"],slots:[0,1]},        // slots 1-2
    {profiles:["two_hole"],slots:[1,0]},        // slots 2-1
    {profiles:["middle"],slots:[2,3]},          // slots 3-4
    {profiles:["five_hole","bottom"],slots:[4,5]}, // slots 5-6
  ];

  const usedUrgent=new Set();
  urgentSlotMap.forEach(({profiles,slots})=>{
    profiles.forEach(prof=>{
      urgentByProfile[prof].forEach(p=>{
        if(usedUrgent.has(p.id))return;
        // Find first available slot in preferred positions
        const target=slots.find(s=>s<lineupSize&&lineup[s]===null);
        if(target!==undefined){lineup[target]=p;usedUrgent.add(p.id);}
      });
    });
  });

  // Any urgent players not yet placed - put in first open slot in top half
  urgentPlayers.filter(p=>!usedUrgent.has(p.id)).forEach(p=>{
    const slot=lineup.findIndex((s,i)=>s===null&&i<Math.ceil(lineupSize/2));
    if(slot!==-1){lineup[slot]=p;usedUrgent.add(p.id);}
    else{const any=lineup.findIndex(s=>s===null);if(any!==-1)lineup[any]=p;}
  });

  // Fill remaining slots with normal players in order
  let ni=0;
  for(let i=0;i<lineupSize;i++){
    if(lineup[i]===null){
      while(ni<normalSorted.length&&usedUrgent.has(normalSorted[ni].id))ni++;
      if(ni<normalSorted.length){lineup[i]=normalSorted[ni];ni++;}
    }
  }

  return lineup.filter(Boolean).slice(0,lineupSize);
}

function SetBattingOrderModal({allPlayers,currentLineup,onClose,onSave}){
  const initial=currentLineup.length>0?currentLineup.map(l=>l.athleteId):["","","","","","","","",""];
  const[slots,setSlots]=useState(initial);

  const[dragIdx,setDragIdx]=useState(null);
  const[dragOver,setDragOver]=useState(null);
  const addSlot=()=>setSlots(s=>[...s,""]);
  const removeSlot=(i)=>setSlots(s=>s.filter((_,idx)=>idx!==i));
  const updateSlot=(i,val)=>setSlots(s=>s.map((v,idx)=>idx===i?val:v));
  const onDragStart=(i)=>setDragIdx(i);
  const onDragEnter=(i)=>{if(i!==dragIdx)setDragOver(i);};
  const onDragEnd=()=>{
    if(dragIdx!==null&&dragOver!==null&&dragIdx!==dragOver){
      setSlots(s=>{const n=[...s];const[removed]=n.splice(dragIdx,1);n.splice(dragOver,0,removed);return n;});
    }
    setDragIdx(null);setDragOver(null);
  };

  const save=()=>{
    const filled=slots.filter(Boolean);
    if(filled.length===0){alert("Set at least one batting spot.");return;}
    const oldPosByAthlete={};
    currentLineup.forEach(l=>{oldPosByAthlete[l.athleteId]=l.position;});
    const newLineup=filled.map(athleteId=>({athleteId,position:oldPosByAthlete[athleteId]||""}));
    onSave(newLineup);
  };

  return(
    <div className="mbg" onClick={onClose}><div className="modal" style={{maxWidth:480}} onClick={e=>e.stopPropagation()}>
      <div className="mt">Set <em>Batting Order</em></div>
      <div style={{fontSize:11,color:"#6b82a0",marginBottom:12}}>Pick who's hitting in each spot, top to bottom — handy once you know the real order from a box score. Defensive positions for anyone already in the lineup are kept.</div>
      <div style={{maxHeight:380,overflowY:"auto",marginBottom:10}}>
        {slots.map((val,i)=>{
          const ath=allPlayers.find(a=>a.id===val);
          const isDragging=dragIdx===i;
          const isOver=dragOver===i;
          return(<div key={i}
            draggable
            onDragStart={()=>onDragStart(i)}
            onDragEnter={()=>onDragEnter(i)}
            onDragEnd={onDragEnd}
            onDragOver={e=>e.preventDefault()}
            style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,opacity:isDragging?0.4:1,background:isOver?"rgba(232,160,32,.08)":"transparent",borderRadius:8,padding:"2px 0",transition:"background .15s",cursor:"grab"}}>
            <div style={{color:"#6b82a0",fontSize:16,flexShrink:0,paddingLeft:2,cursor:"grab",userSelect:"none"}}>⠿</div>
            <div style={{width:26,height:26,borderRadius:"50%",background:"#e8a020",color:"#0a0a0a",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,flexShrink:0}}>{i+1}</div>
            {ath&&<div className="riv" style={{width:26,height:26,fontSize:10,flexShrink:0}}>{ath.avatar||ini(ath.name)}</div>}
            <select className="inp" style={{flex:1}} value={val} onChange={e=>updateSlot(i,e.target.value)} onClick={e=>e.stopPropagation()}>
              <option value="">— empty —</option>
              {allPlayers.map(a=><option key={a.id} value={a.id}>{a.name}{a.isGuest?" (Guest)":""}</option>)}
            </select>
            <button onClick={()=>removeSlot(i)} style={{background:"none",border:"none",color:"#e84040",cursor:"pointer",fontSize:16,flexShrink:0,padding:"4px 6px"}}>✕</button>
          </div>);
        })}
      </div>
      <button className="btn bgh bsm" onClick={addSlot} style={{marginBottom:14}}>+ Add Spot</button>
      <div className="mf">
        <button className="btn bgh bsm" onClick={onClose}>Cancel</button>
        <button className="btn bg bsm" onClick={save}>Save Order</button>
      </div>
    </div></div>
  );
}


function LineupPlayerStats({a,games,teams,weekend,scope}){
  if(!a||a.isGuest)return null;
  // Filter games by scope
  const now=new Date();
  const scopedGames=games.filter(g=>{
    const gd=g.game_date?new Date(g.game_date+"T00:00:00"):null;
    if(scope==="weekend"){
      const wkTeamIds=new Set((teams||[]).filter(t=>t.weekend_id===weekend?.id).map(t=>t.id));
      return wkTeamIds.has(g.team_id);
    }
    if(scope==="month"){
      if(!gd)return false;
      return(now-gd)<30*24*60*60*1000;
    }
    if(scope==="week"){
      if(!gd)return false;
      return(now-gd)<7*24*60*60*1000;
    }
    return true; // all
  });
  const bs=computeBattingBySlot(a.id,scopedGames);
  const pa=scopedGames.reduce((s,g)=>{const b=(g.batting_stats||{})[a.id];return s+(b?b.pa||b.ab||0:0);},0);
  const obp=bs.overall.ab>0?((bs.overall.h+(bs.overall.bb||0)+(bs.overall.hbp||0))/Math.max(bs.overall.ab+(bs.overall.bb||0)+(bs.overall.hbp||0)+(bs.overall.sf||0),1)):0;
  const fmt=(n)=>"."+String(Math.round(n*1000)).padStart(3,"0");
  if(bs.overall.ab>0)return(
    <div style={{fontSize:9,color:"#6b82a0",marginTop:1,display:"flex",gap:6,flexWrap:"wrap"}}>
      <span><span style={{color:"#8fa3be"}}>AVG </span><span style={{color:"#e8a020",fontWeight:700}}>{fmt(bs.avg)}</span></span>
      <span><span style={{color:"#8fa3be"}}>PA </span><span style={{color:"#eef2f8",fontWeight:600}}>{pa}</span></span>
      <span><span style={{color:"#8fa3be"}}>OBP </span><span style={{color:"#27c97a",fontWeight:700}}>{fmt(obp)}</span></span>
    </div>
  );
  return <div style={{fontSize:9,color:"#6b82a0",marginTop:1}}>{pa>0?pa+" PA":"No stats"}</div>;
}

  const[importGameId,setImportGameId]=useState(null);
  const handleGameImport=(gameId,matchedRows)=>{
    const game=games.find(g=>g.id===gameId);
    if(!game)return;
    const newBatting={...(game.batting_stats||{})};
    const newFielding={...(game.imported_fielding||{})};
    let newLineup=[...(game.lineup||[])];
    let changedCount=0;
    const notInLineup=[];
    matchedRows.forEach(r=>{
      newBatting[r.athleteId]=r.batting;
      newFielding[r.athleteId]=r.fielding;
      const gcPos=primaryPosFromFielding(r.fielding);
      const idx=newLineup.findIndex(l=>l.athleteId===r.athleteId);
      if(idx!==-1){
        if(gcPos&&newLineup[idx].position!==gcPos){newLineup[idx]={...newLineup[idx],position:gcPos};changedCount++;}
      }else if(gcPos||r.batting.ab>0){
        // GameChanger's CSV has no batting-order info at all, so we can't
        // know where this person actually hit. Guessing (e.g. tacking them
        // on the end) would just present a wrong slot as fact - worse than
        // not knowing. Their batting/fielding stats are still saved below;
        // only their lineup SLOT is left for the coach to set by hand.
        const matched=athletes.find(a=>a.id===r.athleteId)||(game.guests||[]).find(x=>x.id===r.athleteId);
        notInLineup.push(matched?matched.name:(r.name||"Unknown player"));
      }
    });
    let msg="";
    if(changedCount)msg+=`GameChanger's data will update ${changedCount} player position${changedCount===1?"":"s"} to match what actually happened.`;
    if(notInLineup.length){
      msg+=(msg?"\n\n":"")+`Heads up: ${notInLineup.join(", ")} ${notInLineup.length===1?"has":"have"} stats in this file but ${notInLineup.length===1?"isn't":"aren't"} in this game's batting lineup. GameChanger doesn't report batting order, so I won't guess a spot for ${notInLineup.length===1?"them":"them"} - their batting/fielding numbers will still be saved, but add ${notInLineup.length===1?"them":"them"} to the lineup yourself (with the real spot) if you want that part tracked.`;
    }
    if(msg&&!window.confirm(msg+"\n\nContinue?")){

function ImportStatsModal({athletes,onClose,onConfirm,scopeLabel,singleGameMode}){
  const[rows,setRows]=useState(null);
  const[matches,setMatches]=useState({});
  const[fileName,setFileName]=useState("");
  const[error,setError]=useState("");

  const handleFile=(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    setFileName(file.name);
    setError("");
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const parsed=parseGameChangerCSV(ev.target.result);
        if(parsed.length===0){setError("Couldn't find any player rows in this file. Make sure it's the CSV from GameChanger's Team → Stats → Export Stats.");return;}
        setRows(parsed);
        const initial={};
        parsed.forEach((r,i)=>{initial[i]=bestNameMatch(r.name,athletes);});
        setMatches(initial);
      }catch(err){setError("Couldn't read this file: "+err.message);}
    };
    reader.readAsText(file);
  };

  const confirm=()=>{
    const matched=rows.map((r,i)=>({...r,athleteId:matches[i]})).filter(r=>r.athleteId);
    if(matched.length===0){alert("Match at least one player before importing.");return;}
    onConfirm(matched);
  };

  return(
    <div className="mbg" onClick={onClose}><div className="modal" style={{maxWidth:560}} onClick={e=>e.stopPropagation()}>
      <div className="mt">Import <em>GameChanger</em> Stats</div>
      <div style={{fontSize:11,color:"#6b82a0",marginBottom:14}}>{scopeLabel}</div>
      {!rows?(
        <>
          <input type="file" accept=".csv" onChange={handleFile} className="inp" style={{padding:8}}/>
          {error&&<div style={{fontSize:12,color:"#e84040",marginTop:10}}>{error}</div>}
          <div className="mf" style={{borderTop:"none",paddingTop:14}}><button className="btn bgh bsm" onClick={onClose}>Cancel</button></div>
        </>
      ):(
        <>
          <div style={{fontSize:11,color:"#6b82a0",marginBottom:8}}>{fileName} · {rows.length} player{rows.length===1?"":"s"} found. Match each to your roster — anything left on "Skip" won't be imported.</div>
          {singleGameMode&&rows.some(r=>r.batting.gp>1)&&(
            <div style={{fontSize:11,color:"#e8a020",background:"rgba(232,160,32,.08)",border:"1px solid rgba(232,160,32,.25)",borderRadius:8,padding:"8px 10px",marginBottom:10}}>
              ⚠️ This file looks like it covers more than one game (some players show GP &gt; 1). For accurate per-game stats, export from GameChanger filtered to just this single game before importing here.
            </div>
          )}
          <div style={{maxHeight:360,overflowY:"auto",marginBottom:12}}>
            {rows.map((r,i)=>(
              <div key={i} className="ri" style={{alignItems:"center",gap:8}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:600}}>{r.name||"(no name)"}{r.number&&<span style={{color:"#6b82a0",fontWeight:400}}> #{r.number}</span>}</div>
                  <div style={{fontSize:10,color:"#6b82a0"}}>AB {r.batting.ab} · H {r.batting.h} · Fielding {fmtInnings(r.fielding.Total)} inn</div>
                </div>
                <select className="inp" style={{width:170,flexShrink:0}} value={matches[i]||""} onChange={e=>setMatches(m=>({...m,[i]:e.target.value}))}>
                  <option value="">Skip this row</option>
                  {athletes.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
                </select>
              </div>
            ))}
          </div>
          <div className="mf">
            <button className="btn bgh bsm" onClick={onClose}>Cancel</button>
            <button className="btn bg bsm" onClick={confirm}>Import {Object.values(matches).filter(Boolean).length} Player{Object.values(matches).filter(Boolean).length===1?"":"s"}</button>
          </div>
        </>
      )}
    </div></div>
  );
}

function WeekendPlayerDetail({player,games,allGames,teams,weekend,onBack}){
  const[scope,setScope]=useState("weekend");
  const now=new Date();

  const scopedGames=(scope==="weekend"?games:allGames).filter(function(g){
    if(scope==="weekend")return true;
    const gd=g.game_date?new Date(g.game_date+"T00:00:00"):null;
    if(!gd)return false;
    return scope==="30days"?(now-gd)<30*24*60*60*1000:(now-gd)<180*24*60*60*1000;
  });

  const playerGames=scopedGames.filter(g=>(g.lineup||[]).some(l=>l.athleteId===player.id)||(g.imported_fielding||{})[player.id]);
  const batting=computeBattingBySlot(player.id,scopedGames);
  const fmtAvg=(n)=>n!=null?"."+String(Math.round(n*1000)).padStart(3,"0"):".---";

  // Fielding breakdown from imported GC data
  const fieldingByPos={};  // pos -> {innings, errors}
  let totalInn=0,totalErr=0,totalPO=0,totalAst=0,benchInn=0;
  playerGames.forEach(function(g){
    const inn=g.innings||6;
    const imp=(g.imported_fielding||{})[player.id];
    if(imp&&imp.Total>0){
      FIELD_POS.forEach(function(pos){
        if(imp[pos]>0){
          if(!fieldingByPos[pos])fieldingByPos[pos]={innings:0,errors:0};
          fieldingByPos[pos].innings+=imp[pos];
          totalInn+=imp[pos];
        }
      });
      totalErr+=(imp.e||0);
      totalPO+=(imp.po||0);
      totalAst+=(imp.assists||0);
      benchInn+=Math.max(0,inn-imp.Total);
    } else {
      const inLineup=(g.lineup||[]).some(l=>l.athleteId===player.id);
      if(inLineup)totalInn+=inn; else benchInn+=inn;
    }
  });

  const availInn=totalInn+benchInn;
  const benchPct=availInn>0?Math.round(benchInn/availInn*100):0;
  const posEntries=Object.entries(fieldingByPos).sort((a,b)=>b[1].innings-a[1].innings);
  const hasFielding=posEntries.length>0;

  // Error rate per position (errors per 9 innings)
  const errRate=(pos)=>{
    const d=fieldingByPos[pos];
    if(!d||d.innings===0)return 0;
    return(d.errors/(d.innings/9)).toFixed(2);
  };

  // Position color map
  const posColors={"P":"#e84040","C":"#e8a020","1B":"#27c97a","2B":"#3a9be8","3B":"#9b59b6","SS":"#f39c12","LF":"#1abc9c","CF":"#3498db","RF":"#e67e22"};

  // Game log
  const gameLog=[...playerGames].sort((a,b)=>(b.game_date||"").localeCompare(a.game_date||""));

  // Batting slot rows
  const battingSlotRows=Object.entries(batting.bySlot).sort((a,b)=>(a[0]==="Unknown"?99:Number(a[0]))-(b[0]==="Unknown"?99:Number(b[0])));

  const scopeBtn=(s,lbl)=>(<button key={s} onClick={()=>setScope(s)} style={{padding:"4px 10px",borderRadius:6,border:"1px solid "+(scope===s?"#e8a020":"rgba(255,255,255,.12)"),background:scope===s?"rgba(232,160,32,.12)":"transparent",color:scope===s?"#e8a020":"#6b82a0",fontSize:11,fontWeight:700,cursor:"pointer"}}>{lbl}</button>);

  return(
    <div>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,flexWrap:"wrap"}}>
        <button className="bb" onClick={onBack} style={{margin:0}}>← Back</button>
        <div style={{flex:1,fontWeight:800,fontSize:18}}>{player.name}</div>
        <div style={{display:"flex",gap:5}}>
          {[["weekend","Weekend"],["30days","30 Days"],["summer","Summer"]].map(([s,l])=>scopeBtn(s,l))}
        </div>
      </div>
      <div style={{fontSize:11,color:"#6b82a0",marginBottom:16}}>{player.position||"—"}{player.grad?" · Class of "+player.grad:player.age_group?" · "+player.age_group:""} · {playerGames.length} games in scope</div>

      {/* Batting summary */}
      {batting.overall.ab>0&&<div className="card" style={{marginBottom:12}}>
        <div className="ds">Batting</div>
        <div className="sr" style={{marginBottom:8}}>
          <div className="sb2"><div className="sv" style={{color:"#e8a020"}}>{fmtAvg(batting.avg)}</div><div className="sl">AVG</div></div>
          <div className="sb2"><div className="sv">{batting.overall.pa||0}</div><div className="sl">PA</div></div>
          <div className="sb2"><div className="sv">{batting.overall.ab}</div><div className="sl">AB</div></div>
          <div className="sb2"><div className="sv">{batting.overall.h}</div><div className="sl">H</div></div>
          <div className="sb2"><div className="sv">{batting.overall.hr||0}</div><div className="sl">HR</div></div>
          <div className="sb2"><div className="sv">{batting.overall.rbi||0}</div><div className="sl">RBI</div></div>
          <div className="sb2"><div className="sv">{batting.overall.bb||0}</div><div className="sl">BB</div></div>
          <div className="sb2"><div className="sv">{batting.overall.so||0}</div><div className="sl">K</div></div>
          <div className="sb2"><div className="sv" style={{color:"#27c97a"}}>{fmtAvg(batting.overall.ab>0?((batting.overall.h||0)+(batting.overall.bb||0)+(batting.overall.hbp||0))/Math.max((batting.overall.ab||0)+(batting.overall.bb||0)+(batting.overall.hbp||0)+(batting.overall.sf||0),1):null)}</div><div className="sl">OBP</div></div>
        </div>
        {battingSlotRows.length>1&&<div>
          <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:6}}>By Batting Order Slot</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {battingSlotRows.map(([slot,d])=>d.ab>0&&(
              <div key={slot} style={{background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)",borderRadius:7,padding:"6px 10px",textAlign:"center"}}>
                <div style={{fontSize:10,color:"#6b82a0",marginBottom:2}}>#{slot==="Unknown"?"?":slot}</div>
                <div style={{fontWeight:700,color:"#e8a020"}}>{fmtAvg(d.ab>0?d.h/d.ab:null)}</div>
                <div style={{fontSize:10,color:"#6b82a0"}}>{d.h}-{d.ab}</div>
              </div>
            ))}
          </div>
        </div>}
      </div>}

      {/* Fielding & Errors */}
      <div className="card" style={{marginBottom:12}}>
        <div className="ds">Fielding & Errors</div>
        {!hasFielding&&<div style={{fontSize:12,color:"#6b82a0"}}>No GameChanger fielding data imported for this period. Upload CSVs in the game detail to see position breakdowns.</div>}
        {hasFielding&&<>
          {/* Summary row */}
          <div className="sr" style={{marginBottom:12}}>
            <div className="sb2"><div className="sv">{fmtInnings(totalInn)}</div><div className="sl">Inn Played</div></div>
            <div className="sb2"><div className="sv" style={{color:totalErr>0?"#e84040":"#eef2f8"}}>{totalErr}</div><div className="sl">Errors</div></div>
            <div className="sb2"><div className="sv">{totalPO}</div><div className="sl">Putouts</div></div>
            <div className="sb2"><div className="sv">{totalAst}</div><div className="sl">Assists</div></div>
            <div className="sb2"><div className="sv">{totalPO+totalAst>0?((totalPO+totalAst)/(totalPO+totalAst+totalErr)*100).toFixed(1)+"%":"—"}</div><div className="sl">FLD%</div></div>
            <div className="sb2"><div className="sv" style={{color:benchPct>30?"#e84040":"#6b82a0"}}>{benchPct}%</div><div className="sl">Bench</div></div>
          </div>

          {/* Position visual — pie chart + bar */}
          <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:12,flexWrap:"wrap"}}>
            <PieChart size={90} slices={[
              ...posEntries.map(([pos,d])=>({pct:d.innings,color:posColors[pos]||"#6b82a0",label:pos})),
              ...(benchInn>0?[{pct:benchInn,color:"rgba(255,255,255,.15)",label:"Bench"}]:[])
            ]}/>
            <div style={{flex:1,minWidth:120}}>
              <div style={{height:10,borderRadius:5,overflow:"hidden",display:"flex",marginBottom:8}}>
                {posEntries.map(([pos,d])=>(
                  <div key={pos} style={{flex:d.innings/availInn,background:posColors[pos]||"#6b82a0",minWidth:2}}/>
                ))}
                {benchInn>0&&<div style={{flex:benchInn/availInn,background:"rgba(255,255,255,.1)"}}/>}
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {posEntries.map(([pos,d])=><span key={pos} style={{fontSize:11,color:posColors[pos]||"#8fa3be",fontWeight:700}}>{pos} {Math.round(d.innings/availInn*100)}%</span>)}
                {benchInn>0&&<span style={{fontSize:11,color:"#6b82a0"}}>Bench {benchPct}%</span>}
              </div>
            </div>
          </div>

          {/* Per-position breakdown with errors */}
          <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:8}}>Position Breakdown</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {posEntries.map(([pos,d])=>{
              const pct=Math.round(d.innings/availInn*100);
              const isPrimary=pos===(player.position||"");
              const isSecondary=(player.other_positions||[]).includes(pos);
              const errPerNine=d.innings>0?(d.errors/(d.innings/9)).toFixed(2):null;
              return(
                <div key={pos} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",background:d.errors>0?"rgba(232,60,60,.05)":"rgba(255,255,255,.02)",border:"1px solid "+(d.errors>0?"rgba(232,60,60,.2)":isPrimary?"rgba(39,201,122,.15)":"rgba(255,255,255,.07)"),borderRadius:8}}>
                  <div style={{width:32,height:32,borderRadius:8,background:posColors[pos]||"#6b82a0",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:12,color:"#fff",flexShrink:0}}>{pos}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                      <span style={{fontWeight:700,fontSize:13}}>{pos}</span>
                      {isPrimary&&<span style={{background:"rgba(39,201,122,.1)",color:"#27c97a",borderRadius:6,padding:"1px 7px",fontSize:10,fontWeight:700}}>Primary</span>}
                      {isSecondary&&<span style={{background:"rgba(58,155,232,.1)",color:"#3a9be8",borderRadius:6,padding:"1px 7px",fontSize:10,fontWeight:700}}>Secondary</span>}
                    </div>
                    <div style={{fontSize:11,color:"#6b82a0",marginTop:2}}>{fmtInnings(d.innings)} innings · {pct}% of time</div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    {d.errors>0?(
                      <div>
                        <div style={{fontWeight:800,fontSize:16,color:"#e84040"}}>{d.errors} E</div>
                        {errPerNine&&<div style={{fontSize:10,color:"#e84040"}}>{errPerNine}/9 inn</div>}
                      </div>
                    ):(
                      <div style={{fontWeight:700,fontSize:13,color:"#27c97a"}}>0 E</div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Coaching note if errors exist */}
          {totalErr>0&&<div style={{marginTop:10,padding:"9px 12px",background:"rgba(232,60,60,.05)",border:"1px solid rgba(232,60,60,.15)",borderRadius:8,fontSize:11,color:"#c0cce0"}}>
            <span style={{fontWeight:700,color:"#e84040"}}>🚨 {totalErr} total error{totalErr!==1?"s":""}</span>
            {posEntries.filter(([,d])=>d.errors>0).length>0&&<span style={{color:"#8fa3be"}}> — occurring at: {posEntries.filter(([,d])=>d.errors>0).map(([pos,d])=>pos+" ("+d.errors+")").join(", ")}</span>}
            {posEntries.filter(([,d])=>d.errors>0).map(([pos])=>pos).some(pos=>pos===(player.position||""))&&<div style={{marginTop:4,color:"#e8a020"}}>⚠️ Errors at primary position — flag for practice focus.</div>}
          </div>}
        </>}
      </div>

      {/* Game log */}
      <div className="card">
        <div className="ds">Game Log</div>
        {gameLog.length===0&&<div style={{fontSize:12,color:"#6b82a0"}}>No games in this scope.</div>}
        {gameLog.map(function(g,i){
          const lineup=(g.lineup||[]).find(l=>l.athleteId===player.id);
          const imp=(g.imported_fielding||{})[player.id];
          const bs=(g.batting_stats||{})[player.id];
          const wkTeam=teams.find(t=>t.id===g.team_id);
          return(
            <div key={g.id} style={{paddingBottom:10,marginBottom:10,borderBottom:i<gameLog.length-1?"1px solid rgba(255,255,255,.06)":"none"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:3}}>
                <div style={{fontWeight:700,fontSize:13}}>{g.opponent||"Unknown Opp"}</div>
                <div style={{fontSize:11,color:"#6b82a0"}}>{g.game_date||""}{wkTeam?" · "+wkTeam.name:""}</div>
              </div>
              <div style={{display:"flex",gap:12,flexWrap:"wrap",fontSize:11}}>
                {lineup&&<span style={{color:"#6b82a0"}}>Batting #{lineup.position||"?"} · <span style={{color:"#3a9be8"}}>{lineup.position||""}</span></span>}
                {bs&&bs.ab>0&&<span><span style={{color:"#e8a020",fontWeight:700}}>{bs.h}-{bs.ab}</span>{bs.hr>0&&<span style={{color:"#e84040"}}> · {bs.hr} HR</span>}{bs.rbi>0&&<span style={{color:"#8fa3be"}}> · {bs.rbi} RBI</span>}</span>}
                {imp&&imp.Total>0&&<span style={{color:"#6b82a0"}}>{fmtInnings(imp.Total)} inn{imp.e>0&&<span style={{color:"#e84040",fontWeight:700}}> · {imp.e}E</span>}</span>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}


function WeekendGroupReport({weekend,rows,teamLabel}){
  return(
    <div className="print-target" style={{background:"#f6f1e2",color:"#000",border:"3px solid #000",borderRadius:10,padding:"16px 14px",maxWidth:920,margin:"0 auto",fontFamily:"Georgia,Times New Roman,serif"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,paddingBottom:10,borderBottom:"2px solid #000"}}>
        <img src={BRANDING.logos.iconDark} alt="" style={{height:36,width:"auto",flexShrink:0}}/>
        <div style={{minWidth:0}}>
          <div style={{fontSize:9,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>{BRANDING.name}</div>

          <div style={{fontSize:11,color:"#5a4a2a"}}>
            {teamLabel} · Opportunity Report{(weekend.start_date||weekend.end_date)?` · ${weekend.start_date||"?"} – ${weekend.end_date||"?"}`:""}
          </div>
        </div>
      </div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:10.5}}>
          <thead>
            <tr style={{borderBottom:"2px solid #000"}}>
              <th style={{textAlign:"left",padding:"3px 5px"}}>Player</th>
              <th style={{padding:"3px 5px"}}>GP</th>
              <th style={{padding:"3px 5px"}}>PA</th>
              <th style={{padding:"3px 5px"}}>AB</th>
              <th style={{padding:"3px 5px"}}>AVG</th>
              <th style={{padding:"3px 5px"}}>OPS</th>
              <th style={{padding:"3px 5px"}}>QAB %</th>
              <th style={{padding:"3px 5px"}}>Innings (Pl/Avail)</th>
              <th style={{padding:"3px 5px"}}>Bench %</th>
              <th style={{textAlign:"left",padding:"3px 5px"}}>Positions Played</th>
              <th style={{textAlign:"left",padding:"3px 5px"}}>Batting Spots</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(r=>{
              const posEntries=Object.entries(r.stats.posCounts).sort((a,b)=>b[1]-a[1]);
              const benchPct=Math.round(r.stats.benchInnings/Math.max(r.stats.availableInnings,1)*100);
              const slotEntries=Object.entries(r.stats.orderCounts).sort((a,b)=>Number(a[0])-Number(b[0]));
              const ops=calcOPS(r.batting.overall);
              const qabPct=calcQABPct(r.batting.overall);
              return(
                <tr key={r.player.id} style={{borderBottom:"1px solid rgba(0,0,0,.2)"}}>
                  <td style={{padding:"4px 5px",fontWeight:700,whiteSpace:"nowrap"}}>{r.player.name}{r.player.isGuest?" (G)":""}</td>
                  <td style={{padding:"4px 5px",textAlign:"center"}}>{r.stats.total}</td>
                  <td style={{padding:"4px 5px",textAlign:"center"}}>{r.batting.totalAb>0?r.batting.overall.pa:"—"}</td>
                  <td style={{padding:"4px 5px",textAlign:"center"}}>{r.batting.totalAb>0?r.batting.totalAb:"—"}</td>
                  <td style={{padding:"4px 5px",textAlign:"center",fontWeight:700}}>{r.batting.totalAb>0?fmtAvg(r.batting.avg):"—"}</td>
                  <td style={{padding:"4px 5px",textAlign:"center",fontWeight:700}}>{ops!=null?fmtAvg(ops):"—"}</td>
                  <td style={{padding:"4px 5px",textAlign:"center"}}>{qabPct!=null?Math.round(qabPct)+"%":"—"}</td>
                  <td style={{padding:"4px 5px",textAlign:"center",whiteSpace:"nowrap"}}>{fmtInnings(r.stats.totalInnings)}/{fmtInnings(r.stats.availableInnings)}</td>
                  <td style={{padding:"4px 5px",textAlign:"center"}}>{benchPct}%</td>
                  <td style={{padding:"4px 5px"}}>{posEntries.length>0?posEntries.map(([pos,n])=>`${pos} ${Math.round(n/Math.max(r.stats.availableInnings,1)*100)}%`).join(", "):"—"}</td>
                  <td style={{padding:"4px 5px"}}>{slotEntries.length>0?slotEntries.map(([slot,n])=>`#${slot}${n>1?`×${n}`:""}`).join(", "):"—"}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div style={{marginTop:10,fontSize:9,color:"#5a4a2a"}}>
        Innings = defensive innings played vs. available in games they were part of that weekend. "Bench %" is time not on defense relative to those innings, not a measure of effort or readiness. Generated by {BRANDING.productName}.
      </div>
    </div>
  );
}



// ─── DEFENSIVE ROTATION PLANNER ─────────────────────────────────
const BENCH_COLOR="#6b82a0";
const PRIMARY_COLOR="#27c97a";
const SECONDARY_COLOR="#3a9be8";
const OVER_COLOR="#e84040";

function GameDetail({game,team,weekend,athletes,staffById,profile,games,teams,onBack,onPatchGame,onDeleteGame,onImportStats}){
  const[currentInning,setCurrentInning]=useState(1);
  const[copied,setCopied]=useState(false);
  const[tracking,setTracking]=useState(false);
  useEffect(()=>{setCurrentInning(1);setTracking(false);},[game.id]);

  const[guestName,setGuestName]=useState("");
  const[showImport,setShowImport]=useState(false);
  const[showOrderEditor,setShowOrderEditor]=useState(false);
  const[showOptimizer,setShowOptimizer]=useState(false);
  const[statScope,setStatScope]=useState("weekend");
  const[ldDragIdx,setLdDragIdx]=useState(null);
  const[ldDragOver,setLdDragOver]=useState(null);
  const ldDragEnd=()=>{if(ldDragIdx!==null&&ldDragOver!==null&&ldDragIdx!==ldDragOver){const nl=[...game.lineup];const[r]=nl.splice(ldDragIdx,1);nl.splice(ldDragOver,0,r);onPatchGame(game.id,{lineup:nl});}setLdDragIdx(null);setLdDragOver(null);};
  const[phAthleteId,setPhAthleteId]=useState("");
  const[phSlot,setPhSlot]=useState("");
  const importGameStats=(matchedRows)=>{
    onImportStats(game.id,matchedRows);
    setShowImport(false);
  };
  const rosterIds=team?.athlete_ids||[];
  const guestIds=(game.guests||[]).map(g=>g.id);
  const selectableIds=[...rosterIds,...guestIds];
  const inLineupIds=(game.lineup||[]).map(l=>l.athleteId);
  const available=selectableIds.filter(id=>!inLineupIds.includes(id)).map(id=>gamePlayers(game,athletes).find(p=>p.id===id)).filter(Boolean);

  const addToLineup=(athleteId)=>onPatchGame(game.id,{lineup:[...(game.lineup||[]),{athleteId,position:""}]});
  const addGuestToLineup=()=>{
    const name=guestName.trim();
    if(!name)return;
    const id=`guest_${Date.now().toString(36)}${Math.random().toString(36).slice(2,6)}`;
    onPatchGame(game.id,{
      guests:[...(game.guests||[]),{id,name}],
      lineup:[...(game.lineup||[]),{athleteId:id,position:""}]
    });
    setGuestName("");
  };
  const removeFromLineup=(athleteId)=>onPatchGame(game.id,{lineup:game.lineup.filter(l=>l.athleteId!==athleteId)});
  const setLineupPosition=(athleteId,position)=>onPatchGame(game.id,{lineup:game.lineup.map(l=>l.athleteId===athleteId?{...l,position}:l)});
  const moveLineup=(index,dir)=>{const arr=[...game.lineup];const j=index+dir;if(j<0||j>=arr.length)return;[arr[index],arr[j]]=[arr[j],arr[index]];onPatchGame(game.id,{lineup:arr});};

  const addPinchHitter=(athleteId,slot)=>{
    if(!athleteId||!slot)return;
    onPatchGame(game.id,{pinch_hitters:[...(game.pinch_hitters||[]),{athleteId,slot:Number(slot)}]});
  };
  const removePinchHitter=(idx)=>{
    onPatchGame(game.id,{pinch_hitters:(game.pinch_hitters||[]).filter((_,i)=>i!==idx)});
  };

  const setInnings=(n)=>onPatchGame(game.id,{innings:Math.max(1,Math.min(12,n))});
  const setInningPosition=(inning,pos,athleteId)=>{
    const snapshot={...getChartForInning(game,inning)};
    if(athleteId)snapshot[pos]=athleteId;else delete snapshot[pos];
    onPatchGame(game.id,{field_chart:{...(game.field_chart||{}),[inning]:snapshot}});
  };

  const addPitcher=()=>onPatchGame(game.id,{pitching:[...(game.pitching||[]),{id:Date.now().toString(36),athleteId:"",innings:[],limit:"",note:""}]});
  const updatePitcher=(pid,patch)=>onPatchGame(game.id,{pitching:game.pitching.map(p=>p.id===pid?{...p,...patch}:p)});
  const toggleInning=(pid,inn)=>{const p=game.pitching.find(x=>x.id===pid);const has=p.innings.includes(inn);updatePitcher(pid,{innings:has?p.innings.filter(i=>i!==inn):[...p.innings,inn].sort((a,b)=>a-b)});};
  const removePitcher=(pid)=>onPatchGame(game.id,{pitching:game.pitching.filter(p=>p.id!==pid)});

  const copyText=()=>{
    const text=buildGameText(game,team,weekend,athletes,staffById);
    navigator.clipboard?.writeText(text).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),1800);},()=>{});
  };

  return(
    <div>
      <button className="bb" onClick={onBack}>← {team?team.name:""} Games</button>

      <div className="card" style={{marginBottom:12,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <div style={{fontSize:12,color:"#6b82a0"}}>{game.assigned_coach_id?<>Managing: <strong style={{color:"#eef2f8"}}>{staffById[game.assigned_coach_id]?.name||"Coach"}</strong></>:"Unclaimed"}</div>
        {game.assigned_coach_id===profile.id?(
          <button className="btn bgr bsm" onClick={()=>onPatchGame(game.id,{assigned_coach_id:null})}>Release</button>
        ):(
          <button className="btn bgn bsm" onClick={()=>onPatchGame(game.id,{assigned_coach_id:profile.id})}>{game.assigned_coach_id?"Take over":"I've got this one"}</button>
        )}
      </div>

      <div className="db" style={{marginBottom:14}}>
        <div className="dh"><div className="dl">{team?team.name:"Team"} vs {game.opponent||"TBD"}</div><div style={{display:"flex",gap:6}}><button className="btn bgh bsm" onClick={()=>setShowOrderEditor(true)}>🔢 Set Order</button><button className="btn bbl bsm" onClick={()=>setShowOptimizer(true)}>⚡ Auto Lineup</button><button className="btn bgr bsm" onClick={()=>onDeleteGame(game.id)}>Delete Game</button></div></div>
        <div style={{padding:14}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,flexWrap:"wrap",gap:6}}>
            <div style={{fontWeight:700,fontSize:12,color:"#6b82a0"}}>Batting Order</div>
            <div style={{display:"flex",gap:3}}>
              {[["weekend","This Wknd"],["month","30 Days"],["week","7 Days"]].map(([s,lbl])=>(
                <button key={s} onClick={()=>setStatScope(s)} style={{padding:"3px 8px",borderRadius:6,border:"1px solid "+(statScope===s?"#e8a020":"rgba(255,255,255,.12)"),background:statScope===s?"rgba(232,160,32,.12)":"transparent",color:statScope===s?"#e8a020":"#6b82a0",fontSize:10,fontWeight:700,cursor:"pointer"}}>{lbl}</button>
              ))}
            </div>
          </div>
          {(!game.lineup||game.lineup.length===0)?(
            <div style={{textAlign:"center",color:"#6b82a0",fontSize:12,padding:"10px 0"}}>No batters added yet</div>
          ):game.lineup.map((entry,i)=>{
            const a=gamePlayers(game,athletes).find(x=>x.id===entry.athleteId);
            const isDragging=ldDragIdx===i;
            const isOver=ldDragOver===i;
            return(
              <div key={entry.athleteId}
                draggable
                onDragStart={()=>setLdDragIdx(i)}
                onDragEnter={()=>setLdDragOver(i)}
                onDragEnd={ldDragEnd}
                onDragOver={e=>e.preventDefault()}

        <div className="ds">Pickup Player</div>

        <div style={{display:"flex",gap:8}}>
          <input className="inp" placeholder="Player's name" value={guestName} onChange={e=>setGuestName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addGuestToLineup()} style={{flex:1}}/>

        {(game.pinch_hitters||[]).length>0&&(
          <div style={{marginBottom:10}}>
            {(game.pinch_hitters||[]).map((ph,i)=>{

              const unassigned=selectableIds.filter(id=>!assignedIds.has(id)).map(id=>gamePlayers(game,athletes).find(p=>p.id===id)).filter(Boolean);
              return(<>
                {unassigned.length>0&&(

                    <div style={{fontSize:12,color:"#eef2f8"}}>{unassigned.map(a=>a.name+(a.isGuest?" (Guest)":"")).join(", ")}</div>

                <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
                  {FIELD_POS.map(pos=>{

                    const options=selectableIds.filter(id=>id===value||!assignedIds.has(id));
                    return(
                      <div key={pos} style={{background:"rgba(255,255,255,.04)",borderRadius:8,padding:8}}>

      <div className="card" style={{marginBottom:14}}>

        ):game.pitching.map(p=>(
          <div key={p.id} style={{background:"rgba(255,255,255,.04)",borderRadius:8,padding:10,marginBottom:8}}>
            <div style={{display:"flex",gap:8,marginBottom:8,alignItems:"center"}}>
              <select className="inp" style={{flex:1}} value={p.athleteId} onChange={e=>updatePitcher(p.id,{athleteId:e.target.value})}>
                <option value="">Select pitcher...</option>
                {selectableIds.map(id=>{const a=gamePlayers(game,athletes).find(x=>x.id===id);return a?<option key={id} value={id}>{a.name}{a.isGuest?" (Guest)":""}</option>:null;})}
              </select>
              <button onClick={()=>removePitcher(p.id)} style={{background:"none",border:"none",color:"#e84040",cursor:"pointer",fontSize:14}}>✕</button>

      <div className="card" style={{marginBottom:14}}>
        <div className="ds">Game Notes</div>
        <textarea className="inp" rows={2} placeholder="Anything else the coach should know..." value={game.notes||""} onChange={e=>onPatchGame(game.id,{notes:e.target.value})}/>

      <div className="card" style={{marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:2}}>
          <div className="ds" style={{marginBottom:0}}>Lineup Card</div>
          <button className="btn bgh bsm" onClick={()=>window.print()}>🖨️ Print</button>
        </div>

        <pre style={{whiteSpace:"pre-wrap",fontSize:11,background:"rgba(0,0,0,.3)",borderRadius:8,padding:10,fontFamily:"monospace",color:"#8fa3be",lineHeight:1.6}}>{buildGameText(game,team,weekend,athletes,staffById)}</pre>

  );
}

function CheckInPage({athletes,checkins,programs,profile,onToggleCheckin,onBulkComplete}){
  const[search,setSearch]=useState("");
  const[showBulk,setShowBulk]=useState(false);
  const[selectedProgIds,setSelectedProgIds]=useState([]);
  const[excludedIds,setExcludedIds]=useState([]);
  const[busy,setBusy]=useState(false);

  const today=todayStr();
  const todaysCheckins=checkins.filter(c=>c.check_date===today);
  const checkedInIds=new Set(todaysCheckins.map(c=>c.athlete_id));

  const filtered=athletes.filter(a=>(a.name||"").toLowerCase().includes(search.toLowerCase()));
  const notIn=filtered.filter(a=>!checkedInIds.has(a.id)).sort((a,b)=>a.name.localeCompare(b.name));
  const checkedIn=filtered.filter(a=>checkedInIds.has(a.id)).sort((a,b)=>a.name.localeCompare(b.name));

  const bulkTargets=checkedIn.filter(a=>!excludedIds.includes(a.id));

  const toggleProg=(id)=>setSelectedProgIds(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const toggleExcluded=(id)=>setExcludedIds(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);

  const runBulk=async()=>{
    if(selectedProgIds.length===0){alert("Pick at least one workout first.");return;}
    if(bulkTargets.length===0){alert("No athletes selected.");return;}
    setBusy(true);
    await onBulkComplete(selectedProgIds,bulkTargets.map(a=>a.id));
    setBusy(false);
    setShowBulk(false);
    setSelectedProgIds([]);
    setExcludedIds([]);
  };

  return(
    <div>
      <div className="ph">
        <div className="pt">Facility <em>Check-In</em></div>
        <div style={{fontSize:12,color:"#6b82a0"}}>{new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div>
      </div>

      <div className="sr">
        <div className="sb2"><div className="sv" style={{color:"#27c97a"}}>{checkedIn.length}</div><div className="sl">Checked In</div></div>
        <div className="sb2"><div className="sv">{notIn.length}</div><div className="sl">Not Yet</div></div>
        <div className="sb2"><div className="sv">{athletes.length}</div><div className="sl">Total Roster</div></div>
      </div>

      <input className="inp" placeholder="🔍 Search athletes..." value={search} onChange={e=>setSearch(e.target.value)} style={{marginBottom:14,maxWidth:400}}/>

      {checkedIn.length>0&&(
        <div style={{marginBottom:14}}>
          <button className="btn bg" onClick={()=>{setShowBulk(!showBulk);setExcludedIds([]);}}>✓ Mark Workouts Complete for {checkedIn.length} Checked-In</button>
        </div>
      )}

      {showBulk&&(
        <div className="card" style={{marginBottom:16,borderColor:"rgba(39,201,122,.3)"}}>
          <div className="ds">Which workouts did they do?</div>
          {programs.length===0?(
            <div style={{fontSize:12,color:"#6b82a0",marginBottom:10}}>No workouts created yet — add one in the Workouts tab first.</div>
          ):(
            <div className="fb">
              {programs.map(p=>(
                <button key={p.id} className={`fc ${selectedProgIds.includes(p.id)?"on":""}`} onClick={()=>toggleProg(p.id)}>{p.name}{(p.isGroup||p.is_group_program)?" · Group":""}</button>
              ))}
            </div>
          )}
          <div className="ds" style={{marginTop:10}}>Applies to ({bulkTargets.length} of {checkedIn.length} checked in)</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:12}}>
            {checkedIn.map(a=>{
              const excluded=excludedIds.includes(a.id);
              return(
                <button key={a.id} onClick={()=>toggleExcluded(a.id)} className="fc" style={{opacity:excluded?.4:1,textDecoration:excluded?"line-through":"none"}}>
                  {a.name}
                </button>
              );
            })}
          </div>
          <div className="mf" style={{borderTop:"none",paddingTop:0}}>
            <button className="btn bgh bsm" onClick={()=>setShowBulk(false)}>Cancel</button>
            <button className="btn bg bsm" onClick={runBulk} disabled={busy||selectedProgIds.length===0}>{busy?"Marking...":`Mark Complete for ${bulkTargets.length}`}</button>
          </div>
        </div>
      )}

      <div className="ds" style={{display:"flex",alignItems:"center",gap:6}}><span style={{color:"#e84040"}}>●</span> Not Checked In ({notIn.length})</div>
      {notIn.length===0?(
        <div className="empty" style={{padding:"16px 0"}}><div className="et">Everyone's checked in 🎉</div></div>
      ):(
        <div className="ag" style={{marginBottom:18}}>
          {notIn.map(a=>(
            <button key={a.id} className="card cc" style={{display:"flex",alignItems:"center",gap:10,textAlign:"left"}} onClick={()=>onToggleCheckin(a.id)}>
              <div className="av">{a.avatar||ini(a.name)}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:13}}>{a.name}</div>
                <div style={{fontSize:10,color:"#6b82a0"}}>{a.position}</div>
              </div>
              <span className="btn bgh bsm">Check In</span>
            </button>
          ))}
        </div>
      )}

      {checkedIn.length>0&&(
        <>
          <div className="ds" style={{display:"flex",alignItems:"center",gap:6}}><span style={{color:"#27c97a"}}>●</span> Checked In ({checkedIn.length})</div>
          <div className="ag">
            {checkedIn.map(a=>(
              <button key={a.id} className="card cc" style={{display:"flex",alignItems:"center",gap:10,textAlign:"left",borderColor:"rgba(39,201,122,.25)"}} onClick={()=>onToggleCheckin(a.id)}>
                <div className="av">{a.avatar||ini(a.name)}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:13}}>{a.name}</div>
                  <div style={{fontSize:10,color:"#6b82a0"}}>{a.position}</div>
                </div>
                <span className="bdg bg2">✓ In</span>
              </button>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function CoachesPage({coaches,programs,athletes,allAthletes,calcPct,onViewAth,onAssignCoach,onRemoveCoach}){
  const[expanded,setExpanded]=useState(null);
  const[showAssign,setShowAssign]=useState(null);
  const[filterChip,setFilterChip]=useState("All");
  const[nameSearch,setNameSearch]=useState("");
  const[selected,setSelected]=useState([]); // selected athlete ids

  const unassigned=allAthletes.filter(a=>!(a.coach_ids||[]).length);

  const assignedTo=(coachId)=>allAthletes.filter(a=>(a.coach_ids||[]).includes(coachId));

  const getFiltered=()=>{
    let list=allAthletes;
    if(filterChip!=="All"){
      list=list.filter(a=>
        a.age_group===filterChip||
        String(a.grad)===String(filterChip)
      );
    }
    if(nameSearch)list=list.filter(a=>(a.name||"").toLowerCase().includes(nameSearch.toLowerCase()));
    return list;
  };

  const filteredList=getFiltered();

  const toggleSelect=(id)=>setSelected(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const selectAll=()=>setSelected(filteredList.map(a=>a.id));
  const clearAll=()=>setSelected([]);

  const assignSelected=async(coachId)=>{
    for(const id of selected){
      await onAssignCoach(id,coachId);
    }
    setSelected([]);
  };

  const removeSelected=async()=>{
    for(const id of selected){
      await onRemoveCoach(id,null);
    }
    setSelected([]);
  };

  const removeSelectedFromThisCoach=async()=>{
    for(const id of selected){
      await onRemoveCoach(id,showAssign);
    }
    setSelected([]);
  };

  // All available chips: All + age groups + grad years
  const availableAgeGroups=AGE_GROUPS.filter(g=>allAthletes.some(a=>a.age_group===g));
  const availableGrads=GRAD_YEARS.filter(yr=>allAthletes.some(a=>String(a.grad)===String(yr)));

  return(<>
    <div className="pt">Coach <em>Management</em></div>

    {/* Summary */}
    <div className="sr" style={{marginBottom:16}}>
      <div className="sb2"><div className="sv">{coaches.length}</div><div className="sl">Coaches</div></div>
      <div className="sb2"><div className="sv">{allAthletes.length}</div><div className="sl">Total Athletes</div></div>
      <div className="sb2"><div className="sv">{unassigned.length}</div><div className="sl">Unassigned</div></div>
      <div className="sb2"><div className="sv">{programs.length}</div><div className="sl">Total Workouts</div></div>
    </div>

    {/* Unassigned warning */}

        <div style={{fontWeight:700,fontSize:14,color:"#3a9be8"}}>Assign Athletes → <span style={{color:"#e8a020"}}>{coaches.find(c=>c.id===showAssign)?.name}</span></div>
