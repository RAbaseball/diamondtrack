const ALL_DAYS_WK=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

const PLAN_CONFIGS={
  individual:{label:"Individual Workout",icon:"⚾",color:"#e8a020",hasDays:true,hasAthleteAssign:true,hasGroupAssign:false},
  group:{label:"Group Workout",icon:"👥",color:"#3a9be8",hasDays:true,hasAthleteAssign:false,hasGroupAssign:true},
  plan:{label:"Practice Plan",icon:"📋",color:"#27c97a",hasDays:false,hasAthleteAssign:false,hasGroupAssign:true,
    sections:["Warmup","Infield/Outfield","Hitting Stations","Pitching/Bullpen","Team Defense","Baserunning","Conditioning","Cooldown"]},
};

function getPG(pos){if(!pos)return"";if(["P","SP","RP"].includes(pos))return"Pitchers";if(pos==="C")return"Catchers";if(["1B","2B","3B","SS"].includes(pos))return"Infielders";if(["LF","CF","RF","OF"].includes(pos))return"Outfielders";if(pos==="DH")return"Hitters";return"";}

function WorkoutBuilder({type,athletes,programs,onBack,onSave}){
  const cfg=PLAN_CONFIGS[type]||PLAN_CONFIGS.individual;
  const[selectedTemplate,setSelectedTemplate]=useState(null);
  const[workoutTemplate,setWorkoutTemplate]=useState(null);

  const WORKOUT_TEMPLATES=[
    {id:"2day",label:"2-Day / Week",icon:"💪",desc:"Best for maintenance, recovering from injury, or blending with other sports.",
     days:[
      {day:"Day A — Lower Body & Upper Push",exercises:[],
       placeholder:"Foam Roll (5 min) → Dynamic Warm-Up → A. Prep/Core: Med Ball Rotational Throws 3×5/side → A1. Primary Lower: Trap Bar Deadlift 3×6-8 → A2. Primary Upper: Push/Press variation 3×8-12 → B1. Secondary Lower: Split Squat 3×8-10/leg → B2. Secondary Upper: Overhead Press 3×8-12 → C1. Posterior Chain: Hamstring Curls 3×10-15 → C2. Auxiliary: Row variation 3×10-12 → Conditioning: 15 min low-intensity aerobic"},
      {day:"Day B — Lower Body & Upper Pull",exercises:[],
       placeholder:"Foam Roll (5 min) → Dynamic Warm-Up → A. Prep/Core: Pallof Press 3×10/side → A1. Primary Lower: Squat variation 3×8-10 → A2. Primary Upper: Pull-Up or Row 3×8-12 → B1. Secondary Lower: 1-Leg RDL 3×8-10/leg → B2. Secondary Upper: Incline Press 3×8-12 → C1. Posterior Chain: KB Swings 3×15-20 → C2. Auxiliary: Bottom-Up KB Press 3×8-10 → Conditioning: Hill sprints or mobility 15 min"}
    ]},
    {id:"3day",label:"3-Day / Week",icon:"🔥",desc:"Best for building muscle, improving athleticism, and increasing strength gains.",
     days:[
      {day:"Day 1 — Knee Dominant & Upper Push",exercises:[],
       placeholder:"Foam Roll & Dynamic Warm-Up (10 min) → A. Prep/Core: Med Ball Slams or Chops 3×10 → A1. Primary Lower: Front or Goblet Squat 3×6-8 → A2. Primary Upper: Flat DB Bench Press 3×8-10 → B1. Secondary Lower: Reverse Lunges 3×8-10/leg → B2. Secondary Upper: Landmine Press 3×8-12 → C1. Core: Plank with Arm Reaches 3×10 → C2. Auxiliary: Face Pulls 3×15"},
      {day:"Day 2 — Hip Dominant & Upper Pull",exercises:[],
       placeholder:"Foam Roll & Dynamic Warm-Up (10 min) → A. Prep/Core: Med Ball Chest Passes 3×10 → A1. Primary Lower: Trap Bar Deadlift 3×6 → A2. Primary Upper: Chin-Ups or Lat Pulldowns 3×8-12 → B1. Secondary Lower: Single-Leg RDL 3×8-10/leg → B2. Secondary Upper: Single-Arm DB Row 3×8-12 → C1. Core: Side Planks with Rotation 3×8-10/side → C2. Auxiliary: Cable Tricep Extensions 3×12"},
      {day:"Day 3 — Total Body / Mixed",exercises:[],
       placeholder:"Foam Roll & Dynamic Warm-Up (10 min) → A. Prep/Core: Rotational Med Ball Throws 3×5/side → A1. Primary Lower: Back Squat 3×8-10 → A2. Primary Upper: Overhead Barbell Press 3×6-8 → B1. Secondary Lower: Step-Ups 3×8-12/leg → B2. Secondary Upper: TRX Fallouts 3×10 → C1. Posterior Chain: Glute Ham Raises or Swiss Ball Curls 3×10-12 → C2. Auxiliary: KB Bottom-Up Press 3×8/side"}
    ]}
  ];
  // For plan type, start on details to show template picker first
  // assignTab already defaults to "details"
  const[name,setName]=useState("");
  const[week,setWeek]=useState(new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}));
  const[coachNote,setCoachNote]=useState("");
  const[duration,setDuration]=useState("");
  const[location,setLocation]=useState("");
  const[startTime,setStartTime]=useState("09:00");
  const buildDaysFromTemplate=(tmpl)=>{if(!tmpl||!tmpl.blocks.length)return[];return tmpl.blocks.map(b=>({day:b.name,exercises:[],sectionNote:"",sectionDuration:String(b.min),placeholder:b.placeholder||""}));};  const initDays=cfg.hasDays?ALL_DAYS_WK.map(d=>({day:d,exercises:[]})):(cfg.sections||[]).map(s=>({day:s,exercises:[],sectionNote:"",sectionDuration:""}));
  const[days,setDays]=useState(initDays);
  const[activeDay,setActiveDay]=useState(0);
  const[showPicker,setShowPicker]=useState(false);
  const[assignTab,setAssignTab]=useState("details");
  const[dragEx,setDragEx]=useState(null);
  const[dragOverEx,setDragOverEx]=useState(null);
  const onDragExEnd=()=>{if(dragEx!==null&&dragOverEx!==null&&dragEx!==dragOverEx){const u=[...days];const exs=[...u[activeDay].exercises];const[removed]=exs.splice(dragEx,1);exs.splice(dragOverEx,0,removed);u[activeDay]={...u[activeDay],exercises:exs};setDays(u);}setDragEx(null);setDragOverEx(null);};
  const[tGrads,setTGrads]=useState([]);
  const[tGroups,setTGroups]=useState([]);
  const[tAgeGroups,setTAgeGroups]=useState([]);
  const[tAthletes,setTAthletes]=useState([]);
  const[athId,setAthId]=useState(athletes[0]?.id||"");
  const[saving,setSaving]=useState(false);

  const addEx=(ex)=>{const u=[...days];u[activeDay].exercises.push({id:"e"+Date.now(),name:ex.name,sets:ex.sets||3,reps:ex.reps||10,weight:ex.wt||"",notes:"",desc:ex.description||ex.desc||""});setDays(u);setShowPicker(false);};
  const addBlank=()=>{const u=[...days];u[activeDay].exercises.push({id:"e"+Date.now(),name:"",sets:3,reps:10,weight:"",notes:"",desc:""});setDays(u);};
  const updEx=(di,ei,k,v)=>{const u=[...days];u[di].exercises[ei][k]=v;setDays(u);};
  const remEx=(di,ei)=>{const u=[...days];u[di].exercises.splice(ei,1);setDays(u);};
  const updDay=(di,k,v)=>{const u=[...days];u[di][k]=v;setDays(u);};

  const handleSave=async()=>{
    if(!name.trim()){alert("Enter a name.");return;}
    setSaving(true);
    await onSave({name,week,days:days.filter(d=>(d.exercises||[]).length>0),athleteId:type==="individual"?athId:null,isGroup:type!=="individual",targetGrads:tGrads,targetGroups:tGroups,targetAgeGroups:tAgeGroups,targetAthletes:tAthletes,planType:type,location,duration,planNotes:coachNote,startTime});
    setSaving(false);
  };

  const totalDrills=days.reduce((s,d)=>s+(d.exercises||[]).length,0);
  const activeDrills=days[activeDay]?.exercises||[];
  const activeDays=days.filter(d=>(d.exercises||[]).length>0||d.sectionNote);

  // Compute clock times for practice plan sections
  const computedTimes=days.map((d,i)=>{let cur=startTime;for(let j=0;j<i;j++){const prev=days[j];const mins=parseInt(prev.sectionDuration)||0;cur=addMinutes(cur,mins);}return cur;});

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,flexWrap:"wrap"}}>
        <button className="bb" onClick={onBack} style={{marginBottom:0}}>← Back</button>
        <div style={{flex:1}}><div style={{fontSize:22,fontWeight:800}}>{cfg.icon} <span style={{color:cfg.color}}>{cfg.label}</span></div></div>
        <button className="btn bg" onClick={handleSave} disabled={saving||!name.trim()} style={{minWidth:120}}>{saving?"Saving...":"💾 Save"}</button>
      </div>

      <div style={{display:"flex",gap:2,borderBottom:"1px solid rgba(255,255,255,.07)",marginBottom:16}}>
        {["details","build","preview"].map(t=>(
          <button key={t} onClick={()=>setAssignTab(t)} style={{padding:"7px 14px",border:"none",background:"transparent",fontSize:11,fontWeight:700,textTransform:"uppercase",color:assignTab===t?cfg.color:"#6b82a0",borderBottom:assignTab===t?"2px solid "+cfg.color:"2px solid transparent",cursor:"pointer"}}>
            {t==="details"?"Details":t==="build"?"Build"+(totalDrills>0?" ("+totalDrills+")":""):"🖨️ Print Preview"}
          </button>
        ))}
      </div>

      {assignTab==="details"&&<div style={{maxWidth:600}}>
        <div className="card" style={{marginBottom:14}}>
          <div className="ds">Plan Info</div>
          <div className="fg"><label>Name *</label><input className="inp" placeholder={"e.g. Tuesday "+cfg.label} value={name} onChange={e=>setName(e.target.value)}/></div>
          <div className="fg2">
            <div className="fg"><label>Date / Week</label><input className="inp" value={week} onChange={e=>setWeek(e.target.value)}/></div>
            <div className="fg"><label>Duration (min)</label><input className="inp" type="number" placeholder="90" value={duration} onChange={e=>setDuration(e.target.value)}/></div>
          </div>
          {!cfg.hasDays&&<div className="fg"><label>Start Time</label><input className="inp" type="time" value={startTime} onChange={e=>setStartTime(e.target.value)}/></div>}
          {type!=="individual"&&<div className="fg"><label>Location</label><input className="inp" placeholder="Field 1, Cage, Indoor..." value={location} onChange={e=>setLocation(e.target.value)}/></div>}
          <div className="fg" style={{marginBottom:0}}><label>Coach Notes (shown on print)</label><textarea className="inp" placeholder="Goals, focus areas, reminders..." value={coachNote} onChange={e=>setCoachNote(e.target.value)} style={{minHeight:60}}/></div>
        </div>
        {/* Template picker for Practice Plans */}
        {type==="plan"&&!selectedTemplate&&<div className="card" style={{marginBottom:14}}>
          <div className="ds">Choose a Time Template</div>
          <div style={{fontSize:11,color:"#6b82a0",marginBottom:12}}>Pick a template to auto-fill your time blocks. Customize everything after.</div>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {PRACTICE_TEMPLATES.map(tmpl=>(
              <div key={tmpl.id} onClick={()=>{setSelectedTemplate(tmpl);if(tmpl.id!=="custom"){setDuration(String(tmpl.totalMin));const nd=buildDaysFromTemplate(tmpl);if(nd.length)setDays(nd);}else{setDays([{day:"Block 1",exercises:[],sectionNote:"",sectionDuration:"",placeholder:""}]);}setAssignTab("details");}} style={{padding:"12px 14px",borderRadius:10,border:"1px solid rgba(255,255,255,.08)",background:"rgba(255,255,255,.02)",cursor:"pointer",display:"flex",alignItems:"center",gap:12}}>
                <div style={{fontSize:26,flexShrink:0}}>{tmpl.icon}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:14,marginBottom:2}}>{tmpl.label}</div>
                  <div style={{fontSize:11,color:"#6b82a0",marginBottom:4}}>{tmpl.desc}</div>
                  {tmpl.blocks.length>0&&<div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                    {tmpl.blocks.map((b,i)=><span key={i} style={{background:"rgba(39,201,122,.1)",border:"1px solid rgba(39,201,122,.2)",borderRadius:10,padding:"2px 8px",fontSize:10,color:"#27c97a",fontWeight:700}}>{b.min}m {b.name}</span>)}
                  </div>}
                </div>
                <div style={{color:"#6b82a0",fontSize:18,flexShrink:0}}>→</div>
              </div>
            ))}
          </div>
        </div>}
        {type==="plan"&&selectedTemplate&&<div className="card" style={{marginBottom:14,border:"1px solid rgba(39,201,122,.2)"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
            <div style={{fontWeight:700,fontSize:13,color:"#27c97a"}}>{selectedTemplate.icon} {selectedTemplate.label}</div>
            <button className="btn bgh bsm" onClick={()=>{setSelectedTemplate(null);setDays(initDays);}}>Change Template</button>
          </div>
          {selectedTemplate.blocks.length>0&&<div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
            {selectedTemplate.blocks.map((b,i)=><span key={i} style={{background:"rgba(39,201,122,.08)",border:"1px solid rgba(39,201,122,.2)",borderRadius:10,padding:"3px 10px",fontSize:11,color:"#27c97a",fontWeight:700}}>{b.min}m {b.name}</span>)}
          </div>}
        </div>}

        {/* Workout template picker for individual/group types */}
        {(type==="individual"||type==="group")&&!workoutTemplate&&<div className="card" style={{marginBottom:14}}>
          <div className="ds">Choose a Program Template</div>
          <div style={{fontSize:11,color:"#6b82a0",marginBottom:10}}>Start from a pre-built program or skip to build your own.</div>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            {WORKOUT_TEMPLATES.map(tmpl=>(
              <div key={tmpl.id} onClick={()=>{setWorkoutTemplate(tmpl);setDays(tmpl.days.map(d=>({...d,exercises:d.exercises.map(ex=>({...ex,id:"e"+Date.now()+Math.random()}))})));setName(tmpl.label);}} style={{padding:"12px 14px",borderRadius:10,border:"1px solid rgba(255,255,255,.08)",background:"rgba(255,255,255,.02)",cursor:"pointer",display:"flex",alignItems:"center",gap:12}}>
                <div style={{fontSize:26,flexShrink:0}}>{tmpl.icon}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:14,marginBottom:2}}>{tmpl.label}</div>
                  <div style={{fontSize:11,color:"#6b82a0",marginBottom:4}}>{tmpl.desc}</div>
                  <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                    {tmpl.days.map((d,i)=><span key={i} style={{background:"rgba(232,160,32,.1)",border:"1px solid rgba(232,160,32,.2)",borderRadius:10,padding:"2px 8px",fontSize:10,color:"#e8a020",fontWeight:700}}>{d.day.split("—")[0].trim()}</span>)}
                  </div>
                </div>
                <div style={{color:"#6b82a0",fontSize:18,flexShrink:0}}>→</div>
              </div>
            ))}
            <div onClick={()=>setWorkoutTemplate({id:"custom"})} style={{padding:"10px 14px",borderRadius:10,border:"1px solid rgba(255,255,255,.06)",background:"rgba(255,255,255,.01)",cursor:"pointer",display:"flex",alignItems:"center",gap:10,color:"#6b82a0"}}>
              <span style={{fontSize:18}}>✏️</span><span style={{fontSize:13,fontWeight:600}}>Build from scratch</span>
            </div>
          </div>
        </div>}
        {(type==="individual"||type==="group")&&workoutTemplate&&workoutTemplate.id!=="custom"&&<div className="card" style={{marginBottom:14,border:"1px solid rgba(232,160,32,.2)"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{fontWeight:700,fontSize:13,color:"#e8a020"}}>{workoutTemplate.icon} {workoutTemplate.label}</div>
            <button className="btn bgh bsm" onClick={()=>{setWorkoutTemplate(null);setDays(ALL_DAYS_WK.map(d=>({day:d,exercises:[]})));setName("");}}>Change</button>
          </div>
          <div style={{fontSize:11,color:"#6b82a0",marginTop:4}}>{workoutTemplate.days.length} training days pre-loaded — customize in the Build tab</div>
        </div>}

        {type==="individual"&&<div className="card" style={{marginBottom:14}}>
          <div className="ds">Assign to Athlete</div>
          <select className="inp" value={athId} onChange={e=>setAthId(e.target.value)}>{athletes.map(a=><option key={a.id} value={a.id}>{a.name}{a.position?" — "+a.position:""}{a.grad?" ("+a.grad+")":a.age_group?" ("+a.age_group+")":""}</option>)}</select>
        </div>}
        {type!=="individual"&&<div className="card">
          <div className="ds">Target Athletes</div>
          <div style={{marginBottom:10}}>
            <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:6}}>Grad Years</div>
            <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{GRAD_YEARS.map(yr=>{const on=tGrads.includes(yr);return(<button key={yr} onClick={()=>setTGrads(p=>on?p.filter(y=>y!==yr):[...p,yr])} style={{padding:"5px 12px",borderRadius:12,border:"1px solid "+(on?grColor[yr]||"#888":"rgba(255,255,255,.12)"),background:on?(grColor[yr]||"#888")+"20":"transparent",color:on?grColor[yr]||"#eef2f8":"#8fa3be",fontSize:12,fontWeight:700,cursor:"pointer"}}>{on?"✓ ":""}{yr}</button>);})}</div>
          </div>
          <div style={{marginBottom:10}}>
            <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:6}}>Age Groups</div>
            <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{AGE_GROUPS.map(g=>{const on=tAgeGroups.includes(g);return(<button key={g} onClick={()=>setTAgeGroups(p=>on?p.filter(x=>x!==g):[...p,g])} style={{padding:"5px 12px",borderRadius:12,border:"1px solid "+(on?"#3a9be8":"rgba(255,255,255,.12)"),background:on?"rgba(58,155,232,.1)":"transparent",color:on?"#3a9be8":"#8fa3be",fontSize:12,fontWeight:700,cursor:"pointer"}}>{on?"✓ ":""}{g}</button>);})}</div>
          </div>
          <div>
            <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:6}}>Position Groups</div>
            <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{Object.keys(POSITION_GROUPS).map(g=>{const on=tGroups.includes(g);return(<button key={g} onClick={()=>setTGroups(p=>on?p.filter(x=>x!==g):[...p,g])} style={{padding:"5px 12px",borderRadius:12,border:"1px solid "+(on?gColor[g]||"#888":"rgba(255,255,255,.12)"),background:on?(gColor[g]||"#888")+"20":"transparent",color:on?gColor[g]||"#eef2f8":"#8fa3be",fontSize:12,fontWeight:700,cursor:"pointer"}}>{on?"✓ ":""}{g}</button>);})}</div>
          </div>
          <div style={{marginTop:10}}>
            <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:6}}>Specific Athletes</div>
            <div style={{fontSize:11,color:"#6b82a0",marginBottom:6}}>Leave blank to use group targeting above, or pick specific players.</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:4,maxHeight:120,overflowY:"auto"}}>
              {athletes.map(a=>{const on=tAthletes.includes(a.id);return(<button key={a.id} onClick={()=>setTAthletes(p=>on?p.filter(x=>x!==a.id):[...p,a.id])} style={{display:"flex",alignItems:"center",gap:4,padding:"4px 10px",borderRadius:10,border:"1px solid "+(on?"#e8a020":"rgba(255,255,255,.1)"),background:on?"rgba(232,160,32,.1)":"transparent",color:on?"#e8a020":"#8fa3be",fontSize:11,fontWeight:on?700:400,cursor:"pointer"}}>{on&&"✓ "}{a.name}{a.position?" ("+a.position+")":""}</button>);})}
            </div>
            {tAthletes.length>0&&<div style={{marginTop:6,fontSize:11,color:"#e8a020"}}>⚡ {tAthletes.length} specific athlete{tAthletes.length!==1?"s":""} selected</div>}
          </div>
        </div>}
      </div>}

      {assignTab==="build"&&<div style={{display:"flex",gap:0,flex:1,minHeight:0}}>
        <div style={{width:140,flexShrink:0,borderRight:"1px solid rgba(255,255,255,.07)",paddingRight:8,marginRight:12,overflowY:"auto"}}>
          <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:8}}>{cfg.hasDays?"Days":"Sections"}</div>
          {days.map((d,i)=>{
            const cnt=(d.exercises||[]).length;
            return(<button key={i} onClick={()=>setActiveDay(i)} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid "+(activeDay===i?cfg.color:"transparent"),background:activeDay===i?cfg.color+"15":"transparent",color:activeDay===i?cfg.color:"#8fa3be",textAlign:"left",cursor:"pointer",fontSize:12,fontWeight:activeDay===i?700:400,marginBottom:3,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>
                {!cfg.hasDays&&computedTimes[i]&&<div style={{fontSize:9,color:activeDay===i?cfg.color:"#6b82a0"}}>{fmt12(computedTimes[i])}</div>}
                <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.day.length>12?d.day.slice(0,12)+"…":d.day}</span>
              </div>
              {cnt>0&&<span style={{background:cfg.color+"30",color:cfg.color,borderRadius:"50%",width:18,height:18,fontSize:10,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{cnt}</span>}
            </button>);
          })}
        </div>

        <div style={{flex:1,overflowY:"auto"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,flexWrap:"wrap",gap:8}}>
            <div>
              {!cfg.hasDays&&<div style={{fontSize:11,color:cfg.color,fontWeight:700,marginBottom:2}}>{fmt12(computedTimes[activeDay])}</div>}
              <input className="inp" value={days[activeDay]?.day||""} onChange={e=>updDay(activeDay,"day",e.target.value)} style={{fontWeight:700,fontSize:16,color:cfg.color,background:"transparent",border:"1px solid rgba(255,255,255,.1)",borderRadius:6,padding:"3px 8px",flex:1}}/>
              {!cfg.hasDays&&<div style={{display:"flex",gap:8,marginTop:6,alignItems:"center"}}>
                <input className="inp" type="number" placeholder="Minutes" value={days[activeDay]?.sectionDuration||""} onChange={e=>updDay(activeDay,"sectionDuration",e.target.value)} style={{width:90,fontSize:11}}/>
                <span style={{fontSize:11,color:"#6b82a0"}}>min</span>
                {days[activeDay]?.sectionDuration&&<span style={{fontSize:11,color:"#6b82a0"}}>→ ends {fmt12(addMinutes(computedTimes[activeDay],parseInt(days[activeDay].sectionDuration)||0))}</span>}
              </div>}
            </div>
            <div style={{display:"flex",gap:7}}>
              <button className="btn bg bsm" onClick={()=>setShowPicker(true)}>⚾ Library</button>
              <button className="btn bgh bsm" onClick={addBlank}>+ Blank</button>
            </div>
          </div>

          {activeDrills.length===0&&<div className="empty" style={{padding:"24px 0"}}><div className="ei">⚾</div><div className="et" style={{fontSize:13}}>Add from Library or + Blank</div></div>}

          {activeDrills.map((ex,ei)=>(
            <div key={ex.id}
              draggable
              onDragStart={()=>setDragEx(ei)}
              onDragEnter={()=>setDragOverEx(ei)}
              onDragEnd={onDragExEnd}
              onDragOver={e=>e.preventDefault()}
              style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.07)",borderRadius:8,padding:12,marginBottom:8,opacity:dragEx===ei?0.4:1,outline:dragOverEx===ei&&dragEx!==ei?"2px solid "+cfg.color:"none",transition:"outline .1s",cursor:"grab"}}>
              <div style={{display:"flex",gap:7,marginBottom:8,alignItems:"center"}}>
                <span style={{color:"#6b82a0",fontSize:18,flexShrink:0,cursor:"grab",userSelect:"none",lineHeight:1}}>⠿</span>
                <input className="inp" placeholder="Drill / activity name" value={ex.name} onChange={e=>updEx(activeDay,ei,"name",e.target.value)} style={{flex:1,fontWeight:600}}/>

                <div><label style={{fontSize:9,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",display:"block",marginBottom:2}}>Reps</label><input className="inp" type="number" value={ex.reps} onChange={e=>updEx(activeDay,ei,"reps",e.target.value)} style={{fontSize:13}}/></div>
                <div><label style={{fontSize:9,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",display:"block",marginBottom:2}}>Load</label><input className="inp" placeholder="—" value={ex.weight} onChange={e=>updEx(activeDay,ei,"weight",e.target.value)} style={{fontSize:13}}/></div>
              </div>}
              {!cfg.hasDays&&<div style={{marginBottom:7}}>
                <label style={{fontSize:9,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",display:"block",marginBottom:2}}>Duration (min)</label>
                <input className="inp" type="number" placeholder="e.g. 10" value={ex.weight} onChange={e=>updEx(activeDay,ei,"weight",e.target.value)} style={{fontSize:13,maxWidth:120}}/>

                <div><label style={{fontSize:9,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",display:"block",marginBottom:2}}>Description (print footnote)</label><input className="inp" placeholder="Breakdown for parents..." value={ex.desc||""} onChange={e=>updEx(activeDay,ei,"desc",e.target.value)} style={{fontSize:11}}/></div>
              </div>
            </div>
          ))}

          {!cfg.hasDays&&<div className="fg" style={{marginTop:8}}><label>Block Notes</label><textarea className="inp" placeholder="Setup, reminders, coaching points..." value={days[activeDay]?.sectionNote||""} onChange={e=>updDay(activeDay,"sectionNote",e.target.value)} style={{minHeight:50}}/></div>}
        </div>
      </div>}

      {assignTab==="preview"&&<div style={{background:"white",borderRadius:10,overflow:"hidden",flex:1}}>
        <div style={{background:"#0d1526",padding:"8px 14px",display:"flex",gap:8,alignItems:"center"}}>
          <span style={{fontSize:12,color:"#6b82a0"}}>Print Preview</span>
          <button className="btn bg bsm" onClick={()=>window.print()}>🖨️ Print</button>
        </div>
        <WorkoutPrintView name={name} week={week} duration={duration} location={location} coachNote={coachNote} days={activeDays} cfg={cfg} athletes={athletes} athId={athId} tGrads={tGrads} tAgeGroups={tAgeGroups} tGroups={tGroups} startTime={startTime} computedTimes={computedTimes}/>
      </div>}

      {showPicker&&<ExPicker onSelect={addEx} onClose={()=>setShowPicker(false)}/>}
    </div>
  );
}

function WorkoutPrintView({name,week,duration,location,coachNote,days,cfg,athletes,athId,tGrads,tAgeGroups,tGroups,startTime,computedTimes}){
  const ath=athletes?.find(a=>a.id===athId);
  const isPlan=!cfg.hasDays;
  const targetLabel=ath?ath.name:[...tGrads.map(y=>"Class of "+y),...tAgeGroups,...tGroups].join(", ")||"";
  const totalMin=isPlan?days.reduce((s,d)=>s+(parseInt(d.sectionDuration)||0),0):parseInt(duration)||0;
  const endTime=isPlan&&startTime?addMinutes(startTime,totalMin):"";
  const activeDays=days.filter(d=>(d.exercises||[]).length>0||d.sectionNote);

  // Collect all footnotes across all days
  const allFootnotes=[];
  activeDays.forEach(function(d){
    (d.exercises||[]).forEach(function(ex){
      if(ex.desc&&ex.desc.trim())allFootnotes.push({day:d.day,name:ex.name,desc:ex.desc});
    });
  });

  if(!isPlan){
    // ── WORKOUT — lineup card style with footnotes ──
    return(
      <div style={{display:"flex",justifyContent:"center",padding:"24px 16px",background:"#e8e0d0",minHeight:"100%"}}>
        <style>{"@media print{body{margin:0;padding:0;background:#e8e0d0;}.no-print{display:none!important;}}@page{margin:1cm;}"}</style>
        <div style={{background:"#f6f1e2",color:"#000",border:"3px solid #000",borderRadius:10,padding:"20px 18px",width:"100%",maxWidth:520,fontFamily:"Georgia,Times New Roman,serif"}}>
          {/* Header */}
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
            <img src={BRANDING.logos.iconDark} alt="" style={{height:34,width:"auto",flexShrink:0}}/>
            <div>
              <div style={{fontSize:9,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>{BRANDING.name}</div>
              <div style={{fontSize:18,fontWeight:900,textTransform:"uppercase",lineHeight:1.1}}>{name||cfg.label}</div>
            </div>
          </div>
          <div style={{fontSize:10,marginBottom:10,paddingBottom:8,borderBottom:"2px solid #000",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:4}}>
            <span>{[week,targetLabel,location].filter(Boolean).join("  ·  ")}</span>
            {duration&&<span style={{fontWeight:700}}>{duration} min</span>}
          </div>
          {coachNote&&<div style={{fontSize:10,fontStyle:"italic",marginBottom:10,paddingBottom:8,borderBottom:"1px solid rgba(0,0,0,.15)"}}>{coachNote}</div>}

          {/* Days */}
          {activeDays.map(function(day,di){
            const exs=day.exercises||[];
            return(
              <div key={di} style={{marginBottom:14}}>
                <div style={{fontWeight:900,fontSize:12,textTransform:"uppercase",letterSpacing:.8,background:"#000",color:"#fff",padding:"4px 10px",borderRadius:4,marginBottom:6}}>{day.day}</div>
                {exs.map(function(ex,ei){
                  const fnIdx=allFootnotes.findIndex(function(f){return f.day===day.day&&f.name===ex.name;});
                  return(
                    <div key={ei} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"5px 0",borderBottom:"1px solid rgba(0,0,0,.1)"}}>
                      <div style={{width:20,height:20,borderRadius:"50%",border:"1.5px solid #000",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,flexShrink:0,marginTop:1}}>{ei+1}</div>
                      <div style={{flex:1}}>
                        <div style={{display:"flex",alignItems:"baseline",gap:6,flexWrap:"wrap"}}>
                          <span style={{fontWeight:700,fontSize:12}}>{ex.name||"Exercise"}</span>
                          {(ex.sets||ex.reps)&&<span style={{fontSize:11,color:"#444"}}>{ex.sets&&ex.sets+"×"}{ex.reps&&ex.reps+" reps"}{ex.weight?" · "+ex.weight:""}</span>}
                          
                        </div>
                        {ex.notes&&<div style={{fontSize:10,color:"#555",marginTop:1,fontStyle:"italic"}}>{ex.notes}</div>}
                        {ex.desc&&<div style={{fontSize:9.5,color:"#666",fontStyle:"italic",marginTop:2,lineHeight:1.4,borderLeft:"2px solid rgba(0,0,0,.15)",paddingLeft:5}}>{ex.desc}</div>}
                      </div>
                      <div style={{display:"flex",gap:6,flexShrink:0,alignItems:"center"}}>
                        <div style={{width:36,height:16,border:"1px solid #aaa",borderRadius:2,fontSize:8,color:"#aaa",display:"flex",alignItems:"center",justifyContent:"center"}}>Wt Used</div>
                        <div style={{width:16,height:16,border:"2px solid #000",borderRadius:2}}/>
                      </div>
                    </div>
                  );
                })}
                {day.sectionNote&&<div style={{fontSize:10,color:"#555",fontStyle:"italic",marginTop:4,paddingLeft:4}}>📌 {day.sectionNote}</div>}
              </div>
            );
          })}



          <div style={{marginTop:10,paddingTop:6,display:"flex",justifyContent:"space-between",fontSize:9,borderTop:"2px solid #000"}}>
            <span>{BRANDING.productName}</span>
            <span style={{fontWeight:700}}>{week}</span>
          </div>
        </div>
      </div>
    );
  }

  // ── PRACTICE PLAN — lineup card style ──
  return(
    <div style={{display:"flex",justifyContent:"center",padding:"24px 16px",background:"#e8e0d0",minHeight:"100%"}}>
      <style>{"@media print{body{margin:0;padding:0;background:#e8e0d0;}.no-print{display:none!important;}}@page{margin:1cm;}"}</style>
      <div style={{background:"#f6f1e2",color:"#000",border:"3px solid #000",borderRadius:10,padding:"20px 18px",width:"100%",maxWidth:480,fontFamily:"Georgia,Times New Roman,serif"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
          <img src={BRANDING.logos.iconDark} alt="" style={{height:34,width:"auto",flexShrink:0}}/>
          <div>
            <div style={{fontSize:9,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>{BRANDING.name}</div>
            <div style={{fontSize:18,fontWeight:900,textTransform:"uppercase",lineHeight:1.1}}>{name||"Practice Plan"}</div>
          </div>
        </div>
        <div style={{fontSize:10,marginBottom:10,paddingBottom:8,borderBottom:"2px solid #000",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:4}}>
          <span>{[week,targetLabel,location].filter(Boolean).join("  ·  ")}</span>
          {startTime&&<span style={{fontWeight:700}}>{fmt12(startTime)}{endTime?" – "+fmt12(endTime):""}{totalMin?" ("+totalMin+"m)":""}</span>}
        </div>
        {coachNote&&<div style={{fontSize:10,fontStyle:"italic",marginBottom:10,paddingBottom:8,borderBottom:"1px solid rgba(0,0,0,.15)"}}>{coachNote}</div>}
        {activeDays.map(function(day,si){
          const drills=day.exercises||[];
          return(
            <div key={si} style={{marginBottom:12}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                <div style={{fontWeight:900,fontSize:11,textTransform:"uppercase",letterSpacing:.8,flex:1}}>{si+1}. {day.day}</div>
                {day.sectionDuration&&<div style={{fontSize:10,fontWeight:700,color:"#444"}}>({day.sectionDuration} min)</div>}
                {computedTimes&&computedTimes[si]&&<div style={{fontSize:10,color:"#444"}}>{fmt12(computedTimes[si])}</div>}
              </div>
              {drills.map(function(ex,ei){
                const fnIdx=allFootnotes.findIndex(function(f){return f.day===day.day&&f.name===ex.name;});
                const notes=(ex.notes||"").split(/[;]+/).filter(Boolean);
                return(
                  <div key={ei} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"5px 0",borderBottom:"1px solid rgba(0,0,0,.12)"}}>
                    <div style={{width:20,height:20,borderRadius:"50%",border:"1.5px solid #000",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,flexShrink:0,marginTop:1}}>{ei+1}</div>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",alignItems:"baseline",gap:6,flexWrap:"wrap"}}>
                        <span style={{fontWeight:700,fontSize:13}}>{ex.name||"Activity"}</span>
                        {ex.weight&&<span style={{fontSize:10,color:"#444"}}>({ex.weight} min)</span>}
                        
                      </div>
                      {notes.map(function(n,ni){return(<div key={ni} style={{fontSize:11,color:"#333",marginTop:1}}>{notes.length>1?String.fromCharCode(97+ni)+") ":""}{n.trim()}</div>);})}
                      {ex.desc&&<div style={{fontSize:9.5,color:"#555",fontStyle:"italic",marginTop:3,lineHeight:1.4,borderLeft:"2px solid rgba(0,0,0,.15)",paddingLeft:6}}>{ex.desc}</div>}
                    </div>
                  </div>
                );
              })}
              {day.sectionNote&&<div style={{fontSize:10,color:"#555",fontStyle:"italic",marginTop:4,paddingLeft:4}}>📌 {day.sectionNote}</div>}
            </div>
          );
        })}

        <div style={{marginTop:10,paddingTop:6,display:"flex",justifyContent:"space-between",fontSize:9,borderTop:"2px solid #000"}}>
          <span>{BRANDING.productName}</span>
          <span style={{fontWeight:700}}>{week}</span>
        </div>
      </div>
    </div>
  );
}


function App(){
  const[profile,setProfile]=useState(null);
  const[loading,setLoading]=useState(true);
  const[resetMode,setResetMode]=useState(false);

  // Check if this is a password reset redirect from Supabase email
  useEffect(()=>{
    const hash=window.location.hash;
    const params=new URLSearchParams(hash.replace("#","?").replace("#","&"));
    const type=params.get("type");
    const accessToken=params.get("access_token");
    if((type==="recovery"||type==="signup")&&accessToken){
      _tok=accessToken;
      try{localStorage.setItem("dt",JSON.stringify({access_token:accessToken,expires_at:Date.now()/1000+3600}));}catch(e){}
      // Both a password-reset link and a first-time signup-confirmation link land here.
      // Either way, the athlete needs to choose a real password they actually know.
      setResetMode(true);setLoading(false);
      window.history.replaceState(null,"",window.location.pathname);
    }
  },[]);
  const[athletes,setAthletes]=useState([]);
  const[coaches,setCoaches]=useState([]);
  const[parents,setParents]=useState([]);
  const[myChildren,setMyChildren]=useState([]);
  const[programs,setPrograms]=useState([]);
  const[weekends,setWeekends]=useState([]);
  const[checkins,setCheckins]=useState([]);
  const[teams,setTeams]=useState([]);
  const[games,setGames]=useState([]);
  const[logs,setLogs]=useState({});
  const[sessions,setSessions]=useState({});
  const[measHist,setMeasHist]=useState({});
  const[selfLogs,setSelfLogs]=useState([]);
  const[notifs,setNotifs]=useState([]);
  const[coachPage,setCoachPage]=useState("dashboard");
  const[viewAth,setViewAth]=useState(null);
  const[viewProg,setViewProg]=useState(null);
  const[buildingProg,setBuildingProg]=useState(null);
  const[modal,setModal]=useState(null);
  const[workoutView,setWorkoutView]=useState(null);
  const[showNotif,setShowNotif]=useState(false);
  const[customDrills,setCustomDrills]=useState([]);
  const[gradF,setGradF]=useState(null);
  const[groupF,setGroupF]=useState(null);
  const hasCoachAccess=profile?.role==="coach"||profile?.role==="admin"||profile?.secondary_role==="coach";
  const hasAthleteAccess=profile?.role==="athlete"||profile?.secondary_role==="athlete";
  const isParent=profile?.role==="parent";
  const isAdmin=profile?.role==="admin";
  const isDualRole=hasCoachAccess&&hasAthleteAccess;
  const[viewMode,setViewMode]=useState(null);
  const effectiveView=viewMode||(profile?.role==="athlete"?"athlete":"coach");
  const isCoach=effectiveView==="coach"&&hasCoachAccess;
  const isAthlete=effectiveView==="athlete"&&hasAthleteAccess;

  useEffect(()=>{
    const s=sb.auth.stored();
    if(s?.user){
      // Check if token is about to expire (within 5 min) and refresh proactively
      if(s.expires_at&&(s.expires_at-Date.now()/1000)<300){
        sb.auth.refreshToken();
      }
      sb.from("profiles").select("*").eq("id",s.user.id).maybeSingle().then(({data})=>{
        if(data)setProfile(data);
        setLoading(false);
      });
    }else setLoading(false);
  },[]);

  useEffect(()=>{
    if(!profile)return;
    loadAll();
  },[profile?.id]);

  const loadAll=async()=>{
    // Shared fetch helper - used by both coach and athlete blocks
    const fetchData=async(url)=>{const r=await fetchWithRefresh(SURL+"/rest/v1/"+url,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Range-Unit":"items","Range":"0-9999"}});return r.ok?r.json().catch(()=>[]):[]};
    const fetchJSON=fetchData;

    if(hasCoachAccess){
      // Coaches only see their assigned athletes; admin (and dual-role people) see all.
      // Matching on role OR secondary_role so dual-role profiles show up everywhere
      // they need to (e.g. an athlete who also coaches still appears in rosters).
      const athUrl=profile.role==="coach"
        ?`profiles?or=(role.eq.athlete,secondary_role.eq.athlete)&coach_ids=cs.{${profile.id}}&select=*&limit=5000`
        :"profiles?or=(role.eq.athlete,secondary_role.eq.athlete)&select=*&limit=5000";
      const progUrl=profile.role==="coach"
        ?`programs?created_by=eq.${profile.id}&select=*&limit=5000`
        :"programs?select=*&limit=5000";
      const[athData,progData,notifData,coachData,parentData,wkData,teamData,gameData,checkinData,slAll,logAll,customExData,sessAll,mhAll]=await Promise.all([
        fetchJSON(athUrl),
        fetchJSON(progUrl),
        fetchJSON(`notifications?recipient_id=eq.${profile.id}&order=created_at.desc&limit=100`),
        fetchJSON("profiles?or=(role.eq.coach,secondary_role.eq.coach)&select=*&limit=500"),
        fetchJSON("profiles?role=eq.parent&select=*&limit=1000"),
        fetchData("weekends?select=*&order=start_date.desc&limit=500"),
        fetchData("teams?select=*&limit=2000"),
        fetchData("games?select=*&limit=5000"),
        fetchData("checkins?select=*&order=check_date.desc&limit=10000"),
        fetchData("self_logs?order=created_at.desc&limit=10000"),
        fetchJSON("workout_logs?select=*&limit=10000"),
        fetchJSON("custom_exercises?select=*&limit=10000"),
        fetchJSON("workout_sessions?select=*&limit=10000"),
        fetchJSON("measurable_history?order=recorded_at.asc&limit=10000"),
      ]);
      if(Array.isArray(athData))setAthletes(athData);
      if(Array.isArray(progData))setPrograms(progData.map(p=>({...p,days:p.days||[],targetGrads:p.target_grads||[],targetGroups:p.target_groups||[],targetAgeGroups:p.target_age_groups||[],targetAthletes:p.target_athletes||[],athleteId:p.athlete_id,isGroup:p.is_group_program===true||p.is_group_program==="true"})));
      if(Array.isArray(notifData))setNotifs(notifData);
      if(Array.isArray(coachData))setCoaches(coachData);
      if(Array.isArray(parentData))setParents(parentData.map(p=>({...p,child_ids:p.child_ids||[]})));
      if(Array.isArray(wkData))setWeekends(wkData);
      if(Array.isArray(teamData))setTeams(teamData.map(t=>({...t,athlete_ids:t.athlete_ids||[]})));
      if(Array.isArray(gameData))setGames(gameData.map(g=>({...g,lineup:g.lineup||[],field_chart:g.field_chart||{},pitching:g.pitching||[]})));
      if(Array.isArray(checkinData))setCheckins(checkinData);
      if(Array.isArray(slAll))setSelfLogs(slAll);
      if(Array.isArray(customExData))setCustomDrills(customExData);
      const lm={};if(Array.isArray(logAll))logAll.forEach(l=>{lm[`${l.program_id}-${l.athlete_id}-${l.exercise_id}`]=l;});setLogs(lm);
      const sm={};if(Array.isArray(sessAll))sessAll.forEach(s=>{sm[`${s.program_id}-${s.athlete_id}`]=s;});setSessions(sm);
      const mm={};if(Array.isArray(mhAll))mhAll.forEach(m=>{if(!mm[m.athlete_id])mm[m.athlete_id]=[];mm[m.athlete_id].push(m);});setMeasHist(mm);
    }

    if(hasAthleteAccess&&!hasCoachAccess){
      // Pure athlete: only need their own scoped data. (A dual-role person
      // already got the full superset above - logs/sessions/measHist use the
      // same lookup keys either way, and AthPortal filters self_logs down to
      // its own athlete_id at render time, so nothing's missing for them.)
      const[logData,sessData,slData,mhData,athProgData,ckData,gameData]=await Promise.all([
        fetchData(`workout_logs?athlete_id=eq.${profile.id}&select=*&limit=5000`),
        fetchData(`workout_sessions?athlete_id=eq.${profile.id}&select=*&limit=5000`),
        fetchData(`self_logs?athlete_id=eq.${profile.id}&order=created_at.desc&limit=5000`),
        fetchData(`measurable_history?athlete_id=eq.${profile.id}&order=recorded_at.asc&limit=5000`),
        fetchData(`programs?select=*&limit=1000`),
        fetchData(`checkins?athlete_id=eq.${profile.id}&select=*&order=check_date.desc&limit=200`),
        fetchData("games?select=*&limit=5000"),
      ]);
      if(Array.isArray(athProgData))setPrograms(athProgData.map(p=>({...p,days:p.days||[],targetGrads:p.target_grads||[],targetGroups:p.target_groups||[],targetAgeGroups:p.target_age_groups||[],targetAthletes:p.target_athletes||[],athleteId:p.athlete_id,isGroup:p.is_group_program})));
      const lm={};if(Array.isArray(logData))logData.forEach(l=>{lm[`${l.program_id}-${l.athlete_id}-${l.exercise_id}`]=l;});setLogs(lm);
      const sm={};if(Array.isArray(sessData))sessData.forEach(s=>{sm[`${s.program_id}-${s.athlete_id}`]=s;});setSessions(sm);
      if(Array.isArray(slData))setSelfLogs(slData.map(l=>({...l,metrics:l.metrics||{},exercises:l.exercises||[]})));
      if(Array.isArray(mhData))setMeasHist({[profile.id]:mhData});
      if(Array.isArray(ckData))setCheckins(ckData);
      if(Array.isArray(gameData))setGames(gameData.map(g=>({...g,lineup:g.lineup||[],field_chart:g.field_chart||{},pitching:g.pitching||[]})));
    }

    if(isParent){
      const childIds=profile.child_ids||[];
      if(childIds.length>0){
        const idList=childIds.join(",");
        const[childProfiles,progData,logData,sessData,slData,mhData,gameData]=await Promise.all([
          fetchData(`profiles?id=in.(${idList})&select=*`),
          fetchData(`programs?select=*&limit=2000`),
          fetchData(`workout_logs?athlete_id=in.(${idList})&select=*&limit=10000`),
          fetchData(`workout_sessions?athlete_id=in.(${idList})&select=*&limit=10000`),
          fetchData(`self_logs?athlete_id=in.(${idList})&order=created_at.desc&limit=5000`),
          fetchData(`measurable_history?athlete_id=in.(${idList})&order=recorded_at.asc&limit=5000`),
          fetchData("games?select=*&limit=5000"),
        ]);
        if(Array.isArray(childProfiles))setMyChildren(childProfiles);
        if(Array.isArray(progData))setPrograms(progData.map(p=>({...p,days:p.days||[],targetGrads:p.target_grads||[],targetGroups:p.target_groups||[],targetAgeGroups:p.target_age_groups||[],targetAthletes:p.target_athletes||[],athleteId:p.athlete_id,isGroup:p.is_group_program})));
        const lm={};if(Array.isArray(logData))logData.forEach(l=>{lm[`${l.program_id}-${l.athlete_id}-${l.exercise_id}`]=l;});setLogs(lm);

    // Accumulate stats across multiple game imports rather than overwriting
    matchedRows.forEach(r=>{
      const prev=newBatting[r.athleteId]||{};
      const b=r.batting;
      newBatting[r.athleteId]={
        gp:(prev.gp||0)+(b.gp||0),
        pa:(prev.pa||0)+(b.pa||0),
        ab:(prev.ab||0)+(b.ab||0),
        h:(prev.h||0)+(b.h||0),
        b1:(prev.b1||0)+(b.b1||0),

        sf:(prev.sf||0)+(b.sf||0),
        tb:(prev.tb||0)+(b.tb||0),

      };
      const prevF=newFielding[r.athleteId]||{};

      // Accumulate innings per position and summary stats

      FIELD_POS.forEach(pos=>{accPos[pos]=(prevF[pos]||0)+(f[pos]||0);});

        po:(prevF.po||0)+(f.po||0),
        assists:(prevF.assists||0)+(f.assists||0),
        tc:(prevF.tc||0)+(f.tc||0),
      };
    });

      target_athletes:prog.targetAthletes||[],
      days:prog.days,
      created_by:profile.id,
      plan_type:prog.planType||null,
      location:prog.location||null,
      duration:prog.duration||null,
      plan_notes:prog.planNotes||null,
      start_time:prog.startTime||null,
    };
    const r=await fetchWithRefresh(`${SURL}/rest/v1/programs`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify([payload])});
    if(!r.ok){const t=await r.text();alert("Error saving program: "+t);return;}
    const fresh=await fetchWithRefresh(`${SURL}/rest/v1/programs?select=*&limit=5000`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}}).then(r=>r.json()).catch(()=>[]);
    if(Array.isArray(fresh))setPrograms(fresh.map(p=>({...p,days:p.days||[],targetGrads:p.target_grads||[],targetGroups:p.target_groups||[],targetAgeGroups:p.target_age_groups||[],targetAthletes:p.target_athletes||[],athleteId:p.athlete_id,isGroup:p.is_group_program,planType:p.plan_type})));
  };

  const saveAthlete=async(ath)=>{
    const row={email:ath.email||`athlete_${Date.now()}@diamondtrack.local`,name:ath.name,role:"athlete",position:ath.position,other_positions:ath.other_positions||null,grad:ath.grad||null,age_group:ath.age_group||null,gpa:ath.gpa||null,high_school:ath.high_school||null,dream_school:ath.dreamSchool||ath.dream_school||null,height:ath.height||null,weight:ath.weight||null,bats:ath.bats||null,throws:ath.throws||null,committed:ath.committed||false,avatar:ini(ath.name),measurables:ath.measurables||{},coach_ids:ath.coach_ids||[profile.id]};
    if(ath.id){
      console.log("Saving athlete profile:",ath.id,JSON.stringify(row));
      const r=await fetchWithRefresh(`${SURL}/rest/v1/profiles?id=eq.${ath.id}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify(row)});
      const rtext=await r.text();
      console.log("profile update response:",r.status,rtext);
      if(!r.ok){alert("Profile save failed ("+r.status+"):\n"+rtext);return null;}
      const r2=await fetch(`${SURL}/rest/v1/profiles?id=eq.${ath.id}&select=*`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Accept":"application/vnd.pgrst.object+json"}});
      const fresh=await r2.json().catch(()=>null);
      if(fresh&&fresh.id){setAthletes(p=>p.map(a=>a.id===fresh.id?fresh:a));}
      return fresh||{...ath,...row};
    }else{
      // Sign up athlete with a temporary password so they exist in auth.users
      const tempPw=BRANDING.productName+"_"+Math.random().toString(36).slice(2,10)+"!";
      const email=ath.email||`athlete_${Date.now()}@diamondtrack.local`;
      const redirectTo=encodeURIComponent(window.location.origin+window.location.pathname);
      const r=await fetch(`${SURL}/auth/v1/signup?redirect_to=${redirectTo}`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY},body:JSON.stringify({email,password:tempPw})});
      const authData=await r.json();
      if(!r.ok){
        // If already exists, try to find their profile
        const{data:existing}=await sb.from("profiles").select("*").eq("email",email).maybeSingle();
        if(existing){setAthletes(p=>[...p,existing]);return;}
        alert("Could not create athlete account: "+(authData.message||authData.msg||JSON.stringify(authData)));
        return;
      }
      const uid=authData.user?.id||authData.id;
      if(!uid){alert("No user ID returned from Supabase");return;}
      const{data,error:pe}=await sb.from("profiles").insert({...row,email,id:uid});
      if(pe){const msg=pe.message||pe.hint||pe.code||JSON.stringify(pe);if(msg.includes("age_group")||msg.includes("column")){alert("Missing DB column - run in Supabase SQL Editor: ALTER TABLE profiles ADD COLUMN IF NOT EXISTS age_group text;");}else{alert("Save error: "+msg);}return;}
      if(data)setAthletes(p=>[...p,data]);
      // Also reload full list from server to catch any RLS-filtered results
      sb.from("profiles").select("*").eq("role","athlete").then(({data:all})=>{if(all&&all.length>0)setAthletes(all);});
      alert("\u2705 "+ath.name+" added!\n\nLogin: https://rabaseball.github.io/diamondtrack\nEmail: "+email+"\nTemp password: "+tempPw+"\n\nShare these credentials with the athlete.");
    }
  };

  const saveMeas=async(athId,entry)=>{
    const filtered=Object.fromEntries(Object.entries(entry).filter(([k,v])=>v!==null&&v!==""));
    if(!Object.keys(filtered).length){alert("Enter at least one value first.");return false;}
    const now=new Date().toISOString();
    const payload={athlete_id:athId,...filtered,recorded_by:profile.id,recorded_at:now,date_label:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})};
    console.log("saveMeas payload:",JSON.stringify(payload));
    const r=await fetchWithRefresh(`${SURL}/rest/v1/measurable_history`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify([payload])});
    const rtext=await r.text();
    console.log("saveMeas response:",r.status,rtext);
    if(!r.ok){alert("Measurable save failed ("+r.status+"):\n"+rtext);return false;}
    const merged={...(athletes.find(a=>a.id===athId)?.measurables||{}),...filtered};
    const r2=await fetchWithRefresh(`${SURL}/rest/v1/profiles?id=eq.${athId}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify({measurables:merged})});
    const r2text=await r2.text();
    console.log("profile measurables update:",r2.status,r2text);
    if(!r2.ok){alert("Profile measurables update failed ("+r2.status+"):\n"+r2text);return false;}
    setAthletes(p=>p.map(a=>a.id===athId?{...a,measurables:merged}:a));
    const r3=await fetch(`${SURL}/rest/v1/measurable_history?athlete_id=eq.${athId}&order=recorded_at.asc`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    const hist=await r3.json().catch(()=>[]);
    if(Array.isArray(hist))setMeasHist(p=>({...p,[athId]:hist}));
    return true;
  };

  const saveSelfLog=async(entry)=>{
    const{data,error}=await sb.from("self_logs").insert({athlete_id:profile.id,...entry});
    if(error){
      alert("Error saving session ["+(error.code||"?")+"]: "+(error.message||"")+(error.details?" | "+error.details:""));
      return false;
    }
    // Reload self logs from DB
    const{data:all}=await sb.from("self_logs").select("*").eq("athlete_id",profile.id).order("created_at",{ascending:false});
    if(all)setSelfLogs(all.map(l=>({...l,metrics:l.metrics||{},exercises:l.exercises||[]})));
    return true;
  };



  const logout=async()=>{await sb.auth.signOut();setProfile(null);};
  const unreadN=notifs.filter(n=>!n.read).length;

  const athProgs=useMemo(()=>{
    if(!hasAthleteAccess||!profile)return[];
    return programs.filter(p=>{
      if(p.athleteId===profile.id)return true;
      if(!p.isGroup)return false;
      const g=getPG(profile.position);
      const athleteGrad=parseInt(profile.grad);
      // targetGrads could be null, empty array, or array of numbers/strings
      const tg=p.targetGrads||p.target_grads||[];
      const tt=p.targetGroups||p.target_groups||[];
      const ta=p.targetAgeGroups||p.target_age_groups||[];
      const gradStr=String(profile.grad);
      const gradMatch=!tg.length||tg.some(yr=>String(yr)===gradStr);
      const ageMatch=!ta.length||ta.includes(profile.age_group);
      const groupMatch=!tt.length||tt.includes(g);
      console.log("Program match:",p.name,"tg:",JSON.stringify(tg),"grad:",gradStr,"gm:",gradMatch,"g:",g,"gpm:",groupMatch);
      return((tg.length||ta.length)?(gradMatch||ageMatch):true)&&groupMatch;
    }).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  },[programs,profile?.id,profile?.grad,profile?.position]);

  const filtAthletes=useMemo(()=>{
    let l=athletes;
    if(gradF){
      // gradF could be a number (grad year) or string (age group like "10U")
      const isNum=typeof gradF==="number"||!isNaN(Number(gradF));
      if(isNum)l=l.filter(a=>a.grad===Number(gradF));
      else l=l.filter(a=>a.age_group===gradF);
    }
    if(groupF)l=l.filter(a=>getPG(a.position)===groupF);
    return l;
  },[athletes,gradF,groupF]);

  if(loading)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"#6b82a0",fontSize:15,letterSpacing:1}}>Loading {BRANDING.productName}...</div>;
  if(resetMode)return<><style>{CSS}</style><ResetPasswordScreen onDone={()=>setResetMode(false)}/></>;
  if(!profile)return<><style>{CSS}</style><AuthScreen onAuth={setProfile}/></>;

  const coachBody=()=>{
    if(viewAth&&coachPage==="athletes")return<AthDetail athlete={viewAth} programs={programs} logs={logs} sessions={sessions} calcPct={calcPct} getSess={getSess} isSaved={isSaved} onBack={()=>setViewAth(null)} measHist={measHist[viewAth.id]||[]} selfLogs={selfLogs.filter(l=>l.athlete_id===viewAth.id)} onSaveMeas={e=>saveMeas(viewAth.id,e)} onSaveAth={async(ath)=>{const fresh=await saveAthlete(ath);if(fresh)setViewAth(fresh);}} games={games} parents={parents} onLinkParent={linkParentToAthlete} onUnlinkParent={unlinkParentFromAthlete}/>;
    if(buildingProg&&(coachPage==="programs"||coachPage==="plans"))return<WorkoutBuilder type={buildingProg} athletes={athletes} programs={programs} onBack={()=>setBuildingProg(null)} onSave={async(prog)=>{await saveProgram(prog);setBuildingProg(null);}}/>;
    if(viewProg&&(coachPage==="programs"||coachPage==="plans"))return<ProgDetail prog={viewProg} athletes={athletes} logs={logs} sessions={sessions} calcPct={calcPct} isSaved={isSaved} getSess={getSess} onBack={()=>setViewProg(null)} onClickAth={a=>{setViewAth(a);setCoachPage("athletes");}} onUpdate={updateProgram} onCopy={copyProgram} onDelete={deleteProgram}/>;
    switch(coachPage){
      case"dashboard":return<Dashboard athletes={athletes} programs={programs} calcPct={calcPct} setCoachPage={setCoachPage} setViewAth={setViewAth} isAdmin={isAdmin}/>;
      case"games":return<GamesPage athletes={athletes} weekends={weekends} teams={teams} games={games} coaches={coaches} profile={profile} onSaveWeekend={saveWeekend} onDeleteWeekend={deleteWeekend} onSaveTeam={saveTeam} onDeleteTeam={deleteTeam} onRenameTeam={renameTeam} onUpdateRoster={updateTeamRoster} onSaveGame={saveGame} onDeleteGame={deleteGame} onPatchGame={patchGame} onImportTeamStats={importTeamStats} onClearTeamStats={clearTeamStats} onSaveDefensePlan={saveDefensePlan} onSaveBilling={saveBilling} onUpdateAthleteBalance={updateAthleteBalance} setAthletes={setAthletes} isAdmin={isAdmin}/>;
      case"checkin":return<CheckInPage athletes={athletes} checkins={checkins} programs={programs} profile={profile} onToggleCheckin={toggleCheckin} onBulkComplete={bulkCompletePrograms}/>;
      case"athletes":return<AthRoster athletes={filtAthletes} allAthletes={athletes} programs={programs} calcPct={calcPct} gradF={gradF} setGradF={setGradF} groupF={groupF} setGroupF={setGroupF} onView={a=>setViewAth(a)} onAdd={()=>setModal("addAth")}/>;
      case"drills":return<DrillLibraryPage athletes={athletes} customDrills={customDrills} setCustomDrills={setCustomDrills} profile={profile} isAdmin={isAdmin}/>;
      case"plans":return<>{buildingProg==="plan"?<WorkoutBuilder type="plan" athletes={athletes} programs={programs} onBack={()=>setBuildingProg(null)} onSave={async(prog)=>{await saveProgram(prog);setBuildingProg(null);}}/>:<PlansPage athletes={athletes} programs={programs} onSave={saveProgram} onView={p=>{setViewProg(p);setCoachPage("plans");}} buildingProg={buildingProg} setBuildingProg={setBuildingProg}/>}</>;
      case"programs":return<ProgsPage athletes={athletes} programs={programs} calcPct={calcPct} onView={setViewProg} onAdd={()=>setBuildingProg("individual")} onAddGroup={()=>setBuildingProg("group")} onAddPlan={()=>setBuildingProg("plan")}/>;
      case"groups":return<GroupsPage athletes={athletes} onClickAth={a=>{setViewAth(a);setCoachPage("athletes");}}/>;      
      case"coaches":return<CoachesPage coaches={coaches} programs={programs} athletes={athletes} allAthletes={athletes} calcPct={calcPct} onViewAth={a=>{setViewAth(a);setCoachPage("athletes");}} onAssignCoach={assignCoachToAthlete} onRemoveCoach={removeCoachFromAthlete}/>;

      case"notifications":return<NotifPage notifs={notifs} setNotifs={setNotifs} profile={profile}/>;
      default:return null;
    }
  };

  return(
    <><style>{CSS}</style>
    <div className="app">
      <header className="hdr">
        {isCoach&&(viewAth||viewProg)&&<button onClick={()=>{setViewAth(null);setViewProg(null);}} style={{background:"rgba(232,160,32,.15)",border:"1px solid rgba(232,160,32,.3)",borderRadius:7,color:"#e8a020",padding:"5px 12px",cursor:"pointer",fontSize:13,fontWeight:700,marginRight:8}}>← Back</button>}
        {/* "RA"+"Track" is a manual two-tone split of BRANDING.productName for this club's wordmark pun; a future club's product name may not split this neatly. */}
        <div className="hdr-brand" style={{cursor:"pointer",display:"flex",alignItems:"center",gap:8}} title={BRANDING.name} onClick={()=>{setViewAth(null);setViewProg(null);setCoachPage("dashboard");}}>
          <img src={BRANDING.logos.icon} alt="" style={{height:28,width:"auto"}}/>
          <span>RA<em>Track</em></span>
        </div>
        <div className="hdr-right">
          {isCoach&&<>
            <div style={{position:"relative"}}>
              <button className="btn bgh bsm" style={{padding:"6px 9px",position:"relative"}} onClick={()=>setShowNotif(p=>!p)}>
                🔔{unreadN>0&&<span style={{position:"absolute",top:1,right:1,width:14,height:14,borderRadius:"50%",background:"#e84040",color:"#fff",fontSize:8,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{unreadN>9?"9+":unreadN}</span>}
              </button>
              {showNotif&&<NotifPanel notifs={notifs} setNotifs={setNotifs} onClose={()=>setShowNotif(false)} profile={profile}/>}
            </div>

          </>}
          {isDualRole&&(
            <button
              className="btn bgn bsm"
              title="Switch between your athlete and coach views"
              onClick={()=>{setViewMode(effectiveView==="coach"?"athlete":"coach");setViewAth(null);setViewProg(null);}}
            >
              {effectiveView==="coach"?"🏠 View as Athlete":"🛡️ View as Coach"}
            </button>
          )}
          <div className="ubadge">
            <div className="uav">{profile.avatar||ini(profile.name)}</div>
            <div style={{fontSize:12,fontWeight:600}}>{profile.name?.split(" ")[0]}</div>
            <button className="btn bgh bsm" style={{marginLeft:2}} onClick={logout}>↩</button>
          </div>
        </div>
      </header>
      <div className="layout">
        {isCoach&&<aside className="sb">
          {[["dashboard","🏠","Dashboard"],["checkin","✅","Check-In"],["athletes","👤","Athletes"],["games","⚾","Games"],["programs","🏋️","Workouts"],["plans","📋","Practice Plans"],["drills","⚾","Drill Library"],["groups","🏷️","Groups"],["notifications","🔔","Notifications"],...(isAdmin?[["coaches","🛡️","Coaches"]]:[])]  .map(([id,ic,lb])=>(
            <button key={id} className={`sbn ${coachPage===id&&!viewAth&&!viewProg?"on":""}`} onClick={()=>{setCoachPage(id);setViewAth(null);setViewProg(null);}}>
              <span>{ic}</span><span>{lb}</span>
            </button>
          ))}
        </aside>}
        <main className="body">
          {isCoach&&coachBody()}
          {isAthlete&&(workoutView
            ?<WorkoutLogger prog={workoutView} athlete={profile} getLog={getLog} updateLog={(p,e,f,v)=>saveEx(p,e,f,v)} saveEx={(p,e)=>saveEx(p,e,"saved",true,true)} markComplete={markComplete} calcPct={calcPct} onBack={()=>setWorkoutView(null)} getSess={getSess} reloadLogs={async(pId)=>{
    const r=await fetch(`${SURL}/rest/v1/workout_logs?athlete_id=eq.${profile.id}&program_id=eq.${pId}&select=*`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    if(r.ok){const data=await r.json().catch(()=>[]);if(Array.isArray(data)){const lm={...logs};data.forEach(l=>{lm[`${l.program_id}-${l.athlete_id}-${l.exercise_id}`]=l;});setLogs(lm);}}
    const sr=await fetch(`${SURL}/rest/v1/workout_sessions?athlete_id=eq.${profile.id}&program_id=eq.${pId}&select=*`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    if(sr.ok){const sdata=await sr.json().catch(()=>[]);if(Array.isArray(sdata)){const sm={...sessions};sdata.forEach(s=>{sm[`${s.program_id}-${s.athlete_id}`]=s;});setSessions(sm);}}
  }}/>
            :<AthPortal athlete={profile} programs={athProgs} isSaved={isSaved} calcPct={calcPct} setWorkoutView={setWorkoutView} measHist={measHist[profile.id]||[]} selfLogs={selfLogs} onSaveSelfLog={saveSelfLog} profile={profile} checkins={checkins} onToggleCheckin={()=>toggleCheckin(profile.id)} games={games}/>
          )}
          {isParent&&<ParentPortal parent={profile} childAthletes={myChildren} programs={programs} calcPct={calcPct} selfLogs={selfLogs} measHist={measHist} games={games}/>}
        </main>
      </div>
      {modal==="addPlan"&&<PracticePlanModal athletes={athletes} onClose={()=>setModal(null)} onSave={async(prog)=>{await saveProgram(prog);setModal(null);}}/> }
      {modal==="addAth"&&<AddAthModal onClose={()=>setModal(null)} onSave={a=>{saveAthlete(a);setModal(null);}}/>}
      {modal==="addProg"&&<AddProgModal athletes={athletes} onClose={()=>setModal(null)} onSave={p=>{saveProgram(p);setModal(null);}}/>}
      {modal==="addGroup"&&<AddGroupModal athletes={athletes} onClose={()=>setModal(null)} onSave={p=>{saveProgram(p);setModal(null);}}/>}
      {isCoach&&<nav className="bnav">
        {[["dashboard","🏠","Home"],["checkin","✅","Check-In"],["athletes","👤","Roster"],["games","⚾","Games"],["programs","🏋️","Workouts"],["plans","📋","Plans"],["groups","🏷️","Groups"],["notifications","🔔","Alerts"],...(isAdmin?[["coaches","🛡️","Coaches"]]:[])]  .map(([id,ic,lb])=>(
          <button key={id} className={`bnavb ${coachPage===id&&!viewAth&&!viewProg?"on":""}`} onClick={()=>{setCoachPage(id);setViewAth(null);setViewProg(null);}}>
            <span className="bnavbi">{ic}</span><span>{lb}</span>
          </button>
        ))}
      </nav>}
    </div></>
  );
}
function Dashboard({athletes,programs,calcPct,setCoachPage,setViewAth,isAdmin}){
  const avgPct=programs.length?Math.round(programs.reduce((s,p)=>s+calcPct(p),0)/programs.length):0;
  const[expandedGroup,setExpandedGroup]=useState(null);
  const[expandedGrad,setExpandedGrad]=useState(null);
  const[expandedAge,setExpandedAge]=useState(null);
  const activeAgeGroups=AGE_GROUPS.filter(g=>athletes.some(a=>a.age_group===g));

  const goAth=(a)=>{setCoachPage("athletes");setViewAth(a);};

  const AthRow=({a})=>{
    const prog=programs.find(p=>p.athleteId===a.id);const pct=prog?calcPct(prog):0;
    return(
      <div className="ri" style={{cursor:"pointer",paddingLeft:12}} onClick={()=>goAth(a)}>
        <div className="riv" style={{width:28,height:28,fontSize:10}}>{a.avatar||ini(a.name)}</div>
        <div style={{flex:1}}><div style={{fontSize:12,fontWeight:600}}>{a.name}</div><div style={{fontSize:10,color:"#6b82a0"}}>{a.position}{a.grad?` · ${a.grad}`:a.age_group?` · ${a.age_group}`:""}</div></div>
        <div style={{fontSize:12,fontWeight:700,color:"#e8a020"}}>{pct}%</div>
        <span style={{fontSize:10,color:"#6b82a0",marginLeft:4}}>→</span>
      </div>
    );
  };

  return(<>
    <div className="pt">Coach <em>Dashboard</em></div>
    <div className="sr">
      <div className="sb2" style={{cursor:"pointer"}} onClick={()=>setCoachPage("athletes")}><div className="sv">{athletes.length}</div><div className="sl">Athletes</div></div>
      <div className="sb2"><div className="sv">{programs.length}</div><div className="sl">Programs</div></div>
      <div className="sb2"><div className="sv">{avgPct}%</div><div className="sl">Avg Complete</div></div>
      <div className="sb2"><div className="sv">{athletes.filter(a=>a.committed).length}</div><div className="sl">Committed</div></div>
    </div>
    <div className="dg">
      <div className="card">
        <div className="ds">Go To</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8}}>
          {[["checkin","✅","Check-In"],["athletes","👤","Athletes"],["games","⚾","Games"],["programs","🏋️","Workouts"],["groups","🏷️","Groups"],["notifications","🔔","Notifications"],...(isAdmin?[["coaches","🛡️","Coaches"]]:[])].map(([id,ic,lb])=>(
            <button key={id} onClick={()=>setCoachPage(id)} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:6,padding:"18px 8px",borderRadius:10,border:"1px solid rgba(255,255,255,.08)",background:"rgba(255,255,255,.03)",cursor:"pointer",color:"#eef2f8",transition:"all .15s"}}>
              <span style={{fontSize:24}}>{ic}</span>
              <span style={{fontSize:12,fontWeight:700}}>{lb}</span>
            </button>
          ))}
        </div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <div className="card">
          <div className="ds">By Position Group</div>
          {Object.keys(POSITION_GROUPS).map(g=>{
            const grpAthletes=athletes.filter(a=>getPG(a.position)===g);
            if(!grpAthletes.length)return null;
            const open=expandedGroup===g;
            return(<div key={g} style={{marginBottom:4}}>
              <div onClick={()=>setExpandedGroup(open?null:g)} style={{display:"flex",alignItems:"center",gap:7,padding:"6px 8px",borderRadius:7,cursor:"pointer",background:open?`${gColor[g]}15`:"transparent",border:`1px solid ${open?gColor[g]:"transparent"}`}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:gColor[g],flexShrink:0}}/>
                <div style={{flex:1,fontSize:12,fontWeight:open?700:400,color:open?gColor[g]:"#eef2f8"}}>{g}</div>
                <span className="bdg bg3">{grpAthletes.length}</span>
                <span style={{fontSize:10,color:"#6b82a0",marginLeft:2}}>{open?"▲":"▼"}</span>
              </div>
              {open&&<div style={{borderLeft:`2px solid ${gColor[g]}40`,marginLeft:11,paddingLeft:4,marginTop:2}}>
                {grpAthletes.map(a=><AthRow key={a.id} a={a}/>)}
              </div>}
            </div>);
          })}
        </div>
        <div className="card">
          <div className="ds">By Grad Year</div>
          {GRAD_YEARS.map(yr=>{
            const yrAthletes=athletes.filter(a=>a.grad===yr);
            if(!yrAthletes.length)return null;
            const open=expandedGrad===yr;

function ActivityFeed({athlete,programs,selfLogs=[],sessions={},logs={}}){

    return{date:s.completed_at,icon:"✅",title:`Completed: ${prog?.name||"Workout"}`,sub:s.duration_minutes?`${s.duration_minutes} min`:""};
  });
  const logEvents=(selfLogs||[]).map(l=>({date:l.created_at,icon:"📝",title:`Logged: ${l.type||"Session"}`,sub:l.notes||""}));
  const all=[...sessEvents,...logEvents].filter(e=>e.date).sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(all.length===0)return<div className="empty"><div className="ei">📭</div><div className="et">No activity yet</div><div className="es">Completed workouts and logged sessions will show up here.</div></div>;
  return(
    <div>

        <div key={i} style={{display:"flex",gap:10,padding:"9px 0",borderBottom:"1px solid rgba(255,255,255,.06)"}}>

          </div>
          <div style={{fontSize:10,color:"#6b82a0",whiteSpace:"nowrap",flexShrink:0}}>{new Date(e.date).toLocaleDateString()}</div>
        </div>
      ))}
    </div>
  );
}

function computeBadges(logs){
  const badges=[];
  const count=logs.length;
  [[1,"🌱","First Log"],[10,"🔥","10 Logged"],[25,"💪","25 Logged"],[50,"🏆","50 Logged"],[100,"👑","Century Club"]].forEach(([n,icon,label])=>{
    if(count>=n)badges.push({icon,label});
  });
  const types=new Set(logs.map(l=>l.type));
  if(types.size>=4)badges.push({icon:"🌟",label:"Well-Rounded"});
  if(types.has("Game"))badges.push({icon:"🏟️",label:"Gamer"});
  if(types.has("Showcase"))badges.push({icon:"⭐",label:"Showcase Ready"});
  const days=[...new Set(logs.map(l=>(l.created_at||"").slice(0,10)).filter(Boolean))].sort().reverse();
  let streak=days.length?1:0;
  for(let i=1;i<days.length;i++){
    const diff=Math.round((new Date(days[i-1])-new Date(days[i]))/86400000);
    if(diff===1)streak++;else break;
  }
  if(streak>=3)badges.push({icon:"⚡",label:`${streak}-Day Streak`});
  if(streak>=7)badges.push({icon:"🔥",label:"Iron Will"});
  return badges;
}

function BadgeShelf({logs=[],compact=false}){
  const badges=computeBadges(logs||[]);
  if(badges.length===0){

  }
  if(compact){
    return(
      <div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:4}}>
        {badges.slice(0,4).map(b=>(<span key={b.label} title={b.label} style={{fontSize:14,background:"rgba(232,160,32,.12)",borderRadius:6,padding:"2px 6px"}}>{b.icon}</span>))}

function inGameRange(dateStr,range){
  if(range==="all")return true;
  if(!dateStr)return false;
  const d=new Date(dateStr+"T00:00:00");
  const now=new Date();
  if(range==="week"){const cutoff=new Date(now);cutoff.setDate(now.getDate()-7);return d>=cutoff&&d<=now;}
  if(range==="month"){const cutoff=new Date(now);cutoff.setDate(now.getDate()-30);return d>=cutoff&&d<=now;}
  return true;
}

function BattingStatTable({batting}){
  const slotRows=Object.entries(batting.bySlot).sort((a,b)=>(a[0]==="Unknown"?99:Number(a[0]))-(b[0]==="Unknown"?99:Number(b[0])));
  const Row=({label,d,bold})=>(
    <tr style={bold?{fontWeight:700}:undefined}>
      <td>{label}</td>
      <td>{d.pa}</td><td>{d.ab}</td><td>{d.r}</td><td>{d.h}</td><td>{d.b1}</td><td>{d.b2}</td><td>{d.b3}</td><td>{d.hr}</td>
      <td>{d.rbi}</td><td>{d.bb}</td><td>{d.so}</td><td>{d.sb}</td>
      <td style={{color:"#e8a020",fontWeight:700}}>{fmtAvg(d.ab>0?d.h/d.ab:null)}</td>
    </tr>
  );
  return(
    <div style={{overflowX:"auto"}}>
      <table className="tbl" style={{fontSize:11,whiteSpace:"nowrap"}}>
        <thead><tr><th>Spot</th><th>PA</th><th>AB</th><th>R</th><th>H</th><th>1B</th><th>2B</th><th>3B</th><th>HR</th><th>RBI</th><th>BB</th><th>SO</th><th>SB</th><th>AVG</th></tr></thead>
        <tbody>

        </tbody>
      </table>
    </div>
  );
}

function matchProgramsForAthlete(programs,athlete){
  return programs.filter(p=>{
    if(p.athleteId===athlete.id)return true;
    if(!p.isGroup)return false;
    // Specific athlete override
    const ta2=p.targetAthletes||p.target_athletes||[];
    if(ta2.length>0)return ta2.includes(athlete.id);
    const g=getPG(athlete.position);
    const tg=p.targetGrads||p.target_grads||[];
    const tt=p.targetGroups||p.target_groups||[];
    const ta=p.targetAgeGroups||p.target_age_groups||[];
    const gradStr=String(athlete.grad);
    const gradMatch=!tg.length||tg.some(yr=>String(yr)===gradStr);
    const ageMatch=!ta.length||ta.includes(athlete.age_group);
    const groupMatch=!tt.length||tt.includes(g);
    // If no targeting set on a group/plan program, only show to everyone IF it's a broadcast
    // (no grads, no ages, no groups = intentional broadcast)
    const hasTargeting=tg.length||ta.length||tt.length;
    if(!hasTargeting)return true; // explicit broadcast
    const classMatch=(tg.length||ta.length)?(gradMatch||ageMatch):true;
    return classMatch&&groupMatch;
  }).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
}

  );
