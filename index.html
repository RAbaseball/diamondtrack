const sb={
  h(x={}){return{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok||SKEY}`,...x};},
  from(t){
    const base=`${SURL}/rest/v1/${t}`;let _q=[];let _ms=false;
    const q={
      select(c="*"){_q.push(`select=${c}`);return q;},
      eq(c,v){_q.push(`${c}=eq.${v}`);return q;},
      order(c,{ascending:a=true}={}){_q.push(`order=${c}.${a?"asc":"desc"}`);return q;},
      limit(n){_q.push(`limit=${n}`);return q;},
      maybeSingle(){_ms=true;return q;},
      single(){_ms=true;return q;},
      async then(res){
        const qs=_q.length?"?"+_q.join("&"):"";
        const h=sb.h(_ms?{"Accept":"application/vnd.pgrst.object+json"}:{});
        const r=await fetch(base+qs,{headers:h}).catch(e=>({ok:false,status:500,json:()=>({message:e.message})}));
        if(!r.ok&&r.status!==406){const e=await r.json().catch(()=>({}));return res({data:null,error:e});}
        if(_ms&&r.status===406)return res({data:null,error:null});
        const data=await r.json().catch(()=>null);
        return res({data,error:null});
      },
      async insert(rows){
        const body=Array.isArray(rows)?rows:[rows];
        const r=await fetch(base,{method:"POST",headers:sb.h({"Prefer":"return=representation"}),body:JSON.stringify(body)});
        if(!r.ok){const e=await r.json().catch(()=>({message:r.statusText}));return{data:null,error:e};}
        const data=await r.json().catch(()=>null);
        return{data:Array.isArray(data)&&!Array.isArray(rows)?data[0]:data,error:null};
      },
      async upsert(rows,{onConflict}={}){
        const body=Array.isArray(rows)?rows:[rows];
        const qs=onConflict?`?on_conflict=${onConflict}`:"";
        const r=await fetch(base+qs,{method:"POST",headers:sb.h({"Prefer":"return=representation,resolution=merge-duplicates"}),body:JSON.stringify(body)});
        if(!r.ok){const e=await r.json().catch(()=>({}));return{data:null,error:e};}
        const data=await r.json().catch(()=>null);
        return{data,error:null};
      },
      async update(updates){
        const qs=_q.length?"?"+_q.join("&"):"";
        const r=await fetch(base+qs,{method:"PATCH",headers:sb.h({"Prefer":"return=representation"}),body:JSON.stringify(updates)});
        if(!r.ok){const e=await r.json().catch(()=>({}));return{data:null,error:e};}
        const data=await r.json().catch(()=>null);
        return{data,error:null};
      }
    };
    return q;
  },
  auth:{
    async refreshToken(){
      try{
        const s=localStorage.getItem("dt");
        if(!s)return false;
        const d=JSON.parse(s);
        if(!d.refresh_token)return false;
        const r=await fetch(`${SURL}/auth/v1/token?grant_type=refresh_token`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY},body:JSON.stringify({refresh_token:d.refresh_token})});
        if(!r.ok)return false;
        const nd=await r.json();
        _tok=nd.access_token;
        try{localStorage.setItem("dt",JSON.stringify(nd));}catch(e){}
        return true;
      }catch(e){return false;}
    },
    async signUp(email,password){
      const r=await fetch(`${SURL}/auth/v1/signup`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY},body:JSON.stringify({email,password})});
      const d=await r.json();
      if(!r.ok)return{data:null,error:d};
      if(d.access_token){_tok=d.access_token;try{localStorage.setItem("dt",JSON.stringify(d));}catch(e){}}
      return{data:{user:d.user||(d.id?d:null),session:d.access_token?d:null},error:null};
    },
    async signIn(email,password){
      const r=await fetch(`${SURL}/auth/v1/token?grant_type=password`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY},body:JSON.stringify({email,password})});
      const d=await r.json();
      if(!r.ok)return{data:null,error:d};
      _tok=d.access_token;
      try{localStorage.setItem("dt",JSON.stringify(d));}catch(e){}
      return{data:{user:d.user},error:null};
    },
    async signOut(){_tok=null;try{localStorage.removeItem("dt");}catch(e){}},
    stored(){
      try{const s=localStorage.getItem("dt");if(s){const d=JSON.parse(s);if(d.expires_at&&Date.now()/1000<d.expires_at){_tok=d.access_token;return d;}}}catch(e){}
      return null;
    }
  }
};

// Auto-refresh fetch - retries once if JWT expired
const fetchWithRefresh=async(url,opts={})=>{
  let r=await fetch(url,opts);
  if(r.status===401){
    const refreshed=await sb.auth.refreshToken();
    if(refreshed){
      // Update auth header with new token
      const newOpts={...opts,headers:{...opts.headers,"Authorization":`Bearer ${_tok}`}};
      r=await fetch(url,newOpts);
    } else {
      // Can't refresh - clear session and reload page
      try{localStorage.removeItem("dt");}catch(e){}
      alert("Your session expired. Please sign in again.");
      window.location.reload();
      return r;
    }
  }
  return r;
};

function fmtTime12(t){
  if(!t)return"";
  const[h,m]=t.split(":").map(Number);
  if(isNaN(h))return t;
  const period=h>=12?"PM":"AM";
  const h12=h%12===0?12:h%12;
  return `${h12}:${String(m).padStart(2,"0")} ${period}`;
}

const FIELD_POS=["P","C","1B","2B","3B","SS","LF","CF","RF"];
const LINEUP_POS=["P","C","1B","2B","3B","SS","LF","CF","RF","DH"];
const GAME_INNINGS=[1,2,3,4,5,6,7,8,9];
// --- GameChanger CSV import ---
// Column positions verified against a real "Export Stats" CSV from
// web.gc.com (Team > Stats > Export Stats). Several header NAMES repeat
// across the Batting/Pitching/Fielding sections (e.g. "1B"/"2B"/"3B"/"SB"
// mean different things in each section), so this reads by fixed index
// rather than by header text.
const GC_COLS={
  number:0,last:1,first:2,
  bat_gp:3,bat_ab:5,bat_h:10,bat_1b:11,bat_2b:12,bat_3b:13,bat_hr:14,
  bat_rbi:15,bat_r:16,bat_bb:17,bat_so:18,bat_sb:25,
  fld_P:163,fld_C:164,fld_1B:165,fld_2B:166,fld_3B:167,fld_SS:168,
  fld_LF:169,fld_CF:170,fld_RF:171,fld_SF:172,fld_Total:173
};
function parseCSVText(text){
  const rows=[];let row=[],field="",inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQ=false;}
      else field+=c;
    }else{
      if(c==='"')inQ=true;
      else if(c===','){row.push(field);field="";}
      else if(c==='\n'||c==='\r'){
        if(c==='\r'&&text[i+1]==='\n')i++;
        row.push(field);field="";rows.push(row);row=[];
      }else field+=c;
    }
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows;
}
function gcInningsToDecimal(n){
  const whole=Math.trunc(n);
  const frac=Math.round((n-whole)*10);
  if(frac>=3||frac<0)return n; // not baseball out-notation, leave as-is
  return whole+frac/3;
}
function fmtInnings(n){
  if(!n)return"0";
  const whole=Math.floor(n+1e-9);
  const rem=Math.round((n-whole)*3);
  if(rem>=3)return`${whole+1}`;
  return rem===0?`${whole}`:`${whole}.${rem}`;
}
function parseGameChangerCSV(text){
  text=text.replace(/^\uFEFF/,"");
  const rows=parseCSVText(text);
  const num=(v)=>{const n=parseFloat((v||"0").toString().replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n;};
  const innings=(v)=>gcInningsToDecimal(num(v));
  const out=[];
  for(let i=2;i<rows.length;i++){
    const r=rows[i];
    if(!r||r.length<100)continue;
    const first=(r[GC_COLS.first]||"").trim();
    const last=(r[GC_COLS.last]||"").trim();
    if(!first&&!last)continue;
    if(last==="Totals"||first==="Totals"||last==="Glossary")continue;
    out.push({
      number:(r[GC_COLS.number]||"").trim(),
      name:`${first} ${last}`.trim(),
      first,last,
      batting:{
        gp:num(r[GC_COLS.bat_gp]),ab:num(r[GC_COLS.bat_ab]),h:num(r[GC_COLS.bat_h]),
        b1:num(r[GC_COLS.bat_1b]),b2:num(r[GC_COLS.bat_2b]),b3:num(r[GC_COLS.bat_3b]),
        hr:num(r[GC_COLS.bat_hr]),rbi:num(r[GC_COLS.bat_rbi]),r:num(r[GC_COLS.bat_r]),
        bb:num(r[GC_COLS.bat_bb]),so:num(r[GC_COLS.bat_so]),sb:num(r[GC_COLS.bat_sb])
      },
      fielding:{
        // These are innings, written in baseball notation (X.1 = ⅓ inning,
        // X.2 = ⅔ inning) - converted to real decimals so sums/percentages
        // come out correct. "Total" is GameChanger's own figure, trusted
        // as-is for display.
        P:innings(r[GC_COLS.fld_P]),C:innings(r[GC_COLS.fld_C]),"1B":innings(r[GC_COLS.fld_1B]),
        "2B":innings(r[GC_COLS.fld_2B]),"3B":innings(r[GC_COLS.fld_3B]),SS:innings(r[GC_COLS.fld_SS]),
        LF:innings(r[GC_COLS.fld_LF]),CF:innings(r[GC_COLS.fld_CF]),RF:innings(r[GC_COLS.fld_RF]),
        SF:innings(r[GC_COLS.fld_SF]),Total:innings(r[GC_COLS.fld_Total])
      }
    });
  }
  return out;
}
function bestNameMatch(gcName,athletes){
  const norm=(s)=>(s||"").toLowerCase().replace(/[^a-z]/g,"");
  const target=norm(gcName);
  let exact=athletes.find(a=>norm(a.name)===target);
  if(exact)return exact.id;
  const gcLast=norm(gcName.split(" ").slice(-1)[0]);
  const lastMatches=athletes.filter(a=>norm(a.name.split(" ").slice(-1)[0])===gcLast&&gcLast);
  if(lastMatches.length===1)return lastMatches[0].id;
  return "";
}

function gamePlayers(game,athletes){
  const guests=(game.guests||[]).map(g=>({...g,isGuest:true}));
  return[...athletes,...guests];
}
function playerLabel(id,game,athletes){
  const p=gamePlayers(game,athletes).find(x=>x.id===id);
  if(!p)return"Unknown";
  return p.isGuest?`${p.name} (Guest)`:p.name;
}

function getChartForInning(game,inning){
  const fc=game.field_chart||{};
  if(fc[inning])return fc[inning];
  if(inning>1)return getChartForInning(game,inning-1);
  const chart={};
  (game.lineup||[]).forEach(l=>{if(l.position)chart[l.position]=l.athleteId;});
  return chart;
}
const FIELD_POS_WITH_SF=[...FIELD_POS,"SF"];
function primaryPosFromFielding(fielding){
  const entries=FIELD_POS_WITH_SF.map(pos=>[pos,fielding[pos]||0]).filter(([,n])=>n>0);
  return entries.length?entries.sort((a,b)=>b[1]-a[1])[0][0]:null;
}
function gamePrimaryPosition(game,athleteId){
  const imported=game.imported_fielding&&game.imported_fielding[athleteId];
  if(imported&&imported.Total>0){
    const entries=FIELD_POS_WITH_SF.map(pos=>[pos,imported[pos]||0]).filter(([,n])=>n>0);
    return entries.length?entries.sort((a,b)=>b[1]-a[1])[0][0]:null;
  }
  const innings=game.innings||6;
  const counts={};
  for(let i=1;i<=innings;i++){
    const chart=getChartForInning(game,i);
    const pos=Object.keys(chart).find(p=>chart[p]===athleteId);
    if(pos)counts[pos]=(counts[pos]||0)+1;
  }
  const e=Object.entries(counts);
  return e.length?e.sort((a,b)=>b[1]-a[1])[0][0]:null;
}
function computeAthleteGameStats(athleteId,games){
  const orderCounts={},posCounts={};const appearances=[];let totalInnings=0;let availableInnings=0;
  games.forEach(g=>{
    const idx=(g.lineup||[]).findIndex(l=>l.athleteId===athleteId);
    const inLineup=idx!==-1;
    if(inLineup)orderCounts[idx+1]=(orderCounts[idx+1]||0)+1;
    let played=false;
    const imported=g.imported_fielding&&g.imported_fielding[athleteId];
    if(imported&&imported.Total>0){
      // Imported scorebook data takes precedence over live tracking for
      // this game/athlete, so we don't double-count both sources.
      FIELD_POS_WITH_SF.forEach(pos=>{
        const n=imported[pos]||0;
        if(n>0){posCounts[pos]=(posCounts[pos]||0)+n;totalInnings+=n;played=true;}
      });
    }else{
      const innings=g.innings||6;
      for(let i=1;i<=innings;i++){
        const chart=getChartForInning(g,i);
        const pos=Object.keys(chart).find(p=>chart[p]===athleteId);
        if(pos){posCounts[pos]=(posCounts[pos]||0)+1;totalInnings++;played=true;}
      }
    }
    if(inLineup||played){
      appearances.push({game:g,slot:inLineup?idx+1:null,position:gamePrimaryPosition(g,athleteId)});
      availableInnings+=g.innings||6;
    }
  });
  const benchInnings=Math.max(0,availableInnings-totalInnings);
  return{total:appearances.length,orderCounts,posCounts,totalInnings,availableInnings,benchInnings,appearances};
}
function computeBattingBySlot(athleteId,games){
  const bySlot={};
  let totalAb=0,totalH=0,gamesWithData=0;
  games.forEach(g=>{
    const bs=g.batting_stats&&g.batting_stats[athleteId];
    if(!bs)return;
    const idx=(g.lineup||[]).findIndex(l=>l.athleteId===athleteId);
    const slot=idx!==-1?idx+1:"Unknown";
    if(!bySlot[slot])bySlot[slot]={ab:0,h:0};
    bySlot[slot].ab+=bs.ab||0;
    bySlot[slot].h+=bs.h||0;
    totalAb+=bs.ab||0;totalH+=bs.h||0;
    gamesWithData++;
  });
  return{bySlot,totalAb,totalH,gamesWithData,avg:totalAb>0?(totalH/totalAb):null};
}
function buildGameText(game,team,weekend,athletes,staffById){
  const lines=[];
  lines.push(`${team?team.name:"Team"} vs ${game.opponent||"TBD"}`);
  const when=[game.game_date,fmtTime12(game.game_time),game.location?`@ ${game.location}`:""].filter(Boolean).join("  ");
  if(when)lines.push(when);
  if(weekend)lines.push(weekend.name);
  if(game.assigned_coach_id)lines.push(`Managing: ${staffById[game.assigned_coach_id]?.name||"Coach"}`);
  lines.push("");
  lines.push("BATTING LINEUP");
  if(!game.lineup||game.lineup.length===0){lines.push("(no lineup set yet)");}
  else{game.lineup.forEach((entry,i)=>{lines.push(`${i+1}. ${playerLabel(entry.athleteId,game,athletes)} — ${entry.position||"?"}`);});}
  if(game.pitching&&game.pitching.length>0){
    lines.push("");lines.push("PITCHING PLAN");
    game.pitching.forEach(p=>{
      const inn=(p.innings||[]).slice().sort((x,y)=>x-y).join(", ")||"—";
      let row=`Inn ${inn}: ${playerLabel(p.athleteId,game,athletes)}`;
      if(p.limit)row+=` (max ${p.limit} pitches)`;
      if(p.note)row+=` — ${p.note}`;
      lines.push(row);
    });
  }
  if(game.notes){lines.push("");lines.push(`NOTES: ${game.notes}`);}
  return lines.join("\n");
}

function ResetPasswordScreen({onDone}){
  const[pass,setPass]=useState("");
  const[pass2,setPass2]=useState("");
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");
  const[done,setDone]=useState(false);

  const submit=async()=>{
    if(!pass||pass.length<6){setErr("Password must be at least 6 characters.");return;}
    if(pass!==pass2){setErr("Passwords do not match.");return;}
    setLoading(true);setErr("");
    const r=await fetch(`${SURL}/auth/v1/user`,{
      method:"PUT",
      headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`},
      body:JSON.stringify({password:pass})
    });
    const d=await r.json();
    setLoading(false);
    if(!r.ok){setErr("Error: "+(d.message||JSON.stringify(d)));return;}
    setDone(true);
    setTimeout(()=>onDone(),2500);
  };

  if(done)return(
    <div className="auth-wrap"><div className="auth-card" style={{textAlign:"center"}}>
      <div style={{fontSize:44,marginBottom:10}}>✅</div>
      <div style={{fontSize:18,fontWeight:800,marginBottom:8,color:"#27c97a"}}>Password Updated!</div>
      <div style={{fontSize:12,color:"#6b82a0"}}>Taking you to sign in...</div>
    </div></div>
  );

  return(
    <div className="auth-wrap"><div className="auth-card">
      <div className="alogo">
        <div style={{fontSize:34,marginBottom:5}}>🔑</div>
        <div className="at">New <em>Password</em></div>
        <div className="asub">Choose a new password for your account</div>
      </div>
      {err&&<div className="err2">{err}</div>}
      <div className="fg"><label>New Password</label><input className="inp" type="password" placeholder="At least 6 characters" value={pass} onChange={e=>setPass(e.target.value)}/></div>
      <div className="fg"><label>Confirm Password</label><input className="inp" type="password" placeholder="Same password again" value={pass2} onChange={e=>setPass2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
      <button className="bmain" onClick={submit} disabled={loading||!pass||!pass2}>{loading?"Saving...":"Set New Password"}</button>
    </div></div>
  );
}

function AuthScreen({onAuth}){
  const[isUp,setIsUp]=useState(false);
  const[forgotPw,setForgotPw]=useState(false);
  const[resetSent,setResetSent]=useState(false);
  const[role,setRole]=useState("coach");
  const[name,setName]=useState("");
  const[email,setEmail]=useState("");
  const[pass,setPass]=useState("");
  const[pos,setPos]=useState("Pitcher");
  const[grad,setGrad]=useState(2027);
  const[ageGroup,setAgeGroup]=useState("");
  const[useAgeGroup,setUseAgeGroup]=useState(false);
  const[otherPos,setOtherPos]=useState("");
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");
  const[logs,setLogs]=useState([]);
  const[checkEmail,setCheckEmail]=useState(false);
  const log=(m)=>setLogs(p=>[...p,m]);

  const sendReset=async()=>{
    if(!email){setErr("Enter your email first.");return;}
    setLoading(true);setErr("");
    const r=await fetch(`${SURL}/auth/v1/recover`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY},body:JSON.stringify({email})});
    setLoading(false);
    if(r.ok){setResetSent(true);}
    else{const d=await r.json().catch(()=>({}));setErr("Error: "+(d.message||JSON.stringify(d)));}
  };

  const submit=async()=>{
    setErr("");setLoading(true);setLogs([]);
    try{
      if(isUp){
        const nameParts=(name||"").trim().split(" ").filter(Boolean);
        if(role!=="coach"&&nameParts.length<2){setErr("Please enter your first and last name.");setLoading(false);return;}
        if(!email||!pass){setErr("Email and password are required.");setLoading(false);return;}
        log("Creating account...");
        const{data,error:e}=await sb.auth.signUp(email,pass);
        log("Auth: "+JSON.stringify({id:data?.user?.id,sess:!!data?.session,err:e?.message}));
        if(e)throw new Error("Signup failed: "+(e.message||e.error_description||JSON.stringify(e)));
        if(!data?.user)throw new Error("No user returned — check URL/key");
        log("Saving profile...");
        const pd={id:data.user.id,email,name:(name||email.split("@")[0]).trim(),role,position:role==="athlete"?pos:null,other_positions:role==="athlete"&&otherPos?otherPos:null,grad:role==="athlete"&&!useAgeGroup?parseInt(grad):null,age_group:role==="athlete"&&useAgeGroup?ageGroup:null,avatar:ini((name||email).trim()),measurables:{}};
        const{error:pe}=await sb.from("profiles").insert(pd);
        log("Profile: "+(pe?JSON.stringify(pe):"ok"));
        if(pe){
          const msg=pe.message||pe.hint||pe.code||JSON.stringify(pe);
          if(msg.includes("relation")||msg.includes("does not exist")||pe.code==="42P01")throw new Error("❌ Run diamondtrack_schema.sql in Supabase SQL Editor first");
          if(pe.code==="23505")throw new Error("Email already registered — try Sign In");
          throw new Error("Profile error: "+msg);
        }
        if(!data.session)setCheckEmail(true);
        else onAuth(pd);
      }else{
        log("Signing in...");
        const{data,error:e}=await sb.auth.signIn(email,pass);
        log("Auth: "+JSON.stringify({id:data?.user?.id,err:e?.message}));
        if(e)throw new Error("Sign in failed: "+(e.message||e.error_description||JSON.stringify(e)));
        log("Loading profile...");
        const{data:prof,error:pe}=await sb.from("profiles").select("*").eq("id",data.user.id).maybeSingle();
        log("Profile: "+(prof?"found":"not found — "+JSON.stringify(pe)));
        if(!prof)throw new Error("Profile not found — run SQL schema in Supabase first");
        onAuth(prof);
      }
    }catch(e){setErr(e.message);}
    setLoading(false);
  };

  if(resetSent)return(
    <div className="auth-wrap"><div className="auth-card" style={{textAlign:"center"}}>
      <div style={{fontSize:44,marginBottom:10}}>📧</div>
      <div style={{fontSize:18,fontWeight:800,marginBottom:8}}>Check your email</div>
      <div style={{fontSize:12,color:"#6b82a0",lineHeight:1.7}}>We sent a password reset link to<br/><strong style={{color:"#eef2f8"}}>{email}</strong><br/>Click it to set a new password.</div>
      <button className="bmain" style={{marginTop:14}} onClick={()=>{setResetSent(false);setForgotPw(false);}}>Back to Sign In</button>
    </div></div>
  );

  if(forgotPw)return(
    <div className="auth-wrap"><div className="auth-card">
      <div className="alogo">
        <div style={{fontSize:34,marginBottom:5}}>🔑</div>
        <div className="at">Reset <em>Password</em></div>
        <div className="asub">Enter your email and we will send a reset link</div>
      </div>
      {err&&<div className="err2">{err}</div>}
      <div className="fg"><label>Email</label><input className="inp" type="email" placeholder="you@email.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendReset()}/></div>
      <button className="bmain" onClick={sendReset} disabled={loading||!email}>{loading?"Sending...":"Send Reset Link"}</button>
      <div className="tl" style={{marginTop:12}}><button onClick={()=>{setForgotPw(false);setErr("");}}>← Back to Sign In</button></div>
    </div></div>
  );

  if(checkEmail)return(
    <div className="auth-wrap"><div className="auth-card" style={{textAlign:"center"}}>
      <div style={{fontSize:44,marginBottom:10}}>📧</div>
      <div style={{fontSize:18,fontWeight:800,marginBottom:8}}>Check your email</div>
      <div style={{fontSize:12,color:"#6b82a0",lineHeight:1.6}}>Confirmation sent to <strong style={{color:"#eef2f8"}}>{email}</strong>.<br/>Click it then come back to Sign In.</div>
      <button className="bmain" style={{marginTop:14}} onClick={()=>{setCheckEmail(false);setIsUp(false);}}>Back to Sign In</button>
    </div></div>
  );

  return(
    <div className="auth-wrap"><div className="auth-card">
      <div className="alogo">
        <img src={BRANDING.logos.icon} alt="" style={{height:56,width:"auto",marginBottom:8}}/>
        <div className="at">RA<em>Track</em></div>
        <div className="asub">{isUp?"Create account":"Sign in"} · {BRANDING.tagline}</div>
      </div>
      {isUp&&<>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:".4px",color:"#6b82a0",marginBottom:6}}>I am a...</div>
          <div className="rp">
            {[["coach","🎓","Coach"],["athlete","⚾","Athlete"],["admin","🛡️","Admin"]].map(([r,ic,lb])=>(
              <div key={r} className={`rb ${role===r?"on":""}`} onClick={()=>setRole(r)}>
                <div className="ri2">{ic}</div><div className="rl">{lb}</div>
              </div>
            ))}
          </div>
        </div>
        <div className="fg2">
          <div className="fg"><label>First Name *</label><input className="inp" placeholder="First" value={name.split(" ")[0]||""} onChange={e=>setName(e.target.value.trim()+" "+(name.split(" ").slice(1).join(" ")))}/></div>
          <div className="fg"><label>Last Name *</label><input className="inp" placeholder="Last" value={name.split(" ").slice(1).join(" ")} onChange={e=>setName((name.split(" ")[0]||"")+" "+e.target.value)}/></div>
        </div>
        {role==="athlete"&&<>
          <div className="fg2">
            <div className="fg"><label>Primary Position</label><select className="inp" value={pos} onChange={e=>setPos(e.target.value)}>{ALL_POS.map(p=><option key={p}>{p}</option>)}</select></div>
            <div className="fg"><label>Other Positions</label><input className="inp" placeholder="e.g. 1B, OF" value={otherPos} onChange={e=>setOtherPos(e.target.value)}/></div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
            <button onClick={()=>setUseAgeGroup(false)} style={{flex:1,padding:"7px",borderRadius:7,border:`1px solid ${!useAgeGroup?"#e8a020":"rgba(255,255,255,.12)"}`,background:!useAgeGroup?"rgba(232,160,32,.08)":"transparent",color:!useAgeGroup?"#e8a020":"#8fa3be",fontSize:11,fontWeight:700,cursor:"pointer"}}>Grad Year</button>
            <button onClick={()=>setUseAgeGroup(true)} style={{flex:1,padding:"7px",borderRadius:7,border:`1px solid ${useAgeGroup?"#e8a020":"rgba(255,255,255,.12)"}`,background:useAgeGroup?"rgba(232,160,32,.08)":"transparent",color:useAgeGroup?"#e8a020":"#8fa3be",fontSize:11,fontWeight:700,cursor:"pointer"}}>Age Group</button>
          </div>
          {!useAgeGroup?<div className="fg"><label>Grad Year</label><select className="inp" value={grad} onChange={e=>setGrad(e.target.value)}>{GRAD_YEARS.map(y=><option key={y}>{y}</option>)}</select></div>:<div className="fg"><label>Age Group</label><select className="inp" value={ageGroup} onChange={e=>setAgeGroup(e.target.value)}><option value="">Select...</option>{AGE_GROUPS.map(g=><option key={g}>{g}</option>)}</select></div>}
        </>}
      </>}
      {err&&<div className="err2">{err}</div>}
      <div className="fg"><label>Email</label><input className="inp" type="email" placeholder="you@email.com" value={email} onChange={e=>setEmail(e.target.value)}/></div>
      <div className="fg"><label>Password</label><input className="inp" type="password" placeholder="••••••••" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
      <button className="bmain" onClick={submit} disabled={loading}>{loading?"Loading...":isUp?"Create Account":"Sign In"}</button>
      <div className="tl">{isUp?"Already have an account?":"Need an account?"} <button onClick={()=>{setIsUp(!isUp);setErr("");setLogs([]);}}>{isUp?"Sign In":"Sign Up"}</button></div>
      {!isUp&&<div className="tl" style={{marginTop:6}}><button onClick={()=>{setForgotPw(true);setErr("");setLogs([]);}}>Forgot password?</button></div>}
    </div></div>
  );
}
function App(){
  const[profile,setProfile]=useState(null);
  const[loading,setLoading]=useState(true);
  const[resetMode,setResetMode]=useState(false);

  // Check if this is a password reset redirect from Supabase email
  useEffect(()=>{
    const hash=window.location.hash;
    const params=new URLSearchParams(hash.replace("#","?").replace("#","&"));
    const type=params.get("type");
    const accessToken=params.get("access_token");
    if((type==="recovery"||type==="signup")&&accessToken){
      _tok=accessToken;
      try{localStorage.setItem("dt",JSON.stringify({access_token:accessToken,expires_at:Date.now()/1000+3600}));}catch(e){}
      // Both a password-reset link and a first-time signup-confirmation link land here.
      // Either way, the athlete needs to choose a real password they actually know.
      setResetMode(true);setLoading(false);
      window.history.replaceState(null,"",window.location.pathname);
    }
  },[]);
  const[athletes,setAthletes]=useState([]);
  const[coaches,setCoaches]=useState([]);
  const[programs,setPrograms]=useState([]);
  const[weekends,setWeekends]=useState([]);
  const[checkins,setCheckins]=useState([]);
  const[teams,setTeams]=useState([]);
  const[games,setGames]=useState([]);
  const[logs,setLogs]=useState({});
  const[sessions,setSessions]=useState({});
  const[measHist,setMeasHist]=useState({});
  const[selfLogs,setSelfLogs]=useState([]);
  const[notifs,setNotifs]=useState([]);
  const[coachPage,setCoachPage]=useState("dashboard");
  const[viewAth,setViewAth]=useState(null);
  const[viewProg,setViewProg]=useState(null);
  const[modal,setModal]=useState(null);
  const[workoutView,setWorkoutView]=useState(null);
  const[showNotif,setShowNotif]=useState(false);
  const[gradF,setGradF]=useState(null);
  const[groupF,setGroupF]=useState(null);
  const hasCoachAccess=profile?.role==="coach"||profile?.role==="admin"||profile?.secondary_role==="coach";
  const hasAthleteAccess=profile?.role==="athlete"||profile?.secondary_role==="athlete";
  const isAdmin=profile?.role==="admin";
  const isDualRole=hasCoachAccess&&hasAthleteAccess;
  const[viewMode,setViewMode]=useState(null);
  const effectiveView=viewMode||(profile?.role==="athlete"?"athlete":"coach");
  const isCoach=effectiveView==="coach"&&hasCoachAccess;
  const isAthlete=effectiveView==="athlete"&&hasAthleteAccess;

  useEffect(()=>{
    const s=sb.auth.stored();
    if(s?.user){
      // Check if token is about to expire (within 5 min) and refresh proactively
      if(s.expires_at&&(s.expires_at-Date.now()/1000)<300){
        sb.auth.refreshToken();
      }
      sb.from("profiles").select("*").eq("id",s.user.id).maybeSingle().then(({data})=>{
        if(data)setProfile(data);
        setLoading(false);
      });
    }else setLoading(false);
  },[]);

  useEffect(()=>{
    if(!profile)return;
    loadAll();
  },[profile?.id]);

  const loadAll=async()=>{
    // Shared fetch helper - used by both coach and athlete blocks
    const fetchData=async(url)=>{const r=await fetchWithRefresh(SURL+"/rest/v1/"+url,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Range-Unit":"items","Range":"0-9999"}});return r.ok?r.json().catch(()=>[]):[]};
    const fetchJSON=fetchData;

    if(hasCoachAccess){
      // Coaches only see their assigned athletes; admin (and dual-role people) see all.
      // Matching on role OR secondary_role so dual-role profiles show up everywhere
      // they need to (e.g. an athlete who also coaches still appears in rosters).
      const athUrl=profile.role==="coach"
        ?`profiles?or=(role.eq.athlete,secondary_role.eq.athlete)&coach_ids=cs.{${profile.id}}&select=*&limit=5000`
        :"profiles?or=(role.eq.athlete,secondary_role.eq.athlete)&select=*&limit=5000";
      const progUrl=profile.role==="coach"
        ?`programs?created_by=eq.${profile.id}&select=*&limit=5000`
        :"programs?select=*&limit=5000";
      const[athData,progData,notifData,coachData,wkData,teamData,gameData,checkinData,slAll,logAll,sessAll,mhAll]=await Promise.all([
        fetchJSON(athUrl),
        fetchJSON(progUrl),
        fetchJSON(`notifications?recipient_id=eq.${profile.id}&order=created_at.desc&limit=100`),
        fetchJSON("profiles?or=(role.eq.coach,secondary_role.eq.coach)&select=*&limit=500"),
        fetchData("weekends?select=*&order=start_date.desc&limit=500"),
        fetchData("teams?select=*&limit=2000"),
        fetchData("games?select=*&limit=5000"),
        fetchData("checkins?select=*&order=check_date.desc&limit=10000"),
        fetchData("self_logs?order=created_at.desc&limit=10000"),
        fetchJSON("workout_logs?select=*&limit=10000"),
        fetchJSON("workout_sessions?select=*&limit=10000"),
        fetchJSON("measurable_history?order=recorded_at.asc&limit=10000"),
      ]);
      if(Array.isArray(athData))setAthletes(athData);
      if(Array.isArray(progData))setPrograms(progData.map(p=>({...p,days:p.days||[],targetGrads:p.target_grads||[],targetGroups:p.target_groups||[],targetAgeGroups:p.target_age_groups||[],athleteId:p.athlete_id,isGroup:p.is_group_program===true||p.is_group_program==="true"})));
      if(Array.isArray(notifData))setNotifs(notifData);
      if(Array.isArray(coachData))setCoaches(coachData);
      if(Array.isArray(wkData))setWeekends(wkData);
      if(Array.isArray(teamData))setTeams(teamData.map(t=>({...t,athlete_ids:t.athlete_ids||[]})));
      if(Array.isArray(gameData))setGames(gameData.map(g=>({...g,lineup:g.lineup||[],field_chart:g.field_chart||{},pitching:g.pitching||[]})));
      if(Array.isArray(checkinData))setCheckins(checkinData);
      if(Array.isArray(slAll))setSelfLogs(slAll);
      const lm={};if(Array.isArray(logAll))logAll.forEach(l=>{lm[`${l.program_id}-${l.athlete_id}-${l.exercise_id}`]=l;});setLogs(lm);
      const sm={};if(Array.isArray(sessAll))sessAll.forEach(s=>{sm[`${s.program_id}-${s.athlete_id}`]=s;});setSessions(sm);
      const mm={};if(Array.isArray(mhAll))mhAll.forEach(m=>{if(!mm[m.athlete_id])mm[m.athlete_id]=[];mm[m.athlete_id].push(m);});setMeasHist(mm);
    }

    if(hasAthleteAccess&&!hasCoachAccess){
      // Pure athlete: only need their own scoped data. (A dual-role person
      // already got the full superset above - logs/sessions/measHist use the
      // same lookup keys either way, and AthPortal filters self_logs down to
      // its own athlete_id at render time, so nothing's missing for them.)
      const[logData,sessData,slData,mhData,athProgData,ckData]=await Promise.all([
        fetchData(`workout_logs?athlete_id=eq.${profile.id}&select=*&limit=5000`),
        fetchData(`workout_sessions?athlete_id=eq.${profile.id}&select=*&limit=5000`),
        fetchData(`self_logs?athlete_id=eq.${profile.id}&order=created_at.desc&limit=5000`),
        fetchData(`measurable_history?athlete_id=eq.${profile.id}&order=recorded_at.asc&limit=5000`),
        fetchData(`programs?select=*&limit=1000`),
        fetchData(`checkins?athlete_id=eq.${profile.id}&select=*&order=check_date.desc&limit=200`),
      ]);
      if(Array.isArray(athProgData))setPrograms(athProgData.map(p=>({...p,days:p.days||[],targetGrads:p.target_grads||[],targetGroups:p.target_groups||[],targetAgeGroups:p.target_age_groups||[],athleteId:p.athlete_id,isGroup:p.is_group_program})));
      const lm={};if(Array.isArray(logData))logData.forEach(l=>{lm[`${l.program_id}-${l.athlete_id}-${l.exercise_id}`]=l;});setLogs(lm);
      const sm={};if(Array.isArray(sessData))sessData.forEach(s=>{sm[`${s.program_id}-${s.athlete_id}`]=s;});setSessions(sm);
      if(Array.isArray(slData))setSelfLogs(slData.map(l=>({...l,metrics:l.metrics||{},exercises:l.exercises||[]})));
      if(Array.isArray(mhData))setMeasHist({[profile.id]:mhData});
      if(Array.isArray(ckData))setCheckins(ckData);
    }
  };

  const getLog=(pId,exId)=>logs[`${pId}-${profile?.id}-${exId}`]||{};
  const isSaved=(pId,exId,aid)=>!!(logs[`${pId}-${aid||profile?.id}-${exId}`]?.saved);
  const calcPct=(prog,aid)=>{if(!prog)return 0;const all=(prog.days||[]).flatMap(d=>d.exercises||[]);if(!all.length)return 0;return Math.round(all.filter(ex=>isSaved(prog.id,ex.id,aid||profile?.id)).length/all.length*100);};
  const getSess=(pId,aid)=>sessions[`${pId}-${aid||profile?.id}`]||{};

  const saveEx=async(pId,exId,field,val,markSaved=false)=>{
    // Don't re-save if already saved
    if(markSaved&&logs[`${pId}-${profile.id}-${exId}`]?.saved)return;
    const now=new Date().toISOString();
    const data={program_id:pId,athlete_id:profile.id,exercise_id:exId,[field]:val};
    if(markSaved){data.saved=true;data.saved_at=now;}
    const sk=`${pId}-${profile.id}`;
    // Start session if not started
    if(!sessions[sk]?.started_at){
      await fetchWithRefresh(`${SURL}/rest/v1/workout_sessions`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({program_id:pId,athlete_id:profile.id,started_at:now})});
      setSessions(p=>({...p,[sk]:{...p[sk],started_at:now,program_id:pId,athlete_id:profile.id}}));
    }
    // Save exercise log
    await fetchWithRefresh(`${SURL}/rest/v1/workout_logs`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"resolution=merge-duplicates"},body:JSON.stringify(data)});
    setLogs(p=>({...p,[`${pId}-${profile.id}-${exId}`]:{...(p[`${pId}-${profile.id}-${exId}`]||{}),...data}}));
  };

  const markComplete=async(pId)=>{
    const sk=`${pId}-${profile.id}`;const sess=sessions[sk]||{};
    if(sess.completed_at)return;
    const now=new Date().toISOString();
    const dur=sess.started_at?Math.round((Date.now()-new Date(sess.started_at))/60000):null;
    // Save session completion using raw fetch for reliability
    const scr=await fetchWithRefresh(`${SURL}/rest/v1/workout_sessions`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"resolution=merge-duplicates"},body:JSON.stringify({program_id:pId,athlete_id:profile.id,completed_at:now,duration_minutes:dur})});
    if(!scr.ok){const t=await scr.text();console.error("Session complete error:",t);}
    setSessions(p=>({...p,[sk]:{...p[sk],completed_at:now,duration_minutes:dur}}));
    // Reload sessions from DB to confirm persisted
    const sr=await fetch(`${SURL}/rest/v1/workout_sessions?athlete_id=eq.${profile.id}&select=*`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    if(sr.ok){const sdata=await sr.json().catch(()=>[]);if(Array.isArray(sdata)){const sm={};sdata.forEach(s=>{sm[`${s.program_id}-${s.athlete_id}`]=s;});setSessions(sm);}}
    // Log to journal
    const prog=programs.find(p=>p.id===pId);
    const allEx=(prog?.days||[]).flatMap(d=>d.exercises||[]);
    const doneEx=allEx.filter(ex=>isSaved(pId,ex.id));
    const journalEntry={
      type:"Workout",
      metrics:{
        program:prog?.name||"",
        exercises:String(doneEx.length),
        duration:dur?String(dur):"",
        week:prog?.week||""
      },
      notes:`Completed: ${prog?.name||"workout"}${dur?" in "+Math.floor(dur/60)+"h "+dur%60+"m":""}.
${doneEx.map(e=>e.name).join(", ")}`,
      date_label:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})
    };
    const jr=await fetch(`${SURL}/rest/v1/self_logs`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify([{athlete_id:profile.id,...journalEntry}])});
    if(jr.ok){
      const newEntry=await jr.json().catch(()=>null);
      if(newEntry&&newEntry[0]){
        setSelfLogs(p=>[{...newEntry[0],metrics:newEntry[0].metrics||{},exercises:[]}, ...p]);
      }
    }
    // Notify all coaches
    const{data:coaches}=await sb.from("profiles").select("id").eq("role","coach");
    if(coaches?.length){
      const notifRows=coaches.map(co=>({
        recipient_id:co.id,
        type:"completed",
        athlete_id:profile.id,
        athlete_name:profile.name||profile.email,
        program_name:prog?.name||"",
        duration_minutes:dur,
        read:false
      }));
      const{error:ne}=await sb.from("notifications").insert(notifRows);
      if(ne)console.error("Notification error:",ne);
    }
  };

  // --- Facility check-in ---
  const toggleCheckin=async(athleteId)=>{
    const today=todayStr();
    const existing=checkins.find(c=>c.athlete_id===athleteId&&c.check_date===today);
    if(existing){
      setCheckins(p=>p.filter(c=>c.id!==existing.id));
      const r=await fetchWithRefresh(`${SURL}/rest/v1/checkins?id=eq.${existing.id}`,{method:"DELETE",headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
      if(!r.ok){setCheckins(p=>[...p,existing]);alert("Couldn't undo check-in: "+await r.text());}
    }else{
      const{data,error}=await sb.from("checkins").insert({athlete_id:athleteId,check_date:today,checked_in_by:profile.id});
      if(error){alert("Check-in failed: "+(error.message||JSON.stringify(error)));return;}
      if(data)setCheckins(p=>[...p,data]);
    }
  };

  const bulkCompletePrograms=async(programIds,athleteIds)=>{
    const now=new Date().toISOString();
    const todayLabel=new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
    const progs=programIds.map(id=>programs.find(p=>p.id===id)).filter(Boolean);
    if(progs.length===0||athleteIds.length===0)return;

    for(const prog of progs){
      const allEx=(prog.days||[]).flatMap(d=>d.exercises||[]);
      if(allEx.length===0)continue;
      const logRows=[];
      athleteIds.forEach(aid=>{allEx.forEach(ex=>{logRows.push({program_id:prog.id,athlete_id:aid,exercise_id:ex.id,saved:true,saved_at:now});});});
      const sessionRows=athleteIds.map(aid=>({program_id:prog.id,athlete_id:aid,started_at:now,completed_at:now}));
      const lr=await fetchWithRefresh(`${SURL}/rest/v1/workout_logs`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"resolution=merge-duplicates"},body:JSON.stringify(logRows)});
      if(!lr.ok)console.error("bulk log error:",await lr.text());
      const sr=await fetchWithRefresh(`${SURL}/rest/v1/workout_sessions`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"resolution=merge-duplicates"},body:JSON.stringify(sessionRows)});
      if(!sr.ok)console.error("bulk session error:",await sr.text());
    }

    const progNames=progs.map(p=>p.name).join(", ");
    const journalRows=athleteIds.map(aid=>({
      athlete_id:aid,
      type:"Workout",
      metrics:{program:progNames,source:"Facility Check-In"},
      notes:`Completed at facility check-in (marked by ${profile.name||"a coach"}): ${progNames}`,
      date_label:todayLabel
    }));
    const jr=await fetchWithRefresh(`${SURL}/rest/v1/self_logs`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify(journalRows)});
    if(!jr.ok)console.error("bulk journal error:",await jr.text());

    const{data:allCoaches}=await sb.from("profiles").select("id").eq("role","coach");
    if(allCoaches?.length){
      const notifRows=allCoaches.map(co=>({
        recipient_id:co.id,
        type:"completed",
        athlete_id:athleteIds[0],
        athlete_name:`${athleteIds.length} checked-in athlete${athleteIds.length===1?"":"s"}`,
        program_name:progNames,
        read:false
      }));
      await sb.from("notifications").insert(notifRows);
    }

    await loadAll();
  };
  const saveWeekend=async(wk)=>{
    const{data,error}=await sb.from("weekends").insert({name:wk.name,start_date:wk.startDate||null,end_date:wk.endDate||null,created_by:profile.id});
    if(error){alert("Error creating weekend: "+(error.message||JSON.stringify(error)));return null;}
    setWeekends(p=>[data,...p]);
    return data;
  };
  const deleteWeekend=async(id)=>{
    if(!window.confirm("Delete this weekend? Its teams and games will be deleted too."))return;
    const r=await fetchWithRefresh(`${SURL}/rest/v1/weekends?id=eq.${id}`,{method:"DELETE",headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    if(!r.ok){alert("Delete failed: "+await r.text());return;}
    const goneTeamIds=teams.filter(t=>t.weekend_id===id).map(t=>t.id);
    setWeekends(p=>p.filter(w=>w.id!==id));
    setTeams(p=>p.filter(t=>t.weekend_id!==id));
    setGames(p=>p.filter(g=>!goneTeamIds.includes(g.team_id)));
  };
  const saveTeam=async(weekendId,name)=>{
    const{data,error}=await sb.from("teams").insert({weekend_id:weekendId,name,athlete_ids:[]});
    if(error){alert("Error creating team: "+(error.message||JSON.stringify(error)));return null;}
    const fresh={...data,athlete_ids:data.athlete_ids||[]};
    setTeams(p=>[...p,fresh]);
    return fresh;
  };
  const deleteTeam=async(id)=>{
    if(!window.confirm("Delete this team? Its games will be deleted too."))return;
    const r=await fetchWithRefresh(`${SURL}/rest/v1/teams?id=eq.${id}`,{method:"DELETE",headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    if(!r.ok){alert("Delete failed: "+await r.text());return;}
    setTeams(p=>p.filter(t=>t.id!==id));
    setGames(p=>p.filter(g=>g.team_id!==id));
  };
  const updateTeamRoster=async(teamId,athleteIds)=>{
    setTeams(p=>p.map(t=>t.id===teamId?{...t,athlete_ids:athleteIds}:t));
    const r=await fetchWithRefresh(`${SURL}/rest/v1/teams?id=eq.${teamId}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`},body:JSON.stringify({athlete_ids:athleteIds})});
    if(!r.ok){alert("Couldn't save roster: "+await r.text());}
  };
  const renameTeam=async(teamId,name)=>{
    const trimmed=name.trim();
    if(!trimmed)return;
    setTeams(p=>p.map(t=>t.id===teamId?{...t,name:trimmed}:t));
    const r=await fetchWithRefresh(`${SURL}/rest/v1/teams?id=eq.${teamId}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`},body:JSON.stringify({name:trimmed})});
    if(!r.ok){alert("Couldn't rename team: "+await r.text());}
  };
  const importTeamStats=async(teamId,matchedRows)=>{
    const team=teams.find(t=>t.id===teamId);
    const newBatting={...(team?.season_batting||{})};
    const newFielding={...(team?.season_fielding||{})};
    matchedRows.forEach(r=>{
      newBatting[r.athleteId]=r.batting;
      newFielding[r.athleteId]=r.fielding;
    });
    setTeams(p=>p.map(t=>t.id===teamId?{...t,season_batting:newBatting,season_fielding:newFielding}:t));
    const r2=await fetchWithRefresh(`${SURL}/rest/v1/teams?id=eq.${teamId}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`},body:JSON.stringify({season_batting:newBatting,season_fielding:newFielding})});
    if(!r2.ok){alert("Couldn't save imported season stats: "+await r2.text());}
  };
  const clearTeamStats=async(teamId)=>{
    setTeams(p=>p.map(t=>t.id===teamId?{...t,season_batting:{},season_fielding:{}}:t));
    const r=await fetchWithRefresh(`${SURL}/rest/v1/teams?id=eq.${teamId}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`},body:JSON.stringify({season_batting:{},season_fielding:{}})});
    if(!r.ok){alert("Couldn't clear imported season stats: "+await r.text());}
  };
  const saveGame=async(teamId,fields)=>{
    const{data,error}=await sb.from("games").insert({team_id:teamId,opponent:fields.opponent||"",game_date:fields.date||null,game_time:fields.time||null,location:fields.location||"",notes:"",innings:6,lineup:[],field_chart:{},pitching:[],assigned_coach_id:null});
    if(error){alert("Error creating game: "+(error.message||JSON.stringify(error)));return null;}
    const fresh={...data,lineup:[],field_chart:{},pitching:[]};
    setGames(p=>[...p,fresh]);
    return fresh;
  };
  const deleteGame=async(id)=>{
    if(!window.confirm("Delete this game?"))return;
    const r=await fetchWithRefresh(`${SURL}/rest/v1/games?id=eq.${id}`,{method:"DELETE",headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    if(!r.ok){alert("Delete failed: "+await r.text());return;}
    setGames(p=>p.filter(g=>g.id!==id));
  };
  const patchGame=async(id,patch)=>{
    setGames(p=>p.map(g=>g.id===id?{...g,...patch}:g));
    const r=await fetchWithRefresh(`${SURL}/rest/v1/games?id=eq.${id}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`},body:JSON.stringify(patch)});
    if(!r.ok){alert("Couldn't save: "+await r.text());}
  };

  const assignCoachToAthlete=async(athId,coachId)=>{
    const athlete=athletes.find(a=>a.id===athId);
    const current=athlete?.coach_ids||[];
    if(current.includes(coachId))return;
    const updated=[...current,coachId];
    setAthletes(p=>p.map(a=>a.id===athId?{...a,coach_ids:updated}:a));
    const r=await fetchWithRefresh(`${SURL}/rest/v1/profiles?id=eq.${athId}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`},body:JSON.stringify({coach_ids:updated})});
    if(!r.ok){alert("Error: "+await r.text());}
  };
  const removeCoachFromAthlete=async(athId,coachId)=>{
    const athlete=athletes.find(a=>a.id===athId);
    const current=athlete?.coach_ids||[];
    const updated=coachId===null?[]:current.filter(c=>c!==coachId);
    setAthletes(p=>p.map(a=>a.id===athId?{...a,coach_ids:updated}:a));
    const r=await fetchWithRefresh(`${SURL}/rest/v1/profiles?id=eq.${athId}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`},body:JSON.stringify({coach_ids:updated})});
    if(!r.ok){alert("Error: "+await r.text());}
  };

  const deleteProgram=async(progId)=>{
    if(!window.confirm("Delete this workout? This cannot be undone."))return;
    const r=await fetchWithRefresh(`${SURL}/rest/v1/programs?id=eq.${progId}`,{method:"DELETE",headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    if(!r.ok){const t=await r.text();alert("Delete failed: "+t);return;}
    setPrograms(p=>p.filter(x=>x.id!==progId));
    setViewProg(null);
    setCoachPage("programs");
  };

  const copyProgram=async(prog,newAthId=null)=>{
    const newProg={name:prog.name+" (Copy)",week:prog.week||"Week 1",athlete_id:newAthId||prog.athleteId||null,is_group_program:prog.isGroup||false,target_grads:prog.targetGrads||[],target_groups:prog.targetGroups||[],target_age_groups:prog.targetAgeGroups||[],days:JSON.parse(JSON.stringify(prog.days||[])),created_by:profile.id};
    const r=await fetch(`${SURL}/rest/v1/programs`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify([newProg])});
    if(!r.ok){const t=await r.text();alert("Copy failed: "+t);return;}
    const{data:all}=await sb.from("programs").select("*");
    if(all)setPrograms(all.map(p=>({...p,days:p.days||[],targetGrads:p.target_grads||[],targetGroups:p.target_groups||[],targetAgeGroups:p.target_age_groups||[],athleteId:p.athlete_id,isGroup:p.is_group_program})));
    alert("✅ Program copied!");
  };

  const updateProgram=async(prog)=>{
    const r=await fetch(`${SURL}/rest/v1/programs?id=eq.${prog.id}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify({name:prog.name,week:prog.week,days:prog.days,target_grads:prog.targetGrads||[],target_groups:prog.targetGroups||[]})});
    const txt=await r.text();
    if(!r.ok){alert("Error saving: "+txt);return;}
    const{data:all}=await sb.from("programs").select("*");
    if(all){
      const mapped=all.map(p=>({...p,days:p.days||[],targetGrads:p.target_grads||[],targetGroups:p.target_groups||[],targetAgeGroups:p.target_age_groups||[],athleteId:p.athlete_id,isGroup:p.is_group_program}));
      setPrograms(mapped);
      const updated=mapped.find(p=>p.id===prog.id);
      if(updated)setViewProg(updated);
    }
  };

  const saveProgram=async(prog)=>{
    console.log("Saving program:",JSON.stringify({name:prog.name,targetGrads:prog.targetGrads,targetGroups:prog.targetGroups,isGroup:prog.isGroup}));
    const{data,error}=await sb.from("programs").insert({name:prog.name,week:prog.week,athlete_id:prog.athleteId||null,is_group_program:prog.isGroup||false,target_grads:prog.targetGrads||[],target_groups:prog.targetGroups||[],target_age_groups:prog.targetAgeGroups||[],days:prog.days,created_by:profile.id});
    if(error){alert("Error saving program: "+(error.message||error.hint||JSON.stringify(error)));return;}
    // Reload programs from DB to get the saved data with IDs
    const{data:all}=await sb.from("programs").select("*");
    if(all)setPrograms(all.map(p=>({...p,days:p.days||[],targetGrads:p.target_grads||[],targetGroups:p.target_groups||[],targetAgeGroups:p.target_age_groups||[],athleteId:p.athlete_id,isGroup:p.is_group_program})));
  };

  const saveAthlete=async(ath)=>{
    const row={email:ath.email||`athlete_${Date.now()}@diamondtrack.local`,name:ath.name,role:"athlete",position:ath.position,other_positions:ath.other_positions||null,grad:ath.grad||null,age_group:ath.age_group||null,gpa:ath.gpa||null,high_school:ath.high_school||null,dream_school:ath.dreamSchool||ath.dream_school||null,height:ath.height||null,weight:ath.weight||null,bats:ath.bats||null,throws:ath.throws||null,committed:ath.committed||false,avatar:ini(ath.name),measurables:ath.measurables||{},coach_ids:ath.coach_ids||[profile.id]};
    if(ath.id){
      console.log("Saving athlete profile:",ath.id,JSON.stringify(row));
      const r=await fetchWithRefresh(`${SURL}/rest/v1/profiles?id=eq.${ath.id}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify(row)});
      const rtext=await r.text();
      console.log("profile update response:",r.status,rtext);
      if(!r.ok){alert("Profile save failed ("+r.status+"):\n"+rtext);return null;}
      const r2=await fetch(`${SURL}/rest/v1/profiles?id=eq.${ath.id}&select=*`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Accept":"application/vnd.pgrst.object+json"}});
      const fresh=await r2.json().catch(()=>null);
      if(fresh&&fresh.id){setAthletes(p=>p.map(a=>a.id===fresh.id?fresh:a));}
      return fresh||{...ath,...row};
    }else{
      // Sign up athlete with a temporary password so they exist in auth.users
      const tempPw=BRANDING.productName+"_"+Math.random().toString(36).slice(2,10)+"!";
      const email=ath.email||`athlete_${Date.now()}@diamondtrack.local`;
      const r=await fetch(`${SURL}/auth/v1/signup`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY},body:JSON.stringify({email,password:tempPw})});
      const authData=await r.json();
      if(!r.ok){
        // If already exists, try to find their profile
        const{data:existing}=await sb.from("profiles").select("*").eq("email",email).maybeSingle();
        if(existing){setAthletes(p=>[...p,existing]);return;}
        alert("Could not create athlete account: "+(authData.message||authData.msg||JSON.stringify(authData)));
        return;
      }
      const uid=authData.user?.id||authData.id;
      if(!uid){alert("No user ID returned from Supabase");return;}
      const{data,error:pe}=await sb.from("profiles").insert({...row,email,id:uid});
      if(pe){const msg=pe.message||pe.hint||pe.code||JSON.stringify(pe);if(msg.includes("age_group")||msg.includes("column")){alert("Missing DB column - run in Supabase SQL Editor: ALTER TABLE profiles ADD COLUMN IF NOT EXISTS age_group text;");}else{alert("Save error: "+msg);}return;}
      if(data)setAthletes(p=>[...p,data]);
      // Also reload full list from server to catch any RLS-filtered results
      sb.from("profiles").select("*").eq("role","athlete").then(({data:all})=>{if(all&&all.length>0)setAthletes(all);});
      alert("\u2705 "+ath.name+" added!\n\nLogin: https://rabaseball.github.io/diamondtrack\nEmail: "+email+"\nTemp password: "+tempPw+"\n\nShare these credentials with the athlete.");
    }
  };

  const saveMeas=async(athId,entry)=>{
    const filtered=Object.fromEntries(Object.entries(entry).filter(([k,v])=>v!==null&&v!==""));
    if(!Object.keys(filtered).length){alert("Enter at least one value first.");return false;}
    const now=new Date().toISOString();
    const payload={athlete_id:athId,...filtered,recorded_by:profile.id,recorded_at:now,date_label:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})};
    console.log("saveMeas payload:",JSON.stringify(payload));
    const r=await fetchWithRefresh(`${SURL}/rest/v1/measurable_history`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify([payload])});
    const rtext=await r.text();
    console.log("saveMeas response:",r.status,rtext);
    if(!r.ok){alert("Measurable save failed ("+r.status+"):\n"+rtext);return false;}
    const merged={...(athletes.find(a=>a.id===athId)?.measurables||{}),...filtered};
    const r2=await fetchWithRefresh(`${SURL}/rest/v1/profiles?id=eq.${athId}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify({measurables:merged})});
    const r2text=await r2.text();
    console.log("profile measurables update:",r2.status,r2text);
    if(!r2.ok){alert("Profile measurables update failed ("+r2.status+"):\n"+r2text);return false;}
    setAthletes(p=>p.map(a=>a.id===athId?{...a,measurables:merged}:a));
    const r3=await fetch(`${SURL}/rest/v1/measurable_history?athlete_id=eq.${athId}&order=recorded_at.asc`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    const hist=await r3.json().catch(()=>[]);
    if(Array.isArray(hist))setMeasHist(p=>({...p,[athId]:hist}));
    return true;
  };

  const saveSelfLog=async(entry)=>{
    const{data,error}=await sb.from("self_logs").insert({athlete_id:profile.id,...entry});
    if(error){
      const msg=error.message||error.hint||JSON.stringify(error);
      if(msg.includes("relation")||msg.includes("does not exist")){
        alert("❌ The self_logs table is missing. Run diamondtrack_schema.sql in Supabase SQL Editor.");
      } else {
        alert("Error saving session: "+msg);
      }
      return false;
    }
    // Reload self logs from DB
    const{data:all}=await sb.from("self_logs").select("*").eq("athlete_id",profile.id).order("created_at",{ascending:false});
    if(all)setSelfLogs(all.map(l=>({...l,metrics:l.metrics||{},exercises:l.exercises||[]})));
    return true;
  };



  const logout=async()=>{await sb.auth.signOut();setProfile(null);};
  const unreadN=notifs.filter(n=>!n.read).length;

  const athProgs=useMemo(()=>{
    if(!hasAthleteAccess||!profile)return[];
    return programs.filter(p=>{
      if(p.athleteId===profile.id)return true;
      if(!p.isGroup)return false;
      const g=getPG(profile.position);
      const athleteGrad=parseInt(profile.grad);
      // targetGrads could be null, empty array, or array of numbers/strings
      const tg=p.targetGrads||p.target_grads||[];
      const tt=p.targetGroups||p.target_groups||[];
      const ta=p.targetAgeGroups||p.target_age_groups||[];
      const gradStr=String(profile.grad);
      const gradMatch=!tg.length||tg.some(yr=>String(yr)===gradStr);
      const ageMatch=!ta.length||ta.includes(profile.age_group);
      const groupMatch=!tt.length||tt.includes(g);
      console.log("Program match:",p.name,"tg:",JSON.stringify(tg),"grad:",gradStr,"gm:",gradMatch,"g:",g,"gpm:",groupMatch);
      return((tg.length||ta.length)?(gradMatch||ageMatch):true)&&groupMatch;
    }).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  },[programs,profile?.id,profile?.grad,profile?.position]);

  const filtAthletes=useMemo(()=>{
    let l=athletes;
    if(gradF){
      // gradF could be a number (grad year) or string (age group like "10U")
      const isNum=typeof gradF==="number"||!isNaN(Number(gradF));
      if(isNum)l=l.filter(a=>a.grad===Number(gradF));
      else l=l.filter(a=>a.age_group===gradF);
    }
    if(groupF)l=l.filter(a=>getPG(a.position)===groupF);
    return l;
  },[athletes,gradF,groupF]);

  if(loading)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"#6b82a0",fontSize:15,letterSpacing:1}}>Loading {BRANDING.productName}...</div>;
  if(resetMode)return<><style>{CSS}</style><ResetPasswordScreen onDone={()=>setResetMode(false)}/></>;
  if(!profile)return<><style>{CSS}</style><AuthScreen onAuth={setProfile}/></>;

  const coachBody=()=>{
    if(viewAth&&coachPage==="athletes")return<AthDetail athlete={viewAth} programs={programs} logs={logs} sessions={sessions} calcPct={calcPct} getSess={getSess} isSaved={isSaved} onBack={()=>setViewAth(null)} measHist={measHist[viewAth.id]||[]} selfLogs={selfLogs.filter(l=>l.athlete_id===viewAth.id)} onSaveMeas={e=>saveMeas(viewAth.id,e)} onSaveAth={async(ath)=>{const fresh=await saveAthlete(ath);if(fresh)setViewAth(fresh);}} games={games}/>;
    if(viewProg&&coachPage==="programs")return<ProgDetail prog={viewProg} athletes={athletes} logs={logs} sessions={sessions} calcPct={calcPct} isSaved={isSaved} getSess={getSess} onBack={()=>setViewProg(null)} onClickAth={a=>{setViewAth(a);setCoachPage("athletes");}} onUpdate={updateProgram} onCopy={copyProgram} onDelete={deleteProgram}/>;
    switch(coachPage){
      case"dashboard":return<Dashboard athletes={athletes} programs={programs} calcPct={calcPct} setCoachPage={setCoachPage} setViewAth={setViewAth} isAdmin={isAdmin}/>;
      case"games":return<GamesPage athletes={athletes} weekends={weekends} teams={teams} games={games} coaches={coaches} profile={profile} onSaveWeekend={saveWeekend} onDeleteWeekend={deleteWeekend} onSaveTeam={saveTeam} onDeleteTeam={deleteTeam} onRenameTeam={renameTeam} onUpdateRoster={updateTeamRoster} onSaveGame={saveGame} onDeleteGame={deleteGame} onPatchGame={patchGame} onImportTeamStats={importTeamStats} onClearTeamStats={clearTeamStats}/>;
      case"checkin":return<CheckInPage athletes={athletes} checkins={checkins} programs={programs} profile={profile} onToggleCheckin={toggleCheckin} onBulkComplete={bulkCompletePrograms}/>;
      case"athletes":return<AthRoster athletes={filtAthletes} allAthletes={athletes} programs={programs} calcPct={calcPct} gradF={gradF} setGradF={setGradF} groupF={groupF} setGroupF={setGroupF} onView={a=>setViewAth(a)} onAdd={()=>setModal("addAth")}/>;
      case"programs":return<ProgsPage athletes={athletes} programs={programs} calcPct={calcPct} onView={setViewProg} onAdd={()=>setModal("addProg")} onAddGroup={()=>setModal("addGroup")}/>;
      case"groups":return<GroupsPage athletes={athletes} onClickAth={a=>{setViewAth(a);setCoachPage("athletes");}}/>;      
      case"coaches":return<CoachesPage coaches={coaches} programs={programs} athletes={athletes} allAthletes={athletes} calcPct={calcPct} onViewAth={a=>{setViewAth(a);setCoachPage("athletes");}} onAssignCoach={assignCoachToAthlete} onRemoveCoach={removeCoachFromAthlete}/>;

      case"notifications":return<NotifPage notifs={notifs} setNotifs={setNotifs} profile={profile}/>;
      default:return null;
    }
  };

  return(
    <><style>{CSS}</style>
    <div className="app">
      <header className="hdr">
        {isCoach&&(viewAth||viewProg)&&<button onClick={()=>{setViewAth(null);setViewProg(null);}} style={{background:"rgba(232,160,32,.15)",border:"1px solid rgba(232,160,32,.3)",borderRadius:7,color:"#e8a020",padding:"5px 12px",cursor:"pointer",fontSize:13,fontWeight:700,marginRight:8}}>← Back</button>}
        {/* "RA"+"Track" is a manual two-tone split of BRANDING.productName for this club's wordmark pun; a future club's product name may not split this neatly. */}
        <div className="hdr-brand" style={{cursor:"pointer",display:"flex",alignItems:"center",gap:8}} title={BRANDING.name} onClick={()=>{setViewAth(null);setViewProg(null);setCoachPage("dashboard");}}>
          <img src={BRANDING.logos.icon} alt="" style={{height:28,width:"auto"}}/>
          <span>RA<em>Track</em></span>
        </div>
        <div className="hdr-right">
          {isCoach&&<>
            <div style={{position:"relative"}}>
              <button className="btn bgh bsm" style={{padding:"6px 9px",position:"relative"}} onClick={()=>setShowNotif(p=>!p)}>
                🔔{unreadN>0&&<span style={{position:"absolute",top:1,right:1,width:14,height:14,borderRadius:"50%",background:"#e84040",color:"#fff",fontSize:8,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{unreadN>9?"9+":unreadN}</span>}
              </button>
              {showNotif&&<NotifPanel notifs={notifs} setNotifs={setNotifs} onClose={()=>setShowNotif(false)} profile={profile}/>}
            </div>

          </>}
          {isDualRole&&(
            <button
              className="btn bgn bsm"
              title="Switch between your athlete and coach views"
              onClick={()=>{setViewMode(effectiveView==="coach"?"athlete":"coach");setViewAth(null);setViewProg(null);}}
            >
              {effectiveView==="coach"?"🏠 View as Athlete":"🛡️ View as Coach"}
            </button>
          )}
          <div className="ubadge">
            <div className="uav">{profile.avatar||ini(profile.name)}</div>
            <div style={{fontSize:12,fontWeight:600}}>{profile.name?.split(" ")[0]}</div>
            <button className="btn bgh bsm" style={{marginLeft:2}} onClick={logout}>↩</button>
          </div>
        </div>
      </header>
      <div className="layout">
        {isCoach&&<aside className="sb">
          {[["dashboard","🏠","Dashboard"],["checkin","✅","Check-In"],["athletes","👤","Athletes"],["games","⚾","Games"],["programs","🏋️","Workouts"],["groups","🏷️","Groups"],["notifications","🔔","Notifications"],...(isAdmin?[["coaches","🛡️","Coaches"]]:[])]  .map(([id,ic,lb])=>(
            <button key={id} className={`sbn ${coachPage===id&&!viewAth&&!viewProg?"on":""}`} onClick={()=>{setCoachPage(id);setViewAth(null);setViewProg(null);}}>
              <span>{ic}</span><span>{lb}</span>
            </button>
          ))}
        </aside>}
        <main className="body">
          {isCoach&&coachBody()}
          {isAthlete&&(workoutView
            ?<WorkoutLogger prog={workoutView} athlete={profile} getLog={getLog} updateLog={(p,e,f,v)=>saveEx(p,e,f,v)} saveEx={(p,e)=>saveEx(p,e,"saved",true,true)} markComplete={markComplete} calcPct={calcPct} onBack={()=>setWorkoutView(null)} getSess={getSess} reloadLogs={async(pId)=>{
    const r=await fetch(`${SURL}/rest/v1/workout_logs?athlete_id=eq.${profile.id}&program_id=eq.${pId}&select=*`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    if(r.ok){const data=await r.json().catch(()=>[]);if(Array.isArray(data)){const lm={...logs};data.forEach(l=>{lm[`${l.program_id}-${l.athlete_id}-${l.exercise_id}`]=l;});setLogs(lm);}}
    const sr=await fetch(`${SURL}/rest/v1/workout_sessions?athlete_id=eq.${profile.id}&program_id=eq.${pId}&select=*`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    if(sr.ok){const sdata=await sr.json().catch(()=>[]);if(Array.isArray(sdata)){const sm={...sessions};sdata.forEach(s=>{sm[`${s.program_id}-${s.athlete_id}`]=s;});setSessions(sm);}}
  }}/>
            :<AthPortal athlete={profile} programs={athProgs} isSaved={isSaved} calcPct={calcPct} setWorkoutView={setWorkoutView} measHist={measHist[profile.id]||[]} selfLogs={selfLogs} onSaveSelfLog={saveSelfLog} profile={profile} checkins={checkins} onToggleCheckin={()=>toggleCheckin(profile.id)}/>
          )}
        </main>
      </div>
      {modal==="addAth"&&<AddAthModal onClose={()=>setModal(null)} onSave={a=>{saveAthlete(a);setModal(null);}}/>}
      {modal==="addProg"&&<AddProgModal athletes={athletes} onClose={()=>setModal(null)} onSave={p=>{saveProgram(p);setModal(null);}}/>}
      {modal==="addGroup"&&<AddGroupModal athletes={athletes} onClose={()=>setModal(null)} onSave={p=>{saveProgram(p);setModal(null);}}/>}
      {isCoach&&<nav className="bnav">
        {[["dashboard","🏠","Home"],["checkin","✅","Check-In"],["athletes","👤","Roster"],["games","⚾","Games"],["programs","🏋️","Workouts"],["groups","🏷️","Groups"],["notifications","🔔","Alerts"],...(isAdmin?[["coaches","🛡️","Coaches"]]:[])]  .map(([id,ic,lb])=>(
          <button key={id} className={`bnavb ${coachPage===id&&!viewAth&&!viewProg?"on":""}`} onClick={()=>{setCoachPage(id);setViewAth(null);setViewProg(null);}}>
            <span className="bnavbi">{ic}</span><span>{lb}</span>
          </button>
        ))}
      </nav>}
    </div></>
  );
}
function Dashboard({athletes,programs,calcPct,setCoachPage,setViewAth,isAdmin}){
  const avgPct=programs.length?Math.round(programs.reduce((s,p)=>s+calcPct(p),0)/programs.length):0;
  const[expandedGroup,setExpandedGroup]=useState(null);
  const[expandedGrad,setExpandedGrad]=useState(null);
  const[expandedAge,setExpandedAge]=useState(null);
  const activeAgeGroups=AGE_GROUPS.filter(g=>athletes.some(a=>a.age_group===g));

  const goAth=(a)=>{setCoachPage("athletes");setViewAth(a);};

  const AthRow=({a})=>{
    const prog=programs.find(p=>p.athleteId===a.id);const pct=prog?calcPct(prog):0;
    return(
      <div className="ri" style={{cursor:"pointer",paddingLeft:12}} onClick={()=>goAth(a)}>

        <div style={{fontSize:12,fontWeight:700,color:"#e8a020"}}>{pct}%</div>
        <span style={{fontSize:10,color:"#6b82a0",marginLeft:4}}>→</span>

    <div className="pt">Coach <em>Dashboard</em></div>
