      const r=await fetch(`${SURL}/rest/v1/profiles?id=eq.${athlete.id}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify(updates)});
      if(!r.ok){const t=await r.text();alert("Save error: "+t);return;}
      const{data:fresh}=await sb.from("profiles").select("*").eq("id",athlete.id).maybeSingle();
      if(fresh)Object.assign(athlete,fresh);
    }}/>}
  </>);
}

function WorkoutLogger({prog,athlete,getLog,updateLog,saveEx,markComplete,calcPct,onBack,getSess,reloadLogs}){
  const[fields,setFields]=useState({});
  const[showPrint,setShowPrint]=useState(true);
  const isPlan=prog.planType==="plan"||prog.plan_type==="plan";
  const completing=useRef(false);
  // Reload logs from DB on mount to ensure fresh completion state
  useEffect(()=>{
    if(!reloadLogs)return;
    reloadLogs(prog.id);
  },[prog.id]);
  const pct=calcPct(prog);
  const sess=getSess?getSess(prog.id):{};
  const dur=sess.started_at&&sess.completed_at?Math.round((new Date(sess.completed_at)-new Date(sess.started_at))/60000):sess.started_at?Math.round((Date.now()-new Date(sess.started_at))/60000):null;
  useEffect(()=>{if(pct===100&&!sess.completed_at&&!completing.current){completing.current=true;markComplete(prog.id);}},[pct,sess.completed_at]);
  const handleSave=async(pId,exId)=>{
    const f=fields[exId]||{};
    if(f.reps)await updateLog(pId,exId,"reps",f.reps);
    if(f.weight)await updateLog(pId,exId,"weight",f.weight);
    if(f.sets)await updateLog(pId,exId,"sets",f.sets);
    if(f.notes)await updateLog(pId,exId,"notes",f.notes);
    await saveEx(pId,exId);
  };
  return(<>
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
      <button className="bb" style={{marginBottom:0}} onClick={onBack}>← My Workouts</button>
      <button className="btn bgh bsm" onClick={()=>setShowPrint(p=>!p)} style={{marginLeft:"auto"}}>{showPrint?"📋 List View":"🖨️ Print View"}</button>
    </div>
    {showPrint&&<div style={{marginBottom:16}}><AthPlanPrint plan={prog} athlete={athlete||{name:""}} reps={{}}/></div>}
    {!showPrint&&<>
    <div className="ph">
      <div><div style={{fontSize:18,fontWeight:800}}>{prog.name}</div><div style={{fontSize:11,color:"#6b82a0"}}>{prog.week}</div></div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
        <span className="bdg bg3">{pct}% Done</span>
        {sess.started_at&&<span style={{fontSize:9,color:"#6b82a0"}}>Started {fmtT(sess.started_at)}{dur!==null?` · ${fmtD(dur)}`:""}</span>}
      </div>
    </div>
    {(prog.days||[]).map((day,di)=>(
      <div key={di} style={{marginBottom:18}}>
        <div style={{fontSize:14,fontWeight:800,textTransform:"uppercase",color:"#e8a020",letterSpacing:".8px",marginBottom:8,paddingBottom:6,borderBottom:"1px solid rgba(255,255,255,.07)"}}>{day.day}</div>
        {(day.exercises||[]).map(ex=>{
          const log=getLog(prog.id,ex.id);const saved=log.saved;
          const f=fields[ex.id]||{};
          const upd=(k,v)=>setFields(p=>({...p,[ex.id]:{...(p[ex.id]||{}),[k]:v}}));
          return(<div key={ex.id} className={`le ${saved?"done":""}`}>
            <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}>
              <div className="lex">{ex.name}</div>
              {saved&&<span className="bdg bg2" style={{marginLeft:"auto"}}>✓ Logged</span>}
            </div>
            <div className="lep">Prescribed: {ex.duration?ex.duration+" min":ex.sets+" sets × "+ex.reps+" reps"+(ex.weight?" @ "+ex.weight:"")}</div>
            {ex.notes&&<div style={{fontSize:10,color:"#e8a020",marginTop:1}}>Coach: {ex.notes}</div>}
            <div className="lg">
              <div className="lf"><label>Reps Done</label><input className="inp" type="number" placeholder={ex.reps} value={f.reps||log.reps||""} onChange={e=>upd("reps",e.target.value)}/></div>
              <div className="lf"><label>Weight/Load</label><input className="inp" placeholder={ex.weight} value={f.weight||log.weight||""} onChange={e=>upd("weight",e.target.value)}/></div>
              <div className="lf"><label>Sets Done</label><input className="inp" type="number" placeholder={ex.sets} value={f.sets||log.sets||""} onChange={e=>upd("sets",e.target.value)}/></div>
              <div className="lf lfw"><label>Notes</label><input className="inp" placeholder="How did it feel?" value={f.notes||log.notes||""} onChange={e=>upd("notes",e.target.value)}/></div>
            </div>
            <div style={{display:"flex",justifyContent:"flex-end",marginTop:8}}>
              <button className={`btn bsm ${saved?"bgh":"bgn"}`} onClick={()=>handleSave(prog.id,ex.id)}>{saved?"✓ Saved":"Save Exercise"}</button>
            </div>
          </div>);
        })}
      </div>
    ))}
    {pct===100&&<div className="cel"><div style={{fontSize:32}}>🏆</div><div style={{fontSize:20,fontWeight:800,marginTop:8}}>Workout Complete!</div>{dur&&<div style={{color:"#e8a020",fontWeight:700,marginTop:4}}>⏱ {fmtD(dur)}</div>}<div style={{fontSize:12,color:"#8fa3be",marginTop:5}}>Great work, {athlete.name?.split(" ")[0]}. Keep grinding.</div></div>}
  </>}
  </>);
}


function DrillLibraryPage({athletes,customDrills,setCustomDrills,profile,isAdmin}){
  const[selCat,setSelCat]=useState("All");
  const[search,setSearch]=useState("");
  const[showForm,setShowForm]=useState(false);
  const[editDrill,setEditDrill]=useState(null);
  const[saving,setSaving]=useState(false);
  const blankForm={name:"",cat:EX_CATS[0],desc:"",sets:3,reps:10,wt:""};
  const[form,setForm]=useState(blankForm);
  const upd=(k,v)=>setForm(p=>({...p,[k]:v}));

  const stockDrills=EXERCISE_LIBRARY.map(d=>({...d,isCustom:false}));
  const customList=(customDrills||[]).map(d=>({...d,id:"custom_"+d.id,isCustom:true}));
  const allDrills=[...stockDrills,...customList];
  const CAT_LIST=["All",...EX_CATS,"Custom"];

  const filtered=allDrills.filter(function(d){
    const matchCat=selCat==="All"||(selCat==="Custom"?d.isCustom:d.cat===selCat);
    const srch=search.toLowerCase();
    const matchSearch=!srch||d.name.toLowerCase().includes(srch)||(d.desc||"").toLowerCase().includes(srch);
    return matchCat&&matchSearch;
  });

  const openNew=()=>{setForm(blankForm);setEditDrill(null);setShowForm(true);};
  const openEdit=(d)=>{setForm({name:d.name,cat:d.cat,desc:d.desc||"",sets:d.sets||3,reps:d.reps||10,wt:d.wt||""});setEditDrill(d);setShowForm(true);};
  const openDupe=(d)=>{setForm({name:d.name+" (Copy)",cat:d.cat,desc:d.desc||"",sets:d.sets||3,reps:d.reps||10,wt:d.wt||""});setEditDrill(null);setShowForm(true);};

  const saveDrill=async()=>{
    if(!form.name.trim()){alert("Enter a drill name.");return;}
    setSaving(true);
    if(editDrill&&editDrill.isCustom){
      const rawId=editDrill.id.replace("custom_","");
      const r=await fetchWithRefresh(`${SURL}/rest/v1/custom_exercises?id=eq.${rawId}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify({name:form.name,cat:form.cat,desc:form.desc||null,description:form.desc||null,sets:parseInt(form.sets)||3,reps:parseInt(form.reps)||10,wt:form.wt||null})});
      if(r.ok){const updated=await r.json();setCustomDrills(p=>p.map(d=>String(d.id)===rawId?{...d,...updated[0]}:d));}
    } else {
      const r=await fetchWithRefresh(`${SURL}/rest/v1/custom_exercises`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify({name:form.name,cat:form.cat,desc:form.desc||null,description:form.desc||null,sets:parseInt(form.sets)||3,reps:parseInt(form.reps)||10,wt:form.wt||null,created_by:profile?.id})});
      if(r.ok){const created=await r.json();setCustomDrills(p=>[...p,created[0]]);}
    }
    setSaving(false);setShowForm(false);setEditDrill(null);
  };

  const delDrill=async(d)=>{
    if(!d.isCustom){alert("Stock drills cannot be deleted.");return;}
    if(!window.confirm("Delete this drill?"))return;
    const rawId=d.id.replace("custom_","");
    const r=await fetchWithRefresh(`${SURL}/rest/v1/custom_exercises?id=eq.${rawId}`,{method:"DELETE",headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    if(r.ok)setCustomDrills(p=>p.filter(x=>String(x.id)!==rawId));
  };

  return(<>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:8}}>
      <div style={{fontWeight:800,fontSize:20}}>⚾ Drill Library</div>
      <button className="btn bg" onClick={openNew}>+ New Drill</button>
    </div>
    <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
      <input className="inp" placeholder="Search drills..." value={search} onChange={e=>setSearch(e.target.value)} style={{flex:1,minWidth:160}}/>
      <select className="inp" value={selCat} onChange={e=>setSelCat(e.target.value)} style={{minWidth:150}}>
        {CAT_LIST.map(function(cat2){
          const cnt=cat2==="All"?allDrills.length:cat2==="Custom"?customList.length:stockDrills.filter(function(d){return d.cat===cat2;}).length;
          return(<option key={cat2} value={cat2}>{cat2} ({cnt})</option>);
        })}
      </select>
    </div>
    {filtered.length===0&&<div className="empty"><div className="ei">⚾</div><div className="et">No drills found</div></div>}
    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      {filtered.map(function(d){
        return(
          <div key={d.id} style={{padding:"11px 14px",background:"rgba(255,255,255,.03)",border:"1px solid "+(d.isCustom?"rgba(232,160,32,.2)":"rgba(255,255,255,.07)"),borderRadius:9}}>
            <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:3}}>
                  <span style={{fontWeight:700,fontSize:14}}>{d.name}</span>
                  <span style={{background:d.isCustom?"rgba(232,160,32,.12)":"rgba(255,255,255,.06)",color:d.isCustom?"#e8a020":"#6b82a0",borderRadius:8,padding:"1px 8px",fontSize:10,fontWeight:700}}>{d.cat}</span>
                  {d.isCustom&&<span style={{background:"rgba(232,160,32,.08)",color:"#e8a020",borderRadius:8,padding:"1px 7px",fontSize:9,fontWeight:700}}>Custom</span>}
                </div>
                {(d.sets||d.reps||d.wt)&&<div style={{fontSize:11,color:"#6b82a0",marginBottom:d.desc?4:0}}>{d.sets&&d.sets+"×"}{d.reps&&d.reps+" reps"}{d.wt?" · "+d.wt:""}</div>}
                {d.desc&&<div style={{fontSize:11,color:"#8fa3be",lineHeight:1.5}}>{d.desc}</div>}
              </div>
              <div style={{display:"flex",gap:5,flexShrink:0}}>
                <button className="btn bgh bsm" onClick={function(){openDupe(d);}}>⧉</button>
                {d.isCustom&&<button className="btn bgh bsm" onClick={function(){openEdit(d);}}>✏️</button>}
                {d.isCustom&&<button className="btn bgr bsm" onClick={function(){delDrill(d);}}>✕</button>}
              </div>
            </div>
          </div>
        );
      })}
    </div>
    {showForm&&<div className="mbg" onClick={function(){setShowForm(false);}}>
      <div style={{background:"#0d1526",border:"1px solid rgba(255,255,255,.15)",borderRadius:14,width:"100%",maxWidth:520,maxHeight:"90vh",overflow:"auto",padding:20}} onClick={function(e){e.stopPropagation();}}>
        <div style={{fontWeight:800,fontSize:16,marginBottom:16}}>{editDrill?"✏️ Edit Drill":"+ New Drill"}</div>
        <div className="fg"><label>Drill Name *</label><input className="inp" value={form.name} onChange={function(e){upd("name",e.target.value);}} placeholder="e.g. Two-Hand Tee Work"/></div>
        <div className="fg"><label>Category</label>
          <select className="inp" value={form.cat} onChange={function(e){upd("cat",e.target.value);}}>
            {EX_CATS.map(function(cat2){return(<option key={cat2} value={cat2}>{cat2}</option>);})}
            <option value="Custom">Custom</option>
            <option value="Team Drills">Team Drills</option>
          </select>
        </div>
        <div className="fg2">
          <div className="fg"><label>Sets</label><input className="inp" type="number" value={form.sets} onChange={function(e){upd("sets",e.target.value);}}/></div>
          <div className="fg"><label>Reps</label><input className="inp" type="number" value={form.reps} onChange={function(e){upd("reps",e.target.value);}}/></div>
        </div>
        <div className="fg"><label>Equipment / Load</label><input className="inp" value={form.wt} onChange={function(e){upd("wt",e.target.value);}} placeholder="e.g. J-Band, 10 lbs"/></div>
        <div className="fg" style={{marginBottom:16}}><label>Description (shows inline on print)</label><textarea className="inp" value={form.desc} onChange={function(e){upd("desc",e.target.value);}} placeholder="Explain the drill purpose for athletes and parents..." style={{minHeight:80}}/></div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn bg" onClick={saveDrill} disabled={saving} style={{flex:1}}>{saving?"Saving...":editDrill?"💾 Save Changes":"+ Add Drill"}</button>
          <button className="btn bgh" onClick={function(){setShowForm(false);}}>Cancel</button>
        </div>
      </div>
    </div>}
  </>);
}

  },[]);

              <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}>
                <div style={{fontWeight:600,fontSize:14,flex:1}}>{ex.name}</div>
                {String(ex.id).startsWith("custom_")&&<span style={{fontSize:9,fontWeight:700,textTransform:"uppercase",background:"rgba(232,160,32,.15)",color:"#e8a020",padding:"2px 6px",borderRadius:4,flexShrink:0}}>Custom</span>}
              </div>
              <div style={{fontSize:11,color:"#6b82a0"}}>
                <span style={{color:"#8fa3be",fontWeight:600}}>{ex.sets}</span> sets · ex.duration?<span style={{color:"#8fa3be",fontWeight:600}}>{ex.duration} min</span>:<><span style={{color:"#8fa3be",fontWeight:600}}>{ex.reps}</span> reps{ex.wt?<> · {ex.wt}</>:null}</>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

      <div className="fg"><label>Position</label><select className="inp" value={f.position} onChange={e=>up("position",e.target.value)}>{ALL_POS.map(p=><option key={p}>{p}</option>)}</select></div>
      <div className="fg"><label>Jersey # <span style={{fontSize:10,color:"#6b82a0",fontWeight:400}}>(optional)</span></label><input className="inp" placeholder="e.g. 12" value={f.jersey_number} onChange={e=>up("jersey_number",e.target.value)} style={{maxWidth:100}}/></div>
      <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:10}}>
        <button onClick={()=>up("useAge",false)} style={{flex:1,padding:"6px",borderRadius:7,border:`1px solid ${!f.useAge?"#e8a020":"rgba(255,255,255,.12)"}`,background:!f.useAge?"rgba(232,160,32,.08)":"transparent",color:!f.useAge?"#e8a020":"#8fa3be",fontSize:10,fontWeight:700,cursor:"pointer"}}>Grad Year</button>
        <button onClick={()=>up("useAge",true)} style={{flex:1,padding:"6px",borderRadius:7,border:`1px solid ${f.useAge?"#e8a020":"rgba(255,255,255,.12)"}`,background:f.useAge?"rgba(232,160,32,.08)":"transparent",color:f.useAge?"#e8a020":"#8fa3be",fontSize:10,fontWeight:700,cursor:"pointer"}}>Age Group</button>
      </div>
      {!f.useAge?<div className="fg"><label>Grad Year</label><select className="inp" value={f.grad} onChange={e=>up("grad",parseInt(e.target.value))}>{GRAD_YEARS.map(y=><option key={y}>{y}</option>)}</select></div>:<div className="fg"><label>Age Group</label><select className="inp" value={f.ageGroup||""} onChange={e=>up("ageGroup",e.target.value)}><option value="">Select...</option>{AGE_GROUPS.map(g=><option key={g}>{g}</option>)}</select></div>}
      <div className="fg2"><div className="fg"><label>High School</label><input className="inp" placeholder="School name" value={f.high_school||""} onChange={e=>up("high_school",e.target.value)}/></div><div className="fg"><label>GPA</label><input className="inp" placeholder="3.8" value={f.gpa} onChange={e=>up("gpa",e.target.value)}/></div></div>
      <div className="fg3"><div className="fg"><label>Height</label><input className="inp" placeholder='6&apos;1"' value={f.height} onChange={e=>up("height",e.target.value)}/></div><div className="fg"><label>Weight</label><input className="inp" placeholder="185" value={f.weight} onChange={e=>up("weight",e.target.value)}/></div><div className="fg"><label>Dream School</label><input className="inp" placeholder="Vanderbilt" value={f.dreamSchool} onChange={e=>up("dreamSchool",e.target.value)}/></div></div>
      <div className="fg3"><div className="fg"><label>Bats</label><select className="inp" value={f.bats} onChange={e=>up("bats",e.target.value)}><option>R</option><option>L</option><option>S</option></select></div><div className="fg"><label>Throws</label><select className="inp" value={f.throws} onChange={e=>up("throws",e.target.value)}><option>R</option><option>L</option></select></div><div className="fg"><label>Dream School</label><input className="inp" placeholder="Vanderbilt" value={f.dreamSchool} onChange={e=>up("dreamSchool",e.target.value)}/></div></div>
      <div className="mf"><button className="btn bgh bsm" onClick={onClose}>Cancel</button><button className="btn bg bsm" onClick={()=>onSave({...f,grad:f.useAge?null:parseInt(f.grad),age_group:f.useAge?f.ageGroup:null})} disabled={!f.name||!f.email}>+ Add Athlete</button></div>
    </div></div>
  );
}

function AddProgModal({athletes,onClose,onSave}){
  const[step,setStep]=useState(1);
  const[name,setName]=useState("");
  const[athId,setAthId]=useState(athletes[0]?.id||"");
  const[week,setWeek]=useState("Week 1");
  const[days,setDays]=useState([{day:"Monday",exercises:[]},{day:"Tuesday",exercises:[]},{day:"Wednesday",exercises:[]},{day:"Thursday",exercises:[]},{day:"Friday",exercises:[]},{day:"Saturday",exercises:[]},{day:"Sunday",exercises:[]}]);
  const[activeDay,setActiveDay]=useState(0);
  const[showPicker,setShowPicker]=useState(false);
  const addEx=(ex)=>{const u=[...days];u[activeDay].exercises.push({id:`e${Date.now()}`,name:ex.name,sets:ex.sets,reps:ex.reps,weight:ex.wt,notes:""});setDays(u);setShowPicker(false);};
  const addBlank=()=>{const u=[...days];u[activeDay].exercises.push({id:`e${Date.now()}`,name:"",sets:3,reps:10,weight:"",notes:""});setDays(u);};
  const updEx=(di,ei,k,v)=>{const u=[...days];u[di].exercises[ei][k]=v;setDays(u);};
  const remEx=(di,ei)=>{const u=[...days];u[di].exercises.splice(ei,1);setDays(u);};
  const addDay=()=>{const used=days.map(d=>d.day);const next=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].find(d=>!used.includes(d));if(next)setDays([...days,{day:next,exercises:[]}]);};
  return(<>
    <div className="mbg" onClick={onClose}><div className="modal mlg" onClick={e=>e.stopPropagation()}>
      <div className="mt">New <em>Program</em></div>
      {step===1&&<>
        <div className="fg"><label>Program Name *</label><input className="inp" placeholder="e.g. Arm Strength & Velocity" value={name} onChange={e=>setName(e.target.value)}/></div>
        <div className="fg2"><div className="fg"><label>Athlete *</label><select className="inp" value={athId} onChange={e=>setAthId(e.target.value)}>{athletes.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}</select></div><div className="fg"><label>Week</label><input className="inp" placeholder="Week 1" value={week} onChange={e=>setWeek(e.target.value)}/></div></div>
        <div className="mf"><button className="btn bgh bsm" onClick={onClose}>Cancel</button><button className="btn bg bsm" onClick={()=>setStep(2)} disabled={!name||!athId}>Next: Build Workout →</button></div>
      </>}
      {step===2&&<>
        <div style={{overflowX:"auto",marginBottom:12,paddingBottom:4}}><div style={{display:"flex",gap:5,minWidth:"max-content"}}>{days.map((d,i)=><button key={i} className={`fc ${activeDay===i?"on":""}`} onClick={()=>setActiveDay(i)} style={{whiteSpace:"nowrap",flexShrink:0}}>{d.day.slice(0,3)} {d.exercises.length>0?<span style={{color:"#27c97a"}}>({d.exercises.length})</span>:<span style={{color:"#6b82a0"}}>(0)</span>}</button>)}<button className="fc" onClick={addDay} style={{flexShrink:0}}>+ Day</button></div></div>
        <div style={{display:"flex",gap:7,marginBottom:10}}><button className="btn bg bsm" onClick={()=>setShowPicker(true)}>⚾ Library</button><button className="btn bgh bsm" onClick={addBlank}>+ Blank</button></div>
        <div style={{maxHeight:300,overflowY:"auto"}}>
          {days[activeDay].exercises.length===0&&<div className="empty" style={{padding:"18px 0"}}><div className="ei">⚾</div><div className="et" style={{fontSize:13}}>No exercises yet</div></div>}
          {days[activeDay].exercises.map((ex,ei)=>(
            <div key={ex.id} style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.07)",borderRadius:7,padding:10,marginBottom:8}}>
              <div style={{display:"flex",gap:7,marginBottom:7,alignItems:"center"}}><input className="inp" placeholder="Exercise name" value={ex.name} onChange={e=>updEx(activeDay,ei,"name",e.target.value)} style={{flex:1}}/><button className="btn bgr bsm" onClick={()=>remEx(activeDay,ei)}>✕</button></div>
              <div className="fg3"><div className="fg"><label>Sets</label><input className="inp" type="number" value={ex.sets} onChange={e=>updEx(activeDay,ei,"sets",e.target.value)}/></div><div className="fg"><label>Reps</label><input className="inp" type="number" value={ex.reps} onChange={e=>updEx(activeDay,ei,"reps",e.target.value)}/></div><div className="fg"><label>Load</label><input className="inp" placeholder="45 lbs" value={ex.weight} onChange={e=>updEx(activeDay,ei,"weight",e.target.value)}/></div></div>
              <div className="fg" style={{marginBottom:0}}><label>Coach Notes</label><input className="inp" placeholder="Cues, focus..." value={ex.notes} onChange={e=>updEx(activeDay,ei,"notes",e.target.value)}/></div>
            </div>
          ))}
        </div>
        <div className="mf"><button className="btn bgh bsm" onClick={()=>setStep(1)}>← Back</button><button className="btn bg bsm" onClick={()=>onSave({name,athleteId:athId,week,days:days.filter(d=>d.exercises.length>0)})}>Save Program</button></div>
      </>}
    </div></div>
    {showPicker&&<ExPicker onSelect={addEx} onClose={()=>setShowPicker(false)}/>}
  </>);
}




function CoachesPage({coaches,programs,athletes,allAthletes,teams,weekends,calcPct,onViewAth,onAssignCoach,onRemoveCoach,onAssignTeam,onRemoveTeam,onLinkChildAthlete,onUnlinkChildAthlete,onAddAthlete}){
  const[search,setSearch]=useState("");
  const[selCoach,setSelCoach]=useState(null);
  const[showTeamAssign,setShowTeamAssign]=useState(null);
  const[linkSearch,setLinkSearch]=useState("");
  const[showLinkPicker,setShowLinkPicker]=useState(false);
  const[showCreateAth,setShowCreateAth]=useState(false);
  const[newAthName,setNewAthName]=useState("");
  const[newAthPos,setNewAthPos]=useState("Pitcher");
  const[newAthGrad,setNewAthGrad]=useState("");
  const[saving,setSaving]=useState(false);

  const filtered=(coaches||[]).filter(function(co){return !search||(co.name||"").toLowerCase().includes(search.toLowerCase());});
  const teamsForCoach=(coachId)=>(teams||[]).filter(function(t){return(t.coach_ids||[]).includes(coachId);});

  if(showTeamAssign){
    const thisCoach=coaches.find(function(c){return c.id===showTeamAssign;});
    const assignedTeamIds=teamsForCoach(showTeamAssign).map(function(t){return t.id;});
    return(
      <div>
        <button className="bb" onClick={()=>setShowTeamAssign(null)}>← Coaches</button>
        <div style={{fontWeight:800,fontSize:16,marginBottom:12}}>🏟️ Assign Teams — {thisCoach?.name}</div>
        <div style={{fontSize:11,color:"#6b82a0",marginBottom:12}}>Assigned coaches can view and manage games for those teams.</div>
        {(weekends||[]).length===0&&<div style={{fontSize:12,color:"#6b82a0",fontStyle:"italic"}}>No weekends yet. Create weekends in the Games module first.</div>}
        {(weekends||[]).sort(function(a,b){return(b.start_date||"").localeCompare(a.start_date||"");}).map(function(wk){
          const wkTeams=(teams||[]).filter(function(t){return t.weekend_id===wk.id;});
          if(!wkTeams.length)return null;
          return(<div key={wk.id} style={{marginBottom:14}}>
            <div style={{fontSize:11,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",letterSpacing:.5,marginBottom:6}}>{wk.name||wk.start_date}</div>
            {wkTeams.map(function(t){
              const on=assignedTeamIds.includes(t.id);
              return(
                <div key={t.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",background:on?"rgba(58,155,232,.08)":"rgba(255,255,255,.02)",border:"1px solid "+(on?"rgba(58,155,232,.3)":"rgba(255,255,255,.06)"),borderRadius:8,marginBottom:4}}>
                  <div style={{flex:1}}>
                    <div style={{fontSize:13,fontWeight:600}}>{t.name}</div>
                    <div style={{fontSize:10,color:"#6b82a0"}}>{(t.athlete_ids||[]).length} athletes · {wk.name}</div>
                  </div>
                  {on
                    ?<button className="btn bgr bsm" onClick={()=>onRemoveTeam&&onRemoveTeam(t.id,showTeamAssign)}>Remove</button>
                    :<button className="btn bg bsm" onClick={()=>onAssignTeam&&onAssignTeam(t.id,showTeamAssign)}>+ Assign</button>}
                </div>
              );
            })}
          </div>);
        })}
      </div>
    );
  }

  if(selCoach){
    const myAthletes=(allAthletes||athletes).filter(function(a){return (a.coach_ids||[]).includes(selCoach.id)||(a.coach_id===selCoach.id);});
    const linkedKids=(allAthletes||athletes).filter(function(a){return(selCoach.child_ids||[]).includes(a.id);});
    const unlinkedAths=(allAthletes||athletes).filter(function(a){return !(selCoach.child_ids||[]).includes(a.id)&&(!linkSearch||(a.name||"").toLowerCase().includes(linkSearch.toLowerCase()));});
    return(
      <div>
        <div className="ph">
          <button className="bb" onClick={()=>{setSelCoach(null);setShowLinkPicker(false);setShowCreateAth(false);}}>← Coaches</button>
          <div style={{fontWeight:800,fontSize:16}}>{selCoach.name}</div>
        </div>
        <div style={{fontSize:11,color:"#6b82a0",marginBottom:14}}>{selCoach.email||""}</div>

        <div className="card" style={{marginBottom:14,border:"1px solid rgba(232,160,32,.2)",background:"rgba(232,160,32,.03)"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
            <div className="ds" style={{margin:0,color:"#e8a020"}}>👦 My Athlete{linkedKids.length!==1?"s":""}</div>
            <div style={{display:"flex",gap:6}}>
              <button className="btn bgh bsm" onClick={()=>{setShowLinkPicker(!showLinkPicker);setShowCreateAth(false);}}>Link Existing</button>
              <button className="btn bg bsm" onClick={()=>{setShowCreateAth(!showCreateAth);setShowLinkPicker(false);}}>+ Create</button>
            </div>
          </div>
          <div style={{fontSize:11,color:"#6b82a0",marginBottom:8}}>Athlete profiles attached to this coach — no separate login needed, they appear in all rosters.</div>
          {linkedKids.length===0&&!showLinkPicker&&!showCreateAth&&<div style={{fontSize:12,color:"#6b82a0",fontStyle:"italic"}}>No athletes linked yet.</div>}
          {linkedKids.map(function(a){return(
            <div key={a.id} className="ri" style={{cursor:"pointer"}} onClick={()=>onViewAth&&onViewAth(a)}>
              <div className="riv" style={{width:32,height:32,fontSize:10}}>{a.avatar||ini(a.name)}</div>
              <div style={{flex:1}}><div style={{fontWeight:700,fontSize:13}}>{a.name}</div><div style={{fontSize:10,color:"#6b82a0"}}>{a.position||""}{a.grad?" · "+a.grad:a.age_group?" · "+a.age_group:""}</div></div>
              <button className="btn bgr bsm" onClick={function(e){e.stopPropagation();onUnlinkChildAthlete&&onUnlinkChildAthlete(selCoach.id,a.id);}}>Unlink</button>
            </div>
          );})}
          {showLinkPicker&&<div style={{marginTop:10}}>
            <input className="inp" placeholder="Search athletes..." value={linkSearch} onChange={function(e){setLinkSearch(e.target.value);}} style={{marginBottom:6}}/>
            <div style={{maxHeight:180,overflowY:"auto"}}>
              {unlinkedAths.slice(0,30).map(function(a){return(
                <div key={a.id} className="ri">
                  <div className="riv" style={{width:28,height:28,fontSize:9}}>{a.avatar||ini(a.name)}</div>
                  <div style={{flex:1,fontSize:12,fontWeight:600}}>{a.name}<span style={{fontSize:10,color:"#6b82a0",marginLeft:6}}>{a.position||""}{a.age_group?" · "+a.age_group:a.grad?" · "+a.grad:""}</span></div>
                  <button className="btn bg bsm" onClick={function(){onLinkChildAthlete&&onLinkChildAthlete(selCoach.id,a.id);setSelCoach(function(p){return{...p,child_ids:[...(p.child_ids||[]),a.id]};});setShowLinkPicker(false);setLinkSearch("");}}>Link</button>
                </div>
              );})}
              {unlinkedAths.length===0&&<div style={{fontSize:12,color:"#6b82a0",fontStyle:"italic",padding:8}}>No athletes match.</div>}
            </div>
          </div>}
          {showCreateAth&&<div style={{marginTop:10}}>
            <div className="fg2">
              <div className="fg"><label>Full Name *</label><input className="inp" placeholder="First Last" value={newAthName} onChange={function(e){setNewAthName(e.target.value);}}/></div>
              <div className="fg"><label>Position</label>
                <select className="inp" value={newAthPos} onChange={function(e){setNewAthPos(e.target.value);}}>
                  {["Pitcher","Catcher","1B","2B","3B","SS","LF","CF","RF","OF","INF","UTL"].map(function(p){return<option key={p} value={p}>{p}</option>;})}
                </select>
              </div>
            </div>
            <div className="fg"><label>Grad Year or Age Group</label><input className="inp" placeholder="e.g. 2030 or 12U" value={newAthGrad} onChange={function(e){setNewAthGrad(e.target.value);}}/></div>
            <div style={{display:"flex",gap:8}}>
              <button className="btn bg bsm" disabled={saving||!newAthName.trim()} onClick={function(){
                setSaving(true);
                const isYear=!isNaN(parseInt(newAthGrad))&&newAthGrad.length===4;
                const ath={name:newAthName.trim(),position:newAthPos,grad:isYear?parseInt(newAthGrad):null,age_group:!isYear&&newAthGrad?newAthGrad:null,role:"athlete",coach_id:selCoach.id,coach_ids:[selCoach.id],is_active:true};
                Promise.resolve(onAddAthlete&&onAddAthlete(ath)).then(function(newA){
                  if(newA){onLinkChildAthlete&&onLinkChildAthlete(selCoach.id,newA.id);setSelCoach(function(p){return{...p,child_ids:[...(p.child_ids||[]),newA.id]};});setNewAthName("");setNewAthGrad("");setNewAthPos("Pitcher");setShowCreateAth(false);}
                  setSaving(false);
                });
              }}>{saving?"Creating...":"Create & Link"}</button>
              <button className="btn bgh bsm" onClick={()=>{setShowCreateAth(false);setNewAthName("");setNewAthGrad("");}}>Cancel</button>
            </div>
          </div>}
        </div>

        <div className="ds">Athlete Roster ({myAthletes.length})</div>
        {myAthletes.length===0&&<div style={{fontSize:12,color:"#6b82a0",fontStyle:"italic",marginBottom:10}}>No athletes assigned to this coach yet.</div>}
        {myAthletes.map(function(a){return(
          <div key={a.id} className="ri" style={{cursor:"pointer"}} onClick={()=>onViewAth&&onViewAth(a)}>
            <div className="riv" style={{width:36,height:36,fontSize:12}}>{a.avatar||ini(a.name)}</div>
            <div style={{flex:1}}><div style={{fontWeight:700}}>{a.name}</div><div style={{fontSize:11,color:"#6b82a0"}}>{a.position||""}{a.grad?" · "+a.grad:""}</div></div>
            <button className="btn bgr bsm" onClick={function(e){e.stopPropagation();onRemoveCoach&&onRemoveCoach(a.id,selCoach.id);}}>Remove</button>
          </div>
        );})}
        <div className="ds" style={{marginTop:16}}>Assign Athletes</div>
        <div style={{maxHeight:200,overflowY:"auto"}}>
          {(allAthletes||athletes).filter(function(a){return !(a.coach_ids||[]).includes(selCoach.id)&&a.coach_id!==selCoach.id;}).map(function(a){return(
            <div key={a.id} className="ri">
              <div className="riv" style={{width:32,height:32,fontSize:10}}>{a.avatar||ini(a.name)}</div>
              <div style={{flex:1,fontWeight:600}}>{a.name}<span style={{fontSize:10,color:"#6b82a0",marginLeft:6}}>{a.position||""}</span></div>
              <button className="btn bg bsm" onClick={()=>onAssignCoach&&onAssignCoach(a.id,selCoach.id)}>+ Assign</button>
            </div>
          );})}
        </div>
      </div>
    );
  }

  return(
    <div>
      <div className="ph"><div className="pt">Coaches</div></div>
      <input className="inp" placeholder="Search coaches..." value={search} onChange={e=>setSearch(e.target.value)} style={{marginBottom:12}}/>
      {filtered.length===0&&<div className="empty"><div className="ei">👨‍🏫</div><div className="et">No coaches yet</div></div>}
      {filtered.map(function(co){
        const myAthletes=(allAthletes||athletes).filter(function(a){return (a.coach_ids||[]).includes(co.id)||(a.coach_id===co.id);});
        const linkedKids=(allAthletes||athletes).filter(function(a){return(co.child_ids||[]).includes(a.id);});
        const myTeams=teamsForCoach(co.id);
        return(
          <div key={co.id} className="ri" onClick={()=>setSelCoach(co)} style={{cursor:"pointer",padding:"10px 12px"}}>
            <div className="riv" style={{width:40,height:40,fontSize:13}}>{co.avatar||ini(co.name)}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:14}}>{co.name}</div>
              <div style={{fontSize:11,color:"#6b82a0"}}>{co.email||""}</div>
              <div style={{display:"flex",gap:8,marginTop:3,flexWrap:"wrap"}}>
                {myTeams.length>0&&<span style={{fontSize:10,color:"#3a9be8"}}>🏟️ {myTeams.length} team{myTeams.length!==1?"s":""}</span>}
                {myAthletes.length>0&&<span style={{fontSize:10,color:"#6b82a0"}}>👤 {myAthletes.length} athletes</span>}
                {linkedKids.length>0&&<span style={{fontSize:10,color:"#e8a020"}}>👦 {linkedKids.length} linked</span>}
              </div>
            </div>
            <div style={{display:"flex",gap:6,alignItems:"center"}} onClick={function(e){e.stopPropagation();}}>
              <button className="btn bbl bsm" onClick={()=>setShowTeamAssign(co.id)}>🏟️ Teams</button>
            </div>
          </div>
        );
      })}
    </div>
  );
}

            </button>
          </div>
        );
      })}

}

function addMinutes(timeStr, mins){
  if(!timeStr)return"";
  const[h,m]=timeStr.split(":").map(Number);
  const total=h*60+m+mins;
  const nh=Math.floor(total/60)%24;
  const nm=total%60;
  return String(nh).padStart(2,"0")+":"+String(nm).padStart(2,"0");
}

function fmt12(t){
  if(!t)return"";
  const[h,m]=t.split(":").map(Number);
  const ampm=h<12?"AM":"PM";
  const h12=h%12||12;
  return h12+":"+(m<10?"0"+m:m)+" "+ampm;
}

            <div style={{display:"flex",alignItems:"center",gap:0,marginBottom:6}}>
              <div style={{fontWeight:900,fontSize:13,background:"#000",color:"#fff",padding:"5px 12px",borderRadius:"4px 0 0 4px",minWidth:80,textAlign:"center",letterSpacing:.5}}>{fmt12(block.startTime)}</div>
              <div style={{fontWeight:800,fontSize:13,textTransform:"uppercase",letterSpacing:.5,background:"#f0f0f0",padding:"5px 14px",flex:1,borderRadius:"0 4px 4px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span>{block.name}</span>
                <span style={{fontSize:11,color:"#666",fontWeight:600}}>{block.min} min</span>
              </div>
            </div>

            {/* Drill bullet list */}
            {(block.drills||[]).length>0&&<div style={{paddingLeft:16,marginBottom:4}}>
              {(block.drills||[]).map((drill,di)=>(
                <div key={di} style={{marginBottom:5,display:"flex",gap:8,alignItems:"flex-start"}}>
                  <span style={{fontSize:14,lineHeight:"1.2",flexShrink:0,marginTop:1}}>•</span>
                  <div style={{flex:1}}>
                    <span style={{fontWeight:700,fontSize:12}}>{drill.name||"Activity"}</span>
                    {drill.notes&&<span style={{color:"#444",fontSize:11}}> — {drill.notes}</span>}
                    {drill.desc&&<span style={{fontSize:9,color:"#888"}}> †{allFootnotes.findIndex(f=>f.drill===drill.name&&f.block===block.name)+1}</span>}
                  </div>
                </div>
              ))}
            </div>}

            {/* Section note */}
            {block.sectionNote&&<div style={{marginLeft:16,padding:"4px 10px",background:"#fffff0",borderLeft:"2px solid #ccc",fontSize:11,color:"#555",fontStyle:"italic"}}>{block.sectionNote}</div>}
          </div>
        ))}
      </div>

      {/* Footnotes */}
      {allFootnotes.length>0&&<div style={{borderTop:"1px solid #ccc",paddingTop:12,marginTop:8}}>
        <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#666",marginBottom:6,letterSpacing:.5}}>Drill Descriptions</div>
        {allFootnotes.map((f,i)=>(
          <div key={i} style={{display:"flex",gap:6,marginBottom:5,fontSize:10,color:"#555"}}>
            <span style={{fontWeight:700,flexShrink:0}}>†{i+1} {f.drill}:</span>
            <span style={{lineHeight:1.5}}>{f.desc}</span>
          </div>
        ))}
      </div>}

      {/* Footer */}
      <div style={{borderTop:"1px solid #ddd",marginTop:20,paddingTop:8,display:"flex",justifyContent:"space-between",fontSize:9,color:"#aaa"}}>
        <div>DiamondTrack — RA Academies</div>
        <div>{fmt12(startTime)} – {fmt12(endTime)} · {totalMin} min</div>
      </div>
    </div>
  );
}





// ─── CALENDAR ────────────────────────────────────────────────────

const SEASONS={
  Fall:{months:[8,9,10,11],label:"Fall",color:"#e8a020"},
  Spring:{months:[2,3,4,5],label:"Spring",color:"#27c97a"},
  Summer:{months:[6,7],label:"Summer",color:"#3a9be8"},
  Winter:{months:[0,1],label:"Winter",color:"#9b59b6"},
};
const WEEKDAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MONTH_NAMES=["January","February","March","April","May","June","July","August","September","October","November","December"];
const EVENT_TYPES=["Team Practice","ASP","Speed & Agility","Workout","Pitching","Lesson","Rental","Scout","Open","Game"];

function eventColor(type){
  if(!type)return{bg:"rgba(255,255,255,.08)",border:"rgba(255,255,255,.2)",text:"#eef2f8"};
  if(type.includes("ASP"))return{bg:"rgba(58,155,232,.2)",border:"#3a9be8",text:"#3a9be8"};
  if(type.includes("Speed")||type.includes("Agility"))return{bg:"rgba(232,160,32,.2)",border:"#e8a020",text:"#e8a020"};
  if(type.includes("Workout"))return{bg:"rgba(155,89,182,.2)",border:"#9b59b6",text:"#c39bd3"};
  if(type.includes("Pitching"))return{bg:"rgba(232,60,60,.2)",border:"#e84040",text:"#e84040"};
  if(type.includes("Scout"))return{bg:"rgba(39,201,122,.15)",border:"#27c97a",text:"#27c97a"};
  if(type.includes("Lesson"))return{bg:"rgba(232,60,232,.15)",border:"#c93be8",text:"#c93be8"};
  if(type.includes("Rental"))return{bg:"rgba(255,200,0,.12)",border:"#c8a800",text:"#e8c820"};
  if(type.includes("Game"))return{bg:"rgba(232,60,60,.12)",border:"#e84040",text:"#e84040"};
  return{bg:"rgba(255,255,255,.08)",border:"rgba(255,255,255,.2)",text:"#eef2f8"};
}

function getSeason(month){
  for(const[name,s] of Object.entries(SEASONS)){
    if(s.months.includes(month))return{name,...s};
  }
  return{name:"Winter",...SEASONS.Winter};
}

function CalendarPage({calendarEvents=[],setCalendarEvents,facilityTeams=[],profile,isAdmin}){
  const today=new Date();
  const[view,setView]=useState("month"); // day | week | month | season
  const[curDate,setCurDate]=useState(new Date(today.getFullYear(),today.getMonth(),today.getDate()));
  const[showEventForm,setShowEventForm]=useState(false);
  const[editEvent,setEditEvent]=useState(null);
  const[saving,setSaving]=useState(false);

  const blankEvent={
    title:"",event_type:"Team Practice",start_date:curDate.toISOString().slice(0,10),
    end_date:"",start_time:"4:00p",end_time:"5:00p",resources:[],
    assigned_team_ids:[],notes:"",label:"",is_recurring:false,
    recur_days:[],recur_until:"",
  };
  const[form,setForm]=useState(blankEvent);
  const updF=(k,v)=>setForm(p=>({...p,[k]:v}));

  // Get events for a date range
  const eventsForDate=(dateStr)=>calendarEvents.filter(function(e){
    if(e.start_date===dateStr)return true;
    if(e.is_recurring&&e.recur_days&&e.recur_days.length>0){
      const d=new Date(dateStr+"T12:00:00");
      const dayName=WEEKDAYS[d.getDay()];
      if(!e.recur_days.includes(dayName))return false;
      if(e.start_date>dateStr)return false;
      if(e.recur_until&&e.recur_until<dateStr)return false;
      return true;
    }
    return false;
  });

  const eventsForWeek=(startDate)=>{
    const days=[];
    for(let i=0;i<7;i++){
      const d=new Date(startDate);
      d.setDate(d.getDate()+i);
      const ds=d.toISOString().slice(0,10);
      days.push({date:d,dateStr:ds,events:eventsForDate(ds)});
    }
    return days;
  };

  const saveEvent=async()=>{
    if(!form.title.trim()&&!form.label.trim()){alert("Enter a title or label.");return;}
    setSaving(true);
    const payload={
      title:form.label||form.title||form.event_type,
      event_type:form.event_type,start_date:form.start_date,
      end_date:form.end_date||form.start_date,
      start_time:form.start_time,end_time:form.end_time,
      resources:form.resources,assigned_team_ids:form.assigned_team_ids,
      notes:form.notes,label:form.label,
      is_recurring:form.is_recurring,recur_days:form.recur_days,
      recur_until:form.recur_until||null,created_by:profile?.id,
    };
    if(editEvent&&editEvent.id){
      const r=await fetchWithRefresh(`${SURL}/rest/v1/calendar_events?id=eq.${editEvent.id}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify(payload)});
      if(r.ok){const d=await r.json();setCalendarEvents(p=>p.map(e=>e.id===editEvent.id?d[0]:e));}
    } else {
      const r=await fetchWithRefresh(`${SURL}/rest/v1/calendar_events`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify(payload)});
      if(r.ok){const d=await r.json();setCalendarEvents(p=>[...p,d[0]]);}
    }
    setSaving(false);setShowEventForm(false);setEditEvent(null);
  };

  const deleteEvent=async(id)=>{
    if(!window.confirm("Delete this event?"))return;
    await fetchWithRefresh(`${SURL}/rest/v1/calendar_events?id=eq.${id}`,{method:"DELETE",headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    setCalendarEvents(p=>p.filter(e=>e.id!==id));
  };

  const openNew=(dateStr)=>{
    setForm({...blankEvent,start_date:dateStr||curDate.toISOString().slice(0,10)});
    setEditEvent(null);setShowEventForm(true);
  };

  const openEdit=(ev)=>{
    setForm({title:ev.title||"",event_type:ev.event_type||"Team Practice",
      start_date:ev.start_date||"",end_date:ev.end_date||"",
      start_time:ev.start_time||"",end_time:ev.end_time||"",
      resources:ev.resources||[],assigned_team_ids:ev.assigned_team_ids||[],
      notes:ev.notes||"",label:ev.label||"",is_recurring:ev.is_recurring||false,
      recur_days:ev.recur_days||[],recur_until:ev.recur_until||""});
    setEditEvent(ev);setShowEventForm(true);
  };

  const EventChip=({ev,compact})=>{
    const col=eventColor(ev.event_type);
    const teams=(ev.assigned_team_ids||[]).map(function(id){return facilityTeams.find(function(t){return t.id===id;});}).filter(Boolean);
    return(
      <div onClick={function(){openEdit(ev);}} style={{marginBottom:2,padding:compact?"1px 5px":"4px 7px",borderRadius:5,background:col.bg,border:"1px solid "+col.border,cursor:"pointer",overflow:"hidden"}}>
        <div style={{fontWeight:700,fontSize:compact?9:11,color:col.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{ev.is_recurring&&"🔁 "}{ev.label||ev.title}</div>
        {!compact&&ev.start_time&&<div style={{fontSize:9,color:col.text,opacity:.7}}>{ev.start_time}{ev.end_time?"–"+ev.end_time:""}</div>}
        {!compact&&teams.length>0&&<div style={{display:"flex",gap:2,marginTop:1,flexWrap:"wrap"}}>{teams.map(function(t){return(<span key={t.id} style={{fontSize:8,padding:"0 3px",borderRadius:3,background:t.color||"#e8a020",color:"#fff",fontWeight:700}}>{t.name}</span>);})}</div>}
      </div>
    );
  };

  // ── MONTH VIEW ──
  const MonthView=()=>{
    const year=curDate.getFullYear(),month=curDate.getMonth();
    const firstDay=new Date(year,month,1).getDay();
    const daysInMonth=new Date(year,month+1,0).getDate();
    const cells=[];
    for(let i=0;i<firstDay;i++)cells.push(null);
    for(let d=1;d<=daysInMonth;d++)cells.push(d);
    while(cells.length%7!==0)cells.push(null);
    const todayStr=today.toISOString().slice(0,10);
    return(
      <div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <button className="btn bgh bsm" onClick={()=>setCurDate(new Date(year,month-1,1))}>‹</button>
          <div style={{fontWeight:800,fontSize:16}}>{MONTH_NAMES[month]} {year}</div>
          <button className="btn bgh bsm" onClick={()=>setCurDate(new Date(year,month+1,1))}>›</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}}>
          {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(function(d){return(<div key={d} style={{textAlign:"center",fontSize:10,fontWeight:700,color:"#6b82a0",padding:"4px 0"}}>{d}</div>);})}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
          {cells.map(function(day,i){
            if(!day)return(<div key={"e"+i} style={{minHeight:80,borderRadius:6,background:"rgba(255,255,255,.01)"}}/>);
            const ds=`${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
            const evs=eventsForDate(ds);
            const isToday=ds===todayStr;
            const isSel=ds===curDate.toISOString().slice(0,10);
            return(
              <div key={day} onClick={()=>{setCurDate(new Date(ds+"T12:00:00"));}} style={{minHeight:80,borderRadius:6,background:isSel?"rgba(232,160,32,.08)":isToday?"rgba(255,255,255,.05)":"rgba(255,255,255,.02)",border:"1px solid "+(isToday?"rgba(232,160,32,.4)":isSel?"rgba(232,160,32,.2)":"rgba(255,255,255,.06)"),padding:"4px",cursor:"pointer",overflow:"hidden"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                  <span style={{fontSize:11,fontWeight:isToday?800:600,color:isToday?"#e8a020":"#8fa3be",width:20,height:20,borderRadius:"50%",background:isToday?"rgba(232,160,32,.2)":"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>{day}</span>
                  {isAdmin&&<button onClick={function(e){e.stopPropagation();openNew(ds);}} style={{fontSize:10,background:"none",border:"none",color:"#3a4a5e",cursor:"pointer",padding:0,lineHeight:1}}>+</button>}
                </div>
                {evs.slice(0,3).map(function(ev,ei){return(<EventChip key={ev.id+ei} ev={ev} compact={true}/>);})}
                {evs.length>3&&<div style={{fontSize:8,color:"#6b82a0"}}>+{evs.length-3} more</div>}
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  // ── WEEK VIEW ──
  const WeekView=()=>{
    const dow=curDate.getDay();
    const weekStart=new Date(curDate);
    weekStart.setDate(curDate.getDate()-dow);
    const days=eventsForWeek(weekStart);
    const todayStr=today.toISOString().slice(0,10);
    return(
      <div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <button className="btn bgh bsm" onClick={()=>{const d=new Date(curDate);d.setDate(d.getDate()-7);setCurDate(d);}}>‹ Prev</button>
          <div style={{fontWeight:700,fontSize:14}}>{days[0].date.toLocaleDateString("en-US",{month:"short",day:"numeric"})} – {days[6].date.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</div>
          <button className="btn bgh bsm" onClick={()=>{const d=new Date(curDate);d.setDate(d.getDate()+7);setCurDate(d);}}>Next ›</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
          {days.map(function(d){
            const isToday=d.dateStr===todayStr;
            return(
              <div key={d.dateStr} style={{borderRadius:8,background:isToday?"rgba(232,160,32,.06)":"rgba(255,255,255,.02)",border:"1px solid "+(isToday?"rgba(232,160,32,.3)":"rgba(255,255,255,.07)"),padding:6,minHeight:120}}>
                <div style={{fontWeight:700,fontSize:11,color:isToday?"#e8a020":"#8fa3be",marginBottom:6}}>
                  {WEEKDAYS[d.date.getDay()].slice(0,3)} {d.date.getDate()}
                </div>
                {d.events.map(function(ev,i){return(<EventChip key={ev.id+i} ev={ev} compact={false}/>);})}
                {isAdmin&&<button onClick={()=>openNew(d.dateStr)} style={{fontSize:9,color:"#3a4a5e",background:"none",border:"1px solid rgba(255,255,255,.08)",borderRadius:4,padding:"1px 5px",cursor:"pointer",marginTop:4,width:"100%"}}>+ add</button>}
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  // ── DAY VIEW ──
  const DayView=()=>{
    const ds=curDate.toISOString().slice(0,10);
    const evs=eventsForDate(ds);
    const TIMES=["7:00a","7:30a","8:00a","8:30a","9:00a","9:30a","10:00a","10:30a","11:00a","11:30a","12:00p","12:30p","1:00p","1:30p","2:00p","2:30p","3:00p","3:30p","4:00p","4:30p","5:00p","5:30p","6:00p","6:30p","7:00p","7:30p","8:00p","8:30p","9:00p"];
    return(
      <div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <button className="btn bgh bsm" onClick={()=>{const d=new Date(curDate);d.setDate(d.getDate()-1);setCurDate(d);}}>‹</button>
          <div style={{fontWeight:800,fontSize:16}}>{curDate.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</div>
          <button className="btn bgh bsm" onClick={()=>{const d=new Date(curDate);d.setDate(d.getDate()+1);setCurDate(d);}}>›</button>
        </div>
        {evs.length===0&&<div style={{fontSize:13,color:"#6b82a0",textAlign:"center",padding:24}}>Nothing scheduled{isAdmin&&<><br/><button className="btn bg bsm" style={{marginTop:10}} onClick={()=>openNew(ds)}>+ Add Event</button></>}</div>}
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          {evs.sort(function(a,b){return(a.start_time||"").localeCompare(b.start_time||"");}).map(function(ev){
            const col=eventColor(ev.event_type);
            const teams=(ev.assigned_team_ids||[]).map(function(id){return facilityTeams.find(function(t){return t.id===id;});}).filter(Boolean);
            return(
              <div key={ev.id} style={{padding:"12px 16px",borderRadius:10,background:col.bg,border:"1px solid "+col.border,cursor:"pointer"}} onClick={()=>openEdit(ev)}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                  <div>
                    <div style={{fontWeight:800,fontSize:16,color:col.text}}>{ev.label||ev.title}</div>
                    <div style={{fontSize:12,color:col.text,opacity:.7,marginTop:2}}>{ev.event_type}{ev.is_recurring&&" · 🔁 Recurring"}</div>
                    {ev.start_time&&<div style={{fontSize:13,color:col.text,fontWeight:700,marginTop:4}}>{ev.start_time}{ev.end_time?"–"+ev.end_time:""}</div>}
                    {(ev.resources||[]).length>0&&<div style={{fontSize:11,color:col.text,opacity:.7,marginTop:3}}>📍 {ev.resources.join(" · ")}</div>}
                    {teams.length>0&&<div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:6}}>{teams.map(function(t){return(<span key={t.id} style={{fontSize:10,padding:"2px 7px",borderRadius:5,background:t.color||"#e8a020",color:"#fff",fontWeight:700}}>{t.name}</span>);})}</div>}
                    {ev.notes&&<div style={{fontSize:11,color:col.text,opacity:.7,marginTop:6,fontStyle:"italic"}}>{ev.notes}</div>}
                  </div>
                  {isAdmin&&<button onClick={function(e){e.stopPropagation();deleteEvent(ev.id);}} style={{background:"rgba(232,60,60,.1)",border:"1px solid rgba(232,60,60,.2)",borderRadius:5,color:"#e84040",cursor:"pointer",fontSize:11,padding:"3px 8px",flexShrink:0}}>✕</button>}
                </div>
              </div>
            );
          })}
        </div>
        {isAdmin&&evs.length>0&&<button className="btn bg bsm" style={{marginTop:10}} onClick={()=>openNew(ds)}>+ Add to this day</button>}
      </div>
    );
  };

  // ── SEASON VIEW ──
  const SeasonView=()=>{
    const month=curDate.getMonth();
    const season=getSeason(month);
    const year=curDate.getFullYear();
    const monthsToShow=season.months.map(function(m){
      const actualYear=m<6&&season.name==="Spring"?year:m>=8&&season.name==="Fall"?year:year;
      return{month:m,year:actualYear};
    });
    return(
      <div>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14,flexWrap:"wrap"}}>
          <div style={{fontWeight:800,fontSize:18,color:season.color}}>{season.name} {year}</div>
          <div style={{display:"flex",gap:5}}>
            {Object.entries(SEASONS).map(function([name,s]){return(<button key={name} onClick={()=>{const m=s.months[0];setCurDate(new Date(year,m,1));}} style={{padding:"4px 10px",borderRadius:6,border:"1px solid "+(season.name===name?s.color:"rgba(255,255,255,.1)"),background:season.name===name?s.color+"20":"transparent",color:season.name===name?s.color:"#6b82a0",fontSize:11,fontWeight:700,cursor:"pointer"}}>{name}</button>);})}</div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12}}>
          {monthsToShow.map(function(mn){
            const firstDay=new Date(mn.year,mn.month,1).getDay();
            const daysInMonth=new Date(mn.year,mn.month+1,0).getDate();
            const cells=[];
            for(let i=0;i<firstDay;i++)cells.push(null);
            for(let d=1;d<=daysInMonth;d++)cells.push(d);
            return(
              <div key={mn.month} style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.08)",borderRadius:10,padding:12}}>
                <div style={{fontWeight:700,fontSize:13,color:season.color,marginBottom:8}}>{MONTH_NAMES[mn.month]}</div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:1,marginBottom:4}}>
                  {["S","M","T","W","T","F","S"].map(function(d,i){return(<div key={i} style={{textAlign:"center",fontSize:8,color:"#6b82a0"}}>{d}</div>);})}
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:1}}>
                  {cells.map(function(day,i){
                    if(!day)return(<div key={"e"+i} style={{minHeight:24}}/>);
                    const ds=`${mn.year}-${String(mn.month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
                    const evs=eventsForDate(ds);
                    const isToday=ds===today.toISOString().slice(0,10);
                    return(
                      <div key={day} onClick={()=>{setCurDate(new Date(ds+"T12:00:00"));setView("day");}} title={evs.map(function(e){return e.label||e.title;}).join(", ")} style={{minHeight:24,borderRadius:3,background:evs.length>0?season.color+"20":isToday?"rgba(232,160,32,.15)":"transparent",border:"1px solid "+(isToday?"rgba(232,160,32,.4)":evs.length>0?season.color+"40":"transparent"),cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-start",padding:"1px"}}>
                        <span style={{fontSize:8,color:isToday?"#e8a020":evs.length>0?season.color:"#6b82a0",fontWeight:evs.length>0?700:400}}>{day}</span>
                        {evs.length>0&&<div style={{width:4,height:4,borderRadius:"50%",background:season.color,marginTop:1}}/>}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  };

  const tabStyle=(v)=>({padding:"7px 14px",border:"none",background:"transparent",fontSize:12,fontWeight:view===v?700:400,color:view===v?"#e8a020":"#6b82a0",borderBottom:view===v?"2px solid #e8a020":"2px solid transparent",cursor:"pointer"});

  return(<>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:8}}>
      <div style={{fontWeight:800,fontSize:20}}>📅 Calendar</div>

            </div>

              return(<button key={t.id} onClick={()=>updF("assigned_team_ids",on?(form.assigned_team_ids||[]).filter(function(x){return x!==t.id;}):[...(form.assigned_team_ids||[]),t.id])} style={{display:"flex",alignItems:"center",gap:4,padding:"3px 9px",borderRadius:6,border:"1px solid "+(on?t.color||"#e8a020":"rgba(255,255,255,.1)"),background:on?(t.color||"#e8a020")+"20":"transparent",color:on?t.color||"#e8a020":"#6b82a0",fontSize:11,fontWeight:on?700:400,cursor:"pointer"}}><div style={{width:8,height:8,borderRadius:"50%",background:t.color||"#e8a020",flexShrink:0}}/>{on&&"✓ "}{t.name}</button>);
