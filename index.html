const sb={
  h(x={}){return{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok||SKEY}`,...x};},
  from(t){
    const base=`${SURL}/rest/v1/${t}`;let _q=[];let _ms=false;
    const q={
      select(c="*"){_q.push(`select=${c}`);return q;},
      eq(c,v){_q.push(`${c}=eq.${v}`);return q;},
      order(c,{ascending:a=true}={}){_q.push(`order=${c}.${a?"asc":"desc"}`);return q;},
      limit(n){_q.push(`limit=${n}`);return q;},
      maybeSingle(){_ms=true;return q;},
      single(){_ms=true;return q;},
      async then(res){
        const qs=_q.length?"?"+_q.join("&"):"";
        const h=sb.h(_ms?{"Accept":"application/vnd.pgrst.object+json"}:{});
        const r=await fetch(base+qs,{headers:h}).catch(e=>({ok:false,status:500,json:()=>({message:e.message})}));
        if(!r.ok&&r.status!==406){const e=await r.json().catch(()=>({}));return res({data:null,error:e});}
        if(_ms&&r.status===406)return res({data:null,error:null});
        const data=await r.json().catch(()=>null);
        return res({data,error:null});
      },
      async insert(rows){
        const body=Array.isArray(rows)?rows:[rows];
        const r=await fetch(base,{method:"POST",headers:sb.h({"Prefer":"return=representation"}),body:JSON.stringify(body)});
        if(!r.ok){const e=await r.json().catch(()=>({message:r.statusText}));return{data:null,error:e};}
        const data=await r.json().catch(()=>null);
        return{data:Array.isArray(data)&&!Array.isArray(rows)?data[0]:data,error:null};
      },
      async upsert(rows,{onConflict}={}){
        const body=Array.isArray(rows)?rows:[rows];
        const qs=onConflict?`?on_conflict=${onConflict}`:"";
        const r=await fetch(base+qs,{method:"POST",headers:sb.h({"Prefer":"return=representation,resolution=merge-duplicates"}),body:JSON.stringify(body)});
        if(!r.ok){const e=await r.json().catch(()=>({}));return{data:null,error:e};}
        const data=await r.json().catch(()=>null);
        return{data,error:null};
      },
      async update(updates){
        const qs=_q.length?"?"+_q.join("&"):"";
        const r=await fetch(base+qs,{method:"PATCH",headers:sb.h({"Prefer":"return=representation"}),body:JSON.stringify(updates)});
        if(!r.ok){const e=await r.json().catch(()=>({}));return{data:null,error:e};}
        const data=await r.json().catch(()=>null);
        return{data,error:null};
      }
    };
    return q;
  },
  auth:{
    async refreshToken(){
      try{
        const s=localStorage.getItem("dt");
        if(!s)return false;
        const d=JSON.parse(s);
        if(!d.refresh_token)return false;
        const r=await fetch(`${SURL}/auth/v1/token?grant_type=refresh_token`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY},body:JSON.stringify({refresh_token:d.refresh_token})});
        if(!r.ok)return false;
        const nd=await r.json();
        _tok=nd.access_token;
        try{localStorage.setItem("dt",JSON.stringify(nd));}catch(e){}
        return true;
      }catch(e){return false;}
    },
    async signUp(email,password){
      const redirectTo=encodeURIComponent(window.location.origin+window.location.pathname);
      const r=await fetch(`${SURL}/auth/v1/signup?redirect_to=${redirectTo}`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY},body:JSON.stringify({email,password})});
      const d=await r.json();
      if(!r.ok)return{data:null,error:d};
      if(d.access_token){_tok=d.access_token;try{localStorage.setItem("dt",JSON.stringify(d));}catch(e){}}
      return{data:{user:d.user||(d.id?d:null),session:d.access_token?d:null},error:null};
    },
    async signIn(email,password){
      const r=await fetch(`${SURL}/auth/v1/token?grant_type=password`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY},body:JSON.stringify({email,password})});
      const d=await r.json();
      if(!r.ok)return{data:null,error:d};
      _tok=d.access_token;
      try{localStorage.setItem("dt",JSON.stringify(d));}catch(e){}
      return{data:{user:d.user},error:null};
    },
    async signOut(){_tok=null;try{localStorage.removeItem("dt");}catch(e){}},
    stored(){
      try{const s=localStorage.getItem("dt");if(s){const d=JSON.parse(s);if(d.expires_at&&Date.now()/1000<d.expires_at){_tok=d.access_token;return d;}}}catch(e){}
      return null;
    }
  }
};

// Auto-refresh fetch - retries once if JWT expired
const fetchWithRefresh=async(url,opts={})=>{
  let r=await fetch(url,opts);
  if(r.status===401){
    const refreshed=await sb.auth.refreshToken();
    if(refreshed){
      // Update auth header with new token
      const newOpts={...opts,headers:{...opts.headers,"Authorization":`Bearer ${_tok}`}};
      r=await fetch(url,newOpts);
    } else {
      // Can't refresh - clear session and reload page
      try{localStorage.removeItem("dt");}catch(e){}
      alert("Your session expired. Please sign in again.");
      window.location.reload();
      return r;
    }
  }
  return r;
};

0,wt:"Baseball"},{id:"l28",desc:"Hold a light dumbbell with the arm extended, palm facing down. Slowly flex and extend the wrist through a full range of motion. Strengthens the wrist flexors and extensors that absorb stress at ball release. Critical for elbow health especially in young pitchers.",cat:"Arm Care",name:"Wrist Flexion/Extension",sets:3,reps:15,wt:"2 lbs"},{id:"l29",desc:"Lie on your back with the throwing arm out to the side, elbow bent at 90 degrees, upper arm flat on the ground. Let gravity and a gentle assist from the other hand stretch the forearm toward the floor. Targets posterior shoulder capsule tightness from years of throwing.",cat:"Arm Care",name:"90/90 Shoulder Stretch",sets:3,reps:30,wt:"Bodyweight"},
  // PITCHING
  {id:"p1",desc:"Pitching mechanics work performed on flat ground rather than a mound. Removes the downhill slope variable so the pitcher can focus on arm path, hip-shoulder separation, and finish. Used for warmup, command work, and mechanical fixes without the stress of elevated pitching.",cat:"Pitching",name:"Flat Ground Bullpen",sets:1,reps:30,wt:"Baseball"},{id:"p2",desc:"Full pitching effort from the game mound. Used to build command, develop secondary pitches, and simulate game conditions. Parents: mound bullpens are planned and supervised - pitch counts are monitored to protect arm health.",cat:"Pitching",name:"Mound Bullpen",sets:1,reps:25,wt:"Baseball"},{id:"p3",desc:"Work on gripping and throwing the 2-seam fastball, which moves arm-side late in the zone. Focus on finger pressure, seam placement, and release point consistency. A well-developed 2-seam is one of the most effective weapons at every level of baseball.",cat:"Pitching",name:"2-Seam Fastball Work",sets:3,reps:10,wt:"Baseball"},{id:"p4",desc:"Practice the changeup grip and develop the feel of throwing it with fastball arm speed. The key is same arm action, different speed. Reps at half or three-quarter effort help build the feel without stress on the arm.",cat:"Pitching",name:"Changeup Grip Drill",sets:3,reps:10,wt:"Baseball"},{id:"p5",desc:"Focused reps on spinning the curveball with proper wrist and finger action. Emphasis on throwing over the top of the ball rather than pulling down. Developing consistent shape and location on a breaking ball is one of the biggest separators at the next level.",cat:"Pitching",name:"Curveball Shape Work",sets:3,reps:10,wt:"Baseball"},{id:"p6",desc:"Practice first-base and third-base pick-off moves, both from the windup and the stretch. Develop a consistent, deceptive move within the rules. Good pick-off timing can neutralize a basestealing threat without throwing a single pitch to the base.",cat:"Pitching",name:"Pick-Off Move Practice",sets:3,reps:10,wt:"Baseball"},{id:"p7",desc:"Work on the full windup delivery - leg lift, balance point, hip rotation, arm path, and follow-through. Pitchers should be able to repeat the same delivery pitch to pitch. Video from the side is extremely helpful for identifying inconsistencies.",cat:"Pitching",name:"Windup Mechanics Drill",sets:3,reps:10,wt:"Baseball"},{id:"p8",desc:"Practice the stretch delivery, used with runners on base. Athletes develop a consistent rhythm that holds runners while maintaining command. The stretch requires the same hip-shoulder separation and arm path as the windup.",cat:"Pitching",name:"Stretch Mechanics Drill",sets:3,reps:10,wt:"Baseball"},{id:"p9",desc:"A core pitching mechanic drill. The pitcher separates the hips toward home plate before the shoulders begin to rotate, creating a rubber-band effect that generates velocity. This is the engine of a good delivery.",cat:"Pitching",name:"Hip to Shoulder Separation Drill",sets:3,reps:10,wt:"Bodyweight"},{id:"p10",desc:"Work on holding a balanced, controlled position at the top of the leg lift before moving toward the plate. Pitchers who rush past their balance point lose hip drive and arm slot consistency. This drill builds the habit of patient, controlled movement.",cat:"Pitching",name:"Balance Point Drill",sets:3,reps:15,wt:"Bodyweight"},{id:"p11",desc:"A velocity training method where the pitcher throws at maximum effort over a decreasing distance, finishing from short range. Reinforces arm speed and proper deceleration mechanics. Should only be done with proper supervision and recovery protocols.",cat:"Pitching",name:"Drive Line Pull-Down",sets:4,reps:8,wt:"Baseball"},{id:"p12",desc:"Alternate throws using baseballs lighter and heavier than regulation. The contrast develops arm speed and strengthens connective tissue. Should only be used as part of a structured program - best guided by a coach.",cat:"Pitching",name:"Weighted Ball Throws",sets:4,reps:10,wt:"4oz ball"},{id:"p13",desc:"A progressive throwing program where the athlete gradually extends the distance of throws until reaching maximum comfortable distance, then works back in. Builds arm strength and prepares the arm for high-intensity pitching efforts.",cat:"Pitching",name:"Long Toss",sets:1,reps:30,wt:"Baseball"},{id:"p14",desc:"After releasing a pitch, the pitcher practices getting off the mound quickly and into a good fielding position. A pitcher who can field their position is a defensive asset and reduces errors.",cat:"Pitching",name:"Fielding Position Drill",sets:3,reps:10,wt:"Baseball"},{id:"p15",desc:"Practice a shortened leg lift (slide step) used to reduce delivery time to the plate with runners on base. An effective slide step can take half a second off pop time to help catchers shut down the running game.",cat:"Pitching",name:"Slide Step Practice",sets:3,reps:10,wt:"Baseball"},
  // HITTING
  {id:"h1",desc:"Place the tee on the inner third of the plate and work on driving inside pitches to the pull side. Focus on getting the hands through quickly, contacting the ball slightly in front of the plate. Inside pitch approach separates hitters who can handle velocity at the top level.",cat:"Hitting",name:"Tee Work - Inside Pitch",sets:3,reps:10,wt:"Baseball"},{id:"h2",desc:"Set the tee on the outer third and work on letting the ball travel deeper, driving it to the opposite field. Hips stay closed longer, contact point is deeper in the zone. Opposite field discipline is a sign of a mature, complete hitter.",cat:"Hitting",name:"Tee Work - Outside Pitch",sets:3,reps:10,wt:"Baseball"},{id:"h3",desc:"Middle of the plate tee work - the most common pitch location. Drive the ball back up the middle with a direct hand path. Parents: tee work at every level builds the muscle memory that shows up in games.",cat:"Hitting",name:"Tee Work - Middle",sets:3,reps:10,wt:"Baseball"},{id:"h4",desc:"A partner tosses a ball underhand from the side at a 45-degree angle. Removes the timing variable of a full pitch so the hitter can work on swing mechanics in a controlled environment.",cat:"Hitting",name:"Soft Toss",sets:3,reps:10,wt:"Baseball"},{id:"h5",desc:"Live batting practice from a pitcher or pitching machine at game speed. Hitters work on timing, approach, and competing against movement. This is the closest practice simulation to game conditions.",cat:"Hitting",name:"Batting Practice - Live",sets:1,reps:25,wt:"Baseball"},{id:"h6",desc:"Tee-based batting practice for high-volume swing repetitions at different heights and locations. More efficient than live BP for pure mechanics work - athletes can get 60+ swings in the time it takes for 15 live pitches.",cat:"Hitting",name:"Batting Practice - Tee",sets:4,reps:15,wt:"Baseball"},{id:"h7",desc:"Take swings with only the top or bottom hand on the bat. Top hand: reinforces staying connected. Bottom hand: forces the hitter to drive through contact with the lead arm. Both versions isolate weaknesses that two-handed swings can hide.",cat:"Hitting",name:"One-Hand Drill",sets:3,reps:10,wt:"Bat"},{id:"h8",desc:"Stand with feet set, hold the barrel on the shoulder, and practice firing the hips aggressively before the hands move. Hip rotation is the engine of bat speed - this drill isolates and trains it.",cat:"Hitting",name:"Hip Rotation Drill",sets:3,reps:10,wt:"Bat"},{id:"h9",desc:"Practice the load (weight shift to back side) and controlled stride (front foot landing softly). A quiet, controlled stride is the difference between being on time and being early or late.",cat:"Hitting",name:"Load & Stride Drill",sets:3,reps:10,wt:"Bat"},{id:"h10",desc:"Set the tee at the ideal contact point for different pitch locations. The hitter freezes at contact to check hand position, extension, and balance. Awareness of contact position is essential for consistent hard contact.",cat:"Hitting",name:"Contact Point Drill",sets:3,reps:10,wt:"Bat"},{id:"h11",desc:"A coach or machine mixes fastballs and offspeed pitches while the hitter works on identifying the pitch early and adjusting. Pitch recognition is a skill that separates hitters at every level above youth baseball.",cat:"Hitting",name:"Pitch Recognition - Fastball/Offspeed",sets:3,reps:10,wt:"Baseball"},{id:"h12",desc:"With two strikes, hitters widen their zone slightly and shorten their swing to protect the plate. Work on making contact with breaking balls and driving pitches the other way. A good two-strike approach keeps an at-bat alive.",cat:"Hitting",name:"Two-Strike Approach Drill",sets:3,reps:10,wt:"Baseball"},{id:"h13",desc:"All tee, soft toss, or batting practice reps are directed to the opposite field. Forces the hitter to stay back, let the ball travel, and use the whole field. Opposite field power becomes more valuable as pitchers learn to work away.",cat:"Hitting",name:"Opposite Field Work",sets:3,reps:10,wt:"Baseball"},{id:"h14",desc:"Set up the tee on the inner half and focus on turning on pitches for pull-side power. Contact point is out in front, hips clear aggressively, hands stay inside.",cat:"Hitting",name:"Pull Side Power Drill",sets:3,reps:10,wt:"Baseball"},{id:"h15",desc:"Practice squaring and laying down a sacrifice bunt to move a runner. Hitter pivots to face the pitcher, catches the ball on the barrel, and lets it die in fair territory. The sacrifice bunt is a situational tool that can change a close game.",cat:"Hitting",name:"Bunting - Sacrifice",sets:3,reps:5,wt:"Baseball"},{id:"h16",desc:"Work on drag bunting or push bunting to reach base. More deceptive than the sacrifice - the hitter waits longer before showing bunt. A well-executed bunt for hit is one of the hardest plays to defend in baseball.",cat:"Hitting",name:"Bunting - Bunt for Hit",sets:3,reps:5,wt:"Baseball"},{id:"h17",desc:"Stand athletic with a med ball at hip height. Rotate explosively and slam the ball into the ground or a wall. Develops rotational power, hip-to-shoulder sequencing, and core explosion - the same muscle system used in the swing.",cat:"Hitting",name:"Rotational Med Ball Slam",sets:3,reps:8,wt:"12 lbs"},{id:"h18",desc:"Using a cable machine, perform a rotational pulling motion that mirrors the swing pattern. More sport-specific than most gym exercises because it trains the hips, core, and shoulders in the exact direction of a baseball swing.",cat:"Hitting",name:"Cable Rotations",sets:3,reps:12,wt:"40 lbs"},
  // DEFENSE - INFIELD
  {id:"d1",desc:"Coach or partner rolls or hits ground balls at varying speeds and angles. Athlete works on approach, fielding position (athletic stance, soft hands, fielding out front), and clean transfer to throwing hand. High-rep ground ball work builds the field-and-throw rhythm that becomes automatic in games.",cat:"Defense - Infield",name:"Ground Ball Reps",sets:4,reps:10,wt:"Baseball"},{id:"d2",desc:"Work on charging balls that die in front of the infielder. Field the ball with bare hand or glove, attack with momentum, and make a strong off-balance throw. The slow roller is one of the most error-prone plays in baseball - it must be practiced.",cat:"Defense - Infield",name:"Slow Roller Drill",sets:3,reps:8,wt:"Baseball"},{id:"d3",desc:"Ground balls hit to the glove-side past the fielder. The fielder must extend across the body and make a strong throw from an off-balance position. Backhand range is a defining characteristic of advanced infield defense.",cat:"Defense - Infield",name:"Backhand Drill",sets:3,reps:8,wt:"Baseball"},{id:"d4",desc:"Ground balls hit to the throwing-side, requiring the fielder to move laterally, set, and throw. Forehand range helps infielders close off the gap and protect against base hits.",cat:"Defense - Infield",name:"Forehand Drill",sets:3,reps:8,wt:"Baseball"},{id:"d5",desc:"Partner throws or bounces short hops at the fielder's feet - the worst-case ground ball scenario. Athlete learns to stay down through the hop and absorb it with soft hands. Handling short hops consistently separates reliable infielders from error-prone ones.",cat:"Defense - Infield",name:"Short Hop Drill",sets:3,reps:10,wt:"Baseball"},{id:"d6",desc:"Second baseman practices receiving a throw from the shortstop, tagging the bag, and releasing to first to complete the double play. Footwork at the bag and a quick compact release are the keys.",cat:"Defense - Infield",name:"Double Play Feed - 4-6-3",sets:3,reps:8,wt:"Baseball"},{id:"d7",desc:"Shortstop practices receiving from the second baseman and turning the double play. The shortstop must field, step across the bag, and make a strong throw to first - often against an incoming baserunner.",cat:"Defense - Infield",name:"Double Play Feed - 6-4-3",sets:3,reps:8,wt:"Baseball"},{id:"d8",desc:"First baseman practices stretching to receive throws - balls to the right, left, short hops, and high throws - while keeping the foot on the bag. Good footwork allows the first baseman to save extra-base errors.",cat:"Defense - Infield",name:"First Base Footwork",sets:3,reps:10,wt:"Baseball"},{id:"d9",desc:"Coach hits balls alternately left and right, pushing the infielder to cover ground in both directions. Works first-step quickness, lateral speed, and the ability to field on the run.",cat:"Defense - Infield",name:"Range Left/Right Drill",sets:3,reps:8,wt:"Baseball"},{id:"d10",desc:"After fielding a ground ball or on a long throw, practice the crow hop - a small skip step that transfers momentum into the throw. The crow hop allows a fielder to generate velocity and accuracy on longer throws.",cat:"Defense - Infield",name:"Crow Hop Throw",sets:3,reps:10,wt:"Baseball"},{id:"d11",desc:"Partner rolls slow rollers and the fielder fields them with bare hand only. Forces the athlete to soften their hands, field the ball cleanly, and trust the fundamentals. The bare hand drill exposes grip problems and timing issues.",cat:"Defense - Infield",name:"Bare Hand Drill",sets:3,reps:10,wt:"Baseball"},{id:"d12",desc:"Work on starting position - weight forward, knees bent, glove low, eyes up - and explosive first step in all four directions. The first step is the most important part of any defensive play.",cat:"Defense - Infield",name:"Ready Position & First Step",sets:3,reps:10,wt:"Bodyweight"},
  // DEFENSE - OUTFIELD
  {id:"o1",desc:"Coach fungo-hits fly balls to work on initial read off the bat - judging distance and direction immediately. The outfielder breaks on the ball before it reaches its peak. Good reads eliminate wasted steps and allow outfielders to cover more ground.",cat:"Defense - Outfield",name:"Fly Ball Reads",sets:3,reps:8,wt:"Baseball"},{id:"o2",desc:"On balls hit directly over the head, the outfielder opens the hips and sprints back at a 45-degree angle rather than backpedaling. The drop step is faster and puts the athlete in position to track the ball over the shoulder.",cat:"Defense - Outfield",name:"Drop Step Drill",sets:3,reps:8,wt:"Baseball"},{id:"o3",desc:"On balls hit to the side, the outfielder takes a crossover step to create immediate lateral momentum. Faster than a shuffle step, the crossover gets the athlete to full speed in two steps.",cat:"Defense - Outfield",name:"Crossover Step Drill",sets:3,reps:8,wt:"Baseball"},{id:"o4",desc:"After fielding or catching a ball, outfielder executes the crow hop before releasing a strong throw to the cutoff man or base. Outfield crow hops create velocity and accuracy on long throws and prevent arm injuries.",cat:"Defense - Outfield",name:"Crow Hop & Throw",sets:3,reps:10,wt:"Baseball"},{id:"o5",desc:"On a ball hit in front of the outfielder with a runner on third, the fielder charges hard and throws immediately without a crow hop. Proper footwork and a quick release can save a run in a close game.",cat:"Defense - Outfield",name:"Do-or-Die Throw",sets:3,reps:8,wt:"Baseball"},{id:"o6",desc:"Two outfielders work on calling each other off and communicating on balls between them. Establish loud, decisive communication. Poor communication on fly balls leads to collisions and easy outs turning into extra bases.",cat:"Defense - Outfield",name:"Communication Drill",sets:3,reps:8,wt:"Baseball"},{id:"o7",desc:"Coach hits hard-hit line drives at varying heights. Outfielder works on reading whether the ball is sinking or rising before committing. The biggest mistake on line drives is breaking in too quickly on a ball that carries over the head.",cat:"Defense - Outfield",name:"Line Drive Drill",sets:3,reps:8,wt:"Baseball"},{id:"o8",desc:"Outfielder practices reading the warning track and the wall - understanding how deep they are without looking back. Allows athletes to play the ball confidently near the fence without injury risk.",cat:"Defense - Outfield",name:"Fence Read Drill",sets:3,reps:6,wt:"Baseball"},{id:"o9",desc:"Outfielder catches or fields the ball and works on hitting the cutoff man with an accurate two-hop throw. Outfield arms are only as good as the relay chain - hitting the cutoff keeps runners from advancing.",cat:"Defense - Outfield",name:"Relay Throw Drill",sets:3,reps:8,wt:"Baseball"},
  // CATCHING
  {id:"c1",desc:"Coach throws pitches directly in front of the catcher who drops to the knees and blocks with the chest protector. Ball must stay in front. Parents: this skill directly prevents passed balls and wild pitches from scoring runs.",cat:"Catching",name:"Blocking Drill - Straight",sets:3,reps:10,wt:"Baseball"},{id:"c2",desc:"Coach throws pitches to the left and right of the catcher, forcing the athlete to drop and angle the body to redirect the ball toward the mound. Lateral blocking separates average catchers from elite ones.",cat:"Catching",name:"Blocking Drill - Left/Right",sets:3,reps:10,wt:"Baseball"},{id:"c3",desc:"Catcher practices receiving borderline pitches and presenting them to the umpire with a subtle controlled glove turn rather than a stab. Good framing keeps called strikes on the corners. This skill alone can change a game.",cat:"Catching",name:"Framing Drill",sets:3,reps:15,wt:"Baseball"},{id:"c4",desc:"Timed throw from receiving position to second base. Catcher focuses on a quick transfer, footwork, and arm path. Elite pop times are under 1.9 seconds at the high school level. Reps build muscle memory to execute under pressure.",cat:"Catching",name:"Pop Time - Throw to 2B",sets:5,reps:1,wt:"Baseball"},{id:"c5",desc:"Timed throw to third base - shorter distance but tighter angle. Requires quick footwork and accuracy. Effective throws to third keep runners honest on steal attempts and pick-offs.",cat:"Catching",name:"Pop Time - Throw to 3B",sets:5,reps:1,wt:"Baseball"},{id:"c6",desc:"Work on receiving pitches in the lower third of the zone without scooping or dropping the glove. Low pitch receiving is the most common area where catchers give away called strikes.",cat:"Catching",name:"Receiving - Low Pitch",sets:3,reps:10,wt:"Baseball"},{id:"c7",desc:"Receive pitches at the top of the zone and above. High framing is about stopping the glove, not stabbing up. Balls above the belt presented well can surprise umpires and expand the zone.",cat:"Catching",name:"Receiving - High Pitch",sets:3,reps:10,wt:"Baseball"},{id:"c8",desc:"Practice the full sequence of a stolen base - receiving the pitch, transfer, footwork, and throw. Catchers who consistently execute this sequence shut down the running game before it starts.",cat:"Catching",name:"Stolen Base Defense",sets:3,reps:8,wt:"Baseball"},{id:"c9",desc:"Coach pops balls in the air near the backstop and dugout areas. Catcher rips off the mask, locates the ball, and makes the catch. An elite catcher turns these into outs that other catchers miss.",cat:"Catching",name:"Foul Ball Drill",sets:3,reps:8,wt:"Baseball"},{id:"c10",desc:"Catcher calls pitches based on a simulated game situation - count, batter tendencies, and pitcher strengths. A catcher who can call a game is a coach on the field - this is one of the most undervalued skills at the youth level.",cat:"Catching",name:"Pitch Calling Simulation",sets:1,reps:15,wt:"Baseball"},
  // BASERUNNING
  {id:"b1",desc:"Timed full sprint of 60 yards - the standard measurement for evaluating speed in baseball recruiting. Parents: the 60 is the primary speed metric scouts and college coaches use.",cat:"Baserunning",name:"60-Yard Dash",sets:4,reps:1,wt:"Bodyweight"},{id:"b2",desc:"Work on the initial push from a static or secondary lead position. First step quickness is more important than top-end speed in most baseball plays - the difference between safe and out is often in the first three steps.",cat:"Baserunning",name:"First Step Quickness",sets:4,reps:5,wt:"Bodyweight"},{id:"b3",desc:"Practice taking a primary lead and secondary lead. Learn to read the pitcher's movements and return to base quickly. A disciplined lead maximizes baserunning advantage without getting picked off.",cat:"Baserunning",name:"Lead Off Drill",sets:3,reps:8,wt:"Bodyweight"},{id:"b4",desc:"Standing on base, read the flight of the ball off the bat and react immediately. Good jump reads turn singles into doubles and doubles into triples - they must be practiced in a controlled environment.",cat:"Baserunning",name:"Jump Read Drill",sets:3,reps:8,wt:"Bodyweight"},{id:"b5",desc:"Practice running the bases at full speed - first to third on a single, home-to-first hustle, scoring from second on a base hit. Work on aggressive, efficient rounding at each bag. Lazy routes cost teams runs every game.",cat:"Baserunning",name:"Rounding Bases Drill",sets:3,reps:2,wt:"Bodyweight"},{id:"b6",desc:"Practice the feet-first slide and the pop-up slide for beating tags. Focus on reading when to slide versus stay up, and committing fully - hesitation causes injury.",cat:"Baserunning",name:"Sliding Technique",sets:3,reps:5,wt:"Bodyweight"},{id:"b7",desc:"Full steal of second base - primary lead, secondary lead, first-step timing off the pitcher, and slide. Combine reading the pitcher with explosive first step and clean footwork. Stolen bases change game momentum.",cat:"Baserunning",name:"Steal of Second",sets:4,reps:3,wt:"Bodyweight"},{id:"b8",desc:"On a fly ball with fewer than two outs, runner returns to base and times the tag-up to leave the moment the ball is caught. An extra base on a tag-up is entirely about preparation and timing.",cat:"Baserunning",name:"Tag-Up Drill",sets:3,reps:5,wt:"Bodyweight"},
  // VELOCITY / ARM STRENGTH
  {id:"v1",desc:"Stand with feet set and drive a med ball into a wall or rebounder using full hip-shoulder rotation. Develops explosive rotational power that transfers directly to throwing velocity. The med ball forces the lower half and core to generate the force.",cat:"Velocity",name:"Med Ball Rotational Throw",sets:4,reps:10,wt:"8 lbs"},{id:"v2",desc:"Start at the release point of a throw and work backward through the arm path. Also used as a wall drill where the athlete stands close and finishes the throw against a wall. Reinforces arm path and rear-arm engagement.",cat:"Velocity",name:"Reverse Throw",sets:3,reps:8,wt:"Baseball"},{id:"v3",desc:"After a long toss session, pull the distance back in rapidly - starting from max distance and throwing at near-maximum intensity at progressively shorter intervals. Trains the arm to handle high-intensity loads.",cat:"Velocity",name:"Pull-Down Throws",sets:4,reps:6,wt:"Baseball"},{id:"v4",desc:"Use PlyoCare or weighted balls for constraint-based throwing drills. Forces the arm into efficient patterns. Must be used as part of a structured program.",cat:"Velocity",name:"Plyocare Ball Drills",sets:3,reps:10,wt:"Plyocare"},{id:"v5",desc:"Progressive long toss at maximum distance - work out to 250-300 feet at full effort. Develop arm strength and the feel of generating maximum velocity. Long toss is one of the most time-tested arm development tools available.",cat:"Velocity",name:"Max Effort Long Toss",sets:1,reps:20,wt:"Baseball"},
  // STRENGTH
  {id:"s1",desc:"A hip-hinge movement using a hexagonal barbell. More joint-friendly than the straight bar deadlift. Develops total posterior chain strength - glutes, hamstrings, and spinal erectors - which drives explosive movement in throwing, hitting, and sprinting.",cat:"Strength",name:"Hex Bar Deadlift",sets:4,reps:5,wt:"185 lbs"},{id:"s2",desc:"A barbell squat with the bar on the upper back. Develops quad, glute, and hamstring strength through a full range of motion. One of the foundational lower body strength exercises for baseball athletes.",cat:"Strength",name:"Back Squat",sets:4,reps:6,wt:"165 lbs"},{id:"s3",desc:"With a barbell or band across the hips, drive the hips toward the ceiling from a bench-supported position. One of the most effective glute-strengthening exercises. Strong glutes are the primary power generator for pitching, hitting, and sprinting.",cat:"Strength",name:"Hip Thrust",sets:3,reps:10,wt:"205 lbs"},{id:"s4",desc:"Explosive jump onto a box from a standing position. Develops lower body power and fast-twitch recruitment. Box jumps train the same explosive hip extension used in every athletic baseball movement.",cat:"Strength",name:"Box Jumps",sets:4,reps:6,wt:"Bodyweight"},{id:"s5",desc:"A partner-assisted eccentric hamstring strengthening exercise. The athlete slowly lowers from a kneeling position while a partner holds the ankles. One of the most evidence-based exercises for reducing hamstring injury risk in athletes.",cat:"Strength",name:"Nordic Hamstring Curl",sets:3,reps:6,wt:"Bodyweight"},{id:"s6",desc:"Pull the barbell from the hang position and explosively extend the hips, shrug, and pull the bar to the rack position. Develops explosive power through the entire posterior chain. The hang clean is one of the most athletically transferable power exercises in baseball training.",cat:"Strength",name:"Hang Clean",sets:4,reps:4,wt:"115 lbs"},{id:"s7",desc:"Full-range pull-ups from a dead hang. Develops lat strength, shoulder stability, and upper body pulling power. Lats are a primary decelerator of the arm and a major contributor to pitching velocity.",cat:"Strength",name:"Pull-Ups",sets:4,reps:8,wt:"Bodyweight"},{id:"s8",desc:"Using a cable machine, pull the handles from in front of the face directly back toward the ears. Targets rear deltoids and external rotators - the muscles that protect and decelerate the shoulder after every throw.",cat:"Strength",name:"Cable Face Pulls",sets:3,reps:15,wt:"30 lbs"},{id:"s9",desc:"Stand on one leg and hinge forward at the hip, lowering a dumbbell toward the ground while extending the free leg behind. Develops single-leg hamstring strength, balance, and hip stability.",cat:"Strength",name:"Single Leg RDL",sets:3,reps:8,wt:"40 lbs"},{id:"s10",desc:"A rear-foot-elevated split squat with a dumbbell in each hand. Develops single-leg quad and glute strength while challenging hip mobility and balance. Identifies and corrects left-right strength imbalances.",cat:"Strength",name:"Split Squat",sets:3,reps:8,wt:"60 lbs"},
  // SPEED / AGILITY
  {id:"sp1",desc:"Sprint with a sled or resistance band attached at the waist. The added resistance forces greater hip drive and shin angle, developing acceleration mechanics. When removed, the neurological pattern carries over as increased unresisted sprint speed.",cat:"Speed & Agility",name:"Resisted Sprints",sets:5,reps:1,wt:"Sled 20 lbs"},{id:"sp2",desc:"A timed shuttle drill - start at center cone, sprint to the right cone, touch and sprint left past center to the far left cone, then back to center. Combines change of direction, lateral quickness, and explosive starts.",cat:"Speed & Agility",name:"5-10-5 Pro Agility",sets:4,reps:1,wt:"Bodyweight"},{id:"sp3",desc:"Rapid side-to-side shuffle between cones, staying low and keeping the feet quick. Trains the lateral hip and glute muscles responsible for fielding range.",cat:"Speed & Agility",name:"Lateral Shuffle Drill",sets:4,reps:1,wt:"Bodyweight"},{id:"sp4",desc:"A multi-directional agility test - sprint forward, shuffle right, shuffle left, and backpedal to start. Tests acceleration, deceleration, and change of direction in multiple planes.",cat:"Speed & Agility",name:"T-Drill",sets:4,reps:1,wt:"Bodyweight"},{id:"sp5",desc:"Use a reaction ball that bounces unpredictably and field it off a wall or the ground. Develops reaction time, hand-eye coordination, and fielding ability on unpredictable bounces. Simulates a bad-hop ground ball.",cat:"Speed & Agility",name:"Reaction Ball Drill",sets:3,reps:8,wt:"Reaction ball"},
  // CONDITIONING
  {id:"co1",desc:"Sprint 25 yards, touch down, sprint back 25 yards - repeat 6 times without stopping for a total of 300 yards. One of the most demanding baseball conditioning tests. Develops anaerobic capacity specific to baseball's work-to-rest ratio.",cat:"Conditioning",name:"300-Yard Shuttle",sets:3,reps:1,wt:"Bodyweight"},{id:"co2",desc:"Sprint from one foul pole to the other at or near maximum effort. Typically done in sets with rest between reps. Builds game-specific conditioning.",cat:"Conditioning",name:"Pole-to-Pole Sprints",sets:8,reps:1,wt:"Bodyweight"},{id:"co3",desc:"Run the warning track at varying intensities - jogging for recovery or sprinting for conditioning. Outfield runs build aerobic base and keep conditioning in a sport-specific environment.",cat:"Conditioning",name:"Outfield Runs",sets:4,reps:1,wt:"Bodyweight"},{id:"co4",desc:"A longer conditioning run from foul pole to foul pole. Used for aerobic base building and team conditioning accountability. Distances and times can be adjusted based on training phase and time of season.",cat:"Conditioning",name:"Foul Pole to Foul Pole",sets:3,reps:1,wt:"Bodyweight"},
  // CORE

// --- GameChanger CSV import ---
// Column positions verified against a real "Export Stats" CSV from
// web.gc.com (Team > Stats > Export Stats). Several header NAMES repeat
// across the Batting/Pitching/Fielding sections (e.g. "1B"/"2B"/"3B"/"SB"
// mean different things in each section), so this reads by fixed index
// rather than by header text.
const GC_COLS={
  number:0,last:1,first:2,
  // Batting — verified against RA CSV
  bat_gp:3,bat_pa:4,bat_ab:5,bat_h:10,bat_1b:11,bat_2b:12,bat_3b:13,bat_hr:14,
  bat_rbi:15,bat_r:16,bat_bb:17,bat_so:18,bat_hbp:20,bat_sf:22,bat_sb:25,bat_qab:29,bat_tb:43,
  // Pitching — verified against RA CSV
  pit_ip:54,pit_gp:55,pit_gs:56,pit_bf:57,pit_p:58,pit_w:59,pit_l:60,
  pit_h:65,pit_r:66,pit_er:67,pit_bb:68,pit_so:69,pit_hbp:71,pit_wp:80,pit_spct:96,
  // Fielding summary cols
  fld_tc:148,fld_ast:149,fld_po:150,fld_e_total:152,
  // Innings per position
  fld_P:163,fld_C:164,fld_1B:165,fld_2B:166,fld_3B:167,fld_SS:168,
  fld_LF:169,fld_CF:170,fld_RF:171,fld_SF:172,fld_Total:173
};
function parseCSVText(text){
  const rows=[];let row=[],field="",inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQ=false;}
      else field+=c;
    }else{
      if(c==='"')inQ=true;
      else if(c===','){row.push(field);field="";}
      else if(c==='\n'||c==='\r'){
        if(c==='\r'&&text[i+1]==='\n')i++;
        row.push(field);field="";rows.push(row);row=[];
      }else field+=c;
    }
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows;
}
function gcInningsToDecimal(n){
  const whole=Math.trunc(n);
  const frac=Math.round((n-whole)*10);
  if(frac>=3||frac<0)return n; // not baseball out-notation, leave as-is
  return whole+frac/3;
}
function fmtInnings(n){
  if(!n)return"0";
  const whole=Math.floor(n+1e-9);
  const rem=Math.round((n-whole)*3);
  if(rem>=3)return`${whole+1}`;
  return rem===0?`${whole}`:`${whole}.${rem}`;
}
function parseGameChangerCSV(text){
  text=text.replace(/^\uFEFF/,"");
  const rows=parseCSVText(text);
  const num=(v)=>{const n=parseFloat((v||"0").toString().replace(/[^0-9.\-]/g,""));return isNaN(n)?0:n;};
  const innings=(v)=>gcInningsToDecimal(num(v));
  const out=[];
  for(let i=2;i<rows.length;i++){
    const r=rows[i];
    if(!r||r.length<100)continue;
    const first=(r[GC_COLS.first]||"").trim();
    const last=(r[GC_COLS.last]||"").trim();
    if(!first&&!last)continue;
    if(last==="Totals"||first==="Totals"||last==="Glossary")continue;
    out.push({
      number:(r[GC_COLS.number]||"").trim(),
      name:`${first} ${last}`.trim(),
      first,last,
      batting:{
        gp:num(r[GC_COLS.bat_gp]),pa:num(r[GC_COLS.bat_pa]),ab:num(r[GC_COLS.bat_ab]),h:num(r[GC_COLS.bat_h]),
        b1:num(r[GC_COLS.bat_1b]),b2:num(r[GC_COLS.bat_2b]),b3:num(r[GC_COLS.bat_3b]),
        hr:num(r[GC_COLS.bat_hr]),rbi:num(r[GC_COLS.bat_rbi]),r:num(r[GC_COLS.bat_r]),
        bb:num(r[GC_COLS.bat_bb]),so:num(r[GC_COLS.bat_so]),sb:num(r[GC_COLS.bat_sb]),
        hbp:num(r[GC_COLS.bat_hbp]),sf:num(r[GC_COLS.bat_sf]),tb:num(r[GC_COLS.bat_tb]),qab:num(r[GC_COLS.bat_qab])
      },
      pitching:{
        gp:num(r[GC_COLS.pit_gp]),gs:num(r[GC_COLS.pit_gs]),
        ip:innings(r[GC_COLS.pit_ip]),bf:num(r[GC_COLS.pit_bf]),
        p:num(r[GC_COLS.pit_p]),
        s:Math.round(num(r[GC_COLS.pit_p])*num(r[GC_COLS.pit_spct])/100),
        spct:num(r[GC_COLS.pit_spct]),
        w:num(r[GC_COLS.pit_w]),l:num(r[GC_COLS.pit_l]),
        h:num(r[GC_COLS.pit_h]),r:num(r[GC_COLS.pit_r]),er:num(r[GC_COLS.pit_er]),
        bb:num(r[GC_COLS.pit_bb]),so:num(r[GC_COLS.pit_so]),
        hbp:num(r[GC_COLS.pit_hbp]),wp:num(r[GC_COLS.pit_wp])
      },
      fielding:{
        // Innings per position — GC uses baseball notation (X.1=1/3, X.2=2/3)
        P:innings(r[GC_COLS.fld_P]),C:innings(r[GC_COLS.fld_C]),"1B":innings(r[GC_COLS.fld_1B]),
        "2B":innings(r[GC_COLS.fld_2B]),"3B":innings(r[GC_COLS.fld_3B]),SS:innings(r[GC_COLS.fld_SS]),
        LF:innings(r[GC_COLS.fld_LF]),CF:innings(r[GC_COLS.fld_CF]),RF:innings(r[GC_COLS.fld_RF]),
        SF:innings(r[GC_COLS.fld_SF]),Total:innings(r[GC_COLS.fld_Total]),
        // Fielding summary — single total E (this GC format has no per-position error breakdown)
        e:num(r[GC_COLS.fld_e_total]),
        po:num(r[GC_COLS.fld_po]),assists:num(r[GC_COLS.fld_ast]),tc:num(r[GC_COLS.fld_tc])
      }
    });
  }
  return out;
}
function bestNameMatch(gcName,athletes){
  const norm=(s)=>(s||"").toLowerCase().replace(/[^a-z]/g,"");
  const target=norm(gcName);
  let exact=athletes.find(a=>norm(a.name)===target);
  if(exact)return exact.id;
  const gcLast=norm(gcName.split(" ").slice(-1)[0]);
  const lastMatches=athletes.filter(a=>norm(a.name.split(" ").slice(-1)[0])===gcLast&&gcLast);
  if(lastMatches.length===1)return lastMatches[0].id;
  return "";
}

function polarToXY(cx,cy,r,angleDeg){
  const rad=(angleDeg-90)*Math.PI/180;
  return{x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)};
}
function pieSlicePath(cx,cy,r,startAngle,endAngle){
  if(endAngle-startAngle>=359.999){
    // Full circle - draw as two semicircle arcs (a single arc command can't span 360°)
    return`M ${cx} ${cy-r} A ${r} ${r} 0 1 1 ${cx} ${cy+r} A ${r} ${r} 0 1 1 ${cx} ${cy-r} Z`;
  }
  const start=polarToXY(cx,cy,r,endAngle);
  const end=polarToXY(cx,cy,r,startAngle);
  const largeArc=endAngle-startAngle<=180?"0":"1";
  return`M ${cx} ${cy} L ${start.x} ${start.y} A ${r} ${r} 0 ${largeArc} 0 ${end.x} ${end.y} Z`;
}
function PieChart({slices,size=90}){
  const total=slices.reduce((s,x)=>s+x.pct,0);
  const r=size/2;
  if(total<=0)return<div style={{fontSize:11,color:"#6b82a0"}}>No data yet</div>;
  let cumulative=0;
  const paths=slices.filter(s=>s.pct>0).map((s,i)=>{
    const startAngle=cumulative/total*360;
    cumulative+=s.pct;
    const endAngle=cumulative/total*360;
    return<path key={i} d={pieSlicePath(r,r,r,startAngle,endAngle)} fill={s.color}/>;
  });
  return(
    <div style={{display:"flex",alignItems:"center",gap:10}}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{flexShrink:0}}>{paths}</svg>
      <div style={{minWidth:0}}>
        {slices.filter(s=>s.pct>0).map((s,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:5,fontSize:10.5,marginBottom:2,whiteSpace:"nowrap"}}>
            <span style={{width:8,height:8,borderRadius:2,background:s.color,display:"inline-block",flexShrink:0}}/>
            <span>{s.label} {Math.round(s.pct/total*100)}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function gamePlayers(game,athletes,weekend){
  const gameGuests=(game.guests||[]).map(g=>({...g,isGuest:true}));
  const weekendGuests=(weekend?.guests||[]).filter(function(g){return !g.teamId||g.teamId===game.team_id;}).map(g=>({...g,isGuest:true,isWeekendGuest:true}));
  // Merge, dedupe by id
  const allGuests=[...weekendGuests,...gameGuests.filter(g=>!weekendGuests.find(w=>w.id===g.id))];
  return[...athletes,...allGuests];
}
function playerLabel(id,game,athletes){
  const p=gamePlayers(game,athletes).find(x=>x.id===id);
  if(!p)return"Unknown";
  return p.isGuest?`${p.name} (Guest)`:p.name;
}

function getChartForInning(game,inning){
  const fc=game.field_chart||{};
  if(fc[inning])return fc[inning];
  if(inning>1)return getChartForInning(game,inning-1);
  const chart={};
  (game.lineup||[]).forEach(l=>{if(l.position)chart[l.position]=l.athleteId;});
  return chart;
}
const FIELD_POS_WITH_SF=[...FIELD_POS,"SF"];
function primaryPosFromFielding(fielding){
  const entries=FIELD_POS_WITH_SF.map(pos=>[pos,fielding[pos]||0]).filter(([,n])=>n>0);
  return entries.length?entries.sort((a,b)=>b[1]-a[1])[0][0]:null;
}
function gamePrimaryPosition(game,athleteId){
  const imported=game.imported_fielding&&game.imported_fielding[athleteId];
  if(imported&&imported.Total>0){
    const entries=FIELD_POS_WITH_SF.map(pos=>[pos,imported[pos]||0]).filter(([,n])=>n>0);
    return entries.length?entries.sort((a,b)=>b[1]-a[1])[0][0]:null;
  }
  const innings=game.innings||6;
  const counts={};
  for(let i=1;i<=innings;i++){
    const chart=getChartForInning(game,i);
    const pos=Object.keys(chart).find(p=>chart[p]===athleteId);
    if(pos)counts[pos]=(counts[pos]||0)+1;
  }
  const e=Object.entries(counts);
  return e.length?e.sort((a,b)=>b[1]-a[1])[0][0]:null;
}
function resolveBattingSlot(game,athleteId){
  const pinch=(game.pinch_hitters||[]).find(p=>p.athleteId===athleteId);
  if(pinch)return pinch.slot;
  const idx=(game.lineup||[]).findIndex(l=>l.athleteId===athleteId);
  return idx!==-1?idx+1:null;
}
function computeAthleteGameStats(athleteId,games){
  const orderCounts={},posCounts={};const appearances=[];let totalInnings=0;let availableInnings=0;
  games.forEach(g=>{
    const slot=resolveBattingSlot(g,athleteId);
    const inLineup=slot!=null;
    if(inLineup)orderCounts[slot]=(orderCounts[slot]||0)+1;
    let played=false;
    const imported=g.imported_fielding&&g.imported_fielding[athleteId];
    if(imported&&imported.Total>0){
      // Imported scorebook data takes precedence over live tracking for
      // this game/athlete, so we don't double-count both sources.
      FIELD_POS_WITH_SF.forEach(pos=>{
        const n=imported[pos]||0;
        if(n>0){posCounts[pos]=(posCounts[pos]||0)+n;totalInnings+=n;played=true;}
      });
    }else{
      const innings=g.innings||6;
      for(let i=1;i<=innings;i++){
        const chart=getChartForInning(g,i);
        const pos=Object.keys(chart).find(p=>chart[p]===athleteId);
        if(pos){posCounts[pos]=(posCounts[pos]||0)+1;totalInnings++;played=true;}
      }
    }
    if(inLineup||played){
      appearances.push({game:g,slot:inLineup?slot:null,position:gamePrimaryPosition(g,athleteId)});
      availableInnings+=g.innings||6;
    }
  });
  const benchInnings=Math.max(0,availableInnings-totalInnings);
  return{total:appearances.length,orderCounts,posCounts,totalInnings,availableInnings,benchInnings,appearances};
}
function emptyBattingLine(){return{pa:0,ab:0,h:0,b1:0,b2:0,b3:0,hr:0,rbi:0,r:0,bb:0,so:0,sb:0,hbp:0,sf:0,tb:0,qab:0};}
function addBattingLine(target,bs){
  target.pa+=bs.pa||0;target.ab+=bs.ab||0;target.h+=bs.h||0;
  target.b1+=bs.b1||0;target.b2+=bs.b2||0;target.b3+=bs.b3||0;target.hr+=bs.hr||0;
  target.rbi+=bs.rbi||0;target.r+=bs.r||0;target.bb+=bs.bb||0;target.so+=bs.so||0;target.sb+=bs.sb||0;
  target.hbp+=bs.hbp||0;target.sf+=bs.sf||0;target.tb+=bs.tb||0;target.qab+=bs.qab||0;
}
function calcOBP(line){const denom=line.ab+line.bb+line.hbp+line.sf;return denom>0?(line.h+line.bb+line.hbp)/denom:null;}
function calcSLG(line){return line.ab>0?line.tb/line.ab:null;}
function calcOPS(line){const obp=calcOBP(line),slg=calcSLG(line);return(obp==null&&slg==null)?null:(obp||0)+(slg||0);}
function calcQABPct(line){return line.pa>0?(line.qab/line.pa*100):null;}
function computeBattingBySlot(athleteId,games){
  const bySlot={};
  const overall=emptyBattingLine();
  let gamesWithData=0;
  games.forEach(g=>{
    const bs=g.batting_stats&&g.batting_stats[athleteId];
    if(!bs)return;
    const resolved=resolveBattingSlot(g,athleteId);
    const slot=resolved!=null?resolved:"Unknown";
    if(!bySlot[slot])bySlot[slot]=emptyBattingLine();
    addBattingLine(bySlot[slot],bs);
    addBattingLine(overall,bs);
    gamesWithData++;
  });
  return{bySlot,overall,gamesWithData,totalAb:overall.ab,totalH:overall.h,avg:overall.ab>0?(overall.h/overall.ab):null};
}
function fmtAvg(n){return n==null?"—":n.toFixed(3).replace(/^0/,"");}
function buildGameText(game,team,weekend,athletes,staffById){
  const lines=[];
  lines.push(`${team?team.name:"Team"} vs ${game.opponent||"TBD"}`);
  const when=[game.game_date,fmtTime12(game.game_time),game.location?`@ ${game.location}`:""].filter(Boolean).join("  ");
  if(when)lines.push(when);
  if(weekend)lines.push(weekend.name);
  if(game.assigned_coach_id)lines.push(`Managing: ${staffById[game.assigned_coach_id]?.name||"Coach"}`);
  lines.push("");
  lines.push("BATTING LINEUP");
  if(!game.lineup||game.lineup.length===0){lines.push("(no lineup set yet)");}
  else{game.lineup.forEach((entry,i)=>{lines.push(`${i+1}. ${playerLabel(entry.athleteId,game,athletes)} — ${entry.position||"?"}`);});}
  if(game.pitching&&game.pitching.length>0){
    lines.push("");lines.push("PITCHING PLAN");
    game.pitching.forEach(p=>{
      const inn=(p.innings||[]).slice().sort((x,y)=>x-y).join(", ")||"—";
      let row=`Inn ${inn}: ${playerLabel(p.athleteId,game,athletes)}`;
      if(p.limit)row+=` (max ${p.limit} pitches)`;
      if(p.note)row+=` — ${p.note}`;
      lines.push(row);
    });
  }
  if(game.notes){lines.push("");lines.push(`NOTES: ${game.notes}`);}
  return lines.join("\n");
}

function ResetPasswordScreen({onDone}){
  const[pass,setPass]=useState("");
  const[pass2,setPass2]=useState("");
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");
  const[done,setDone]=useState(false);

  const submit=async()=>{
    if(!pass||pass.length<6){setErr("Password must be at least 6 characters.");return;}
    if(pass!==pass2){setErr("Passwords do not match.");return;}
    setLoading(true);setErr("");
    const r=await fetch(`${SURL}/auth/v1/user`,{
      method:"PUT",
      headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`},
      body:JSON.stringify({password:pass})
    });
    const d=await r.json();
    setLoading(false);
    if(!r.ok){setErr("Error: "+(d.message||JSON.stringify(d)));return;}
    setDone(true);
    setTimeout(()=>onDone(),2500);
  };

  if(done)return(
    <div className="auth-wrap"><div className="auth-card" style={{textAlign:"center"}}>
      <div style={{fontSize:44,marginBottom:10}}>✅</div>
      <div style={{fontSize:18,fontWeight:800,marginBottom:8,color:"#27c97a"}}>Password Updated!</div>
      <div style={{fontSize:12,color:"#6b82a0"}}>Taking you to sign in...</div>
    </div></div>
  );

  return(
    <div className="auth-wrap"><div className="auth-card">
      <div className="alogo">
        <div style={{fontSize:34,marginBottom:5}}>🔑</div>
        <div className="at">New <em>Password</em></div>
        <div className="asub">Choose a new password for your account</div>
      </div>
      {err&&<div className="err2">{err}</div>}
      <div className="fg"><label>New Password</label><input className="inp" type="password" placeholder="At least 6 characters" value={pass} onChange={e=>setPass(e.target.value)}/></div>
      <div className="fg"><label>Confirm Password</label><input className="inp" type="password" placeholder="Same password again" value={pass2} onChange={e=>setPass2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
      <button className="bmain" onClick={submit} disabled={loading||!pass||!pass2}>{loading?"Saving...":"Set New Password"}</button>
    </div></div>
  );
}

function AuthScreen({onAuth,joinTeamId}){
  const[isUp,setIsUp]=useState(!!joinTeamId);
  const[forgotPw,setForgotPw]=useState(false);
  const[resetSent,setResetSent]=useState(false);
  const[role,setRole]=useState("coach");
  const[name,setName]=useState("");
  const[email,setEmail]=useState("");
  const[pass,setPass]=useState("");
  const[pos,setPos]=useState("Pitcher");
  const[grad,setGrad]=useState(2027);
  const[ageGroup,setAgeGroup]=useState("");
  const[useAgeGroup,setUseAgeGroup]=useState(false);
  const[otherPos,setOtherPos]=useState("");
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");
  const[logs,setLogs]=useState([]);
  const[checkEmail,setCheckEmail]=useState(false);
  const log=(m)=>setLogs(p=>[...p,m]);

  const sendReset=async()=>{
    if(!email){setErr("Enter your email first.");return;}
    setLoading(true);setErr("");
    const redirectTo=encodeURIComponent(window.location.origin+window.location.pathname);
    const r=await fetch(`${SURL}/auth/v1/recover?redirect_to=${redirectTo}`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY},body:JSON.stringify({email})});
    setLoading(false);
    if(r.ok){setResetSent(true);}
    else{const d=await r.json().catch(()=>({}));setErr("Error: "+(d.message||JSON.stringify(d)));}
  };

  const submit=async()=>{
    setErr("");setLoading(true);setLogs([]);
    try{
      if(isUp){
        const nameParts=(name||"").trim().split(" ").filter(Boolean);
        if(role!=="coach"&&nameParts.length<2){setErr("Please enter your first and last name.");setLoading(false);return;}
        if(!email||!pass){setErr("Email and password are required.");setLoading(false);return;}
        log("Creating account...");
        const{data,error:e}=await sb.auth.signUp(email,pass);
        log("Auth: "+JSON.stringify({id:data?.user?.id,sess:!!data?.session,err:e?.message}));
        if(e){
          // Supabase returns this when email already exists in auth.users
          const msg=(e.message||e.error_description||"").toLowerCase();
          if(msg.includes("already")||msg.includes("registered")||msg.includes("exists")||(e.code==="user_already_exists")){
            // Try signing them in with the provided password instead
            log("Email exists in auth — trying sign-in...");
            const{data:siData,error:siErr}=await sb.auth.signIn(email,pass);
            if(siErr)throw new Error("This email is already registered. Try signing in, or use password reset if you forgot your password.");
            // Check if they have a profile already
            const{data:existProf}=await sb.from("profiles").select("*").eq("id",siData.user.id).maybeSingle();
            if(existProf){onAuth(existProf);setLoading(false);return;}
            // Auth user exists but no profile — create one
            data={user:siData.user,session:siData.session};
          } else {
            throw new Error("Signup failed: "+(e.message||e.error_description||JSON.stringify(e)));
          }
        }
        // If joining a team via invite link, add athlete to that facility team after profile created
        if(joinTeamId&&data?.user?.id){
          try{
            const teamR=await fetch(`${SURL}/rest/v1/facility_teams?id=eq.${joinTeamId}&select=athlete_ids`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${data.session?.access_token||_tok}`}});
            if(teamR.ok){const[team]=await teamR.json();if(team){const ids=[...(team.athlete_ids||[]),data.user.id];await fetch(`${SURL}/rest/v1/facility_teams?id=eq.${joinTeamId}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${data.session?.access_token||_tok}`},body:JSON.stringify({athlete_ids:ids})});}}
          }catch(te){log("Team join error: "+te);}
        }
        if(!data?.user)throw new Error("No user returned — check URL/key");
        log("Saving profile...");
        const insertToken=data?.session?.access_token||_tok||SKEY;
        const pd={id:data.user.id,email,name:(name||email.split("@")[0]).trim(),role,position:role==="athlete"?pos:null,other_positions:role==="athlete"&&otherPos?otherPos:null,grad:role==="athlete"&&!useAgeGroup?parseInt(grad):null,age_group:role==="athlete"&&useAgeGroup?ageGroup:null,avatar:ini((name||email).trim()),measurables:{}};
        const _profR=await fetch(`${SURL}/rest/v1/profiles`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${insertToken}`,"Prefer":"return=representation"},body:JSON.stringify(pd)});
        const pe=_profR.ok?null:await _profR.json().catch(()=>({}));
        log("Profile: "+(pe?JSON.stringify(pe):"ok"));
        if(pe){
          if(pe.code==="23505")throw new Error("Email already registered — try Sign In");
          // Show the complete raw error rather than guessing what it means -
          // a previous version of this guessed wrong and showed a misleading
          // message that masked the real problem.
          throw new Error("Profile error ["+(pe.code||"?")+"]: "+(pe.message||"")+(pe.details?" | details: "+pe.details:"")+(pe.hint?" | hint: "+pe.hint:""));
        }
        if(!data.session){
          // Email confirmation required — profile was inserted but no session yet
          // Show check-email screen
          setCheckEmail(true);
        } else {
          onAuth(pd);
        }
      }else{
        log("Signing in...");
        const{data,error:e}=await sb.auth.signIn(email,pass);
        log("Auth: "+JSON.stringify({id:data?.user?.id,err:e?.message}));
        if(e)throw new Error("Sign in failed: "+(e.message||e.error_description||JSON.stringify(e)));
        log("Loading profile...");
        const{data:prof,error:pe}=await sb.from("profiles").select("*").eq("id",data.user.id).maybeSingle();
        log("Profile: "+(prof?"found":"not found — "+JSON.stringify(pe)));
        if(!prof){
          // Profile missing — create one now (happens when email confirmation is enabled)
          log("Creating missing profile...");
          const fallbackName=(data.user.email||"").split("@")[0];
          const newProf={id:data.user.id,email:data.user.email,name:fallbackName,role:"athlete",avatar:ini(fallbackName),measurables:{}};
          const{error:cpe}=await sb.from("profiles").insert(newProf);
          if(cpe){
            if(cpe.code==="23505"){
              // Race condition — profile exists now, fetch it
              const{data:retryProf}=await sb.from("profiles").select("*").eq("id",data.user.id).maybeSingle();
              if(retryProf){onAuth(retryProf);setLoading(false);return;}
            }
            throw new Error("Could not create your profile. Please contact RA Academies for help. ("+cpe.message+")");
          }
          const{data:freshProf}=await sb.from("profiles").select("*").eq("id",data.user.id).maybeSingle();
          if(freshProf){onAuth(freshProf);setLoading(false);return;}
          throw new Error("Profile setup incomplete — please contact RA Academies.");
        }
        onAuth(prof);
      }
    }catch(e){setErr(e.message);}
    setLoading(false);
  };

  if(resetSent)return(
    <div className="auth-wrap"><div className="auth-card" style={{textAlign:"center"}}>
      <div style={{fontSize:44,marginBottom:10}}>📧</div>
      <div style={{fontSize:18,fontWeight:800,marginBottom:8}}>Check your email</div>
      <div style={{fontSize:12,color:"#6b82a0",lineHeight:1.7}}>We sent a password reset link to<br/><strong style={{color:"#eef2f8"}}>{email}</strong><br/>Click it to set a new password.</div>
      <button className="bmain" style={{marginTop:14}} onClick={()=>{setResetSent(false);setForgotPw(false);}}>Back to Sign In</button>
    </div></div>
  );

  if(forgotPw)return(
    <div className="auth-wrap"><div className="auth-card">
      <div className="alogo">
        <div style={{fontSize:34,marginBottom:5}}>🔑</div>
        <div className="at">Reset <em>Password</em></div>
        <div className="asub">Enter your email and we will send a reset link</div>
      </div>
      {err&&<div className="err2">{err}</div>}
      <div className="fg"><label>Email</label><input className="inp" type="email" placeholder="you@email.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendReset()}/></div>
      <button className="bmain" onClick={sendReset} disabled={loading||!email}>{loading?"Sending...":"Send Reset Link"}</button>
      <div className="tl" style={{marginTop:12}}><button onClick={()=>{setForgotPw(false);setErr("");}}>← Back to Sign In</button></div>
    </div></div>
  );

  if(checkEmail)return(
    <div className="auth-wrap"><div className="auth-card" style={{textAlign:"center"}}>
      <div style={{fontSize:44,marginBottom:10}}>📧</div>
      <div style={{fontSize:18,fontWeight:800,marginBottom:8}}>Check your email</div>
      <div style={{fontSize:12,color:"#6b82a0",lineHeight:1.6}}>Confirmation sent to <strong style={{color:"#eef2f8"}}>{email}</strong>.<br/>Click it then come back to Sign In.</div>
      <button className="bmain" style={{marginTop:14}} onClick={()=>{setCheckEmail(false);setIsUp(false);}}>Back to Sign In</button>
    </div></div>
  );

  return(
    <div className="auth-wrap"><div className="auth-card">

  const computedTimes=days.map((d,i)=>{let cur=startTime;for(let j=0;j<i;j++){const prev=days[j];const mins=parseInt(prev.sectionDuration)||0;cur=addMinutes(cur,mins);}return cur;});

            const cnt=(d.exercises||[]).length;

              {computedTimes[i]&&<span style={{fontSize:9,marginRight:4}}>{fmt12(computedTimes[i])}</span>}

          })}

        {/* For multi-day workouts: left sidebar */}
        {cfg.hasDays&&<div style={{width:140,flexShrink:0,borderRight:"1px solid rgba(255,255,255,.07)",paddingRight:8,marginRight:12,overflowY:"auto"}}>
          <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:8}}>Days</div>
          {days.map(function(d,i){
            const cnt=(d.exercises||[]).length;
            return(<button key={i} onClick={()=>setActiveDay(i)} style={{width:"100%",padding:"8px 10px",borderRadius:7,border:"1px solid "+(activeDay===i?cfg.color:"transparent"),background:activeDay===i?cfg.color+"15":"transparent",color:activeDay===i?cfg.color:"#8fa3be",textAlign:"left",cursor:"pointer",fontSize:12,fontWeight:activeDay===i?700:400,marginBottom:3,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",flex:1}}>{d.day.length>12?d.day.slice(0,12)+"…":d.day}</span>
              {cnt>0&&<span style={{background:cfg.color+"30",color:cfg.color,borderRadius:"50%",width:18,height:18,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,flexShrink:0}}>{cnt}</span>}
            </button>);
          })}
        </div>}
        <div style={{flex:1,overflowY:"auto"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,flexWrap:"wrap",gap:8}}>
            <div>

              <input className="inp" value={days[activeDay]?.day||""} onChange={e=>updDay(activeDay,"day",e.target.value)} placeholder="Section name..." style={{fontWeight:700,fontSize:16,color:cfg.color,background:"transparent",border:"1px solid rgba(255,255,255,.1)",borderRadius:6,padding:"3px 8px",flex:1}}/>
              {!cfg.hasDays&&<div style={{display:"flex",gap:8,marginTop:6,alignItems:"center"}}>
                <input className="inp" type="number" placeholder="Minutes" value={days[activeDay]?.sectionDuration||""} onChange={e=>updDay(activeDay,"sectionDuration",e.target.value)} style={{width:90,fontSize:11}}/>
                <span style={{fontSize:11,color:"#6b82a0"}}>min</span>
                {days[activeDay]?.sectionDuration&&<span style={{fontSize:11,color:"#6b82a0"}}>→ ends {fmt12(addMinutes(computedTimes[activeDay],parseInt(days[activeDay].sectionDuration)||0))}</span>}
              </div>}
            </div>
            <div style={{display:"flex",gap:7}}>
              <button className="btn bg bsm" onClick={()=>setShowPicker(true)}>⚾ Library</button>

          </div>

          {activeDrills.length===0&&<div className="empty" style={{padding:"24px 0"}}><div className="ei">⚾</div><div className="et" style={{fontSize:13}}>Add from Library or + Blank</div></div>}

          {activeDrills.map((ex,ei)=>(
            <div key={ex.id}
              draggable
              onDragStart={()=>setDragEx(ei)}
              onDragEnter={()=>setDragOverEx(ei)}
              onDragEnd={onDragExEnd}

              style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.07)",borderRadius:8,padding:12,marginBottom:8,opacity:dragEx===ei?0.4:1,outline:dragOverEx===ei&&dragEx!==ei?"2px solid "+cfg.color:"none",transition:"outline .1s",cursor:"grab"}}>
              <div style={{display:"flex",gap:7,marginBottom:8,alignItems:"center"}}>
                <span style={{color:"#6b82a0",fontSize:18,flexShrink:0,cursor:"grab",userSelect:"none",lineHeight:1}}>⠿</span>
                <input className="inp" placeholder="Drill / activity name" value={ex.name} onChange={e=>updEx(activeDay,ei,"name",e.target.value)} style={{flex:1,fontWeight:600}}/>
                <button className="btn bgr bsm" onClick={()=>remEx(activeDay,ei)}>✕</button>
              </div>
              {cfg.hasDays
                ?<div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7,marginBottom:7}}>
                  <div><label style={{fontSize:9,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",display:"block",marginBottom:2}}>Sets</label><input className="inp" type="number" value={ex.sets} onChange={e=>updEx(activeDay,ei,"sets",e.target.value)} style={{fontSize:13}}/></div>
                  <div><label style={{fontSize:9,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",display:"block",marginBottom:2}}>Reps</label><input className="inp" type="number" value={ex.reps} onChange={e=>updEx(activeDay,ei,"reps",e.target.value)} style={{fontSize:13}}/></div>
                  <div><label style={{fontSize:9,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",display:"block",marginBottom:2}}>Load</label><input className="inp" placeholder="—" value={ex.weight} onChange={e=>updEx(activeDay,ei,"weight",e.target.value)} style={{fontSize:13}}/></div>
                </div>
                :<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginBottom:7}}>
                  <div><label style={{fontSize:9,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",display:"block",marginBottom:2}}>Duration (min)</label><input className="inp" type="number" placeholder="5" value={ex.duration||""} onChange={e=>updEx(activeDay,ei,"duration",e.target.value)} style={{fontSize:13}}/></div>
                  <div><label style={{fontSize:9,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",display:"block",marginBottom:2}}>Reps / Count</label><input className="inp" placeholder="optional" value={ex.reps||""} onChange={e=>updEx(activeDay,ei,"reps",e.target.value)} style={{fontSize:13}}/></div>
                </div>
              }
              {!cfg.hasDays&&<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
                <div><label style={{fontSize:9,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",display:"block",marginBottom:2}}>Coaching Cues</label><input className="inp" placeholder="Key focus points..." value={ex.notes} onChange={e=>updEx(activeDay,ei,"notes",e.target.value)} style={{fontSize:11}}/></div>

              </div>}
            </div>
          ))}

          {!cfg.hasDays&&<div className="fg" style={{marginTop:8}}><label>Block Notes</label><textarea className="inp" placeholder="Setup, reminders, coaching points..." value={days[activeDay]?.sectionNote||""} onChange={e=>updDay(activeDay,"sectionNote",e.target.value)} style={{minHeight:50}}/></div>}
        </div>
        </div>
      </div>}

      {assignTab==="preview"&&<div style={{background:"white",borderRadius:10,overflow:"hidden",flex:1}}>
        <div style={{background:"#0d1526",padding:"8px 14px",display:"flex",gap:8,alignItems:"center"}}>
          <span style={{fontSize:12,color:"#6b82a0"}}>Print Preview</span>
          <button className="btn bg bsm" onClick={()=>window.print()}>🖨️ Print</button>
        </div>
        <WorkoutPrintView name={name} week={week} duration={duration} location={location} coachNote={coachNote} days={activeDays} cfg={cfg} athletes={athletes} athId={athId} tGrads={tGrads} tAgeGroups={tAgeGroups} tGroups={tGroups} startTime={startTime} computedTimes={computedTimes}/>
      </div>}

      {showPicker&&<ExPicker onSelect={addEx} onClose={()=>setShowPicker(false)} planType={type}/>}
    </div>
  );
}

function WorkoutPrintView({name,week,duration,location,coachNote,days,cfg,athletes,athId,tGrads,tAgeGroups,tGroups,startTime,computedTimes}){
  const ath=athletes?.find(a=>a.id===athId);
  const isPlan=!cfg.hasDays;
  const targetLabel=ath?ath.name:[...tGrads.map(y=>"Class of "+y),...tAgeGroups,...tGroups].join(", ")||"";
  const totalMin=isPlan?days.reduce((s,d)=>s+(parseInt(d.sectionDuration)||0),0):parseInt(duration)||0;
  const endTime=isPlan&&startTime?addMinutes(startTime,totalMin):"";
  const activeDays=days.filter(d=>(d.exercises||[]).length>0||d.sectionNote);

  // Collect all footnotes across all days
  const allFootnotes=[];
  activeDays.forEach(function(d){
    (d.exercises||[]).forEach(function(ex){
      if(ex.desc&&ex.desc.trim())allFootnotes.push({day:d.day,name:ex.name,desc:ex.desc});
    });
  });

  if(!isPlan){
    // ── WORKOUT — lineup card style with footnotes ──
    return(
      <div style={{display:"flex",justifyContent:"center",padding:"24px 16px",background:"#e8e0d0",minHeight:"100%"}}>
        <style>{"@media print{body{margin:0;padding:0;background:#e8e0d0;}.no-print{display:none!important;}}@page{margin:1cm;}"}</style>
        <div style={{background:"#f6f1e2",color:"#000",border:"3px solid #000",borderRadius:10,padding:"20px 18px",width:"100%",maxWidth:520,fontFamily:"Georgia,Times New Roman,serif"}}>
          {/* Header */}
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
            <img src={BRANDING.logos.iconDark} alt="" style={{height:34,width:"auto",flexShrink:0}}/>
            <div>
              <div style={{fontSize:9,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>{BRANDING.name}</div>
              <div style={{fontSize:18,fontWeight:900,textTransform:"uppercase",lineHeight:1.1}}>{name||cfg.label}</div>
            </div>
          </div>
          <div style={{fontSize:10,marginBottom:10,paddingBottom:8,borderBottom:"2px solid #000",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:4}}>
            <span>{[week,location].filter(Boolean).join("  ·  ")}</span>
            {duration&&<span style={{fontWeight:700}}>{duration} min</span>}
          </div>
          {coachNote&&<div style={{fontSize:10,fontStyle:"italic",marginBottom:10,paddingBottom:8,borderBottom:"1px solid rgba(0,0,0,.15)"}}>{coachNote}</div>}

          {/* Days */}
          {activeDays.map(function(day,di){
            const exs=day.exercises||[];
            return(
              <div key={di} style={{marginBottom:14}}>
                <div style={{fontWeight:900,fontSize:12,textTransform:"uppercase",letterSpacing:.8,background:"#000",color:"#fff",padding:"4px 10px",borderRadius:4,marginBottom:6}}>{day.day}</div>
                {exs.map(function(ex,ei){
                  const fnIdx=allFootnotes.findIndex(function(f){return f.day===day.day&&f.name===ex.name;});
                  return(
                    <div key={ei} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"5px 0",borderBottom:"1px solid rgba(0,0,0,.1)"}}>
                      <div style={{width:20,height:20,borderRadius:"50%",border:"1.5px solid #000",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,flexShrink:0,marginTop:1}}>{ei+1}</div>
                      <div style={{flex:1}}>
                        <div style={{display:"flex",alignItems:"baseline",gap:6,flexWrap:"wrap"}}>
                          <span style={{fontWeight:700,fontSize:12}}>{ex.name||"Exercise"}</span>
                          {(ex.duration||ex.sets||ex.reps)&&<span style={{fontSize:11,color:"#444"}}>{ex.duration?ex.duration+" min":(ex.sets&&ex.sets+"×")}{!ex.duration&&ex.reps&&ex.reps+" reps"}{!ex.duration&&ex.weight?" · "+ex.weight:""}</span>}
                          
                        </div>
                        {ex.notes&&<div style={{fontSize:10,color:"#555",marginTop:1,fontStyle:"italic"}}>{ex.notes}</div>}
                        {ex.desc&&<div style={{fontSize:9.5,color:"#666",fontStyle:"italic",marginTop:2,lineHeight:1.4,borderLeft:"2px solid rgba(0,0,0,.15)",paddingLeft:5}}>{ex.desc}</div>}
                      </div>
                      <div style={{display:"flex",gap:6,flexShrink:0,alignItems:"center"}}>
                        <div style={{width:36,height:16,border:"1px solid #aaa",borderRadius:2,fontSize:8,color:"#aaa",display:"flex",alignItems:"center",justifyContent:"center"}}>Wt Used</div>
                        <div style={{width:16,height:16,border:"2px solid #000",borderRadius:2}}/>
                      </div>
                    </div>
                  );
                })}
                {day.sectionNote&&<div style={{fontSize:10,color:"#555",fontStyle:"italic",marginTop:4,paddingLeft:4}}>📌 {day.sectionNote}</div>}
              </div>
            );
          })}



          <div style={{marginTop:10,paddingTop:6,display:"flex",justifyContent:"space-between",fontSize:9,borderTop:"2px solid #000"}}>
            <span>{BRANDING.productName}</span>
            <span style={{fontWeight:700}}>{week}</span>
          </div>
        </div>
      </div>
    );
  }

  // ── PRACTICE PLAN — lineup card style ──
  return(
    <div style={{display:"flex",justifyContent:"center",padding:"24px 16px",background:"#e8e0d0",minHeight:"100%"}}>
      <style>{"@media print{body{margin:0;padding:0;background:#e8e0d0;}.no-print{display:none!important;}}@page{margin:1cm;}"}</style>
      <div style={{background:"#f6f1e2",color:"#000",border:"3px solid #000",borderRadius:10,padding:"20px 18px",width:"100%",maxWidth:480,fontFamily:"Georgia,Times New Roman,serif"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
          <img src={BRANDING.logos.iconDark} alt="" style={{height:34,width:"auto",flexShrink:0}}/>
          <div>
            <div style={{fontSize:9,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>{BRANDING.name}</div>
            <div style={{fontSize:18,fontWeight:900,textTransform:"uppercase",lineHeight:1.1}}>{name||"Practice Plan"}</div>
          </div>
        </div>
        <div style={{fontSize:10,marginBottom:10,paddingBottom:8,borderBottom:"2px solid #000",display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:4}}>
          <span>{[week,targetLabel,location].filter(Boolean).join("  ·  ")}</span>
          {startTime&&<span style={{fontWeight:700}}>{fmt12(startTime)}{endTime?" – "+fmt12(endTime):""}{totalMin?" ("+totalMin+"m)":""}</span>}
        </div>
        {coachNote&&<div style={{fontSize:10,fontStyle:"italic",marginBottom:10,paddingBottom:8,borderBottom:"1px solid rgba(0,0,0,.15)"}}>{coachNote}</div>}
        {activeDays.map(function(day,si){
          const drills=day.exercises||[];
          return(
            <div key={si} style={{marginBottom:12}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                <div style={{fontWeight:900,fontSize:11,textTransform:"uppercase",letterSpacing:.8,flex:1}}>{si+1}. {day.day}</div>
                {day.sectionDuration&&<div style={{fontSize:10,fontWeight:700,color:"#444"}}>({day.sectionDuration} min)</div>}
                {computedTimes&&computedTimes[si]&&<div style={{fontSize:10,color:"#444"}}>{fmt12(computedTimes[si])}</div>}
              </div>
              {drills.map(function(ex,ei){
                const fnIdx=allFootnotes.findIndex(function(f){return f.day===day.day&&f.name===ex.name;});
                const notes=(ex.notes||"").split(/[;]+/).filter(Boolean);
                return(
                  <div key={ei} style={{display:"flex",alignItems:"flex-start",gap:8,padding:"5px 0",borderBottom:"1px solid rgba(0,0,0,.12)"}}>
                    <div style={{width:20,height:20,borderRadius:"50%",border:"1.5px solid #000",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:700,flexShrink:0,marginTop:1}}>{ei+1}</div>
                    <div style={{flex:1}}>
                      <div style={{display:"flex",alignItems:"baseline",gap:6,flexWrap:"wrap"}}>
                        <span style={{fontWeight:700,fontSize:13}}>{ex.name||"Activity"}</span>
                        {ex.weight&&<span style={{fontSize:10,color:"#444"}}>({ex.weight} min)</span>}
                        
                      </div>
                      {notes.map(function(n,ni){return(<div key={ni} style={{fontSize:11,color:"#333",marginTop:1}}>{notes.length>1?String.fromCharCode(97+ni)+") ":""}{n.trim()}</div>);})}
                      {ex.desc&&<div style={{fontSize:9.5,color:"#555",fontStyle:"italic",marginTop:3,lineHeight:1.4,borderLeft:"2px solid rgba(0,0,0,.15)",paddingLeft:6}}>{ex.desc}</div>}
                    </div>
                  </div>
                );
              })}
              {day.sectionNote&&<div style={{fontSize:10,color:"#555",fontStyle:"italic",marginTop:4,paddingLeft:4}}>📌 {day.sectionNote}</div>}
            </div>
          );
        })}

        <div style={{marginTop:10,paddingTop:6,display:"flex",justifyContent:"space-between",fontSize:9,borderTop:"2px solid #000"}}>
          <span>{BRANDING.productName}</span>
          <span style={{fontWeight:700}}>{week}</span>
        </div>
      </div>
    </div>
  );
}



class ErrBoundary extends React.Component{
  constructor(p){super(p);this.state={err:null};}
  static getDerivedStateFromError(e){return{err:e};}
  render(){
    if(this.state.err)return(<div style={{padding:20,color:"#e84040",fontFamily:"monospace",fontSize:12,background:"#0d1526",minHeight:"100vh"}}>
      <div style={{fontWeight:800,marginBottom:8}}>⚠️ Render Error</div>
      <div>{this.state.err.toString()}</div>
      <pre style={{marginTop:10,whiteSpace:"pre-wrap",opacity:.7}}>{this.state.err.stack}</pre>
    </div>);
    return this.props.children;
  }
}

    const hash=window.location.hash;

    const type=params.get("type");
    const accessToken=params.get("access_token");
    if((type==="recovery"||type==="signup")&&accessToken){
      _tok=accessToken;
      try{localStorage.setItem("dt",JSON.stringify({access_token:accessToken,expires_at:Date.now()/1000+3600}));}catch(e){}
      // Both a password-reset link and a first-time signup-confirmation link land here.

  useEffect(()=>{

        fetchData("teams?select=*&limit=2000"),
        fetchData(profile.role==="coach"&&!isAdmin?`games?select=*&limit=5000`:"games?select=*&limit=5000"),
        fetchData("checkins?select=*&order=check_date.desc&limit=10000"),

        fetchJSON("workout_logs?select=*&limit=10000"),
        fetchJSON("custom_exercises?select=*&limit=10000"),

      if(Array.isArray(athData))setAthletes(athData);

      if(Array.isArray(notifData))setNotifs(notifData);

      // If DB has teams, use them exclusively — no seeding on top
