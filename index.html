function ResetPasswordScreen({onDone}){
  const[pass,setPass]=useState("");
  const[pass2,setPass2]=useState("");
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");
  const[done,setDone]=useState(false);

  const submit=async()=>{
    if(!pass||pass.length<6){setErr("Password must be at least 6 characters.");return;}
    if(pass!==pass2){setErr("Passwords do not match.");return;}
    setLoading(true);setErr("");
    const r=await fetch(`${SURL}/auth/v1/user`,{
      method:"PUT",
      headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`},
      body:JSON.stringify({password:pass})
    });
    const d=await r.json();
    setLoading(false);
    if(!r.ok){setErr("Error: "+(d.message||JSON.stringify(d)));return;}
    setDone(true);
    setTimeout(()=>onDone(),2500);
  };

  if(done)return(
    <div className="auth-wrap"><div className="auth-card" style={{textAlign:"center"}}>
      <div style={{fontSize:44,marginBottom:10}}>✅</div>
      <div style={{fontSize:18,fontWeight:800,marginBottom:8,color:"#27c97a"}}>Password Updated!</div>
      <div style={{fontSize:12,color:"#6b82a0"}}>Taking you to sign in...</div>
    </div></div>
  );

  return(
    <div className="auth-wrap"><div className="auth-card">
      <div className="alogo">
        <div style={{fontSize:34,marginBottom:5}}>🔑</div>
        <div className="at">New <em>Password</em></div>
        <div className="asub">Choose a new password for your account</div>
      </div>
      {err&&<div className="err2">{err}</div>}
      <div className="fg"><label>New Password</label><input className="inp" type="password" placeholder="At least 6 characters" value={pass} onChange={e=>setPass(e.target.value)}/></div>
      <div className="fg"><label>Confirm Password</label><input className="inp" type="password" placeholder="Same password again" value={pass2} onChange={e=>setPass2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
      <button className="bmain" onClick={submit} disabled={loading||!pass||!pass2}>{loading?"Saving...":"Set New Password"}</button>
    </div></div>
  );
}

function AuthScreen({onAuth}){
  const[isUp,setIsUp]=useState(false);
  const[forgotPw,setForgotPw]=useState(false);
  const[resetSent,setResetSent]=useState(false);
  const[role,setRole]=useState("coach");
  const[name,setName]=useState("");
  const[email,setEmail]=useState("");
  const[pass,setPass]=useState("");
  const[pos,setPos]=useState("Pitcher");
  const[grad,setGrad]=useState(2027);
  const[ageGroup,setAgeGroup]=useState("");
  const[useAgeGroup,setUseAgeGroup]=useState(false);
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState("");
  const[logs,setLogs]=useState([]);
  const[checkEmail,setCheckEmail]=useState(false);
  const log=(m)=>setLogs(p=>[...p,m]);

  const sendReset=async()=>{
    if(!email){setErr("Enter your email first.");return;}
    setLoading(true);setErr("");
    const r=await fetch(`${SURL}/auth/v1/recover`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY},body:JSON.stringify({email})});
    setLoading(false);
    if(r.ok){setResetSent(true);}
    else{const d=await r.json().catch(()=>({}));setErr("Error: "+(d.message||JSON.stringify(d)));}
  };

  const submit=async()=>{
    setErr("");setLoading(true);setLogs([]);
    try{
      if(isUp){
        log("Creating account...");
        const{data,error:e}=await sb.auth.signUp(email,pass);
        log("Auth: "+JSON.stringify({id:data?.user?.id,sess:!!data?.session,err:e?.message}));
        if(e)throw new Error("Signup failed: "+(e.message||e.error_description||JSON.stringify(e)));
        if(!data?.user)throw new Error("No user returned — check URL/key");
        log("Saving profile...");
        const pd={id:data.user.id,email,name:name||email.split("@")[0],role,position:role==="athlete"?pos:null,grad:role==="athlete"&&!useAgeGroup?parseInt(grad):null,age_group:role==="athlete"&&useAgeGroup?ageGroup:null,avatar:ini(name||email),measurables:{}};
        const{error:pe}=await sb.from("profiles").insert(pd);
        log("Profile: "+(pe?JSON.stringify(pe):"ok"));
        if(pe){
          const msg=pe.message||pe.hint||pe.code||JSON.stringify(pe);
          if(msg.includes("relation")||msg.includes("does not exist")||pe.code==="42P01")throw new Error("❌ Run diamondtrack_schema.sql in Supabase SQL Editor first");
          if(pe.code==="23505")throw new Error("Email already registered — try Sign In");
          throw new Error("Profile error: "+msg);
        }
        if(!data.session)setCheckEmail(true);
        else onAuth(pd);
      }else{
        log("Signing in...");
        const{data,error:e}=await sb.auth.signIn(email,pass);
        log("Auth: "+JSON.stringify({id:data?.user?.id,err:e?.message}));
        if(e)throw new Error("Sign in failed: "+(e.message||e.error_description||JSON.stringify(e)));
        log("Loading profile...");
        const{data:prof,error:pe}=await sb.from("profiles").select("*").eq("id",data.user.id).maybeSingle();
        log("Profile: "+(prof?"found":"not found — "+JSON.stringify(pe)));
        if(!prof)throw new Error("Profile not found — run SQL schema in Supabase first");
        onAuth(prof);
      }
    }catch(e){setErr(e.message);}
    setLoading(false);
  };

  if(resetSent)return(
    <div className="auth-wrap"><div className="auth-card" style={{textAlign:"center"}}>
      <div style={{fontSize:44,marginBottom:10}}>📧</div>
      <div style={{fontSize:18,fontWeight:800,marginBottom:8}}>Check your email</div>
      <div style={{fontSize:12,color:"#6b82a0",lineHeight:1.7}}>We sent a password reset link to<br/><strong style={{color:"#eef2f8"}}>{email}</strong><br/>Click it to set a new password.</div>
      <button className="bmain" style={{marginTop:14}} onClick={()=>{setResetSent(false);setForgotPw(false);}}>Back to Sign In</button>
    </div></div>
  );

  if(forgotPw)return(
    <div className="auth-wrap"><div className="auth-card">
      <div className="alogo">
        <div style={{fontSize:34,marginBottom:5}}>🔑</div>
        <div className="at">Reset <em>Password</em></div>
        <div className="asub">Enter your email and we will send a reset link</div>
      </div>
      {err&&<div className="err2">{err}</div>}
      <div className="fg"><label>Email</label><input className="inp" type="email" placeholder="you@email.com" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendReset()}/></div>
      <button className="bmain" onClick={sendReset} disabled={loading||!email}>{loading?"Sending...":"Send Reset Link"}</button>
      <div className="tl" style={{marginTop:12}}><button onClick={()=>{setForgotPw(false);setErr("");}}>← Back to Sign In</button></div>
    </div></div>
  );

  if(checkEmail)return(
    <div className="auth-wrap"><div className="auth-card" style={{textAlign:"center"}}>
      <div style={{fontSize:44,marginBottom:10}}>📧</div>
      <div style={{fontSize:18,fontWeight:800,marginBottom:8}}>Check your email</div>
      <div style={{fontSize:12,color:"#6b82a0",lineHeight:1.6}}>Confirmation sent to <strong style={{color:"#eef2f8"}}>{email}</strong>.<br/>Click it then come back to Sign In.</div>
      <button className="bmain" style={{marginTop:14}} onClick={()=>{setCheckEmail(false);setIsUp(false);}}>Back to Sign In</button>
    </div></div>
  );

  return(
    <div className="auth-wrap"><div className="auth-card">
      <div className="alogo">
        <div style={{fontSize:34,marginBottom:5}}>⚾</div>
        <div className="at">Diamond<em>Track</em></div>
        <div className="asub">{isUp?"Create account":"Sign in"}</div>
      </div>
      {isUp&&<>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:".4px",color:"#6b82a0",marginBottom:6}}>I am a...</div>
          <div className="rp">
            {[["coach","🎓","Coach"],["athlete","⚾","Athlete"]].map(([r,ic,lb])=>(
              <div key={r} className={`rb ${role===r?"on":""}`} onClick={()=>setRole(r)}>
                <div className="ri2">{ic}</div><div className="rl">{lb}</div>
              </div>
            ))}
          </div>
        </div>
        <div className="fg"><label>Full Name</label><input className="inp" placeholder="First Last" value={name} onChange={e=>setName(e.target.value)}/></div>
        {role==="athlete"&&<>
          <div className="fg"><label>Position</label><select className="inp" value={pos} onChange={e=>setPos(e.target.value)}>{ALL_POS.map(p=><option key={p}>{p}</option>)}</select></div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
            <button onClick={()=>setUseAgeGroup(false)} style={{flex:1,padding:"7px",borderRadius:7,border:`1px solid ${!useAgeGroup?"#e8a020":"rgba(255,255,255,.12)"}`,background:!useAgeGroup?"rgba(232,160,32,.08)":"transparent",color:!useAgeGroup?"#e8a020":"#8fa3be",fontSize:11,fontWeight:700,cursor:"pointer"}}>Grad Year</button>
            <button onClick={()=>setUseAgeGroup(true)} style={{flex:1,padding:"7px",borderRadius:7,border:`1px solid ${useAgeGroup?"#e8a020":"rgba(255,255,255,.12)"}`,background:useAgeGroup?"rgba(232,160,32,.08)":"transparent",color:useAgeGroup?"#e8a020":"#8fa3be",fontSize:11,fontWeight:700,cursor:"pointer"}}>Age Group</button>
          </div>
          {!useAgeGroup?<div className="fg"><label>Grad Year</label><select className="inp" value={grad} onChange={e=>setGrad(e.target.value)}>{GRAD_YEARS.map(y=><option key={y}>{y}</option>)}</select></div>:<div className="fg"><label>Age Group</label><select className="inp" value={ageGroup} onChange={e=>setAgeGroup(e.target.value)}><option value="">Select...</option>{AGE_GROUPS.map(g=><option key={g}>{g}</option>)}</select></div>}
        </>}
      </>}
      {err&&<div className="err2">{err}</div>}
      {logs.length>0&&<div className="dbgp">{logs.map((l,i)=><div key={i}>{l}</div>)}</div>}
      <div className="fg"><label>Email</label><input className="inp" type="email" placeholder="you@email.com" value={email} onChange={e=>setEmail(e.target.value)}/></div>
      <div className="fg"><label>Password</label><input className="inp" type="password" placeholder="••••••••" value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}/></div>
      <button className="bmain" onClick={submit} disabled={loading}>{loading?"Loading...":isUp?"Create Account":"Sign In"}</button>
      <div className="tl">{isUp?"Already have an account?":"Need an account?"} <button onClick={()=>{setIsUp(!isUp);setErr("");setLogs([]);}}>{isUp?"Sign In":"Sign Up"}</button></div>
      {!isUp&&<div className="tl" style={{marginTop:6}}><button onClick={()=>{setForgotPw(true);setErr("");setLogs([]);}}>Forgot password?</button></div>}
    </div></div>
  );
}
function App(){
  const[profile,setProfile]=useState(null);
  const[loading,setLoading]=useState(true);
  const[resetMode,setResetMode]=useState(false);

  // Check if this is a password reset redirect from Supabase email
  useEffect(()=>{
    const hash=window.location.hash;
    const params=new URLSearchParams(hash.replace("#","?").replace("#","&"));
    const type=params.get("type");
    const accessToken=params.get("access_token");
    if((type==="recovery"||type==="signup")&&accessToken){
      _tok=accessToken;
      try{localStorage.setItem("dt",JSON.stringify({access_token:accessToken,expires_at:Date.now()/1000+3600}));}catch(e){}
      if(type==="recovery"){setResetMode(true);setLoading(false);}
      window.history.replaceState(null,"",window.location.pathname);
    }
  },[]);
  const[athletes,setAthletes]=useState([]);
  const[programs,setPrograms]=useState([]);
  const[logs,setLogs]=useState({});
  const[sessions,setSessions]=useState({});
  const[measHist,setMeasHist]=useState({});
  const[selfLogs,setSelfLogs]=useState([]);
  const[notifs,setNotifs]=useState([]);
  const[coachPage,setCoachPage]=useState("dashboard");
  const[viewAth,setViewAth]=useState(null);
  const[viewProg,setViewProg]=useState(null);
  const[modal,setModal]=useState(null);
  const[workoutView,setWorkoutView]=useState(null);
  const[showNotif,setShowNotif]=useState(false);
  const[gradF,setGradF]=useState(null);
  const[groupF,setGroupF]=useState(null);
  const isCoach=profile?.role==="coach";
  const isAthlete=profile?.role==="athlete";

  useEffect(()=>{
    const s=sb.auth.stored();
    if(s?.user){
      sb.from("profiles").select("*").eq("id",s.user.id).maybeSingle().then(({data})=>{
        if(data)setProfile(data);
        setLoading(false);
      });
    }else setLoading(false);
  },[]);

  useEffect(()=>{
    if(!profile)return;
    loadAll();
  },[profile?.id]);

  const loadAll=async()=>{
    const[ar,pr,nr]=await Promise.all([
      sb.from("profiles").select("*").eq("role","athlete"),
      sb.from("programs").select("*"),
      sb.from("notifications").select("*").eq("recipient_id",profile.id).order("created_at",{ascending:false}).limit(40),
    ]);
    if(ar.data)setAthletes(ar.data);
    if(pr.data)setPrograms(pr.data.map(p=>({...p,days:p.days||[],targetGrads:p.target_grads||[],targetGroups:p.target_groups||[],athleteId:p.athlete_id,isGroup:p.is_group_program})));
    if(nr.data)setNotifs(nr.data);
    // Load self_logs for all athletes (coach view)
    if(profile.role==="coach"){
      const{data:slAll}=await sb.from("self_logs").select("*").order("created_at",{ascending:false});
      if(slAll)setSelfLogs(slAll);
    }
    if(profile.role==="athlete"){
      const[lr,sr,slr,mhr]=await Promise.all([
        sb.from("workout_logs").select("*").eq("athlete_id",profile.id),
        sb.from("workout_sessions").select("*").eq("athlete_id",profile.id),
        sb.from("self_logs").select("*").eq("athlete_id",profile.id).order("created_at",{ascending:false}),
        sb.from("measurable_history").select("*").eq("athlete_id",profile.id).order("recorded_at",{ascending:true}),
      ]);
      const lm={};lr.data?.forEach(l=>{lm[`${l.program_id}-${l.exercise_id}`]=l;});setLogs(lm);
      const sm={};sr.data?.forEach(s=>{sm[`${s.program_id}-${s.athlete_id}`]=s;});setSessions(sm);
      if(slr.data)setSelfLogs(slr.data.map(l=>({...l,metrics:l.metrics||{},exercises:l.exercises||[]})));
      if(mhr.data)setMeasHist({[profile.id]:mhr.data});
    }else{
      const[lr,sr,mhr]=await Promise.all([
        sb.from("workout_logs").select("*"),
        sb.from("workout_sessions").select("*"),
        sb.from("measurable_history").select("*").order("recorded_at",{ascending:true}),
      ]);
      const lm={};lr.data?.forEach(l=>{lm[`${l.program_id}-${l.athlete_id}-${l.exercise_id}`]=l;});setLogs(lm);
      const sm={};sr.data?.forEach(s=>{sm[`${s.program_id}-${s.athlete_id}`]=s;});setSessions(sm);
      const mm={};mhr.data?.forEach(m=>{if(!mm[m.athlete_id])mm[m.athlete_id]=[];mm[m.athlete_id].push(m);});setMeasHist(mm);
    }
  };

  const getLog=(pId,exId)=>logs[`${pId}-${profile?.id}-${exId}`]||{};
  const isSaved=(pId,exId,aid)=>!!(logs[`${pId}-${aid||profile?.id}-${exId}`]?.saved);
  const calcPct=(prog,aid)=>{if(!prog)return 0;const all=(prog.days||[]).flatMap(d=>d.exercises||[]);if(!all.length)return 0;return Math.round(all.filter(ex=>isSaved(prog.id,ex.id,aid||profile?.id)).length/all.length*100);};
  const getSess=(pId,aid)=>sessions[`${pId}-${aid||profile?.id}`]||{};

  const saveEx=async(pId,exId,field,val,markSaved=false)=>{
    const now=new Date().toISOString();
    const data={program_id:pId,athlete_id:profile.id,exercise_id:exId,[field]:val};
    if(markSaved){data.saved=true;data.saved_at=now;}
    const sk=`${pId}-${profile.id}`;
    if(!sessions[sk]?.started_at){
      await sb.from("workout_sessions").upsert({program_id:pId,athlete_id:profile.id,started_at:now},{onConflict:"program_id,athlete_id"});
      setSessions(p=>({...p,[sk]:{...p[sk],started_at:now,program_id:pId,athlete_id:profile.id}}));
    }
    await sb.from("workout_logs").upsert(data,{onConflict:"program_id,athlete_id,exercise_id"});
    setLogs(p=>({...p,[`${pId}-${profile.id}-${exId}`]:{...(p[`${pId}-${profile.id}-${exId}`]||{}),...data}}));
  };

  const markComplete=async(pId)=>{
    const sk=`${pId}-${profile.id}`;const sess=sessions[sk]||{};
    if(sess.completed_at)return;
    const now=new Date().toISOString();
    const dur=sess.started_at?Math.round((Date.now()-new Date(sess.started_at))/60000):null;
    // Save session completion
    const{error:se}=await sb.from("workout_sessions").upsert({program_id:pId,athlete_id:profile.id,completed_at:now,duration_minutes:dur},{onConflict:"program_id,athlete_id"});
    if(se){console.error("Session save error:",se);return;}
    setSessions(p=>({...p,[sk]:{...p[sk],completed_at:now,duration_minutes:dur}}));
    // Log to journal
    const prog=programs.find(p=>p.id===pId);
    const allEx=(prog?.days||[]).flatMap(d=>d.exercises||[]);
    const doneEx=allEx.filter(ex=>isSaved(pId,ex.id));
    const journalEntry={
      type:"Workout",
      metrics:{
        program:prog?.name||"",
        exercises:String(doneEx.length),
        duration:dur?String(dur):"",
        week:prog?.week||""
      },
      notes:`Completed: ${prog?.name||"workout"}${dur?" in "+Math.floor(dur/60)+"h "+dur%60+"m":""}.
${doneEx.map(e=>e.name).join(", ")}`,
      date_label:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})
    };
    const jr=await fetch(`${SURL}/rest/v1/self_logs`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify([{athlete_id:profile.id,...journalEntry}])});
    if(jr.ok){
      const{data:allLogs}=await sb.from("self_logs").select("*").eq("athlete_id",profile.id).order("created_at",{ascending:false});
      if(allLogs)setSelfLogs(allLogs.map(l=>({...l,metrics:l.metrics||{},exercises:l.exercises||[]})));
    }
    // Notify all coaches
    const{data:coaches}=await sb.from("profiles").select("id").eq("role","coach");
    if(coaches?.length){
      const notifRows=coaches.map(co=>({
        recipient_id:co.id,
        type:"completed",
        athlete_id:profile.id,
        athlete_name:profile.name||profile.email,
        program_name:prog?.name||"",
        duration_minutes:dur,
        read:false
      }));
      const{error:ne}=await sb.from("notifications").insert(notifRows);
      if(ne)console.error("Notification error:",ne);
    }
  };

  const saveProgram=async(prog)=>{
    const{data,error}=await sb.from("programs").insert({name:prog.name,week:prog.week,athlete_id:prog.athleteId||null,is_group_program:prog.isGroup||false,target_grads:prog.targetGrads||[],target_groups:prog.targetGroups||[],days:prog.days,created_by:profile.id});
    if(error){alert("Error saving program: "+(error.message||error.hint||JSON.stringify(error)));return;}
    // Reload programs from DB to get the saved data with IDs
    const{data:all}=await sb.from("programs").select("*");
    if(all)setPrograms(all.map(p=>({...p,days:p.days||[],targetGrads:p.target_grads||[],targetGroups:p.target_groups||[],athleteId:p.athlete_id,isGroup:p.is_group_program})));
  };

  const saveAthlete=async(ath)=>{
    const row={email:ath.email||`athlete_${Date.now()}@diamondtrack.local`,name:ath.name,role:"athlete",position:ath.position,grad:ath.grad||null,age_group:ath.age_group||null,gpa:ath.gpa||null,high_school:ath.high_school||null,dream_school:ath.dreamSchool||ath.dream_school||null,height:ath.height||null,weight:ath.weight||null,bats:ath.bats||null,throws:ath.throws||null,committed:ath.committed||false,avatar:ini(ath.name),measurables:ath.measurables||{}};
    if(ath.id){
      console.log("Saving athlete profile:",ath.id,JSON.stringify(row));
      const r=await fetch(`${SURL}/rest/v1/profiles?id=eq.${ath.id}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify(row)});
      const rtext=await r.text();
      console.log("profile update response:",r.status,rtext);
      if(!r.ok){alert("Profile save failed ("+r.status+"):\n"+rtext);return null;}
      const r2=await fetch(`${SURL}/rest/v1/profiles?id=eq.${ath.id}&select=*`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Accept":"application/vnd.pgrst.object+json"}});
      const fresh=await r2.json().catch(()=>null);
      if(fresh&&fresh.id){setAthletes(p=>p.map(a=>a.id===fresh.id?fresh:a));}
      return fresh||{...ath,...row};
    }else{
      // Sign up athlete with a temporary password so they exist in auth.users
      const tempPw="DiamondTrack_"+Math.random().toString(36).slice(2,10)+"!";
      const email=ath.email||`athlete_${Date.now()}@diamondtrack.local`;
      const r=await fetch(`${SURL}/auth/v1/signup`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY},body:JSON.stringify({email,password:tempPw})});
      const authData=await r.json();
      if(!r.ok){
        // If already exists, try to find their profile
        const{data:existing}=await sb.from("profiles").select("*").eq("email",email).maybeSingle();
        if(existing){setAthletes(p=>[...p,existing]);return;}
        alert("Could not create athlete account: "+(authData.message||authData.msg||JSON.stringify(authData)));
        return;
      }
      const uid=authData.user?.id||authData.id;
      if(!uid){alert("No user ID returned from Supabase");return;}
      const{data,error:pe}=await sb.from("profiles").insert({...row,email,id:uid}).select().single();
      if(pe){const msg=pe.message||pe.hint||pe.code||JSON.stringify(pe);if(msg.includes("age_group")||msg.includes("column")){alert("Missing DB column - run in Supabase SQL Editor: ALTER TABLE profiles ADD COLUMN IF NOT EXISTS age_group text;");}else{alert("Save error: "+msg);}return;}
      if(data)setAthletes(p=>[...p,data]);
      // Also reload full list from server to catch any RLS-filtered results
      sb.from("profiles").select("*").eq("role","athlete").then(({data:all})=>{if(all&&all.length>0)setAthletes(all);});
      alert("\u2705 "+ath.name+" added!\n\nLogin: https://rabaseball.github.io/diamondtrack\nEmail: "+email+"\nTemp password: "+tempPw+"\n\nShare these credentials with the athlete.");
    }
  };

  const saveMeas=async(athId,entry)=>{
    const filtered=Object.fromEntries(Object.entries(entry).filter(([k,v])=>v!==null&&v!==""));
    if(!Object.keys(filtered).length){alert("Enter at least one value first.");return false;}
    const now=new Date().toISOString();
    const payload={athlete_id:athId,...filtered,recorded_by:profile.id,recorded_at:now,date_label:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})};
    console.log("saveMeas payload:",JSON.stringify(payload));
    const r=await fetch(`${SURL}/rest/v1/measurable_history`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify([payload])});
    const rtext=await r.text();
    console.log("saveMeas response:",r.status,rtext);
    if(!r.ok){alert("Measurable save failed ("+r.status+"):\n"+rtext);return false;}
    const merged={...(athletes.find(a=>a.id===athId)?.measurables||{}),...filtered};
    const r2=await fetch(`${SURL}/rest/v1/profiles?id=eq.${athId}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify({measurables:merged})});
    const r2text=await r2.text();
    console.log("profile measurables update:",r2.status,r2text);
    if(!r2.ok){alert("Profile measurables update failed ("+r2.status+"):\n"+r2text);return false;}
    setAthletes(p=>p.map(a=>a.id===athId?{...a,measurables:merged}:a));
    const r3=await fetch(`${SURL}/rest/v1/measurable_history?athlete_id=eq.${athId}&order=recorded_at.asc`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    const hist=await r3.json().catch(()=>[]);
    if(Array.isArray(hist))setMeasHist(p=>({...p,[athId]:hist}));
    return true;
  };

  const saveSelfLog=async(entry)=>{
    const{data,error}=await sb.from("self_logs").insert({athlete_id:profile.id,...entry});
    if(error){
      const msg=error.message||error.hint||JSON.stringify(error);
      if(msg.includes("relation")||msg.includes("does not exist")){
        alert("❌ The self_logs table is missing. Run diamondtrack_schema.sql in Supabase SQL Editor.");
      } else {
        alert("Error saving session: "+msg);
      }
      return false;
    }
    // Reload self logs from DB
    const{data:all}=await sb.from("self_logs").select("*").eq("athlete_id",profile.id).order("created_at",{ascending:false});
    if(all)setSelfLogs(all.map(l=>({...l,metrics:l.metrics||{},exercises:l.exercises||[]})));
    return true;
  };



  const logout=async()=>{await sb.auth.signOut();setProfile(null);};
  const unreadN=notifs.filter(n=>!n.read).length;

  const athProgs=useMemo(()=>{
    if(!isAthlete||!profile)return[];
    return programs.filter(p=>{
      if(p.athleteId===profile.id)return true;
      if(!p.isGroup)return false;
      const g=getPG(profile.position);
      return(!p.targetGrads?.length||p.targetGrads.includes(profile.grad))&&(!p.targetGroups?.length||p.targetGroups.includes(g));
    });
  },[programs,profile]);

  const filtAthletes=useMemo(()=>{
    let l=athletes;
    if(gradF){
      // gradF could be a number (grad year) or string (age group like "10U")
      const isNum=typeof gradF==="number"||!isNaN(Number(gradF));
      if(isNum)l=l.filter(a=>a.grad===Number(gradF));
      else l=l.filter(a=>a.age_group===gradF);
    }
    if(groupF)l=l.filter(a=>getPG(a.position)===groupF);
    return l;
  },[athletes,gradF,groupF]);

  if(loading)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"#6b82a0",fontSize:15,letterSpacing:1}}>Loading DiamondTrack...</div>;
  if(resetMode)return<><style>{CSS}</style><ResetPasswordScreen onDone={()=>setResetMode(false)}/></>;
  if(!profile)return<><style>{CSS}</style><AuthScreen onAuth={setProfile}/></>;

  const coachBody=()=>{
    if(viewAth&&coachPage==="athletes")return<AthDetail athlete={viewAth} programs={programs} logs={logs} sessions={sessions} calcPct={calcPct} getSess={getSess} isSaved={isSaved} onBack={()=>setViewAth(null)} measHist={measHist[viewAth.id]||[]} selfLogs={selfLogs.filter(l=>l.athlete_id===viewAth.id)} onSaveMeas={e=>saveMeas(viewAth.id,e)} onSaveAth={async(ath)=>{const fresh=await saveAthlete(ath);if(fresh)setViewAth(fresh);}}/>;
    if(viewProg&&coachPage==="programs")return<ProgDetail prog={viewProg} athletes={athletes} logs={logs} sessions={sessions} calcPct={calcPct} isSaved={isSaved} getSess={getSess} onBack={()=>setViewProg(null)} onClickAth={a=>{setViewAth(a);setCoachPage("athletes");}}/>;
    switch(coachPage){
      case"dashboard":return<Dashboard athletes={athletes} programs={programs} calcPct={calcPct} setCoachPage={setCoachPage} setViewAth={setViewAth}/>;
      case"athletes":return<AthRoster athletes={filtAthletes} allAthletes={athletes} programs={programs} calcPct={calcPct} gradF={gradF} setGradF={setGradF} groupF={groupF} setGroupF={setGroupF} onView={a=>setViewAth(a)} onAdd={()=>setModal("addAth")}/>;
      case"programs":return<ProgsPage athletes={athletes} programs={programs} calcPct={calcPct} onView={setViewProg} onAdd={()=>setModal("addProg")} onAddGroup={()=>setModal("addGroup")}/>;
      case"groups":return<GroupsPage athletes={athletes} onClickAth={a=>{setViewAth(a);setCoachPage("athletes");}}/>;

      case"notifications":return<NotifPage notifs={notifs} setNotifs={setNotifs}/>;
      default:return null;
    }
  };

  return(
    <><style>{CSS}</style>
    <div className="app">
      <header className="hdr">
        {isCoach&&(viewAth||viewProg)&&<button onClick={()=>{setViewAth(null);setViewProg(null);}} style={{background:"rgba(232,160,32,.15)",border:"1px solid rgba(232,160,32,.3)",borderRadius:7,color:"#e8a020",padding:"5px 12px",cursor:"pointer",fontSize:13,fontWeight:700,marginRight:8}}>← Back</button>}
        <div className="hdr-brand" style={{cursor:"pointer"}} onClick={()=>{setViewAth(null);setViewProg(null);setCoachPage("dashboard");}}>Diamond<em>Track</em></div>
        <div className="hdr-right">
          {isCoach&&<>
            <div style={{position:"relative"}}>
              <button className="btn bgh bsm" style={{padding:"6px 9px",position:"relative"}} onClick={()=>setShowNotif(p=>!p)}>
                🔔{unreadN>0&&<span style={{position:"absolute",top:1,right:1,width:14,height:14,borderRadius:"50%",background:"#e84040",color:"#fff",fontSize:8,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{unreadN>9?"9+":unreadN}</span>}
              </button>
              {showNotif&&<NotifPanel notifs={notifs} setNotifs={setNotifs} onClose={()=>setShowNotif(false)} profile={profile}/>}
            </div>

          </>}
          <div className="ubadge">
            <div className="uav">{profile.avatar||ini(profile.name)}</div>
            <div style={{fontSize:12,fontWeight:600}}>{profile.name?.split(" ")[0]}</div>
            <button className="btn bgh bsm" style={{marginLeft:2}} onClick={logout}>↩</button>
          </div>
        </div>
      </header>
      <div className="layout">
        {isCoach&&<aside className="sb">
          {[["dashboard","🏠","Dashboard"],["athletes","👤","Athletes"],["programs","🏋️","Programs"],["groups","🏷️","Groups"],["notifications","🔔","Notifications"]].map(([id,ic,lb])=>(
            <button key={id} className={`sbn ${coachPage===id&&!viewAth&&!viewProg?"on":""}`} onClick={()=>{setCoachPage(id);setViewAth(null);setViewProg(null);}}>
              <span>{ic}</span><span>{lb}</span>
            </button>
          ))}
        </aside>}
        <main className="body">
          {isCoach&&coachBody()}
          {isAthlete&&(workoutView
            ?<WorkoutLogger prog={workoutView} athlete={profile} getLog={getLog} updateLog={(p,e,f,v)=>saveEx(p,e,f,v)} saveEx={(p,e)=>saveEx(p,e,"saved",true,true)} markComplete={markComplete} calcPct={calcPct} onBack={()=>setWorkoutView(null)} getSess={getSess}/>
            :<AthPortal athlete={profile} programs={athProgs} isSaved={isSaved} calcPct={calcPct} setWorkoutView={setWorkoutView} measHist={measHist[profile.id]||[]} selfLogs={selfLogs} onSaveSelfLog={saveSelfLog} profile={profile}/>
          )}
        </main>
      </div>
      {modal==="addAth"&&<AddAthModal onClose={()=>setModal(null)} onSave={a=>{saveAthlete(a);setModal(null);}}/>}
      {modal==="addProg"&&<AddProgModal athletes={athletes} onClose={()=>setModal(null)} onSave={p=>{saveProgram(p);setModal(null);}}/>}
      {modal==="addGroup"&&<AddGroupModal athletes={athletes} onClose={()=>setModal(null)} onSave={p=>{saveProgram(p);setModal(null);}}/>}
      {isCoach&&<nav className="bnav">
        {[["dashboard","🏠","Home"],["athletes","👤","Roster"],["programs","🏋️","Programs"],["groups","🏷️","Groups"],["notifications","🔔","Alerts"]].map(([id,ic,lb])=>(
          <button key={id} className={`bnavb ${coachPage===id&&!viewAth&&!viewProg?"on":""}`} onClick={()=>{setCoachPage(id);setViewAth(null);setViewProg(null);}}>
            <span className="bnavbi">{ic}</span><span>{lb}</span>
          </button>
        ))}
      </nav>}
    </div></>
  );
}
function Dashboard({athletes,programs,calcPct,setCoachPage,setViewAth}){
  const avgPct=programs.length?Math.round(programs.reduce((s,p)=>s+calcPct(p),0)/programs.length):0;
  const[expandedGroup,setExpandedGroup]=useState(null);
  const[expandedGrad,setExpandedGrad]=useState(null);
  const[expandedAge,setExpandedAge]=useState(null);
  const activeAgeGroups=AGE_GROUPS.filter(g=>athletes.some(a=>a.age_group===g));

  const goAth=(a)=>{setCoachPage("athletes");setViewAth(a);};

  const AthRow=({a})=>{
    const prog=programs.find(p=>p.athleteId===a.id);const pct=prog?calcPct(prog):0;
    return(
      <div className="ri" style={{cursor:"pointer",paddingLeft:12}} onClick={()=>goAth(a)}>
        <div className="riv" style={{width:28,height:28,fontSize:10}}>{a.avatar||ini(a.name)}</div>
        <div style={{flex:1}}><div style={{fontSize:12,fontWeight:600}}>{a.name}</div><div style={{fontSize:10,color:"#6b82a0"}}>{a.position}{a.grad?` · ${a.grad}`:a.age_group?` · ${a.age_group}`:""}</div></div>
        <div style={{fontSize:12,fontWeight:700,color:"#e8a020"}}>{pct}%</div>
        <span style={{fontSize:10,color:"#6b82a0",marginLeft:4}}>→</span>
      </div>
    );
  };

  return(<>
    <div className="pt">Coach <em>Dashboard</em></div>
    <div className="sr">
      <div className="sb2" style={{cursor:"pointer"}} onClick={()=>setCoachPage("athletes")}><div className="sv">{athletes.length}</div><div className="sl">Athletes</div></div>
      <div className="sb2"><div className="sv">{programs.length}</div><div className="sl">Programs</div></div>
      <div className="sb2"><div className="sv">{avgPct}%</div><div className="sl">Avg Complete</div></div>
      <div className="sb2"><div className="sv">{athletes.filter(a=>a.committed).length}</div><div className="sl">Committed</div></div>
    </div>
    <div className="dg">
      <div className="card">
        <div className="ds">Recent Athletes</div>
        {athletes.length===0&&<div className="empty"><div className="ei">👤</div><div className="et">No athletes yet</div></div>}
        {athletes.slice(0,6).map(a=>{const prog=programs.find(p=>p.athleteId===a.id);const pct=prog?calcPct(prog):0;return(
          <div key={a.id} className="ri" style={{cursor:"pointer"}} onClick={()=>goAth(a)}>
            <div className="riv">{a.avatar||ini(a.name)}</div>
            <div><div style={{fontSize:12,fontWeight:600}}>{a.name}</div><div style={{fontSize:10,color:"#6b82a0"}}>{a.position}{a.grad?` · ${a.grad}`:a.age_group?` · ${a.age_group}`:""}</div></div>
            <div style={{marginLeft:"auto",fontSize:14,fontWeight:700,color:"#e8a020"}}>{pct}%</div>
          </div>
        );})}
        {athletes.length>6&&<div style={{textAlign:"center",marginTop:8}}><button className="btn bgh bsm" onClick={()=>setCoachPage("athletes")}>View All {athletes.length} →</button></div>}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        <div className="card">
          <div className="ds">By Position Group</div>
          {Object.keys(POSITION_GROUPS).map(g=>{
            const grpAthletes=athletes.filter(a=>getPG(a.position)===g);
            if(!grpAthletes.length)return null;
            const open=expandedGroup===g;
            return(<div key={g} style={{marginBottom:4}}>
              <div onClick={()=>setExpandedGroup(open?null:g)} style={{display:"flex",alignItems:"center",gap:7,padding:"6px 8px",borderRadius:7,cursor:"pointer",background:open?`${gColor[g]}15`:"transparent",border:`1px solid ${open?gColor[g]:"transparent"}`}}>

function MsgsPage({profile,athletes,messages,sendMsg,chatPartner,setChatPartner}){
  const[showBC,setShowBC]=useState(false);
  const[bcTxt,setBcTxt]=useState("");
  const[bcGrads,setBcGrads]=useState([]);
  const[bcGroups,setBcGroups]=useState([]);
  const[chatTxt,setChatTxt]=useState("");
  const bottomRef=useRef(null);
  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});},[messages.length,chatPartner]);
  const convo=chatPartner?messages.filter(m=>(m.sender_id===profile.id&&m.recipient_id===chatPartner.id)||(m.sender_id===chatPartner.id&&m.recipient_id===profile.id)):[];
  const tc=athletes.filter(a=>{const g=getPG(a.position);return(!bcGrads.length||bcGrads.includes(a.grad))&&(!bcGroups.length||bcGroups.includes(g));}).length;
  const sendDirect=async()=>{if(!chatTxt.trim()||!chatPartner)return;await sendMsg(chatTxt.trim(),chatPartner.id);setChatTxt("");};
  const sendBC=async()=>{if(!bcTxt.trim())return;await sendMsg(bcTxt.trim(),null,true,bcGrads,bcGroups);setBcTxt("");setShowBC(false);};

  if(chatPartner)return(<>
    <button className="bb" onClick={()=>setChatPartner(null)}>← Messages</button>
    <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:14}}>
      <div className="av" style={{width:34,height:34,fontSize:12}}>{chatPartner.avatar||ini(chatPartner.name)}</div>
      <div><div style={{fontWeight:700}}>{chatPartner.name}</div><div style={{fontSize:10,color:"#6b82a0"}}>{chatPartner.position}·{chatPartner.grad}</div></div>
    </div>
    <div className="card" style={{padding:0,overflow:"hidden",display:"flex",flexDirection:"column",height:"calc(100vh - 280px)"}}>
      <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",gap:8,padding:14}}>
        {convo.length===0&&<div className="empty" style={{padding:"16px 0"}}><div className="ei">💬</div><div className="et" style={{fontSize:13}}>No messages yet</div></div>}
        {convo.map(m=>{const mine=m.sender_id===profile.id;return(<div key={m.id} className={`msgrow ${mine?"me":"them"}`}><div className={`msgbub ${mine?"me":"them"}`}>{m.content}</div><div className="msgt">{fmtT(m.created_at)}</div></div>);})}
        <div ref={bottomRef}/>
      </div>
      <div className="hc">
        <input className="inp" style={{flex:1}} placeholder={`Message ${chatPartner.name.split(" ")[0]}...`} value={chatTxt} onChange={e=>setChatTxt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendDirect()}/>
        <button className="btn bg bsm" onClick={sendDirect}>Send</button>
      </div>
    </div>
  </>);

  return(<>
    <div className="ph"><div className="pt">Messages <em>&amp; Broadcasts</em></div><button className="btn bg" onClick={()=>setShowBC(!showBC)}>📢 Broadcast</button></div>
    {showBC&&<div className="card" style={{marginBottom:16,borderColor:"rgba(232,160,32,.25)"}}>
      <div style={{fontWeight:700,fontSize:13,textTransform:"uppercase",color:"#e8a020",marginBottom:12}}>📢 Broadcast Message</div>
      <div style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.07)",borderRadius:8,padding:12,marginBottom:12}}>
        <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:7}}>Target Grad Years (empty = all)</div>
        <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:10}}>{GRAD_YEARS.map(yr=>{const on=bcGrads.includes(yr);return(<button key={yr} onClick={()=>setBcGrads(p=>on?p.filter(y=>y!==yr):[...p,yr])} style={{padding:"4px 10px",borderRadius:12,border:`1px solid ${on?grColor[yr]:"rgba(255,255,255,.12)"}`,background:on?`${grColor[yr]}20`:"transparent",color:on?grColor[yr]:"#8fa3be",fontSize:11,fontWeight:700,cursor:"pointer"}}>{on&&"✓ "}Class of {yr}</button>);})}</div>
        <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:7}}>Target Position Groups</div>
        <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{Object.keys(POSITION_GROUPS).map(g=>{const on=bcGroups.includes(g);return(<button key={g} onClick={()=>setBcGroups(p=>on?p.filter(x=>x!==g):[...p,g])} style={{padding:"4px 10px",borderRadius:12,border:`1px solid ${on?gColor[g]:"rgba(255,255,255,.12)"}`,background:on?`${gColor[g]}20`:"transparent",color:on?gColor[g]:"#8fa3be",fontSize:11,fontWeight:700,cursor:"pointer"}}>{on&&"✓ "}{g}</button>);})}</div>
      </div>
      <div style={{background:"rgba(58,155,232,.06)",border:"1px solid rgba(58,155,232,.2)",borderRadius:7,padding:"7px 10px",marginBottom:10,fontSize:11,color:"#3a9be8"}}>📬 Sending to <strong>{tc} athlete{tc!==1?"s":""}</strong>{!bcGrads.length&&!bcGroups.length?" (entire roster)":""}</div>
      <textarea className="inp" placeholder="Message to athletes..." value={bcTxt} onChange={e=>setBcTxt(e.target.value)} style={{marginBottom:8}}/>
      <div style={{display:"flex",gap:7,justifyContent:"flex-end"}}><button className="btn bgh bsm" onClick={()=>setShowBC(false)}>Cancel</button><button className="btn bg bsm" onClick={sendBC} disabled={!bcTxt.trim()}>Send</button></div>

        const unread=messages.filter(m=>m.sender_id===a.id&&m.recipient_id===profile.id&&!(m.read_by||[]).includes(profile.id)).length;
        return(<div key={a.id} className="card cc" style={{padding:"12px 14px",display:"flex",alignItems:"center",gap:10}} onClick={()=>setChatPartner(a)}>
          <div className="av" style={{width:34,height:34,fontSize:12}}>{a.avatar||ini(a.name)}</div>
          <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,fontSize:13}}>{a.name}</div><div style={{fontSize:10,color:"#6b82a0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{last?last.content:"No messages yet"}</div></div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
            {last&&<div style={{fontSize:9,color:"#6b82a0"}}>{fmtT(last.created_at)}</div>}
            {unread>0&&<span style={{background:"#3a9be8",color:"#fff",borderRadius:"50%",width:16,height:16,fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{unread}</span>}
          </div>
        </div>);
      })}
    </div>
  </>);
}

function SessionJournal({logs,isCoach=false}){
  const[selected,setSelected]=useState(null);
  const[filterType,setFilterType]=useState("All");
  const STYPES_DEF={
    "Weight Training":{icon:"🏋️",color:"#e8a020"},
    "Hitting":{icon:"⚾",color:"#e84040"},
    "Throwing":{icon:"🎯",color:"#3a9be8"},
    "Fielding":{icon:"🥎",color:"#27c97a"},
    "Workout":{icon:"✅",color:"#9b59b6"},
    "Game":{icon:"🏟️",color:"#e67e22"},
    "Practice":{icon:"📋",color:"#8e44ad"},
    "Showcase":{icon:"⭐",color:"#f1c40f"},
  };
  const types=["All",...Object.keys(STYPES_DEF)];
  const filtered=filterType==="All"?logs:logs.filter(l=>l.type===filterType);

  const MetricRow=({label,value})=>value?(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid rgba(255,255,255,.05)"}}>
      <div style={{fontSize:12,color:"#8fa3be"}}>{label}</div>
      <div style={{fontSize:13,fontWeight:700,color:"#eef2f8"}}>{value}</div>
    </div>
  ):null;

  const METRIC_LABELS={
    // Weight Training
    exercises:"Exercises",sets:"Total Sets",topWeight:"Top Weight (lbs)",duration:"Duration (min)",
    // Hitting
    swings:"Total Swings",teeSwings:"Tee Swings",bpSwings:"BP Swings",exitVelo:"Best Exit Velo (mph)",
    // Throwing
    pitches:"Total Throws",bullpenPitches:"Bullpen Pitches",topVelo:"Top Velo (mph)",longTossMax:"Long Toss Max (ft)",
    // Fielding
    groundBalls:"Ground Balls",flyBalls:"Fly Balls",blocking:"Blocking Reps",throws:"Fielding Throws",
    // Workout (program completion)
    program:"Program",week:"Week",
    // Game
    opponent:"Opponent",result:"Result",atBats:"At Bats",hits:"Hits",rbi:"RBI",runs:"Runs Scored",stolenBases:"Stolen Bases",pitchingIP:"Innings Pitched",pitchingK:"Strikeouts",pitchingER:"Earned Runs",
    // Throwing / spin rates
    spinFB:"FB Spin Rate (rpm)",spinCB:"CB Spin Rate (rpm)",spinCH:"CH Spin Rate (rpm)",spinOther:"Other Spin Rate (rpm)",
    // Practice
    focus:"Focus Area",notes_highlights:"Highlights",
    // Showcase
    eventName:"Event Name",location:"Location",sixty:"60-Yard Dash",popTime:"Pop Time",offersReceived:"Offers Received",schoolsPresent:"Schools Present",
  };

  if(selected){
    const def=STYPES_DEF[selected.type]||{icon:"📋",color:"#e8a020"};
    const metrics=selected.metrics||{};
    return(
      <div>
        <button className="bb" onClick={()=>setSelected(null)}>← Journal</button>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
          <div style={{width:44,height:44,borderRadius:10,background:`${def.color}20`,border:`1px solid ${def.color}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{def.icon}</div>
          <div>
            <div style={{fontSize:18,fontWeight:800,color:def.color}}>{selected.type}</div>
            <div style={{fontSize:11,color:"#6b82a0"}}>{selected.date_label||new Date(selected.created_at).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</div>
          </div>
        </div>
        {Object.keys(metrics).length>0&&<div className="card" style={{marginBottom:12}}>
          <div className="ds">Session Numbers</div>
          {Object.entries(metrics).map(([k,v])=>v?<MetricRow key={k} label={METRIC_LABELS[k]||k} value={v}/>:null)}
        </div>}
        {selected.notes&&<div className="card" style={{borderColor:`${def.color}30`}}>
          <div className="ds">Notes</div>
          <div style={{fontSize:14,lineHeight:1.7,color:"#eef2f8",whiteSpace:"pre-wrap"}}>{selected.notes}</div>
        </div>}
        {!selected.notes&&!Object.values(metrics).some(Boolean)&&<div className="empty"><div className="ei">{def.icon}</div><div className="et">No details recorded</div></div>}
      </div>
    );
  }

  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <div style={{fontSize:14,fontWeight:700}}>{isCoach?"Athlete Session Journal":"My Session Journal"}</div>
        <div style={{fontSize:11,color:"#6b82a0"}}>{filtered.length} session{filtered.length!==1?"s":""}</div>
      </div>
      <div className="fb" style={{marginBottom:14}}>
        {types.map(t=>{
          const def=STYPES_DEF[t];
          return(<button key={t} className={`fc ${filterType===t?"on":""}`} onClick={()=>setFilterType(t)} style={filterType===t&&def?{borderColor:def.color,color:def.color,background:`${def.color}15`}:{}}>{def?def.icon+" ":""}{t}</button>);
        })}
      </div>
      {filtered.length===0&&<div className="empty"><div className="ei">📓</div><div className="et">No sessions yet</div><div className="es">{isCoach?"Athlete hasn't logged any sessions.":"Log a session to start your journal."}</div></div>}
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {filtered.map(log=>{
          const def=STYPES_DEF[log.type]||{icon:"📋",color:"#e8a020"};
          const metrics=log.metrics||{};
          const highlights=Object.entries(metrics).filter(([k,v])=>v).slice(0,3);
          return(
            <div key={log.id} className="card cc" onClick={()=>setSelected(log)} style={{borderLeft:`3px solid ${def.color}`,cursor:"pointer"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:highlights.length||log.notes?8:0}}>
                <div style={{fontSize:22}}>{def.icon}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:14,color:def.color}}>{log.type}</div>
                  <div style={{fontSize:11,color:"#6b82a0"}}>{log.date_label||new Date(log.created_at).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</div>
                </div>
                <span style={{fontSize:11,color:"#6b82a0"}}>View →</span>
              </div>
              {highlights.length>0&&<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {highlights.map(([k,v])=>(
                  <div key={k} style={{background:"rgba(255,255,255,.04)",borderRadius:6,padding:"4px 9px"}}>
                    <div style={{fontSize:9,color:"#6b82a0",textTransform:"uppercase",letterSpacing:".3px"}}>{METRIC_LABELS[k]||k}</div>
                    <div style={{fontSize:13,fontWeight:700}}>{v}</div>
                  </div>
                ))}
              </div>}
              {log.notes&&<div style={{marginTop:8,fontSize:12,color:"#8fa3be",fontStyle:"italic",lineHeight:1.5,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>"{log.notes}"</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function WorkoutLogger({prog,athlete,getLog,updateLog,saveEx,markComplete,calcPct,onBack,getSess}){
  const pct=calcPct(prog);
  const sess=getSess?getSess(prog.id):{};
  const[fields,setFields]=useState({});
  const dur=sess.started_at&&sess.completed_at?Math.round((new Date(sess.completed_at)-new Date(sess.started_at))/60000):sess.started_at?Math.round((Date.now()-new Date(sess.started_at))/60000):null;
  useEffect(()=>{if(pct===100&&!sess.completed_at){markComplete(prog.id);}},[pct,sess.completed_at]);
  const handleSave=async(pId,exId)=>{
    const f=fields[exId]||{};
    if(f.reps)await updateLog(pId,exId,"reps",f.reps);
    if(f.weight)await updateLog(pId,exId,"weight",f.weight);
    if(f.sets)await updateLog(pId,exId,"sets",f.sets);
    if(f.notes)await updateLog(pId,exId,"notes",f.notes);
    await saveEx(pId,exId);
  };
  return(<>
    <button className="bb" onClick={onBack}>← My Workouts</button>
    <div className="ph">
      <div><div style={{fontSize:18,fontWeight:800}}>{prog.name}</div><div style={{fontSize:11,color:"#6b82a0"}}>{prog.week}</div></div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
        <span className="bdg bg3">{pct}% Done</span>
        {sess.started_at&&<span style={{fontSize:9,color:"#6b82a0"}}>Started {fmtT(sess.started_at)}{dur!==null?` · ${fmtD(dur)}`:""}</span>}
      </div>
    </div>
    {(prog.days||[]).map((day,di)=>(
      <div key={di} style={{marginBottom:18}}>
        <div style={{fontSize:14,fontWeight:800,textTransform:"uppercase",color:"#e8a020",letterSpacing:".8px",marginBottom:8,paddingBottom:6,borderBottom:"1px solid rgba(255,255,255,.07)"}}>{day.day}</div>
        {(day.exercises||[]).map(ex=>{
          const log=getLog(prog.id,ex.id);const saved=log.saved;
          const f=fields[ex.id]||{};
          const upd=(k,v)=>setFields(p=>({...p,[ex.id]:{...(p[ex.id]||{}),[k]:v}}));
          return(<div key={ex.id} className={`le ${saved?"done":""}`}>
            <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}>
              <div className="lex">{ex.name}</div>
              {saved&&<span className="bdg bg2" style={{marginLeft:"auto"}}>✓ Logged</span>}
            </div>
            <div className="lep">Prescribed: {ex.sets} sets × {ex.reps} reps @ {ex.weight}</div>
            {ex.notes&&<div style={{fontSize:10,color:"#e8a020",marginTop:1}}>Coach: {ex.notes}</div>}
            <div className="lg">
              <div className="lf"><label>Reps Done</label><input className="inp" type="number" placeholder={ex.reps} value={f.reps||log.reps||""} onChange={e=>upd("reps",e.target.value)}/></div>
              <div className="lf"><label>Weight/Load</label><input className="inp" placeholder={ex.weight} value={f.weight||log.weight||""} onChange={e=>upd("weight",e.target.value)}/></div>
              <div className="lf"><label>Sets Done</label><input className="inp" type="number" placeholder={ex.sets} value={f.sets||log.sets||""} onChange={e=>upd("sets",e.target.value)}/></div>
              <div className="lf lfw"><label>Notes</label><input className="inp" placeholder="How did it feel?" value={f.notes||log.notes||""} onChange={e=>upd("notes",e.target.value)}/></div>
            </div>
            <div style={{display:"flex",justifyContent:"flex-end",marginTop:8}}>
              <button className={`btn bsm ${saved?"bgh":"bgn"}`} onClick={()=>handleSave(prog.id,ex.id)}>{saved?"✓ Saved":"Save Exercise"}</button>
            </div>
          </div>);
        })}
      </div>
    ))}
    {pct===100&&<div className="cel"><div style={{fontSize:32}}>🏆</div><div style={{fontSize:20,fontWeight:800,marginTop:8}}>Workout Complete!</div>{dur&&<div style={{color:"#e8a020",fontWeight:700,marginTop:4}}>⏱ {fmtD(dur)}</div>}<div style={{fontSize:12,color:"#8fa3be",marginTop:5}}>Great work, {athlete.name?.split(" ")[0]}. Keep grinding.</div></div>}
  </>);
}
function ExPicker({onSelect,onClose}){
  const[search,setSearch]=useState("");
  const[cat,setCat]=useState("All");
  const[showAdd,setShowAdd]=useState(false);
  const[customDrills,setCustomDrills]=useState([]);
  const[newDrill,setNewDrill]=useState({name:"",cat:"Pitching",sets:3,reps:10,wt:""});

  useEffect(()=>{
    sb.from("custom_exercises").select("*").then(({data})=>{if(data)setCustomDrills(data);});
  },[]);

  const allDrills=[...EXERCISE_LIBRARY,...customDrills.map(d=>({...d,id:"custom_"+d.id}))];
  const filtered=allDrills.filter(e=>(cat==="All"||e.cat===cat)&&(!search||e.name.toLowerCase().includes(search.toLowerCase())));

  const saveDrill=async()=>{
    if(!newDrill.name.trim())return;
    const{data,error}=await sb.from("custom_exercises").insert({name:newDrill.name,cat:newDrill.cat,sets:parseInt(newDrill.sets)||3,reps:parseInt(newDrill.reps)||10,wt:newDrill.wt||"Bodyweight"});
    if(error){alert("Error saving drill: "+(error.message||JSON.stringify(error)));return;}
    const{data:all}=await sb.from("custom_exercises").select("*");
    if(all)setCustomDrills(all);
    setNewDrill({name:"",cat:"Pitching",sets:3,reps:10,wt:""});
    setShowAdd(false);

  return(
    <div className="mbg" style={{zIndex:400}} onClick={onClose}>
      <div className="modal mlg" style={{maxHeight:"92vh",display:"flex",flexDirection:"column"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
          <div className="mt" style={{marginBottom:0}}>Drill <em>Library</em></div>

        </div>
        {showAdd&&<div style={{background:"rgba(232,160,32,.05)",border:"1px solid rgba(232,160,32,.2)",borderRadius:9,padding:12,marginBottom:12}}>
          <div style={{fontSize:12,fontWeight:700,color:"#e8a020",marginBottom:10,textTransform:"uppercase"}}>Add Custom Drill</div>
          <div className="fg"><label>Drill Name *</label><input className="inp" placeholder="e.g. Reverse Pivot Drill" value={newDrill.name} onChange={e=>setNewDrill(p=>({...p,name:e.target.value}))}/></div>
          <div className="fg2">

            <div className="fg"><label>Reps</label><input className="inp" type="number" value={newDrill.reps} onChange={e=>setNewDrill(p=>({...p,reps:e.target.value}))}/></div>
          </div>
          <div style={{display:"flex",gap:7,justifyContent:"flex-end"}}>
            <button className="btn bgh bsm" onClick={()=>setShowAdd(false)}>Cancel</button>
            <button className="btn bg bsm" onClick={saveDrill} disabled={!newDrill.name.trim()}>Save Drill</button>

        </div>}
        <input className="inp" placeholder="🔍 Search drills..." value={search} onChange={e=>setSearch(e.target.value)} style={{marginBottom:10}}/>
        <div className="fb" style={{marginBottom:12,overflowX:"auto",flexWrap:"nowrap",paddingBottom:4}}>{["All",...EX_CATS].map(ct=><button key={ct} className={`fc ${cat===ct?"on":""}`} onClick={()=>setCat(ct)} style={{whiteSpace:"nowrap"}}>{ct}</button>)}</div>

              <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}>
                <div style={{fontWeight:600,fontSize:13}}>{ex.name}</div>
                {ex.id.toString().startsWith("custom_")&&<span style={{fontSize:8,fontWeight:700,textTransform:"uppercase",background:"rgba(232,160,32,.15)",color:"#e8a020",padding:"1px 5px",borderRadius:4}}>Custom</span>}
                <span style={{marginLeft:"auto",fontSize:9,fontWeight:700,textTransform:"uppercase",background:"rgba(58,155,232,.1)",color:"#3a9be8",padding:"1px 6px",borderRadius:6}}>{ex.cat}</span>
              </div>
              <div style={{fontSize:10,color:"#6b82a0"}}>Sets: <strong style={{color:"#eef2f8"}}>{ex.sets}</strong> · Reps: <strong style={{color:"#eef2f8"}}>{ex.reps}</strong>{ex.wt?<> · Load: <strong style={{color:"#eef2f8"}}>{ex.wt}</strong></>:null}</div>

  );

      <div style={{background:"rgba(58,155,232,.06)",border:"1px solid rgba(58,155,232,.2)",borderRadius:7,padding:"9px 12px",marginBottom:12,fontSize:12,color:"#3a9be8"}}>ℹ️ Athlete will receive an email to set their password and log in.</div>
      <div className="fg2"><div className="fg"><label>Full Name *</label><input className="inp" placeholder="First Last" value={f.name} onChange={e=>up("name",e.target.value)}/></div><div className="fg"><label>Email *</label><input className="inp" type="email" placeholder="athlete@email.com" value={f.email} onChange={e=>up("email",e.target.value)}/></div></div>
      <div className="fg"><label>Position</label><select className="inp" value={f.position} onChange={e=>up("position",e.target.value)}>{ALL_POS.map(p=><option key={p}>{p}</option>)}</select></div>
      <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:10}}>
        <button onClick={()=>up("useAge",false)} style={{flex:1,padding:"6px",borderRadius:7,border:`1px solid ${!f.useAge?"#e8a020":"rgba(255,255,255,.12)"}`,background:!f.useAge?"rgba(232,160,32,.08)":"transparent",color:!f.useAge?"#e8a020":"#8fa3be",fontSize:10,fontWeight:700,cursor:"pointer"}}>Grad Year</button>
        <button onClick={()=>up("useAge",true)} style={{flex:1,padding:"6px",borderRadius:7,border:`1px solid ${f.useAge?"#e8a020":"rgba(255,255,255,.12)"}`,background:f.useAge?"rgba(232,160,32,.08)":"transparent",color:f.useAge?"#e8a020":"#8fa3be",fontSize:10,fontWeight:700,cursor:"pointer"}}>Age Group</button>
      </div>
      {!f.useAge?<div className="fg"><label>Grad Year</label><select className="inp" value={f.grad} onChange={e=>up("grad",parseInt(e.target.value))}>{GRAD_YEARS.map(y=><option key={y}>{y}</option>)}</select></div>:<div className="fg"><label>Age Group</label><select className="inp" value={f.ageGroup||""} onChange={e=>up("ageGroup",e.target.value)}><option value="">Select...</option>{AGE_GROUPS.map(g=><option key={g}>{g}</option>)}</select></div>}
      <div className="fg2"><div className="fg"><label>High School</label><input className="inp" placeholder="School name" value={f.high_school||""} onChange={e=>up("high_school",e.target.value)}/></div><div className="fg"><label>GPA</label><input className="inp" placeholder="3.8" value={f.gpa} onChange={e=>up("gpa",e.target.value)}/></div></div>
      <div className="fg3"><div className="fg"><label>Height</label><input className="inp" placeholder='6&apos;1"' value={f.height} onChange={e=>up("height",e.target.value)}/></div><div className="fg"><label>Weight</label><input className="inp" placeholder="185" value={f.weight} onChange={e=>up("weight",e.target.value)}/></div><div className="fg"><label>Dream School</label><input className="inp" placeholder="Vanderbilt" value={f.dreamSchool} onChange={e=>up("dreamSchool",e.target.value)}/></div></div>
      <div className="fg3"><div className="fg"><label>Bats</label><select className="inp" value={f.bats} onChange={e=>up("bats",e.target.value)}><option>R</option><option>L</option><option>S</option></select></div><div className="fg"><label>Throws</label><select className="inp" value={f.throws} onChange={e=>up("throws",e.target.value)}><option>R</option><option>L</option></select></div><div className="fg"><label>Dream School</label><input className="inp" placeholder="Vanderbilt" value={f.dreamSchool} onChange={e=>up("dreamSchool",e.target.value)}/></div></div>
      <div className="mf"><button className="btn bgh bsm" onClick={onClose}>Cancel</button><button className="btn bg bsm" onClick={()=>onSave({...f,grad:f.useAge?null:parseInt(f.grad),age_group:f.useAge?f.ageGroup:null})} disabled={!f.name||!f.email}>+ Add Athlete</button></div>
    </div></div>
  );
}

function AddProgModal({athletes,onClose,onSave}){
  const[step,setStep]=useState(1);
  const[name,setName]=useState("");
  const[athId,setAthId]=useState(athletes[0]?.id||"");
  const[week,setWeek]=useState("Week 1");
  const[days,setDays]=useState([{day:"Monday",exercises:[]},{day:"Wednesday",exercises:[]},{day:"Friday",exercises:[]}]);
  const[activeDay,setActiveDay]=useState(0);
  const[showPicker,setShowPicker]=useState(false);
  const addEx=(ex)=>{const u=[...days];u[activeDay].exercises.push({id:`e${Date.now()}`,name:ex.name,sets:ex.sets,reps:ex.reps,weight:ex.wt,notes:""});setDays(u);setShowPicker(false);};
  const addBlank=()=>{const u=[...days];u[activeDay].exercises.push({id:`e${Date.now()}`,name:"",sets:3,reps:10,weight:"",notes:""});setDays(u);};
  const updEx=(di,ei,k,v)=>{const u=[...days];u[di].exercises[ei][k]=v;setDays(u);};
  const remEx=(di,ei)=>{const u=[...days];u[di].exercises.splice(ei,1);setDays(u);};
  const addDay=()=>{const used=days.map(d=>d.day);const next=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].find(d=>!used.includes(d));if(next)setDays([...days,{day:next,exercises:[]}]);};
  return(<>
    <div className="mbg" onClick={onClose}><div className="modal mlg" onClick={e=>e.stopPropagation()}>
      <div className="mt">New <em>Program</em></div>
      {step===1&&<>
        <div className="fg"><label>Program Name *</label><input className="inp" placeholder="e.g. Arm Strength & Velocity" value={name} onChange={e=>setName(e.target.value)}/></div>
        <div className="fg2"><div className="fg"><label>Athlete *</label><select className="inp" value={athId} onChange={e=>setAthId(e.target.value)}>{athletes.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}</select></div><div className="fg"><label>Week</label><input className="inp" placeholder="Week 1" value={week} onChange={e=>setWeek(e.target.value)}/></div></div>
        <div className="mf"><button className="btn bgh bsm" onClick={onClose}>Cancel</button><button className="btn bg bsm" onClick={()=>setStep(2)} disabled={!name||!athId}>Next: Build Workout →</button></div>
      </>}
      {step===2&&<>
        <div className="fb" style={{marginBottom:12}}>{days.map((d,i)=><button key={i} className={`fc ${activeDay===i?"on":""}`} onClick={()=>setActiveDay(i)}>{d.day} ({d.exercises.length})</button>)}<button className="fc" onClick={addDay}>+ Day</button></div>
        <div style={{display:"flex",gap:7,marginBottom:10}}><button className="btn bg bsm" onClick={()=>setShowPicker(true)}>⚾ Library</button><button className="btn bgh bsm" onClick={addBlank}>+ Blank</button></div>
        <div style={{maxHeight:300,overflowY:"auto"}}>
          {days[activeDay].exercises.length===0&&<div className="empty" style={{padding:"18px 0"}}><div className="ei">⚾</div><div className="et" style={{fontSize:13}}>No exercises yet</div></div>}
          {days[activeDay].exercises.map((ex,ei)=>(
            <div key={ex.id} style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.07)",borderRadius:7,padding:10,marginBottom:8}}>
              <div style={{display:"flex",gap:7,marginBottom:7,alignItems:"center"}}><input className="inp" placeholder="Exercise name" value={ex.name} onChange={e=>updEx(activeDay,ei,"name",e.target.value)} style={{flex:1}}/><button className="btn bgr bsm" onClick={()=>remEx(activeDay,ei)}>✕</button></div>
              <div className="fg3"><div className="fg"><label>Sets</label><input className="inp" type="number" value={ex.sets} onChange={e=>updEx(activeDay,ei,"sets",e.target.value)}/></div><div className="fg"><label>Reps</label><input className="inp" type="number" value={ex.reps} onChange={e=>updEx(activeDay,ei,"reps",e.target.value)}/></div><div className="fg"><label>Load</label><input className="inp" placeholder="45 lbs" value={ex.weight} onChange={e=>updEx(activeDay,ei,"weight",e.target.value)}/></div></div>
              <div className="fg" style={{marginBottom:0}}><label>Coach Notes</label><input className="inp" placeholder="Cues, focus..." value={ex.notes} onChange={e=>updEx(activeDay,ei,"notes",e.target.value)}/></div>
            </div>
          ))}
        </div>
        <div className="mf"><button className="btn bgh bsm" onClick={()=>setStep(1)}>← Back</button><button className="btn bg bsm" onClick={()=>onSave({name,athleteId:athId,week,days:days.filter(d=>d.exercises.length>0)})}>Save Program</button></div>
      </>}
    </div></div>
    {showPicker&&<ExPicker onSelect={addEx} onClose={()=>setShowPicker(false)}/>}
  </>);
}

function AddGroupModal({athletes,onClose,onSave}){
  const[step,setStep]=useState(1);
  const[name,setName]=useState("");
  const[week,setWeek]=useState("Week 1");
  const[tGrads,setTGrads]=useState([]);
  const[tGroups,setTGroups]=useState([]);
  const[days,setDays]=useState([{day:"Monday",exercises:[]},{day:"Wednesday",exercises:[]},{day:"Friday",exercises:[]}]);
  const[activeDay,setActiveDay]=useState(0);
  const[showPicker,setShowPicker]=useState(false);
  const matched=athletes.filter(a=>{const g=getPG(a.position);return(!tGrads.length||tGrads.includes(a.grad))&&(!tGroups.length||tGroups.includes(g));});
  const addEx=(ex)=>{const u=[...days];u[activeDay].exercises.push({id:`e${Date.now()}`,name:ex.name,sets:ex.sets,reps:ex.reps,weight:ex.wt,notes:""});setDays(u);setShowPicker(false);};
  const addBlank=()=>{const u=[...days];u[activeDay].exercises.push({id:`e${Date.now()}`,name:"",sets:3,reps:10,weight:"",notes:""});setDays(u);};
  const updEx=(di,ei,k,v)=>{const u=[...days];u[di].exercises[ei][k]=v;setDays(u);};
  const remEx=(di,ei)=>{const u=[...days];u[di].exercises.splice(ei,1);setDays(u);};
  const addDay=()=>{const used=days.map(d=>d.day);const next=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].find(d=>!used.includes(d));if(next)setDays([...days,{day:next,exercises:[]}]);};
  return(<>
    <div className="mbg" onClick={onClose}><div className="modal mlg" onClick={e=>e.stopPropagation()}>
      <div className="mt">New <em style={{color:"#3a9be8"}}>Group</em> Program</div>
      {step===1&&<>
        <div style={{background:"rgba(58,155,232,.06)",border:"1px solid rgba(58,155,232,.18)",borderRadius:7,padding:"9px 12px",marginBottom:12,fontSize:11,color:"#8fa3be"}}>👥 Auto-assigns to all athletes matching your tags. Leave empty for entire roster.</div>
        <div className="fg"><label>Program Name *</label><input className="inp" placeholder="e.g. Team Arm Care" value={name} onChange={e=>setName(e.target.value)}/></div>
        <div className="fg"><label>Week</label><input className="inp" placeholder="Week 1" value={week} onChange={e=>setWeek(e.target.value)}/></div>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:7}}>Target Grad Years</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{GRAD_YEARS.map(yr=>{const on=tGrads.includes(yr);return(<button key={yr} onClick={()=>setTGrads(p=>on?p.filter(y=>y!==yr):[...p,yr])} style={{padding:"4px 10px",borderRadius:12,border:`1px solid ${on?grColor[yr]:"rgba(255,255,255,.12)"}`,background:on?`${grColor[yr]}20`:"transparent",color:on?grColor[yr]:"#8fa3be",fontSize:11,fontWeight:700,cursor:"pointer"}}>{on&&"✓ "}Class of {yr}</button>);})}</div>
        </div>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:7}}>Target Position Groups</div>
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{Object.keys(POSITION_GROUPS).map(g=>{const on=tGroups.includes(g);return(<button key={g} onClick={()=>setTGroups(p=>on?p.filter(x=>x!==g):[...p,g])} style={{padding:"4px 10px",borderRadius:12,border:`1px solid ${on?gColor[g]:"rgba(255,255,255,.12)"}`,background:on?`${gColor[g]}20`:"transparent",color:on?gColor[g]:"#8fa3be",fontSize:11,fontWeight:700,cursor:"pointer"}}>{on&&"✓ "}{g}</button>);})}</div>
        </div>
        <div style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.07)",borderRadius:8,padding:"9px 12px"}}>
          <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:6}}>Preview — {matched.length} athlete{matched.length!==1?"s":""}</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:5}}>{matched.map(a=><div key={a.id} style={{display:"flex",alignItems:"center",gap:4,background:"rgba(255,255,255,.04)",borderRadius:6,padding:"3px 8px"}}><div style={{width:18,height:18,borderRadius:"50%",background:"linear-gradient(135deg,#3a9be8,#e8a020)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,fontWeight:700,color:"#080e1a"}}>{a.avatar||ini(a.name)}</div><span style={{fontSize:11,fontWeight:600}}>{a.name.split(" ")[0]}</span></div>)}</div>
        </div>
        <div className="mf"><button className="btn bgh bsm" onClick={onClose}>Cancel</button><button className="btn bg bsm" onClick={()=>setStep(2)} disabled={!name}>Next → Build Workout ({matched.length})</button></div>
      </>}
      {step===2&&<>
        <div className="fb" style={{marginBottom:12}}>{days.map((d,i)=><button key={i} className={`fc ${activeDay===i?"on":""}`} onClick={()=>setActiveDay(i)}>{d.day} ({d.exercises.length})</button>)}<button className="fc" onClick={addDay}>+ Day</button></div>
        <div style={{display:"flex",gap:7,marginBottom:10}}><button className="btn bg bsm" onClick={()=>setShowPicker(true)}>⚾ Library</button><button className="btn bgh bsm" onClick={addBlank}>+ Blank</button></div>
        <div style={{maxHeight:300,overflowY:"auto"}}>
          {days[activeDay].exercises.length===0&&<div className="empty" style={{padding:"18px 0"}}><div className="ei">⚾</div><div className="et" style={{fontSize:13}}>No exercises yet</div></div>}
          {days[activeDay].exercises.map((ex,ei)=>(
            <div key={ex.id} style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.07)",borderRadius:7,padding:10,marginBottom:8}}>
              <div style={{display:"flex",gap:7,marginBottom:7,alignItems:"center"}}><input className="inp" placeholder="Exercise name" value={ex.name} onChange={e=>updEx(activeDay,ei,"name",e.target.value)} style={{flex:1}}/><button className="btn bgr bsm" onClick={()=>remEx(activeDay,ei)}>✕</button></div>
              <div className="fg3" style={{marginBottom:7}}><div className="fg"><label>Sets</label><input className="inp" type="number" value={ex.sets} onChange={e=>updEx(activeDay,ei,"sets",e.target.value)}/></div><div className="fg"><label>Reps</label><input className="inp" type="number" value={ex.reps} onChange={e=>updEx(activeDay,ei,"reps",e.target.value)}/></div><div className="fg"><label>Load</label><input className="inp" placeholder="45 lbs" value={ex.weight} onChange={e=>updEx(activeDay,ei,"weight",e.target.value)}/></div></div>
              <input className="inp" placeholder="Coach notes..." value={ex.notes} onChange={e=>updEx(activeDay,ei,"notes",e.target.value)}/>
            </div>
          ))}
        </div>
        <div className="mf"><button className="btn bgh bsm" onClick={()=>setStep(1)}>← Back</button><button className="btn bg bsm" onClick={()=>onSave({name,week,isGroup:true,targetGrads:tGrads,targetGroups:tGroups,days:days.filter(d=>d.exercises.length>0)})}>Save Group Program</button></div>
      </>}
    </div></div>
    {showPicker&&<ExPicker onSelect={addEx} onClose={()=>setShowPicker(false)}/>}
  </>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
