          {editEvent&&<button className="btn bgr" onClick={()=>deleteEvent(editEvent.id)}>Delete</button>}
          <button className="btn bgh" onClick={()=>setShowEventForm(false)}>Cancel</button>
        </div>
      </div>
    </div>}
  </>);
}


// ─── FACILITY TEAMS / TEAM PROFILES ──────────────────────────────
const TEAM_COLORS=["#e84040","#e8a020","#27c97a","#3a9be8","#9b59b6","#f39c12","#1abc9c","#e67e22","#e91e63","#00bcd4","#8bc34a","#ff5722","#607d8b","#795548","#673ab7"];


function TeamGamesModule({team,athletes,isAdmin,profile}){
  const[weekends,setWeekends]=useState([]);
  const[games,setGames]=useState([]);
  const[loading,setLoading]=useState(true);
  const[activeWkId,setActiveWkId]=useState(null);
  const[activeGameId,setActiveGameId]=useState(null);
  const[showAddWk,setShowAddWk]=useState(false);
  const[wkName,setWkName]=useState("");const[wkStart,setWkStart]=useState("");const[wkEnd,setWkEnd]=useState("");
  const[showAddGame,setShowAddGame]=useState(false);
  const[gOpp,setGOpp]=useState("");const[gDate,setGDate]=useState("");const[gTime,setGTime]=useState("");const[gLoc,setGLoc]=useState("");

  const SURL2=typeof SURL!=="undefined"?SURL:"";
  const SKEY2=typeof SKEY!=="undefined"?SKEY:"";

  useEffect(function(){
    if(!team||!team.id)return;
    setLoading(true);
    Promise.all([
      fetchWithRefresh(SURL2+"/rest/v1/facility_weekends?facility_team_id=eq."+team.id+"&select=*&order=start_date.desc&limit=200",{headers:{"apikey":SKEY2,"Authorization":"Bearer "+_tok}}).then(function(r){return r.ok?r.json():[];}),
      fetchWithRefresh(SURL2+"/rest/v1/facility_games?facility_team_id=eq."+team.id+"&select=*&order=game_date.asc&limit=1000",{headers:{"apikey":SKEY2,"Authorization":"Bearer "+_tok}}).then(function(r){return r.ok?r.json():[]}),
    ]).then(function(results){
      const wks=Array.isArray(results[0])?results[0]:[];
      const gs=Array.isArray(results[1])?results[1]:[];
      setWeekends(wks);
      setGames(gs.map(function(g){return{...g,lineup:g.lineup||[]};}));
      if(wks.length&&!activeWkId)setActiveWkId(wks[0].id);
      setLoading(false);
    }).catch(function(){setLoading(false);});
  },[team.id]);

  const addWeekend=async function(){
    if(!wkName.trim())return;
    const r=await fetchWithRefresh(SURL2+"/rest/v1/facility_weekends",{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY2,"Authorization":"Bearer "+_tok,"Prefer":"return=representation"},body:JSON.stringify({facility_team_id:team.id,name:wkName.trim(),start_date:wkStart||null,end_date:wkEnd||null})});
    if(r.ok){const d=await r.json();const wk=d[0];setWeekends(function(p){return[wk,...p];});setActiveWkId(wk.id);setWkName("");setWkStart("");setWkEnd("");setShowAddWk(false);}
    else alert("Error: "+await r.text());
  };

  const deleteWeekend=async function(id){
    if(!window.confirm("Delete this weekend and all its games?"))return;
    await fetchWithRefresh(SURL2+"/rest/v1/facility_games?facility_weekend_id=eq."+id,{method:"DELETE",headers:{"apikey":SKEY2,"Authorization":"Bearer "+_tok}});
    await fetchWithRefresh(SURL2+"/rest/v1/facility_weekends?id=eq."+id,{method:"DELETE",headers:{"apikey":SKEY2,"Authorization":"Bearer "+_tok}});
    setWeekends(function(p){return p.filter(function(w){return w.id!==id;});});
    setGames(function(p){return p.filter(function(g){return g.facility_weekend_id!==id;});});
    if(activeWkId===id)setActiveWkId(null);
  };

  const addGame=async function(){
    if(!activeWkId)return;
    const r=await fetchWithRefresh(SURL2+"/rest/v1/facility_games",{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY2,"Authorization":"Bearer "+_tok,"Prefer":"return=representation"},body:JSON.stringify({facility_team_id:team.id,facility_weekend_id:activeWkId,opponent:gOpp.trim()||"TBD",game_date:gDate||null,game_time:gTime||null,location:gLoc.trim()||null,lineup:[],notes:""})});
    if(r.ok){const d=await r.json();const g={...d[0],lineup:d[0].lineup||[]};setGames(function(p){return[...p,g];});setGOpp("");setGDate("");setGTime("");setGLoc("");setShowAddGame(false);}
    else alert("Error: "+await r.text());
  };

  const patchGame=async function(id,patch){
    await fetchWithRefresh(SURL2+"/rest/v1/facility_games?id=eq."+id,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY2,"Authorization":"Bearer "+_tok},body:JSON.stringify(patch)});
    setGames(function(p){return p.map(function(g){return g.id===id?{...g,...patch}:g;});});
  };

  const deleteGame=async function(id){
    if(!window.confirm("Delete this game?"))return;
    await fetchWithRefresh(SURL2+"/rest/v1/facility_games?id=eq."+id,{method:"DELETE",headers:{"apikey":SKEY2,"Authorization":"Bearer "+_tok}});
    setGames(function(p){return p.filter(function(g){return g.id!==id;});});
    if(activeGameId===id)setActiveGameId(null);
  };

  const activeWk=weekends.find(function(w){return w.id===activeWkId;});
  const wkGames=games.filter(function(g){return g.facility_weekend_id===activeWkId;}).sort(function(a,b){const d=(a.game_date||"").localeCompare(b.game_date||"");return d!==0?d:(a.game_time||"").localeCompare(b.game_time||"");});

  if(loading)return(<div style={{padding:20,color:"#6b82a0",textAlign:"center"}}>Loading games...</div>);

  // Game detail view
  if(activeGameId){
    const game=games.find(function(g){return g.id===activeGameId;});
    if(!game)return(<button className="bb" onClick={()=>setActiveGameId(null)}>← Games</button>);
    return(<FacGameDetail game={game} athletes={athletes} team={team} onBack={()=>setActiveGameId(null)} onPatch={patchGame} onDelete={deleteGame} isAdmin={isAdmin}/>);
  }

  return(
    <div>
      {/* Weekend selector + add */}
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,flexWrap:"wrap"}}>
        <div style={{fontWeight:700,fontSize:13,color:"#6b82a0"}}>Weekend:</div>
        <select className="inp" style={{flex:1,maxWidth:280}} value={activeWkId||""} onChange={function(e){setActiveWkId(e.target.value||null);}}>
          <option value="">— Select Weekend —</option>
          {weekends.map(function(w){return(<option key={w.id} value={w.id}>{w.name}{w.start_date?" · "+w.start_date:""}</option>);})}
        </select>
        {isAdmin&&<button className="btn bg bsm" onClick={()=>setShowAddWk(!showAddWk)}>+ Weekend</button>}
      </div>

      {/* Add weekend form */}
      {showAddWk&&<div className="card" style={{marginBottom:12}}>
        <div className="fg"><label>Weekend Name</label><input className="inp" placeholder="e.g. Fall Classic 2026" value={wkName} onChange={function(e){setWkName(e.target.value);}}/></div>
        <div className="fg2">
          <div className="fg"><label>Start Date</label><input className="inp" type="date" value={wkStart} onChange={function(e){setWkStart(e.target.value);}}/></div>
          <div className="fg"><label>End Date</label><input className="inp" type="date" value={wkEnd} onChange={function(e){setWkEnd(e.target.value);}}/></div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn bg bsm" onClick={addWeekend}>Save Weekend</button>
          <button className="btn bgh bsm" onClick={()=>setShowAddWk(false)}>Cancel</button>
        </div>
      </div>}

      {/* Weekend not selected */}
      {!activeWkId&&weekends.length===0&&<div className="empty">
        <div className="ei">⚾</div>
        <div className="et">No weekends yet</div>
        <div className="es">{isAdmin?"Click + Weekend to create your first tournament or event.":"No weekends have been added yet."}</div>
      </div>}

      {/* Weekend header + games */}
      {activeWk&&<div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,flexWrap:"wrap",gap:8}}>
          <div>
            <div style={{fontWeight:800,fontSize:16}}>{activeWk.name}</div>
            {(activeWk.start_date||activeWk.end_date)&&<div style={{fontSize:11,color:"#6b82a0"}}>{activeWk.start_date||"?"} – {activeWk.end_date||"?"}</div>}
          </div>
          <div style={{display:"flex",gap:7}}>
            {isAdmin&&<button className="btn bg bsm" onClick={()=>setShowAddGame(!showAddGame)}>+ Game</button>}
            {isAdmin&&<button className="btn bgr bsm" onClick={()=>deleteWeekend(activeWk.id)}>Delete Weekend</button>}
          </div>
        </div>

        {/* Add game form */}
        {showAddGame&&<div className="card" style={{marginBottom:12}}>
          <div className="fg"><label>Opponent</label><input className="inp" placeholder="e.g. Riverside Hawks" value={gOpp} onChange={function(e){setGOpp(e.target.value);}}/></div>
          <div className="fg2">
            <div className="fg"><label>Date</label><input className="inp" type="date" value={gDate} onChange={function(e){setGDate(e.target.value);}}/></div>
            <div className="fg"><label>Time</label><input className="inp" type="time" value={gTime} onChange={function(e){setGTime(e.target.value);}}/></div>
          </div>
          <div className="fg"><label>Location</label><input className="inp" placeholder="Field 3, Diamond A..." value={gLoc} onChange={function(e){setGLoc(e.target.value);}}/></div>
          <div style={{display:"flex",gap:8}}>
            <button className="btn bg bsm" onClick={addGame}>Add Game</button>
            <button className="btn bgh bsm" onClick={()=>setShowAddGame(false)}>Cancel</button>
          </div>
        </div>}

        {/* Games list */}
        {wkGames.length===0&&<div className="empty" style={{padding:"24px 0"}}>
          <div className="ei">⚾</div>
          <div className="et">No games yet</div>
          {isAdmin&&<div className="es">Click + Game to add the first game for this weekend.</div>}
        </div>}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {wkGames.map(function(g){
            return(
              <div key={g.id} className="card cc" onClick={()=>setActiveGameId(g.id)} style={{display:"flex",alignItems:"center",gap:12,cursor:"pointer"}}>
                <div style={{fontSize:24}}>⚾</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:14}}>vs {g.opponent||"TBD"}</div>
                  <div style={{fontSize:11,color:"#6b82a0"}}>
                    {g.game_date||"No date"}{g.game_time?" · "+fmtTime12(g.game_time):""}
                    {g.location?" · "+g.location:""}
                    {" · "+(g.lineup||[]).length+" in lineup"}
                  </div>
                </div>
                <div style={{fontSize:11,color:"#6b82a0"}}>→</div>
              </div>
            );
          })}
        </div>
      </div>}
    </div>
  );
}

function FacGameDetail({game,athletes,team,onBack,onPatch,onDelete,isAdmin}){
  const[tab,setTab]=useState("lineup");
  const[lineup,setLineup]=useState(game.lineup||[]);
  const[notes,setNotes]=useState(game.notes||"");
  const[score,setScore]=useState({us:game.score_us||"",them:game.score_them||""});
  const[saving,setSaving]=useState(false);

  const saveLineup=async function(){
    setSaving(true);
    await onPatch(game.id,{lineup,notes,score_us:score.us||null,score_them:score.them||null});
    setSaving(false);
  };

  // Lineup: ordered batting order
  const inLineup=lineup.map(function(l){return athletes.find(function(a){return a.id===l.athleteId;})||null;}).filter(Boolean);
  const notInLineup=athletes.filter(function(a){return !lineup.find(function(l){return l.athleteId===a.id;});});

  const addToLineup=function(athId){
    const ath=athletes.find(function(a){return a.id===athId;});
    if(!ath)return;
    setLineup(function(p){return[...p,{athleteId:athId,position:"",batting:p.length+1}];});
  };
  const removeFromLineup=function(athId){setLineup(function(p){return p.filter(function(l){return l.athleteId!==athId;});});};
  const updatePos=function(athId,pos){setLineup(function(p){return p.map(function(l){return l.athleteId===athId?{...l,position:pos}:l;});});};
  const moveUp=function(i){if(i===0)return;setLineup(function(p){const u=[...p];const tmp=u[i-1];u[i-1]=u[i];u[i]=tmp;return u;});};
  const moveDown=function(i){setLineup(function(p){if(i>=p.length-1)return p;const u=[...p];const tmp=u[i+1];u[i+1]=u[i];u[i]=tmp;return u;});};

  return(
    <div>
      <button className="bb" onClick={onBack}>← Games</button>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <div>
          <div style={{fontWeight:800,fontSize:18}}>{team.name} vs {game.opponent||"TBD"}</div>
          <div style={{fontSize:12,color:"#6b82a0"}}>
            {game.game_date||"No date"}{game.game_time?" · "+fmtTime12(game.game_time):""}
            {game.location?" · "+game.location:""}
          </div>
        </div>
        {isAdmin&&<button className="btn bgr bsm" onClick={()=>onDelete(game.id)}>Delete Game</button>}
      </div>

      {/* Score */}
      <div className="card" style={{marginBottom:12}}>
        <div style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
          <div style={{fontWeight:700,fontSize:13}}>{team.name}</div>
          <input className="inp" type="number" style={{width:64}} placeholder="0" value={score.us} onChange={function(e){setScore(function(s){return{...s,us:e.target.value};});}}/>
          <div style={{fontSize:18,fontWeight:700,color:"#6b82a0"}}>–</div>
          <input className="inp" type="number" style={{width:64}} placeholder="0" value={score.them} onChange={function(e){setScore(function(s){return{...s,them:e.target.value};});}}/>
          <div style={{fontWeight:700,fontSize:13}}>{game.opponent||"Opponent"}</div>
        </div>
      </div>

      {/* Tabs */}
      <div style={{display:"flex",borderBottom:"1px solid rgba(255,255,255,.08)",marginBottom:12}}>
        {[["lineup","Lineup"],["notes","Notes"]].map(function(t){return(
          <button key={t[0]} onClick={()=>setTab(t[0])} style={{padding:"7px 14px",border:"none",background:"transparent",fontSize:12,fontWeight:tab===t[0]?700:400,color:tab===t[0]?"#e8a020":"#6b82a0",borderBottom:tab===t[0]?"2px solid #e8a020":"2px solid transparent",cursor:"pointer"}}>{t[1]}</button>
        );})}
      </div>

      {/* Lineup tab */}
      {tab==="lineup"&&<div>
        {lineup.map(function(l,i){
          const ath=athletes.find(function(a){return a.id===l.athleteId;});
          if(!ath)return null;
          return(
            <div key={l.athleteId} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.07)",borderRadius:8,marginBottom:5}}>
              <div style={{width:22,height:22,borderRadius:"50%",background:"rgba(232,160,32,.15)",color:"#e8a020",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0}}>{i+1}</div>
              <div className="riv" style={{width:26,height:26,fontSize:10,flexShrink:0}}>{ath.avatar||ini(ath.name)}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:600,fontSize:13}}>{ath.name}</div>
                <div style={{fontSize:10,color:"#6b82a0"}}>{ath.position||""}</div>
              </div>
              <select className="inp" style={{width:"auto",fontSize:11,padding:"3px 6px"}} value={l.position||""} onChange={function(e){updatePos(l.athleteId,e.target.value);}}>
                <option value="">Pos</option>
                {["P","C","1B","2B","3B","SS","LF","CF","RF","DH","EH"].map(function(p){return<option key={p} value={p}>{p}</option>;})}
              </select>
              <button onClick={()=>moveUp(i)} style={{background:"none",border:"none",color:"#6b82a0",cursor:"pointer",padding:"2px 4px"}}>↑</button>
              <button onClick={()=>moveDown(i)} style={{background:"none",border:"none",color:"#6b82a0",cursor:"pointer",padding:"2px 4px"}}>↓</button>
              <button onClick={()=>removeFromLineup(l.athleteId)} style={{background:"none",border:"none",color:"#e84040",cursor:"pointer",padding:"2px 6px",fontWeight:700}}>✕</button>
            </div>
          );
        })}
        {notInLineup.length>0&&<div style={{marginTop:10}}>
          <div style={{fontSize:11,fontWeight:700,color:"#6b82a0",textTransform:"uppercase",letterSpacing:.5,marginBottom:6}}>Add to Lineup</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
            {notInLineup.map(function(a){return(
              <button key={a.id} onClick={()=>addToLineup(a.id)} style={{padding:"4px 10px",borderRadius:6,border:"1px solid rgba(58,155,232,.25)",background:"rgba(58,155,232,.06)",color:"#3a9be8",fontSize:12,cursor:"pointer"}}>
                + {a.name}
              </button>
            );})}
          </div>
        </div>}
        <button className="btn bg bsm" style={{marginTop:12}} onClick={saveLineup} disabled={saving}>{saving?"Saving...":"💾 Save Lineup"}</button>
      </div>}

      {/* Notes tab */}
      {tab==="notes"&&<div>
        <textarea className="inp" value={notes} onChange={function(e){setNotes(e.target.value);}} placeholder="Game notes, observations, pitching notes..." style={{minHeight:120,marginBottom:10}}/>
        <button className="btn bg bsm" onClick={saveLineup} disabled={saving}>{saving?"Saving...":"💾 Save Notes"}</button>
      </div>}
    </div>
  );
}


function FacilityTeamsPage({athletes,coaches=[],facilityTeams,setFacilityTeams,schedule:defaultSchedule,profile,isAdmin,onUpdateRoster,programs,dataLoaded,onViewTeamPlans}){
  const schedule=(()=>{try{const s=localStorage.getItem("dt_facility_schedule");return s?JSON.parse(s):defaultSchedule;}catch(e){return defaultSchedule;}})();
  const[viewTeam,setViewTeam]=useState(null);
  const[teamTab,setTeamTab]=useState("schedule");
  const[viewPlanDetail,setViewPlanDetail]=useState(null);
  const[showForm,setShowForm]=useState(false);
  const[editTeam,setEditTeam]=useState(null);
  const[saving,setSaving]=useState(false);
  const[rosterProfiles,setRosterProfiles]=useState([]);
  const[addStaffId,setAddStaffId]=useState("");
  const[addStaffRole,setAddStaffRole]=useState("head_coach");
  const[rosterSearch,setRosterSearch]=useState("");
  const[rosterAgeFilter,setRosterAgeFilter]=useState("");
  const blank={name:"",scheduleLabel:"",ageGroup:"",notes:"",color:TEAM_COLORS[0],athleteIds:[],teamStaff:[]};
  const[form,setForm]=useState(blank);
  const upd=(k,v)=>setForm(p=>({...p,[k]:v}));

  // Load roster profiles whenever viewTeam changes
  useEffect(function(){
    if(!viewTeam||!(viewTeam.athleteIds||[]).length){setRosterProfiles([]);return;}
    const ids=viewTeam.athleteIds;
    const loaded=athletes.filter(function(a){return ids.includes(a.id);});
    const missingIds=ids.filter(function(id){return!loaded.find(function(a){return a.id===id;});});
    if(!missingIds.length){setRosterProfiles(loaded);return;}
    fetchWithRefresh(`${SURL}/rest/v1/profiles?id=in.(${missingIds.join(",")})&select=*`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}})
      .then(function(r){return r.json();}).then(function(data){
        if(Array.isArray(data))setRosterProfiles([...loaded,...data]);
      }).catch(function(){setRosterProfiles(loaded);});
  },[viewTeam?.id,JSON.stringify(viewTeam?.athleteIds)]);

  // Get this team's schedule slots across all days
  const getTeamSchedule=(team)=>{
    const raw=[];
    if(!team)return raw;
    FACILITY_DAYS.forEach(function(day){
      const ds=schedule[day]||{};
      Object.entries(ds).forEach(function([resource,sessions]){
        (sessions||[]).forEach(function(s){
          if((s.assignedTeamIds||[]).includes(team.id)){
            raw.push({...s,day,resource,team});
          }
        });
      });
    });
    // Dedup by day+type+time, collect resources
    const deduped=[];
    raw.forEach(function(s){
      const key=s.day+"_"+(s.label||s.type)+"_"+s.start+"_"+s.end;
      const existing=deduped.find(function(d){return d._key===key;});
      if(existing){if(!existing.resources.includes(s.resource))existing.resources.push(s.resource);}
      else{deduped.push({...s,_key:key,resources:[s.resource]});}
    });
    deduped.sort(function(a,b){
      const di=FACILITY_DAYS.indexOf(a.day)-FACILITY_DAYS.indexOf(b.day);
      if(di!==0)return di;
      return timeToMins(a.start)-timeToMins(b.start);
    });
    return deduped;
  };

  const openNew=()=>{setForm({...blank,color:TEAM_COLORS[facilityTeams.length%TEAM_COLORS.length]});setEditTeam(null);setRosterSearch("");setRosterAgeFilter("");setShowForm(true);};
  const openEdit=(t)=>{setForm({name:t.name,scheduleLabel:t.scheduleLabel||"",ageGroup:t.ageGroup||"",notes:t.notes||"",color:t.color||TEAM_COLORS[0],athleteIds:t.athleteIds||[],teamStaff:t.teamStaff||t.team_staff||[]});setEditTeam(t);setRosterSearch("");setRosterAgeFilter("");setShowForm(true);};

  const save=async()=>{
    if(!form.name.trim()){alert("Enter a team name.");return;}
    setSaving(true);
        const payload={name:form.name,schedule_label:form.scheduleLabel,age_group:form.ageGroup,notes:form.notes,color:form.color,athlete_ids:form.athleteIds,team_staff:form.teamStaff||[]};

    if(editTeam){
      const isLocal=String(editTeam.id).startsWith("local-");
      const r=await fetchWithRefresh(`${SURL}/rest/v1/facility_teams${isLocal?"":"?id=eq."+editTeam.id}`,{method:isLocal?"POST":"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify(payload)});
      if(r.ok){const d=await r.json();const saved={...d[0],athleteIds:d[0].athlete_ids||[],scheduleLabel:d[0].schedule_label||d[0].scheduleLabel||'',ageGroup:d[0].age_group||d[0].ageGroup||'',teamStaff:d[0].team_staff||form.teamStaff||[]};setFacilityTeams(p=>p.map(x=>x.id===editTeam.id?saved:x));if(viewTeam?.id===editTeam.id)setViewTeam(saved);
        // Update athlete profiles to link them to this coach
        // Auto-assign head/assistant coaches to all athletes on this team
        const staffCoachIds=(form.teamStaff||[]).filter(function(s){return s.role==="head_coach"||s.role==="assistant_coach";}).map(function(s){return s.profileId;});
        if(staffCoachIds.length&&form.athleteIds.length){
          form.athleteIds.forEach(async function(athId){
            const ath=athletes.find(function(a){return a.id===athId;});
            const current=ath?ath.coach_ids||[]:[];
            const merged=[...new Set([...current,...staffCoachIds])];
            if(merged.length!==current.length){
              await fetchWithRefresh(`${SURL}/rest/v1/profiles?id=eq.${athId}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`},body:JSON.stringify({coach_ids:merged})});
            }
          });
        }
      } else {const txt=await r.text();alert("Save failed: "+txt);}
    } else {
      const r=await fetchWithRefresh(`${SURL}/rest/v1/facility_teams`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify(payload)});
      if(r.ok){const d=await r.json();setFacilityTeams(p=>[...p,{...d[0],athleteIds:d[0].athlete_ids||[],scheduleLabel:d[0].schedule_label||"",ageGroup:d[0].age_group||"",teamStaff:d[0].team_staff||form.teamStaff||[],coachId:d[0].coach_id||""}]);}
    }
    setSaving(false);setShowForm(false);setEditTeam(null);
  };

  const del=async(t)=>{
    if(!window.confirm("Delete "+t.name+"?"))return;
    if(!String(t.id).startsWith("local-")){
      await fetchWithRefresh(`${SURL}/rest/v1/facility_teams?id=eq.${t.id}`,{method:"DELETE",headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    }
    setFacilityTeams(p=>p.filter(x=>x.id!==t.id));
    if(viewTeam?.id===t.id)setViewTeam(null);
  };

  const toggleAthlete=(id)=>setForm(p=>({...p,athleteIds:p.athleteIds.includes(id)?p.athleteIds.filter(x=>x!==id):[...p.athleteIds,id]}));

  // Team detail view
  if(viewTeam&&!showForm){
    const slots=getTeamSchedule(viewTeam);
    const teamAthletes=rosterProfiles;
    const byDay={};
    slots.forEach(function(s){if(!byDay[s.day])byDay[s.day]=[];byDay[s.day].push(s);});

    return(
      <div>
        <button className="bb" onClick={()=>setViewTeam(null)}>← All Teams</button>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12,flexWrap:"wrap"}}>
          <div style={{width:44,height:44,borderRadius:10,background:viewTeam.color||"#e8a020",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>🏟️</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:800,fontSize:22}}>{viewTeam.name}</div>
            <div style={{fontSize:12,color:"#6b82a0",display:"flex",flexWrap:"wrap",gap:6,marginTop:3}}>
              {viewTeam.ageGroup&&<span style={{background:"rgba(232,160,32,.12)",color:"#e8a020",borderRadius:4,padding:"1px 7px",fontWeight:700,fontSize:11}}>{viewTeam.ageGroup}</span>}
              {(viewTeam.teamStaff||viewTeam.team_staff||[]).map(function(s){
                const co=coaches.find(function(ch){return ch.id===s.profileId;});
                if(!co)return null;
                const roleLabel=s.role==="head_coach"?"HC":s.role==="assistant_coach"?"AC":s.role==="team_parent"?"TP":"Staff";
                return(<span key={s.profileId} style={{background:"rgba(58,155,232,.1)",color:"#3a9be8",borderRadius:4,padding:"1px 7px",fontSize:11}}>{roleLabel}: {co.name}</span>);
              })}
            </div>
          </div>
          {isAdmin&&<button className="btn bgh bsm" onClick={()=>openEdit(viewTeam)}>✏️ Edit</button>}
        </div>
        {viewTeam.notes&&<div style={{padding:"8px 12px",background:"rgba(255,255,255,.04)",borderLeft:"3px solid "+(viewTeam.color||"#e8a020"),borderRadius:"0 6px 6px 0",fontSize:12,color:"#c0cce0",marginBottom:12}}>{viewTeam.notes}</div>}

        {/* Tab strip */}
        <div style={{display:"flex",borderBottom:"1px solid rgba(255,255,255,.08)",marginBottom:14}}>
          {[["schedule","📅 Schedule"],["roster","👤 Roster"],["games","⚾ Games"],["plans","📋 Plans"]].map(function(tb){return(
            <button key={tb[0]} onClick={()=>setTeamTab(tb[0])} style={{padding:"7px 14px",border:"none",background:"transparent",fontSize:12,fontWeight:teamTab===tb[0]?700:400,color:teamTab===tb[0]?"#e8a020":"#6b82a0",borderBottom:teamTab===tb[0]?"2px solid #e8a020":"2px solid transparent",cursor:"pointer"}}>
              {tb[1]}
            </button>
          );})}
        </div>

        {/* Schedule tab */}
        {teamTab==="schedule"&&<div>
          {slots.length===0&&<div className="empty"><div className="ei">📅</div><div className="et">No schedule slots</div><div className="es">Set a Schedule Label on this team matching a label in the Facility Schedule.</div></div>}
          {Object.entries(byDay).sort(function(a,b){const di=FACILITY_DAYS.indexOf(a[0]);const dj=FACILITY_DAYS.indexOf(b[0]);return(di<0?99:di)-(dj<0?99:dj);}).map(function([day,daySessions]){
            const sortedSessions=[...daySessions].sort(function(a,b){return(a.start||"").localeCompare(b.start||"");});
            return(
              <div key={day} style={{marginBottom:16}}>
                <div style={{fontWeight:800,fontSize:13,textTransform:"uppercase",letterSpacing:.8,color:viewTeam.color||"#e8a020",marginBottom:8,paddingBottom:6,borderBottom:"2px solid "+(viewTeam.color||"#e8a020")+"40"}}>{day}</div>
                <div style={{display:"flex",flexDirection:"column",gap:6}}>
                  {sortedSessions.map(function(s,i){
                    const dur=s.end&&s.start?(function(){const[sh,sm]=s.start.split(":").map(Number);const[eh,em]=s.end.split(":").map(Number);return(eh*60+em)-(sh*60+sm);})():0;
                    const durStr=dur>=60?Math.floor(dur/60)+"h"+(dur%60?dur%60+"m":""):dur>0?dur+"m":"";
                    const res=(s.resources||[s.resource]).filter(Boolean);
                    return(
                      <div key={i} style={{padding:"12px 14px",borderRadius:10,background:(viewTeam.color||"#e8a020")+"12",border:"1px solid "+(viewTeam.color||"#e8a020")+"30"}}>
                        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8}}>
                          <div>
                            <div style={{fontWeight:800,fontSize:15,color:"#eef2f8"}}>{s.label||s.type}</div>
                            {s.start&&<div style={{fontSize:13,fontWeight:700,color:viewTeam.color||"#e8a020",marginTop:3}}>{fmtTime12?fmtTime12(s.start):s.start}{s.end?" – "+(fmtTime12?fmtTime12(s.end):s.end):""}</div>}
                            {res.length>0&&<div style={{fontSize:11,color:"#6b82a0",marginTop:3}}>📍 {res.join(" · ")}</div>}
                          </div>
                          {durStr&&<div style={{fontSize:12,fontWeight:700,color:"#6b82a0",flexShrink:0,paddingTop:2}}>{durStr}</div>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>}

        {/* Roster tab */}
        {teamTab==="roster"&&<div className="card">
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
            <div className="ds" style={{margin:0}}>Roster ({teamAthletes.length} athletes)</div>
            {isAdmin&&<button className="btn bg bsm" onClick={()=>{setForm({...blank,color:viewTeam.color||TEAM_COLORS[0],athleteIds:viewTeam.athleteIds||[],teamStaff:viewTeam.teamStaff||viewTeam.team_staff||[],name:viewTeam.name,scheduleLabel:viewTeam.scheduleLabel||"",ageGroup:viewTeam.ageGroup||"",notes:viewTeam.notes||""});setEditTeam(viewTeam);setShowForm(true);}}>✏️ Edit Roster</button>}
          </div>
          {teamAthletes.length===0&&<div style={{fontSize:12,color:"#6b82a0"}}>No athletes assigned. Edit this team to add players.</div>}
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {teamAthletes.map(function(a){return(
              <div key={a.id} style={{display:"flex",alignItems:"center",gap:6,padding:"5px 10px",background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)",borderRadius:8}}>
                <div className="riv" style={{width:22,height:22,fontSize:9}}>{a.avatar||ini(a.name)}</div>
                <div>
                  <div style={{fontWeight:600,fontSize:12}}>{a.name}</div>
                  <div style={{fontSize:10,color:"#6b82a0"}}>{a.position||""}</div>
                </div>
              </div>
            );})}
          </div>
        </div>}

        {/* Games tab */}
        {teamTab==="games"&&<TeamGamesModule team={viewTeam} athletes={teamAthletes} isAdmin={isAdmin} profile={profile}/>}

        {/* Plans tab — practice plans and ASP sessions tagged to this team */}
        {teamTab==="plans"&&(function(){
          const PLAN_TYPES=["plan","team_practice","asp","speed"];
          const teamPlans=(programs||[]).filter(function(p){
            const pt=p.planType||p.plan_type;
            if(!pt||!PLAN_TYPES.includes(pt))return false;
            const tagged=p.targetTeams||p.target_teams||[];
            return tagged.includes(viewTeam.id);
          }).sort(function(a,b){return new Date(b.week||b.created_at||0)-new Date(a.week||a.created_at||0);});

          const TYPE_LABEL={"plan":"Practice Plan","team_practice":"Team Practice","asp":"ASP Session","speed":"Speed & Agility"};
          const TYPE_COLOR={"plan":"#27c97a","team_practice":"#27c97a","asp":"#e84040","speed":"#a855f7"};
          const TYPE_ICON={"plan":"📋","team_practice":"🏟️","asp":"⚾","speed":"⚡"};

          if(!viewPlanDetail){return(
            <div>
              {teamPlans.length===0&&<div className="empty">
                <div className="ei">📋</div>
                <div className="et">No plans tagged to {viewTeam.name} yet</div>
                <div className="es">When creating a Practice Plan or ASP Session, tag this team and it will appear here.</div>
              </div>}
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {teamPlans.map(function(p){
                  const pt=p.planType||p.plan_type||"plan";
                  const color=TYPE_COLOR[pt]||"#27c97a";
                  const icon=TYPE_ICON[pt]||"📋";
                  const label=TYPE_LABEL[pt]||"Plan";
                  const sections=(p.days||[]).filter(function(d){return(d.exercises||[]).length>0||d.placeholder;});
                  const totalMin=sections.reduce(function(s,d){return s+(parseInt(d.sectionDuration)||0);},0);
                  return(
                    <div key={p.id} onClick={()=>setViewPlanDetail(p)}
                      style={{padding:"13px 14px",background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.08)",borderRadius:10,cursor:"pointer",display:"flex",gap:12,alignItems:"flex-start"}}>
                      <div style={{width:4,borderRadius:4,background:color,alignSelf:"stretch",flexShrink:0}}/>
                      <div style={{fontSize:24,flexShrink:0}}>{icon}</div>
                      <div style={{flex:1}}>
                        <div style={{fontWeight:800,fontSize:14,marginBottom:4}}>{p.name}</div>
                        <div style={{fontSize:11,color:"#6b82a0",display:"flex",gap:10,flexWrap:"wrap"}}>
                          <span style={{background:color+"18",color:color,borderRadius:6,padding:"1px 7px",fontWeight:700,fontSize:10}}>{label}</span>
                          {p.week&&<span>📅 {p.week}</span>}
                          {totalMin>0&&<span>⏱ {totalMin} min</span>}
                          {(p.raInfluenced||p.ra_influenced)&&<span style={{color:"#27c97a",fontWeight:700}}>🏟️ RA Staff</span>}
                        </div>
                        {p.planNotes&&<div style={{fontSize:11,color:"#8fa3be",fontStyle:"italic",marginTop:5}}>"{p.planNotes.slice(0,80)}{p.planNotes.length>80?"...":""}"</div>}
                      </div>
                      <div style={{fontSize:11,color:color,fontWeight:700,flexShrink:0}}>View →</div>
                    </div>
                  );
                })}
              </div>
            </div>
          );}

          // Plan detail / print view
          const p=viewPlanDetail;
          const pt=p.planType||p.plan_type||"plan";
          const cfg=PLAN_CONFIGS[pt]||PLAN_CONFIGS.plan;
          const computedTimes=(p.days||[]).reduce(function(acc,d,i){
            const prev=i===0?(p.startTime||p.start_time||"09:00"):acc[i-1];
            const dur=parseInt(d.sectionDuration)||0;
            acc.push(dur&&prev?addMinutes(prev,dur):prev);
            return acc;
          },[]);
          return(
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,flexWrap:"wrap"}} className="no-print">
                <button className="bb" onClick={()=>setViewPlanDetail(null)}>← All Plans</button>
                <button className="btn bg bsm" onClick={()=>window.print()}>🖨️ Print</button>
              </div>
              <WorkoutPrintView name={p.name} week={p.week} duration={p.duration} location={p.location}
                coachNote={p.planNotes||p.plan_notes} days={p.days||[]} cfg={cfg} athletes={teamAthletes}
                athId="" tGrads={[]} tAgeGroups={[]} tGroups={[]}
                startTime={p.startTime||p.start_time||""} computedTimes={computedTimes}/>
            </div>
          );
        })()}

      </div>
    );
  }


  // Teams list
  return(<>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:8}}>
      <div style={{fontWeight:800,fontSize:20}}>👥 Team Profiles</div>
      {isAdmin&&<button className="btn bg" onClick={openNew}>+ New Team</button>}
    </div>

    {facilityTeams.length===0&&(dataLoaded?<div className="empty"><div className="ei">👥</div><div className="et">No Teams Yet</div><div className="es">Create team profiles to give coaches and parents a landing page with their weekly schedule.</div></div>:<div className="empty"><div className="ei">⏳</div><div className="et">Loading teams...</div></div>)}

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:10}}>
      {[...facilityTeams].sort(function(a,b){return(a.name||"").localeCompare(b.name||"");}).map(function(t){
        const slots=getTeamSchedule(t);
        const days=[...new Set(slots.map(s=>s.day))];
        const memberCount=(t.athleteIds||[]).length;
        return(
          <div key={t.id} onClick={()=>{setViewTeam(t);setTeamTab("schedule");}} style={{padding:"14px 16px",background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.08)",borderRadius:10,cursor:"pointer",borderLeft:"4px solid "+(t.color||"#e8a020")}}>
            <div style={{display:"flex",alignItems:"flex-start",gap:10,marginBottom:8}}>
              <div style={{width:36,height:36,borderRadius:8,background:(t.color||"#e8a020")+"20",border:"1px solid "+(t.color||"#e8a020")+"40",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:14,color:t.color||"#e8a020",flexShrink:0}}>{t.name.slice(0,2).toUpperCase()}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:800,fontSize:15}}>{t.name}</div>
                <div style={{fontSize:11,color:"#6b82a0"}}>{(()=>{
                  const staff=t.teamStaff||t.team_staff||[];
                  const hc=staff.find(function(s){return s.role==="head_coach";});
                  const co=hc?coaches.find(function(ch){return ch.id===hc.profileId;}):null;
                  return co?"HC: "+co.name:"";
                })()}</div>

function timeToMins(t){
  if(!t)return 0;
  const pm=t.endsWith("p")&&!t.startsWith("12");
  const am=t.endsWith("a");
  const [h,m]=t.replace(/[ap]/,"").split(":").map(Number);
  return(pm?h+12:h)*60+(m||0);
}

function detectConflicts(schedule){
  const conflicts=[];
  FACILITY_DAYS.forEach(function(day){
    const ds=schedule[day]||{};
    const blocks=[];
    Object.entries(ds).forEach(function([resource,sessions]){
      (sessions||[]).forEach(function(s){
        blocks.push({resource,label:s.label,start:timeToMins(s.start),end:timeToMins(s.end)});
      });
    });
    // Check each pair
    for(let i=0;i<blocks.length;i++){
      for(let j=i+1;j<blocks.length;j++){
        if(blocks[i].resource===blocks[j].resource)continue;
        // Same label, overlapping time
        const la=blocks[i].label.split("Speed")[0].split("ASP")[0].replace(/&/g,",").split(",").map(s=>s.trim()).filter(Boolean);
        const lb=blocks[j].label.split("Speed")[0].split("ASP")[0].replace(/&/g,",").split(",").map(s=>s.trim()).filter(Boolean);
        const overlap=blocks[i].start<blocks[j].end&&blocks[j].start<blocks[i].end;
        if(!overlap)continue;
        la.forEach(function(a){lb.forEach(function(b){
          if(a===b&&a.length>2){
            conflicts.push({day,label:a,r1:blocks[i].resource,r2:blocks[j].resource,start:blocks[i].start,end:blocks[i].end});
          }
        });});
      }
    }
  });
  return conflicts;
}

function FacMonthView({calDate,setCalDate,setCalView,eventsOnDate,isAdmin,setShowCalForm,facilityTeams=[]}){
  const year=calDate.getFullYear(),month=calDate.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const cells=[];
  for(let i=0;i<firstDay;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);
  while(cells.length%7!==0)cells.push(null);
  const todayStr=new Date().toISOString().slice(0,10);
  const mns=["January","February","March","April","May","June","July","August","September","October","November","December"];
  return(<div>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
      <button className="btn bgh bsm" onClick={()=>setCalDate(new Date(year,month-1,1))}>‹</button>
      <div style={{fontWeight:800,fontSize:16}}>{mns[month]} {year}</div>
      <button className="btn bgh bsm" onClick={()=>setCalDate(new Date(year,month+1,1))}>›</button>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:1,marginBottom:4}}>
      {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(function(d){return(<div key={d} style={{textAlign:"center",fontSize:10,fontWeight:700,color:"#6b82a0",padding:"4px 0"}}>{d}</div>);})}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
      {cells.map(function(day,ci){
        if(!day)return(<div key={"e"+ci} style={{minHeight:70}}/>);
        const ds=year+"-"+String(month+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");
        const evs=eventsOnDate(ds);
        const isToday=ds===todayStr;
        return(<div key={day} onClick={()=>{setCalDate(new Date(ds+"T12:00:00"));setCalView("day");}} style={{minHeight:70,borderRadius:6,background:isToday?"rgba(232,160,32,.06)":"rgba(255,255,255,.02)",border:"1px solid "+(isToday?"rgba(232,160,32,.35)":"rgba(255,255,255,.06)"),padding:"4px",cursor:"pointer",overflow:"hidden"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:2}}>
            <span style={{fontSize:11,fontWeight:isToday?800:500,color:isToday?"#e8a020":"#8fa3be"}}>{day}</span>
            {isAdmin&&<button onClick={function(e){e.stopPropagation();setShowCalForm({date:ds});}} style={{fontSize:9,background:"none",border:"none",color:"#3a4a5e",cursor:"pointer",padding:0}}>+</button>}
          </div>
          {evs.slice(0,2).map(function(ev,ei){
            if(ev._isBlackout)return(<div key={ei} style={{fontSize:9,color:"#e84040",fontWeight:700,padding:"1px 4px",borderRadius:3,background:"rgba(232,60,60,.15)"}}>🚫 {ev.title.replace("🚫 ","")}</div>);
            return(<FacMiniChip key={ev.id+ei} ev={ev} facilityTeams={facilityTeams}/>);

          {evs.length>2&&<div style={{fontSize:8,color:"#6b82a0"}}>+{evs.length-2} more</div>}
        </div>);
      })}

}

function FacilitySchedulePage({athletes,programs,isAdmin,facilityTeams=[],calendarEvents=[],setCalendarEvents,blackoutDates=[],setBlackoutDates,profile}){
  const[viewDay,setViewDay]=useState("Monday");
  const[calView,setCalView]=useState("grid"); // grid | week | month | day
  const[calDate,setCalDate]=useState(new Date());
  const[schedule,setSchedule]=useState(()=>{
    // Load from localStorage as instant cache while Supabase loads
    try{
      const ver=localStorage.getItem("dt_facility_schedule_ver");
      const saved=localStorage.getItem("dt_facility_schedule");
      if(ver==="v3"&&saved)return JSON.parse(saved);
    }catch(e){}
    return DEFAULT_SCHEDULE;
  });
  const[scheduleDbId,setScheduleDbId]=useState(null);
  const[scheduleLoaded,setScheduleLoaded]=useState(false);

  // On mount: load from Supabase; if DB empty, push localStorage data up
  useEffect(function(){
    async function loadSchedule(){
      try{
        const r=await fetchWithRefresh(SURL+"/rest/v1/facility_schedule?select=*&limit=1",{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
        if(r.ok){
          const rows=await r.json();
          // Get local data
          let localSched=null;
          try{
            const lv=localStorage.getItem("dt_facility_schedule_ver");
            const ls=localStorage.getItem("dt_facility_schedule");
            if(lv==="v3"&&ls)localSched=JSON.parse(ls);
          }catch(le){}

          if(rows&&rows.length>0&&rows[0].schedule_data){
            const dbSched=rows[0].schedule_data;
            setScheduleDbId(rows[0].id);
            // Use DB data (it's the source of truth across devices)
            setSchedule(dbSched);
            try{localStorage.setItem("dt_facility_schedule",JSON.stringify(dbSched));localStorage.setItem("dt_facility_schedule_ver","v3");}catch(e){}
          } else {
            // DB empty — push local data up (preserves your edits)
            const toSave=localSched||DEFAULT_SCHEDULE;
            const w=await fetchWithRefresh(SURL+"/rest/v1/facility_schedule",{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify({schedule_data:toSave,version:"v3"})});
            if(w.ok){const d=await w.json();if(d[0])setScheduleDbId(d[0].id);setSchedule(toSave);}
          }
        }
      }catch(e){console.warn("Schedule load error",e);}
      setScheduleLoaded(true);
    }
    if(_tok)loadSchedule();
  },[]);

  // Save to Supabase + localStorage on every change
  const updateSchedule=(fn)=>{
    setSchedule(function(prev){
      const next=fn(prev);
      try{localStorage.setItem("dt_facility_schedule",JSON.stringify(next));localStorage.setItem("dt_facility_schedule_ver","v3");}catch(e2){}
      // Push to Supabase async
      setTimeout(async function(){
        try{
          if(scheduleDbId){
            await fetchWithRefresh(SURL+"/rest/v1/facility_schedule?id=eq."+scheduleDbId,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`},body:JSON.stringify({schedule_data:next,updated_at:new Date().toISOString()})});
          } else {
            const w=await fetchWithRefresh(SURL+"/rest/v1/facility_schedule",{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify({schedule_data:next,version:"v3"})});
            if(w.ok){const d=await w.json();setScheduleDbId(d[0]?.id);}
          }
        }catch(e3){console.warn("Schedule save error",e3);}
      },0);
      return next;
    });
  };
  const[filter,setFilter]=useState("");
  const[assignModal,setAssignModal]=useState(null); // {day,resource,idx,session}
  const[showPrint,setShowPrint]=useState(false);

  const times=["Saturday","Sunday"].includes(viewDay)?WEEKEND_TIMES:WEEKDAY_TIMES;
  const SLOT_W=54; // px per 30-min slot
  const ROW_H=50;
  const LABEL_W=90;

  const typeColor=(type)=>{
    if(!type)return{bg:"rgba(255,255,255,.06)",border:"rgba(255,255,255,.15)",text:"#eef2f8"};
    if(type.includes("ASP"))return{bg:"rgba(58,155,232,.15)",border:"#3a9be8",text:"#3a9be8"};
    if(type.includes("Speed")||type.includes("Agility"))return{bg:"rgba(232,160,32,.15)",border:"#e8a020",text:"#e8a020"};
    if(type.includes("Workout"))return{bg:"rgba(155,89,182,.15)",border:"#9b59b6",text:"#c39bd3"};
    if(type.includes("Pitching")||type.includes("Bullpen"))return{bg:"rgba(232,60,60,.15)",border:"#e84040",text:"#e84040"};
    if(type.includes("Scout"))return{bg:"rgba(39,201,122,.1)",border:"#27c97a",text:"#27c97a"};
    if(type.includes("Lesson"))return{bg:"rgba(232,60,232,.12)",border:"#c93be8",text:"#c93be8"};
    if(type.includes("Rental"))return{bg:"rgba(255,200,0,.1)",border:"#c8a800",text:"#e8c820"};
    if(type.includes("Team Practice"))return{bg:"rgba(255,255,255,.06)",border:"rgba(255,255,255,.18)",text:"#eef2f8"};
    return{bg:"rgba(255,255,255,.06)",border:"rgba(255,255,255,.15)",text:"#eef2f8"};
  };

  const timeToSlot=(t)=>{
    const idx=times.indexOf(t);
    return idx>=0?idx:0;
  };

  const openAssign=(day,resource,idx,session)=>{
    if(!isAdmin)return;
    // Find any linked resources (same linkedSlotId or slotId)
    const linked=session.linkedSlotId||session.slotId;
    const linkedResources=linked?FACILITY_RESOURCES.filter(function(r){
      if(r===resource)return false;
      return((schedule[day]||{})[r]||[]).some(function(s){return s.linkedSlotId===linked||s.slotId===linked;});
    }):[];
    setAssignModal({day,resource,idx,isNew:false,session:{...session},assignedTeamIds:[...(session.assignedTeamIds||[])],extraResources:linkedResources});
  };

  const saveAssign=()=>{
    if(!assignModal)return;
    const{day,resource,idx,assignedTeamIds,session,isNew,extraResources}=assignModal;
    console.log("saveAssign",{day,resource,idx,isNew,sessionLabel:session.label,sessionType:session.type,sessionStart:session.start,sessionEnd:session.end});
    const allResources=[resource,...(extraResources||[])];
    const baseSlotId=session.slotId||("slot_"+Date.now());
    updateSchedule(function(prev){
      const next=JSON.parse(JSON.stringify(prev));
      if(!next[day])next[day]={};
      allResources.forEach(function(res,ri){
        if(!next[day][res])next[day][res]=[];
        const entry={...session,assignedTeamIds:assignedTeamIds||[],slotId:baseSlotId+(ri>0?"_"+ri:""),linkedSlotId:baseSlotId};
        if(!isNew&&res===resource&&idx>=0&&next[day][res][idx]){
          // Edit primary resource in-place
          next[day][res][idx]={...next[day][res][idx],...entry};
        } else {
          // New session or extra resource — remove duplicate time then add
          next[day][res]=next[day][res].filter(function(s){return!(s.start===entry.start&&s.end===entry.end&&s.slotId!==entry.slotId);});
          next[day][res].push(entry);
        }
        next[day][res].sort(function(a,b){return timeToMins(a.start)-timeToMins(b.start);});
      });
      return next;
    });
    setAssignModal(null);
  };

  const toggleAssignTeam=(id)=>{
    setAssignModal(prev=>{
      const ids=prev.assignedTeamIds||[];
      return{...prev,assignedTeamIds:ids.includes(id)?ids.filter(x=>x!==id):[...ids,id]};
    });
  };

  const[showCalForm,setShowCalForm]=useState(null); // {date} or null
  const[showBlackout,setShowBlackout]=useState(false);
  const[blackoutForm,setBlackoutForm]=useState({date:"",label:"Cancelled",notes:""});

  // Check if a date is blacked out
  const isBlackedOut=(dateStr)=>blackoutDates.some(function(b){return b.date===dateStr;});
  const getBlackout=(dateStr)=>blackoutDates.find(function(b){return b.date===dateStr;});

  const addBlackout=async(form)=>{
    if(!form.date)return;
    const payload={date:form.date,label:form.label||"Cancelled",notes:form.notes||"",created_by:profile?.id||null};
    try{
      const r=await fetchWithRefresh(SURL+"/rest/v1/blackout_dates",{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify(payload)});
      if(r.ok){const d=await r.json();if(d[0]&&setBlackoutDates)setBlackoutDates(function(p){return[...p,d[0]];});}
    }catch(e){console.warn("Blackout save error",e);}
    setShowBlackout(false);
    setBlackoutForm({date:"",label:"Cancelled",notes:""});
  };

  const removeBlackout=async(id)=>{
    if(!window.confirm("Remove this blackout date?"))return;
    try{
      await fetchWithRefresh(SURL+"/rest/v1/blackout_dates?id=eq."+id,{method:"DELETE",headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
      if(setBlackoutDates)setBlackoutDates(function(p){return p.filter(function(b){return b.id!==id;});});
    }catch(e){console.warn("Blackout remove error",e);}
  };

  // Calendar helper - get events for a date (calendar_events + recurring schedule slots)
  const eventsOnDate=(dateStr)=>{
    // If date is blacked out, return only the blackout notice (no recurring events)
    const blackout=getBlackout(dateStr);
    if(blackout){
      return[{id:"blackout_"+dateStr,title:"🚫 "+blackout.label,event_type:"Blackout",start_time:"",end_time:"",_isBlackout:true,notes:blackout.notes,start_date:dateStr}];
    }
    const evs=[];
    // Real calendar events
    calendarEvents.forEach(function(ev){
      if(ev.start_date===dateStr){evs.push(ev);return;}
      if(ev.is_recurring&&(ev.recur_days||[]).length>0){
        const d=new Date(dateStr+"T12:00:00");
        const dayName=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()];
        if(!ev.recur_days.includes(dayName))return;
        if(ev.start_date>dateStr)return;
        if(ev.recur_until&&ev.recur_until<dateStr)return;
        evs.push({...ev,_occDate:dateStr});
      }
    });
    // Facility schedule slots for that day of week
    const d=new Date(dateStr+"T12:00:00");
    const dayName=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()];
    const daySlots=schedule[dayName]||{};
    Object.entries(daySlots).forEach(function([resource,sessions]){
      (sessions||[]).forEach(function(s){
        const assigned=(s.assignedTeamIds||[]).map(function(tid){return facilityTeams.find(function(t){return t.id===tid;});}).filter(Boolean);
        evs.push({id:"slot_"+resource+"_"+s.slotId+"_"+dateStr,title:s.label||s.type,event_type:s.event_type||s.type,start_time:s.start,end_time:s.end,_fromSlot:true,_resource:resource,assigned_team_ids:s.assignedTeamIds||[],_teams:assigned,start_date:dateStr});
      });
    });
    // Dedup by type+time
    const deduped=[];
    evs.forEach(function(ev){
      const key=(ev.label||ev.title)+"_"+ev.start_time+"_"+ev.end_time;
      if(!deduped.find(function(d){return d._key===key;}))deduped.push({...ev,_key:key});
    });

    raw.forEach(function(s){

        (s.assignedTeamIds||[]).forEach(function(tid){

    const grouped={};

function computeBenchTarget(rosterSize,totalGames=4){
  // Each player sits (rosterSize - 9) * totalGames / rosterSize games worth of innings
  // Expressed as % of total innings available
  if(rosterSize<=9)return 0;
  const sitsPerGame=(rosterSize-9)/rosterSize;
  return Math.round(sitsPerGame*100);
}

function computeWeekendDefense(players,games,teams,weekend){
  const weekendTeamIds=new Set((teams||[]).filter(t=>t.weekend_id===weekend?.id).map(t=>t.id));
  const weekendGames=games.filter(g=>weekendTeamIds.has(g.team_id));
  // Only count innings from games that have actual data (CSV import or field chart)
  const gamesWithData=weekendGames.filter(function(g){
    return Object.keys(g.imported_fielding||{}).length>0||Object.keys(g.field_chart||{}).length>0;
  });
  const totalInnings=gamesWithData.reduce((s,g)=>s+(g.innings||6),0);

  const result={};
  players.forEach(p=>{
    let primaryInn=0,secondaryInn=0,otherInn=0,benchInn=0,totalPlayed=0;
    const primaryPos=p.position||"";
    const secondaryPositions=(p.other_positions||[]);
    const posBreakdown={};

    weekendGames.forEach(g=>{
      const innings=g.innings||6;
      const imp=g.imported_fielding?.[p.id];
      const hasImport=Object.keys(g.imported_fielding||{}).length>0;
      const hasChart=Object.keys(g.field_chart||{}).length>0;
      // Skip games with no data — don't count their innings against bench
      if(!hasImport&&!hasChart)return;
      if(imp&&imp.Total>0){
        // Use GC imported data
        FIELD_POS.forEach(pos=>{
          const n=imp[pos]||0;
          if(n>0){
            posBreakdown[pos]=(posBreakdown[pos]||0)+n;
            totalPlayed+=n;
            if(pos===primaryPos)primaryInn+=n;
            else if(secondaryPositions.includes(pos))secondaryInn+=n;
            else otherInn+=n;
          }
        });
        benchInn+=Math.max(0,innings-imp.Total);
      } else {
        // Check field_chart tracking
        for(let inn=1;inn<=innings;inn++){
          const chart=getChartForInning(g,inn);
          const playingPos=Object.entries(chart||{}).find(([pos,id])=>id===p.id)?.[0];
          if(playingPos){
            posBreakdown[playingPos]=(posBreakdown[playingPos]||0)+1;
            totalPlayed++;
            if(playingPos===primaryPos)primaryInn++;
            else if(secondaryPositions.includes(playingPos))secondaryInn++;
            else otherInn++;
          } else {
            benchInn++;
          }
        }
      }
    });

    result[p.id]={
      primaryInn,secondaryInn,otherInn,benchInn,totalPlayed,totalInnings,
      posBreakdown,
      primaryPct:totalInnings>0?Math.round(primaryInn/totalInnings*100):0,
      benchPct:totalInnings>0?Math.round(benchInn/totalInnings*100):0,
    };
  });
  return result;
}
