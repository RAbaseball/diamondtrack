      <div className="pl">{gProgs.map((p,idx)=>{const cnt=gc(p);const tags=[...(p.targetGrads?.map(y=>`Class of ${y}`)||[]),...(p.targetGroups||[])];return(<div key={p.id} className="card pc cc" onClick={()=>onView(p)} style={{borderColor:idx===0?"rgba(232,160,32,.4)":"rgba(58,155,232,.2)"}}><div className="pi" style={{background:"rgba(58,155,232,.1)",color:"#3a9be8"}}>👥</div><div style={{flex:1}}><div style={{display:"flex",alignItems:"center",gap:6}}><div className="pn">{p.name}</div>{idx===0&&<span className="bdg bg3">★ Latest</span>}</div><div className="ps">{p.week}·{cnt} athletes</div><div style={{display:"flex",flexWrap:"wrap",gap:3,marginTop:4}}>{tags.map(t=><span key={t} style={{padding:"1px 6px",borderRadius:8,fontSize:9,fontWeight:700,textTransform:"uppercase",background:"rgba(58,155,232,.1)",color:"#3a9be8"}}>{t}</span>)}</div></div><span className="bdg bg4">{cnt}</span></div>);})}</div>
    </div>}
    <div>
      {gProgs.length>0&&iProgs.length>0&&<div className="ds" style={{display:"flex",alignItems:"center",gap:6}}><span style={{color:"#e8a020"}}>●</span> Individual Programs</div>}
      <div className="pl">
        {iProgs.length===0&&<div className="empty"><div className="ei">🏋️</div><div className="et">No programs yet</div></div>}
        {iProgs.map(p=>{const ath=athletes.find(a=>a.id===p.athleteId);const pct=calcPct(p);return(<div key={p.id} className="card pc cc" onClick={()=>onView(p)}><div className="pi">🏋️</div><div style={{flex:1}}><div className="pn">{p.name}</div><div className="ps">{ath?.name}·{p.week}</div><div className="pb" style={{marginTop:4}}><div className="pf" style={{width:`${pct}%`}}/></div></div><span className="bdg bg3">{pct}%</span></div>);})}
      </div>
    </div>
  </>);
}

function ProgDetail({prog,athletes,logs,sessions,calcPct,isSaved,getSess,onBack,onClickAth,onUpdate,onCopy,onDelete}){
  const[viewAth,setViewAth]=useState(null);
  const[editing,setEditing]=useState(false);
  const[editName,setEditName]=useState(prog.name);
  const[editWeek,setEditWeek]=useState(prog.week||"");
  const[editDays,setEditDays]=useState(prog.days||[]);
  const[activeDay,setActiveDay]=useState(0);
  const[showPicker,setShowPicker]=useState(false);
  const[saving,setSaving]=useState(false);
  const ath=athletes.find(a=>a.id===prog.athleteId);

  const updEx=(di,ei,k,v)=>{const u=[...editDays];u[di].exercises[ei][k]=v;setEditDays(u);};
  const remEx=(di,ei)=>{const u=[...editDays];u[di].exercises.splice(ei,1);setEditDays(u);};
  const addBlank=()=>{const u=[...editDays];u[activeDay].exercises.push({id:`e${Date.now()}`,name:"",sets:3,reps:10,weight:"",notes:""});setEditDays(u);};
  const addDay=()=>{const used=editDays.map(d=>d.day);const next=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].find(d=>!used.includes(d));if(next)setEditDays([...editDays,{day:next,exercises:[]}]);};
  const remDay=(i)=>{const u=[...editDays];u.splice(i,1);setEditDays(u);if(activeDay>=u.length)setActiveDay(Math.max(0,u.length-1));};
  const addEx=(ex)=>{const u=[...editDays];if(!u[activeDay])return;u[activeDay].exercises.push({id:`e${Date.now()}`,name:ex.name,sets:ex.sets,reps:ex.reps,weight:ex.wt||"",notes:""});setEditDays(u);setShowPicker(false);};
  const saveEdits=async()=>{setSaving(true);await onUpdate({...prog,name:editName,week:editWeek,days:editDays.filter(d=>d.exercises.length>0)});setSaving(false);setEditing(false);};
  const assigned=prog.isGroup?athletes.filter(a=>{const g=getPG(a.position);return(!prog.targetGrads?.length||prog.targetGrads.some(yr=>parseInt(yr)===parseInt(a.grad)))&&(!prog.targetGroups?.length||prog.targetGroups.includes(g));}):ath?[ath]:[];
  const tags=prog.isGroup?[...(prog.targetGrads?.map(y=>`Class of ${y}`)||[]),...(prog.targetGroups||[])]:[];
  const athPct=(aid)=>{const all=(prog.days||[]).flatMap(d=>d.exercises||[]);if(!all.length)return 0;return Math.round(all.filter(ex=>isSaved(prog.id,ex.id,aid)).length/all.length*100);};

  if(editing) return(<>
    <button className="bb" onClick={()=>setEditing(false)}>← Cancel Edit</button>
    <div className="ph">
      <div style={{flex:1}}>
        <div className="fg"><label>Program Name</label><input className="inp" value={editName} onChange={e=>setEditName(e.target.value)}/></div>
        <div className="fg"><label>Week / Label</label><input className="inp" value={editWeek} onChange={e=>setEditWeek(e.target.value)}/></div>
      </div>
    </div>
    <div className="fb" style={{marginBottom:10,flexWrap:"wrap"}}>
      {editDays.map((d,i)=><button key={i} className={`fc ${activeDay===i?"on":""}`} onClick={()=>setActiveDay(i)} style={{display:"flex",alignItems:"center",gap:4}}>{d.day} <span style={{fontSize:9}}>({d.exercises.length})</span> <span onClick={e=>{e.stopPropagation();remDay(i);}} style={{marginLeft:2,color:"#e84040",fontWeight:700,fontSize:11}}>✕</span></button>)}
      <button className="fc" onClick={addDay}>+ Day</button>
    </div>
    <div style={{display:"flex",gap:7,marginBottom:10}}>
      <button className="btn bg bsm" onClick={()=>setShowPicker(true)}>⚾ Library</button>
      <button className="btn bgh bsm" onClick={addBlank}>+ Blank</button>
    </div>
    {editDays[activeDay]&&<div style={{maxHeight:380,overflowY:"auto"}}>
      {editDays[activeDay].exercises.length===0&&<div className="empty" style={{padding:"16px 0"}}><div className="ei">⚾</div><div className="et" style={{fontSize:12}}>No exercises — add from library</div></div>}
      {editDays[activeDay].exercises.map((ex,ei)=>(
        <div key={ex.id||ei} style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.07)",borderRadius:7,padding:10,marginBottom:8}}>
          <div style={{display:"flex",gap:7,marginBottom:7,alignItems:"center"}}>
            <input className="inp" placeholder="Exercise name" value={ex.name} onChange={e=>updEx(activeDay,ei,"name",e.target.value)} style={{flex:1}}/>
            <button className="btn bgr bsm" onClick={()=>remEx(activeDay,ei)}>✕</button>
          </div>
          <div className="fg3" style={{marginBottom:6}}>
            <div className="fg"><label>Sets</label><input className="inp" type="number" value={ex.sets} onChange={e=>updEx(activeDay,ei,"sets",e.target.value)}/></div>
            <div className="fg"><label>Reps</label><input className="inp" type="number" value={ex.reps} onChange={e=>updEx(activeDay,ei,"reps",e.target.value)}/></div>
            <div className="fg"><label>Load</label><input className="inp" placeholder="45 lbs" value={ex.weight||""} onChange={e=>updEx(activeDay,ei,"weight",e.target.value)}/></div>
          </div>
          <div className="fg" style={{marginBottom:0}}><label>Coach Notes</label><input className="inp" placeholder="Cues, focus..." value={ex.notes||""} onChange={e=>updEx(activeDay,ei,"notes",e.target.value)}/></div>
        </div>
      ))}
    </div>}
    <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:14,paddingTop:12,borderTop:"1px solid rgba(255,255,255,.07)"}}>
      <button className="btn bgh" onClick={()=>setEditing(false)}>Cancel</button>
      <button className="btn bg" onClick={saveEdits} disabled={saving||!editName.trim()}>{saving?"Saving...":"Save Changes"}</button>
    </div>
    {showPicker&&<ExPicker onSelect={addEx} onClose={()=>setShowPicker(false)}/>}
  </>);

  if(viewAth){
    const sess=getSess(prog.id,viewAth.id);
    return(<>
      <button className="bb" onClick={()=>setViewAth(null)}>← Back to Program</button>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
        <div className="av" style={{width:38,height:38,fontSize:13}}>{viewAth.avatar||ini(viewAth.name)}</div>
        <div><div style={{fontWeight:700,fontSize:16}}>{viewAth.name}</div><div style={{fontSize:10,color:"#6b82a0"}}>{prog.name}·{athPct(viewAth.id)}% complete</div></div>
      </div>
      {(prog.days||[]).map((day,di)=>(
        <div key={di} style={{marginBottom:16}}>
          <div style={{fontSize:12,fontWeight:700,textTransform:"uppercase",color:"#e8a020",marginBottom:8}}>{day.day}</div>
          {(day.exercises||[]).map(ex=>{
            const log=logs[`${prog.id}-${viewAth.id}-${ex.id}`]||{};
            return(<div key={ex.id} className={`le ${log.saved?"done":""}`}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}><div className="lex">{ex.name}</div>{log.saved?<span className="bdg bg2">✓ Logged</span>:<span className="bdg" style={{background:"rgba(255,255,255,.05)",color:"#6b82a0"}}>Pending</span>}</div>
              <div className="lep">Prescribed: {ex.sets}×{ex.reps} @ {ex.weight}</div>
              {log.saved&&<div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginTop:8}}>{[["Reps",log.reps],["Weight",log.weight],["Sets",log.sets]].map(([l,v])=><div key={l} style={{background:"rgba(255,255,255,.04)",borderRadius:6,padding:"6px 8px"}}><div style={{fontSize:9,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:2}}>{l}</div><div style={{fontSize:14,fontWeight:700}}>{v||"—"}</div></div>)}</div>}
              {log.notes&&<div style={{marginTop:6,padding:"6px 8px",background:"rgba(232,160,32,.05)",border:"1px solid rgba(232,160,32,.12)",borderRadius:6,fontSize:11,color:"#8fa3be"}}><span style={{color:"#e8a020",fontWeight:700}}>Note: </span>{log.notes}</div>}
            </div>);
          })}
        </div>
      ))}
    </>);
  }

  return(<>
    <button className="bb" onClick={onBack}>← Back</button>
    <div className="ph">
      <div>
        <div className="pt">{prog.name}</div>
        {prog.isGroup?<div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:4}}><span className="bdg bg4">👥 Group</span>{tags.map(t=><span key={t} style={{padding:"1px 6px",borderRadius:8,fontSize:9,fontWeight:700,textTransform:"uppercase",background:"rgba(58,155,232,.1)",color:"#3a9be8"}}>{t}</span>)}</div>:<div style={{fontSize:11,color:"#6b82a0"}}>{ath?.name}·{prog.week}</div>}
      </div>
      <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
        <button className="btn bgh bsm" onClick={()=>onCopy(prog,prog.athleteId)}>📋 Copy</button>
        <button className="btn bg bsm" onClick={()=>{setEditName(prog.name);setEditWeek(prog.week||"");setEditDays(JSON.parse(JSON.stringify(prog.days||[])));setActiveDay(0);setEditing(true);}}>✏️ Edit</button>
        <button className="btn bgr bsm" onClick={()=>onDelete(prog.id)}>🗑 Delete</button>
      </div>
    </div>
    {assigned.length>0&&<div className="card" style={{marginBottom:16,padding:0,overflow:"hidden"}}>
      <div style={{padding:"10px 14px",borderBottom:"1px solid rgba(255,255,255,.07)",fontSize:11,fontWeight:700,textTransform:"uppercase",color:"#8fa3be"}}>Athlete Completion</div>
      <table className="tbl"><thead><tr><th>Athlete</th><th>Progress</th><th>Started</th><th>Duration</th><th></th></tr></thead>
      <tbody>{assigned.map(a=>{
        const pct=athPct(a.id);const sess=getSess(prog.id,a.id);
        const dur=sess.started_at&&sess.completed_at?Math.round((new Date(sess.completed_at)-new Date(sess.started_at))/60000):null;
        return(<tr key={a.id}><td><span style={{fontWeight:600,cursor:"pointer",color:"#e8a020",textDecoration:"underline"}} onClick={()=>onClickAth&&onClickAth(a)}>{a.name}</span></td>
          <td><div style={{display:"flex",alignItems:"center",gap:6,minWidth:90}}><div style={{flex:1,height:5,background:"rgba(255,255,255,.06)",borderRadius:3,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:pct===100?"#27c97a":"linear-gradient(90deg,#e8a020,#f5c060)",borderRadius:3}}/></div><span style={{fontSize:11,fontWeight:700,color:pct===100?"#27c97a":"#e8a020"}}>{pct}%</span></div></td>
          <td style={{fontSize:10,color:"#6b82a0"}}>{sess.started_at?fmtT(sess.started_at):"—"}</td>
          <td style={{fontSize:11,color:"#e8a020",fontWeight:600}}>{dur?fmtD(dur):"—"}</td>
          <td><button className="btn bgh bsm" onClick={()=>setViewAth(a)}>View Log</button></td>
        </tr>);
      })}</tbody></table>
    </div>}
    {/* Practice plan — itinerary view with print preview */}
    {(prog.planType==="plan"||prog.plan_type==="plan")?(
      <div>
        {prog.planNotes&&<div style={{padding:"8px 12px",background:"rgba(255,255,255,.04)",borderLeft:"3px solid #27c97a",borderRadius:"0 6px 6px 0",fontSize:12,color:"#c0cce0",marginBottom:14,fontStyle:"italic"}}>{prog.planNotes}</div>}
        {(prog.days||[]).map((section,si)=>(
          <div key={si} style={{marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",gap:0,marginBottom:6}}>
              {section.startTime&&<div style={{fontWeight:900,fontSize:12,background:"#27c97a",color:"#080e1a",padding:"5px 10px",borderRadius:"6px 0 0 6px",minWidth:70,textAlign:"center",flexShrink:0}}>{fmt12(section.startTime)}</div>}
              <div style={{fontWeight:800,fontSize:13,textTransform:"uppercase",background:"rgba(39,201,122,.08)",border:"1px solid rgba(39,201,122,.2)",padding:"5px 14px",flex:1,borderRadius:section.startTime?"0 6px 6px 0":"6px",display:"flex",justifyContent:"space-between"}}>
                <span style={{color:"#27c97a"}}>{section.day}</span>
                {section.sectionDuration&&<span style={{fontSize:11,color:"#6b82a0",fontWeight:600}}>{section.sectionDuration} min</span>}
              </div>
            </div>
            <div style={{paddingLeft:14}}>
              {(section.exercises||[]).map((ex,ei)=>(
                <div key={ei} style={{display:"flex",gap:8,marginBottom:5,alignItems:"flex-start"}}>
                  <span style={{color:"#27c97a",fontSize:14,flexShrink:0}}>•</span>
                  <div>
                    <span style={{fontWeight:700,fontSize:13}}>{ex.name||"Activity"}</span>
                    {ex.weight&&<span style={{fontSize:11,color:"#6b82a0"}}> — {ex.weight} min</span>}
                    {ex.notes&&<span style={{fontSize:11,color:"#c0cce0",fontStyle:"italic"}}> — {ex.notes}</span>}
                  </div>
                </div>
              ))}
              {section.sectionNote&&<div style={{padding:"4px 10px",background:"rgba(255,255,255,.02)",borderLeft:"2px solid rgba(255,255,255,.1)",fontSize:11,color:"#8fa3be",fontStyle:"italic",marginTop:4,marginLeft:8}}>{section.sectionNote}</div>}
            </div>
          </div>
        ))}
        <div style={{marginTop:18,borderTop:"1px solid rgba(255,255,255,.08)",paddingTop:14}}>
          <div style={{fontWeight:700,fontSize:13,marginBottom:10,display:"flex",alignItems:"center",gap:8}}>
            🖨️ Print View
            <button className="btn bg bsm" onClick={()=>window.print()}>Print</button>
          </div>
          <div style={{background:"white",borderRadius:10,overflow:"hidden"}}>
            <AthPlanPrint plan={prog} athlete={athletes.find(a=>a.id===prog.athleteId)||{name:"Team"}} reps={{}}/>
          </div>
        </div>
      </div>
    ):(
      /* Regular workout — sets/reps table */
      (prog.days||[]).map((day,di)=>(
        <div key={di} className="db">
          <div className="dh"><div className="dl">{day.day}</div><span className="bdg bg4">{(day.exercises||[]).length} exercises</span></div>
          <table className="tbl"><thead><tr><th>Exercise</th><th>Sets</th><th>Reps</th><th>Load</th></tr></thead>
          <tbody>{(day.exercises||[]).map(ex=><tr key={ex.id}><td style={{fontWeight:600}}>{ex.name}</td><td>{ex.sets}</td><td>{ex.reps}</td><td>{ex.weight||"—"}</td></tr>)}</tbody></table>
        </div>
      ))
    )}
  </>);
}

function GroupsPage({athletes,onClickAth}){

function MsgsPage({profile,athletes,messages,sendMsg,chatPartner,setChatPartner}){
  const[showBC,setShowBC]=useState(false);
  const[bcTxt,setBcTxt]=useState("");
  const[bcGrads,setBcGrads]=useState([]);
  const[bcGroups,setBcGroups]=useState([]);
  const[chatTxt,setChatTxt]=useState("");
  const bottomRef=useRef(null);
  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});},[messages.length,chatPartner]);
  const convo=chatPartner?messages.filter(m=>(m.sender_id===profile.id&&m.recipient_id===chatPartner.id)||(m.sender_id===chatPartner.id&&m.recipient_id===profile.id)):[];
  const tc=athletes.filter(a=>{const g=getPG(a.position);return(!bcGrads.length||bcGrads.includes(a.grad))&&(!bcGroups.length||bcGroups.includes(g));}).length;
  const sendDirect=async()=>{if(!chatTxt.trim()||!chatPartner)return;await sendMsg(chatTxt.trim(),chatPartner.id);setChatTxt("");};
  const sendBC=async()=>{if(!bcTxt.trim())return;await sendMsg(bcTxt.trim(),null,true,bcGrads,bcGroups);setBcTxt("");setShowBC(false);};

  if(chatPartner)return(<>
    <button className="bb" onClick={()=>setChatPartner(null)}>← Messages</button>
    <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:14}}>
      <div className="av" style={{width:34,height:34,fontSize:12}}>{chatPartner.avatar||ini(chatPartner.name)}</div>
      <div><div style={{fontWeight:700}}>{chatPartner.name}</div><div style={{fontSize:10,color:"#6b82a0"}}>{chatPartner.position}·{chatPartner.grad}</div></div>
    </div>
    <div className="card" style={{padding:0,overflow:"hidden",display:"flex",flexDirection:"column",height:"calc(100vh - 280px)"}}>
      <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",gap:8,padding:14}}>
        {convo.length===0&&<div className="empty" style={{padding:"16px 0"}}><div className="ei">💬</div><div className="et" style={{fontSize:13}}>No messages yet</div></div>}
        {convo.map(m=>{const mine=m.sender_id===profile.id;return(<div key={m.id} className={`msgrow ${mine?"me":"them"}`}><div className={`msgbub ${mine?"me":"them"}`}>{m.content}</div><div className="msgt">{fmtT(m.created_at)}</div></div>);})}
        <div ref={bottomRef}/>
      </div>
      <div className="hc">
        <input className="inp" style={{flex:1}} placeholder={`Message ${chatPartner.name.split(" ")[0]}...`} value={chatTxt} onChange={e=>setChatTxt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendDirect()}/>
        <button className="btn bg bsm" onClick={sendDirect}>Send</button>
      </div>
    </div>
  </>);

  return(<>
    <div className="ph"><div className="pt">Messages <em>&amp; Broadcasts</em></div><button className="btn bg" onClick={()=>setShowBC(!showBC)}>📢 Broadcast</button></div>
    {showBC&&<div className="card" style={{marginBottom:16,borderColor:"rgba(232,160,32,.25)"}}>
      <div style={{fontWeight:700,fontSize:13,textTransform:"uppercase",color:"#e8a020",marginBottom:12}}>📢 Broadcast Message</div>
      <div style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.07)",borderRadius:8,padding:12,marginBottom:12}}>
        <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:7}}>Target Grad Years (empty = all)</div>
        <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:10}}>{GRAD_YEARS.map(yr=>{const on=bcGrads.includes(yr);return(<button key={yr} onClick={()=>setBcGrads(p=>on?p.filter(y=>y!==yr):[...p,yr])} style={{padding:"4px 10px",borderRadius:12,border:`1px solid ${on?grColor[yr]:"rgba(255,255,255,.12)"}`,background:on?`${grColor[yr]}20`:"transparent",color:on?grColor[yr]:"#8fa3be",fontSize:11,fontWeight:700,cursor:"pointer"}}>{on&&"✓ "}Class of {yr}</button>);})}</div>
        <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:7}}>Target Position Groups</div>

    </div>}

        const unread=messages.filter(m=>m.sender_id===a.id&&m.recipient_id===profile.id&&!(m.read_by||[]).includes(profile.id)).length;
        return(<div key={a.id} className="card cc" style={{padding:"12px 14px",display:"flex",alignItems:"center",gap:10}} onClick={()=>setChatPartner(a)}>
          <div className="av" style={{width:34,height:34,fontSize:12}}>{a.avatar||ini(a.name)}</div>
          <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,fontSize:13}}>{a.name}</div><div style={{fontSize:10,color:"#6b82a0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{last?last.content:"No messages yet"}</div></div>
          <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>

          </div>
        </div>);
      })}
    </div>
  </>);
}

function SessionJournal({logs,isCoach=false}){
  const[selected,setSelected]=useState(null);
  const[filterType,setFilterType]=useState("All");
  const STYPES_DEF={
    "Weight Training":{icon:"🏋️",color:"#e8a020"},
    "Hitting":{icon:"⚾",color:"#e84040"},
    "Throwing":{icon:"🎯",color:"#3a9be8"},
    "Fielding":{icon:"🥎",color:"#27c97a"},
    "Workout":{icon:"✅",color:"#9b59b6"},
    "Game":{icon:"🏟️",color:"#e67e22"},
    "Practice":{icon:"📋",color:"#8e44ad"},
    "Showcase":{icon:"⭐",color:"#f1c40f"},
  };
  const types=["All",...Object.keys(STYPES_DEF)];
  const filtered=filterType==="All"?logs:logs.filter(l=>l.type===filterType);

  const MetricRow=({label,value})=>value?(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid rgba(255,255,255,.05)"}}>
      <div style={{fontSize:12,color:"#8fa3be"}}>{label}</div>
      <div style={{fontSize:13,fontWeight:700,color:"#eef2f8"}}>{value}</div>
    </div>
  ):null;

  const METRIC_LABELS={
    // Weight Training
    exercises:"Exercises",sets:"Total Sets",topWeight:"Top Weight (lbs)",duration:"Duration (min)",
    // Hitting
    swings:"Total Swings",teeSwings:"Tee Swings",bpSwings:"BP Swings",exitVelo:"Best Exit Velo (mph)",
    // Throwing
    pitches:"Total Throws",bullpenPitches:"Bullpen Pitches",topVelo:"Top Velo (mph)",longTossMax:"Long Toss Max (ft)",
    // Fielding
    groundBalls:"Ground Balls",flyBalls:"Fly Balls",blocking:"Blocking Reps",throws:"Fielding Throws",
    // Workout (program completion)
    program:"Program",week:"Week",
    // Game
    opponent:"Opponent",result:"Result",atBats:"At Bats",hits:"Hits",rbi:"RBI",runs:"Runs Scored",stolenBases:"Stolen Bases",pitchingIP:"Innings Pitched",pitchingK:"Strikeouts",pitchingER:"Earned Runs",
    // Throwing / spin rates
    spinFB:"FB Spin Rate (rpm)",spinCB:"CB Spin Rate (rpm)",spinCH:"CH Spin Rate (rpm)",spinOther:"Other Spin Rate (rpm)",
    // Practice
    focus:"Focus Area",notes_highlights:"Highlights",
    // Showcase
    eventName:"Event Name",location:"Location",sixty:"60-Yard Dash",popTime:"Pop Time",offersReceived:"Offers Received",schoolsPresent:"Schools Present",
  };

  if(selected){
    const def=STYPES_DEF[selected.type]||{icon:"📋",color:"#e8a020"};
    const metrics=selected.metrics||{};
    return(
      <div>
        <button className="bb" onClick={()=>setSelected(null)}>← Journal</button>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
          <div style={{width:44,height:44,borderRadius:10,background:`${def.color}20`,border:`1px solid ${def.color}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{def.icon}</div>
          <div>
            <div style={{fontSize:18,fontWeight:800,color:def.color}}>{selected.type}</div>
            <div style={{fontSize:11,color:"#6b82a0"}}>{selected.date_label||new Date(selected.created_at).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</div>
          </div>
        </div>
        {Object.keys(metrics).length>0&&<div className="card" style={{marginBottom:12}}>
          <div className="ds">Session Numbers</div>
          {Object.entries(metrics).map(([k,v])=>v?<MetricRow key={k} label={METRIC_LABELS[k]||k} value={v}/>:null)}
        </div>}
        {selected.notes&&<div className="card" style={{borderColor:`${def.color}30`}}>
          <div className="ds">Notes</div>
          <div style={{fontSize:14,lineHeight:1.7,color:"#eef2f8",whiteSpace:"pre-wrap"}}>{selected.notes}</div>
        </div>}
        {!selected.notes&&!Object.values(metrics).some(Boolean)&&<div className="empty"><div className="ei">{def.icon}</div><div className="et">No details recorded</div></div>}
      </div>
    );
  }

  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <div style={{fontSize:14,fontWeight:700}}>{isCoach?"Athlete Session Journal":"My Session Journal"}</div>
        <div style={{fontSize:11,color:"#6b82a0"}}>{filtered.length} session{filtered.length!==1?"s":""}</div>
      </div>
      <div className="fb" style={{marginBottom:14}}>
        {types.map(t=>{
          const def=STYPES_DEF[t];
          return(<button key={t} className={`fc ${filterType===t?"on":""}`} onClick={()=>setFilterType(t)} style={filterType===t&&def?{borderColor:def.color,color:def.color,background:`${def.color}15`}:{}}>{def?def.icon+" ":""}{t}</button>);
        })}
      </div>
      {filtered.length===0&&<div className="empty"><div className="ei">📓</div><div className="et">No sessions yet</div><div className="es">{isCoach?"Athlete hasn't logged any sessions.":"Log a session to start your journal."}</div></div>}
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {filtered.map(log=>{
          const def=STYPES_DEF[log.type]||{icon:"📋",color:"#e8a020"};
          const metrics=log.metrics||{};
          const highlights=Object.entries(metrics).filter(([k,v])=>v).slice(0,3);
          return(
            <div key={log.id} className="card cc" onClick={()=>setSelected(log)} style={{borderLeft:`3px solid ${def.color}`,cursor:"pointer"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:highlights.length||log.notes?8:0}}>
                <div style={{fontSize:22}}>{def.icon}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:14,color:def.color}}>{log.type}</div>
                  <div style={{fontSize:11,color:"#6b82a0"}}>{log.date_label||new Date(log.created_at).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</div>
                </div>
                <span style={{fontSize:11,color:"#6b82a0"}}>View →</span>
              </div>
              {highlights.length>0&&<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {highlights.map(([k,v])=>(
                  <div key={k} style={{background:"rgba(255,255,255,.04)",borderRadius:6,padding:"4px 9px"}}>
                    <div style={{fontSize:9,color:"#6b82a0",textTransform:"uppercase",letterSpacing:".3px"}}>{METRIC_LABELS[k]||k}</div>
                    <div style={{fontSize:13,fontWeight:700}}>{v}</div>
                  </div>
                ))}
              </div>}
              {log.notes&&<div style={{marginTop:8,fontSize:12,color:"#8fa3be",fontStyle:"italic",lineHeight:1.5,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>"{log.notes}"</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function WorkoutLogger({prog,athlete,getLog,updateLog,saveEx,markComplete,calcPct,onBack,getSess,reloadLogs}){
  const[fields,setFields]=useState({});
  const[showPrint,setShowPrint]=useState(false);
  const isPlan=prog.planType==="plan"||prog.plan_type==="plan";
  const completing=useRef(false);
  // Reload logs from DB on mount to ensure fresh completion state
  useEffect(()=>{
    if(!reloadLogs)return;
    reloadLogs(prog.id);
  },[prog.id]);
  const pct=calcPct(prog);
  const sess=getSess?getSess(prog.id):{};
  const dur=sess.started_at&&sess.completed_at?Math.round((new Date(sess.completed_at)-new Date(sess.started_at))/60000):sess.started_at?Math.round((Date.now()-new Date(sess.started_at))/60000):null;
  useEffect(()=>{if(pct===100&&!sess.completed_at&&!completing.current){completing.current=true;markComplete(prog.id);}},[pct,sess.completed_at]);
  const handleSave=async(pId,exId)=>{
    const f=fields[exId]||{};
    if(f.reps)await updateLog(pId,exId,"reps",f.reps);
    if(f.weight)await updateLog(pId,exId,"weight",f.weight);
    if(f.sets)await updateLog(pId,exId,"sets",f.sets);
    if(f.notes)await updateLog(pId,exId,"notes",f.notes);
    await saveEx(pId,exId);
  };
  return(<>
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
      <button className="bb" style={{marginBottom:0}} onClick={onBack}>← My Workouts</button>
      <button className="btn bgh bsm" onClick={()=>setShowPrint(p=>!p)} style={{marginLeft:"auto"}}>{showPrint?"📋 List View":"🖨️ Print View"}</button>
    </div>
    {showPrint&&<div style={{marginBottom:16}}><AthPlanPrint plan={prog} athlete={athlete||{name:""}} reps={{}}/></div>}
    {!showPrint&&<>
    <div className="ph">
      <div><div style={{fontSize:18,fontWeight:800}}>{prog.name}</div><div style={{fontSize:11,color:"#6b82a0"}}>{prog.week}</div></div>
      <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
        <span className="bdg bg3">{pct}% Done</span>
        {sess.started_at&&<span style={{fontSize:9,color:"#6b82a0"}}>Started {fmtT(sess.started_at)}{dur!==null?` · ${fmtD(dur)}`:""}</span>}
      </div>
    </div>
    {(prog.days||[]).map((day,di)=>(
      <div key={di} style={{marginBottom:18}}>
        <div style={{fontSize:14,fontWeight:800,textTransform:"uppercase",color:"#e8a020",letterSpacing:".8px",marginBottom:8,paddingBottom:6,borderBottom:"1px solid rgba(255,255,255,.07)"}}>{day.day}</div>
        {(day.exercises||[]).map(ex=>{
          const log=getLog(prog.id,ex.id);const saved=log.saved;
          const f=fields[ex.id]||{};
          const upd=(k,v)=>setFields(p=>({...p,[ex.id]:{...(p[ex.id]||{}),[k]:v}}));
          return(<div key={ex.id} className={`le ${saved?"done":""}`}>
            <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}>
              <div className="lex">{ex.name}</div>
              {saved&&<span className="bdg bg2" style={{marginLeft:"auto"}}>✓ Logged</span>}
            </div>
            <div className="lep">Prescribed: {ex.sets} sets × {ex.reps} reps @ {ex.weight}</div>
            {ex.notes&&<div style={{fontSize:10,color:"#e8a020",marginTop:1}}>Coach: {ex.notes}</div>}
            <div className="lg">
              <div className="lf"><label>Reps Done</label><input className="inp" type="number" placeholder={ex.reps} value={f.reps||log.reps||""} onChange={e=>upd("reps",e.target.value)}/></div>
              <div className="lf"><label>Weight/Load</label><input className="inp" placeholder={ex.weight} value={f.weight||log.weight||""} onChange={e=>upd("weight",e.target.value)}/></div>
              <div className="lf"><label>Sets Done</label><input className="inp" type="number" placeholder={ex.sets} value={f.sets||log.sets||""} onChange={e=>upd("sets",e.target.value)}/></div>
              <div className="lf lfw"><label>Notes</label><input className="inp" placeholder="How did it feel?" value={f.notes||log.notes||""} onChange={e=>upd("notes",e.target.value)}/></div>
            </div>
            <div style={{display:"flex",justifyContent:"flex-end",marginTop:8}}>
              <button className={`btn bsm ${saved?"bgh":"bgn"}`} onClick={()=>handleSave(prog.id,ex.id)}>{saved?"✓ Saved":"Save Exercise"}</button>
            </div>
          </div>);
        })}
      </div>
    ))}
    {pct===100&&<div className="cel"><div style={{fontSize:32}}>🏆</div><div style={{fontSize:20,fontWeight:800,marginTop:8}}>Workout Complete!</div>{dur&&<div style={{color:"#e8a020",fontWeight:700,marginTop:4}}>⏱ {fmtD(dur)}</div>}<div style={{fontSize:12,color:"#8fa3be",marginTop:5}}>Great work, {athlete.name?.split(" ")[0]}. Keep grinding.</div></div>}
  </>}
  </>);
}


function DrillLibraryPage({athletes,customDrills,setCustomDrills,profile,isAdmin}){
  const[selCat,setSelCat]=useState("All");
  const[search,setSearch]=useState("");
  const[showForm,setShowForm]=useState(false);
  const[editDrill,setEditDrill]=useState(null);
  const[saving,setSaving]=useState(false);
  const blankForm={name:"",cat:EX_CATS[0],desc:"",sets:3,reps:10,wt:""};
  const[form,setForm]=useState(blankForm);
  const upd=(k,v)=>setForm(p=>({...p,[k]:v}));

  const stockDrills=EXERCISE_LIBRARY.map(d=>({...d,isCustom:false}));
  const customList=(customDrills||[]).map(d=>({...d,id:"custom_"+d.id,isCustom:true}));
  const allDrills=[...stockDrills,...customList];
  const CAT_LIST=["All",...EX_CATS,"Custom"];

  const filtered=allDrills.filter(function(d){
    const matchCat=selCat==="All"||(selCat==="Custom"?d.isCustom:d.cat===selCat);
    const srch=search.toLowerCase();
    const matchSearch=!srch||d.name.toLowerCase().includes(srch)||(d.desc||"").toLowerCase().includes(srch);
    return matchCat&&matchSearch;
  });

  const openNew=()=>{setForm(blankForm);setEditDrill(null);setShowForm(true);};
  const openEdit=(d)=>{setForm({name:d.name,cat:d.cat,desc:d.desc||"",sets:d.sets||3,reps:d.reps||10,wt:d.wt||""});setEditDrill(d);setShowForm(true);};
  const openDupe=(d)=>{setForm({name:d.name+" (Copy)",cat:d.cat,desc:d.desc||"",sets:d.sets||3,reps:d.reps||10,wt:d.wt||""});setEditDrill(null);setShowForm(true);};

  const saveDrill=async()=>{
    if(!form.name.trim()){alert("Enter a drill name.");return;}
    setSaving(true);
    if(editDrill&&editDrill.isCustom){
      const rawId=editDrill.id.replace("custom_","");
      const r=await fetchWithRefresh(`${SURL}/rest/v1/custom_exercises?id=eq.${rawId}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify({name:form.name,cat:form.cat,description:form.desc,sets:parseInt(form.sets)||3,reps:parseInt(form.reps)||10,wt:form.wt||null})});
      if(r.ok){const updated=await r.json();setCustomDrills(p=>p.map(d=>String(d.id)===rawId?{...d,...updated[0]}:d));}
    } else {
      const r=await fetchWithRefresh(`${SURL}/rest/v1/custom_exercises`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify({name:form.name,cat:form.cat,description:form.desc,sets:parseInt(form.sets)||3,reps:parseInt(form.reps)||10,wt:form.wt||null,created_by:profile?.id})});
      if(r.ok){const created=await r.json();setCustomDrills(p=>[...p,created[0]]);}
    }
    setSaving(false);setShowForm(false);setEditDrill(null);
  };

  const delDrill=async(d)=>{
    if(!d.isCustom){alert("Stock drills cannot be deleted.");return;}
    if(!window.confirm("Delete this drill?"))return;
    const rawId=d.id.replace("custom_","");
    const r=await fetchWithRefresh(`${SURL}/rest/v1/custom_exercises?id=eq.${rawId}`,{method:"DELETE",headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    if(r.ok)setCustomDrills(p=>p.filter(x=>String(x.id)!==rawId));
  };

  return(<>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:8}}>
      <div style={{fontWeight:800,fontSize:20}}>⚾ Drill Library</div>
      <button className="btn bg" onClick={openNew}>+ New Drill</button>
    </div>
    <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
      <input className="inp" placeholder="Search drills..." value={search} onChange={e=>setSearch(e.target.value)} style={{flex:1,minWidth:160}}/>
      <select className="inp" value={selCat} onChange={e=>setSelCat(e.target.value)} style={{minWidth:150}}>
        {CAT_LIST.map(function(cat2){
          const cnt=cat2==="All"?allDrills.length:cat2==="Custom"?customList.length:stockDrills.filter(function(d){return d.cat===cat2;}).length;
          return(<option key={cat2} value={cat2}>{cat2} ({cnt})</option>);
        })}
      </select>
    </div>
    {filtered.length===0&&<div className="empty"><div className="ei">⚾</div><div className="et">No drills found</div></div>}
    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      {filtered.map(function(d){
        return(
          <div key={d.id} style={{padding:"11px 14px",background:"rgba(255,255,255,.03)",border:"1px solid "+(d.isCustom?"rgba(232,160,32,.2)":"rgba(255,255,255,.07)"),borderRadius:9}}>
            <div style={{display:"flex",alignItems:"flex-start",gap:10}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",marginBottom:3}}>
                  <span style={{fontWeight:700,fontSize:14}}>{d.name}</span>
                  <span style={{background:d.isCustom?"rgba(232,160,32,.12)":"rgba(255,255,255,.06)",color:d.isCustom?"#e8a020":"#6b82a0",borderRadius:8,padding:"1px 8px",fontSize:10,fontWeight:700}}>{d.cat}</span>
                  {d.isCustom&&<span style={{background:"rgba(232,160,32,.08)",color:"#e8a020",borderRadius:8,padding:"1px 7px",fontSize:9,fontWeight:700}}>Custom</span>}
                </div>
                {(d.sets||d.reps||d.wt)&&<div style={{fontSize:11,color:"#6b82a0",marginBottom:d.desc?4:0}}>{d.sets&&d.sets+"×"}{d.reps&&d.reps+" reps"}{d.wt?" · "+d.wt:""}</div>}
                {d.desc&&<div style={{fontSize:11,color:"#8fa3be",lineHeight:1.5}}>{d.desc}</div>}
              </div>
              <div style={{display:"flex",gap:5,flexShrink:0}}>
                <button className="btn bgh bsm" onClick={function(){openDupe(d);}}>⧉</button>
                {d.isCustom&&<button className="btn bgh bsm" onClick={function(){openEdit(d);}}>✏️</button>}
                {d.isCustom&&<button className="btn bgr bsm" onClick={function(){delDrill(d);}}>✕</button>}
              </div>
            </div>
          </div>
        );
      })}
    </div>
    {showForm&&<div className="mbg" onClick={function(){setShowForm(false);}}>
      <div style={{background:"#0d1526",border:"1px solid rgba(255,255,255,.15)",borderRadius:14,width:"100%",maxWidth:520,maxHeight:"90vh",overflow:"auto",padding:20}} onClick={function(e){e.stopPropagation();}}>
        <div style={{fontWeight:800,fontSize:16,marginBottom:16}}>{editDrill?"✏️ Edit Drill":"+ New Drill"}</div>
        <div className="fg"><label>Drill Name *</label><input className="inp" value={form.name} onChange={function(e){upd("name",e.target.value);}} placeholder="e.g. Two-Hand Tee Work"/></div>
        <div className="fg"><label>Category</label>
          <select className="inp" value={form.cat} onChange={function(e){upd("cat",e.target.value);}}>
            {EX_CATS.map(function(cat2){return(<option key={cat2} value={cat2}>{cat2}</option>);})}
            <option value="Custom">Custom</option>
            <option value="Team Drills">Team Drills</option>
          </select>
        </div>
        <div className="fg2">
          <div className="fg"><label>Sets</label><input className="inp" type="number" value={form.sets} onChange={function(e){upd("sets",e.target.value);}}/></div>
          <div className="fg"><label>Reps</label><input className="inp" type="number" value={form.reps} onChange={function(e){upd("reps",e.target.value);}}/></div>
        </div>
        <div className="fg"><label>Equipment / Load</label><input className="inp" value={form.wt} onChange={function(e){upd("wt",e.target.value);}} placeholder="e.g. J-Band, 10 lbs"/></div>
        <div className="fg" style={{marginBottom:16}}><label>Description (shows inline on print)</label><textarea className="inp" value={form.desc} onChange={function(e){upd("desc",e.target.value);}} placeholder="Explain the drill purpose for athletes and parents..." style={{minHeight:80}}/></div>
        <div style={{display:"flex",gap:8}}>
          <button className="btn bg" onClick={saveDrill} disabled={saving} style={{flex:1}}>{saving?"Saving...":editDrill?"💾 Save Changes":"+ Add Drill"}</button>
          <button className="btn bgh" onClick={function(){setShowForm(false);}}>Cancel</button>
        </div>
      </div>
    </div>}
  </>);
}

function addMinutes(timeStr, mins){
  if(!timeStr)return"";
  const[h,m]=timeStr.split(":").map(Number);
  const total=h*60+m+mins;
  const nh=Math.floor(total/60)%24;
  const nm=total%60;
  return String(nh).padStart(2,"0")+":"+String(nm).padStart(2,"0");
}

function fmt12(t){
  if(!t)return"";
  const[h,m]=t.split(":").map(Number);
  const ampm=h<12?"AM":"PM";
  const h12=h%12||12;
  return h12+":"+(m<10?"0"+m:m)+" "+ampm;
}

function computeBenchTarget(rosterSize,totalGames=4){
  // Each player sits (rosterSize - 9) * totalGames / rosterSize games worth of innings
  // Expressed as % of total innings available
  if(rosterSize<=9)return 0;
  const sitsPerGame=(rosterSize-9)/rosterSize;
  return Math.round(sitsPerGame*100);
}

function computeWeekendDefense(players,games,teams,weekend){
  const weekendTeamIds=new Set((teams||[]).filter(t=>t.weekend_id===weekend?.id).map(t=>t.id));
  const weekendGames=games.filter(g=>weekendTeamIds.has(g.team_id));
  const totalInnings=weekendGames.reduce((s,g)=>s+(g.innings||6),0);

  const result={};
  players.forEach(p=>{
    let primaryInn=0,secondaryInn=0,otherInn=0,benchInn=0,totalPlayed=0;
    const primaryPos=p.position||"";
    const secondaryPositions=(p.other_positions||[]);
    const posBreakdown={};

    weekendGames.forEach(g=>{
      const innings=g.innings||6;
      const imp=g.imported_fielding?.[p.id];
      if(imp&&imp.Total>0){
        // Use GC imported data
        FIELD_POS.forEach(pos=>{
          const n=imp[pos]||0;
          if(n>0){
            posBreakdown[pos]=(posBreakdown[pos]||0)+n;
            totalPlayed+=n;
            if(pos===primaryPos)primaryInn+=n;
            else if(secondaryPositions.includes(pos))secondaryInn+=n;
            else otherInn+=n;
          }
        });
        benchInn+=Math.max(0,innings-imp.Total);
      } else {
        // Check field_chart tracking
        for(let inn=1;inn<=innings;inn++){
          const chart=getChartForInning(g,inn);
          const playingPos=Object.entries(chart||{}).find(([pos,id])=>id===p.id)?.[0];
          if(playingPos){
            posBreakdown[playingPos]=(posBreakdown[playingPos]||0)+1;
            totalPlayed++;
            if(playingPos===primaryPos)primaryInn++;
            else if(secondaryPositions.includes(playingPos))secondaryInn++;
            else otherInn++;
          } else {
            benchInn++;
          }
        }
      }
    });

    result[p.id]={
      primaryInn,secondaryInn,otherInn,benchInn,totalPlayed,totalInnings,
      posBreakdown,
      primaryPct:totalInnings>0?Math.round(primaryInn/totalInnings*100):0,
      benchPct:totalInnings>0?Math.round(benchInn/totalInnings*100):0,
    };
  });
  return result;
}

function DefensePlanModal({weekend,team,games,athletes,teams,onClose,onSave}){
  const teamGames=games.filter(g=>g.team_id===team.id).sort((a,b)=>(a.game_date||"").localeCompare(b.game_date||""));
  const rosterIds=[...new Set([...teamGames.flatMap(g=>(g.lineup||[]).map(l=>l.athleteId)),...teamGames.flatMap(g=>Object.keys(g.imported_fielding||{}))].filter(Boolean))];
  const roster=athletes.filter(a=>rosterIds.includes(a.id));

  const existing=(weekend.defense_plan||{})[team.id]||{};
  const[primaryPct,setPrimaryPct]=useState(existing.primaryPct||60);
  const[maxBenchPct,setMaxBenchPct]=useState(existing.maxBenchPct||computeBenchTarget(roster.length));
  const[tab,setTab]=useState("plan");
  const[saving,setSaving]=useState(false);

  // Forecast: per player per game - planned position
  const[forecast,setForecast]=useState(existing.forecast||{});
  const setForecastPos=(gameId,playerId,pos)=>setForecast(p=>({...p,[gameId+"-"+playerId]:pos}));
  const getForecastPos=(gameId,playerId)=>forecast[gameId+"-"+playerId]||"";

  // Compute actuals from imported GC data
  const actuals=computeWeekendDefense(roster,games,teams,weekend);
  const totalInnings=teamGames.reduce((s,g)=>s+(g.innings||6),0);
  const benchTarget=computeBenchTarget(roster.length);

  const save=async()=>{
    setSaving(true);
    const plan={...(weekend.defense_plan||{}),[team.id]:{primaryPct,maxBenchPct,forecast,updatedAt:new Date().toISOString()}};
    await onSave(weekend.id,plan);
    setSaving(false);onClose();
  };

  const tabStyle=(t)=>({padding:"7px 14px",border:"none",background:"transparent",fontSize:11,fontWeight:700,textTransform:"uppercase",color:tab===t?"#27c97a":"#6b82a0",borderBottom:tab===t?"2px solid #27c97a":"2px solid transparent",cursor:"pointer",whiteSpace:"nowrap"});

  const posColor=(pos,primary,secondary)=>pos===primary?PRIMARY_COLOR:secondary?.includes(pos)?SECONDARY_COLOR:"#8fa3be";

  return(
    <div className="mbg" style={{zIndex:500}} onClick={onClose}>
      <div style={{background:"#0d1526",border:"1px solid rgba(255,255,255,.15)",borderRadius:14,width:"100%",maxWidth:720,maxHeight:"94vh",display:"flex",flexDirection:"column",overflow:"hidden"}} onClick={e=>e.stopPropagation()}>

        <div style={{padding:"13px 16px",borderBottom:"1px solid rgba(255,255,255,.07)",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,flexWrap:"wrap",gap:8}}>
          <div><div style={{fontWeight:800,fontSize:15}}>🛡️ <span style={{color:"#27c97a"}}>Defensive Plan</span></div><div style={{fontSize:11,color:"#6b82a0"}}>{weekend.name} — {team.name} · {roster.length} players</div></div>
          <div style={{display:"flex",gap:7}}><button className="btn bg bsm" onClick={save} disabled={saving}>{saving?"Saving...":"💾 Save"}</button><button className="btn bgh bsm" onClick={onClose}>✕</button></div>
        </div>

        <div style={{display:"flex",borderBottom:"1px solid rgba(255,255,255,.07)",overflowX:"auto",flexShrink:0}}>
          <button style={tabStyle("plan")} onClick={()=>setTab("plan")}>📋 Forecast</button>
          <button style={tabStyle("actual")} onClick={()=>setTab("actual")}>✅ Actuals</button>
          <button style={tabStyle("bench")} onClick={()=>setTab("bench")}>⏱ Bench</button>
        </div>

        <div style={{flex:1,overflowY:"auto",padding:14}}>

          {tab==="plan"&&<div>
            {/* Benchmarks */}
            <div style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.08)",borderRadius:9,padding:12,marginBottom:14}}>
              <div style={{fontWeight:700,fontSize:13,marginBottom:10}}>Opportunity Targets</div>
              <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
                <div style={{flex:1,minWidth:140}}>
                  <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#27c97a",marginBottom:4}}>Primary Position %</div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <input type="range" min={30} max={90} step={5} value={primaryPct} onChange={e=>setPrimaryPct(parseInt(e.target.value))} style={{flex:1}}/>
                    <span style={{fontWeight:800,fontSize:16,color:"#27c97a",minWidth:40}}>{primaryPct}%</span>
                  </div>
                  <div style={{fontSize:10,color:"#6b82a0",marginTop:2}}>Each player plays their main spot at least {primaryPct}% of innings</div>
                </div>
                <div style={{flex:1,minWidth:140}}>
                  <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:BENCH_COLOR,marginBottom:4}}>Max Bench %</div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <input type="range" min={0} max={50} step={5} value={maxBenchPct} onChange={e=>setMaxBenchPct(parseInt(e.target.value))} style={{flex:1}}/>
                    <span style={{fontWeight:800,fontSize:16,color:BENCH_COLOR,minWidth:40}}>{maxBenchPct}%</span>
                  </div>
                  <div style={{fontSize:10,color:"#6b82a0",marginTop:2}}>Auto-calculated: {benchTarget}% fair share for {roster.length} players / 4 games</div>
                </div>
              </div>
            </div>

            {/* Per game forecast grid */}
            <div style={{fontSize:12,color:"#6b82a0",marginBottom:10}}>
              Plan each player's position per game. <span style={{color:"#27c97a"}}>Green</span> = primary, <span style={{color:SECONDARY_COLOR}}>Blue</span> = secondary, <span style={{color:BENCH_COLOR}}>Bench</span> = sitting.
            </div>
            {teamGames.length===0&&<div className="empty"><div className="ei">🎮</div><div className="et">No games added yet</div></div>}
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:400}}>
                <thead>
                  <tr style={{borderBottom:"2px solid rgba(255,255,255,.1)"}}>
                    <th style={{padding:"7px 10px",textAlign:"left",color:"#6b82a0",fontSize:11,minWidth:120}}>PLAYER</th>
                    {teamGames.map((g,i)=><th key={g.id} style={{padding:"7px 8px",textAlign:"center",color:"#3a9be8",fontSize:11,minWidth:90}}>G{i+1}{g.opponent?" vs "+g.opponent:""}</th>)}
                    <th style={{padding:"7px 8px",textAlign:"center",color:"#6b82a0",fontSize:11}}>BENCH</th>
                  </tr>
                </thead>
                <tbody>
                  {roster.map((p,ri)=>{
                    const primary=p.position||"";
                    const secondary=p.other_positions||[];
                    const benchCount=teamGames.filter(g=>getForecastPos(g.id,p.id)==="Bench").length;
                    const benchPct=teamGames.length>0?Math.round(benchCount/teamGames.length*100):0;
                    const overBench=benchPct>maxBenchPct;
                    return(
                      <tr key={p.id} style={{borderBottom:"1px solid rgba(255,255,255,.05)",background:ri%2===0?"rgba(255,255,255,.01)":"transparent"}}>
                        <td style={{padding:"8px 10px"}}>
                          <div style={{display:"flex",alignItems:"center",gap:6}}>
                            <div className="riv" style={{width:22,height:22,fontSize:9,flexShrink:0}}>{p.avatar||ini(p.name)}</div>
                            <div>
                              <div style={{fontWeight:600,fontSize:12}}>{p.name}</div>
                              <div style={{fontSize:9,color:"#27c97a"}}>{primary}{secondary.length>0?" · "+secondary.join("/"):""}</div>
                            </div>
                          </div>
                        </td>
                        {teamGames.map(g=>{
                          const val=getForecastPos(g.id,p.id);
                          const col=val==="Bench"?BENCH_COLOR:posColor(val,primary,secondary);
                          return(
                            <td key={g.id} style={{padding:"4px 6px",textAlign:"center"}}>
                              <select value={val} onChange={e=>setForecastPos(g.id,p.id,e.target.value)} style={{width:"100%",background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.12)",borderRadius:5,padding:"4px 4px",color:col,fontSize:11,fontWeight:700,cursor:"pointer"}}>
                                <option value="">—</option>
                                {FIELD_POS.map(pos=><option key={pos} value={pos} style={{color:posColor(pos,primary,secondary)}}>{pos}{pos===primary?" ★":secondary.includes(pos)?" ◆":""}</option>)}
                                <option value="Bench">Bench</option>
                              </select>
                            </td>
                          );
                        })}
                        <td style={{padding:"8px 6px",textAlign:"center"}}>
                          <span style={{fontWeight:700,fontSize:12,color:overBench?OVER_COLOR:BENCH_COLOR}}>{benchCount}G</span>
                          {overBench&&<div style={{fontSize:9,color:OVER_COLOR}}>Over</div>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>}

          {tab==="actual"&&<div>
            <div style={{fontSize:12,color:"#6b82a0",marginBottom:12}}>Actuals pulled from GameChanger imports. Upload a CSV per game in the game detail to populate this.</div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                <thead>
                  <tr style={{borderBottom:"2px solid rgba(255,255,255,.1)"}}>
                    <th style={{padding:"7px 10px",textAlign:"left",color:"#6b82a0",fontSize:11}}>PLAYER</th>
                    <th style={{padding:"7px 8px",textAlign:"center",color:"#27c97a",fontSize:11}}>Primary %</th>
                    <th style={{padding:"7px 8px",textAlign:"center",color:SECONDARY_COLOR,fontSize:11}}>Secondary %</th>
                    <th style={{padding:"7px 8px",textAlign:"center",color:BENCH_COLOR,fontSize:11}}>Bench %</th>
                    <th style={{padding:"7px 8px",textAlign:"center",fontSize:11}}>STATUS</th>
                  </tr>
                </thead>
                <tbody>
                  {roster.map((p,ri)=>{
                    const a=actuals[p.id]||{primaryPct:0,benchPct:0};
                    const overBench=a.benchPct>maxBenchPct;
                    const underPrimary=a.totalPlayed>0&&a.primaryPct<primaryPct;
                    const ok=!overBench&&!underPrimary;
                    return(
                      <tr key={p.id} style={{borderBottom:"1px solid rgba(255,255,255,.05)",background:ri%2===0?"rgba(255,255,255,.01)":"transparent"}}>
                        <td style={{padding:"8px 10px"}}>
                          <div style={{display:"flex",alignItems:"center",gap:6}}>
                            <div className="riv" style={{width:22,height:22,fontSize:9}}>{p.avatar||ini(p.name)}</div>
                            <div>
                              <div style={{fontWeight:600,fontSize:12}}>{p.name}</div>
                              <div style={{fontSize:9,color:"#27c97a"}}>{p.position}</div>
                            </div>
                          </div>
                        </td>
                        <td style={{padding:"8px",textAlign:"center"}}>
                          <div style={{fontWeight:700,color:underPrimary?OVER_COLOR:PRIMARY_COLOR}}>{a.primaryPct||0}%</div>
                          <div style={{fontSize:9,color:"#6b82a0"}}>target {primaryPct}%</div>
                        </td>
                        <td style={{padding:"8px",textAlign:"center"}}>
                          <div style={{fontWeight:700,color:SECONDARY_COLOR}}>{a.totalInnings>0?Math.round(a.secondaryInn/a.totalInnings*100):0}%</div>
                        </td>
                        <td style={{padding:"8px",textAlign:"center"}}>
                          <div style={{fontWeight:700,color:overBench?OVER_COLOR:BENCH_COLOR}}>{a.benchPct||0}%</div>
                          <div style={{fontSize:9,color:"#6b82a0"}}>max {maxBenchPct}%</div>
                        </td>
                        <td style={{padding:"8px",textAlign:"center"}}>
                          {a.totalPlayed===0?<span style={{color:"#6b82a0",fontSize:11}}>No data</span>:ok?<span style={{color:"#27c97a",fontWeight:700}}>✓ OK</span>:<span style={{color:OVER_COLOR,fontWeight:700}}>⚠️ Flag</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>}

          {tab==="bench"&&<div>
            <div style={{marginBottom:14,background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.08)",borderRadius:9,padding:12}}>
              <div style={{fontWeight:700,fontSize:13,marginBottom:4}}>Fair Bench Distribution</div>
              <div style={{fontSize:12,color:"#6b82a0",lineHeight:1.6}}>With <strong style={{color:"#eef2f8"}}>{roster.length} players</strong> across a <strong style={{color:"#eef2f8"}}>4-game weekend</strong>, the fair share is <strong style={{color:"#e8a020"}}>{benchTarget}% bench time</strong> per player — roughly {(roster.length-9)} players sit each game.</div>
              <div style={{marginTop:8,height:8,background:"rgba(255,255,255,.06)",borderRadius:4,overflow:"hidden"}}>
                <div style={{height:"100%",width:benchTarget+"%",background:"#e8a020",borderRadius:4}}/>
              </div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {roster.map(p=>{
                const a=actuals[p.id]||{benchPct:0,totalPlayed:0,totalInnings};
                const forecastBench=teamGames.filter(g=>getForecastPos(g.id,p.id)==="Bench").length;
                const forecastBenchPct=teamGames.length>0?Math.round(forecastBench/teamGames.length*100):0;
                const actualPct=a.benchPct||0;
                const overActual=actualPct>maxBenchPct;
                const overForecast=forecastBenchPct>maxBenchPct;
                return(
                  <div key={p.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",background:"rgba(255,255,255,.02)",border:"1px solid rgba(255,255,255,.07)",borderRadius:8}}>
                    <div className="riv" style={{width:26,height:26,fontSize:10,flexShrink:0}}>{p.avatar||ini(p.name)}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:600,fontSize:13}}>{p.name}</div>
                      <div style={{fontSize:10,color:"#6b82a0"}}>{p.position}</div>
                    </div>
                    <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
                      {forecastBench>0&&<div style={{textAlign:"center"}}>
                        <div style={{fontSize:10,color:"#6b82a0",marginBottom:1}}>Planned</div>
                        <div style={{fontWeight:700,color:overForecast?OVER_COLOR:"#e8a020"}}>{forecastBench}G · {forecastBenchPct}%</div>
                      </div>}
                      {a.totalPlayed>0&&<div style={{textAlign:"center"}}>
                        <div style={{fontSize:10,color:"#6b82a0",marginBottom:1}}>Actual</div>
                        <div style={{fontWeight:700,color:overActual?OVER_COLOR:BENCH_COLOR}}>{actualPct}%</div>
                      </div>}
                      {a.totalPlayed===0&&forecastBench===0&&<span style={{fontSize:11,color:"#6b82a0"}}>No data yet</span>}
                      {(overActual||overForecast)&&<span className="bdg" style={{background:"rgba(232,60,60,.15)",color:OVER_COLOR,fontSize:9}}>Over limit</span>}
                      {!overActual&&!overForecast&&a.totalPlayed>0&&<span className="bdg" style={{background:"rgba(39,201,122,.1)",color:"#27c97a",fontSize:9}}>✓ Fair</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>}
        </div>
      </div>
    </div>
  );
}


function PitchingPlanModal({weekend,team,games,athletes,onClose,onSave}){
  const teamGames=games.filter(g=>g.team_id===team.id).sort((a,b)=>(a.game_date||"").localeCompare(b.game_date||""));
  const rosterIds=[...new Set(teamGames.flatMap(g=>(g.lineup||[]).map(l=>l.athleteId)).filter(Boolean))];
  const existing=((weekend.pitching_plan||{})[team.id])||{};
  const[planPitchers,setPlanPitchers]=useState(existing.pitchers||(athletes.filter(a=>rosterIds.includes(a.id)).map(p=>({id:p.id,maxInnings:"",maxPitches:"",notes:""}))));
  const[assignments,setAssignments]=useState(existing.assignments||{});
  const[tab,setTab]=useState("pitchers");
  const[saving,setSaving]=useState(false);
  const getA=(gid,pid)=>assignments[gid+"-"+pid]||{fi:"",ai:"",fp:"",ap:""};
  const setA=(gid,pid,k,v)=>setAssignments(p=>({...p,[gid+"-"+pid]:{...getA(gid,pid),[k]:v}}));
  const updP=(id,k,v)=>setPlanPitchers(p=>p.map(x=>x.id===id?{...x,[k]:v}:x));
  const sum=(pid,f)=>teamGames.reduce((s,g)=>s+parseFloat(getA(g.id,pid)[f]||0),0);
  const athName=(id)=>athletes.find(a=>a.id===id)||{name:"?",avatar:""};
  const over=(pp)=>{const ai=sum(pp.id,"ai");const ap=sum(pp.id,"ap");return(pp.maxInnings&&ai>parseFloat(pp.maxInnings))||(pp.maxPitches&&ap>parseInt(pp.maxPitches));};
  const save=async()=>{setSaving(true);await onSave(weekend.id,{...(weekend.pitching_plan||{}),[team.id]:{pitchers:planPitchers,assignments}});setSaving(false);onClose();};
  const ist={width:"100%",background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.12)",borderRadius:5,padding:"4px 6px",color:"#eef2f8",fontSize:13,textAlign:"center"};
  const ist2={...ist,color:"#27c97a"};
  const tabs=["pitchers","plan","actual","compare"];
  const tlabel=(t)=>t==="pitchers"?"🧢 Pitchers":t==="plan"?"📋 Forecast":t==="actual"?"✅ Actual":"📊 Compare";
  const gcol=n=>"repeat("+Math.min(n,4)+",1fr)";
  return(
    <div className="mbg" style={{zIndex:500}} onClick={onClose}>
      <div style={{background:"#0d1526",border:"1px solid rgba(255,255,255,.15)",borderRadius:14,width:"100%",maxWidth:680,maxHeight:"92vh",display:"flex",flexDirection:"column",overflow:"hidden"}} onClick={e=>e.stopPropagation()}>
        <div style={{padding:"13px 16px",borderBottom:"1px solid rgba(255,255,255,.07)",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,flexWrap:"wrap",gap:8}}>
          <div><div style={{fontWeight:800,fontSize:15}}>⚾ <span style={{color:"#e8a020"}}>Pitching Plan</span></div><div style={{fontSize:11,color:"#6b82a0"}}>{weekend.name} — {team.name}</div></div>
          <div style={{display:"flex",gap:7}}><button className="btn bg bsm" onClick={save} disabled={saving}>{saving?"Saving...":"💾 Save"}</button><button className="btn bgh bsm" onClick={onClose}>✕</button></div>
        </div>
        <div style={{display:"flex",borderBottom:"1px solid rgba(255,255,255,.07)",overflowX:"auto",flexShrink:0}}>
          {tabs.map(t=><button key={t} onClick={()=>setTab(t)} style={{padding:"7px 14px",border:"none",background:"transparent",fontSize:11,fontWeight:700,textTransform:"uppercase",color:tab===t?"#e8a020":"#6b82a0",borderBottom:tab===t?"2px solid #e8a020":"2px solid transparent",cursor:"pointer",whiteSpace:"nowrap"}}>{tlabel(t)}</button>)}
        </div>
        <div style={{flex:1,overflowY:"auto",padding:14}}>
          {tab==="pitchers"&&<div>
            <div style={{fontSize:12,color:"#6b82a0",marginBottom:10}}>Set available pitchers and max usage for this tournament.</div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {planPitchers.map(pp=>{const a=athName(pp.id);return(<div key={pp.id} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 12px",background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.08)",borderRadius:8,flexWrap:"wrap"}}><div className="riv" style={{width:28,height:28,fontSize:10,flexShrink:0}}>{a.avatar||ini(a.name)}</div><div style={{flex:1,minWidth:100}}><div style={{fontWeight:700,fontSize:13}}>{a.name}</div><div style={{fontSize:10,color:"#6b82a0"}}>{a.position||""}</div></div><div style={{display:"flex",gap:7,flexWrap:"wrap",alignItems:"flex-end"}}><div><div style={{fontSize:9,fontWeight:700,color:"#6b82a0",marginBottom:2}}>MAX INN</div><input type="number" value={pp.maxInnings||""} onChange={e=>updP(pp.id,"maxInnings",e.target.value)} placeholder="4" style={{width:52,background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.12)",borderRadius:5,padding:"4px 6px",color:"#eef2f8",fontSize:13,textAlign:"center"}}/></div><div><div style={{fontSize:9,fontWeight:700,color:"#6b82a0",marginBottom:2}}>MAX PC</div><input type="number" value={pp.maxPitches||""} onChange={e=>updP(pp.id,"maxPitches",e.target.value)} placeholder="75" style={{width:52,background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.12)",borderRadius:5,padding:"4px 6px",color:"#eef2f8",fontSize:13,textAlign:"center"}}/></div><div><div style={{fontSize:9,fontWeight:700,color:"#6b82a0",marginBottom:2}}>ARM STATUS</div><input value={pp.notes||""} onChange={e=>updP(pp.id,"notes",e.target.value)} placeholder="Available..." style={{width:120,background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.12)",borderRadius:5,padding:"4px 7px",color:"#eef2f8",fontSize:11}}/></div></div></div>);})}
            </div>
            <select className="inp" style={{maxWidth:300,marginTop:10}} onChange={e=>{const id=e.target.value;if(!id||planPitchers.find(p=>p.id===id))return;setPlanPitchers(prev=>[...prev,{id,maxInnings:"",maxPitches:"",notes:""}]);e.target.value="";}}><option value="">+ Add pitcher...</option>{athletes.filter(a=>!planPitchers.find(p=>p.id===a.id)).map(a=><option key={a.id} value={a.id}>{a.name} — {a.position}</option>)}</select>
          </div>}
          {(tab==="plan"||tab==="actual")&&<div>
            <div style={{fontSize:12,color:"#6b82a0",marginBottom:10}}>{tab==="plan"?"Plan innings/pitches before the tournament.":"Log actual innings and pitch counts as games play out."}</div>
            {teamGames.length===0&&<div className="empty"><div className="ei">🎮</div><div className="et">No games added yet</div></div>}
            {planPitchers.map(pp=>{
              const a=athName(pp.id);
              const isP=tab==="plan";
              const ti=sum(pp.id,isP?"fi":"ai"); const tp=sum(pp.id,isP?"fp":"ap");
              const isOv=over(pp);
              return(<div key={pp.id} style={{marginBottom:12,padding:12,background:"rgba(255,255,255,.02)",border:"1px solid rgba(255,255,255,.08)",borderRadius:9}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                  <div className="riv" style={{width:24,height:24,fontSize:9,flexShrink:0}}>{a.avatar||ini(a.name)}</div>
                  <div style={{flex:1}}><div style={{fontWeight:700,fontSize:13}}>{a.name}</div>{pp.notes&&<div style={{fontSize:10,color:"#6b82a0",fontStyle:"italic"}}>{pp.notes}</div>}</div>
                  <div style={{textAlign:"right"}}><div style={{fontWeight:700,color:isOv?"#e84040":"#27c97a"}}>{ti} inn / {tp} pc</div>{(pp.maxInnings||pp.maxPitches)&&<div style={{fontSize:10,color:"#6b82a0"}}>Max: {pp.maxInnings||"—"} inn / {pp.maxPitches||"—"} pc</div>}</div>
                </div>
                {isOv&&<div style={{padding:"4px 10px",background:"rgba(232,80,80,.08)",border:"1px solid rgba(232,80,80,.2)",borderRadius:6,fontSize:11,color:"#e84040",marginBottom:8}}>⚠️ Over limit</div>}
                <div style={{display:"grid",gridTemplateColumns:gcol(teamGames.length),gap:6}}>
                  {teamGames.map((g,gi)=>{const asn=getA(g.id,pp.id);return(<div key={g.id} style={{background:"rgba(255,255,255,.03)",borderRadius:7,padding:"7px 8px"}}><div style={{fontSize:9,fontWeight:700,color:"#3a9be8",marginBottom:5}}>G{gi+1}{g.opponent?" vs "+g.opponent:""}</div><div style={{marginBottom:4}}><div style={{fontSize:9,color:"#6b82a0",marginBottom:2}}>Inn.</div><input type="number" step="0.1" value={isP?asn.fi:asn.ai} onChange={e=>setA(g.id,pp.id,isP?"fi":"ai",e.target.value)} placeholder="0" style={isP?ist:ist2}/></div><div><div style={{fontSize:9,color:"#6b82a0",marginBottom:2}}>Pitches</div><input type="number" value={isP?asn.fp:asn.ap} onChange={e=>setA(g.id,pp.id,isP?"fp":"ap",e.target.value)} placeholder="0" style={isP?ist:ist2}/></div></div>);})}
                </div>
              </div>);
            })}
          </div>}
          {tab==="compare"&&<div>
            <div style={{fontSize:12,color:"#6b82a0",marginBottom:10}}>Forecast vs actual — see how the plan played out.</div>
            <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
              <thead><tr style={{borderBottom:"2px solid rgba(255,255,255,.1)"}}><th style={{padding:"8px 10px",textAlign:"left",color:"#6b82a0",fontSize:11}}>PITCHER</th><th style={{padding:"8px 10px",textAlign:"center",color:"#3a9be8",fontSize:11}}>F-INN</th><th style={{padding:"8px 10px",textAlign:"center",color:"#27c97a",fontSize:11}}>A-INN</th><th style={{padding:"8px 10px",textAlign:"center",fontSize:11}}>DIFF</th><th style={{padding:"8px 10px",textAlign:"center",color:"#3a9be8",fontSize:11}}>F-PC</th><th style={{padding:"8px 10px",textAlign:"center",color:"#27c97a",fontSize:11}}>A-PC</th><th style={{padding:"8px 10px",textAlign:"center",color:"#e8a020",fontSize:11}}>STATUS</th></tr></thead>
              <tbody>{planPitchers.map((pp,i)=>{const a=athName(pp.id);const fi=sum(pp.id,"fi");const ai=sum(pp.id,"ai");const fp=sum(pp.id,"fp");const ap=sum(pp.id,"ap");const diff=parseFloat((ai-fi).toFixed(1));const isOv=over(pp);return(<tr key={pp.id} style={{borderBottom:"1px solid rgba(255,255,255,.06)",background:i%2===0?"rgba(255,255,255,.02)":"transparent"}}><td style={{padding:"8px 10px"}}><div style={{display:"flex",alignItems:"center",gap:6}}><div className="riv" style={{width:20,height:20,fontSize:8}}>{a.avatar||ini(a.name)}</div><div style={{fontWeight:600}}>{a.name}</div></div></td><td style={{padding:"8px 10px",textAlign:"center",color:"#3a9be8",fontWeight:600}}>{fi||"—"}</td><td style={{padding:"8px 10px",textAlign:"center",color:"#27c97a",fontWeight:600}}>{ai||"—"}</td><td style={{padding:"8px 10px",textAlign:"center",fontWeight:700,color:diff>0?"#e84040":diff<0?"#27c97a":"#6b82a0"}}>{fi||ai?(diff>0?"+":"")+diff:"—"}</td><td style={{padding:"8px 10px",textAlign:"center",color:"#3a9be8"}}>{fp||"—"}</td><td style={{padding:"8px 10px",textAlign:"center",color:"#27c97a"}}>{ap||"—"}</td><td style={{padding:"8px 10px",textAlign:"center"}}>{isOv?<span style={{color:"#e84040",fontWeight:700}}>Over</span>:<span style={{color:"#27c97a"}}>OK</span>}</td></tr>);})}
              </tbody>
            </table></div>
          </div>}
        </div>
      </div>
    </div>
  );
}

              <div style={{flex:1}}>
                <div style={{fontWeight:700}}>{p.name}</div>
                <div style={{fontSize:11,color:"#6b82a0"}}>{p.position}{p.sponsored?" · Sponsored":""}{(p.balance_due||0)>0?" · ⚠️ $"+p.balance_due+" past due":""}</div>
              </div>
              {!p.sponsored&&<>
                <input type="number" value={b.amount!==undefined?b.amount:fee} onChange={e=>setBilling(prev=>({...prev,[p.id]:{...b,amount:e.target.value}}))} style={{width:60,background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.12)",borderRadius:5,padding:"4px 6px",color:"#eef2f8",fontSize:13,textAlign:"center"}}/>
                <button onClick={()=>setBilling(prev=>({...prev,[p.id]:{...b,paid:!b.paid}}))} style={{padding:"5px 12px",borderRadius:7,border:"none",background:b.paid?"rgba(39,201,122,.15)":"rgba(255,255,255,.08)",color:b.paid?"#27c97a":"#6b82a0",fontWeight:700,fontSize:12,cursor:"pointer"}}>{b.paid?"✓ Paid":"Mark Paid"}</button>
              </>}
              {p.sponsored&&<span style={{color:"#27c97a",fontWeight:700,fontSize:12}}>Sponsored $0</span>}
