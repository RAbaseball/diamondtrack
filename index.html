                  <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#27c97a",marginBottom:4}}>Primary Position %</div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <input type="range" min={30} max={90} step={5} value={primaryPct} onChange={e=>setPrimaryPct(parseInt(e.target.value))} style={{flex:1}}/>
                    <span style={{fontWeight:800,fontSize:16,color:"#27c97a",minWidth:40}}>{primaryPct}%</span>
                  </div>
                  <div style={{fontSize:10,color:"#6b82a0",marginTop:2}}>Each player plays their main spot at least {primaryPct}% of innings</div>
                </div>
                <div style={{flex:1,minWidth:140}}>
                  <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:BENCH_COLOR,marginBottom:4}}>Max Bench %</div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <input type="range" min={0} max={50} step={5} value={maxBenchPct} onChange={e=>setMaxBenchPct(parseInt(e.target.value))} style={{flex:1}}/>
                    <span style={{fontWeight:800,fontSize:16,color:BENCH_COLOR,minWidth:40}}>{maxBenchPct}%</span>
                  </div>
                  <div style={{fontSize:10,color:"#6b82a0",marginTop:2}}>Auto-calculated: {benchTarget}% fair share for {roster.length} players / 4 games</div>
                </div>
              </div>
            </div>

            {/* Per game forecast grid */}
            <div style={{fontSize:12,color:"#6b82a0",marginBottom:10}}>
              Plan each player's position per game. <span style={{color:"#27c97a"}}>Green</span> = primary, <span style={{color:SECONDARY_COLOR}}>Blue</span> = secondary, <span style={{color:BENCH_COLOR}}>Bench</span> = sitting.
            </div>
            {teamGames.length===0&&<div className="empty"><div className="ei">🎮</div><div className="et">No games added yet</div></div>}
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:400}}>
                <thead>
                  <tr style={{borderBottom:"2px solid rgba(255,255,255,.1)"}}>
                    <th style={{padding:"7px 10px",textAlign:"left",color:"#6b82a0",fontSize:11,minWidth:120}}>PLAYER</th>
                    {teamGames.map((g,i)=><th key={g.id} style={{padding:"7px 8px",textAlign:"center",color:"#3a9be8",fontSize:11,minWidth:90}}>G{i+1}{g.opponent?" vs "+g.opponent:""}</th>)}
                    <th style={{padding:"7px 8px",textAlign:"center",color:"#6b82a0",fontSize:11}}>BENCH</th>
                  </tr>
                </thead>
                <tbody>
                  {roster.map((p,ri)=>{
                    const primary=p.position||"";
                    const secondary=p.other_positions||[];
                    const benchCount=teamGames.filter(g=>getForecastPos(g.id,p.id)==="Bench").length;
                    const benchPct=teamGames.length>0?Math.round(benchCount/teamGames.length*100):0;
                    const overBench=benchPct>maxBenchPct;
                    return(
                      <tr key={p.id} style={{borderBottom:"1px solid rgba(255,255,255,.05)",background:ri%2===0?"rgba(255,255,255,.01)":"transparent"}}>
                        <td style={{padding:"8px 10px"}}>
                          <div style={{display:"flex",alignItems:"center",gap:6}}>
                            <div className="riv" style={{width:22,height:22,fontSize:9,flexShrink:0}}>{p.avatar||ini(p.name)}</div>
                            <div>
                              <div style={{fontWeight:600,fontSize:12}}>{p.name}</div>
                              <div style={{fontSize:9,color:"#27c97a"}}>{primary}{secondary.length>0?" · "+secondary.join("/"):""}</div>
                            </div>
                          </div>
                        </td>
                        {teamGames.map(g=>{
                          const val=getForecastPos(g.id,p.id);
                          const col=val==="Bench"?BENCH_COLOR:posColor(val,primary,secondary);
                          return(
                            <td key={g.id} style={{padding:"4px 6px",textAlign:"center"}}>
                              <select value={val} onChange={e=>setForecastPos(g.id,p.id,e.target.value)} style={{width:"100%",background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.12)",borderRadius:5,padding:"4px 4px",color:col,fontSize:11,fontWeight:700,cursor:"pointer"}}>
                                <option value="">—</option>
                                {FIELD_POS.map(pos=><option key={pos} value={pos} style={{color:posColor(pos,primary,secondary)}}>{pos}{pos===primary?" ★":secondary.includes(pos)?" ◆":""}</option>)}
                                <option value="Bench">Bench</option>
                              </select>
                            </td>
                          );
                        })}
                        <td style={{padding:"8px 6px",textAlign:"center"}}>
                          <span style={{fontWeight:700,fontSize:12,color:overBench?OVER_COLOR:BENCH_COLOR}}>{benchCount}G</span>
                          {overBench&&<div style={{fontSize:9,color:OVER_COLOR}}>Over</div>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>}

          {tab==="actual"&&<div>
            <div style={{fontSize:12,color:"#6b82a0",marginBottom:12}}>Actuals pulled from GameChanger imports. Upload a CSV per game in the game detail to populate this.</div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                <thead>
                  <tr style={{borderBottom:"2px solid rgba(255,255,255,.1)"}}>
                    <th style={{padding:"7px 10px",textAlign:"left",color:"#6b82a0",fontSize:11}}>PLAYER</th>
                    <th style={{padding:"7px 8px",textAlign:"center",color:"#27c97a",fontSize:11}}>Primary %</th>
                    <th style={{padding:"7px 8px",textAlign:"center",color:SECONDARY_COLOR,fontSize:11}}>Secondary %</th>
                    <th style={{padding:"7px 8px",textAlign:"center",color:BENCH_COLOR,fontSize:11}}>Bench %</th>
                    <th style={{padding:"7px 8px",textAlign:"center",fontSize:11}}>STATUS</th>
                  </tr>
                </thead>
                <tbody>
                  {roster.map((p,ri)=>{
                    const a=actuals[p.id]||{primaryPct:0,benchPct:0};
                    const overBench=a.benchPct>maxBenchPct;
                    const underPrimary=a.totalPlayed>0&&a.primaryPct<primaryPct;
                    const ok=!overBench&&!underPrimary;
                    return(
                      <tr key={p.id} style={{borderBottom:"1px solid rgba(255,255,255,.05)",background:ri%2===0?"rgba(255,255,255,.01)":"transparent"}}>
                        <td style={{padding:"8px 10px"}}>
                          <div style={{display:"flex",alignItems:"center",gap:6}}>
                            <div className="riv" style={{width:22,height:22,fontSize:9}}>{p.avatar||ini(p.name)}</div>
                            <div>
                              <div style={{fontWeight:600,fontSize:12}}>{p.name}</div>
                              <div style={{fontSize:9,color:"#27c97a"}}>{p.position}</div>
                            </div>
                          </div>
                        </td>
                        <td style={{padding:"8px",textAlign:"center"}}>
                          <div style={{fontWeight:700,color:underPrimary?OVER_COLOR:PRIMARY_COLOR}}>{a.primaryPct||0}%</div>
                          <div style={{fontSize:9,color:"#6b82a0"}}>target {primaryPct}%</div>
                        </td>
                        <td style={{padding:"8px",textAlign:"center"}}>
                          <div style={{fontWeight:700,color:SECONDARY_COLOR}}>{a.totalInnings>0?Math.round(a.secondaryInn/a.totalInnings*100):0}%</div>
                        </td>
                        <td style={{padding:"8px",textAlign:"center"}}>
                          <div style={{fontWeight:700,color:overBench?OVER_COLOR:BENCH_COLOR}}>{a.benchPct||0}%</div>
                          <div style={{fontSize:9,color:"#6b82a0"}}>max {maxBenchPct}%</div>
                        </td>
                        <td style={{padding:"8px",textAlign:"center"}}>
                          {a.totalPlayed===0?<span style={{color:"#6b82a0",fontSize:11}}>No data</span>:ok?<span style={{color:"#27c97a",fontWeight:700}}>✓ OK</span>:<span style={{color:OVER_COLOR,fontWeight:700}}>⚠️ Flag</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>}

          {tab==="bench"&&<div>
            <div style={{marginBottom:14,background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.08)",borderRadius:9,padding:12}}>
              <div style={{fontWeight:700,fontSize:13,marginBottom:4}}>Fair Bench Distribution</div>
              <div style={{fontSize:12,color:"#6b82a0",lineHeight:1.6}}>With <strong style={{color:"#eef2f8"}}>{roster.length} players</strong> across a <strong style={{color:"#eef2f8"}}>4-game weekend</strong>, the fair share is <strong style={{color:"#e8a020"}}>{benchTarget}% bench time</strong> per player — roughly {(roster.length-9)} players sit each game.</div>
              <div style={{marginTop:8,height:8,background:"rgba(255,255,255,.06)",borderRadius:4,overflow:"hidden"}}>
                <div style={{height:"100%",width:benchTarget+"%",background:"#e8a020",borderRadius:4}}/>
              </div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {roster.map(p=>{
                const a=actuals[p.id]||{benchPct:0,totalPlayed:0,totalInnings};
                const forecastBench=teamGames.filter(g=>getForecastPos(g.id,p.id)==="Bench").length;
                const forecastBenchPct=teamGames.length>0?Math.round(forecastBench/teamGames.length*100):0;
                const actualPct=a.benchPct||0;
                const overActual=actualPct>maxBenchPct;
                const overForecast=forecastBenchPct>maxBenchPct;
                return(
                  <div key={p.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",background:"rgba(255,255,255,.02)",border:"1px solid rgba(255,255,255,.07)",borderRadius:8}}>
                    <div className="riv" style={{width:26,height:26,fontSize:10,flexShrink:0}}>{p.avatar||ini(p.name)}</div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:600,fontSize:13}}>{p.name}</div>
                      <div style={{fontSize:10,color:"#6b82a0"}}>{p.position}</div>
                    </div>
                    <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
                      {forecastBench>0&&<div style={{textAlign:"center"}}>
                        <div style={{fontSize:10,color:"#6b82a0",marginBottom:1}}>Planned</div>
                        <div style={{fontWeight:700,color:overForecast?OVER_COLOR:"#e8a020"}}>{forecastBench}G · {forecastBenchPct}%</div>
                      </div>}
                      {a.totalPlayed>0&&<div style={{textAlign:"center"}}>
                        <div style={{fontSize:10,color:"#6b82a0",marginBottom:1}}>Actual</div>
                        <div style={{fontWeight:700,color:overActual?OVER_COLOR:BENCH_COLOR}}>{actualPct}%</div>
                      </div>}
                      {a.totalPlayed===0&&forecastBench===0&&<span style={{fontSize:11,color:"#6b82a0"}}>No data yet</span>}
                      {(overActual||overForecast)&&<span className="bdg" style={{background:"rgba(232,60,60,.15)",color:OVER_COLOR,fontSize:9}}>Over limit</span>}
                      {!overActual&&!overForecast&&a.totalPlayed>0&&<span className="bdg" style={{background:"rgba(39,201,122,.1)",color:"#27c97a",fontSize:9}}>✓ Fair</span>}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>}
        </div>
      </div>
    </div>
  );
}


function PitchingPlanModal({weekend,team,games,athletes,onClose,onSave}){
  const teamGames=games.filter(g=>g.team_id===team.id).sort((a,b)=>{const d=(a.game_date||"").localeCompare(b.game_date||"");return d!==0?d:(a.game_time||"").localeCompare(b.game_time||"");});
  const rosterIds=new Set(team.athlete_ids||[]);
  const rosterAthletes=athletes.filter(a=>rosterIds.has(a.id));
  const existing=((weekend.pitching_plan||{})[team.id])||{};
  const[planPitchers,setPlanPitchers]=useState(existing.pitchers||(rosterAthletes.map(p=>({id:p.id,maxInnings:"",maxPitches:"",notes:""}))));
  const[assignments,setAssignments]=useState(existing.assignments||{});
  const[tab,setTab]=useState("pitchers");
  const[saving,setSaving]=useState(false);
  const getA=(gid,pid)=>assignments[gid+"-"+pid]||{fi:"",ai:"",fp:"",ap:""};
  const setA=(gid,pid,k,v)=>setAssignments(p=>({...p,[gid+"-"+pid]:{...getA(gid,pid),[k]:v}}));
  const updP=(id,k,v)=>setPlanPitchers(p=>p.map(x=>x.id===id?{...x,[k]:v}:x));
  const sum=(pid,f)=>teamGames.reduce((s,g)=>s+parseFloat(getA(g.id,pid)[f]||0),0);
  const athName=(id)=>athletes.find(a=>a.id===id)||{name:"?",avatar:""};
  const over=(pp)=>{const ai=sum(pp.id,"ai");const ap=sum(pp.id,"ap");return(pp.maxInnings&&ai>parseFloat(pp.maxInnings))||(pp.maxPitches&&ap>parseInt(pp.maxPitches));};
  const save=async()=>{setSaving(true);await onSave(weekend.id,{...(weekend.pitching_plan||{}),[team.id]:{pitchers:planPitchers,assignments}});setSaving(false);onClose();};
  const ist={width:"100%",background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.12)",borderRadius:5,padding:"4px 6px",color:"#eef2f8",fontSize:13,textAlign:"center"};
  const ist2={...ist,color:"#27c97a"};
  const tabs=["pitchers","plan","actual","compare"];
  const tlabel=(t)=>t==="pitchers"?"🧢 Pitchers":t==="plan"?"📋 Forecast":t==="actual"?"✅ Actual":"📊 Compare";
  const gcol=n=>"repeat("+Math.min(n,4)+",1fr)";
  return(
    <div className="mbg" style={{zIndex:500}} onClick={onClose}>
      <div style={{background:"#0d1526",border:"1px solid rgba(255,255,255,.15)",borderRadius:14,width:"100%",maxWidth:680,maxHeight:"92vh",display:"flex",flexDirection:"column",overflow:"hidden"}} onClick={e=>e.stopPropagation()}>
        <div style={{padding:"13px 16px",borderBottom:"1px solid rgba(255,255,255,.07)",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,flexWrap:"wrap",gap:8}}>
          <div><div style={{fontWeight:800,fontSize:15}}>⚾ <span style={{color:"#e8a020"}}>Pitching Plan</span></div><div style={{fontSize:11,color:"#6b82a0"}}>{weekend.name} — {team.name}</div></div>
          <div style={{display:"flex",gap:7}}><button className="btn bg bsm" onClick={save} disabled={saving}>{saving?"Saving...":"💾 Save"}</button><button className="btn bgh bsm" onClick={onClose}>✕</button></div>
        </div>
        <div style={{display:"flex",borderBottom:"1px solid rgba(255,255,255,.07)",overflowX:"auto",flexShrink:0}}>
          {tabs.map(t=><button key={t} onClick={()=>setTab(t)} style={{padding:"7px 14px",border:"none",background:"transparent",fontSize:11,fontWeight:700,textTransform:"uppercase",color:tab===t?"#e8a020":"#6b82a0",borderBottom:tab===t?"2px solid #e8a020":"2px solid transparent",cursor:"pointer",whiteSpace:"nowrap"}}>{tlabel(t)}</button>)}
        </div>
        <div style={{flex:1,overflowY:"auto",padding:14}}>
          {tab==="pitchers"&&<div>
            <div style={{fontSize:12,color:"#6b82a0",marginBottom:10}}>Set available pitchers and max usage for this tournament.</div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              <div style={{display:"flex",gap:10,marginBottom:10,padding:"8px 12px",background:"rgba(255,255,255,.03)",borderRadius:8,flexWrap:"wrap"}}>
                <span style={{fontSize:12,fontWeight:700,color:"#27c97a"}}>✅ {planPitchers.filter(function(pp){return pp.status!=="limited"&&pp.status!=="unavailable";}).length} Available</span>
                <span style={{fontSize:12,fontWeight:700,color:"#e8a020"}}>⚠️ {planPitchers.filter(function(pp){return pp.status==="limited";}).length} Limited</span>
                <span style={{fontSize:12,fontWeight:700,color:"#e84040"}}>❌ {planPitchers.filter(function(pp){return pp.status==="unavailable";}).length} Unavailable</span>
                <span style={{fontSize:12,color:"#6b82a0",marginLeft:"auto"}}>{planPitchers.length} total</span>
              </div>
              {planPitchers.map(function(pp){
                const a=athName(pp.id);
                const st=pp.status||"available";
                const rowBg=st==="unavailable"?"rgba(232,64,64,.05)":st==="limited"?"rgba(232,160,32,.05)":"rgba(255,255,255,.03)";
                const rowBd=st==="unavailable"?"rgba(232,64,64,.2)":st==="limited"?"rgba(232,160,32,.2)":"rgba(255,255,255,.08)";
                return(
                  <div key={pp.id} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 12px",background:rowBg,border:"1px solid "+rowBd,borderRadius:8,flexWrap:"wrap",marginBottom:4}}>
                    <div className="riv" style={{width:28,height:28,fontSize:10,flexShrink:0}}>{a.avatar||ini(a.name)}</div>
                    <div style={{flex:1,minWidth:100}}>
                      <div style={{fontWeight:700,fontSize:13}}>{a.name}</div>
                      <div style={{fontSize:10,color:"#6b82a0"}}>{a.position||""}</div>
                    </div>
                    <div style={{display:"flex",gap:7,flexWrap:"wrap",alignItems:"flex-end"}}>
                      <div>
                        <div style={{fontSize:9,fontWeight:700,color:"#6b82a0",marginBottom:2}}>ARM STATUS</div>
                        <div style={{display:"flex",gap:3}}>
                          <button onClick={()=>updP(pp.id,"status","available")} style={{padding:"4px 8px",borderRadius:5,border:"1px solid "+(st==="available"?"#27c97a":"rgba(255,255,255,.1)"),background:st==="available"?"rgba(255,255,255,.08)":"transparent",color:st==="available"?"#27c97a":"#6b82a0",fontSize:11,cursor:"pointer",fontWeight:st==="available"?700:400}}>✅</button>
                          <button onClick={()=>updP(pp.id,"status","limited")} style={{padding:"4px 8px",borderRadius:5,border:"1px solid "+(st==="limited"?"#e8a020":"rgba(255,255,255,.1)"),background:st==="limited"?"rgba(255,255,255,.08)":"transparent",color:st==="limited"?"#e8a020":"#6b82a0",fontSize:11,cursor:"pointer",fontWeight:st==="limited"?700:400}}>⚠️</button>
                          <button onClick={()=>updP(pp.id,"status","unavailable")} style={{padding:"4px 8px",borderRadius:5,border:"1px solid "+(st==="unavailable"?"#e84040":"rgba(255,255,255,.1)"),background:st==="unavailable"?"rgba(255,255,255,.08)":"transparent",color:st==="unavailable"?"#e84040":"#6b82a0",fontSize:11,cursor:"pointer",fontWeight:st==="unavailable"?700:400}}>❌</button>
                        </div>
                      </div>
                      <div><div style={{fontSize:9,fontWeight:700,color:"#6b82a0",marginBottom:2}}>MAX INN</div><input type="number" value={pp.maxInnings||""} onChange={e=>updP(pp.id,"maxInnings",e.target.value)} placeholder="4" style={{width:52,background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.12)",borderRadius:5,padding:"4px 6px",color:"#eef2f8",fontSize:13,textAlign:"center"}}/></div>
                      <div><div style={{fontSize:9,fontWeight:700,color:"#6b82a0",marginBottom:2}}>MAX PC</div><input type="number" value={pp.maxPitches||""} onChange={e=>updP(pp.id,"maxPitches",e.target.value)} placeholder="75" style={{width:52,background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.12)",borderRadius:5,padding:"4px 6px",color:"#eef2f8",fontSize:13,textAlign:"center"}}/></div>
                      <button className="btn bgr bsm" style={{padding:"4px 8px",alignSelf:"flex-end"}} onClick={()=>setPlanPitchers(function(p){return p.filter(function(x){return x.id!==pp.id;});})}>✕</button>
                    </div>
                  </div>
                );
              })}
            </div>
            <select className="inp" style={{maxWidth:300,marginTop:10}} onChange={e=>{const id=e.target.value;if(!id||planPitchers.find(p=>p.id===id))return;setPlanPitchers(prev=>[...prev,{id,maxInnings:"",maxPitches:"",notes:""}]);e.target.value="";}}><option value="">+ Add pitcher...</option>{rosterAthletes.filter(a=>!planPitchers.find(p=>p.id===a.id)).map(a=><option key={a.id} value={a.id}>{a.name} — {a.position}</option>)}</select>
          </div>}
          {(tab==="plan"||tab==="actual")&&<div>
            <div style={{fontSize:12,color:"#6b82a0",marginBottom:10}}>{tab==="plan"?"Plan innings/pitches before the tournament.":"Log actual innings and pitch counts as games play out."}</div>
            {teamGames.length===0&&<div className="empty"><div className="ei">🎮</div><div className="et">No games added yet</div></div>}
            {planPitchers.map(pp=>{
              const a=athName(pp.id);
              const isP=tab==="plan";
              const ti=sum(pp.id,isP?"fi":"ai"); const tp=sum(pp.id,isP?"fp":"ap");
              const isOv=over(pp);
              return(<div key={pp.id} style={{marginBottom:12,padding:12,background:"rgba(255,255,255,.02)",border:"1px solid rgba(255,255,255,.08)",borderRadius:9}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                  <div className="riv" style={{width:24,height:24,fontSize:9,flexShrink:0}}>{a.avatar||ini(a.name)}</div>
                  <div style={{flex:1}}><div style={{fontWeight:700,fontSize:13}}>{a.name}</div>{pp.notes&&<div style={{fontSize:10,color:"#6b82a0",fontStyle:"italic"}}>{pp.notes}</div>}</div>
                  <div style={{textAlign:"right"}}><div style={{fontWeight:700,color:isOv?"#e84040":"#27c97a"}}>{ti} inn / {tp} pc</div>{(pp.maxInnings||pp.maxPitches)&&<div style={{fontSize:10,color:"#6b82a0"}}>Max: {pp.maxInnings||"—"} inn / {pp.maxPitches||"—"} pc</div>}</div>
                </div>
                {isOv&&<div style={{padding:"4px 10px",background:"rgba(232,80,80,.08)",border:"1px solid rgba(232,80,80,.2)",borderRadius:6,fontSize:11,color:"#e84040",marginBottom:8}}>⚠️ Over limit</div>}
                <div style={{display:"grid",gridTemplateColumns:gcol(teamGames.length),gap:6}}>
                  {teamGames.map((g,gi)=>{const asn=getA(g.id,pp.id);return(<div key={g.id} style={{background:"rgba(255,255,255,.03)",borderRadius:7,padding:"7px 8px"}}><div style={{fontSize:9,fontWeight:700,color:"#3a9be8",marginBottom:5}}>G{gi+1}{g.opponent?" vs "+g.opponent:""}</div><div style={{marginBottom:4}}><div style={{fontSize:9,color:"#6b82a0",marginBottom:2}}>Inn.</div><input type="number" step="0.1" value={isP?asn.fi:asn.ai} onChange={e=>setA(g.id,pp.id,isP?"fi":"ai",e.target.value)} placeholder="0" style={isP?ist:ist2}/></div><div><div style={{fontSize:9,color:"#6b82a0",marginBottom:2}}>Pitches</div><input type="number" value={isP?asn.fp:asn.ap} onChange={e=>setA(g.id,pp.id,isP?"fp":"ap",e.target.value)} placeholder="0" style={isP?ist:ist2}/></div></div>);})}
                </div>
              </div>);
            })}
          </div>}
          {tab==="compare"&&<div>
            <div style={{fontSize:12,color:"#6b82a0",marginBottom:10}}>Forecast vs actual — see how the plan played out.</div>
            <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
              <thead><tr style={{borderBottom:"2px solid rgba(255,255,255,.1)"}}><th style={{padding:"8px 10px",textAlign:"left",color:"#6b82a0",fontSize:11}}>PITCHER</th><th style={{padding:"8px 10px",textAlign:"center",color:"#3a9be8",fontSize:11}}>F-INN</th><th style={{padding:"8px 10px",textAlign:"center",color:"#27c97a",fontSize:11}}>A-INN</th><th style={{padding:"8px 10px",textAlign:"center",fontSize:11}}>DIFF</th><th style={{padding:"8px 10px",textAlign:"center",color:"#3a9be8",fontSize:11}}>F-PC</th><th style={{padding:"8px 10px",textAlign:"center",color:"#27c97a",fontSize:11}}>A-PC</th><th style={{padding:"8px 10px",textAlign:"center",color:"#e8a020",fontSize:11}}>STATUS</th></tr></thead>
              <tbody>{planPitchers.map((pp,i)=>{const a=athName(pp.id);const fi=sum(pp.id,"fi");const ai=sum(pp.id,"ai");const fp=sum(pp.id,"fp");const ap=sum(pp.id,"ap");const diff=parseFloat((ai-fi).toFixed(1));const isOv=over(pp);return(<tr key={pp.id} style={{borderBottom:"1px solid rgba(255,255,255,.06)",background:i%2===0?"rgba(255,255,255,.02)":"transparent"}}><td style={{padding:"8px 10px"}}><div style={{display:"flex",alignItems:"center",gap:6}}><div className="riv" style={{width:20,height:20,fontSize:8}}>{a.avatar||ini(a.name)}</div><div style={{fontWeight:600}}>{a.name}</div></div></td><td style={{padding:"8px 10px",textAlign:"center",color:"#3a9be8",fontWeight:600}}>{fi||"—"}</td><td style={{padding:"8px 10px",textAlign:"center",color:"#27c97a",fontWeight:600}}>{ai||"—"}</td><td style={{padding:"8px 10px",textAlign:"center",fontWeight:700,color:diff>0?"#e84040":diff<0?"#27c97a":"#6b82a0"}}>{fi||ai?(diff>0?"+":"")+diff:"—"}</td><td style={{padding:"8px 10px",textAlign:"center",color:"#3a9be8"}}>{fp||"—"}</td><td style={{padding:"8px 10px",textAlign:"center",color:"#27c97a"}}>{ap||"—"}</td><td style={{padding:"8px 10px",textAlign:"center"}}>{isOv?<span style={{color:"#e84040",fontWeight:700}}>Over</span>:<span style={{color:"#27c97a"}}>OK</span>}</td></tr>);})}
              </tbody>
            </table></div>
          </div>}
        </div>
      </div>
    </div>
  );
}

function WeekendReport({weekend,teams,games,athletes,onPatchWeekend}){
  const[selectedPlayerId,setSelectedPlayerId]=useState(null);
  const[showGroupReport,setShowGroupReport]=useState(false);
  const[showRosterPrint,setShowRosterPrint]=useState(false);
  const[weekendGuests,setWeekendGuests]=useState(weekend.guests||[]);
  const[rosterGuestName,setRosterGuestName]=useState("");
  const[guestPos,setGuestPos]=useState("");
  const[guestNum,setGuestNum]=useState("");

  const saveGuests=function(guests){
    setWeekendGuests(guests);
    if(onPatchWeekend)onPatchWeekend(weekend.id,{guests});
  };
  const[chartTab,setChartTab]=useState("batting"); // batting | positions | bench
  const[chartScope,setChartScope]=useState("weekend"); // weekend | 30days | summer
  const[teamFilter,setTeamFilter]=useState("all");

  const weekendTeamIds=teams.filter(t=>t.weekend_id===weekend.id).map(t=>t.id);
  const allWeekendGames=games.filter(g=>weekendTeamIds.includes(g.team_id));
  const weekendTeams=teams.filter(t=>weekendTeamIds.includes(t.id));
  const weekendGames=teamFilter==="all"?allWeekendGames:allWeekendGames.filter(g=>g.team_id===teamFilter);

  // Scope filtering
  const now=new Date();
  const scopedGames=chartScope==="weekend"?weekendGames:games.filter(function(g){
    const gd=g.game_date?new Date(g.game_date+"T00:00:00"):null;
    if(!gd)return false;
    if(chartScope==="30days")return(now-gd)<30*24*60*60*1000;
    return(now-gd)<180*24*60*60*1000; // summer ~6 months
  });

  const scopeLabel=chartScope==="weekend"?"This Weekend":chartScope==="30days"?"Last 30 Days":"Full Summer";

  // Get all players from weekend games
  const playerIds=[...new Set(weekendGames.flatMap(g=>(g.lineup||[]).map(l=>l.athleteId)).filter(Boolean))];
  const weekendPlayers=athletes.filter(a=>playerIds.includes(a.id)).sort((a,b)=>a.name.localeCompare(b.name));

  // Compute stats for each player in scoped games
  const playerStats=weekendPlayers.map(function(p){
    const pGames=scopedGames.filter(g=>(g.batting_stats||{})[p.id]||(g.lineup||[]).some(l=>l.athleteId===p.id));
    const batting=computeBattingBySlot(p.id,scopedGames);
    const totalAb=batting.overall.ab||0;
    const totalH=batting.overall.h||0;
    const bb=batting.overall.bb||0;
    const hbp=batting.overall.hbp||0;
    const sf=batting.overall.sf||0;
    const avg=totalAb>0?totalH/totalAb:0;
    const obp=(totalAb+bb+hbp+sf)>0?(totalH+bb+hbp)/(totalAb+bb+hbp+sf):0;
    const slg=totalAb>0?((batting.overall.b1||0)+2*(batting.overall.b2||0)+3*(batting.overall.b3||0)+4*(batting.overall.hr||0))/totalAb:0;
    // Fielding
    let totalInn=0,benchInn=0;
    const posBreak={};
    scopedGames.forEach(function(g){
      const inn=g.innings||6;
      const imp=g.imported_fielding?.[p.id];
      if(imp&&imp.Total>0){
        FIELD_POS.forEach(function(pos){if(imp[pos]>0){posBreak[pos]=(posBreak[pos]||0)+imp[pos];totalInn+=imp[pos];}});
        benchInn+=Math.max(0,inn-imp.Total);
      } else {
        const inLineup=(g.lineup||[]).some(l=>l.athleteId===p.id);
        if(inLineup)totalInn+=inn; else benchInn+=inn;
      }
    });
    const availInn=totalInn+benchInn;
    const benchPct=availInn>0?Math.round(benchInn/availInn*100):0;
    return{player:p,batting:{avg,obp,slg,totalAb,totalH,pa:batting.overall.pa||0},fielding:{totalInn,benchInn,availInn,benchPct,posBreak}};
  }).filter(function(d){return d.batting.totalAb>0||d.fielding.availInn>0;});

  const fmtAvg=(n)=>n!=null?"."+String(Math.round(n*1000)).padStart(3,"0"):".---";

  // SVG bar chart helpers
  const BAR_H=18,BAR_GAP=6,LABEL_W=110,STAT_W=42,CHART_W=220;
  const chartH=(n)=>n*(BAR_H+BAR_GAP)+20;

  function BarChart({data,maxVal,color,fmt}){
    return(
      <svg width={LABEL_W+CHART_W+STAT_W+8} height={chartH(data.length)} style={{display:"block",overflow:"visible"}}>
        {data.map(function(d,i){
          const y=i*(BAR_H+BAR_GAP)+10;
          const barW=maxVal>0?Math.round((d.val/maxVal)*CHART_W):0;
          return(
            <g key={d.name}>
              <text x={LABEL_W-4} y={y+BAR_H/2+4} textAnchor="end" fontSize={10} fill="#8fa3be">{d.name.split(" ")[0]}</text>
              <rect x={LABEL_W} y={y} width={Math.max(barW,2)} height={BAR_H} fill={color} rx={3} opacity={0.85}/>
              <text x={LABEL_W+barW+5} y={y+BAR_H/2+4} fontSize={10} fill="#eef2f8" fontWeight="700">{fmt(d.val)}</text>
            </g>
          );
        })}
      </svg>
    );
  }

  const addGuest=function(){
    if(!rosterGuestName.trim())return;
    const teamId=teamFilter==="all"?(weekendTeams[0]?.id||null):teamFilter;
    const newGuests=[...weekendGuests,{id:"g"+Date.now(),name:rosterGuestName.trim(),position:guestPos.trim()||null,jersey_number:guestNum.trim()||null,isGuest:true,teamId}];
    saveGuests(newGuests);
    setRosterGuestName("");setGuestPos("");setGuestNum("");
  };

  if(showRosterPrint){
    const printTeams=teamFilter==="all"?weekendTeams:weekendTeams.filter(t=>t.id===teamFilter);
    const allRosterIds=[...new Set(printTeams.flatMap(t=>t.athlete_ids||[]))];
    const rosterAthletes=athletes.filter(a=>allRosterIds.includes(a.id)).sort((a,b)=>a.name.localeCompare(b.name));
    const teamLabel=teamFilter==="all"?"All Teams":(weekendTeams.find(t=>t.id===teamFilter)?.name||"");
    return(
      <div>
        <div className="no-print" style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
          <button className="bb" onClick={()=>setShowRosterPrint(false)} style={{margin:0}}>← Back</button>
          <button className="btn bg bsm" onClick={()=>window.print()}>🖨️ Print</button>
        </div>
        {/* Guest/Pickup player add */}
        <div className="no-print card" style={{marginBottom:12}}>
          <div style={{fontWeight:700,fontSize:12,color:"#e8a020",marginBottom:8}}>👤 Add Pickup / Guest Player</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"flex-end"}}>
            <div className="fg" style={{flex:2,minWidth:120,margin:0}}>
              <label style={{fontSize:10}}>Name *</label>
              <input className="inp" style={{fontSize:12}} placeholder="First Last" value={rosterGuestName} onChange={e=>setRosterGuestName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addGuest();}}/>
            </div>
            <div className="fg" style={{width:70,margin:0}}>
              <label style={{fontSize:10}}>Pos</label>
              <input className="inp" style={{fontSize:12}} placeholder="SS" value={guestPos} onChange={e=>setGuestPos(e.target.value)}/>
            </div>
            <div className="fg" style={{width:60,margin:0}}>
              <label style={{fontSize:10}}>#</label>
              <input className="inp" style={{fontSize:12}} placeholder="—" value={guestNum} onChange={e=>setGuestNum(e.target.value)}/>
            </div>
            <button className="btn bg bsm" onClick={addGuest} disabled={!rosterGuestName.trim()}>+ Add</button>
          </div>
          {weekendGuests.length>0&&<div style={{marginTop:8,display:"flex",flexWrap:"wrap",gap:4}}>
            {weekendGuests.map(function(g){return(
              <span key={g.id} style={{padding:"3px 8px",borderRadius:6,background:"rgba(232,160,32,.1)",color:"#e8a020",fontSize:11,display:"flex",alignItems:"center",gap:5}}>
                {g.jersey_number&&"#"+g.jersey_number+" "}{g.name}{g.position&&" · "+g.position}
                <button onClick={()=>saveGuests(weekendGuests.filter(x=>x.id!==g.id))} style={{background:"none",border:"none",color:"#e84040",cursor:"pointer",padding:"0 2px",fontWeight:700,lineHeight:1}}>✕</button>
              </span>
            );})}
          </div>}
        </div>
        {/* Print-friendly roster */}
        <div style={{background:"#f6f1e2",color:"#1a1a2e",borderRadius:10,padding:"24px 28px",fontFamily:"Georgia,serif"}}>
          <div style={{textAlign:"center",marginBottom:20}}>
            <div style={{fontSize:22,fontWeight:800,letterSpacing:.5}}>RA Academies</div>
            <div style={{fontSize:16,fontWeight:700,marginTop:4}}>{weekend.name||"Tournament"} — Roster</div>
            {(weekend.start_date||weekend.end_date)&&<div style={{fontSize:12,marginTop:2,color:"#555"}}>{weekend.start_date||""}{weekend.end_date?" – "+weekend.end_date:""}</div>}
            {teamLabel!=="All Teams"&&<div style={{fontSize:13,fontWeight:700,marginTop:4,color:"#e8a020"}}>{teamLabel}</div>}
          </div>
          {/* Player table */}
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead>
              <tr style={{borderBottom:"2px solid #1a1a2e"}}>
                <th style={{padding:"6px 8px",textAlign:"left",fontWeight:700}}>#</th>
                <th style={{padding:"6px 8px",textAlign:"left",fontWeight:700}}>Name</th>
                <th style={{padding:"6px 8px",textAlign:"left",fontWeight:700}}>Position</th>
                <th style={{padding:"6px 8px",textAlign:"left",fontWeight:700}}>Bats/Throws</th>
                <th style={{padding:"6px 8px",textAlign:"left",fontWeight:700}}>✓</th>
              </tr>
            </thead>
            <tbody>
              {[...rosterAthletes,...weekendGuests.filter(function(g){return !g.teamId||printTeams.some(function(t){return t.id===g.teamId;});})].map(function(a,i){return(
                <tr key={a.id} style={{borderBottom:"1px solid #ccc",background:i%2===0?"transparent":"rgba(0,0,0,.03)"}}>
                  <td style={{padding:"6px 8px",color:"#888"}}>{a.jersey_number||"—"}</td>
                  <td style={{padding:"6px 8px",fontWeight:600}}>{a.name}{a.isGuest&&<span style={{marginLeft:6,fontSize:10,color:"#e8a020",fontStyle:"italic"}}>(Guest)</span>}</td>
                  <td style={{padding:"6px 8px"}}>{a.position||"—"}</td>
                  <td style={{padding:"6px 8px"}}>{[a.bats,a.throws].filter(Boolean).join("/")||"—"}</td>
                  <td style={{padding:"6px 8px",width:32}}></td>
                </tr>
              );})}
              {/* Blank lines for write-ins */}
              {[1,2,3].map(n=>(
                <tr key={"blank"+n} style={{borderBottom:"1px solid #ccc"}}>
                  <td style={{padding:"6px 8px"}}>&nbsp;</td>
                  <td style={{padding:"6px 8px"}}>&nbsp;</td>
                  <td style={{padding:"6px 8px"}}>&nbsp;</td>
                  <td style={{padding:"6px 8px"}}>&nbsp;</td>
                  <td style={{padding:"6px 8px"}}>&nbsp;</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div style={{marginTop:16,display:"flex",gap:40,fontSize:12,color:"#555"}}>
            <div>Total: {rosterAthletes.length+weekendGuests.length} players</div>
            <div>Guests: {weekendGuests.length}</div>
          </div>
        </div>
      </div>
    );
  }

  if(showGroupReport){
    const rows=playerStats.filter(function(d){return d&&d.player&&d.fielding&&d.batting;}).map(function(d){
      const posEntries=Object.entries((d.fielding.posBreak)||{}).sort((a,b)=>b[1]-a[1]);
      const playerScopedGames=scopedGames.filter(g=>(g.lineup||[]).some(l=>l.athleteId===d.player.id));
      const bOverall=computeBattingBySlot(d.player.id,playerScopedGames).overall||{};
      return{
        player:d.player,
        batting:{overall:bOverall,avg:d.batting.avg,totalH:d.batting.totalH,totalAb:d.batting.totalAb},
        stats:{
          total:playerScopedGames.length,
          totalInnings:d.fielding.totalInn,
          availableInnings:d.fielding.availInn,
          benchInnings:d.fielding.benchInn,
          posCounts:d.fielding.posBreak||{}
        }
      };
    });
    const teamLabel=teamFilter==="all"?"All Teams":(weekendTeams.find(t=>t.id===teamFilter)?.name||"");
    return(
      <div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>

        </div>
        <WeekendGroupReport weekend={weekend} rows={rows.filter(r=>!r.player.isGuest)} teamLabel={teamLabel}/>

  if(selectedPlayerId){
    const d=playerStats.find(x=>x.player.id===selectedPlayerId);
    if(d)return(<WeekendPlayerDetail player={d.player} games={weekendGames} allGames={games} teams={teams} weekend={weekend} onBack={()=>setSelectedPlayerId(null)}/>);
  }

  const tabStyle=(t)=>({padding:"7px 14px",border:"none",background:"transparent",fontSize:11,fontWeight:700,textTransform:"uppercase",color:chartTab===t?"#e8a020":"#6b82a0",borderBottom:chartTab===t?"2px solid #e8a020":"2px solid transparent",cursor:"pointer",whiteSpace:"nowrap"});
  const scopeBtn=(s,lbl)=>(<button key={s} onClick={()=>setChartScope(s)} style={{padding:"4px 10px",borderRadius:6,border:"1px solid "+(chartScope===s?"#e8a020":"rgba(255,255,255,.12)"),background:chartScope===s?"rgba(232,160,32,.12)":"transparent",color:chartScope===s?"#e8a020":"#6b82a0",fontSize:11,fontWeight:700,cursor:"pointer"}}>{lbl}</button>);

  return(
    <div>
      {/* Team filter */}
      {weekendTeams.length>1&&(
        <div className="fb" style={{marginBottom:12,flexWrap:"wrap"}}>
          <button className={`fc ${teamFilter==="all"?"on":""}`} onClick={()=>setTeamFilter("all")}>All Teams</button>

      {/* Action buttons */}

        <button className="btn bgh bsm" onClick={()=>setShowRosterPrint(true)}>🖨️ Print Roster</button>

          {[["weekend","Weekend"],["30days","30 Days"],["summer","Summer"]].map(function(x){
            return(<button key={x[0]} onClick={()=>setChartScope(x[0])} style={{padding:"4px 10px",borderRadius:6,border:"1px solid rgba(255,255,255,.1)",background:chartScope===x[0]?"rgba(232,160,32,.15)":"transparent",color:chartScope===x[0]?"#e8a020":"#6b82a0",fontSize:11,cursor:"pointer"}}>{x[1]}</button>);

function GameSummary({game,athletes}){
  const innCount=game.innings||6;
  const ids=new Set((game.lineup||[]).map(l=>l.athleteId));
  for(let i=1;i<=innCount;i++){Object.values(getChartForInning(game,i)).forEach(id=>{if(id)ids.add(id);});}
  const rows=[...ids].map(id=>({player:gamePlayers(game,athletes).find(p=>p.id===id),stats:computeAthleteGameStats(id,[game])})).filter(r=>r.player).sort((a,b)=>a.player.name.localeCompare(b.player.name));
  if(rows.length===0)return<div style={{fontSize:12,color:"#6b82a0"}}>No lineup or positions logged for this game.</div>;
  return(
    <div>
      {rows.map(r=>{
        const posEntries=Object.entries(r.stats.posCounts).sort((a,b)=>b[1]-a[1]);
        const benchInn=Math.max(0,innCount-r.stats.totalInnings);
        const benchPct=Math.round(benchInn/Math.max(innCount,1)*100);
        return(
          <div key={r.player.id} style={{marginBottom:8,paddingBottom:8,borderBottom:"1px solid rgba(255,255,255,.06)"}}>
            <div style={{fontWeight:700,fontSize:13,marginBottom:2}}>{r.player.name}{r.player.isGuest&&<span style={{color:"#e8a020",fontWeight:600,fontSize:10}}> (Guest)</span>} <span style={{color:"#6b82a0",fontWeight:400,fontSize:11}}>· {fmtInnings(r.stats.totalInnings)}/{innCount} innings</span></div>
            <div style={{fontSize:11,color:"#8fa3be"}}>
              {posEntries.length>0?posEntries.map(([pos,n])=>`${pos} ${Math.round(n/innCount*100)}%`).join("   ·   "):"No defensive innings"}
              {benchPct>0&&<span>{posEntries.length>0?"   ·   ":""}<span style={{color:"#6b82a0"}}>Bench {benchPct}%</span></span>}
            </div>
          </div>
        );
      })}
    </div>
  );
}


function computeWeekendPAs(players,games,weekend,teams){
  // Games link to weekends via team_id -> teams -> weekend_id
  const weekendTeamIds=new Set((teams||[]).filter(t=>t.weekend_id===weekend?.id).map(t=>t.id));
  const weekendGameIds=new Set(games.filter(g=>weekendTeamIds.has(g.team_id)).map(g=>g.id));
  const pas={};
  players.forEach(p=>{pas[p.id]=0;});
  games.forEach(g=>{
    if(!weekendGameIds.has(g.id))return;
    const bs=g.batting_stats||{};
    Object.entries(bs).forEach(([id,line])=>{
      if(pas[id]!==undefined)pas[id]+=(line.pa||line.ab||0);
    });
  });
  return pas;
}

function classifyHitter(p){
  // Determine a player's batting profile from season stats + measurables
  // Returns: "leadoff" | "two_hole" | "middle" | "five_hole" | "bottom"
  const m=p.measurables||{};
  const speed=parseFloat(m.sixty||99);
  const exitVelo=parseFloat(m.exit_velo||m.exitVelo||0);
  const obp=p.obp||0.320;
  const slg=p.slg||0.380;
  const avg=p.avg||0.250;

  // Leadoff: high OBP (>.380), fast (60 under 7.5), makes contact
  if(obp>=0.380&&speed<7.5&&avg>=0.280) return "leadoff";
  // Two hole: high OBP or good avg, handles bat well, can move runners
  if(obp>=0.340&&avg>=0.270) return "two_hole";
  // Middle (3-4): power + high OPS
  if((p.ops||0)>=0.850||exitVelo>=88) return "middle";
  // Five hole: slower/bigger kid, still drives in runs, good spot for extra PA
  if(speed>=8.0||exitVelo>=82) return "five_hole";
  // Bottom of order otherwise
  return "bottom";
}

function optimizeLineup(players,games,mode,priorityIds,seasonStats,lineupSize=9){
  const stats=players.map(p=>{
    const bs=computeBattingBySlot(p.id,games);
    const m=p.measurables||{};
    const ss=seasonStats?.[p.id];
    const raw=ss&&ss.ab>0?ss:bs.overall;
    const obp=raw.ab>0?((raw.h+(raw.bb||0)+(raw.hbp||0))/Math.max(raw.ab+(raw.bb||0)+(raw.hbp||0)+(raw.sf||0),1)):p._seasonObp||0.320;
    const slg=calcSLG(raw)||p._seasonSlg||0.380;
    const avg=raw.ab>0?raw.h/raw.ab:p._seasonAvg||bs.avg||0.250;
    const ops=obp+slg;
    const speed=parseFloat(m.sixty||99);
    const exitVelo=parseFloat(m.exit_velo||m.exitVelo||0);
    const priority=priorityIds?.includes(p.id)||false;
    const ps={...p,avg,obp,slg,ops,speed,exitVelo,priority,slotAvgs:bs.bySlot,hasStats:raw.ab>0};
    return{...ps,profile:classifyHitter(ps)};
  });

  // Separate urgent (priority) players from the rest
  const urgentPlayers=stats.filter(s=>s.priority);
  const normalPlayers=stats.filter(s=>!s.priority);

  // Sort normal players by mode
  let normalSorted=[];
  if(mode==="best") normalSorted=[...normalPlayers].sort((a,b)=>(b.obp*0.6+b.avg*0.4)-(a.obp*0.6+a.avg*0.4));
  else if(mode==="speed") normalSorted=[...normalPlayers].sort((a,b)=>a.speed-b.speed);
  else if(mode==="power") normalSorted=[...normalPlayers].sort((a,b)=>(b.ops*0.6+b.slg*0.4)-(a.ops*0.6+a.slg*0.4));
  else if(mode==="unique"){
    const rem=[...normalPlayers];const assigned=[];
    for(let slot=1;slot<=lineupSize;slot++){
      if(!rem.length)break;
      let best=null;let bestScore=-1;
      for(const p of rem){const sd=p.slotAvgs[slot];const score=sd&&sd.ab>0?sd.h/sd.ab:p.avg;if(score>bestScore){bestScore=score;best=p;}}
      if(best){assigned.push(best);rem.splice(rem.indexOf(best),1);}
    }
    normalSorted=[...assigned,...rem];
  } else normalSorted=normalPlayers;

  // Build a 9-12 slot array
  const lineup=new Array(lineupSize).fill(null);

  // Place urgent players intelligently based on their profile
  // Priority slots that get the most PAs in a game: 1,2,3,4,5 (top of order bats most)
  // Map profiles to ideal target slots
  const urgentByProfile={leadoff:[],two_hole:[],middle:[],five_hole:[],bottom:[]};
  urgentPlayers.forEach(p=>urgentByProfile[p.profile].push(p));

  // Assign urgent players to their best slots
  // Leadoff candidates -> slot 1 or 2
  // Two hole -> slot 2 or 1
  // Middle power -> slot 3 or 4
  // Five hole -> slot 5
  // Bottom -> slot 5 or 6
  const urgentSlotMap=[
    {profiles:["leadoff"],slots:[0,1]},        // slots 1-2
    {profiles:["two_hole"],slots:[1,0]},        // slots 2-1
    {profiles:["middle"],slots:[2,3]},          // slots 3-4
    {profiles:["five_hole","bottom"],slots:[4,5]}, // slots 5-6
  ];

  const usedUrgent=new Set();
  urgentSlotMap.forEach(({profiles,slots})=>{
    profiles.forEach(prof=>{
      urgentByProfile[prof].forEach(p=>{
        if(usedUrgent.has(p.id))return;
        // Find first available slot in preferred positions
        const target=slots.find(s=>s<lineupSize&&lineup[s]===null);
        if(target!==undefined){lineup[target]=p;usedUrgent.add(p.id);}
      });
    });
  });

  // Any urgent players not yet placed - put in first open slot in top half
  urgentPlayers.filter(p=>!usedUrgent.has(p.id)).forEach(p=>{
    const slot=lineup.findIndex((s,i)=>s===null&&i<Math.ceil(lineupSize/2));
    if(slot!==-1){lineup[slot]=p;usedUrgent.add(p.id);}
    else{const any=lineup.findIndex(s=>s===null);if(any!==-1)lineup[any]=p;}
  });

  // Fill remaining slots with normal players in order
  let ni=0;
  for(let i=0;i<lineupSize;i++){
    if(lineup[i]===null){
      while(ni<normalSorted.length&&usedUrgent.has(normalSorted[ni].id))ni++;
      if(ni<normalSorted.length){lineup[i]=normalSorted[ni];ni++;}
    }
  }

  return lineup.filter(Boolean).slice(0,lineupSize);
}

function SetBattingOrderModal({allPlayers,currentLineup,onClose,onSave}){
  const initial=currentLineup.length>0?currentLineup.map(l=>l.athleteId):["","","","","","","","",""];
  const[slots,setSlots]=useState(initial);

  const[dragIdx,setDragIdx]=useState(null);
  const[dragOver,setDragOver]=useState(null);
  const addSlot=()=>setSlots(s=>[...s,""]);
  const removeSlot=(i)=>setSlots(s=>s.filter((_,idx)=>idx!==i));
  const updateSlot=(i,val)=>setSlots(s=>s.map((v,idx)=>idx===i?val:v));
  const onDragStart=(i)=>setDragIdx(i);
  const onDragEnter=(i)=>{if(i!==dragIdx)setDragOver(i);};
  const onDragEnd=()=>{
    if(dragIdx!==null&&dragOver!==null&&dragIdx!==dragOver){
      setSlots(s=>{const n=[...s];const[removed]=n.splice(dragIdx,1);n.splice(dragOver,0,removed);return n;});
    }
    setDragIdx(null);setDragOver(null);
  };

  const save=()=>{
    const filled=slots.filter(Boolean);
    if(filled.length===0){alert("Set at least one batting spot.");return;}
    const oldPosByAthlete={};
    currentLineup.forEach(l=>{oldPosByAthlete[l.athleteId]=l.position;});

  return(
    <div className="mbg" onClick={onClose}><div className="modal" style={{maxWidth:480}} onClick={e=>e.stopPropagation()}>

        {slots.map((val,i)=>{
          const ath=allPlayers.find(a=>a.id===val);
          const isDragging=dragIdx===i;
          const isOver=dragOver===i;
          return(<div key={i}
            draggable
            onDragStart={()=>onDragStart(i)}
            onDragEnter={()=>onDragEnter(i)}
            onDragEnd={onDragEnd}
            onDragOver={e=>e.preventDefault()}
            style={{display:"flex",alignItems:"center",gap:8,marginBottom:6,opacity:isDragging?0.4:1,background:isOver?"rgba(232,160,32,.08)":"transparent",borderRadius:8,padding:"2px 0",transition:"background .15s",cursor:"grab"}}>

            <div style={{width:26,height:26,borderRadius:"50%",background:"#e8a020",color:"#0a0a0a",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,flexShrink:0}}>{i+1}</div>

            <select className="inp" style={{flex:1}} value={val} onChange={e=>updateSlot(i,e.target.value)} onClick={e=>e.stopPropagation()}>
              <option value="">— empty —</option>
              {allPlayers.map(a=><option key={a.id} value={a.id}>{a.name}{a.isGuest?" (Guest)":""}</option>)}
            </select>
            <button onClick={()=>removeSlot(i)} style={{background:"none",border:"none",color:"#e84040",cursor:"pointer",fontSize:16,flexShrink:0,padding:"4px 6px"}}>✕</button>
          </div>);
        })}
      </div>
      <button className="btn bgh bsm" onClick={addSlot} style={{marginBottom:14}}>+ Add Spot</button>
      <div className="mf">
        <button className="btn bgh bsm" onClick={onClose}>Cancel</button>
        <button className="btn bg bsm" onClick={save}>Save Order</button>
      </div>
    </div></div>
  );
}


function LineupPlayerStats({a,games,teams,weekend,scope}){
  if(!a||a.isGuest)return null;
  // Filter games by scope
  const now=new Date();
  const scopedGames=games.filter(g=>{
    const gd=g.game_date?new Date(g.game_date+"T00:00:00"):null;
    if(scope==="weekend"){
      const wkTeamIds=new Set((teams||[]).filter(t=>t.weekend_id===weekend?.id).map(t=>t.id));
      return wkTeamIds.has(g.team_id);
    }
    if(scope==="month"){
      if(!gd)return false;
      return(now-gd)<30*24*60*60*1000;
    }
    if(scope==="week"){
      if(!gd)return false;
      return(now-gd)<7*24*60*60*1000;
    }
    return true; // all
  });
  const bs=computeBattingBySlot(a.id,scopedGames);
  const pa=scopedGames.reduce((s,g)=>{const b=(g.batting_stats||{})[a.id];return s+(b?b.pa||b.ab||0:0);},0);
  const obp=bs.overall.ab>0?((bs.overall.h+(bs.overall.bb||0)+(bs.overall.hbp||0))/Math.max(bs.overall.ab+(bs.overall.bb||0)+(bs.overall.hbp||0)+(bs.overall.sf||0),1)):0;
  const fmt=(n)=>"."+String(Math.round(n*1000)).padStart(3,"0");
  if(bs.overall.ab>0)return(
    <div style={{fontSize:9,color:"#6b82a0",marginTop:1,display:"flex",gap:6,flexWrap:"wrap"}}>
      <span><span style={{color:"#8fa3be"}}>AVG </span><span style={{color:"#e8a020",fontWeight:700}}>{fmt(bs.avg)}</span></span>
      <span><span style={{color:"#8fa3be"}}>PA </span><span style={{color:"#eef2f8",fontWeight:600}}>{pa}</span></span>
      <span><span style={{color:"#8fa3be"}}>OBP </span><span style={{color:"#27c97a",fontWeight:700}}>{fmt(obp)}</span></span>
    </div>
  );
  return <div style={{fontSize:9,color:"#6b82a0",marginTop:1}}>{pa>0?pa+" PA":"No stats"}</div>;
}



function ShowcaseBuilder({weekends,teams,athletes,isAdmin,profile,initialWkId}){
  const[wkId,setWkId]=useState(initialWkId||weekends[0]?.id||"");
  const[metrics,setMetrics]=useState({}); // {athleteId: {sixty,homeToFirst,exitVelo,pitchVelo,armVelo,popTime}}
  const[saving,setSaving]=useState(false);
  const[showPrint,setShowPrint]=useState(false);
  const[editingId,setEditingId]=useState(null);

  const wk=weekends.find(w=>w.id===wkId);
  // Get all athletes on teams for this weekend
  const wkTeamIds=teams.filter(t=>t.weekend_id===wkId).map(t=>t.id);
  const rosterIds=[...new Set(teams.filter(t=>wkTeamIds.includes(t.id)).flatMap(t=>t.athlete_ids||[]))];
  // Sort by jersey number then name
  const roster=athletes.filter(a=>rosterIds.includes(a.id)).sort(function(a,b){
    const na=parseInt(a.jersey_number||"999"),nb=parseInt(b.jersey_number||"999");
    if(na!==nb)return na-nb;
    return(a.name||"").localeCompare(b.name||"");
  });

  // Load metrics from athlete measurables as seed, allow local overrides
  const getMet=(aid,key)=>{
    if(metrics[aid]&&metrics[aid][key]!==undefined)return metrics[aid][key];
    const a=athletes.find(x=>x.id===aid);
    const m=a?.measurables||{};
    if(key==="sixty")return m.sixty_yard||m["60_yard"]||m.sixty||"";
    if(key==="homeToFirst")return m.home_to_first||m.homeToFirst||m.h_to_1||"";
    if(key==="exitVelo")return m.exit_velo||m.exit_velocity||m.exitVelo||"";
    if(key==="pitchVelo")return m.pitch_velo||m.velocity||m.pitchVelo||"";
    if(key==="armVelo")return m.arm_velo||m.of_velo||m.armVelo||"";
    if(key==="popTime")return m.pop_time||m.popTime||"";
    return "";
  };
  const setMet=(aid,key,val)=>setMetrics(p=>({...p,[aid]:{...(p[aid]||{}),[key]:val}}));

  const saveToProfiles=async()=>{
    if(!isAdmin)return;
    setSaving(true);
    for(const aid of Object.keys(metrics)){
      const m=metrics[aid];
      const a=athletes.find(x=>x.id===aid);
      if(!a)continue;
      const existing=a.measurables||{};
      const updated={...existing};
      if(m.sixty!==undefined)updated.sixty_yard=m.sixty;
      if(m.homeToFirst!==undefined)updated.home_to_first=m.homeToFirst;
      if(m.exitVelo!==undefined)updated.exit_velo=m.exitVelo;
      if(m.pitchVelo!==undefined)updated.pitch_velo=m.pitchVelo;
      if(m.armVelo!==undefined)updated.arm_velo=m.armVelo;
      if(m.popTime!==undefined)updated.pop_time=m.popTime;
      try{
        await fetchWithRefresh(`${SURL}/rest/v1/profiles?id=eq.${aid}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`},body:JSON.stringify({measurables:updated})});
      }catch(e){console.warn("Save metric error",e);}
    }
    setSaving(false);
    alert("✅ Metrics saved to player profiles!");
  };

  const CREAM="#f6f1e2";
  const METRICS=[
    {key:"sixty",label:"60 Yd Dash",unit:"sec",placeholder:"7.12"},
    {key:"homeToFirst",label:"Home → 1st",unit:"sec",placeholder:"4.35"},
    {key:"exitVelo",label:"Exit Velo",unit:"mph",placeholder:"88"},
    {key:"pitchVelo",label:"Pitch Velo",unit:"mph",placeholder:"78"},

        <div style={{background:CREAM,color:"#000",border:"3px solid #000",borderRadius:10,padding:"20px 24px",maxWidth:900,margin:"0 auto",fontFamily:"Georgia,Times New Roman,serif"}}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12,paddingBottom:10,borderBottom:"3px solid #000"}}>
            <img src={BRANDING.logos.iconDark} alt="" style={{height:40,flexShrink:0}}/>
            <div>

              <div style={{fontSize:20,fontWeight:900,textTransform:"uppercase"}}>{wk?.name||"Showcase"}</div>
              <div style={{fontSize:11,color:"#5a4a2a"}}>🎯 Showcase Report · {wk?.start_date||""}</div>
            </div>
          </div>
          {/* Player spotlight cards */}
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {roster.map(function(a){
              const isPitcher=a.position&&a.position.toLowerCase().includes("pitch");
              const metricsToShow=[
                {lbl:"60 Yd Dash",val:getMet(a.id,"sixty"),unit:"sec"},
                {lbl:"Home → 1st",val:getMet(a.id,"homeToFirst"),unit:"sec"},
                {lbl:"Exit Velo",val:getMet(a.id,"exitVelo"),unit:"mph"},
                {lbl:isPitcher?"Pitch Velo":"OF Arm Velo",val:getMet(a.id,isPitcher?"pitchVelo":"armVelo"),unit:"mph"},

              ].filter(function(m){return m.val;});
              return(
                <div key={a.id} style={{border:"2px solid #000",borderRadius:8,overflow:"hidden",pageBreakInside:"avoid"}}>
                  {/* Header band */}
                  <div style={{background:"#1a1a2e",color:CREAM,padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div>

                      </div>
                      <div style={{fontSize:10,opacity:.7,marginTop:2}}>
                        {[a.position,a.other_positions].filter(Boolean).join(" · ")}

                    <div style={{textAlign:"right",fontSize:10,opacity:.7}}>

                      {metricsToShow.length===0&&<div style={{fontSize:10,color:"#aaa",fontStyle:"italic"}}>No metrics recorded</div>}
                      {metricsToShow.map(function(m){return(
                        <div key={m.lbl} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:"1px solid #f0ede6"}}>
                          <span style={{fontSize:10,color:"#5a4a2a"}}>{m.lbl}</span>

                      );})}
                    </div>
                    {/* Bio / Notes */}
                    <div style={{padding:"10px 14px"}}>
                      <div style={{fontSize:9,fontWeight:800,textTransform:"uppercase",letterSpacing:1,color:"#5a4a2a",marginBottom:8}}>Player Info</div>
                      {[
                        ["Height",a.height],["Weight",a.weight?a.weight+" lbs":null],
                        ["GPA",a.gpa],["High School",a.high_school],["Dream School",a.dream_school]
                      ].filter(function(row){return row[1];}).map(function(row){return(
                        <div key={row[0]} style={{fontSize:10,marginBottom:3}}>
                          <span style={{color:"#5a4a2a",fontWeight:600}}>{row[0]}: </span>{row[1]}

                    </div>
                  </div>

          <div style={{borderTop:"2px solid #000",marginTop:16,paddingTop:8,display:"flex",justifyContent:"space-between",fontSize:9,color:"#5a4a2a"}}>
            <span>DiamondTrack · {BRANDING.name}</span>

          </div>
        </div>
      </div>

  return(

      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:8}}>

      {roster.length===0&&<div className="empty"><div className="ei">👥</div><div className="et">No players on this weekend's roster</div><div className="es">Add teams and players in the Weekends tab first</div></div>}

                <th style={{padding:"8px 6px",textAlign:"center",color:"#6b82a0",fontSize:10,whiteSpace:"nowrap"}}>60 Yd</th>
                <th style={{padding:"8px 6px",textAlign:"center",color:"#6b82a0",fontSize:10,whiteSpace:"nowrap"}}>H→1st</th>
                <th style={{padding:"8px 6px",textAlign:"center",color:"#6b82a0",fontSize:10,whiteSpace:"nowrap"}}>Exit Velo</th>
                <th style={{padding:"8px 6px",textAlign:"center",color:"#6b82a0",fontSize:10,whiteSpace:"nowrap"}}>Pitch/Arm</th>
                <th style={{padding:"8px 6px",textAlign:"center",color:"#6b82a0",fontSize:10,whiteSpace:"nowrap"}}>Pop Time</th>

            </thead>

                        return(<td key={key} style={{padding:"9px 6px",textAlign:"center",fontWeight:val?700:400,color:val?"#eef2f8":"#3a4a5e"}}>{val||"—"}</td>);

                    {isExpanded&&<tr style={{background:"rgba(232,160,32,.05)",borderBottom:"2px solid rgba(232,160,32,.2)"}}>
                      <td colSpan={7} style={{padding:"12px 14px"}}>
                        <div style={{fontWeight:700,marginBottom:10,color:"#e8a020"}}>✏️ Enter metrics for {a.name}</div>
                        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:10}}>
                          {METRICS.map(function(met){
                            const isPit=a.position&&a.position.toLowerCase().includes("pitch");
                            if(met.key==="armVelo"&&isPit)return null;
                            if(met.key==="pitchVelo"&&!isPit)return null;
                            return(
                              <div key={met.key} className="fg" style={{marginBottom:0}}>
                                <label>{met.label} <span style={{color:"#6b82a0",fontWeight:400}}>({met.unit})</span></label>
                                <input className="inp" placeholder={met.placeholder} value={getMet(a.id,met.key)} onChange={e=>setMet(a.id,met.key,e.target.value)} style={{textAlign:"center"}}/>
                              </div>
                            );
                          })}
                        </div>
                        <div style={{marginTop:8,fontSize:10,color:"#6b82a0"}}>Click the row again to collapse · {isAdmin?"Use 'Save to Profiles' to persist":"Metrics visible to coaches only"}</div>
                      </td>
                    </tr>}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>}
    </div>
  );
}




function TeamPlansPage({team,programs,athletes,onBack}){
  const[planTab,setPlanTab]=useState("practice"); // practice | asp | workouts
  const[selectedPlanId,setSelectedPlanId]=useState(null);

  // Filter programs tagged to this team
  const teamProgs=programs.filter(function(p){
    return (p.targetTeams||p.target_teams||[]).includes(team.id);
  });

  const tabTypes={
    practice:["plan","team_practice"],
    asp:["asp"],
    workouts:["speed","group","individual"],
  };

  const tabLabels={
    practice:"📋 Practice Plans",
    asp:"⚾ ASP Sessions",
    workouts:"⚡ Workouts",
  };

  const visibleProgs=teamProgs.filter(function(p){
    return tabTypes[planTab].includes(p.planType||p.plan_type||"plan");
  }).sort(function(a,b){
    return new Date(b.week||b.created_at||0)-new Date(a.week||a.created_at||0);
  });

  const selectedProg=selectedPlanId
    ?visibleProgs.find(function(p){return p.id===selectedPlanId;})
    :visibleProgs[0]||null;

  // When tab changes, reset selection
  const changeTab=(t)=>{setPlanTab(t);setSelectedPlanId(null);};

  // Build computedTimes for WorkoutPrintView
  const computedTimes=React.useMemo(function(){
    if(!selectedProg)return[];
    const days=selectedProg.days||[];
    let t=selectedProg.startTime||selectedProg.start_time||"09:00";
    return days.map(function(d){
      const slot=t;
      const dur=parseInt(d.sectionDuration)||0;
      if(dur)t=addMinutes(t,dur);
      return slot;
    });
  },[selectedProg]);

  const cfg=PLAN_CONFIGS[selectedProg?.planType||selectedProg?.plan_type]||PLAN_CONFIGS.plan;

  return(
    <div>
      {/* Header */}
      <div className="ph" style={{marginBottom:0}}>
        <button className="bb" onClick={onBack} style={{margin:0}}>← Teams</button>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:800,fontSize:16}}>{team.name}</div>
          <div style={{fontSize:11,color:"#6b82a0"}}>
            {team.age_group&&<span style={{marginRight:8}}>#{team.age_group}</span>}
            Plans &amp; Sessions
          </div>
        </div>
        {selectedProg&&<button className="btn bg bsm" onClick={()=>window.print()}>🖨️ Print</button>}
      </div>

      {/* Plan type tabs */}
      <div style={{display:"flex",borderBottom:"1px solid rgba(255,255,255,.08)",marginBottom:14,overflowX:"auto"}}>
        {Object.entries(tabLabels).map(function(entry){
          const key=entry[0];const label=entry[1];
          const cnt=teamProgs.filter(function(p){return tabTypes[key].includes(p.planType||p.plan_type||"plan");}).length;
          return(
            <button key={key} onClick={()=>changeTab(key)} style={{padding:"8px 14px",border:"none",background:"transparent",fontSize:12,fontWeight:planTab===key?700:400,color:planTab===key?"#e8a020":"#6b82a0",borderBottom:planTab===key?"2px solid #e8a020":"2px solid transparent",cursor:"pointer",whiteSpace:"nowrap",flexShrink:0}}>
              {label} {cnt>0&&<span style={{fontSize:10,background:"rgba(232,160,32,.12)",color:"#e8a020",borderRadius:8,padding:"0 5px",marginLeft:3}}>{cnt}</span>}
            </button>
          );
        })}
      </div>

      {visibleProgs.length===0&&<div className="empty">
        <div className="ei">{planTab==="practice"?"📋":planTab==="asp"?"⚾":"⚡"}</div>
        <div className="et">No {tabLabels[planTab]} tagged to {team.name} yet</div>
        <div className="es">Create a {planTab==="practice"?"Practice Plan":planTab==="asp"?"ASP Session":"Workout"} and tag this team when saving.</div>
      </div>}

      {visibleProgs.length>0&&<div>
        {/* Session date dropdown */}
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,flexWrap:"wrap"}}>
          <div style={{fontWeight:700,fontSize:13,color:"#6b82a0",whiteSpace:"nowrap"}}>Select Session:</div>
          <select className="inp" style={{maxWidth:360}} value={selectedProg?.id||""} onChange={function(e){setSelectedPlanId(e.target.value||null);}}>
            {visibleProgs.map(function(p){
              return(<option key={p.id} value={p.id}>{p.week||"Undated"} — {p.name}</option>);
            })}
          </select>
          {selectedProg&&(selectedProg.raInfluenced||selectedProg.ra_influenced)&&<div style={{display:"flex",alignItems:"center",gap:6,padding:"4px 10px",background:"rgba(39,201,122,.08)",border:"1px solid rgba(39,201,122,.2)",borderRadius:6}}>
            <span style={{fontSize:14}}>🏟️</span>
            <span style={{fontSize:11,fontWeight:700,color:"#27c97a"}}>
              {(selectedProg.raInfluenceLevel||selectedProg.ra_influence_level)==="ra_designed"?"RA Designed":(selectedProg.raInfluenceLevel||selectedProg.ra_influence_level)==="collaborative"?"RA Collaborative":"RA Guided"}
            </span>
          </div>}
        </div>

        {/* Print-ready plan view */}
        {selectedProg&&<WorkoutPrintView
          name={selectedProg.name}
          week={selectedProg.week}
          duration={selectedProg.duration}
          location={selectedProg.location}
          coachNote={selectedProg.planNotes||selectedProg.plan_notes}
          days={selectedProg.days||[]}
          cfg={cfg}
          athletes={athletes}
          athId={selectedProg.athleteId||selectedProg.athlete_id||""}
          tGrads={selectedProg.targetGrads||selectedProg.target_grads||[]}
          tAgeGroups={selectedProg.targetAgeGroups||selectedProg.target_age_groups||[]}
          tGroups={selectedProg.targetGroups||selectedProg.target_groups||[]}
          startTime={selectedProg.startTime||selectedProg.start_time||""}
          computedTimes={computedTimes}
        />}
      </div>}
    </div>
  );
}


// Team staff roles with permission levels
const TEAM_STAFF_ROLES=[
  {id:"head_coach",label:"Head Coach",icon:"🏟️",desc:"Full team admin — manage roster, plans, games, billing",adminLevel:3},
  {id:"assistant_coach",label:"Assistant Coach",icon:"⚾",desc:"Can build plans and manage practice sessions",adminLevel:2},
  {id:"team_parent",label:"Team Parent",icon:"👨‍👩‍👧",desc:"Can view roster, check in athletes, manage communication",adminLevel:1},
];

function TeamSettingsModal({team,coaches,athletes,onClose,onUpdate}){
  const[saving,setSaving]=useState(false);
  const[ageGroup,setAgeGroup]=useState(team.age_group||"");
  const[tags,setTags]=useState(team.tags||[]);
  const[tagInput,setTagInput]=useState("");
  const[staff,setStaff]=useState(team.team_staff||[]);
  const[addStaffId,setAddStaffId]=useState("");
  const[addStaffRole,setAddStaffRole]=useState("assistant_coach");

  const addTag=(t)=>{t=t.trim();if(t&&!tags.includes(t))setTags(p=>[...p,t]);setTagInput("");};
  const removeTag=(t)=>setTags(p=>p.filter(x=>x!==t));
  const addStaff=()=>{
    if(!addStaffId)return;
    if(staff.find(s=>s.profile_id===addStaffId))return;
    setStaff(p=>[...p,{profile_id:addStaffId,role:addStaffRole}]);
    setAddStaffId("");
  };
  const removeStaff=(id)=>setStaff(p=>p.filter(s=>s.profile_id!==id));
  const updateStaffRole=(id,role)=>setStaff(p=>p.map(s=>s.profile_id===id?{...s,role}:s));

  const save=async()=>{
    setSaving(true);
    await onUpdate(team.id,{age_group:ageGroup||null,tags,team_staff:staff});
    setSaving(false);
    onClose();
  };

  // Available coaches/staff (all coaches + anyone not already on team)
  const availableStaff=coaches.filter(function(co){
    return !staff.find(s=>s.profile_id===co.id);
  });

  return(
    <div className="mbg" onClick={onClose}>
      <div className="modal" style={{maxWidth:540}} onClick={e=>e.stopPropagation()}>
        <div className="mt">⚙️ Team Settings — {team.name}</div>

        {/* Age Group */}
        <div className="fg">
          <label>Age Group</label>
          <select className="inp" value={ageGroup} onChange={e=>setAgeGroup(e.target.value)}>
            <option value="">— None —</option>
            {AGE_GROUPS.map(g=><option key={g} value={g}>{g}</option>)}
          </select>
          <div style={{fontSize:10,color:"#6b82a0",marginTop:3}}>Used to target workout plans to this team automatically.</div>
        </div>

        {/* Tags */}
        <div className="fg">
          <label>Tags <span style={{fontWeight:400,fontSize:10,color:"#6b82a0"}}>(e.g. "Fall 2025", "Travel", "Select")</span></label>
          <div style={{display:"flex",gap:6,marginBottom:6}}>
            <input className="inp" style={{flex:1}} placeholder="Add tag..." value={tagInput}
              onChange={e=>setTagInput(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter"){addTag(tagInput);}}}/>
            <button className="btn bg bsm" onClick={()=>addTag(tagInput)}>Add</button>
          </div>
          {[ageGroup,...tags].filter(Boolean).length>0&&<div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {ageGroup&&<span style={{padding:"3px 8px",borderRadius:4,background:"rgba(232,160,32,.12)",border:"1px solid rgba(232,160,32,.3)",fontSize:11,color:"#e8a020",fontWeight:700}}>{ageGroup}</span>}
            {tags.map(function(t){return(
              <span key={t} style={{padding:"3px 8px",borderRadius:4,background:"rgba(58,155,232,.1)",border:"1px solid rgba(58,155,232,.2)",fontSize:11,color:"#3a9be8",display:"flex",alignItems:"center",gap:4}}>
                {t}<button onClick={()=>removeTag(t)} style={{background:"none",border:"none",color:"#3a9be8",cursor:"pointer",padding:0,lineHeight:1}}>×</button>
              </span>
            );})}
          </div>}
        </div>

        {/* Team Staff & Roles */}
        <div className="ds">Team Staff & Roles</div>
        <div style={{fontSize:11,color:"#6b82a0",marginBottom:10}}>Staff get access to this team's athletes based on their role. Head coaches have full admin access.</div>

        {staff.length>0&&<div style={{marginBottom:10}}>
          {staff.map(function(s){
            const co=coaches.find(function(co2){return co2.id===s.profile_id;})||athletes.find(function(a2){return a2.id===s.profile_id;});
            const roleInfo=TEAM_STAFF_ROLES.find(r=>r.id===s.role)||TEAM_STAFF_ROLES[1];
            return(
              <div key={s.profile_id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.08)",borderRadius:8,marginBottom:5}}>
                <div style={{fontSize:18}}>{roleInfo.icon}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:13}}>{co?.name||"Unknown"}</div>
                  <div style={{fontSize:10,color:"#6b82a0"}}>{co?.email||""}</div>
                </div>
                <select className="inp" style={{width:"auto",fontSize:11,padding:"3px 6px"}} value={s.role} onChange={e=>updateStaffRole(s.profile_id,e.target.value)}>
                  {TEAM_STAFF_ROLES.map(r=><option key={r.id} value={r.id}>{r.label}</option>)}
                </select>

  );
}


function GamesPage({athletes,weekends,teams,games,programs,coaches,profile,onSaveWeekend,onDeleteWeekend,onPatchWeekend,onSaveTeam,onUpdateTeam,onDeleteTeam,onRenameTeam,onUpdateRoster,onSaveGame,onDeleteGame,onPatchGame,onImportTeamStats,onClearTeamStats,onSaveDefensePlan,onSaveBilling,onUpdateAthleteBalance,setAthletes,isAdmin}){
  // Non-admins see weekends they created OR are assigned to via team coach_ids
  if(!isAdmin){
    const myTeamWkIds=new Set(teams.filter(function(t){return(t.coach_ids||[]).includes(profile?.id||"");}).map(function(t){return t.weekend_id;}));
    weekends=weekends.filter(function(w){return w.created_by===profile?.id||myTeamWkIds.has(w.id);});
    const wkIds=new Set(weekends.map(function(w){return w.id;}));
    teams=teams.filter(function(t){return wkIds.has(t.weekend_id);});
    games=games.filter(function(g){return teams.some(function(t){return t.id===g.team_id;});});
  }
  const[importGameId,setImportGameId]=useState(null);
  const handleGameImport=(gameId,matchedRows)=>{
    const game=games.find(g=>g.id===gameId);
    if(!game)return;
    const newBatting={...(game.batting_stats||{})};
    const newFielding={...(game.imported_fielding||{})};
    const newPitching={...(game.imported_pitching||{})};
    let newLineup=[...(game.lineup||[])];
    let changedCount=0;
    const notInLineup=[];
    matchedRows.forEach(r=>{
      newBatting[r.athleteId]=r.batting;
      newFielding[r.athleteId]=r.fielding;
      if(r.pitching&&r.pitching.ip>0)newPitching[r.athleteId]=r.pitching;
      const gcPos=primaryPosFromFielding(r.fielding);
      const idx=newLineup.findIndex(l=>l.athleteId===r.athleteId);
      if(idx!==-1){
        if(gcPos&&newLineup[idx].position!==gcPos){newLineup[idx]={...newLineup[idx],position:gcPos};changedCount++;}
      }else if(gcPos||r.batting.ab>0){
        // GameChanger's CSV has no batting-order info at all, so we can't
        // know where this person actually hit. Guessing (e.g. tacking them
        // on the end) would just present a wrong slot as fact - worse than
        // not knowing. Their batting/fielding stats are still saved below;
        // only their lineup SLOT is left for the coach to set by hand.
        const matched=athletes.find(a=>a.id===r.athleteId)||(game.guests||[]).find(x=>x.id===r.athleteId);
        notInLineup.push(matched?matched.name:(r.name||"Unknown player"));
      }
    });
    let msg="";
    if(changedCount)msg+=`GameChanger's data will update ${changedCount} player position${changedCount===1?"":"s"} to match what actually happened.`;
    if(notInLineup.length){
      msg+=(msg?"\n\n":"")+`Heads up: ${notInLineup.join(", ")} ${notInLineup.length===1?"has":"have"} stats in this file but ${notInLineup.length===1?"isn't":"aren't"} in this game's batting lineup. GameChanger doesn't report batting order, so I won't guess a spot for ${notInLineup.length===1?"them":"them"} - their batting/fielding numbers will still be saved, but add ${notInLineup.length===1?"them":"them"} to the lineup yourself (with the real spot) if you want that part tracked.`;
    }
    if(msg&&!window.confirm(msg+"\n\nContinue?")){
      return;
    }
    onPatchGame(gameId,{lineup:newLineup,batting_stats:newBatting,imported_fielding:newFielding,imported_pitching:newPitching,tracking_complete:true});
    setImportGameId(null);
  };
  const[section,setSection]=useState("weekends");
  const[pitchingPlan,setPitchingPlan]=useState(null);
  const[defensePlanState,setDefensePlanState]=useState(null);
  const[billingReport,setBillingReport]=useState(null);
  const[activeTeamId,setActiveTeamId]=useState(null);
  const[activeGameId,setActiveGameId]=useState(null);
  const[modal,setModal]=useState(null);
  const[rosterTeamId,setRosterTeamId]=useState(null);
  const[wkName,setWkName]=useState("");const[wkStart,setWkStart]=useState("");const[wkEnd,setWkEnd]=useState("");const[wkType,setWkType]=useState("tournament");
  const[teamWk,setTeamWk]=useState("");const[teamName,setTeamName]=useState("");
  const[rosterSearch,setRosterSearch]=useState("");
  const[showNewGame,setShowNewGame]=useState(false);
  const[gOpp,setGOpp]=useState("");const[gDate,setGDate]=useState("");const[gTime,setGTime]=useState("");const[gLoc,setGLoc]=useState("");
  const[editingTeamId,setEditingTeamId]=useState(null);
  const[editTeamName,setEditTeamName]=useState("");
  const[importTeamId,setImportTeamId]=useState(null);
  const[seasonStatsTeamId,setSeasonStatsTeamId]=useState(null);
  const[dayWeekendId,setDayWeekendId]=useState("all");
  const[selectedDay,setSelectedDay]=useState(null);
  const[reportWeekendId,setReportWeekendId]=useState(null);
  const[showcaseWkId,setShowcaseWkId]=useState(null);
  const[teamPlans,setTeamPlans]=useState(null);
  const[teamSettingsId,setTeamSettingsId]=useState(null);

  const startRename=(t)=>{setEditingTeamId(t.id);setEditTeamName(t.name);};
  const saveRename=()=>{if(editTeamName.trim())onRenameTeam(editingTeamId,editTeamName);setEditingTeamId(null);};

  const savePitchingPlan=async(team,plan)=>{
    await onSaveGame&&onPatchGame&&Promise.resolve();
    if(pitchingPlan?.team){
      const t=pitchingPlan.team;
      const wk=weekends.find(w=>w.id===t.weekend_id);
      if(wk){const updated={...wk,pitching_plans:{...(wk.pitching_plans||{}),[t.id]:plan}};onSaveDefensePlan&&onSaveDefensePlan(updated);}
    }
    setPitchingPlan(null);
  };
  const staffById=useMemo(()=>{const m={};(coaches||[]).forEach(c=>m[c.id]=c);if(profile&&!m[profile.id])m[profile.id]=profile;return m;},[coaches,profile]);

  if(showcaseWkId){

  if(activeGame)return<GameDetail game={activeGame} team={activeGameTeam} weekend={activeGameWeekend} athletes={athletes} staffById={staffById} profile={profile} games={games} teams={teams} onBack={()=>setActiveGameId(null)} onPatchGame={onPatchGame} onDeleteGame={(id)=>{onDeleteGame(id);setActiveGameId(null);}} onImportStats={handleGameImport}/>;

  return(<>
    <div className="ph"><div className="pt">Diamond <em>Games</em></div>
      <div style={{display:"flex",gap:7}}>
        <button className={`btn ${section==="showcase"?"bg":"bgh"} bsm`} onClick={()=>setSection("showcase")}>🎯 Showcase</button>
        <button className={`btn ${section==="schedule"?"bg":"bgh"} bsm`} onClick={()=>setSection("schedule")}>Schedule</button>
        <button className={`btn ${section==="weekends"?"bg":"bgh"} bsm`} onClick={()=>setSection("weekends")}>Weekends &amp; Teams</button>
        <button className={`btn ${section==="day"?"bg":"bgh"} bsm`} onClick={()=>setSection("day")}>Day View</button>
        <button className={`btn ${section==="weekendreport"?"bg":"bgh"} bsm`} onClick={()=>setSection("weekendreport")}>Weekend Report</button>
      </div>
    </div>

    {section==="weekends"&&(<>
      <div style={{marginBottom:12}}><button className="btn bg bsm" onClick={()=>setModal("addWeekend")}>+ New Weekend</button></div>
      {weekends.length===0&&<div className="empty"><div className="ei">📅</div><div className="et">No weekends yet</div><div className="es">Create one, then add teams under it.</div></div>}
      {weekends.map(wk=>{
        const wkTeams=teams.filter(t=>t.weekend_id===wk.id);
        return(
          <div key={wk.id} className="card" style={{marginBottom:10}}>
            <div className="ph" style={{marginBottom:8}}>
              <div><div style={{fontWeight:700,fontSize:14}}>{wk.name}</div>{(wk.start_date||wk.end_date)&&<div style={{fontSize:10,color:"#6b82a0"}}>{wk.start_date||"?"} – {wk.end_date||"?"}</div>}</div>
              <div style={{display:"flex",gap:6}}>
                <button className="btn bgh bsm" onClick={()=>{setTeamWk(wk.id);setModal("addTeam");}}>+ Team</button>
                {isAdmin&&<button className="btn bsm" style={{background:"rgba(232,160,32,.12)",border:"1px solid rgba(232,160,32,.25)",color:"#e8a020"}} onClick={()=>setBillingReport(wk)}>💰 Billing</button>}
                <button className="btn bbl bsm" style={{color:"#27c97a",borderColor:"rgba(39,201,122,.3)"}} onClick={()=>setShowcaseWkId(wk.id)}>🎯 Showcase</button>
                <button className="btn bgr bsm" onClick={()=>onDeleteWeekend(wk.id)}>✕</button>
