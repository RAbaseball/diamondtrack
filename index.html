            </div>
            {wkTeams.length===0?<div style={{fontSize:12,color:"#6b82a0"}}>No teams yet.</div>:wkTeams.map(t=>(
              <div key={t.id} style={{marginBottom:4}}>

                  {editingTeamId===t.id?(
                    <div style={{flex:1,display:"flex",gap:6,alignItems:"center"}}>
                      <input className="inp" autoFocus value={editTeamName} onChange={e=>setEditTeamName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveRename()} style={{flex:1}}/>
                      <button className="btn bg bsm" onClick={saveRename}>Save</button>

                    <>

                        <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
                          <div style={{fontSize:13,fontWeight:600}}>{t.name}</div>
                          {t.age_group&&<span style={{fontSize:9,padding:"1px 5px",borderRadius:3,background:"rgba(232,160,32,.12)",color:"#e8a020",fontWeight:700}}>#{t.age_group}</span>}
                          {(t.tags||[]).map(function(tag){return(<span key={tag} style={{fontSize:9,padding:"1px 5px",borderRadius:3,background:"rgba(58,155,232,.1)",color:"#3a9be8"}}>#{tag}</span>);})}
                        </div>
                        <div style={{fontSize:10,color:"#6b82a0"}}>{(t.athlete_ids||[]).length} players{t.team_staff&&t.team_staff.length>0?" · "+t.team_staff.length+" staff":""}</div>
                      </div>
                      <button className="btn bgh bsm" onClick={()=>startRename(t)}>✏️</button>
                    </>
                  )}
                  {editingTeamId!==t.id&&(<>
                    <button className="btn bgh bsm" onClick={()=>{setRosterTeamId(t.id);setModal("roster");}}>Roster</button>
                    <button className="btn bgh bsm" onClick={()=>{setActiveTeamId(t.id);setSection("schedule");}}>Games →</button>
                    <button className="btn bgh bsm" onClick={()=>setTeamPlans(t)}>📋 Plans</button>
                    <button className="btn bgh bsm" onClick={()=>setTeamSettingsId(t.id)}>⚙️ Settings</button>
                    <button className="btn bgr bsm" onClick={()=>onDeleteTeam(t.id)}>✕</button>
                    <button className="btn bbl bsm" onClick={()=>setPitchingPlan({weekend:wk,team:t})}>⚾ Pitching</button>
                    <button className="btn bbl bsm" style={{color:"#27c97a",borderColor:"rgba(39,201,122,.3)"}} onClick={()=>setDefensePlanState({weekend:wk,team:t})}>🛡️ Defense</button>
                  </>)}
                </div>
                {editingTeamId!==t.id&&(
                  <div style={{display:"flex",gap:6,padding:"0 4px 6px"}}>
                    <button className="btn bgh bsm" onClick={()=>setImportTeamId(t.id)}>📊 Import Season Stats</button>

            ))}
          </div>
        );
      })}
    </>)}

    {section==="day"&&(()=>{

                <div key={g.id} className="card cc" onClick={()=>{setActiveTeamId(g.team_id);setActiveGameId(g.id);}} style={{marginBottom:8,display:"flex",alignItems:"center",gap:12}}>

                    <div style={{fontSize:10,color:"#6b82a0"}}>{g.location||"No location set"} · {(g.lineup||[]).length} in lineup</div>

    {section==="showcase"&&<ShowcaseBuilder weekends={weekends} teams={teams} athletes={athletes} isAdmin={isAdmin} profile={profile}/>}

    {section==="weekendreport"&&(()=>{

              </div>
              <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                <button className="btn bgh bsm" onClick={e=>{e.stopPropagation();setImportGameId(g.id);}} title="Import GameChanger stats for this game">📊</button>
                {g.assigned_coach_id?(
                  <span className="bdg bg2" onClick={e=>{e.stopPropagation();if(g.assigned_coach_id===profile.id)onPatchGame(g.id,{assigned_coach_id:null});}}>{g.assigned_coach_id===profile.id?"Yours · tap to release":(staffById[g.assigned_coach_id]?.name||"Coach")}</span>
                ):(
                  <span className="bdg bg3" onClick={e=>{e.stopPropagation();onPatchGame(g.id,{assigned_coach_id:profile.id});}}>Claim game</span>
                )}
              </div>
            </div>
          ))}
        </>)}
      </>)}
    </>)}

    {modal==="addWeekend"&&(
      <div className="mbg" onClick={()=>setModal(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="mt">New <em>Weekend</em></div>
        <div className="fg"><label>Weekend Type</label>
          <div style={{display:"flex",gap:6}}>
            {[["tournament","🏆 Tournament"],["showcase","🎯 Showcase"],["practice","⚾ Practice Weekend"]].map(function([v,lbl]){return(
              <button key={v} onClick={()=>setWkType(v)} style={{flex:1,padding:"6px",borderRadius:7,border:"1px solid "+(wkType===v?"#e8a020":"rgba(255,255,255,.12)"),background:wkType===v?"rgba(232,160,32,.12)":"transparent",color:wkType===v?"#e8a020":"#8fa3be",fontSize:11,fontWeight:wkType===v?700:400,cursor:"pointer"}}>{lbl}</button>
            );})}
          </div>
        </div>
        <div className="fg"><label>Name</label><input className="inp" placeholder="e.g. June 27–28 — Regional Qualifier" value={wkName} onChange={e=>setWkName(e.target.value)}/></div>
        <div className="fg2"><div className="fg"><label>Start</label><input className="inp" type="date" value={wkStart} onChange={e=>setWkStart(e.target.value)}/></div><div className="fg"><label>End</label><input className="inp" type="date" value={wkEnd} onChange={e=>setWkEnd(e.target.value)}/></div></div>
        <div className="mf"><button className="btn bgh bsm" onClick={()=>setModal(null)}>Cancel</button><button className="btn bg bsm" disabled={!wkName.trim()} onClick={async()=>{const wk=await onSaveWeekend({name:wkName,startDate:wkStart,endDate:wkEnd,weekend_type:wkType});if(wk){setWkName("");setWkStart("");setWkEnd("");setModal(null);}}}>Create</button></div>
      </div></div>
    )}

    {teamSettingsId&&<TeamSettingsModal
      team={teams.find(t=>t.id===teamSettingsId)||{id:teamSettingsId,name:"Team",team_staff:[],tags:[],age_group:""}}
      coaches={coaches||[]}
      athletes={athletes}
      onClose={()=>setTeamSettingsId(null)}
      onUpdate={async(id,patch)=>{onUpdateTeam&&await onUpdateTeam(id,patch);setTeamSettingsId(null);}}
    />}
    {defensePlanState&&<DefensePlanModal weekend={defensePlanState.weekend} team={defensePlanState.team} games={games} athletes={athletes} teams={teams} onClose={()=>setDefensePlanState(null)} onSave={onSaveDefensePlan}/>}
      {billingReport&&isAdmin&&<BillingReportModal weekend={billingReport} teams={teams} games={games} athletes={athletes} onClose={()=>setBillingReport(null)} onSaveWeekendBilling={onSaveBilling} onUpdateAthleteBalance={onUpdateAthleteBalance}/>}
      {pitchingPlan&&<PitchingPlanModal weekend={pitchingPlan.weekend} team={pitchingPlan.team} games={games} athletes={athletes} onClose={()=>setPitchingPlan(null)} onSave={savePitchingPlan}/>}
      {modal==="addTeam"&&(
      <div className="mbg" onClick={()=>setModal(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="mt">New <em>Team</em></div>
        <div className="fg"><label>Weekend</label><select className="inp" value={teamWk} onChange={e=>setTeamWk(e.target.value)}><option value="">Select...</option>{weekends.map(w=><option key={w.id} value={w.id}>{w.name}</option>)}</select></div>
        <div className="fg"><label>Team name</label><input className="inp" placeholder="e.g. 12U Black" value={teamName} onChange={e=>setTeamName(e.target.value)}/></div>
        <div className="mf"><button className="btn bgh bsm" onClick={()=>setModal(null)}>Cancel</button><button className="btn bg bsm" disabled={!teamName.trim()||!teamWk} onClick={async()=>{const t=await onSaveTeam(teamWk,teamName);if(t){setTeamName("");setModal(null);setRosterTeamId(t.id);setModal("roster");}}}>Create</button></div>
      </div></div>
    )}

    {modal==="roster"&&rosterTeamId&&(()=>{
      const team=teams.find(t=>t.id===rosterTeamId);
      if(!team)return null;
      const filtered=athletes.filter(a=>(a.name||"").toLowerCase().includes(rosterSearch.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
      return(
        <div className="mbg" onClick={()=>setModal(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
          <div className="mt">{team.name} <em>Roster</em></div>
          <input className="inp" placeholder="🔍 Search athletes..." value={rosterSearch} onChange={e=>setRosterSearch(e.target.value)} style={{marginBottom:10}}/>
          <div style={{maxHeight:340,overflowY:"auto"}}>
            {filtered.map(a=>{
              const checked=(team.athlete_ids||[]).includes(a.id);
              return(
                <div key={a.id} className="ri" style={{cursor:"pointer"}} onClick={()=>{const ids=checked?team.athlete_ids.filter(x=>x!==a.id):[...(team.athlete_ids||[]),a.id];onUpdateRoster(team.id,ids);}}>
                  <div className="riv">{a.avatar||ini(a.name)}</div>
                  <div style={{flex:1,fontSize:13}}>{a.name}</div>
                  <div style={{width:18,height:18,borderRadius:"50%",background:checked?"#27c97a":"transparent",border:checked?"none":"1.5px solid rgba(255,255,255,.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"#0a0a0a"}}>{checked?"✓":""}</div>
                </div>
              );
            })}
          </div>
          <div className="mf"><button className="btn bg bsm" onClick={()=>setModal(null)}>Done</button></div>
        </div></div>
      );
    })()}

    {importTeamId&&(()=>{
      const team=teams.find(t=>t.id===importTeamId);
      const rosterAthletes=athletes.filter(a=>(team?.athlete_ids||[]).includes(a.id));
      return(
        <ImportStatsModal
          athletes={rosterAthletes}
          onClose={()=>setImportTeamId(null)}
          onConfirm={(matched)=>{onImportTeamStats(importTeamId,matched);setImportTeamId(null);}}
          scopeLabel={`Importing SEASON totals for ${team?.name||"this team"} — this should be a whole-season (or multi-game) export, not filtered to one game. Re-importing later replaces these numbers with the new export's totals.`}
        />
      );
    })()}

    {seasonStatsTeamId&&(()=>{
      const team=teams.find(t=>t.id===seasonStatsTeamId);
      if(!team)return null;
      const battingRows=Object.entries(team.season_batting||{}).map(([aid,b])=>{
        const a=athletes.find(x=>x.id===aid);
        const avg=b.ab>0?(b.h/b.ab):0;
        return{athlete:a,name:a?a.name:"Unknown",b,avg};
      }).filter(r=>r.athlete).sort((a,b)=>b.avg-a.avg);
      const fieldingRows=Object.entries(team.season_fielding||{}).map(([aid,f])=>{
        const a=athletes.find(x=>x.id===aid);
        return{athlete:a,name:a?a.name:"Unknown",f};
      }).filter(r=>r.athlete);
      return(
        <div className="mbg" onClick={()=>setSeasonStatsTeamId(null)}><div className="modal" style={{maxWidth:600}} onClick={e=>e.stopPropagation()}>
          <div className="mt">{team.name} <em>Season Stats</em></div>
          <div style={{fontSize:10,color:"#6b82a0",marginBottom:10}}>Imported from GameChanger — season-cumulative, not broken down by game.</div>
          <div className="ds">Batting</div>
          <div style={{maxHeight:200,overflowY:"auto",marginBottom:14}}>
            <table className="tbl"><thead><tr><th>Player</th><th>AB</th><th>H</th><th>AVG</th><th>HR</th><th>RBI</th></tr></thead>
              <tbody>{battingRows.map(r=>(
                <tr key={r.athlete.id}><td>{r.name}</td><td>{r.b.ab}</td><td>{r.b.h}</td><td>{r.avg.toFixed(3).replace(/^0/,"")}</td><td>{r.b.hr}</td><td>{r.b.rbi}</td></tr>
              ))}</tbody>
            </table>
          </div>
          <div className="ds">Fielding (innings by position)</div>
          <div style={{maxHeight:200,overflowY:"auto"}}>
            <table className="tbl"><thead><tr><th>Player</th><th>P</th><th>C</th><th>1B</th><th>2B</th><th>3B</th><th>SS</th><th>LF</th><th>CF</th><th>RF</th><th>Total</th></tr></thead>
              <tbody>{fieldingRows.map(r=>(
                <tr key={r.athlete.id}><td>{r.name}</td><td>{fmtInnings(r.f.P)}</td><td>{fmtInnings(r.f.C)}</td><td>{fmtInnings(r.f["1B"])}</td><td>{fmtInnings(r.f["2B"])}</td><td>{fmtInnings(r.f["3B"])}</td><td>{fmtInnings(r.f.SS)}</td><td>{fmtInnings(r.f.LF)}</td><td>{fmtInnings(r.f.CF)}</td><td>{fmtInnings(r.f.RF)}</td><td>{fmtInnings(r.f.Total)}</td></tr>
              ))}</tbody>
            </table>
          </div>
          <div className="mf">
            <button
              className="btn bgr bsm"
              onClick={()=>{
                if(window.confirm(`Remove all imported season stats for ${team.name}? This clears the batting and fielding numbers shown here - it won't affect any individual game's lineup or tracking data.`)){
                  onClearTeamStats(team.id);
                  setSeasonStatsTeamId(null);
                }
              }}
            >🗑️ Remove Imported Stats</button>
            <button className="btn bg bsm" onClick={()=>setSeasonStatsTeamId(null)}>Close</button>
          </div>
        </div></div>
      );
    })()}

    {importGameId&&(()=>{
      const g=games.find(x=>x.id===importGameId);
      const t=g?teams.find(x=>x.id===g.team_id):null;
      const rosterAthletes=athletes.filter(a=>(t?.athlete_ids||[]).includes(a.id));
      return(
        <ImportStatsModal
          athletes={[...rosterAthletes,...(g?.guests||[])]}
          onClose={()=>setImportGameId(null)}
          onConfirm={(matched)=>handleGameImport(importGameId,matched)}
          singleGameMode={true}
          scopeLabel={`Importing stats for ${t?t.name:"this team"} vs ${g?.opponent||"TBD"} (${g?.game_date||"no date"}) — export a single-game-filtered CSV from GameChanger.`}
        />
      );
    })()}
  </>);
}


function GameDetail({game,team,weekend,athletes,staffById,profile,games,teams,onBack,onPatchGame,onDeleteGame,onImportStats}){
  const[tab,setTab]=useState("lineup"); // lineup | pitching | field | stats | print
  const[tracking,setTracking]=useState(false);
  const[currentInning,setCurrentInning]=useState(1);
  const[guestName,setGuestName]=useState("");
  const[showOptimizer,setShowOptimizer]=useState(false);
  const[showBattingOrder,setShowBattingOrder]=useState(false);
  const[showImport,setShowImport]=useState(false);

  const innCount=game.innings||6;
  const innings=Array.from({length:innCount},(_,i)=>i+1);
  // Filter to roster athletes only (+ guests already on this game)
  // Build roster from team.athlete_ids, falling back to anyone
  // who appears in any game lineup for this team (across all games)
  const rosterIds=new Set(team?.athlete_ids||[]);
  const allTeamGames=(games||[]).filter(g=>g.team_id===team?.id);
  const lineupIds=new Set(allTeamGames.flatMap(g=>(g.lineup||[]).map(l=>l.athleteId)).filter(Boolean));
  // Merge both sources so roster includes formally-added AND lineup-placed players
  const effectiveRosterIds=new Set([...rosterIds,...lineupIds]);
  const rosterAthletes=effectiveRosterIds.size>0
    ?athletes.filter(a=>effectiveRosterIds.has(a.id))
    :athletes; // last resort: show all athletes if nothing else works
  const weekendGuestPlayers=(weekend?.guests||[]).filter(function(g){return !g.teamId||g.teamId===team?.id;}).map(g=>({...g,isGuest:true,isWeekendGuest:true}));
  const gameGuestPlayers=(game.guests||[]).map(g=>({...g,isGuest:true}));
  // Merge weekend guests + game-specific guests (dedupe by id)
  const allGuests=[...weekendGuestPlayers,...gameGuestPlayers.filter(g=>!weekendGuestPlayers.find(w=>w.id===g.id))];
  // Look up a player by ID — check players first, then all athletes
  const findPlayer=(id)=>players.find(x=>x.id===id)||athletes.find(x=>x.id===id)||allGuests.find(x=>x.id===id);
  const players=[...rosterAthletes,...allGuests];
  const lineup=game.lineup||[];

  const addToLineup=(athleteId)=>{
    const cur=game.lineup||[];
    if(cur.some(l=>l.athleteId===athleteId))return;
    onPatchGame(game.id,{lineup:[...cur,{athleteId,position:""}]});
  };
  const addGuestToLineup=()=>{
    const name=guestName.trim();
    if(!name)return;
    const id="guest_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    onPatchGame(game.id,{guests:[...(game.guests||[]),{id,name}],lineup:[...(game.lineup||[]),{athleteId:id,position:""}]});
    setGuestName("");
  };
  const removeFromLineup=(athleteId)=>onPatchGame(game.id,{lineup:(game.lineup||[]).filter(l=>l.athleteId!==athleteId)});
  const setLineupPos=(athleteId,position)=>onPatchGame(game.id,{lineup:(game.lineup||[]).map(l=>l.athleteId===athleteId?{...l,position}:l)});
  const moveLineup=(index,dir)=>{const arr=[...(game.lineup||[])];const j=index+dir;if(j<0||j>=arr.length)return;[arr[index],arr[j]]=[arr[j],arr[index]];onPatchGame(game.id,{lineup:arr});};
  const setInnings=(n)=>onPatchGame(game.id,{innings:Math.max(1,Math.min(12,n))});
  const setInningPos=(inning,pos,athleteId)=>{
    const snap={...getChartForInning(game,inning)};
    if(athleteId)snap[pos]=athleteId;else delete snap[pos];
    onPatchGame(game.id,{field_chart:{...(game.field_chart||{}),[inning]:snap}});
  };

  const tabSt=(t)=>({padding:"7px 14px",border:"none",background:"transparent",fontSize:12,fontWeight:700,color:tab===t?"#e8a020":"#6b82a0",borderBottom:tab===t?"2px solid #e8a020":"2px solid transparent",cursor:"pointer"});

  if(tab==="print")return(
    <div>
      <div style={{marginBottom:12,display:"flex",gap:8}}>
        <button className="bb" onClick={()=>setTab("lineup")} style={{margin:0}}>← Back</button>
        <button className="btn bg bsm" onClick={()=>window.print()}>🖨️ Print</button>
      </div>
      <PrintableLineupCard game={game} team={team} weekend={weekend} athletes={athletes} staffById={staffById||{}}/>
    </div>
  );

  return(
    <div>
      {/* Header */}
      <div className="ph" style={{marginBottom:0}}>
        <button className="bb" onClick={onBack} style={{margin:0}}>← Games</button>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:800,fontSize:16,lineHeight:1.1}}>{team?.name||"Team"} <span style={{fontWeight:400,color:"#6b82a0"}}>vs</span> {game.opponent||"TBD"}</div>
          <div style={{fontSize:11,color:"#6b82a0"}}>{[game.game_date,game.game_time?fmtTime12(game.game_time):null,game.location?"@ "+game.location:null].filter(Boolean).join(" · ")||"Date TBD"}{weekend?" · "+weekend.name:""}</div>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button className="btn bbl bsm" onClick={()=>setTab("print")}>🖨️ Lineup Card</button>
          {onDeleteGame&&<button className="btn bgr bsm" onClick={()=>{if(window.confirm("Delete this game?"))onDeleteGame(game.id);}}>✕</button>}
        </div>
      </div>

      {/* Tabs */}
      <div style={{display:"flex",borderBottom:"1px solid rgba(255,255,255,.08)",marginBottom:14,overflowX:"auto"}}>
        {[["lineup","📋 Lineup"],["pitching","⚾ Pitching"],["field","🛡️ Field"],["stats","📊 Stats"]].map(function([v,lbl]){return(
          <button key={v} style={tabSt(v)} onClick={()=>setTab(v)}>{lbl}</button>
        );})}
      </div>

      {/* LINEUP TAB */}
      {tab==="lineup"&&<div>
        {/* Header row */}
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
          <div>
            <div style={{fontWeight:800,fontSize:16}}>{team?.name} <span style={{color:"#6b82a0",fontWeight:400,fontSize:13}}>vs</span> {game.opponent||"TBD"}</div>
            <div style={{fontSize:11,color:"#6b82a0"}}>{game.game_date||""}{game.game_time?" · "+fmtTime12(game.game_time):""}  {game.location?" · "+game.location:""}</div>
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            <button className="btn bgh bsm" onClick={()=>setInnings(innCount-1)}>− Inn</button>
            <span style={{padding:"4px 8px",fontSize:12,fontWeight:700,color:"#6b82a0"}}>{innCount} inn</span>
            <button className="btn bgh bsm" onClick={()=>setInnings(innCount+1)}>+ Inn</button>
            <button className="btn bgh bsm" onClick={()=>setShowOptimizer(true)}>⚡ Optimize</button>
          </div>
        </div>

        {/* Score */}
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:"rgba(255,255,255,.03)",borderRadius:8,marginBottom:12}}>
          <span style={{fontSize:12,fontWeight:700,flex:1}}>{team?.name||"Us"}</span>
          <input className="inp" type="number" style={{width:52,textAlign:"center",fontWeight:800,fontSize:18}} placeholder="0" value={game.score_home??""} onChange={e=>onPatchGame(game.id,{score_home:parseInt(e.target.value)||0})}/>
          <span style={{fontWeight:800,fontSize:18,color:"#6b82a0"}}>–</span>
          <input className="inp" type="number" style={{width:52,textAlign:"center",fontWeight:800,fontSize:18}} placeholder="0" value={game.score_away??""} onChange={e=>onPatchGame(game.id,{score_away:parseInt(e.target.value)||0})}/>
          <span style={{fontSize:12,fontWeight:700,flex:1,textAlign:"right"}}>{game.opponent||"Opp"}</span>
        </div>

        {/* Batting order */}
        <div style={{marginBottom:12}}>
          <div style={{fontWeight:700,fontSize:11,textTransform:"uppercase",color:"#6b82a0",letterSpacing:.5,marginBottom:6}}>Batting Order</div>
          {lineup.length===0&&<div style={{fontSize:12,color:"#6b82a0",fontStyle:"italic",marginBottom:6}}>Tap players below to build your lineup</div>}
          {lineup.map(function(entry,i){
            const p=findPlayer(entry.athleteId);
            if(!p)return(<div key={entry.athleteId||i} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 8px",background:"rgba(255,255,255,.02)",border:"1px solid rgba(255,255,255,.04)",borderRadius:7,marginBottom:3}}><span style={{width:22,height:22,borderRadius:"50%",background:"rgba(232,160,32,.1)",color:"#6b82a0",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,flexShrink:0}}>{i+1}</span><span style={{flex:1,fontSize:12,color:"#6b82a0",fontStyle:"italic"}}>Not on roster</span><button onClick={()=>removeFromLineup(entry.athleteId)} style={{background:"none",border:"none",color:"#e84040",cursor:"pointer",padding:"0 4px",fontWeight:700}}>✕</button></div>);
            return(
              <div key={entry.athleteId} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 8px",background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.06)",borderRadius:7,marginBottom:3}}>
                <span style={{width:22,height:22,borderRadius:"50%",background:"rgba(232,160,32,.15)",color:"#e8a020",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0}}>{i+1}</span>
                {p.jersey_number&&<span style={{fontSize:10,color:"#6b82a0",width:22,textAlign:"center",flexShrink:0}}>#{p.jersey_number}</span>}
                <div className="riv" style={{width:24,height:24,fontSize:9,flexShrink:0}}>{p.avatar||ini(p.name)}</div>
                <span style={{flex:1,fontWeight:600,fontSize:13}}>{p.name}{p.isGuest&&<span style={{fontSize:9,color:"#e8a020",marginLeft:4}}>(G)</span>}</span>
                <select className="inp" style={{width:58,padding:"2px 4px",fontSize:11}} value={entry.position||""} onChange={e=>setLineupPos(entry.athleteId,e.target.value)}>
                  <option value="">Pos</option>{LINEUP_POS.map(pos=><option key={pos} value={pos}>{pos}</option>)}
                </select>
                <button onClick={()=>moveLineup(i,-1)} disabled={i===0} style={{background:"none",border:"none",color:"#6b82a0",cursor:"pointer",padding:"0 3px",fontSize:14,lineHeight:1,opacity:i===0?.3:1}}>↑</button>
                <button onClick={()=>moveLineup(i,1)} disabled={i===lineup.length-1} style={{background:"none",border:"none",color:"#6b82a0",cursor:"pointer",padding:"0 3px",fontSize:14,lineHeight:1,opacity:i===lineup.length-1?.3:1}}>↓</button>
                <button onClick={()=>removeFromLineup(entry.athleteId)} style={{background:"none",border:"none",color:"#e84040",cursor:"pointer",padding:"0 4px",fontWeight:700,lineHeight:1}}>✕</button>
              </div>
            );
          })}
        </div>

        {/* Roster bubbles — tap to add/remove */}
        <div style={{marginBottom:12}}>
          <div style={{fontWeight:700,fontSize:11,textTransform:"uppercase",color:"#6b82a0",letterSpacing:.5,marginBottom:8}}>Roster — tap to add</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
            {players.map(function(p){
              const inL=lineup.some(l=>l.athleteId===p.id);
              const num=inL?lineup.findIndex(l=>l.athleteId===p.id)+1:null;
              return(
                <div key={p.id} onClick={()=>inL?removeFromLineup(p.id):addToLineup(p.id)}
                  style={{display:"flex",flexDirection:"column",alignItems:"center",gap:3,cursor:"pointer",opacity:inL?.6:1,transition:"opacity .15s"}}>
                  <div style={{position:"relative"}}>
                    <div className="riv" style={{width:40,height:40,fontSize:13,border:inL?"2px solid #27c97a":"2px solid transparent",boxSizing:"border-box"}}>{p.avatar||ini(p.name)}</div>
                    {inL&&<div style={{position:"absolute",top:-4,right:-4,width:16,height:16,borderRadius:"50%",background:"#27c97a",color:"#fff",fontSize:9,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",border:"1px solid #0d1526"}}>{num}</div>}
                    {p.isGuest&&<div style={{position:"absolute",bottom:-2,right:-2,width:12,height:12,borderRadius:"50%",background:"#e8a020",border:"1px solid #0d1526"}}/>}
                  </div>
                  <div style={{fontSize:9,textAlign:"center",maxWidth:44,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:inL?"#27c97a":"#8fa3be",fontWeight:inL?700:400}}>{p.name.split(" ")[0]}</div>
                  {p.jersey_number&&<div style={{fontSize:8,color:"#6b82a0"}}>#{p.jersey_number}</div>}
                </div>
              );
            })}
          </div>
        </div>

        {/* Guest add */}

        </div>
      </div>}

      {/* FIELD TAB */}
      {tab==="field"&&<div>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,flexWrap:"wrap"}}>
          <div style={{fontSize:12,color:"#6b82a0"}}>Track defensive positions inning by inning.</div>

          {tracking&&<>
            <div style={{display:"flex",gap:4}}>

          const chart=getChartForInning(game,currentInning);

        {game.batting_stats&&Object.keys(game.batting_stats).length>0&&<>
          <div className="ds" style={{marginTop:16}}>Batting Stats</div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
              <thead><tr style={{borderBottom:"1px solid rgba(255,255,255,.1)"}}>

              </tr></thead>
              <tbody>
                {lineup.map(function(entry){
                  const p=findPlayer(entry.athleteId);
                  const bs=(game.batting_stats||{})[entry.athleteId];
                  if(!bs||!p)return null;
                  return(<tr key={entry.athleteId} style={{borderBottom:"1px solid rgba(255,255,255,.05)"}}>
                    <td style={{padding:"5px 8px",fontWeight:600}}>{p.name}</td>
                    {[bs.ab||0,bs.h||0,bs.b2||0,bs.b3||0,bs.hr||0,bs.rbi||0,bs.bb||0,bs.so||0].map((v,vi)=><td key={vi} style={{padding:"5px 8px",textAlign:"center"}}>{v}</td>)}
                    <td style={{padding:"5px 8px",textAlign:"center",fontWeight:700,color:"#e8a020"}}>{bs.ab>0?("."+String(Math.round(bs.h/bs.ab*1000)).padStart(3,"0")):"—"}</td>
                  </tr>);
                })}
              </tbody>
            </table>
          </div>
        </>}
      </div>}
    </div>
  );
}

function ImportStatsModal({athletes,onClose,onConfirm,scopeLabel,singleGameMode}){
  const[rows,setRows]=useState(null);
  const[matches,setMatches]=useState({});
  const[fileName,setFileName]=useState("");
  const[error,setError]=useState("");

  const handleFile=(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    setFileName(file.name);
    setError("");
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const parsed=parseGameChangerCSV(ev.target.result);
        if(parsed.length===0){setError("Couldn't find any player rows in this file. Make sure it's the CSV from GameChanger's Team → Stats → Export Stats.");return;}
        setRows(parsed);
        const initial={};
        parsed.forEach((r,i)=>{initial[i]=bestNameMatch(r.name,athletes);});
        setMatches(initial);
      }catch(err){setError("Couldn't read this file: "+err.message);}
    };
    reader.readAsText(file);
  };

  const confirm=()=>{
    const matched=rows.map((r,i)=>({...r,athleteId:matches[i]})).filter(r=>r.athleteId);
    if(matched.length===0){alert("Match at least one player before importing.");return;}
    onConfirm(matched);
  };

  return(
    <div className="mbg" onClick={onClose}><div className="modal" style={{maxWidth:560}} onClick={e=>e.stopPropagation()}>
      <div className="mt">Import <em>GameChanger</em> Stats</div>
      <div style={{fontSize:11,color:"#6b82a0",marginBottom:14}}>{scopeLabel}</div>
      {!rows?(
        <>
          <input type="file" accept=".csv" onChange={handleFile} className="inp" style={{padding:8}}/>
          {error&&<div style={{fontSize:12,color:"#e84040",marginTop:10}}>{error}</div>}
          <div className="mf" style={{borderTop:"none",paddingTop:14}}><button className="btn bgh bsm" onClick={onClose}>Cancel</button></div>
        </>
      ):(
        <>
          <div style={{fontSize:11,color:"#6b82a0",marginBottom:8}}>{fileName} · {rows.length} player{rows.length===1?"":"s"} found. Match each to your roster — anything left on "Skip" won't be imported.</div>
          {singleGameMode&&rows.some(r=>r.batting.gp>1)&&(
            <div style={{fontSize:11,color:"#e8a020",background:"rgba(232,160,32,.08)",border:"1px solid rgba(232,160,32,.25)",borderRadius:8,padding:"8px 10px",marginBottom:10}}>
              ⚠️ This file looks like it covers more than one game (some players show GP &gt; 1). For accurate per-game stats, export from GameChanger filtered to just this single game before importing here.
            </div>
          )}
          <div style={{maxHeight:360,overflowY:"auto",marginBottom:12}}>
            {rows.map((r,i)=>(
              <div key={i} className="ri" style={{alignItems:"center",gap:8}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:600}}>{r.name||"(no name)"}{r.number&&<span style={{color:"#6b82a0",fontWeight:400}}> #{r.number}</span>}</div>
                  <div style={{fontSize:10,color:"#6b82a0"}}>AB {r.batting.ab} · H {r.batting.h} · Fielding {fmtInnings(r.fielding.Total)} inn</div>
                </div>
                <select className="inp" style={{width:170,flexShrink:0}} value={matches[i]||""} onChange={e=>setMatches(m=>({...m,[i]:e.target.value}))}>
                  <option value="">Skip this row</option>
                  {athletes.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
                </select>
              </div>
            ))}
          </div>
          <div className="mf">
            <button className="btn bgh bsm" onClick={onClose}>Cancel</button>
            <button className="btn bg bsm" onClick={confirm}>Import {Object.values(matches).filter(Boolean).length} Player{Object.values(matches).filter(Boolean).length===1?"":"s"}</button>
          </div>
        </>
      )}
    </div></div>
  );
}



function WeekendGroupReport({weekend,rows,teamLabel}){
  const CREAM="#f6f1e2";
  const isShowcase=weekend.weekend_type==="showcase";
  const fmtAvg=(n)=>n!=null?"."+String(Math.round(n*1000)).padStart(3,"0"):".---";
  const calcOPS2=(o)=>{
    const ab=o.ab||0,h=o.h||0,bb=o.bb||0,hbp=o.hbp||0,sf=o.sf||0;
    const obp=(ab+bb+hbp+sf)>0?(h+bb+hbp)/(ab+bb+hbp+sf):0;
    const slg=ab>0?((o.b1||0)+2*(o.b2||0)+3*(o.b3||0)+4*(o.hr||0))/ab:0;
    return obp+slg;
  };

    <div className="print-target" style={{background:CREAM,color:"#000",border:"3px solid #000",borderRadius:10,padding:"20px 24px",maxWidth:900,margin:"0 auto",fontFamily:"Georgia,Times New Roman,serif"}}>

      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10,paddingBottom:10,borderBottom:"3px solid #000"}}>
        <img src={BRANDING.logos.iconDark} alt="" style={{height:40,width:"auto",flexShrink:0}}/>
        <div>
          <div style={{fontSize:9,fontWeight:700,letterSpacing:1.5,textTransform:"uppercase",color:"#5a4a2a"}}>{BRANDING.name}</div>
          <div style={{fontSize:20,fontWeight:900,textTransform:"uppercase",lineHeight:1.1}}>{weekend.name}</div>

          </div>
        </div>
      </div>

      {/* Showcase intro block */}
      {isShowcase&&<div style={{background:"#1a1a2e",color:CREAM,padding:"10px 14px",borderRadius:6,marginBottom:14,border:"2px solid #000"}}>
        <div style={{fontWeight:800,fontSize:13,textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>🎯 Showcase Overview</div>
        <div style={{display:"flex",gap:20,flexWrap:"wrap",fontSize:11}}>
          <span>{rows.length} Players Showcased</span>
          <span>{rows.filter(r=>r.batting.totalAb>0).length} With Plate Appearances</span>
          {(weekend.start_date)&&<span>📅 {weekend.start_date}</span>}
        </div>
      </div>}

      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:11}}>
          <thead>
            <tr style={{background:"#000",color:CREAM}}>
              {isShowcase&&<th style={{padding:"5px 7px",textAlign:"center"}}>#</th>}
              <th style={{padding:"5px 7px",textAlign:"left"}}>Player</th>
              {isShowcase&&<th style={{padding:"5px 7px",textAlign:"left"}}>Position</th>}
              <th style={{padding:"5px 7px",textAlign:"center"}}>GP</th>
              <th style={{padding:"5px 7px",textAlign:"center"}}>PA</th>
              <th style={{padding:"5px 7px",textAlign:"center"}}>AB</th>
              <th style={{padding:"5px 7px",textAlign:"center"}}>H</th>
              <th style={{padding:"5px 7px",textAlign:"center"}}>HR</th>
              <th style={{padding:"5px 7px",textAlign:"center"}}>RBI</th>
              <th style={{padding:"5px 7px",textAlign:"center",color:"#e8a020"}}>AVG</th>

              const slg=bo.ab>0?((bo.b1||0)+2*(bo.b2||0)+3*(bo.b3||0)+4*(bo.hr||0))/bo.ab:0;

      {/* Showcase individual spotlight cards */}
      {isShowcase&&rows.length>0&&<div style={{marginTop:20}}>
        <div style={{fontWeight:900,fontSize:14,textTransform:"uppercase",letterSpacing:1,borderBottom:"2px solid #000",paddingBottom:4,marginBottom:12}}>Player Spotlights</div>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          {rows.filter(function(r){return!r.player.isGuest;}).map(function(r){
            const p=r.player;
            const meas=p.measurables||{};
            const bo=r.batting.overall||{};
            const posEntries=Object.entries(r.stats.posCounts||{}).sort(function(a,b){return b[1]-a[1];});
            const isPitcher=p.position&&p.position.toLowerCase().includes("pitch");
            return(
              <div key={p.id} style={{border:"2px solid #000",borderRadius:8,overflow:"hidden",pageBreakInside:"avoid"}}>
                {/* Player header band */}
                <div style={{background:"#1a1a2e",color:"#f6f1e2",padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <div>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      {p.jersey_number&&<div style={{fontSize:13,fontWeight:800,opacity:.7}}>#{p.jersey_number}</div>}
                      <div style={{fontSize:17,fontWeight:900,lineHeight:1}}>{p.name}</div>
                    </div>
                    <div style={{fontSize:10,opacity:.7,marginTop:2}}>
                      {[p.position,p.other_positions].filter(Boolean).join(" · ")}
                      {(p.grad||p.age_group)&&" · "+(p.grad?"Class of "+p.grad:p.age_group)}
                    </div>
                  </div>
                  <div style={{textAlign:"right",fontSize:10,opacity:.7}}>
                    {p.high_school&&<div>🏫 {p.high_school}</div>}
                    {p.dream_school&&<div>🎓 {p.dream_school}</div>}
                    {p.bats&&p.throws&&<div>B/T: {p.bats}/{p.throws}</div>}
                  </div>
                </div>
                {/* Metrics + weekend stats */}
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",background:"#fff"}}>
                  {/* Left: key measurables */}
                  <div style={{padding:"10px 14px",borderRight:"1px solid #ddd"}}>
                    <div style={{fontSize:9,fontWeight:800,textTransform:"uppercase",letterSpacing:1,color:"#5a4a2a",marginBottom:8}}>Showcase Metrics</div>
                    <div style={{display:"flex",flexDirection:"column",gap:5}}>
                      {[
                        ["60 Yd Dash",meas.sixty_yard||meas["60_yard"]||meas.sixty,"sec"],
                        ["Home to 1st",meas.home_to_first||meas.h_to_1||meas.homeToFirst,"sec"],
                        ["Exit Velocity",meas.exit_velo||meas.exit_velocity||meas.exitVelo,"mph"],
                        [isPitcher?"Pitch Velo":"OF Arm Velo",isPitcher?(meas.pitch_velo||meas.velocity||meas.pitchVelo):(meas.arm_velo||meas.of_velo||meas.armVelo),"mph"],
                        ["Pop Time",meas.pop_time||meas.popTime,"sec"],
                        ["Infield Velo",meas.if_velo||meas.infield_velo||meas.ifVelo,"mph"]
                      ].filter(function(metric){return metric[1];}).map(function(metric){
                        return(
                          <div key={metric[0]} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"3px 0",borderBottom:"1px solid #f0ede6"}}>
                            <span style={{fontSize:10,color:"#5a4a2a"}}>{metric[0]}</span>
                            <span style={{fontSize:13,fontWeight:800}}>{metric[1]} <span style={{fontSize:9,fontWeight:400,color:"#5a4a2a"}}>{metric[2]}</span></span>
                          </div>
                        );
                      })}
                      {Object.keys(meas).filter(function(k){return meas[k];}).length===0&&<div style={{fontSize:10,color:"#aaa",fontStyle:"italic"}}>No metrics on file — add via athlete profile</div>}
                    </div>
                  </div>
                  {/* Right: weekend performance */}
                  <div style={{padding:"10px 14px"}}>
                    <div style={{fontSize:9,fontWeight:800,textTransform:"uppercase",letterSpacing:1,color:"#5a4a2a",marginBottom:8}}>Weekend Performance</div>
                    {bo.ab>0&&<div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:4,marginBottom:8}}>
                      {[["AB",bo.ab],["H",bo.h],["HR",bo.hr||0],["RBI",bo.rbi||0],["BB",bo.bb||0],["AVG",bo.ab>0?("."+String(Math.round(bo.h/bo.ab*1000)).padStart(3,"0")):"—"]].map(function(st){return(
                        <div key={st[0]} style={{textAlign:"center",background:"#f6f1e2",borderRadius:4,padding:"4px 2px"}}>
                          <div style={{fontWeight:800,fontSize:13}}>{st[1]}</div>
                          <div style={{fontSize:8,color:"#5a4a2a",textTransform:"uppercase"}}>{st[0]}</div>
                        </div>
                      );})}
                    </div>}
                    {bo.ab===0&&<div style={{fontSize:10,color:"#aaa",fontStyle:"italic",marginBottom:8}}>No at-bats recorded</div>}
                    {posEntries.length>0&&<div>
                      <div style={{fontSize:9,color:"#5a4a2a",fontWeight:700,marginBottom:4}}>POSITIONS PLAYED</div>
                      <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                        {posEntries.map(function(pe){return(
                          <span key={pe[0]} style={{fontSize:10,padding:"2px 7px",borderRadius:3,background:"#1a1a2e",color:"#f6f1e2",fontWeight:700}}>{pe[0]} {pe[1]}inn</span>
                        );})}
                      </div>
                    </div>}
                    {r.stats.total>0&&<div style={{marginTop:8,fontSize:10,color:"#5a4a2a"}}>{r.stats.total} game{r.stats.total!==1?"s":""} played</div>}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      </div>}

      {/* Footer */}
      <div style={{borderTop:"2px solid #000",marginTop:16,paddingTop:8,display:"flex",justifyContent:"space-between",fontSize:9,color:"#5a4a2a"}}>
        <span>DiamondTrack · {BRANDING.name}</span>
        <span>{isShowcase?"Showcase Report":"Opportunity Report"} · {weekend.name}</span>
        <span>{new Date().toLocaleDateString()}</span>
      </div>
    </div>
  );
}


function WeekendPlayerDetail({player,games,allGames,teams,weekend,onBack}){
  const[scope,setScope]=useState("weekend");
  const now=new Date();

  const scopedGames=(scope==="weekend"?games:allGames).filter(function(g){
    if(scope==="weekend")return true;
    const gd=g.game_date?new Date(g.game_date+"T00:00:00"):null;
    if(!gd)return false;
    return scope==="30days"?(now-gd)<30*24*60*60*1000:(now-gd)<180*24*60*60*1000;
  });

  const playerGames=scopedGames.filter(g=>(g.lineup||[]).some(l=>l.athleteId===player.id)||(g.imported_fielding||{})[player.id]);
  const batting=computeBattingBySlot(player.id,scopedGames);
  const fmtAvg=(n)=>n!=null?"."+String(Math.round(n*1000)).padStart(3,"0"):".---";

  // Fielding breakdown from imported GC data
  const fieldingByPos={};  // pos -> {innings, errors}
  let totalInn=0,totalErr=0,totalPO=0,totalAst=0,benchInn=0;
  playerGames.forEach(function(g){
    const inn=g.innings||6;
    const imp=(g.imported_fielding||{})[player.id];
    if(imp&&imp.Total>0){
      FIELD_POS.forEach(function(pos){
        if(imp[pos]>0){
          if(!fieldingByPos[pos])fieldingByPos[pos]={innings:0,errors:0};
          fieldingByPos[pos].innings+=imp[pos];
          totalInn+=imp[pos];
        }
      });
      totalErr+=(imp.e||0);
      totalPO+=(imp.po||0);
      totalAst+=(imp.assists||0);
      benchInn+=Math.max(0,inn-imp.Total);
    } else {
      // Only count as bench if game has no data at all — skip entirely if no import/chart
      const hasAnyData=g.imported_fielding&&Object.keys(g.imported_fielding).length>0;
      const inLineup=(g.lineup||[]).some(l=>l.athleteId===player.id);
      if(hasAnyData){if(inLineup)totalInn+=inn; else benchInn+=inn;}
    }
  });

  const availInn=totalInn+benchInn;
  const benchPct=availInn>0?Math.round(benchInn/availInn*100):0;
  const posEntries=Object.entries(fieldingByPos).sort((a,b)=>b[1].innings-a[1].innings);
  const hasFielding=posEntries.length>0;

  // Error rate per position (errors per 9 innings)
  const errRate=(pos)=>{
    const d=fieldingByPos[pos];
    if(!d||d.innings===0)return 0;
    return(d.errors/(d.innings/9)).toFixed(2);
  };

  // Position color map
  const posColors={"P":"#e84040","C":"#e8a020","1B":"#27c97a","2B":"#3a9be8","3B":"#9b59b6","SS":"#f39c12","LF":"#1abc9c","CF":"#3498db","RF":"#e67e22"};

  // Game log
  const gameLog=[...playerGames].sort((a,b)=>(b.game_date||"").localeCompare(a.game_date||""));

  // Batting slot rows
  const battingSlotRows=Object.entries(batting.bySlot).sort((a,b)=>(a[0]==="Unknown"?99:Number(a[0]))-(b[0]==="Unknown"?99:Number(b[0])));

  const scopeBtn=(s,lbl)=>(<button key={s} onClick={()=>setScope(s)} style={{padding:"4px 10px",borderRadius:6,border:"1px solid "+(scope===s?"#e8a020":"rgba(255,255,255,.12)"),background:scope===s?"rgba(232,160,32,.12)":"transparent",color:scope===s?"#e8a020":"#6b82a0",fontSize:11,fontWeight:700,cursor:"pointer"}}>{lbl}</button>);

  return(
    <div>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,flexWrap:"wrap"}}>
        <button className="bb" onClick={onBack} style={{margin:0}}>← Back</button>
        <div style={{flex:1,fontWeight:800,fontSize:18}}>{player.name}</div>
        <div style={{display:"flex",gap:5}}>
          {[["weekend","Weekend"],["30days","30 Days"],["summer","Summer"]].map(([s,l])=>scopeBtn(s,l))}
        </div>
      </div>
      <div style={{fontSize:11,color:"#6b82a0",marginBottom:16}}>{player.position||"—"}{player.grad?" · Class of "+player.grad:player.age_group?" · "+player.age_group:""} · {playerGames.length} games in scope</div>

      {/* Batting summary */}
      {batting.overall.ab>0&&<div className="card" style={{marginBottom:12}}>
        <div className="ds">Batting</div>
        <div className="sr" style={{marginBottom:8}}>
          <div className="sb2"><div className="sv" style={{color:"#e8a020"}}>{fmtAvg(batting.avg)}</div><div className="sl">AVG</div></div>
          <div className="sb2"><div className="sv">{batting.overall.pa||0}</div><div className="sl">PA</div></div>
          <div className="sb2"><div className="sv">{batting.overall.ab}</div><div className="sl">AB</div></div>
          <div className="sb2"><div className="sv">{batting.overall.h}</div><div className="sl">H</div></div>
          <div className="sb2"><div className="sv">{batting.overall.hr||0}</div><div className="sl">HR</div></div>
          <div className="sb2"><div className="sv">{batting.overall.rbi||0}</div><div className="sl">RBI</div></div>
          <div className="sb2"><div className="sv">{batting.overall.bb||0}</div><div className="sl">BB</div></div>
          <div className="sb2"><div className="sv">{batting.overall.so||0}</div><div className="sl">K</div></div>
          <div className="sb2"><div className="sv" style={{color:"#27c97a"}}>{fmtAvg(batting.overall.ab>0?((batting.overall.h||0)+(batting.overall.bb||0)+(batting.overall.hbp||0))/Math.max((batting.overall.ab||0)+(batting.overall.bb||0)+(batting.overall.hbp||0)+(batting.overall.sf||0),1):null)}</div><div className="sl">OBP</div></div>
        </div>
        {battingSlotRows.length>1&&<div>
          <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:6}}>By Batting Order Slot</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {battingSlotRows.map(([slot,d])=>d.ab>0&&(
              <div key={slot} style={{background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)",borderRadius:7,padding:"6px 10px",textAlign:"center"}}>
                <div style={{fontSize:10,color:"#6b82a0",marginBottom:2}}>#{slot==="Unknown"?"?":slot}</div>
                <div style={{fontWeight:700,color:"#e8a020"}}>{fmtAvg(d.ab>0?d.h/d.ab:null)}</div>
                <div style={{fontSize:10,color:"#6b82a0"}}>{d.h}-{d.ab}</div>
              </div>
            ))}
          </div>
        </div>}
      </div>}

      {/* Fielding & Errors */}
      <div className="card" style={{marginBottom:12}}>
        <div className="ds">Fielding & Errors</div>
        {!hasFielding&&<div style={{fontSize:12,color:"#6b82a0"}}>No GameChanger fielding data imported for this period. Upload CSVs in the game detail to see position breakdowns.</div>}
        {hasFielding&&<>
          {/* Summary row */}
          <div className="sr" style={{marginBottom:12}}>
            <div className="sb2"><div className="sv">{fmtInnings(totalInn)}</div><div className="sl">Inn Played</div></div>
            <div className="sb2"><div className="sv" style={{color:totalErr>0?"#e84040":"#eef2f8"}}>{totalErr}</div><div className="sl">Errors</div></div>
            <div className="sb2"><div className="sv">{totalPO}</div><div className="sl">Putouts</div></div>
            <div className="sb2"><div className="sv">{totalAst}</div><div className="sl">Assists</div></div>
            <div className="sb2"><div className="sv">{totalPO+totalAst>0?((totalPO+totalAst)/(totalPO+totalAst+totalErr)*100).toFixed(1)+"%":"—"}</div><div className="sl">FLD%</div></div>
            <div className="sb2"><div className="sv" style={{color:benchPct>30?"#e84040":"#6b82a0"}}>{benchPct}%</div><div className="sl">Bench</div></div>
          </div>

          {/* Position visual — pie chart + bar */}
          <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:12,flexWrap:"wrap"}}>
            <PieChart size={90} slices={[
              ...posEntries.map(([pos,d])=>({pct:d.innings,color:posColors[pos]||"#6b82a0",label:pos})),
              ...(benchInn>0?[{pct:benchInn,color:"rgba(255,255,255,.15)",label:"Bench"}]:[])
            ]}/>
            <div style={{flex:1,minWidth:120}}>
              <div style={{height:10,borderRadius:5,overflow:"hidden",display:"flex",marginBottom:8}}>
                {posEntries.map(([pos,d])=>(
                  <div key={pos} style={{flex:d.innings/availInn,background:posColors[pos]||"#6b82a0",minWidth:2}}/>
                ))}
                {benchInn>0&&<div style={{flex:benchInn/availInn,background:"rgba(255,255,255,.1)"}}/>}
              </div>
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {posEntries.map(([pos,d])=><span key={pos} style={{fontSize:11,color:posColors[pos]||"#8fa3be",fontWeight:700}}>{pos} {Math.round(d.innings/availInn*100)}%</span>)}
                {benchInn>0&&<span style={{fontSize:11,color:"#6b82a0"}}>Bench {benchPct}%</span>}
              </div>
            </div>
          </div>

          {/* Per-position breakdown with errors */}
          <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:8}}>Position Breakdown</div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {posEntries.map(([pos,d])=>{
              const pct=Math.round(d.innings/availInn*100);
              const isPrimary=pos===(player.position||"");
              const isSecondary=(player.other_positions||[]).includes(pos);
              const errPerNine=d.innings>0?(d.errors/(d.innings/9)).toFixed(2):null;
              return(
                <div key={pos} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 12px",background:d.errors>0?"rgba(232,60,60,.05)":"rgba(255,255,255,.02)",border:"1px solid "+(d.errors>0?"rgba(232,60,60,.2)":isPrimary?"rgba(39,201,122,.15)":"rgba(255,255,255,.07)"),borderRadius:8}}>
                  <div style={{width:32,height:32,borderRadius:8,background:posColors[pos]||"#6b82a0",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:12,color:"#fff",flexShrink:0}}>{pos}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                      <span style={{fontWeight:700,fontSize:13}}>{pos}</span>
                      {isPrimary&&<span style={{background:"rgba(39,201,122,.1)",color:"#27c97a",borderRadius:6,padding:"1px 7px",fontSize:10,fontWeight:700}}>Primary</span>}
                      {isSecondary&&<span style={{background:"rgba(58,155,232,.1)",color:"#3a9be8",borderRadius:6,padding:"1px 7px",fontSize:10,fontWeight:700}}>Secondary</span>}
                    </div>
                    <div style={{fontSize:11,color:"#6b82a0",marginTop:2}}>{fmtInnings(d.innings)} innings · {pct}% of time</div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    {d.errors>0?(
                      <div>
                        <div style={{fontWeight:800,fontSize:16,color:"#e84040"}}>{d.errors} E</div>
                        {errPerNine&&<div style={{fontSize:10,color:"#e84040"}}>{errPerNine}/9 inn</div>}
                      </div>
                    ):(
                      <div style={{fontWeight:700,fontSize:13,color:"#27c97a"}}>0 E</div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>

          {/* Coaching note if errors exist */}
          {totalErr>0&&<div style={{marginTop:10,padding:"9px 12px",background:"rgba(232,60,60,.05)",border:"1px solid rgba(232,60,60,.15)",borderRadius:8,fontSize:11,color:"#c0cce0"}}>
            <span style={{fontWeight:700,color:"#e84040"}}>🚨 {totalErr} total error{totalErr!==1?"s":""}</span>
            {posEntries.filter(([,d])=>d.errors>0).length>0&&<span style={{color:"#8fa3be"}}> — occurring at: {posEntries.filter(([,d])=>d.errors>0).map(([pos,d])=>pos+" ("+d.errors+")").join(", ")}</span>}
            {posEntries.filter(([,d])=>d.errors>0).map(([pos])=>pos).some(pos=>pos===(player.position||""))&&<div style={{marginTop:4,color:"#e8a020"}}>⚠️ Errors at primary position — flag for practice focus.</div>}
          </div>}
        </>}
      </div>

      {/* Game log */}
      <div className="card">
        <div className="ds">Game Log</div>
        {gameLog.length===0&&<div style={{fontSize:12,color:"#6b82a0"}}>No games in this scope.</div>}
        {gameLog.map(function(g,i){
          const lineup=(g.lineup||[]).find(l=>l.athleteId===player.id);
          const imp=(g.imported_fielding||{})[player.id];
          const bs=(g.batting_stats||{})[player.id];
          const wkTeam=teams.find(t=>t.id===g.team_id);
          return(
            <div key={g.id} style={{paddingBottom:10,marginBottom:10,borderBottom:i<gameLog.length-1?"1px solid rgba(255,255,255,.06)":"none"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:3}}>
                <div style={{fontWeight:700,fontSize:13}}>{g.opponent||"Unknown Opp"}</div>
                <div style={{fontSize:11,color:"#6b82a0"}}>{g.game_date||""}{wkTeam?" · "+wkTeam.name:""}</div>
              </div>
              <div style={{display:"flex",gap:12,flexWrap:"wrap",fontSize:11}}>
                {lineup&&<span style={{color:"#6b82a0"}}>Batting #{lineup.position||"?"} · <span style={{color:"#3a9be8"}}>{lineup.position||""}</span></span>}
                {bs&&bs.ab>0&&<span><span style={{color:"#e8a020",fontWeight:700}}>{bs.h}-{bs.ab}</span>{bs.hr>0&&<span style={{color:"#e84040"}}> · {bs.hr} HR</span>}{bs.rbi>0&&<span style={{color:"#8fa3be"}}> · {bs.rbi} RBI</span>}</span>}
                {imp&&imp.Total>0&&<span style={{color:"#6b82a0"}}>{fmtInnings(imp.Total)} inn{imp.e>0&&<span style={{color:"#e84040",fontWeight:700}}> · {imp.e}E</span>}</span>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}





// Mount
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
