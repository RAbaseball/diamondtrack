  const staffById=useMemo(()=>{const m={};(coaches||[]).forEach(c=>m[c.id]=c);if(profile&&!m[profile.id])m[profile.id]=profile;return m;},[coaches,profile]);

  useEffect(()=>{if(!activeTeamId&&teams.length)setActiveTeamId(teams[0].id);},[teams.length]);

  const activeTeam=teams.find(t=>t.id===activeTeamId);
  const activeGame=games.find(g=>g.id===activeGameId);
  const activeGameTeam=activeGame?teams.find(t=>t.id===activeGame.team_id):null;
  const activeGameWeekend=activeGameTeam?weekends.find(w=>w.id===activeGameTeam.weekend_id):null;

  if(activeGame)return<GameDetail game={activeGame} team={activeGameTeam} weekend={activeGameWeekend} athletes={athletes} staffById={staffById} profile={profile} onBack={()=>setActiveGameId(null)} onPatchGame={onPatchGame} onDeleteGame={(id)=>{onDeleteGame(id);setActiveGameId(null);}} onImportStats={handleGameImport}/>;

  return(<>
    <div className="ph"><div className="pt">Diamond <em>Games</em></div>
      <div style={{display:"flex",gap:7}}>
        <button className={`btn ${section==="schedule"?"bg":"bgh"} bsm`} onClick={()=>setSection("schedule")}>Schedule</button>
        <button className={`btn ${section==="weekends"?"bg":"bgh"} bsm`} onClick={()=>setSection("weekends")}>Weekends &amp; Teams</button>
        <button className={`btn ${section==="day"?"bg":"bgh"} bsm`} onClick={()=>setSection("day")}>Day View</button>
      </div>
    </div>

    {section==="weekends"&&(<>
      <div style={{marginBottom:12}}><button className="btn bg bsm" onClick={()=>setModal("addWeekend")}>+ New Weekend</button></div>
      {weekends.length===0&&<div className="empty"><div className="ei">📅</div><div className="et">No weekends yet</div><div className="es">Create one, then add teams under it.</div></div>}
      {weekends.map(wk=>{
        const wkTeams=teams.filter(t=>t.weekend_id===wk.id);
        return(
          <div key={wk.id} className="card" style={{marginBottom:10}}>
            <div className="ph" style={{marginBottom:8}}>
              <div><div style={{fontWeight:700,fontSize:14}}>{wk.name}</div>{(wk.start_date||wk.end_date)&&<div style={{fontSize:10,color:"#6b82a0"}}>{wk.start_date||"?"} – {wk.end_date||"?"}</div>}</div>
              <div style={{display:"flex",gap:6}}>
                <button className="btn bgh bsm" onClick={()=>{setTeamWk(wk.id);setModal("addTeam");}}>+ Team</button>
                <button className="btn bgr bsm" onClick={()=>onDeleteWeekend(wk.id)}>✕</button>
              </div>
            </div>
            {wkTeams.length===0?<div style={{fontSize:12,color:"#6b82a0"}}>No teams yet.</div>:wkTeams.map(t=>(
              <div key={t.id} style={{marginBottom:4}}>
                <div className="ri">
                  {editingTeamId===t.id?(
                    <div style={{flex:1,display:"flex",gap:6,alignItems:"center"}}>
                      <input className="inp" autoFocus value={editTeamName} onChange={e=>setEditTeamName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveRename()} style={{flex:1}}/>
                      <button className="btn bg bsm" onClick={saveRename}>Save</button>
                      <button className="btn bgh bsm" onClick={()=>setEditingTeamId(null)}>Cancel</button>
                    </div>
                  ):(
                    <>
                      <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600}}>{t.name}</div><div style={{fontSize:10,color:"#6b82a0"}}>{(t.athlete_ids||[]).length} players</div></div>
                      <button className="btn bgh bsm" onClick={()=>startRename(t)}>✏️</button>
                    </>
                  )}
                  {editingTeamId!==t.id&&(<>
                    <button className="btn bgh bsm" onClick={()=>{setRosterTeamId(t.id);setModal("roster");}}>Roster</button>
                    <button className="btn bgh bsm" onClick={()=>{setActiveTeamId(t.id);setSection("schedule");}}>Games →</button>
                    <button className="btn bgr bsm" onClick={()=>onDeleteTeam(t.id)}>✕</button>
                  </>)}
                </div>
                {editingTeamId!==t.id&&(
                  <div style={{display:"flex",gap:6,padding:"0 4px 6px"}}>
                    <button className="btn bgh bsm" onClick={()=>setImportTeamId(t.id)}>📊 Import Season Stats</button>
                    {t.season_batting&&Object.keys(t.season_batting).length>0&&(
                      <button className="btn bgh bsm" onClick={()=>setSeasonStatsTeamId(t.id)}>View Season Stats</button>
                    )}
                  </div>
                )}
              </div>
            ))}
          </div>
        );
      })}
    </>)}

    {section==="day"&&(()=>{
      const scopedTeamIds=dayWeekendId==="all"?teams.map(t=>t.id):teams.filter(t=>t.weekend_id===dayWeekendId).map(t=>t.id);
      const scopedGames=games.filter(g=>scopedTeamIds.includes(g.team_id));
      const uniqueDays=[...new Set(scopedGames.map(g=>g.game_date).filter(Boolean))].sort();
      const effectiveDay=(selectedDay&&uniqueDays.includes(selectedDay))?selectedDay:(uniqueDays[0]||null);
      const dayGames=effectiveDay?scopedGames.filter(g=>g.game_date===effectiveDay).sort((a,b)=>(a.game_time||"99:99").localeCompare(b.game_time||"99:99")):[];
      return(<>
        <label className="fg" style={{maxWidth:320,display:"block",marginBottom:12}}>
          <span style={{display:"block",fontSize:11,fontWeight:700,color:"#6b82a0",marginBottom:4}}>Weekend</span>
          <select className="inp" value={dayWeekendId} onChange={e=>{setDayWeekendId(e.target.value);setSelectedDay(null);}}>
            <option value="all">All Weekends</option>
            {weekends.map(w=><option key={w.id} value={w.id}>{w.name}</option>)}
          </select>
        </label>
        {uniqueDays.length===0?(
          <div className="empty"><div className="ei">📅</div><div className="et">No games scheduled</div><div className="es">Add games under Schedule first.</div></div>
        ):(<>
          <div className="fb">
            {uniqueDays.map(d=>(
              <button key={d} className={`fc ${effectiveDay===d?"on":""}`} onClick={()=>setSelectedDay(d)}>
                {new Date(d+"T00:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"})}
              </button>
            ))}
          </div>
          <div style={{marginTop:12}}>
            {dayGames.length===0?(
              <div className="empty"><div className="ei">⚾</div><div className="et">No games this day</div></div>
            ):dayGames.map(g=>{
              const t=teams.find(x=>x.id===g.team_id);
              return(
                <div key={g.id} className="card cc" onClick={()=>{setActiveTeamId(g.team_id);setActiveGameId(g.id);}} style={{marginBottom:8,display:"flex",alignItems:"center",gap:12}}>
                  <div style={{minWidth:70,fontWeight:800,fontSize:13,color:"#e8a020"}}>{g.game_time?fmtTime12(g.game_time):"TBD"}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:13}}>{t?t.name:"Unknown team"} vs {g.opponent||"TBD"} {g.tracking_complete&&<span title="Tracked" style={{color:"#27c97a"}}>✓</span>}</div>
                    <div style={{fontSize:10,color:"#6b82a0"}}>{g.location||"No location set"} · {(g.lineup||[]).length} in lineup</div>
                  </div>
                  {g.assigned_coach_id?(
                    <span className="bdg bg2">{staffById[g.assigned_coach_id]?.name||"Coach"}</span>
                  ):(
                    <span className="bdg bg3">Unclaimed</span>
                  )}
                </div>
              );
            })}
          </div>
        </>)}
      </>);
    })()}

    {section==="schedule"&&(<>
      {teams.length===0?(
        <div className="empty"><div className="ei">🏟️</div><div className="et">No teams yet</div><div className="es">Create a weekend and team first.</div></div>
      ):(<>
        <div className="fb">
          {teams.map(t=>{
            const wk=weekends.find(w=>w.id===t.weekend_id);
            return<button key={t.id} className={`fc ${activeTeamId===t.id?"on":""}`} onClick={()=>setActiveTeamId(t.id)}>{t.name}{wk?` · ${wk.name}`:""}</button>;
          })}
        </div>
        {activeTeam&&(<>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,gap:8}}>
            {editingTeamId===activeTeam.id?(
              <div style={{flex:1,display:"flex",gap:6,alignItems:"center"}}>
                <input className="inp" autoFocus value={editTeamName} onChange={e=>setEditTeamName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveRename()} style={{flex:1}}/>
                <button className="btn bg bsm" onClick={saveRename}>Save</button>
                <button className="btn bgh bsm" onClick={()=>setEditingTeamId(null)}>Cancel</button>
              </div>
            ):(
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <div style={{fontWeight:700,fontSize:15}}>{activeTeam.name}</div>
                <button className="btn bgh bsm" onClick={()=>startRename(activeTeam)}>✏️</button>
              </div>
            )}
            <button className="btn bg bsm" onClick={()=>setShowNewGame(!showNewGame)}>+ New Game</button>
          </div>
          {showNewGame&&(
            <div className="card" style={{marginBottom:12}}>
              <div className="fg"><label>Opponent</label><input className="inp" placeholder="e.g. Riverside Hawks" value={gOpp} onChange={e=>setGOpp(e.target.value)}/></div>
              <div className="fg2"><div className="fg"><label>Date</label><input className="inp" type="date" value={gDate} onChange={e=>setGDate(e.target.value)}/></div><div className="fg"><label>Time</label><input className="inp" type="time" value={gTime} onChange={e=>setGTime(e.target.value)}/></div></div>
              <div className="fg"><label>Location</label><input className="inp" placeholder="e.g. Field 3" value={gLoc} onChange={e=>setGLoc(e.target.value)}/></div>
              <div className="mf" style={{borderTop:"none",paddingTop:0}}>
                <button className="btn bgh bsm" onClick={()=>setShowNewGame(false)}>Cancel</button>
                <button className="btn bg bsm" onClick={async()=>{const g=await onSaveGame(activeTeam.id,{opponent:gOpp,date:gDate,time:gTime,location:gLoc});if(g){setGOpp("");setGDate("");setGTime("");setGLoc("");setShowNewGame(false);setActiveGameId(g.id);}}}>Create Game</button>
              </div>
            </div>
          )}
          {games.filter(g=>g.team_id===activeTeam.id).length===0?(
            <div className="empty"><div className="ei">⚾</div><div className="et">No games yet</div></div>
          ):games.filter(g=>g.team_id===activeTeam.id).sort((a,b)=>(a.game_date||"").localeCompare(b.game_date||"")).map(g=>(
            <div key={g.id} className="card cc" onClick={()=>setActiveGameId(g.id)} style={{marginBottom:8,display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
              <div style={{minWidth:0}}>
                <div style={{fontWeight:700,fontSize:13}}>vs {g.opponent||"TBD"} {g.tracking_complete&&<span title="Game tracked" style={{color:"#27c97a"}}>✓</span>}</div>
                <div style={{fontSize:10,color:"#6b82a0"}}>{g.game_date||"No date"} {g.game_time?`· ${fmtTime12(g.game_time)}`:""} {g.location?`· ${g.location}`:""} · {(g.lineup||[]).length} in lineup</div>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
                <button className="btn bgh bsm" onClick={e=>{e.stopPropagation();setImportGameId(g.id);}} title="Import GameChanger stats for this game">📊</button>
                {g.assigned_coach_id?(
                  <span className="bdg bg2" onClick={e=>{e.stopPropagation();if(g.assigned_coach_id===profile.id)onPatchGame(g.id,{assigned_coach_id:null});}}>{g.assigned_coach_id===profile.id?"Yours · tap to release":(staffById[g.assigned_coach_id]?.name||"Coach")}</span>
                ):(
                  <span className="bdg bg3" onClick={e=>{e.stopPropagation();onPatchGame(g.id,{assigned_coach_id:profile.id});}}>Claim game</span>
                )}
              </div>
            </div>
          ))}
        </>)}
      </>)}
    </>)}

    {modal==="addWeekend"&&(
      <div className="mbg" onClick={()=>setModal(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="mt">New <em>Weekend</em></div>
        <div className="fg"><label>Name</label><input className="inp" placeholder="e.g. June 27–28 — Regional Qualifier" value={wkName} onChange={e=>setWkName(e.target.value)}/></div>
        <div className="fg2"><div className="fg"><label>Start</label><input className="inp" type="date" value={wkStart} onChange={e=>setWkStart(e.target.value)}/></div><div className="fg"><label>End</label><input className="inp" type="date" value={wkEnd} onChange={e=>setWkEnd(e.target.value)}/></div></div>
        <div className="mf"><button className="btn bgh bsm" onClick={()=>setModal(null)}>Cancel</button><button className="btn bg bsm" disabled={!wkName.trim()} onClick={async()=>{const wk=await onSaveWeekend({name:wkName,startDate:wkStart,endDate:wkEnd});if(wk){setWkName("");setWkStart("");setWkEnd("");setModal(null);}}}>Create</button></div>
      </div></div>
    )}

    {modal==="addTeam"&&(
      <div className="mbg" onClick={()=>setModal(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="mt">New <em>Team</em></div>
        <div className="fg"><label>Weekend</label><select className="inp" value={teamWk} onChange={e=>setTeamWk(e.target.value)}><option value="">Select...</option>{weekends.map(w=><option key={w.id} value={w.id}>{w.name}</option>)}</select></div>
        <div className="fg"><label>Team name</label><input className="inp" placeholder="e.g. 12U Black" value={teamName} onChange={e=>setTeamName(e.target.value)}/></div>
        <div className="mf"><button className="btn bgh bsm" onClick={()=>setModal(null)}>Cancel</button><button className="btn bg bsm" disabled={!teamName.trim()||!teamWk} onClick={async()=>{const t=await onSaveTeam(teamWk,teamName);if(t){setTeamName("");setModal(null);setRosterTeamId(t.id);setModal("roster");}}}>Create</button></div>
      </div></div>
    )}

    {modal==="roster"&&rosterTeamId&&(()=>{
      const team=teams.find(t=>t.id===rosterTeamId);
      if(!team)return null;
      const filtered=athletes.filter(a=>(a.name||"").toLowerCase().includes(rosterSearch.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));
      return(
        <div className="mbg" onClick={()=>setModal(null)}><div className="modal" onClick={e=>e.stopPropagation()}>
          <div className="mt">{team.name} <em>Roster</em></div>
          <input className="inp" placeholder="🔍 Search athletes..." value={rosterSearch} onChange={e=>setRosterSearch(e.target.value)} style={{marginBottom:10}}/>
          <div style={{maxHeight:340,overflowY:"auto"}}>
            {filtered.map(a=>{
              const checked=(team.athlete_ids||[]).includes(a.id);
              return(
                <div key={a.id} className="ri" style={{cursor:"pointer"}} onClick={()=>{const ids=checked?team.athlete_ids.filter(x=>x!==a.id):[...(team.athlete_ids||[]),a.id];onUpdateRoster(team.id,ids);}}>
                  <div className="riv">{a.avatar||ini(a.name)}</div>
                  <div style={{flex:1,fontSize:13}}>{a.name}</div>
                  <div style={{width:18,height:18,borderRadius:"50%",background:checked?"#27c97a":"transparent",border:checked?"none":"1.5px solid rgba(255,255,255,.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"#0a0a0a"}}>{checked?"✓":""}</div>
                </div>
              );
            })}
          </div>
          <div className="mf"><button className="btn bg bsm" onClick={()=>setModal(null)}>Done</button></div>
        </div></div>
      );
    })()}

    {importTeamId&&(()=>{
      const team=teams.find(t=>t.id===importTeamId);
      const rosterAthletes=athletes.filter(a=>(team?.athlete_ids||[]).includes(a.id));
      return(
        <ImportStatsModal
          athletes={rosterAthletes}
          onClose={()=>setImportTeamId(null)}
          onConfirm={(matched)=>{onImportTeamStats(importTeamId,matched);setImportTeamId(null);}}
          scopeLabel={`Importing SEASON totals for ${team?.name||"this team"} — this should be a whole-season (or multi-game) export, not filtered to one game. Re-importing later replaces these numbers with the new export's totals.`}
        />
      );
    })()}

    {seasonStatsTeamId&&(()=>{
      const team=teams.find(t=>t.id===seasonStatsTeamId);
      if(!team)return null;
      const battingRows=Object.entries(team.season_batting||{}).map(([aid,b])=>{
        const a=athletes.find(x=>x.id===aid);
        const avg=b.ab>0?(b.h/b.ab):0;
        return{athlete:a,name:a?a.name:"Unknown",b,avg};
      }).filter(r=>r.athlete).sort((a,b)=>b.avg-a.avg);
      const fieldingRows=Object.entries(team.season_fielding||{}).map(([aid,f])=>{
        const a=athletes.find(x=>x.id===aid);
        return{athlete:a,name:a?a.name:"Unknown",f};
      }).filter(r=>r.athlete);
      return(
        <div className="mbg" onClick={()=>setSeasonStatsTeamId(null)}><div className="modal" style={{maxWidth:600}} onClick={e=>e.stopPropagation()}>
          <div className="mt">{team.name} <em>Season Stats</em></div>
          <div style={{fontSize:10,color:"#6b82a0",marginBottom:10}}>Imported from GameChanger — season-cumulative, not broken down by game.</div>
          <div className="ds">Batting</div>
          <div style={{maxHeight:200,overflowY:"auto",marginBottom:14}}>
            <table className="tbl"><thead><tr><th>Player</th><th>AB</th><th>H</th><th>AVG</th><th>HR</th><th>RBI</th></tr></thead>
              <tbody>{battingRows.map(r=>(
                <tr key={r.athlete.id}><td>{r.name}</td><td>{r.b.ab}</td><td>{r.b.h}</td><td>{r.avg.toFixed(3).replace(/^0/,"")}</td><td>{r.b.hr}</td><td>{r.b.rbi}</td></tr>
              ))}</tbody>
            </table>
          </div>
          <div className="ds">Fielding (innings by position)</div>
          <div style={{maxHeight:200,overflowY:"auto"}}>
            <table className="tbl"><thead><tr><th>Player</th><th>P</th><th>C</th><th>1B</th><th>2B</th><th>3B</th><th>SS</th><th>LF</th><th>CF</th><th>RF</th><th>Total</th></tr></thead>
              <tbody>{fieldingRows.map(r=>(
                <tr key={r.athlete.id}><td>{r.name}</td><td>{fmtInnings(r.f.P)}</td><td>{fmtInnings(r.f.C)}</td><td>{fmtInnings(r.f["1B"])}</td><td>{fmtInnings(r.f["2B"])}</td><td>{fmtInnings(r.f["3B"])}</td><td>{fmtInnings(r.f.SS)}</td><td>{fmtInnings(r.f.LF)}</td><td>{fmtInnings(r.f.CF)}</td><td>{fmtInnings(r.f.RF)}</td><td>{fmtInnings(r.f.Total)}</td></tr>
              ))}</tbody>
            </table>
          </div>
          <div className="mf">
            <button
              className="btn bgr bsm"
              onClick={()=>{
                if(window.confirm(`Remove all imported season stats for ${team.name}? This clears the batting and fielding numbers shown here - it won't affect any individual game's lineup or tracking data.`)){
                  onClearTeamStats(team.id);
                  setSeasonStatsTeamId(null);
                }
              }}
            >🗑️ Remove Imported Stats</button>
            <button className="btn bg bsm" onClick={()=>setSeasonStatsTeamId(null)}>Close</button>
          </div>
        </div></div>
      );
    })()}

    {importGameId&&(()=>{
      const g=games.find(x=>x.id===importGameId);
      const t=g?teams.find(x=>x.id===g.team_id):null;
      const rosterAthletes=athletes.filter(a=>(t?.athlete_ids||[]).includes(a.id));
      return(
        <ImportStatsModal
          athletes={[...rosterAthletes,...(g?.guests||[])]}
          onClose={()=>setImportGameId(null)}
          onConfirm={(matched)=>handleGameImport(importGameId,matched)}
          singleGameMode={true}
          scopeLabel={`Importing stats for ${t?t.name:"this team"} vs ${g?.opponent||"TBD"} (${g?.game_date||"no date"}) — export a single-game-filtered CSV from GameChanger.`}
        />
      );
    })()}
  </>);
}

function PrintableLineupCard({game,team,weekend,athletes,staffById}){
  const lineup=game.lineup||[];
  const hasAnyone=lineup.length>0;

  return(
    <div className="print-target" style={{background:"#f6f1e2",color:"#000",border:"3px solid #000",borderRadius:10,padding:"16px 14px",maxWidth:480,margin:"0 auto",fontFamily:"Georgia,'Times New Roman',serif"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
        <img src={BRANDING.logos.iconDark} alt="" style={{height:34,width:"auto",flexShrink:0}}/>
        <div style={{minWidth:0}}>
          <div style={{fontSize:9,fontWeight:700,letterSpacing:1,textTransform:"uppercase",color:"#000"}}>{BRANDING.name}</div>
          <div style={{fontSize:17,fontWeight:900,textTransform:"uppercase",lineHeight:1.1,color:"#000"}}>{team?team.name:"Team"} <span style={{fontWeight:400,fontStyle:"italic"}}>vs</span> {game.opponent||"TBD"}</div>
        </div>
      </div>
      <div style={{fontSize:10.5,color:"#000",marginBottom:10,paddingBottom:8,borderBottom:"2px solid #000"}}>
        {[game.game_date,fmtTime12(game.game_time),game.location?`@ ${game.location}`:""].filter(Boolean).join("  ·  ")||"Date TBD"}
        {weekend?`  ·  ${weekend.name}`:""}
      </div>

      {!hasAnyone?(
        <div style={{textAlign:"center",padding:"18px 0",fontSize:12,color:"#000"}}>No lineup set yet</div>
      ):(
        <div>
          {lineup.map((entry,idx)=>{
            const p=gamePlayers(game,athletes).find(x=>x.id===entry.athleteId);
            return(
              <div key={entry.athleteId} style={{display:"flex",alignItems:"center",gap:10,padding:"5px 0",borderBottom:"1px solid rgba(0,0,0,.2)"}}>
                <div style={{width:20,height:20,borderRadius:"50%",border:"1.5px solid #000",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,flexShrink:0,color:"#000"}}>{idx+1}</div>
                <div style={{flex:1,fontSize:14,fontWeight:700,color:"#000"}}>{p?.name||"Unknown"}{p?.isGuest&&<span style={{fontWeight:600,fontSize:10}}> (Guest)</span>}</div>
                <div style={{fontSize:13,fontWeight:700,color:"#000",minWidth:30,textAlign:"right"}}>{entry.position||"–"}</div>
              </div>
            );
          })}
        </div>
      )}

      {game.pitching&&game.pitching.length>0&&(
        <div style={{marginTop:10,paddingTop:8,borderTop:"2px solid #000"}}>
          <div style={{fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:1,marginBottom:3,color:"#000"}}>Pitching</div>
          {game.pitching.map(p=>{
            const a=gamePlayers(game,athletes).find(x=>x.id===p.athleteId);
            const inn=(p.innings||[]).slice().sort((x,y)=>x-y).join(", ")||"—";
            return(
              <div key={p.id} style={{fontSize:11,marginBottom:2,color:"#000"}}>
                <b>{a?.name||"Unknown"}{a?.isGuest&&" (Guest)"}</b> — Inn {inn}{p.limit?` (max ${p.limit})`:""}{p.note?` — ${p.note}`:""}
              </div>
            );
          })}
        </div>
      )}

      {game.notes&&(
        <div style={{marginTop:10,paddingTop:8,borderTop:"2px solid #000",fontSize:11,color:"#000"}}>
          <b style={{textTransform:"uppercase",letterSpacing:.5,fontSize:10}}>Notes: </b>{game.notes}
        </div>
      )}

      <div style={{marginTop:10,paddingTop:6,display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:9.5,color:"#000"}}>
        <span>{game.assigned_coach_id?`Managing: ${staffById[game.assigned_coach_id]?.name||"Coach"}`:""}</span>
        <span style={{fontWeight:700,letterSpacing:.5}}>{BRANDING.productName}</span>
      </div>
    </div>
  );
}

function ImportStatsModal({athletes,onClose,onConfirm,scopeLabel,singleGameMode}){
  const[rows,setRows]=useState(null);
  const[matches,setMatches]=useState({});
  const[fileName,setFileName]=useState("");
  const[error,setError]=useState("");

  const handleFile=(e)=>{
    const file=e.target.files[0];
    if(!file)return;
    setFileName(file.name);
    setError("");
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const parsed=parseGameChangerCSV(ev.target.result);
        if(parsed.length===0){setError("Couldn't find any player rows in this file. Make sure it's the CSV from GameChanger's Team → Stats → Export Stats.");return;}
        setRows(parsed);
        const initial={};
        parsed.forEach((r,i)=>{initial[i]=bestNameMatch(r.name,athletes);});
        setMatches(initial);
      }catch(err){setError("Couldn't read this file: "+err.message);}
    };
    reader.readAsText(file);
  };

  const confirm=()=>{
    const matched=rows.map((r,i)=>({...r,athleteId:matches[i]})).filter(r=>r.athleteId);
    if(matched.length===0){alert("Match at least one player before importing.");return;}
    onConfirm(matched);
  };

  return(
    <div className="mbg" onClick={onClose}><div className="modal" style={{maxWidth:560}} onClick={e=>e.stopPropagation()}>
      <div className="mt">Import <em>GameChanger</em> Stats</div>
      <div style={{fontSize:11,color:"#6b82a0",marginBottom:14}}>{scopeLabel}</div>
      {!rows?(
        <>
          <input type="file" accept=".csv" onChange={handleFile} className="inp" style={{padding:8}}/>
          {error&&<div style={{fontSize:12,color:"#e84040",marginTop:10}}>{error}</div>}
          <div className="mf" style={{borderTop:"none",paddingTop:14}}><button className="btn bgh bsm" onClick={onClose}>Cancel</button></div>
        </>
      ):(
        <>
          <div style={{fontSize:11,color:"#6b82a0",marginBottom:8}}>{fileName} · {rows.length} player{rows.length===1?"":"s"} found. Match each to your roster — anything left on "Skip" won't be imported.</div>
          {singleGameMode&&rows.some(r=>r.batting.gp>1)&&(
            <div style={{fontSize:11,color:"#e8a020",background:"rgba(232,160,32,.08)",border:"1px solid rgba(232,160,32,.25)",borderRadius:8,padding:"8px 10px",marginBottom:10}}>
              ⚠️ This file looks like it covers more than one game (some players show GP &gt; 1). For accurate per-game stats, export from GameChanger filtered to just this single game before importing here.
            </div>
          )}
          <div style={{maxHeight:360,overflowY:"auto",marginBottom:12}}>
            {rows.map((r,i)=>(
              <div key={i} className="ri" style={{alignItems:"center",gap:8}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:12,fontWeight:600}}>{r.name||"(no name)"}{r.number&&<span style={{color:"#6b82a0",fontWeight:400}}> #{r.number}</span>}</div>
                  <div style={{fontSize:10,color:"#6b82a0"}}>AB {r.batting.ab} · H {r.batting.h} · Fielding {fmtInnings(r.fielding.Total)} inn</div>
                </div>
                <select className="inp" style={{width:170,flexShrink:0}} value={matches[i]||""} onChange={e=>setMatches(m=>({...m,[i]:e.target.value}))}>
                  <option value="">Skip this row</option>
                  {athletes.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
                </select>
              </div>
            ))}
          </div>
          <div className="mf">
            <button className="btn bgh bsm" onClick={onClose}>Cancel</button>
            <button className="btn bg bsm" onClick={confirm}>Import {Object.values(matches).filter(Boolean).length} Player{Object.values(matches).filter(Boolean).length===1?"":"s"}</button>
          </div>
        </>
      )}
    </div></div>
  );
}

function GameSummary({game,athletes}){
  const innCount=game.innings||6;
  const ids=new Set((game.lineup||[]).map(l=>l.athleteId));
  for(let i=1;i<=innCount;i++){Object.values(getChartForInning(game,i)).forEach(id=>{if(id)ids.add(id);});}
  const rows=[...ids].map(id=>({player:gamePlayers(game,athletes).find(p=>p.id===id),stats:computeAthleteGameStats(id,[game])})).filter(r=>r.player).sort((a,b)=>a.player.name.localeCompare(b.player.name));
  if(rows.length===0)return<div style={{fontSize:12,color:"#6b82a0"}}>No lineup or positions logged for this game.</div>;
  return(
    <div>
      {rows.map(r=>{
        const posEntries=Object.entries(r.stats.posCounts).sort((a,b)=>b[1]-a[1]);
        const benchInn=Math.max(0,innCount-r.stats.totalInnings);
        const benchPct=Math.round(benchInn/Math.max(innCount,1)*100);
        return(
          <div key={r.player.id} style={{marginBottom:8,paddingBottom:8,borderBottom:"1px solid rgba(255,255,255,.06)"}}>
            <div style={{fontWeight:700,fontSize:13,marginBottom:2}}>{r.player.name}{r.player.isGuest&&<span style={{color:"#e8a020",fontWeight:600,fontSize:10}}> (Guest)</span>} <span style={{color:"#6b82a0",fontWeight:400,fontSize:11}}>· {r.stats.totalInnings}/{innCount} innings</span></div>
            <div style={{fontSize:11,color:"#8fa3be"}}>
              {posEntries.length>0?posEntries.map(([pos,n])=>`${pos} ${Math.round(n/innCount*100)}%`).join("   ·   "):"No defensive innings"}
              {benchPct>0&&<span>{posEntries.length>0?"   ·   ":""}<span style={{color:"#6b82a0"}}>Bench {benchPct}%</span></span>}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function GameDetail({game,team,weekend,athletes,staffById,profile,onBack,onPatchGame,onDeleteGame,onImportStats}){
  const[currentInning,setCurrentInning]=useState(1);
  const[copied,setCopied]=useState(false);
  const[tracking,setTracking]=useState(false);
  useEffect(()=>{setCurrentInning(1);setTracking(false);},[game.id]);

  const[guestName,setGuestName]=useState("");
  const[showImport,setShowImport]=useState(false);
  const importGameStats=(matchedRows)=>{
    onImportStats(game.id,matchedRows);
    setShowImport(false);
  };
  const rosterIds=team?.athlete_ids||[];
  const guestIds=(game.guests||[]).map(g=>g.id);
  const selectableIds=[...rosterIds,...guestIds];
  const inLineupIds=(game.lineup||[]).map(l=>l.athleteId);
  const available=selectableIds.filter(id=>!inLineupIds.includes(id)).map(id=>gamePlayers(game,athletes).find(p=>p.id===id)).filter(Boolean);

  const addToLineup=(athleteId)=>onPatchGame(game.id,{lineup:[...(game.lineup||[]),{athleteId,position:""}]});
  const addGuestToLineup=()=>{
    const name=guestName.trim();
    if(!name)return;
    const id=`guest_${Date.now().toString(36)}${Math.random().toString(36).slice(2,6)}`;
    onPatchGame(game.id,{
      guests:[...(game.guests||[]),{id,name}],
      lineup:[...(game.lineup||[]),{athleteId:id,position:""}]
    });
    setGuestName("");
  };
  const removeFromLineup=(athleteId)=>onPatchGame(game.id,{lineup:game.lineup.filter(l=>l.athleteId!==athleteId)});
  const setLineupPosition=(athleteId,position)=>onPatchGame(game.id,{lineup:game.lineup.map(l=>l.athleteId===athleteId?{...l,position}:l)});
  const moveLineup=(index,dir)=>{const arr=[...game.lineup];const j=index+dir;if(j<0||j>=arr.length)return;[arr[index],arr[j]]=[arr[j],arr[index]];onPatchGame(game.id,{lineup:arr});};

  const setInnings=(n)=>onPatchGame(game.id,{innings:Math.max(1,Math.min(12,n))});
  const setInningPosition=(inning,pos,athleteId)=>{
    const snapshot={...getChartForInning(game,inning)};
    if(athleteId)snapshot[pos]=athleteId;else delete snapshot[pos];
    onPatchGame(game.id,{field_chart:{...(game.field_chart||{}),[inning]:snapshot}});
  };

  const addPitcher=()=>onPatchGame(game.id,{pitching:[...(game.pitching||[]),{id:Date.now().toString(36),athleteId:"",innings:[],limit:"",note:""}]});
  const updatePitcher=(pid,patch)=>onPatchGame(game.id,{pitching:game.pitching.map(p=>p.id===pid?{...p,...patch}:p)});
  const toggleInning=(pid,inn)=>{const p=game.pitching.find(x=>x.id===pid);const has=p.innings.includes(inn);updatePitcher(pid,{innings:has?p.innings.filter(i=>i!==inn):[...p.innings,inn].sort((a,b)=>a-b)});};
  const removePitcher=(pid)=>onPatchGame(game.id,{pitching:game.pitching.filter(p=>p.id!==pid)});

  const copyText=()=>{
    const text=buildGameText(game,team,weekend,athletes,staffById);
    navigator.clipboard?.writeText(text).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),1800);},()=>{});
  };

  return(
    <div>
      <button className="bb" onClick={onBack}>← {team?team.name:""} Games</button>

      <div className="card" style={{marginBottom:12,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <div style={{fontSize:12,color:"#6b82a0"}}>{game.assigned_coach_id?<>Managing: <strong style={{color:"#eef2f8"}}>{staffById[game.assigned_coach_id]?.name||"Coach"}</strong></>:"Unclaimed"}</div>
        {game.assigned_coach_id===profile.id?(
          <button className="btn bgr bsm" onClick={()=>onPatchGame(game.id,{assigned_coach_id:null})}>Release</button>
        ):(
          <button className="btn bgn bsm" onClick={()=>onPatchGame(game.id,{assigned_coach_id:profile.id})}>{game.assigned_coach_id?"Take over":"I've got this one"}</button>
        )}
      </div>

      <div className="db" style={{marginBottom:14}}>
        <div className="dh"><div className="dl">{team?team.name:"Team"} vs {game.opponent||"TBD"}</div><button className="btn bgr bsm" onClick={()=>onDeleteGame(game.id)}>Delete Game</button></div>
        <div style={{padding:14}}>
          {(!game.lineup||game.lineup.length===0)?(
            <div style={{textAlign:"center",color:"#6b82a0",fontSize:12,padding:"10px 0"}}>No batters added yet</div>
          ):game.lineup.map((entry,i)=>{
            const a=gamePlayers(game,athletes).find(x=>x.id===entry.athleteId);
            return(
              <div key={entry.athleteId} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                <div style={{width:26,height:26,borderRadius:"50%",background:a?.isGuest?"#3a9be8":"#e8a020",color:"#0a0a0a",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:800,flexShrink:0}}>{i+1}</div>
                <div style={{flex:1,fontSize:13,fontWeight:600,minWidth:0}}>{a?.name||"Unknown"}{a?.isGuest&&<span style={{color:"#3a9be8",fontWeight:700,fontSize:10}}> · Guest</span>}</div>
                <select className="inp" style={{width:80,padding:"5px 7px",fontSize:11}} value={entry.position} onChange={e=>setLineupPosition(entry.athleteId,e.target.value)}>
                  <option value="">Pos?</option>{LINEUP_POS.map(p=><option key={p} value={p}>{p}</option>)}
                </select>
                <div style={{display:"flex",flexDirection:"column"}}>
                  <button onClick={()=>moveLineup(i,-1)} disabled={i===0} style={{background:"none",border:"none",color:"#6b82a0",cursor:"pointer",opacity:i===0?.3:1}}>▲</button>
                  <button onClick={()=>moveLineup(i,1)} disabled={i===game.lineup.length-1} style={{background:"none",border:"none",color:"#6b82a0",cursor:"pointer",opacity:i===game.lineup.length-1?.3:1}}>▼</button>
                </div>
                <button onClick={()=>removeFromLineup(entry.athleteId)} style={{background:"none",border:"none",color:"#e84040",cursor:"pointer",fontSize:14}}>✕</button>
              </div>
            );
          })}
        </div>
      </div>

      {available.length>0&&(
        <div className="card" style={{marginBottom:14}}>
          <div className="ds">Add to Lineup</div>
          <div className="fb" style={{marginBottom:0}}>{available.map(a=><button key={a.id} className="fc" onClick={()=>addToLineup(a.id)}>+ {a.name}{a.isGuest?" (Guest)":""}</button>)}</div>
        </div>
      )}
      {rosterIds.length===0&&<div className="card" style={{marginBottom:14}}><div style={{fontSize:12,color:"#6b82a0"}}>This team has no roster yet — add players to it from Weekends &amp; Teams.</div></div>}

      <div className="card" style={{marginBottom:14}}>
        <div className="ds">Pickup Player</div>
        <div style={{fontSize:11,color:"#6b82a0",marginBottom:8}}>For someone filling in just for this game — no RATrack account needed.</div>
        <div style={{display:"flex",gap:8}}>
          <input className="inp" placeholder="Player's name" value={guestName} onChange={e=>setGuestName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addGuestToLineup()} style={{flex:1}}/>
          <button className="btn bg bsm" disabled={!guestName.trim()} onClick={addGuestToLineup}>+ Add to Lineup</button>
        </div>
      </div>

      <div className="card" style={{marginBottom:14}}>
        <div className="ds">Import GameChanger Stats</div>
        <div style={{fontSize:11,color:"#6b82a0",marginBottom:8}}>Export this <b>one game</b> from GameChanger (Filter Stats → just this game → Export Stats), then upload that CSV here. Feeds batting averages by lineup spot. <b>If GameChanger and the lineup disagree on who played where, GameChanger wins</b> — it'll correct positions and add anyone missing from the lineup to match what actually happened.</div>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <button className="btn bgh bsm" onClick={()=>setShowImport(true)}>📊 Import CSV for This Game</button>
          {(game.batting_stats&&Object.keys(game.batting_stats).length>0)&&(<>
            <span className="bdg bg2">✓ Stats imported</span>
            <button
              className="btn bgr bsm"
              onClick={()=>{
                if(window.confirm("Remove the imported GameChanger stats for this game? This clears the batting/fielding numbers and un-marks the game as tracked.\n\nHeads up: it won't automatically undo any lineup or position changes that import made — check the lineup above and fix anything that's wrong by hand."))
                  onPatchGame(game.id,{batting_stats:{},imported_fielding:{},tracking_complete:false});
              }}
            >🗑️ Remove Imported Stats</button>
          </>)}
        </div>
      </div>
      {showImport&&<ImportStatsModal athletes={[...athletes.filter(a=>rosterIds.includes(a.id)),...(game.guests||[])]} onClose={()=>setShowImport(false)} onConfirm={importGameStats} singleGameMode={true} scopeLabel="Importing stats for THIS GAME ONLY - export a single-game-filtered CSV from GameChanger for accurate per-game numbers."/>}

      <div className="card" style={{marginBottom:14,borderColor:game.tracking_complete?"rgba(39,201,122,.3)":undefined}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:tracking?6:0}}>
          <div className="ds" style={{marginBottom:0}}>Game Tracking</div>
          {game.tracking_complete&&!tracking&&<span className="bdg bg2">✓ Tracked</span>}
        </div>

        {!tracking?(
          game.tracking_complete?(
            <>
              <GameSummary game={game} athletes={athletes}/>
              <button className="btn bgh bsm" onClick={()=>setTracking(true)} style={{marginTop:10}}>Re-open Tracking</button>
            </>
          ):(
            <>
              <p style={{fontSize:11,color:"#6b82a0",marginBottom:10}}>Once the game starts, track who's actually playing where, inning by inning. Finish the game to log the position breakdown.</p>
              <button className="btn bg" onClick={()=>setTracking(true)}>🎯 Track Game</button>
            </>
          )
        ):(
          <>
            <div style={{display:"flex",justifyContent:"flex-end",alignItems:"center",gap:8,marginBottom:6}}>
              <span style={{fontSize:10,color:"#6b82a0",textTransform:"uppercase",fontWeight:700}}>Innings</span>
              <button className="btn bgh bsm" onClick={()=>setInnings((game.innings||6)-1)}>−</button>
              <span style={{fontWeight:700,fontSize:13}}>{game.innings||6}</span>
              <button className="btn bgh bsm" onClick={()=>setInnings((game.innings||6)+1)}>+</button>
            </div>
            <div style={{fontSize:11,color:"#6b82a0",marginBottom:10}}>Set who's at each spot as the game goes — it carries forward until you change it again.</div>
            <div style={{display:"flex",gap:5,marginBottom:12,overflowX:"auto",paddingBottom:2}}>
              {Array.from({length:game.innings||6},(_,i)=>i+1).map(inn=>(
                <button key={inn} onClick={()=>setCurrentInning(inn)} style={{flexShrink:0,width:32,height:32,borderRadius:8,border:"none",fontWeight:700,fontSize:13,cursor:"pointer",background:currentInning===inn?"#e8a020":"rgba(255,255,255,.06)",color:currentInning===inn?"#0a0a0a":"#8fa3be"}}>{inn}</button>
              ))}
            </div>
            {selectableIds.length===0?(
              <div style={{fontSize:12,color:"#6b82a0"}}>Add players to this team's roster (or a pickup player below) to set positions.</div>
            ):(()=>{
              const chart=getChartForInning(game,currentInning);
              const assignedIds=new Set(Object.values(chart).filter(Boolean));
              const unassigned=selectableIds.filter(id=>!assignedIds.has(id)).map(id=>gamePlayers(game,athletes).find(p=>p.id===id)).filter(Boolean);
              return(<>
                {unassigned.length>0&&(
                  <div style={{marginBottom:10,padding:"8px 10px",background:"rgba(232,160,32,.06)",border:"1px solid rgba(232,160,32,.2)",borderRadius:8}}>
                    <div style={{fontSize:9,fontWeight:700,textTransform:"uppercase",color:"#e8a020",marginBottom:4}}>Still need a spot — Inn {currentInning}</div>
                    <div style={{fontSize:12,color:"#eef2f8"}}>{unassigned.map(a=>a.name+(a.isGuest?" (Guest)":"")).join(", ")}</div>
                  </div>
                )}
                <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
                  {FIELD_POS.map(pos=>{
                    const value=chart[pos]||"";
                    const options=selectableIds.filter(id=>id===value||!assignedIds.has(id));
                    return(
                      <div key={pos} style={{background:"rgba(255,255,255,.04)",borderRadius:8,padding:8}}>
                        <div style={{fontSize:9,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:4}}>{pos}</div>
                        <select className="inp" style={{fontSize:11,padding:"5px 6px"}} value={value} onChange={e=>setInningPosition(currentInning,pos,e.target.value)}>
                          <option value="">—</option>
                          {options.map(id=>{const a=gamePlayers(game,athletes).find(x=>x.id===id);return a?<option key={id} value={id}>{a.name}{a.isGuest?" (Guest)":""}</option>:null;})}
                        </select>
                      </div>
                    );
                  })}
                </div>
              </>);
            })()}
            <div style={{display:"flex",gap:8,marginTop:14}}>
              <button className="btn bgh bsm" onClick={()=>setTracking(false)}>Pause</button>
              <button className="btn bg" onClick={()=>{onPatchGame(game.id,{tracking_complete:true});setTracking(false);}}>✓ Finish Game</button>
            </div>
          </>
        )}
      </div>

      <div className="card" style={{marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div className="ds" style={{marginBottom:0}}>Pitching Plan</div>
          <button className="btn bgh bsm" onClick={addPitcher}>+ Add Pitcher</button>
        </div>
        {(!game.pitching||game.pitching.length===0)?(
          <div style={{fontSize:12,color:"#6b82a0"}}>No pitchers added yet.</div>
        ):game.pitching.map(p=>(
          <div key={p.id} style={{background:"rgba(255,255,255,.04)",borderRadius:8,padding:10,marginBottom:8}}>
            <div style={{display:"flex",gap:8,marginBottom:8,alignItems:"center"}}>
              <select className="inp" style={{flex:1}} value={p.athleteId} onChange={e=>updatePitcher(p.id,{athleteId:e.target.value})}>
                <option value="">Select pitcher...</option>
                {selectableIds.map(id=>{const a=gamePlayers(game,athletes).find(x=>x.id===id);return a?<option key={id} value={id}>{a.name}{a.isGuest?" (Guest)":""}</option>:null;})}
              </select>
              <button onClick={()=>removePitcher(p.id)} style={{background:"none",border:"none",color:"#e84040",cursor:"pointer",fontSize:14}}>✕</button>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:8}}>
              {GAME_INNINGS.map(inn=>(
                <button key={inn} onClick={()=>toggleInning(p.id,inn)} style={{width:26,height:26,borderRadius:6,border:"none",fontSize:11,fontWeight:700,cursor:"pointer",background:p.innings.includes(inn)?"#3a9be8":"rgba(255,255,255,.06)",color:p.innings.includes(inn)?"#0a0a0a":"#8fa3be"}}>{inn}</button>
              ))}
            </div>
            <div style={{display:"flex",gap:7}}>
              <input className="inp" style={{width:100}} placeholder="Pitch limit" value={p.limit} onChange={e=>updatePitcher(p.id,{limit:e.target.value})}/>
              <input className="inp" placeholder="Note (optional)" value={p.note} onChange={e=>updatePitcher(p.id,{note:e.target.value})}/>
            </div>
          </div>
        ))}
      </div>

      <div className="card" style={{marginBottom:14}}>
        <div className="ds">Game Notes</div>
        <textarea className="inp" rows={2} placeholder="Anything else the coach should know..." value={game.notes||""} onChange={e=>onPatchGame(game.id,{notes:e.target.value})}/>
      </div>

      <div className="card" style={{marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:2}}>
          <div className="ds" style={{marginBottom:0}}>Lineup Card</div>
          <button className="btn bgh bsm" onClick={()=>window.print()}>🖨️ Print</button>
        </div>
        <div style={{fontSize:11,color:"#6b82a0",marginBottom:10}}>Screenshot or print this and send it to whoever's running the game.</div>
        <PrintableLineupCard game={game} team={team} weekend={weekend} athletes={athletes} staffById={staffById}/>
      </div>

      <div className="card">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div className="ds" style={{marginBottom:0}}>Text Message Version</div>
          <button className="btn bg bsm" onClick={copyText}>{copied?"✓ Copied":"📋 Copy Text"}</button>
        </div>
        <pre style={{whiteSpace:"pre-wrap",fontSize:11,background:"rgba(0,0,0,.3)",borderRadius:8,padding:10,fontFamily:"monospace",color:"#8fa3be",lineHeight:1.6}}>{buildGameText(game,team,weekend,athletes,staffById)}</pre>
      </div>
    </div>
  );
}

function CheckInPage({athletes,checkins,programs,profile,onToggleCheckin,onBulkComplete}){
  const[search,setSearch]=useState("");
  const[showBulk,setShowBulk]=useState(false);
  const[selectedProgIds,setSelectedProgIds]=useState([]);
  const[excludedIds,setExcludedIds]=useState([]);
  const[busy,setBusy]=useState(false);

  const today=todayStr();
  const todaysCheckins=checkins.filter(c=>c.check_date===today);
  const checkedInIds=new Set(todaysCheckins.map(c=>c.athlete_id));

  const filtered=athletes.filter(a=>(a.name||"").toLowerCase().includes(search.toLowerCase()));
  const notIn=filtered.filter(a=>!checkedInIds.has(a.id)).sort((a,b)=>a.name.localeCompare(b.name));
  const checkedIn=filtered.filter(a=>checkedInIds.has(a.id)).sort((a,b)=>a.name.localeCompare(b.name));

  const bulkTargets=checkedIn.filter(a=>!excludedIds.includes(a.id));

  const toggleProg=(id)=>setSelectedProgIds(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const toggleExcluded=(id)=>setExcludedIds(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);

  const runBulk=async()=>{
    if(selectedProgIds.length===0){alert("Pick at least one workout first.");return;}
    if(bulkTargets.length===0){alert("No athletes selected.");return;}
    setBusy(true);
    await onBulkComplete(selectedProgIds,bulkTargets.map(a=>a.id));
    setBusy(false);
    setShowBulk(false);
    setSelectedProgIds([]);
    setExcludedIds([]);
  };

  return(
    <div>
      <div className="ph">
        <div className="pt">Facility <em>Check-In</em></div>
        <div style={{fontSize:12,color:"#6b82a0"}}>{new Date().toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div>
      </div>

      <div className="sr">
        <div className="sb2"><div className="sv" style={{color:"#27c97a"}}>{checkedIn.length}</div><div className="sl">Checked In</div></div>
        <div className="sb2"><div className="sv">{notIn.length}</div><div className="sl">Not Yet</div></div>
        <div className="sb2"><div className="sv">{athletes.length}</div><div className="sl">Total Roster</div></div>
      </div>

      <input className="inp" placeholder="🔍 Search athletes..." value={search} onChange={e=>setSearch(e.target.value)} style={{marginBottom:14,maxWidth:400}}/>

      {checkedIn.length>0&&(
        <div style={{marginBottom:14}}>
          <button className="btn bg" onClick={()=>{setShowBulk(!showBulk);setExcludedIds([]);}}>✓ Mark Workouts Complete for {checkedIn.length} Checked-In</button>
        </div>
      )}

      {showBulk&&(
        <div className="card" style={{marginBottom:16,borderColor:"rgba(39,201,122,.3)"}}>
          <div className="ds">Which workouts did they do?</div>
          {programs.length===0?(
            <div style={{fontSize:12,color:"#6b82a0",marginBottom:10}}>No workouts created yet — add one in the Workouts tab first.</div>
          ):(
            <div className="fb">
              {programs.map(p=>(
                <button key={p.id} className={`fc ${selectedProgIds.includes(p.id)?"on":""}`} onClick={()=>toggleProg(p.id)}>{p.name}{(p.isGroup||p.is_group_program)?" · Group":""}</button>
              ))}
            </div>
          )}
          <div className="ds" style={{marginTop:10}}>Applies to ({bulkTargets.length} of {checkedIn.length} checked in)</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:12}}>
            {checkedIn.map(a=>{
              const excluded=excludedIds.includes(a.id);
              return(
                <button key={a.id} onClick={()=>toggleExcluded(a.id)} className="fc" style={{opacity:excluded?.4:1,textDecoration:excluded?"line-through":"none"}}>
                  {a.name}
                </button>
              );
            })}
          </div>
          <div className="mf" style={{borderTop:"none",paddingTop:0}}>
            <button className="btn bgh bsm" onClick={()=>setShowBulk(false)}>Cancel</button>
            <button className="btn bg bsm" onClick={runBulk} disabled={busy||selectedProgIds.length===0}>{busy?"Marking...":`Mark Complete for ${bulkTargets.length}`}</button>
          </div>
        </div>
      )}

      <div className="ds" style={{display:"flex",alignItems:"center",gap:6}}><span style={{color:"#e84040"}}>●</span> Not Checked In ({notIn.length})</div>
      {notIn.length===0?(
        <div className="empty" style={{padding:"16px 0"}}><div className="et">Everyone's checked in 🎉</div></div>
      ):(
        <div className="ag" style={{marginBottom:18}}>
          {notIn.map(a=>(
            <button key={a.id} className="card cc" style={{display:"flex",alignItems:"center",gap:10,textAlign:"left"}} onClick={()=>onToggleCheckin(a.id)}>
              <div className="av">{a.avatar||ini(a.name)}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:13}}>{a.name}</div>
                <div style={{fontSize:10,color:"#6b82a0"}}>{a.position}</div>
              </div>
              <span className="btn bgh bsm">Check In</span>
            </button>
          ))}
        </div>
      )}

      {checkedIn.length>0&&(
        <>
          <div className="ds" style={{display:"flex",alignItems:"center",gap:6}}><span style={{color:"#27c97a"}}>●</span> Checked In ({checkedIn.length})</div>
          <div className="ag">
            {checkedIn.map(a=>(
              <button key={a.id} className="card cc" style={{display:"flex",alignItems:"center",gap:10,textAlign:"left",borderColor:"rgba(39,201,122,.25)"}} onClick={()=>onToggleCheckin(a.id)}>
                <div className="av">{a.avatar||ini(a.name)}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:13}}>{a.name}</div>
                  <div style={{fontSize:10,color:"#6b82a0"}}>{a.position}</div>
                </div>
                <span className="bdg bg2">✓ In</span>
              </button>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function CoachesPage({coaches,programs,athletes,allAthletes,calcPct,onViewAth,onAssignCoach,onRemoveCoach}){
  const[expanded,setExpanded]=useState(null);
  const[showAssign,setShowAssign]=useState(null);
  const[filterChip,setFilterChip]=useState("All");
  const[nameSearch,setNameSearch]=useState("");
  const[selected,setSelected]=useState([]); // selected athlete ids

  const unassigned=allAthletes.filter(a=>!(a.coach_ids||[]).length);

  const assignedTo=(coachId)=>allAthletes.filter(a=>(a.coach_ids||[]).includes(coachId));

  const getFiltered=()=>{
    let list=allAthletes;
    if(filterChip!=="All"){
      list=list.filter(a=>
        a.age_group===filterChip||
        String(a.grad)===String(filterChip)
      );
    }
    if(nameSearch)list=list.filter(a=>(a.name||"").toLowerCase().includes(nameSearch.toLowerCase()));
    return list;
  };

  const filteredList=getFiltered();

  const toggleSelect=(id)=>setSelected(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  const selectAll=()=>setSelected(filteredList.map(a=>a.id));
  const clearAll=()=>setSelected([]);

  const assignSelected=async(coachId)=>{
    for(const id of selected){
      await onAssignCoach(id,coachId);
    }
    setSelected([]);
  };

  const removeSelected=async()=>{
    for(const id of selected){
      await onRemoveCoach(id,null);
    }
    setSelected([]);
  };

  const removeSelectedFromThisCoach=async()=>{
    for(const id of selected){
      await onRemoveCoach(id,showAssign);
    }
    setSelected([]);
  };

  // All available chips: All + age groups + grad years
  const availableAgeGroups=AGE_GROUPS.filter(g=>allAthletes.some(a=>a.age_group===g));
  const availableGrads=GRAD_YEARS.filter(yr=>allAthletes.some(a=>String(a.grad)===String(yr)));

  return(<>
    <div className="pt">Coach <em>Management</em></div>

    {/* Summary */}
    <div className="sr" style={{marginBottom:16}}>
      <div className="sb2"><div className="sv">{coaches.length}</div><div className="sl">Coaches</div></div>
      <div className="sb2"><div className="sv">{allAthletes.length}</div><div className="sl">Total Athletes</div></div>
      <div className="sb2"><div className="sv">{unassigned.length}</div><div className="sl">Unassigned</div></div>
      <div className="sb2"><div className="sv">{programs.length}</div><div className="sl">Total Workouts</div></div>
    </div>

    {/* Unassigned warning */}
    {unassigned.length>0&&<div style={{background:"rgba(232,160,32,.08)",border:"1px solid rgba(232,160,32,.25)",borderRadius:10,padding:"12px 16px",marginBottom:16}}>
      <div style={{fontWeight:700,fontSize:13,color:"#e8a020",marginBottom:6}}>⚠️ {unassigned.length} Unassigned Athlete{unassigned.length!==1?"s":""}</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
        {unassigned.map(a=><div key={a.id} style={{background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.1)",borderRadius:6,padding:"3px 8px",fontSize:11,fontWeight:600}}>{a.name}</div>)}
      </div>
    </div>}

    {/* Global assignment panel */}
    {showAssign&&<div style={{background:"#131313",border:"1px solid rgba(58,155,232,.25)",borderRadius:12,padding:16,marginBottom:16}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <div style={{fontWeight:700,fontSize:14,color:"#3a9be8"}}>Assign Athletes → <span style={{color:"#e8a020"}}>{coaches.find(c=>c.id===showAssign)?.name}</span></div>
        <button className="btn bgh bsm" onClick={()=>{setShowAssign(null);setSelected([]);setFilterChip("All");setNameSearch("");}}>✕ Close</button>
      </div>

      {/* Filter chips */}
      <div style={{overflowX:"auto",marginBottom:10,paddingBottom:4}}>
        <div style={{display:"flex",gap:5,minWidth:"max-content"}}>
          {["All",...availableAgeGroups,...availableGrads.map(y=>String(y))].map(chip=>(
            <button key={chip} onClick={()=>{setFilterChip(chip);setSelected([]);}} style={{padding:"6px 13px",borderRadius:16,border:`2px solid ${filterChip===chip?"#e8a020":"rgba(255,255,255,.12)"}`,background:filterChip===chip?"rgba(232,160,32,.1)":"transparent",color:filterChip===chip?"#e8a020":"#8fa3be",fontSize:12,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>{chip==="All"?"All Athletes":chip}</button>
          ))}
        </div>
      </div>

      {/* Name search */}
      <input className="inp" placeholder="Search by name..." value={nameSearch} onChange={e=>setNameSearch(e.target.value)} style={{marginBottom:8}}/>

      {/* Select all / clear */}
      <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:8,flexWrap:"wrap"}}>
        <span style={{fontSize:11,color:"#6b82a0"}}>{filteredList.length} athletes shown · {selected.length} selected</span>
        <button className="btn bbl bsm" onClick={selectAll}>Select All ({filteredList.length})</button>
        {selected.length>0&&<button className="btn bgh bsm" onClick={clearAll}>Clear</button>}
      </div>

      {/* Athlete list with checkboxes */}
      <div style={{maxHeight:280,overflowY:"auto",display:"flex",flexDirection:"column",gap:4,marginBottom:12}}>
        {filteredList.length===0&&<div style={{fontSize:12,color:"#6b82a0",textAlign:"center",padding:"16px 0"}}>No athletes match this filter</div>}
        {filteredList.map(a=>{
          const isSelected=selected.includes(a.id);
          const currentCoaches=(a.coach_ids||[]).map(cid=>coaches.find(co=>co.id===cid)).filter(Boolean);
          const isAssignedHere=(a.coach_ids||[]).includes(showAssign);
          return(
            <div key={a.id} onClick={()=>toggleSelect(a.id)} style={{display:"flex",alignItems:"center",gap:9,padding:"8px 10px",background:isSelected?"rgba(232,160,32,.08)":"rgba(255,255,255,.02)",border:`1px solid ${isSelected?"rgba(232,160,32,.3)":"rgba(255,255,255,.06)"}`,borderRadius:8,cursor:"pointer",transition:"all .15s"}}>
              {/* Checkbox */}
              <div style={{width:18,height:18,borderRadius:4,border:`2px solid ${isSelected?"#e8a020":"rgba(255,255,255,.2)"}`,background:isSelected?"#e8a020":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                {isSelected&&<span style={{fontSize:11,color:"#0a0a0a",fontWeight:900}}>✓</span>}
              </div>
              <div className="riv" style={{width:26,height:26,fontSize:10,flexShrink:0}}>{a.avatar||ini(a.name)}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:12,fontWeight:600}}>{a.name}</div>
                <div style={{fontSize:10,color:"#6b82a0"}}>{a.position}{a.grad?` · ${a.grad}`:a.age_group?` · ${a.age_group}`:""}</div>
              </div>
              {isAssignedHere
                ?<span className="bdg bg2" style={{flexShrink:0}}>✓ Assigned</span>
                :currentCoaches.length>0
                  ?<span style={{fontSize:9,color:"#e8a020",fontWeight:700,flexShrink:0,textAlign:"right",maxWidth:90}}>{currentCoaches.map(c=>c.name.split(" ")[0]).join(", ")}</span>
                  :<span style={{fontSize:9,color:"#6b82a0",flexShrink:0}}>Unassigned</span>}
            </div>
          );
        })}
      </div>

      {/* Action buttons */}
      {selected.length>0&&<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <button className="btn bg" onClick={()=>assignSelected(showAssign)}>+ Add {selected.length} to {coaches.find(co=>co.id===showAssign)?.name?.split(" ")[0]}</button>
        <button className="btn bgh bsm" onClick={removeSelectedFromThisCoach}>Remove {selected.length} from {coaches.find(co=>co.id===showAssign)?.name?.split(" ")[0]}</button>
        <button className="btn bgr bsm" onClick={removeSelected}>Remove {selected.length} from all coaches</button>
      </div>}
    </div>}

    {/* Coach cards */}
    {coaches.length===0&&<div className="empty"><div className="ei">🛡️</div><div className="et">No coaches yet</div></div>}
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      {coaches.map(coach=>{
        const myAthletes=assignedTo(coach.id);
        const myProgs=programs.filter(p=>p.created_by===coach.id).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
        const open=expanded===coach.id;
        return(
          <div key={coach.id} className="card" style={{borderColor:open?"rgba(232,160,32,.3)":"rgba(255,255,255,.07)"}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:44,height:44,borderRadius:"50%",background:"linear-gradient(135deg,#e8a020,#3a9be8)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:700,color:"#0a0a0a",flexShrink:0,cursor:"pointer"}} onClick={()=>setExpanded(open?null:coach.id)}>{coach.avatar||ini(coach.name)}</div>
              <div style={{flex:1,cursor:"pointer"}} onClick={()=>setExpanded(open?null:coach.id)}>
                <div style={{fontWeight:700,fontSize:15}}>{coach.name}</div>
                <div style={{fontSize:11,color:"#6b82a0"}}>{coach.email}</div>
              </div>
              <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",justifyContent:"flex-end"}}>
                <span className="bdg bg4">{myAthletes.length} athletes</span>
                <span className="bdg bg3">{myProgs.length} workouts</span>
                <button className="btn bg bsm" onClick={()=>{setShowAssign(coach.id);setSelected([]);setFilterChip("All");setNameSearch("");setExpanded(null);}}>+ Assign</button>
                <span style={{fontSize:12,color:"#6b82a0",cursor:"pointer"}} onClick={()=>setExpanded(open?null:coach.id)}>{open?"▲":"▼"}</span>
              </div>
            </div>

            {open&&<div style={{marginTop:14,paddingTop:14,borderTop:"1px solid rgba(255,255,255,.07)"}}>
              <div className="ds">Athletes ({myAthletes.length})</div>
              {myAthletes.length===0&&<div style={{fontSize:12,color:"#6b82a0",fontStyle:"italic",marginBottom:10}}>No athletes assigned</div>}
              <div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:14}}>
                {myAthletes.map(a=>(
                  <div key={a.id} className="ri" style={{cursor:"pointer"}} onClick={()=>onViewAth(a)}>
                    <div className="riv" style={{width:28,height:28,fontSize:10}}>{a.avatar||ini(a.name)}</div>
                    <div style={{flex:1}}><div style={{fontSize:12,fontWeight:600}}>{a.name}</div><div style={{fontSize:10,color:"#6b82a0"}}>{a.position}{a.grad?` · ${a.grad}`:a.age_group?` · ${a.age_group}`:""}</div></div>
                    <button className="btn bgr bsm" onClick={e=>{e.stopPropagation();onRemoveCoach(a.id,coach.id);}}>Remove</button>
                  </div>
                ))}
              </div>
              {myProgs.length>0&&<><div className="ds">Workouts ({myProgs.length})</div>
              <div style={{display:"flex",flexDirection:"column",gap:4}}>
                {myProgs.map(p=><div key={p.id} style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.06)",borderRadius:7,padding:"7px 11px"}}>
                  <div style={{fontWeight:600,fontSize:12}}>{p.name}</div>
                  <div style={{fontSize:10,color:"#6b82a0"}}>{p.week}</div>
                </div>)}
              </div></>}
            </div>}
          </div>
        );
      })}
    </div>
  </>);
}


function AthSelfEdit({athlete,onSave}){
  const[editing,setEditing]=useState(false);
  const[form,setForm]=useState({height:athlete.height||"",weight:athlete.weight||"",bats:athlete.bats||"R",throws:athlete.throws||"R",gpa:athlete.gpa||"",high_school:athlete.high_school||"",dream_school:athlete.dream_school||"",other_positions:athlete.other_positions||""});
  const[saving,setSaving]=useState(false);
  const up=(k,v)=>setForm(p=>({...p,[k]:v}));
  const save=async()=>{setSaving(true);await onSave(form);setSaving(false);setEditing(false);Object.assign(athlete,form);};
  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <div style={{fontSize:14,fontWeight:700,color:"#e8a020",textTransform:"uppercase",letterSpacing:".5px"}}>My Profile</div>
        <button className="btn bgh bsm" onClick={()=>setEditing(!editing)}>{editing?"Cancel":"✏️ Edit"}</button>
      </div>
      {!editing?(
        <div className="card"><div className="sr" style={{marginBottom:0}}>
          {[{l:"Height",v:athlete.height||"—"},{l:"Weight",v:athlete.weight?`${athlete.weight} lbs`:"—"},{l:"Bats/Throws",v:athlete.bats&&athlete.throws?`${athlete.bats}/${athlete.throws}`:"—"},{l:"GPA",v:athlete.gpa||"—"},{l:"High School",v:athlete.high_school||"—"},{l:"Other Positions",v:athlete.other_positions||"—"},{l:"Dream School",v:athlete.dream_school||"—"}].map(i=>(
            <div key={i.l} className="sb2"><div className="sv" style={{fontSize:13,wordBreak:"break-word"}}>{i.v}</div><div className="sl">{i.l}</div></div>
          ))}
        </div></div>
      ):(
        <div className="card">
          <div className="fg2">
            <div className="fg"><label>Height</label><input className="inp" placeholder='6&apos;1"' value={form.height} onChange={e=>up("height",e.target.value)}/></div>
            <div className="fg"><label>Weight (lbs)</label><input className="inp" placeholder="185" value={form.weight} onChange={e=>up("weight",e.target.value)}/></div>
          </div>
          <div className="fg2">
            <div className="fg"><label>Bats</label><select className="inp" value={form.bats} onChange={e=>up("bats",e.target.value)}><option>R</option><option>L</option><option>S</option></select></div>
            <div className="fg"><label>Throws</label><select className="inp" value={form.throws} onChange={e=>up("throws",e.target.value)}><option>R</option><option>L</option></select></div>
          </div>
          <div className="fg"><label>GPA</label><input className="inp" placeholder="3.8" value={form.gpa} onChange={e=>up("gpa",e.target.value)}/></div>
          <div className="fg"><label>High School</label><input className="inp" placeholder="School name" value={form.high_school} onChange={e=>up("high_school",e.target.value)}/></div>
          <div className="fg"><label>Other Positions</label><input className="inp" placeholder="e.g. 1B, OF" value={form.other_positions} onChange={e=>up("other_positions",e.target.value)}/></div>
          <div className="fg"><label>Dream School</label><input className="inp" placeholder="Vanderbilt" value={form.dream_school} onChange={e=>up("dream_school",e.target.value)}/></div>
          <div style={{display:"flex",justifyContent:"flex-end",marginTop:8}}>
            <button className="btn bg bsm" onClick={save} disabled={saving}>{saving?"Saving...":"Save Profile"}</button>
          </div>
        </div>
      )}
    </div>
  );
}


function AthDetailWorkouts({athProgs,athlete,logs,sessions,calcPct,isSaved,getSess}){
  const[viewProg,setViewProg]=useState(null);

  if(viewProg){
    const pct=calcPct(viewProg,athlete.id);
    const sess=getSess(viewProg.id,athlete.id);
    const dur=sess.started_at&&sess.completed_at?Math.round((new Date(sess.completed_at)-new Date(sess.started_at))/60000):null;
    return(
      <div>
        <button className="bb" onClick={()=>setViewProg(null)}>← Workouts</button>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:8}}>
          <div>
            <div style={{fontSize:18,fontWeight:800}}>{viewProg.name}</div>
            <div style={{fontSize:11,color:"#6b82a0"}}>{viewProg.week}</div>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
            {sess.completed_at
              ?<span className="bdg bg2">✓ Completed{dur?` · ${Math.floor(dur/60)?Math.floor(dur/60)+"h ":""}${dur%60}m`:""}</span>
              :sess.started_at
                ?<span className="bdg bg3">In Progress</span>
                :<span className="bdg" style={{background:"rgba(255,255,255,.05)",color:"#6b82a0"}}>Not Started</span>}
            <span className="bdg bg3">{pct}% Done</span>
          </div>
        </div>
        {(viewProg.days||[]).map((day,di)=>(
          <div key={di} style={{marginBottom:16}}>
            <div style={{fontSize:12,fontWeight:700,textTransform:"uppercase",color:"#e8a020",marginBottom:8,paddingBottom:5,borderBottom:"1px solid rgba(255,255,255,.07)"}}>{day.day}</div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {(day.exercises||[]).map(ex=>{
                const saved=isSaved(viewProg.id,ex.id,athlete.id);
                const log=logs[`${viewProg.id}-${athlete.id}-${ex.id}`]||{};
                return(
                  <div key={ex.id} className={`le ${saved?"done":""}`}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
                      <div style={{fontWeight:700,fontSize:13}}>{ex.name}</div>
                      {saved
                        ?<span className="bdg bg2">✓ Logged</span>
                        :<span className="bdg" style={{background:"rgba(255,255,255,.05)",color:"#6b82a0"}}>Pending</span>}
                    </div>
                    <div style={{fontSize:11,color:"#6b82a0",marginBottom:saved&&(log.reps||log.weight)?6:0}}>
                      Prescribed: {ex.sets} sets × {ex.reps} reps{ex.weight?` @ ${ex.weight}`:""}
                    </div>
                    {saved&&(log.reps||log.weight||log.sets)&&(
                      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:5,marginTop:5}}>
                        {[["Reps",log.reps],["Weight",log.weight],["Sets",log.sets]].map(([l,v])=>v?(
                          <div key={l} style={{background:"rgba(255,255,255,.04)",borderRadius:6,padding:"5px 8px"}}>
                            <div style={{fontSize:9,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:1}}>{l}</div>
                            <div style={{fontSize:13,fontWeight:700}}>{v}</div>
                          </div>
                        ):null)}
                      </div>
                    )}
                    {log.notes&&(
                      <div style={{marginTop:6,padding:"5px 8px",background:"rgba(232,160,32,.05)",border:"1px solid rgba(232,160,32,.15)",borderRadius:6,fontSize:11,color:"#8fa3be"}}>
                        <span style={{color:"#e8a020",fontWeight:700}}>Note: </span>{log.notes}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        ))}
      </div>
    );
  }

  return(
    <div className="pl">
      {athProgs.length===0&&<div className="empty"><div className="ei">🏋️</div><div className="et">No workouts assigned</div></div>}
      {athProgs.map(p=>{
        const pct=calcPct(p,athlete.id);
        const sess=getSess(p.id,athlete.id);
        const total=(p.days||[]).flatMap(d=>d.exercises||[]).length;
        const done=(p.days||[]).flatMap(d=>d.exercises||[]).filter(ex=>isSaved(p.id,ex.id,athlete.id)).length;
        return(
          <div key={p.id} className="card cc" onClick={()=>setViewProg(p)} style={{borderColor:pct===100?"rgba(39,201,122,.25)":undefined}}>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
              <div className="pi" style={{background:pct===100?"rgba(39,201,122,.1)":"rgba(232,160,32,.1)"}}>{pct===100?"✅":"🏋️"}</div>
              <div style={{flex:1}}>
                <div className="pn">{p.name}</div>
                <div className="ps">{p.week}{p.isGroup||p.is_group_program?" · Group":""}</div>
              </div>
              <div style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:3}}>
                <span className={`bdg ${pct===100?"bg2":"bg3"}`}>{pct===100?"✓ Done":`${done}/${total}`}</span>
                {sess.completed_at&&<span style={{fontSize:9,color:"#27c97a"}}>Completed</span>}
                {!sess.completed_at&&sess.started_at&&<span style={{fontSize:9,color:"#e8a020"}}>In Progress</span>}
              </div>
            </div>
            <div className="pb"><div className="pf" style={{width:`${pct}%`,background:pct===100?"#27c97a":"linear-gradient(90deg,#e8a020,#f5c060)"}}/></div>
            <div style={{fontSize:10,color:"#6b82a0",marginTop:5,textAlign:"right"}}>Tap to view exercises →</div>
          </div>
        );
      })}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>
</body>
</html>
