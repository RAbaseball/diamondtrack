          {id:"local-4",name:"Team 4",scheduleLabel:"Team 4",ageGroup:"",coachId:"",notes:"",color:"#3a9be8",athleteIds:[]},
          {id:"local-5",name:"Team 5",scheduleLabel:"Team 5",ageGroup:"",coachId:"",notes:"",color:"#9b59b6",athleteIds:[]},
          {id:"local-6",name:"Team 6",scheduleLabel:"Team 6",ageGroup:"",coachId:"",notes:"",color:"#f39c12",athleteIds:[]},
          {id:"local-7",name:"Team 7",scheduleLabel:"Team 7",ageGroup:"",coachId:"",notes:"",color:"#1abc9c",athleteIds:[]},
          {id:"local-8",name:"Team 8",scheduleLabel:"Team 8",ageGroup:"",coachId:"",notes:"",color:"#e67e22",athleteIds:[]},
          {id:"local-9",name:"Team 9",scheduleLabel:"Team 9",ageGroup:"",coachId:"",notes:"",color:"#e91e63",athleteIds:[]},
          {id:"local-10",name:"Team 10",scheduleLabel:"Team 10",ageGroup:"",coachId:"",notes:"",color:"#00bcd4",athleteIds:[]},
          {id:"local-11",name:"Team 11",scheduleLabel:"Team 11",ageGroup:"",coachId:"",notes:"",color:"#8bc34a",athleteIds:[]},
          {id:"local-12",name:"Team 12",scheduleLabel:"Team 12",ageGroup:"",coachId:"",notes:"",color:"#ff5722",athleteIds:[]},
          {id:"local-13",name:"Team 13",scheduleLabel:"Team 13",ageGroup:"",coachId:"",notes:"",color:"#607d8b",athleteIds:[]},
          {id:"local-14",name:"Team 14",scheduleLabel:"Team 14",ageGroup:"",coachId:"",notes:"",color:"#795548",athleteIds:[]},
          {id:"local-15",name:"Team 15",scheduleLabel:"Team 15",ageGroup:"",coachId:"",notes:"",color:"#673ab7",athleteIds:[]},
          {id:"local-16",name:"Team 16",scheduleLabel:"Team 16",ageGroup:"",coachId:"",notes:"",color:"#e84040",athleteIds:[]},
          {id:"local-17",name:"Team 17",scheduleLabel:"Team 17",ageGroup:"",coachId:"",notes:"",color:"#e8a020",athleteIds:[]},
          {id:"local-18",name:"Team 18",scheduleLabel:"Team 18",ageGroup:"",coachId:"",notes:"",color:"#27c97a",athleteIds:[]},
          {id:"local-19",name:"Team 19",scheduleLabel:"Team 19",ageGroup:"",coachId:"",notes:"",color:"#3a9be8",athleteIds:[]},
          {id:"local-20",name:"Team 20",scheduleLabel:"Team 20",ageGroup:"",coachId:"",notes:"",color:"#9b59b6",athleteIds:[]},
        ]);
      }
      const lm={};if(Array.isArray(logAll))logAll.forEach(l=>{lm[`${l.program_id}-${l.athlete_id}-${l.exercise_id}`]=l;});setLogs(lm);
      const sm={};if(Array.isArray(sessAll))sessAll.forEach(s=>{sm[`${s.program_id}-${s.athlete_id}`]=s;});setSessions(sm);
      const mm={};if(Array.isArray(mhAll))mhAll.forEach(m=>{if(!mm[m.athlete_id])mm[m.athlete_id]=[];mm[m.athlete_id].push(m);});setMeasHist(mm);
    }

    if(hasAthleteAccess&&!hasCoachAccess){
      // Pure athlete: only need their own scoped data. (A dual-role person
      // already got the full superset above - logs/sessions/measHist use the
      // same lookup keys either way, and AthPortal filters self_logs down to
      // its own athlete_id at render time, so nothing's missing for them.)
      const[logData,sessData,slData,mhData,athProgData,ckData,gameData]=await Promise.all([
        fetchData(`workout_logs?athlete_id=eq.${profile.id}&select=*&limit=5000`),
        fetchData(`workout_sessions?athlete_id=eq.${profile.id}&select=*&limit=5000`),
        fetchData(`self_logs?athlete_id=eq.${profile.id}&order=created_at.desc&limit=5000`),
        fetchData(`measurable_history?athlete_id=eq.${profile.id}&order=recorded_at.asc&limit=5000`),
        fetchData(`programs?select=*&limit=1000`),
        fetchData(`checkins?athlete_id=eq.${profile.id}&select=*&order=check_date.desc&limit=200`),
        fetchData("games?select=*&limit=5000"),
      ]);
      if(Array.isArray(athProgData))setPrograms(athProgData.map(p=>({...p,days:p.days||[],targetGrads:p.target_grads||[],targetGroups:p.target_groups||[],targetAgeGroups:p.target_age_groups||[],targetAthletes:p.target_athletes||[],athleteId:p.athlete_id,isGroup:p.is_group_program})));
      const lm={};if(Array.isArray(logData))logData.forEach(l=>{lm[`${l.program_id}-${l.athlete_id}-${l.exercise_id}`]=l;});setLogs(lm);
      const sm={};if(Array.isArray(sessData))sessData.forEach(s=>{sm[`${s.program_id}-${s.athlete_id}`]=s;});setSessions(sm);
      if(Array.isArray(slData))setSelfLogs(slData.map(l=>({...l,metrics:l.metrics||{},exercises:l.exercises||[]})));
      if(Array.isArray(mhData))setMeasHist({[profile.id]:mhData});
      if(Array.isArray(ckData))setCheckins(ckData);
      if(Array.isArray(gameData))setGames(gameData.map(g=>({...g,lineup:g.lineup||[],field_chart:g.field_chart||{},pitching:g.pitching||[]})));
    }

    if(isParent){
      const childIds=profile.child_ids||[];
      if(childIds.length>0){
        const idList=childIds.join(",");
        const[childProfiles,progData,logData,sessData,slData,mhData,gameData]=await Promise.all([
          fetchData(`profiles?id=in.(${idList})&select=*`),
          fetchData(`programs?select=*&limit=2000`),
          fetchData(`workout_logs?athlete_id=in.(${idList})&select=*&limit=10000`),

          fetchData(`self_logs?athlete_id=in.(${idList})&order=created_at.desc&limit=5000`),

        ]);

        const lm={};if(Array.isArray(logData))logData.forEach(l=>{lm[`${l.program_id}-${l.athlete_id}-${l.exercise_id}`]=l;});setLogs(lm);
        const sm={};if(Array.isArray(sessData))sessData.forEach(s=>{sm[`${s.program_id}-${s.athlete_id}`]=s;});setSessions(sm);
        if(Array.isArray(slData))setSelfLogs(slData.map(l=>({...l,metrics:l.metrics||{},exercises:l.exercises||[]})));
        const mm={};if(Array.isArray(mhData))mhData.forEach(m=>{if(!mm[m.athlete_id])mm[m.athlete_id]=[];mm[m.athlete_id].push(m);});setMeasHist(mm);
        if(Array.isArray(gameData))setGames(gameData.map(g=>({...g,lineup:g.lineup||[],field_chart:g.field_chart||{},pitching:g.pitching||[]})));
      }
    }
    setDataLoaded(true);
  };

  const getLog=(pId,exId)=>logs[`${pId}-${profile?.id}-${exId}`]||{};
  const isSaved=(pId,exId,aid)=>!!(logs[`${pId}-${aid||profile?.id}-${exId}`]?.saved);
  const calcPct=(prog,aid)=>{if(!prog)return 0;const all=(prog.days||[]).flatMap(d=>d.exercises||[]);if(!all.length)return 0;return Math.round(all.filter(ex=>isSaved(prog.id,ex.id,aid||profile?.id)).length/all.length*100);};
  const getSess=(pId,aid)=>sessions[`${pId}-${aid||profile?.id}`]||{};

  const saveEx=async(pId,exId,field,val,markSaved=false)=>{
    // Don't re-save if already saved
    if(markSaved&&logs[`${pId}-${profile.id}-${exId}`]?.saved)return;
    const now=new Date().toISOString();
    const data={program_id:pId,athlete_id:profile.id,exercise_id:exId,[field]:val};
    if(markSaved){data.saved=true;data.saved_at=now;}
    const sk=`${pId}-${profile.id}`;
    // Start session if not started
    if(!sessions[sk]?.started_at){
      await fetchWithRefresh(`${SURL}/rest/v1/workout_sessions`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({program_id:pId,athlete_id:profile.id,started_at:now})});
      setSessions(p=>({...p,[sk]:{...p[sk],started_at:now,program_id:pId,athlete_id:profile.id}}));
    }
    // Save exercise log
    await fetchWithRefresh(`${SURL}/rest/v1/workout_logs`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"resolution=merge-duplicates"},body:JSON.stringify(data)});
    setLogs(p=>({...p,[`${pId}-${profile.id}-${exId}`]:{...(p[`${pId}-${profile.id}-${exId}`]||{}),...data}}));
  };

  const markComplete=async(pId)=>{
    const sk=`${pId}-${profile.id}`;const sess=sessions[sk]||{};
    if(sess.completed_at)return;
    const now=new Date().toISOString();
    const dur=sess.started_at?Math.round((Date.now()-new Date(sess.started_at))/60000):null;
    // Save session completion using raw fetch for reliability
    const scr=await fetchWithRefresh(`${SURL}/rest/v1/workout_sessions`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"resolution=merge-duplicates"},body:JSON.stringify({program_id:pId,athlete_id:profile.id,completed_at:now,duration_minutes:dur})});
    if(!scr.ok){const t=await scr.text();console.error("Session complete error:",t);}
    setSessions(p=>({...p,[sk]:{...p[sk],completed_at:now,duration_minutes:dur}}));
    // Reload sessions from DB to confirm persisted
    const sr=await fetch(`${SURL}/rest/v1/workout_sessions?athlete_id=eq.${profile.id}&select=*`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    if(sr.ok){const sdata=await sr.json().catch(()=>[]);if(Array.isArray(sdata)){const sm={};sdata.forEach(s=>{sm[`${s.program_id}-${s.athlete_id}`]=s;});setSessions(sm);}}
    // Log to journal
    const prog=programs.find(p=>p.id===pId);
    const allEx=(prog?.days||[]).flatMap(d=>d.exercises||[]);
    const doneEx=allEx.filter(ex=>isSaved(pId,ex.id));
    const journalEntry={
      type:"Workout",
      metrics:{
        program:prog?.name||"",
        exercises:String(doneEx.length),
        duration:dur?String(dur):"",
        week:prog?.week||""
      },
      notes:`Completed: ${prog?.name||"workout"}${dur?" in "+Math.floor(dur/60)+"h "+dur%60+"m":""}.
${doneEx.map(e=>e.name).join(", ")}`,
      date_label:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})
    };
    const jr=await fetch(`${SURL}/rest/v1/self_logs`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify([{athlete_id:profile.id,...journalEntry}])});
    if(jr.ok){
      const newEntry=await jr.json().catch(()=>null);
      if(newEntry&&newEntry[0]){
        setSelfLogs(p=>[{...newEntry[0],metrics:newEntry[0].metrics||{},exercises:[]}, ...p]);
      }

  const bulkCompletePrograms=async(programIds,athleteIds)=>{
    const now=new Date().toISOString();
    const todayLabel=new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
    const progs=programIds.map(id=>programs.find(p=>p.id===id)).filter(Boolean);
    if(progs.length===0||athleteIds.length===0)return;

    for(const prog of progs){
      const allEx=(prog.days||[]).flatMap(d=>d.exercises||[]);
      if(allEx.length===0)continue;
      const logRows=[];
      athleteIds.forEach(aid=>{allEx.forEach(ex=>{logRows.push({program_id:prog.id,athlete_id:aid,exercise_id:ex.id,saved:true,saved_at:now});});});
      const sessionRows=athleteIds.map(aid=>({program_id:prog.id,athlete_id:aid,started_at:now,completed_at:now}));
      const lr=await fetchWithRefresh(`${SURL}/rest/v1/workout_logs`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"resolution=merge-duplicates"},body:JSON.stringify(logRows)});

      if(!sr.ok)console.error("bulk session error:",await sr.text());

    const progNames=progs.map(p=>p.name).join(", ");
    const journalRows=athleteIds.map(aid=>({
      athlete_id:aid,
      type:"Workout",
      metrics:{program:progNames,source:"Facility Check-In"},

    }));

    if(!jr.ok)console.error("bulk journal error:",await jr.text());

    const{data:allCoaches}=await sb.from("profiles").select("id").eq("role","coach");
    if(allCoaches?.length){
      const notifRows=allCoaches.map(co=>({
        recipient_id:co.id,
        type:"completed",
        athlete_id:athleteIds[0],
        athlete_name:`${athleteIds.length} checked-in athlete${athleteIds.length===1?"":"s"}`,
        program_name:progNames,
        read:false
      }));
      await sb.from("notifications").insert(notifRows);
    }

    await loadAll();

  const updateTeamRoster=async(teamId,athleteIds)=>{
    setTeams(p=>p.map(t=>t.id===teamId?{...t,athlete_ids:athleteIds}:t));
    const r=await fetchWithRefresh(`${SURL}/rest/v1/teams?id=eq.${teamId}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`},body:JSON.stringify({athlete_ids:athleteIds})});
    if(!r.ok){alert("Couldn't save roster: "+await r.text());return;}
    // Auto-assign team coaches to every athlete on this roster
    const team=teams.find(function(t){return t.id===teamId;});
    const staff=((team&&team.team_staff)||[]).filter(function(s){return s.role==="head_coach"||s.role==="assistant_coach";});
    if(staff.length>0){
      for(let _ri=0;_ri<athleteIds.length;_ri++){
        const athId=athleteIds[_ri];
        const ath=athletes.find(function(a){return a.id===athId;});
        if(!ath)continue;
        const current=ath.coach_ids||[];
        const staffIds=staff.map(function(s){return s.profile_id;});
        const needsUpdate=staffIds.some(function(id){return !current.includes(id);});
        if(needsUpdate){
          const merged=current.slice();
          staffIds.forEach(function(id){if(!merged.includes(id))merged.push(id);});
          await fetchWithRefresh(SURL+"/rest/v1/profiles?id=eq."+athId,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":"Bearer "+_tok},body:JSON.stringify({coach_ids:merged})});
          setAthletes(function(prev){return prev.map(function(a){return a.id===athId?Object.assign({},a,{coach_ids:merged}):a;});});
        }
      }
    }
  };

    const team=teams.find(t=>t.id===teamId);
    const newBatting={...(team?.season_batting||{})};
    const newFielding={...(team?.season_fielding||{})};
    // Accumulate stats across multiple game imports rather than overwriting
    matchedRows.forEach(r=>{
      const prev=newBatting[r.athleteId]||{};
      const b=r.batting;
      newBatting[r.athleteId]={
        gp:(prev.gp||0)+(b.gp||0),
        pa:(prev.pa||0)+(b.pa||0),
        ab:(prev.ab||0)+(b.ab||0),
        h:(prev.h||0)+(b.h||0),
        b1:(prev.b1||0)+(b.b1||0),
        b2:(prev.b2||0)+(b.b2||0),
        b3:(prev.b3||0)+(b.b3||0),
        hr:(prev.hr||0)+(b.hr||0),
        rbi:(prev.rbi||0)+(b.rbi||0),
        r:(prev.r||0)+(b.r||0),
        bb:(prev.bb||0)+(b.bb||0),
        so:(prev.so||0)+(b.so||0),
        sb:(prev.sb||0)+(b.sb||0),
        hbp:(prev.hbp||0)+(b.hbp||0),
        sf:(prev.sf||0)+(b.sf||0),
        tb:(prev.tb||0)+(b.tb||0),
        qab:(prev.qab||0)+(b.qab||0),
      };
      const prevF=newFielding[r.athleteId]||{};
      const f=r.fielding;
      // Accumulate innings per position and summary stats
      const accPos={};
      FIELD_POS.forEach(pos=>{accPos[pos]=(prevF[pos]||0)+(f[pos]||0);});
      newFielding[r.athleteId]={
        ...accPos,
        Total:(prevF.Total||0)+(f.Total||0),
        e:(prevF.e||0)+(f.e||0),
        po:(prevF.po||0)+(f.po||0),
        assists:(prevF.assists||0)+(f.assists||0),
        tc:(prevF.tc||0)+(f.tc||0),
      };
    });
    setTeams(p=>p.map(t=>t.id===teamId?{...t,season_batting:newBatting,season_fielding:newFielding}:t));
    const r2=await fetchWithRefresh(`${SURL}/rest/v1/teams?id=eq.${teamId}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`},body:JSON.stringify({season_batting:newBatting,season_fielding:newFielding})});
    if(!r2.ok){alert("Couldn't save imported season stats: "+await r2.text());}
  };

    // Plan status — coaches submit for RA review
    if(prog.planStatus)payload.plan_status=prog.planStatus;
    if(prog.reviewNotes!==undefined)payload.review_notes=prog.reviewNotes||null;
    // Try with new columns first; if schema cache error, strip them and retry
    let r=await fetchWithRefresh(`${SURL}/rest/v1/programs`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify([payload])});
    if(!r.ok){
      const errText=await r.text();
      const errObj=JSON.parse(errText||"{}");
      // PGRST204 = column not found in schema cache — strip new cols and retry
      if(errObj.code==="PGRST204"){
        const safePayload={...payload};
        delete safePayload.target_teams;
        delete safePayload.ra_influenced;
        delete safePayload.ra_influence_level;
        r=await fetchWithRefresh(`${SURL}/rest/v1/programs`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify([safePayload])});
        if(!r.ok){const t2=await r.text();alert("Error saving program: "+t2);return;}
      } else {
        alert("Error saving program: "+errText);return;
      }
    }
    const fresh=await fetchWithRefresh(`${SURL}/rest/v1/programs?select=*&limit=5000`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}}).then(r=>r.json()).catch(()=>[]);
    if(Array.isArray(fresh))setPrograms(fresh.map(p=>({...p,days:p.days||[],targetGrads:p.target_grads||[],targetGroups:p.target_groups||[],targetAgeGroups:p.target_age_groups||[],targetAthletes:p.target_athletes||[],targetTeams:p.target_teams||[],athleteId:p.athlete_id,isGroup:p.is_group_program,planType:p.plan_type,raInfluenced:p.ra_influenced||false,raInfluenceLevel:p.ra_influence_level||null,planStatus:p.plan_status||null,reviewNotes:p.review_notes||null})));
    // Notify admins when a coach submits a plan (not when admin saves their own)
    if(!isAdmin&&(prog.planType==="plan"||prog.planType==="team_practice"||prog.planType==="asp")){
      try{
        const{data:admins}=await sb.from("profiles").select("id").eq("role","admin");
        if(admins?.length){
          const planTypeLabel=prog.planType==="asp"?"ASP Session":prog.planType==="team_practice"?"Team Practice":"Practice Plan";
          const notifRows=admins.map(function(a){return{
            recipient_id:a.id,
            type:"plan_submitted",
            athlete_id:profile.id,
            athlete_name:profile.name||profile.email,
            program_name:prog.name||planTypeLabel,
            read:false
          };});
          await sb.from("notifications").insert(notifRows);
        }
      }catch(e){console.log("Notif error:",e);}
    }
  };

  const reviewProgram=async(prog,status,notes)=>{
    const patch={plan_status:status,review_notes:notes||null};
    if(status==="collaborated")Object.assign(patch,{ra_influenced:true,ra_influence_level:"collaborative"});
    const r=await fetchWithRefresh(`${SURL}/rest/v1/programs?id=eq.${prog.id}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`},body:JSON.stringify(patch)});
    if(r.ok){
      setPrograms(p=>p.map(x=>x.id===prog.id?{...x,planStatus:status,reviewNotes:notes||null,raInfluenced:patch.ra_influenced!==undefined?patch.ra_influenced:x.raInfluenced}:x));
      try{if(prog.created_by&&prog.created_by!==profile.id){
        const msg=status==="approved"?"RA Staff approved your practice plan":status==="collaborated"?"RA Staff collaborated on your practice plan":"RA Staff left feedback on your practice plan";
        await sb.from("notifications").insert([{recipient_id:prog.created_by,type:"plan_reviewed",athlete_name:profile.name||"RA Staff",program_name:prog.name||"Plan",read:false}]);
      }}catch(e){}
    }
  };


  const saveAthlete=async(ath)=>{
    const row={email:ath.email||`athlete_${Date.now()}@diamondtrack.local`,name:ath.name,role:"athlete",position:ath.position,other_positions:ath.other_positions||null,grad:ath.grad||null,age_group:ath.age_group||null,gpa:ath.gpa||null,high_school:ath.high_school||null,dream_school:ath.dreamSchool||ath.dream_school||null,height:ath.height||null,weight:ath.weight||null,bats:ath.bats||null,throws:ath.throws||null,committed:ath.committed||false,avatar:ini(ath.name),measurables:ath.measurables||{},coach_ids:ath.coach_ids||[profile.id],jersey_number:ath.jersey_number||null,team_role:ath.team_role||null,is_active:ath.is_active!==false};
    if(ath.id){
      console.log("Saving athlete profile:",ath.id,JSON.stringify(row));
      const r=await fetchWithRefresh(`${SURL}/rest/v1/profiles?id=eq.${ath.id}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify(row)});
      const rtext=await r.text();
      console.log("profile update response:",r.status,rtext);
      if(!r.ok){alert("Profile save failed ("+r.status+"):\n"+rtext);return null;}
      const r2=await fetch(`${SURL}/rest/v1/profiles?id=eq.${ath.id}&select=*`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Accept":"application/vnd.pgrst.object+json"}});
      const fresh=await r2.json().catch(()=>null);
      if(fresh&&fresh.id){setAthletes(p=>p.map(a=>a.id===fresh.id?fresh:a));}
      return fresh||{...ath,...row};
    }else{
      // Sign up athlete with a temporary password so they exist in auth.users
      const tempPw=BRANDING.productName+"_"+Math.random().toString(36).slice(2,10)+"!";
      const email=ath.email||`athlete_${Date.now()}@diamondtrack.local`;
      const redirectTo=encodeURIComponent(window.location.origin+window.location.pathname);
      const r=await fetch(`${SURL}/auth/v1/signup?redirect_to=${redirectTo}`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY},body:JSON.stringify({email,password:tempPw})});
      const authData=await r.json();
      if(!r.ok){
        // If already exists, try to find their profile
        const{data:existing}=await sb.from("profiles").select("*").eq("email",email).maybeSingle();
        if(existing){setAthletes(p=>[...p,existing]);return;}
        alert("Could not create athlete account: "+(authData.message||authData.msg||JSON.stringify(authData)));
        return;
      }
      const uid=authData.user?.id||authData.id;
      if(!uid){alert("No user ID returned from Supabase");return;}
      const{data,error:pe}=await sb.from("profiles").insert({...row,email,id:uid});
      if(pe){const msg=pe.message||pe.hint||pe.code||JSON.stringify(pe);if(msg.includes("age_group")||msg.includes("column")){alert("Missing DB column - run in Supabase SQL Editor: ALTER TABLE profiles ADD COLUMN IF NOT EXISTS age_group text;");}else{alert("Save error: "+msg);}return;}
      if(data)setAthletes(p=>[...p,data]);
      // Also reload full list from server to catch any RLS-filtered results
      sb.from("profiles").select("*").eq("role","athlete").then(({data:all})=>{if(all&&all.length>0)setAthletes(all);});
      alert("\u2705 "+ath.name+" added!\n\nLogin: https://rabaseball.github.io/diamondtrack\nEmail: "+email+"\nTemp password: "+tempPw+"\n\nShare these credentials with the athlete.");
    }
  };

  const saveMeas=async(athId,entry)=>{
    const filtered=Object.fromEntries(Object.entries(entry).filter(([k,v])=>v!==null&&v!==""));
    if(!Object.keys(filtered).length){alert("Enter at least one value first.");return false;}
    const now=new Date().toISOString();
    const payload={athlete_id:athId,...filtered,recorded_by:profile.id,recorded_at:now,date_label:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})};
    console.log("saveMeas payload:",JSON.stringify(payload));
    const r=await fetchWithRefresh(`${SURL}/rest/v1/measurable_history`,{method:"POST",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify([payload])});
    const rtext=await r.text();
    console.log("saveMeas response:",r.status,rtext);
    if(!r.ok){alert("Measurable save failed ("+r.status+"):\n"+rtext);return false;}
    const merged={...(athletes.find(a=>a.id===athId)?.measurables||{}),...filtered};
    const r2=await fetchWithRefresh(`${SURL}/rest/v1/profiles?id=eq.${athId}`,{method:"PATCH",headers:{"Content-Type":"application/json","apikey":SKEY,"Authorization":`Bearer ${_tok}`,"Prefer":"return=representation"},body:JSON.stringify({measurables:merged})});
    const r2text=await r2.text();
    console.log("profile measurables update:",r2.status,r2text);
    if(!r2.ok){alert("Profile measurables update failed ("+r2.status+"):\n"+r2text);return false;}
    setAthletes(p=>p.map(a=>a.id===athId?{...a,measurables:merged}:a));
    const r3=await fetch(`${SURL}/rest/v1/measurable_history?athlete_id=eq.${athId}&order=recorded_at.asc`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    const hist=await r3.json().catch(()=>[]);
    if(Array.isArray(hist))setMeasHist(p=>({...p,[athId]:hist}));
    return true;
  };

  const saveSelfLog=async(entry)=>{
    const{data,error}=await sb.from("self_logs").insert({athlete_id:profile.id,...entry});
    if(error){
      alert("Error saving session ["+(error.code||"?")+"]: "+(error.message||"")+(error.details?" | "+error.details:""));
      return false;
    }
    // Reload self logs from DB
    const{data:all}=await sb.from("self_logs").select("*").eq("athlete_id",profile.id).order("created_at",{ascending:false});
    if(all)setSelfLogs(all.map(l=>({...l,metrics:l.metrics||{},exercises:l.exercises||[]})));
    return true;
  };



  const logout=async()=>{await sb.auth.signOut();setProfile(null);};
  const unreadN=notifs.filter(n=>!n.read).length;

  const athProgs=useMemo(()=>{
    if(!hasAthleteAccess||!profile)return[];
    const PLAN_TYPES=["plan","team_practice","asp","speed"];
    return programs.filter(p=>{
      const pt=p.planType||p.plan_type;
      // Practice plans and ASP sessions go on the team profile, not individual athlete tabs
      if(pt&&PLAN_TYPES.includes(pt))return false;
      // Always include individually assigned workouts
      if(p.athleteId===profile.id||p.athlete_id===profile.id)return true;
      // Only group workouts can match by targeting
      if(!p.isGroup&&!p.is_group_program)return false;
      const g=getPG(profile.position);
      const gradStr=String(profile.grad||"");
      const tg=p.targetGrads||p.target_grads||[];
      const tt=p.targetGroups||p.target_groups||[];
      const ta=p.targetAgeGroups||p.target_age_groups||[];
      const tTeams=p.targetTeams||p.target_teams||[];
      // No targeting = show to nobody
      const hasAnyTarget=tg.length||tt.length||ta.length||tTeams.length;
      if(!hasAnyTarget)return false;
      const gradMatch=tg.length>0&&tg.some(yr=>String(yr)===gradStr);
      const groupMatch=tt.length>0&&tt.includes(g);
      const ageMatch=ta.length>0&&ta.includes(profile.age_group);
      const athTeamIds=(facilityTeams||[]).filter(t=>(t.athleteIds||[]).includes(profile.id)).map(t=>t.id);
      const teamMatch=tTeams.length>0&&tTeams.some(id=>athTeamIds.includes(id));
      return gradMatch||groupMatch||ageMatch||teamMatch;
    }).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
  },[programs,profile?.id,profile?.grad,profile?.position,facilityTeams]);

  const filtAthletes=useMemo(()=>{
    let l=athletes;
    if(gradF){
      // gradF could be a number (grad year) or string (age group like "10U")
      const isNum=typeof gradF==="number"||!isNaN(Number(gradF));
      if(isNum)l=l.filter(a=>a.grad===Number(gradF));
      else l=l.filter(a=>a.age_group===gradF);
    }
    if(groupF)l=l.filter(a=>getPG(a.position)===groupF);
    return l;
  },[athletes,gradF,groupF]);

  if(loading)return<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",color:"#6b82a0",fontSize:15,letterSpacing:1}}>Loading {BRANDING.productName}...</div>;
  if(resetMode)return<><style>{CSS}</style><ResetPasswordScreen onDone={()=>setResetMode(false)}/></>;
  if(!profile)return<><style>{CSS}</style><AuthScreen onAuth={setProfile}/></>;

  const coachBody=()=>{
    if(viewAth&&coachPage==="athletes")return<AthDetail athlete={viewAth} programs={programs} facilityTeams={facilityTeams||[]} logs={logs} sessions={sessions} calcPct={calcPct} getSess={getSess} isSaved={isSaved} onBack={()=>setViewAth(null)} measHist={measHist[viewAth.id]||[]} selfLogs={selfLogs.filter(l=>l.athlete_id===viewAth.id)} onSaveMeas={e=>saveMeas(viewAth.id,e)} onSaveAth={async(ath)=>{const fresh=await saveAthlete(ath);if(fresh)setViewAth(fresh);}} games={games} parents={parents} onLinkParent={linkParentToAthlete} onUnlinkParent={unlinkParentFromAthlete}/>;
    if(buildingProg&&(coachPage==="programs"||coachPage==="plans"))return<WorkoutBuilder type={buildingProg} athletes={athletes} programs={programs} teams={teams||[]} facilityTeams={facilityTeams||[]} onBack={()=>setBuildingProg(null)} onSave={async(prog)=>{await saveProgram(prog);setBuildingProg(null);}}/>;
    if(viewProg&&(coachPage==="programs"||coachPage==="plans"))return<ProgDetail prog={viewProg} athletes={athletes} facilityTeams={facilityTeams||[]} logs={logs} sessions={sessions} calcPct={calcPct} isSaved={isSaved} getSess={getSess} onBack={()=>{setViewProg(null);setOpenProgEditing(false);}} onClickAth={a=>{setViewAth(a);setCoachPage("athletes");}} onUpdate={updateProgram} onCopy={copyProgram} onDelete={deleteProgram} onReview={isAdmin?reviewProgram:null} startEditing={openProgEditing}/>;
    switch(coachPage){
      case"dashboard":return<Dashboard athletes={athletes} programs={programs} facilityTeams={facilityTeams||[]} calcPct={calcPct} setCoachPage={setCoachPage} setViewAth={setViewAth} isAdmin={isAdmin}/>;
      case"games":return<ErrBoundary><GamesPage athletes={athletes} weekends={weekends} teams={teams} games={games} programs={programs} coaches={coaches} profile={profile} onSaveWeekend={saveWeekend} onPatchWeekend={patchWeekend} onDeleteWeekend={deleteWeekend} onSaveTeam={saveTeam} onUpdateTeam={updateTeam} onDeleteTeam={deleteTeam} onRenameTeam={renameTeam} onUpdateRoster={updateTeamRoster} onSaveGame={saveGame} onDeleteGame={deleteGame} onPatchGame={patchGame} onImportTeamStats={importTeamStats} onClearTeamStats={clearTeamStats} onSaveDefensePlan={saveDefensePlan} onSaveBilling={saveBilling} onUpdateAthleteBalance={updateAthleteBalance} setAthletes={setAthletes} isAdmin={isAdmin}/></ErrBoundary>;
      case"checkin":return<CheckInPage athletes={athletes} checkins={checkins} programs={programs} profile={profile} onToggleCheckin={toggleCheckin} onBulkComplete={bulkCompletePrograms}/>;
      case"athletes":return<AthRoster athletes={filtAthletes} allAthletes={athletes} programs={programs} calcPct={calcPct} gradF={gradF} setGradF={setGradF} groupF={groupF} setGroupF={setGroupF} onView={a=>setViewAth(a)} onAdd={()=>setModal("addAth")}/>;
      case"facility":return<ErrBoundary><FacilitySchedulePage athletes={athletes} programs={programs} isAdmin={isAdmin} facilityTeams={facilityTeams} calendarEvents={calendarEvents} setCalendarEvents={setCalendarEvents} blackoutDates={blackoutDates} setBlackoutDates={setBlackoutDates} profile={profile}/></ErrBoundary>;
      case"facilityteams":return<FacilityTeamsPage athletes={athletes} coaches={coaches} facilityTeams={facilityTeams} setFacilityTeams={setFacilityTeams} schedule={DEFAULT_SCHEDULE} profile={profile} isAdmin={isAdmin} onUpdateRoster={updateTeamRoster} programs={programs} dataLoaded={dataLoaded} onViewTeamPlans={(team)=>{setFtPlanTeam(team);setPage("facilityteamplans");}}/>;
      case"facilityteamplans":return<><button className="bb" style={{margin:"12px 16px 0"}} onClick={()=>{setFtPlanTeam(null);setPage("facilityteams");}}>← Back to Teams</button><div style={{padding:"0 16px"}}><TeamPlansPage team={ftPlanTeam||{}} programs={programs||[]} athletes={athletes} onBack={()=>{setFtPlanTeam(null);setPage("facilityteams");}}/></div></>;
      case"drills":return<DrillLibraryPage athletes={athletes} customDrills={customDrills} setCustomDrills={setCustomDrills} profile={profile} isAdmin={isAdmin}/>;
      case"plans":return<>{buildingProg?<WorkoutBuilder type={buildingProg} athletes={athletes} programs={programs} teams={teams||[]} facilityTeams={facilityTeams||[]} onBack={()=>setBuildingProg(null)} onSave={async(prog)=>{await saveProgram(prog);setBuildingProg(null);}}/>:<PlansPage athletes={athletes} programs={programs} facilityTeams={facilityTeams||[]} onSave={saveProgram} onView={(p,edit)=>{setViewProg(p);setOpenProgEditing(!!edit);setCoachPage("plans");}} onUpdate={updateProgram} onDelete={deleteProgram} onCopy={copyProgram} onReview={isAdmin?reviewProgram:null} isAdmin={isAdmin} profile={profile} buildingProg={buildingProg} setBuildingProg={setBuildingProg}/>}</>;
      case"programs":return<ProgsPage athletes={athletes} programs={programs} facilityTeams={facilityTeams||[]} calcPct={calcPct} onView={setViewProg} onAdd={(type)=>setBuildingProg(type||"individual")} onAddGroup={()=>setBuildingProg("group")} onAddPlan={()=>setBuildingProg("plan")} isAdmin={isAdmin} profile={profile}/>;
      case"groups":return<GroupsPage athletes={athletes} onClickAth={a=>{setViewAth(a);setCoachPage("athletes");}}/>;      
      case"coaches":return<CoachesPage coaches={coaches} programs={programs} athletes={athletes} allAthletes={athletes} teams={teams} weekends={weekends} calcPct={calcPct} onViewAth={a=>{setViewAth(a);setCoachPage("athletes");}} onAssignCoach={assignCoachToAthlete} onRemoveCoach={removeCoachFromAthlete} onAssignTeam={assignCoachToTeam} onRemoveTeam={removeCoachFromTeam} onLinkChildAthlete={linkParentToAthlete} onUnlinkChildAthlete={unlinkParentFromAthlete} onAddAthlete={saveAthlete}/>;

      case"notifications":return<NotifPage notifs={notifs} setNotifs={setNotifs} profile={profile}/>;
      default:return null;
    }
  };

  return(
    <><style>{CSS}</style>
    <div className="app">
      <header className="hdr">
        {isCoach&&(viewAth||viewProg)&&<button onClick={()=>{setViewAth(null);setViewProg(null);}} style={{background:"rgba(232,160,32,.15)",border:"1px solid rgba(232,160,32,.3)",borderRadius:7,color:"#e8a020",padding:"5px 12px",cursor:"pointer",fontSize:13,fontWeight:700,marginRight:8}}>← Back</button>}
        {/* "RA"+"Track" is a manual two-tone split of BRANDING.productName for this club's wordmark pun; a future club's product name may not split this neatly. */}
        <div className="hdr-brand" style={{cursor:"pointer",display:"flex",alignItems:"center",gap:8}} title={BRANDING.name} onClick={()=>{setViewAth(null);setViewProg(null);setCoachPage("dashboard");}}>
          <img src={BRANDING.logos.icon} alt="" style={{height:28,width:"auto"}}/>
          <span>RA<em>Track</em></span>
        </div>
        <div className="hdr-right">
          {isCoach&&<>
            <div style={{position:"relative"}}>
              <button className="btn bgh bsm" style={{padding:"6px 9px",position:"relative"}} onClick={()=>setShowNotif(p=>!p)}>
                🔔{unreadN>0&&<span style={{position:"absolute",top:1,right:1,width:14,height:14,borderRadius:"50%",background:"#e84040",color:"#fff",fontSize:8,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{unreadN>9?"9+":unreadN}</span>}
              </button>
              {showNotif&&<NotifPanel notifs={notifs} setNotifs={setNotifs} onClose={()=>setShowNotif(false)} profile={profile}/>}
            </div>

          </>}
          {isDualRole&&(
            <button
              className="btn bgn bsm"
              title="Switch between your athlete and coach views"
              onClick={()=>{setViewMode(effectiveView==="coach"?"athlete":"coach");setViewAth(null);setViewProg(null);}}
            >
              {effectiveView==="coach"?"🏠 View as Athlete":"🛡️ View as Coach"}
            </button>
          )}
          <div className="ubadge">
            <div className="uav">{profile.avatar||ini(profile.name)}</div>
            <div style={{fontSize:12,fontWeight:600}}>{profile.name?.split(" ")[0]}</div>
            <button className="btn bgh bsm" style={{marginLeft:2}} onClick={logout}>↩</button>
          </div>
        </div>
      </header>
      <div className="layout">
        {isCoach&&<aside className="sb">
          {[["dashboard","🏠","Dashboard"],["checkin","✅","Check-In"],["athletes","👤","Athletes"],["games","⚾","Games"],["programs","🏋️","Workouts"],["plans","📋","Practice Plans"],["drills","⚾","Drill Library"],["facility","📅","Facility Schedule"],["facilityteams","👥","Team Profiles"],["groups","🏷️","Groups"],["notifications","🔔","Notifications"],...(isAdmin?[["coaches","🛡️","Coaches"]]:[])]  .map(([id,ic,lb])=>(
            <button key={id} className={`sbn ${coachPage===id&&!viewAth&&!viewProg?"on":""}`} onClick={()=>{setCoachPage(id);setViewAth(null);setViewProg(null);}}>
              <span>{ic}</span><span>{lb}</span>
            </button>
          ))}
        </aside>}
        <main className="body">
          {isCoach&&coachBody()}
          {isAthlete&&(workoutView
            ?<WorkoutLogger prog={workoutView} athlete={profile} getLog={getLog} updateLog={(p,e,f,v)=>saveEx(p,e,f,v)} saveEx={(p,e)=>saveEx(p,e,"saved",true,true)} markComplete={markComplete} calcPct={calcPct} onBack={()=>setWorkoutView(null)} getSess={getSess} reloadLogs={async(pId)=>{
    const r=await fetch(`${SURL}/rest/v1/workout_logs?athlete_id=eq.${profile.id}&program_id=eq.${pId}&select=*`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    if(r.ok){const data=await r.json().catch(()=>[]);if(Array.isArray(data)){const lm={...logs};data.forEach(l=>{lm[`${l.program_id}-${l.athlete_id}-${l.exercise_id}`]=l;});setLogs(lm);}}
    const sr=await fetch(`${SURL}/rest/v1/workout_sessions?athlete_id=eq.${profile.id}&program_id=eq.${pId}&select=*`,{headers:{"apikey":SKEY,"Authorization":`Bearer ${_tok}`}});
    if(sr.ok){const sdata=await sr.json().catch(()=>[]);if(Array.isArray(sdata)){const sm={...sessions};sdata.forEach(s=>{sm[`${s.program_id}-${s.athlete_id}`]=s;});setSessions(sm);}}
  }}/>
            :<AthPortal athlete={profile} programs={athProgs} isSaved={isSaved} calcPct={calcPct} setWorkoutView={setWorkoutView} measHist={measHist[profile.id]||[]} selfLogs={selfLogs} onSaveSelfLog={saveSelfLog} facilityTeams={facilityTeams} calendarEvents={calendarEvents} profile={profile} checkins={checkins} onToggleCheckin={()=>toggleCheckin(profile.id)} games={games}/>
          )}
          {isParent&&<ParentPortal parent={profile} childAthletes={myChildren} programs={programs} calcPct={calcPct} selfLogs={selfLogs} measHist={measHist} games={games}/>}
        </main>
      </div>
      {modal==="addPlan"&&<PracticePlanModal athletes={athletes} onClose={()=>setModal(null)} onSave={async(prog)=>{await saveProgram(prog);setModal(null);}}/> }
      {modal==="addAth"&&<AddAthModal onClose={()=>setModal(null)} onSave={a=>{saveAthlete(a);setModal(null);}}/>}
      {modal==="addProg"&&<AddProgModal athletes={athletes} onClose={()=>setModal(null)} onSave={p=>{saveProgram(p);setModal(null);}}/>}
      {modal==="addGroup"&&<AddGroupModal athletes={athletes} onClose={()=>setModal(null)} onSave={p=>{saveProgram(p);setModal(null);}}/>}
      {isCoach&&<MobileNav coachPage={coachPage} setCoachPage={setCoachPage} setViewAth={setViewAth} setViewProg={setViewProg} isAdmin={isAdmin}/>}
    </div></>
  );
}

function AthRoster({athletes,allAthletes,programs,calcPct,gradF,setGradF,groupF,setGroupF,onView,onAdd}){
  const[search,setSearch]=useState("");
  const gyrs=[...new Set((allAthletes||athletes).map(a=>a.grad))].filter(Boolean).sort();
  const pgs=[...new Set((allAthletes||athletes).map(a=>getPG(a.position)))];
  const displayed=search?athletes.filter(a=>
    (a.name||"").toLowerCase().includes(search.toLowerCase())||
    (a.position||"").toLowerCase().includes(search.toLowerCase())||
    (a.high_school||"").toLowerCase().includes(search.toLowerCase())||
    (a.email||"").toLowerCase().includes(search.toLowerCase())

      <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginRight:3}}>Class/Age:</span>

      {gyrs.map(yr=><button key={yr} className={`fc ${gradF===yr?"on":""}`} onClick={()=>setGradF(yr)}><span className="dot" style={{background:grColor[yr]||"#888"}}/>{yr}</button>)}
      {AGE_GROUPS.filter(g=>(allAthletes||athletes).some(a=>a.age_group===g)).map(g=><button key={g} className={`fc ${gradF===g?"on":""}`} onClick={()=>setGradF(g)}><span className="dot" style={{background:"#3a9be8"}}/>{g}</button>)}
      <div style={{width:1,height:16,background:"rgba(255,255,255,.1)",margin:"0 4px"}}/>
      <span style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginRight:3}}>Group:</span>

        const prog=programs.find(p=>p.athleteId===a.id);const pct=prog?calcPct(prog):0;const g=getPG(a.position);

          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
            <span className="tag" style={{background:`${gColor[g]}20`,color:gColor[g],border:`1px solid ${gColor[g]}40`}}>{g}</span>
            {a.grad&&<span className="tag" style={{background:`${grColor[a.grad]||"#555"}20`,color:grColor[a.grad]||"#aaa",border:`1px solid ${grColor[a.grad]||"#555"}40`}}>'{String(a.grad).slice(2)}</span>}
            {!a.grad&&a.age_group&&<span className="tag" style={{background:"rgba(58,155,232,.15)",color:"#3a9be8",border:"1px solid rgba(58,155,232,.3)"}}>{a.age_group}</span>}
            {a.committed&&<span className="bdg bg2">✓ Committed</span>}

          </div>

}


function AthDetail({athlete:athleteProp,programs,facilityTeams,logs,sessions,calcPct,getSess,isSaved,onBack,measHist,selfLogs=[],onSaveMeas,onSaveAth,games=[],parents=[],onLinkParent,onUnlinkParent,onViewProg}){

  const[tab,setTab]=useState("profile");

  const[addMeas,setAddMeas]=useState(false);

  const athProgs=programs.filter(p=>{
    const _pt=p.planType||p.plan_type;
    if(_pt&&["plan","team_practice","asp","speed"].includes(_pt))return false;
    if(p.athleteId===athlete.id||p.athlete_id===athlete.id)return true;
    if(!p.isGroup&&!p.is_group_program)return false;
    const g=getPG(athlete.position);
    const tg=p.targetGrads||p.target_grads||[];
    const tt=p.targetGroups||p.target_groups||[];
    const ta=p.targetAgeGroups||p.target_age_groups||[];
    const tTeams=p.targetTeams||p.target_teams||[];
    // No targeting = show to nobody (unfinished/untagged plan)
    const hasAnyTarget=tg.length||tt.length||ta.length||tTeams.length;
    if(!hasAnyTarget)return false;
    const gradStr=String(athlete.grad||"");
    const gradMatch=tg.length>0&&tg.some(yr=>String(yr)===gradStr);
    const groupMatch=tt.length>0&&tt.includes(g);
    const ageMatch=ta.length>0&&ta.includes(athlete.age_group);
    const athTeamIds=(facilityTeams||[]).filter(t=>(t.athleteIds||[]).includes(athlete.id)).map(t=>t.id);
    const teamMatch=tTeams.length>0&&tTeams.some(id=>athTeamIds.includes(id));
    return gradMatch||groupMatch||ageMatch||teamMatch;
  }).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));

            await onSaveAth(updated);

        </button>

    </div>
    <div style={{display:"flex",gap:2,borderBottom:"1px solid rgba(255,255,255,.07)",marginBottom:14}}>

      <div className="card" style={{marginBottom:14}}>

function computeBadges(logs){
  const badges=[];
  const count=logs.length;
  [[1,"🌱","First Log"],[10,"🔥","10 Logged"],[25,"💪","25 Logged"],[50,"🏆","50 Logged"],[100,"👑","Century Club"]].forEach(([n,icon,label])=>{
    if(count>=n)badges.push({icon,label});
  });
  const types=new Set(logs.map(l=>l.type));
  if(types.size>=4)badges.push({icon:"🌟",label:"Well-Rounded"});
  if(types.has("Game"))badges.push({icon:"🏟️",label:"Gamer"});
  if(types.has("Showcase"))badges.push({icon:"⭐",label:"Showcase Ready"});
  const days=[...new Set(logs.map(l=>(l.created_at||"").slice(0,10)).filter(Boolean))].sort().reverse();
  let streak=days.length?1:0;
  for(let i=1;i<days.length;i++){
    const diff=Math.round((new Date(days[i-1])-new Date(days[i]))/86400000);
    if(diff===1)streak++;else break;
  }
  if(streak>=3)badges.push({icon:"⚡",label:`${streak}-Day Streak`});
  if(streak>=7)badges.push({icon:"🔥",label:"Iron Will"});
  return badges;
}

function BadgeShelf({logs=[],compact=false}){
  const badges=computeBadges(logs||[]);
  if(badges.length===0){
    if(compact)return null;
    return<div className="empty"><div className="ei">🏅</div><div className="et">No badges yet</div><div className="es">Log a session to start earning them.</div></div>;
  }
  if(compact){
    return(
      <div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:4}}>
        {badges.slice(0,4).map(b=>(<span key={b.label} title={b.label} style={{fontSize:14,background:"rgba(232,160,32,.12)",borderRadius:6,padding:"2px 6px"}}>{b.icon}</span>))}
        {badges.length>4&&<span style={{fontSize:10,color:"#6b82a0",alignSelf:"center"}}>+{badges.length-4}</span>}
      </div>
    );
  }
  return(
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(110px,1fr))",gap:10}}>
      {badges.map(b=>(
        <div key={b.label} className="card" style={{textAlign:"center",padding:"14px 8px"}}>
          <div style={{fontSize:28,marginBottom:4}}>{b.icon}</div>
          <div style={{fontSize:11,fontWeight:700}}>{b.label}</div>
        </div>
      ))}
    </div>
  );
}

function inGameRange(dateStr,range){
  if(range==="all")return true;
  if(!dateStr)return false;
  const d=new Date(dateStr+"T00:00:00");
  const now=new Date();
  if(range==="week"){const cutoff=new Date(now);cutoff.setDate(now.getDate()-7);return d>=cutoff&&d<=now;}
  if(range==="month"){const cutoff=new Date(now);cutoff.setDate(now.getDate()-30);return d>=cutoff&&d<=now;}
  return true;
}

function matchProgramsForAthlete(programs,athlete){
  return programs.filter(p=>{
    if(p.athleteId===athlete.id)return true;
    if(!p.isGroup)return false;
    // Specific athlete override
    const ta2=p.targetAthletes||p.target_athletes||[];
    if(ta2.length>0)return ta2.includes(athlete.id);
    const g=getPG(athlete.position);
    const tg=p.targetGrads||p.target_grads||[];
    const tt=p.targetGroups||p.target_groups||[];
    const ta=p.targetAgeGroups||p.target_age_groups||[];
    const gradStr=String(athlete.grad);
    const gradMatch=!tg.length||tg.some(yr=>String(yr)===gradStr);
    const ageMatch=!ta.length||ta.includes(athlete.age_group);
    const groupMatch=!tt.length||tt.includes(g);
    // If no targeting set on a group/plan program, only show to everyone IF it's a broadcast
    // (no grads, no ages, no groups = intentional broadcast)
    const hasTargeting=tg.length||ta.length||tt.length;
    if(!hasTargeting)return true; // explicit broadcast
    const classMatch=(tg.length||ta.length)?(gradMatch||ageMatch):true;
    return classMatch&&groupMatch;
  }).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));
}

                    {errTotals[pos]>0&&<div style={{fontSize:10,color:"#e84040",marginTop:2,fontWeight:700}}>{errTotals[pos]}E</div>}
                  </div>);
                })}
              </div>
            </div>
            {/* Summary stats row */}
            <div className="sr">
              <div className="sb2"><div className="sv">{fmtInnings(totals.Total||0)}</div><div className="sl">Total Inn.</div></div>
              <div className="sb2"><div className="sv" style={{color:totalErr>0?"#e84040":"#eef2f8"}}>{totalErr}</div><div className="sl">Total Errors</div></div>
              {totalPO>0&&<div className="sb2"><div className="sv">{totalPO}</div><div className="sl">Putouts</div></div>}
              {totalAst>0&&<div className="sb2"><div className="sv">{totalAst}</div><div className="sl">Assists</div></div>}
              {totalPO+totalAst>0&&<div className="sb2"><div className="sv">{totalErr>0?((totalPO+totalAst)/(totalPO+totalAst+totalErr)*100).toFixed(1)+"%":"100%"}</div><div className="sl">Fielding %</div></div>}
            </div>
            {/* Total errors */}
            {totalErr>0&&<div style={{marginTop:12,padding:"10px 12px",background:"rgba(232,60,60,.05)",border:"1px solid rgba(232,60,60,.15)",borderRadius:8}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:11,fontWeight:700,color:"#e84040"}}>🚨 {totalErr} Error{totalErr!==1?"s":""} this period</span>
                <span style={{fontSize:11,color:"#6b82a0"}}>at positions: {posPlayed.filter(p=>totals[p]>0).join(", ")||"—"}</span>
              </div>
              {totalErr>1&&<div style={{marginTop:4,fontSize:10,color:"#6b82a0"}}>Review throwing, footwork, and fielding mechanics at positions played most.</div>}
            </div>}
          </div>
        </div>);
      })()}
      <div className="ds" style={{marginTop:14}}>Game Log</div>
      <div className="card" style={{padding:0,overflow:"hidden"}}>
        <table className="tbl"><thead><tr><th>Date</th><th>Opponent</th><th>Slot</th><th>Position</th></tr></thead>
        <tbody>{stats.appearances.slice().reverse().map(a=>(
          <tr key={a.game.id}><td>{a.game.game_date||"—"}</td><td>{a.game.opponent||"TBD"}</td><td>{a.slot?`#${a.slot}`:"Bench"}</td><td>{a.position||"—"}</td></tr>
        ))}</tbody>
        </table>
      </div>
      </>)}
    </div>
  );
}

function ProgDetail({prog,athletes,facilityTeams,logs,sessions,calcPct,isSaved,getSess,onBack,onClickAth,onUpdate,onCopy,onDelete,onReview,startEditing}){
  const[viewAth,setViewAth]=useState(null);
  const[editing,setEditing]=useState(!!startEditing);
  const[editName,setEditName]=useState(prog.name);
  const[editWeek,setEditWeek]=useState(prog.week||"");
  const[editDays,setEditDays]=useState(prog.days||[]);
  const[editTeams,setEditTeams]=useState(prog.targetTeams||prog.target_teams||[]);
  const[editNote,setEditNote]=useState(prog.planNotes||prog.plan_notes||"");
  const[editLocation,setEditLocation]=useState(prog.location||"");
  const[editDuration,setEditDuration]=useState(prog.duration||"");
  const[activeDay,setActiveDay]=useState(0);
  const[showPicker,setShowPicker]=useState(false);
  const[saving,setSaving]=useState(false);
  const[reviewNote,setReviewNote]=useState(prog.reviewNotes||"");
  const ath=athletes.find(a=>a.id===prog.athleteId);

  const updEx=(di,ei,k,v)=>{const u=[...editDays];u[di].exercises[ei][k]=v;setEditDays(u);};
  const remEx=(di,ei)=>{const u=[...editDays];u[di].exercises.splice(ei,1);setEditDays(u);};
  const addBlank=()=>{const u=[...editDays];u[activeDay].exercises.push({id:`e${Date.now()}`,name:"",sets:3,reps:10,weight:"",notes:""});setEditDays(u);};
  const addDay=()=>{const used=editDays.map(d=>d.day);const next=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].find(d=>!used.includes(d));if(next)setEditDays([...editDays,{day:next,exercises:[]}]);};
  const remDay=(i)=>{const u=[...editDays];u.splice(i,1);setEditDays(u);if(activeDay>=u.length)setActiveDay(Math.max(0,u.length-1));};
  const addEx=(ex)=>{const u=[...editDays];if(!u[activeDay])return;u[activeDay].exercises.push({id:`e${Date.now()}`,name:ex.name,sets:ex.sets,reps:ex.reps,weight:ex.wt||"",notes:""});setEditDays(u);setShowPicker(false);};
  const saveEdits=async()=>{setSaving(true);await onUpdate({...prog,name:editName,week:editWeek,days:editDays.filter(d=>d.exercises.length>0),targetTeams:editTeams,planNotes:editNote,location:editLocation,duration:editDuration});setSaving(false);setEditing(false);};
  const PLAN_TYPES_PD=["plan","team_practice","asp","speed"];
  const ptPD=prog.planType||prog.plan_type;
  // Plan types don't show an athlete list — they're team-based
  const assigned=ptPD&&PLAN_TYPES_PD.includes(ptPD)?[]:prog.isGroup?athletes.filter(a=>{
    const g=getPG(a.position);
    const tg=prog.targetGrads||[];const tt=prog.targetGroups||[];const ta=prog.targetAgeGroups||[];const tTeams=prog.targetTeams||[];
    const hasAnyTarget=tg.length||tt.length||ta.length||tTeams.length;
    if(!hasAnyTarget)return false;
    const gradMatch=tg.length>0&&tg.some(yr=>parseInt(yr)===parseInt(a.grad));
    const groupMatch=tt.length>0&&tt.includes(g);
    const ageMatch=ta.length>0&&ta.includes(a.age_group);
    return gradMatch||groupMatch||ageMatch;

function MsgsPage({profile,athletes,messages,sendMsg,chatPartner,setChatPartner}){
  const[showBC,setShowBC]=useState(false);
  const[bcTxt,setBcTxt]=useState("");
  const[bcGrads,setBcGrads]=useState([]);
  const[bcGroups,setBcGroups]=useState([]);
  const[chatTxt,setChatTxt]=useState("");
  const bottomRef=useRef(null);
  useEffect(()=>{bottomRef.current?.scrollIntoView({behavior:"smooth"});},[messages.length,chatPartner]);
  const convo=chatPartner?messages.filter(m=>(m.sender_id===profile.id&&m.recipient_id===chatPartner.id)||(m.sender_id===chatPartner.id&&m.recipient_id===profile.id)):[];
  const tc=athletes.filter(a=>{const g=getPG(a.position);return(!bcGrads.length||bcGrads.includes(a.grad))&&(!bcGroups.length||bcGroups.includes(g));}).length;
  const sendDirect=async()=>{if(!chatTxt.trim()||!chatPartner)return;await sendMsg(chatTxt.trim(),chatPartner.id);setChatTxt("");};
  const sendBC=async()=>{if(!bcTxt.trim())return;await sendMsg(bcTxt.trim(),null,true,bcGrads,bcGroups);setBcTxt("");setShowBC(false);};

  if(chatPartner)return(<>
    <button className="bb" onClick={()=>setChatPartner(null)}>← Messages</button>
    <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:14}}>
      <div className="av" style={{width:34,height:34,fontSize:12}}>{chatPartner.avatar||ini(chatPartner.name)}</div>
      <div><div style={{fontWeight:700}}>{chatPartner.name}</div><div style={{fontSize:10,color:"#6b82a0"}}>{chatPartner.position}·{chatPartner.grad}</div></div>
    </div>
    <div className="card" style={{padding:0,overflow:"hidden",display:"flex",flexDirection:"column",height:"calc(100vh - 280px)"}}>
      <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column",gap:8,padding:14}}>
        {convo.length===0&&<div className="empty" style={{padding:"16px 0"}}><div className="ei">💬</div><div className="et" style={{fontSize:13}}>No messages yet</div></div>}
        {convo.map(m=>{const mine=m.sender_id===profile.id;return(<div key={m.id} className={`msgrow ${mine?"me":"them"}`}><div className={`msgbub ${mine?"me":"them"}`}>{m.content}</div><div className="msgt">{fmtT(m.created_at)}</div></div>);})}
        <div ref={bottomRef}/>
      </div>
      <div className="hc">
        <input className="inp" style={{flex:1}} placeholder={`Message ${chatPartner.name.split(" ")[0]}...`} value={chatTxt} onChange={e=>setChatTxt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&sendDirect()}/>
        <button className="btn bg bsm" onClick={sendDirect}>Send</button>
      </div>
    </div>
  </>);

  return(<>
    <div className="ph"><div className="pt">Messages <em>&amp; Broadcasts</em></div><button className="btn bg" onClick={()=>setShowBC(!showBC)}>📢 Broadcast</button></div>
    {showBC&&<div className="card" style={{marginBottom:16,borderColor:"rgba(232,160,32,.25)"}}>
      <div style={{fontWeight:700,fontSize:13,textTransform:"uppercase",color:"#e8a020",marginBottom:12}}>📢 Broadcast Message</div>
      <div style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.07)",borderRadius:8,padding:12,marginBottom:12}}>
        <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",color:"#6b82a0",marginBottom:7}}>Target Grad Years (empty = all)</div>

          </div>
        </div>);
      })}
    </div>
  </>);
}

function SessionJournal({logs,isCoach=false}){
  const[selected,setSelected]=useState(null);
  const[filterType,setFilterType]=useState("All");
  const STYPES_DEF={
    "Weight Training":{icon:"🏋️",color:"#e8a020"},
    "Hitting":{icon:"⚾",color:"#e84040"},
    "Throwing":{icon:"🎯",color:"#3a9be8"},
    "Fielding":{icon:"🥎",color:"#27c97a"},
    "Workout":{icon:"✅",color:"#9b59b6"},
    "Game":{icon:"🏟️",color:"#e67e22"},
    "Practice":{icon:"📋",color:"#8e44ad"},
    "Showcase":{icon:"⭐",color:"#f1c40f"},
  };
  const types=["All",...Object.keys(STYPES_DEF)];
  const filtered=filterType==="All"?logs:logs.filter(l=>l.type===filterType);

  const MetricRow=({label,value})=>value?(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"7px 0",borderBottom:"1px solid rgba(255,255,255,.05)"}}>
      <div style={{fontSize:12,color:"#8fa3be"}}>{label}</div>
      <div style={{fontSize:13,fontWeight:700,color:"#eef2f8"}}>{value}</div>
    </div>
  ):null;

  const METRIC_LABELS={
    // Weight Training
    exercises:"Exercises",sets:"Total Sets",topWeight:"Top Weight (lbs)",duration:"Duration (min)",
    // Hitting
    swings:"Total Swings",teeSwings:"Tee Swings",bpSwings:"BP Swings",exitVelo:"Best Exit Velo (mph)",
    // Throwing
    pitches:"Total Throws",bullpenPitches:"Bullpen Pitches",topVelo:"Top Velo (mph)",longTossMax:"Long Toss Max (ft)",
    // Fielding
    groundBalls:"Ground Balls",flyBalls:"Fly Balls",blocking:"Blocking Reps",throws:"Fielding Throws",
    // Workout (program completion)
    program:"Program",week:"Week",
    // Game
    opponent:"Opponent",result:"Result",atBats:"At Bats",hits:"Hits",rbi:"RBI",runs:"Runs Scored",stolenBases:"Stolen Bases",pitchingIP:"Innings Pitched",pitchingK:"Strikeouts",pitchingER:"Earned Runs",
    // Throwing / spin rates
    spinFB:"FB Spin Rate (rpm)",spinCB:"CB Spin Rate (rpm)",spinCH:"CH Spin Rate (rpm)",spinOther:"Other Spin Rate (rpm)",
    // Practice
    focus:"Focus Area",notes_highlights:"Highlights",
    // Showcase
    eventName:"Event Name",location:"Location",sixty:"60-Yard Dash",popTime:"Pop Time",offersReceived:"Offers Received",schoolsPresent:"Schools Present",
  };

  if(selected){
    const def=STYPES_DEF[selected.type]||{icon:"📋",color:"#e8a020"};
    const metrics=selected.metrics||{};
    return(
      <div>
        <button className="bb" onClick={()=>setSelected(null)}>← Journal</button>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
          <div style={{width:44,height:44,borderRadius:10,background:`${def.color}20`,border:`1px solid ${def.color}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>{def.icon}</div>
          <div>
            <div style={{fontSize:18,fontWeight:800,color:def.color}}>{selected.type}</div>
            <div style={{fontSize:11,color:"#6b82a0"}}>{selected.date_label||new Date(selected.created_at).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"})}</div>
          </div>
        </div>
        {Object.keys(metrics).length>0&&<div className="card" style={{marginBottom:12}}>
          <div className="ds">Session Numbers</div>
          {Object.entries(metrics).map(([k,v])=>v?<MetricRow key={k} label={METRIC_LABELS[k]||k} value={v}/>:null)}
        </div>}
        {selected.notes&&<div className="card" style={{borderColor:`${def.color}30`}}>
          <div className="ds">Notes</div>
          <div style={{fontSize:14,lineHeight:1.7,color:"#eef2f8",whiteSpace:"pre-wrap"}}>{selected.notes}</div>
        </div>}
        {!selected.notes&&!Object.values(metrics).some(Boolean)&&<div className="empty"><div className="ei">{def.icon}</div><div className="et">No details recorded</div></div>}
      </div>
    );
  }

  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,flexWrap:"wrap",gap:8}}>
        <div style={{fontSize:14,fontWeight:700}}>{isCoach?"Athlete Session Journal":"My Session Journal"}</div>
        <div style={{fontSize:11,color:"#6b82a0"}}>{filtered.length} session{filtered.length!==1?"s":""}</div>
      </div>
      <div className="fb" style={{marginBottom:14}}>
        {types.map(t=>{
          const def=STYPES_DEF[t];
          return(<button key={t} className={`fc ${filterType===t?"on":""}`} onClick={()=>setFilterType(t)} style={filterType===t&&def?{borderColor:def.color,color:def.color,background:`${def.color}15`}:{}}>{def?def.icon+" ":""}{t}</button>);
        })}
      </div>
      {filtered.length===0&&<div className="empty"><div className="ei">📓</div><div className="et">No sessions yet</div><div className="es">{isCoach?"Athlete hasn't logged any sessions.":"Log a session to start your journal."}</div></div>}
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {filtered.map(log=>{
          const def=STYPES_DEF[log.type]||{icon:"📋",color:"#e8a020"};
          const metrics=log.metrics||{};
          const highlights=Object.entries(metrics).filter(([k,v])=>v).slice(0,3);
          return(
            <div key={log.id} className="card cc" onClick={()=>setSelected(log)} style={{borderLeft:`3px solid ${def.color}`,cursor:"pointer"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:highlights.length||log.notes?8:0}}>
                <div style={{fontSize:22}}>{def.icon}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:14,color:def.color}}>{log.type}</div>
                  <div style={{fontSize:11,color:"#6b82a0"}}>{log.date_label||new Date(log.created_at).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}</div>
                </div>
                <span style={{fontSize:11,color:"#6b82a0"}}>View →</span>
              </div>
              {highlights.length>0&&<div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {highlights.map(([k,v])=>(
                  <div key={k} style={{background:"rgba(255,255,255,.04)",borderRadius:6,padding:"4px 9px"}}>
                    <div style={{fontSize:9,color:"#6b82a0",textTransform:"uppercase",letterSpacing:".3px"}}>{METRIC_LABELS[k]||k}</div>
                    <div style={{fontSize:13,fontWeight:700}}>{v}</div>
                  </div>
                ))}
              </div>}
              {log.notes&&<div style={{marginTop:8,fontSize:12,color:"#8fa3be",fontStyle:"italic",lineHeight:1.5,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>"{log.notes}"</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}



function AthWorkoutList({programs,calcPct,isSaved,setWorkoutView}){
  const[filter,setFilter]=useState("all"); // all | workout | plan | favorite
  const[sort,setSort]=useState("newest"); // newest | oldest | az
  const[favorites,setFavorites]=useState(()=>{try{return JSON.parse(localStorage.getItem("dt_favs")||"[]");}catch(e){return[];}});
  const[expandedId,setExpandedId]=useState(null);

  const toggleFav=(id,e)=>{
    e.stopPropagation();
    setFavorites(prev=>{
      const next=prev.includes(id)?prev.filter(x=>x!==id):[...prev,id];
      try{localStorage.setItem("dt_favs",JSON.stringify(next));}catch(e2){}
      return next;
    });
  };

  const PLAN_TYPES=["plan","team_practice","asp","speed"];
  const isPlan=(p)=>{const pt=p.planType||p.plan_type;return pt&&PLAN_TYPES.includes(pt);};
  
  const sorted=[...programs].sort(function(a,b){
    if(sort==="newest")return new Date(b.created_at||0)-new Date(a.created_at||0);
    if(sort==="oldest")return new Date(a.created_at||0)-new Date(b.created_at||0);
    return(a.name||"").localeCompare(b.name||"");
  });

  const filtered=sorted.filter(function(p){
    if(filter==="workout")return!isPlan(p);
    if(filter==="plan")return isPlan(p);
    if(filter==="favorite")return favorites.includes(p.id);
    return true;
  });

  const plans=filtered.filter(isPlan);
  const workouts=filtered.filter(p=>!isPlan(p));

  if(programs.length===0)return(
    <div className="empty"><div className="ei">🏋️</div><div className="et">No programs yet</div><div className="es">Your coach will assign workouts and practice plans here.</div></div>
  );

  const ProgramCard=({p})=>{
    const pct=calcPct(p);
    const plan=isPlan(p);
    const fav=favorites.includes(p.id);
    const expanded=expandedId===p.id;
    const days=p.days||[];
    const totalEx=days.flatMap(d=>d.exercises||[]).length;
    const doneEx=days.flatMap(d=>d.exercises||[]).filter(ex=>isSaved(p.id,ex.id)).length;
    const accent=plan?"#27c97a":"#e8a020";
    const bg=plan?"rgba(39,201,122,.08)":"rgba(232,160,32,.06)";
    const border=plan?"rgba(39,201,122,.2)":"rgba(232,160,32,.15)";
    return(
      <div style={{marginBottom:8,borderRadius:10,border:"1px solid "+border,background:bg,overflow:"hidden"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",cursor:"pointer"}} onClick={()=>setExpandedId(expanded?null:p.id)}>
          <div style={{width:36,height:36,borderRadius:8,background:accent+"25",border:"1px solid "+border,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>
            {plan?"⚾":"🏋️"}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:700,fontSize:14,color:"#eef2f8",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name||"Untitled"}</div>
            <div style={{fontSize:11,color:"#6b82a0",marginTop:1}}>{p.week}{totalEx>0?" · "+totalEx+" exercises":""}{days.length>0?" · "+days.length+" day"+(days.length!==1?"s":""):""}</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:6,flexShrink:0}}>
            {pct===100&&<span style={{fontSize:10,padding:"2px 7px",borderRadius:6,background:"rgba(39,201,122,.15)",color:"#27c97a",fontWeight:700}}>✓ Done</span>}
            {pct>0&&pct<100&&<span style={{fontSize:10,padding:"2px 7px",borderRadius:6,background:"rgba(232,160,32,.1)",color:"#e8a020",fontWeight:700}}>{pct}%</span>}
            <button onClick={e=>toggleFav(p.id,e)} style={{background:"none",border:"none",cursor:"pointer",fontSize:16,padding:"2px",color:fav?"#e8a020":"#3a4a5e"}}>{fav?"★":"☆"}</button>
            <span style={{color:"#6b82a0",fontSize:12}}>{expanded?"▲":"▼"}</span>
          </div>
        </div>
        {pct>0&&pct<100&&<div style={{height:3,background:"rgba(255,255,255,.06)"}}>
          <div style={{height:"100%",width:pct+"%",background:accent,borderRadius:2,transition:"width .3s"}}/>
        </div>}
        {expanded&&<div style={{padding:"0 14px 12px"}}>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
            {days.filter(d=>(d.exercises||[]).length>0).map(function(d,di){
              const dayDone=(d.exercises||[]).filter(ex=>isSaved(p.id,ex.id)).length;
              const dayTot=(d.exercises||[]).length;
              return(<div key={di} style={{padding:"4px 8px",borderRadius:6,background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)",fontSize:11}}>
                <span style={{color:dayDone===dayTot?"#27c97a":"#8fa3be",fontWeight:600}}>{d.day||"Day "+(di+1)}</span>
                <span style={{color:"#6b82a0",marginLeft:4}}>{dayDone}/{dayTot}</span>
              </div>);
            })}
          </div>
          <div style={{display:"flex",gap:6}}>
            <button className="btn bg bsm" onClick={()=>setWorkoutView(p)} style={{flex:1,background:accent,border:"none"}}>
              {plan?"⚾ Open Plan":"🏋️ Open Workout"}
            </button>
          </div>
        </div>}
      </div>
    );
  };

  return(
    <div>
      {/* Controls */}
      <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
        <div style={{display:"flex",gap:3,flex:1,minWidth:0}}>
          {[["all","All"],["plan","⚾ Plans"],["workout","🏋️ Workouts"],["favorite","★ Saved"]].map(([val,lbl])=>(
            <button key={val} onClick={()=>setFilter(val)} style={{padding:"5px 10px",borderRadius:6,border:"1px solid "+(filter===val?"#e8a020":"rgba(255,255,255,.1)"),background:filter===val?"rgba(232,160,32,.1)":"transparent",color:filter===val?"#e8a020":"#6b82a0",fontSize:11,fontWeight:filter===val?700:400,cursor:"pointer",flexShrink:0}}>{lbl}</button>
          ))}
        </div>
        <select value={sort} onChange={e=>setSort(e.target.value)} style={{padding:"5px 8px",borderRadius:6,background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.1)",color:"#8fa3be",fontSize:11,cursor:"pointer"}}>
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="az">A–Z</option>
        </select>
      </div>

const timeToMins=window.timeToMins||(t=>{if(!t)return 0;const pm=t.endsWith("p")&&!t.startsWith("12");const [h,m]=t.replace(/[ap]/,"").split(":").map(Number);return(pm?h+12:h)*60+(m||0);});

function AthScheduleTab({athlete,facilityTeams,calendarEvents=[],schedule}){
  const SCHED=schedule||{};
  const getDefaultSched=()=>{try{const s=localStorage.getItem("dt_facility_schedule");return s?JSON.parse(s):(DEFAULT_SCHEDULE||{});}catch(e){return SCHED;}}
  const[view,setView]=useState("print"); // week | print

  // Find which teams this athlete belongs to
  const myTeams=(facilityTeams||[]).filter(t=>(t.athleteIds||[]).includes(athlete.id));

  // Collect all schedule slots for this athlete across all their teams
  const getSlots=()=>{
    const slots=[];
    myTeams.forEach(function(team){
      FACILITY_DAYS.forEach(function(day){
        const ds=(getDefaultSched()[day])||{};
        Object.entries(ds).forEach(function([resource,sessions]){
          (sessions||[]).forEach(function(s){
            if((s.assignedTeamIds||[]).includes(team.id)){
              slots.push({...s,day,resource,team});
            }
          });
        });
      });
    });
    return slots;
  };

  const allSlots=getSlots();
  // Deduplicate: group by day+type+start+end → one card per unique session block
  // Collect all resources as footnotes
  const deduped=[];
  allSlots.forEach(function(s){
    // Key = same day, same type (or label), same time window
    const key=s.day+"_"+(s.label||s.type)+"_"+s.start+"_"+s.end;
    const existing=deduped.find(function(d){return d._key===key;});
    if(existing){
      if(!existing.resources.includes(s.resource))existing.resources.push(s.resource);
    } else {
      deduped.push({...s,_key:key,resources:[s.resource]});
    }
  });
  const byDay={};
  deduped.forEach(function(s){if(!byDay[s.day])byDay[s.day]=[];byDay[s.day].push(s);});
  FACILITY_DAYS.forEach(function(d){if(byDay[d])byDay[d].sort(function(a,b){return timeToMins(a.start)-timeToMins(b.start);});});
  const activeDays=FACILITY_DAYS.filter(function(d){return byDay[d]&&byDay[d].length>0;});

  if(myTeams.length===0)return(
    <div className="empty" style={{marginTop:20}}>
      <div className="ei">📅</div>
      <div className="et">No Schedule Yet</div>
      <div className="es">You haven't been assigned to a team yet. Your weekly facility schedule will appear here once your coach adds you.</div>
    </div>
  );

  if(view==="print")return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:12,alignItems:"center"}}>
        <button className="bb" onClick={()=>setView("week")} style={{margin:0}}>← Back</button>
        <button className="btn bg bsm" onClick={()=>window.print()}>🖨️ Print</button>
      </div>
      <div style={{display:"flex",justifyContent:"center",padding:"16px",background:"#e8e0d0",minHeight:"100%"}}>
        <div style={{background:"#f6f1e2",border:"3px solid #000",borderRadius:10,padding:"24px 28px",width:"100%",maxWidth:520,fontFamily:"Georgia,Times New Roman,serif",color:"#000"}}>
          <style>{"@media print{body{background:#e8e0d0;color:#000;}.no-print{display:none!important;}}"}</style>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
            <img src={BRANDING.logos.iconDark} alt="" style={{height:34,width:"auto",flexShrink:0}}/>
            <div>
              <div style={{fontSize:9,fontWeight:700,letterSpacing:1,textTransform:"uppercase"}}>{BRANDING.name}</div>
              <div style={{fontSize:18,fontWeight:900,textTransform:"uppercase"}}>Weekly Schedule</div>
            </div>
          </div>
          <div style={{borderBottom:"2px solid #000",paddingBottom:8,marginBottom:14,fontSize:11,color:"#333"}}>
            {athlete.name}{myTeams.length>0&&" · "+myTeams.map(t=>t.name).join(", ")}
          </div>
          {activeDays.map(function(day){return(
            <div key={day} style={{marginBottom:14,pageBreakInside:"avoid"}}>
              <div style={{fontWeight:900,fontSize:12,textTransform:"uppercase",letterSpacing:.8,background:"#000",color:"#f6f1e2",padding:"4px 10px",borderRadius:"4px 4px 0 0"}}>{day}</div>
              <table style={{width:"100%",borderCollapse:"collapse",border:"1px solid #000",borderTop:"none"}}>
                <tbody>
                  {(byDay[day]||[]).map(function(s,i){
                    const dur=timeToMins(s.end)-timeToMins(s.start);
                    const durStr=dur>=60?Math.floor(dur/60)+"h"+(dur%60?dur%60+"m":""):(dur+"m");
                    return(
                      <tr key={i} style={{borderTop:i>0?"1px solid #ddd":"none",background:i%2===0?"#fff":"#fafaf5"}}>
                        <td style={{padding:"6px 10px",fontWeight:700,fontSize:11,borderRight:"1px solid #ddd",width:90,color:s.team.color||"#000"}}>{s.start}–{s.end}</td>
                        <td style={{padding:"6px 10px",fontWeight:700,fontSize:12}}>{s.label||s.type}<br/><span style={{fontSize:9,color:"#888",fontStyle:"italic"}}>{durStr}{(s.resources||[]).length>1?" · "+(s.resources||[s.resource]).join(", "):s.resource?" · "+s.resource:""}</span></td>
                        <td style={{padding:"6px 10px",fontSize:11,color:"#555"}}>{s.team.name}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          );})}
          <div style={{borderTop:"2px solid #000",marginTop:12,paddingTop:6,display:"flex",justifyContent:"space-between",fontSize:9,color:"#888",fontFamily:"Arial,sans-serif"}}>
            <span>DiamondTrack — RA Academies</span><span>Fall 2026</span>
          </div>
        </div>
      </div>
    </div>
  );

  // Week calendar view
  return(
    <div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14,flexWrap:"wrap",gap:8}}>
        <div>
          <div style={{fontWeight:700,fontSize:16}}>📅 My Schedule</div>
          <div style={{fontSize:11,color:"#6b82a0",marginTop:2}}>Teams: {myTeams.map(t=>t.name).join(", ")}</div>
        </div>
        <button className="btn bbl bsm" onClick={()=>setView("print")}>🖨️ Print Schedule</button>
      </div>

      {activeDays.length===0&&<div className="empty"><div className="ei">📅</div><div className="et">No Sessions This Week</div></div>}

      {/* Calendar grid */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:10,marginBottom:16}}>
        {activeDays.map(function(day){return(
          <div key={day} style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.08)",borderRadius:10,overflow:"hidden"}}>
            <div style={{fontWeight:800,fontSize:11,textTransform:"uppercase",letterSpacing:.6,padding:"7px 12px",background:"rgba(255,255,255,.05)",borderBottom:"1px solid rgba(255,255,255,.07)"}}>{day}</div>
            <div style={{padding:"8px 10px",display:"flex",flexDirection:"column",gap:5}}>
              {(byDay[day]||[]).map(function(s,i){
                const dur=timeToMins(s.end)-timeToMins(s.start);
                const durStr=dur>=60?Math.floor(dur/60)+"h"+(dur%60?dur%60+"m":""):(dur+"m");
                return(
                  <div key={i} style={{padding:"6px 8px",borderRadius:7,background:(s.team.color||"#e8a020")+"18",border:"1px solid "+(s.team.color||"#e8a020")+"35"}}>
                    <div style={{fontWeight:700,fontSize:11,color:s.team.color||"#e8a020"}}>{s.start} – {s.end} <span style={{fontWeight:400,fontSize:9,opacity:.7}}>{durStr}</span></div>
                    <div style={{fontWeight:700,fontSize:13,color:"#eef2f8",marginTop:1}}>{s.label||s.type}</div>
                    {(s.resources||[s.resource]).length>0&&<div style={{fontSize:9,color:"#6b82a0",marginTop:2}}>📍 {(s.resources||[s.resource]).join(" · ")}</div>}
                  </div>
                );
              })}
            </div>
          </div>
        );})}
      </div>

      {/* Empty days */}
      <div style={{fontSize:11,color:"#6b82a0",marginTop:4}}>
        {FACILITY_DAYS.filter(d=>!byDay[d]||!byDay[d].length).map(d=>d).join(", ")} — no sessions
      </div>
    </div>
  );
}
